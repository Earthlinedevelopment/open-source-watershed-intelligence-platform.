name: Mantra 46 16791 Audit Semantics A-B

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/mantra46-16791-audit-semantics-ab.mjs'
      - '.github/workflows/earthline-m46-16791-audit-semantics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run corrected audit semantics A-B
        run: node tests/mantra46-16791-audit-semantics-ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16791-audit-semantics
          path: artifacts/mantra46-16791-audit-semantics/
          if-no-files-found: warn
