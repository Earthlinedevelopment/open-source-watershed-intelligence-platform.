name: Mantra 46 Source Extract

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/mantra46-source-extract.mjs'
      - '.github/workflows/earthline-m46-source-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract live makeSwales source
        run: node tests/mantra46-source-extract.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-source-extract
          path: artifacts/mantra46-source/
          if-no-files-found: error
