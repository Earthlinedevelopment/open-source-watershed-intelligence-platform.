name: Earthline Apply 16789 Same-Parent Spread

on:
  push:
    branches: [pages-live]
    paths:
      - 'tools/mantra46-apply-16789-selection.py'
      - '.github/workflows/earthline-m46-apply-16789.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-16789:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 16789 same-parent final spread
        run: python tools/mantra46-apply-16789-selection.py
      - name: Verify exact product scope
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
          grep -q "EARTHLINE 16789 — SAME-PARENT COUNT-NEUTRAL FINAL SPREAD" index.html
          grep -q "p16783.parent!==add16783.point.parent" index.html
          grep -q "EARTHLINE 16788 — PRIORITIZED EFFICIENT TERRAIN-GAP RECOVERY" index.html
      - name: Commit product candidate
        run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "repair: deploy 16789 same-parent final spread"
          git push origin HEAD:pages-live
