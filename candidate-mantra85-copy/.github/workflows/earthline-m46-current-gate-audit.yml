name: Mantra 46 Current Candidate Gate Audit

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-m46-current-gate-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run per-cell candidate gate audit
        run: node tests/mantra46-16786-gate-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-current-gate-audit
          path: artifacts/mantra46-16786/
          if-no-files-found: warn
