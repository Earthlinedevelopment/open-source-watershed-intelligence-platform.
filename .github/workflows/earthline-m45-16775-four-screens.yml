name: Earthline 16775 Four-State Live Screenshots
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-m45-16775-four-screens.yml']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture four live states
        shell: bash
        run: |
          mkdir -p lab/mantra45-16775-screens
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const states=['oklahoma','iowa','arkansas','nebraska'];
          const browser=await chromium.launch({headless:true});
          for(const state of states){
            const page=await browser.newPage({viewport:{width:1800,height:832},deviceScaleFactor:1});
            await page.goto('https://earthlinedevelopment.org/?screen16775='+state+'-'+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#searchInput',{timeout:30000});
            await page.evaluate(q=>{
              const i=document.getElementById('searchInput'),b=document.getElementById('runBtn');
              i.value=q+' state';i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));b.click();
            },state);
            await page.waitForFunction(()=>{
              const s=window.EARTHLINE_SPATIAL_COVERAGE_SELECTION_16736,p=window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167,d=window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020;
              return s?.build==='EARTHLINE 16775'&&Number(p?.generated||0)>0&&Number(p?.generated||0)===Number(d?.swaleLines||0);
            },null,{timeout:70000,polling:100});
            await page.waitForTimeout(750);
            await page.screenshot({path:'lab/mantra45-16775-screens/'+state+'.png',fullPage:false});
            await page.close();
          }
          await browser.close();
          JS
      - name: Persist screenshots
        shell: bash
        run: |
          git config user.name "Earthline Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add lab/mantra45-16775-screens
          git commit -m "diag: persist 16775 four-state live screenshots [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
