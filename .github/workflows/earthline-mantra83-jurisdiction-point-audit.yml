name: Mantra 83 Jurisdiction Point Audit
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/earthline-mantra83-jurisdiction-point-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin pages-live
      - run: |
          git show origin/pages-live:index.html > /tmp/live-index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/live-index.html').read_text()
          for term in ['function earthlinePointInJurisdiction16539','function earthlinePrepareJurisdiction16539','earthlinePointInJurisdiction16539=','earthlinePrepareJurisdiction16539=']:
              at=s.find(term)
              print('TERM',term,'AT',at)
              if at>=0: print(s[max(0,at-2200):min(len(s),at+9000)])
          PY
