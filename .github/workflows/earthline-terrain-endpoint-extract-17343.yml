name: Earthline Terrain Endpoint Extract 17343
on:
  push:
    branches: [repair/browser-performance-live-17268]
    paths:
      - 'tests/extract-terrarium-endpoints-17343.py'
      - '.github/workflows/earthline-terrain-endpoint-extract-17343.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/browser-performance-live-17268}
      - run: python3 tests/extract-terrarium-endpoints-17343.py
      - uses: actions/upload-artifact@v4
        with:
          name: terrarium-endpoints-17343
          path: terrarium-endpoints-17343.txt
