name: Mantra 51 Swales Sync Owner Audit
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - '.github/workflows/mantra51-swales-sync-owner-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='ignore')
          i=s.find('function syncSwalesPage')
          print('POS',i)
          print(s[i:i+6500].replace('\n',' '))
          PY
