name: Mantra 83 Shared Yield Chrome
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - 'tests/mantra83-shared-yield-chrome.mjs'
      - '.github/workflows/earthline-mantra83-shared-yield-chrome.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright
      - run: node tests/mantra83-shared-yield-chrome.mjs
