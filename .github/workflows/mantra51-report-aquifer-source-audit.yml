name: Mantra 51 Report Aquifer Source Audit
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - '.github/workflows/mantra51-report-aquifer-source-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='ignore')
          terms=['usgsAquifers','aquifer-fill','aquifer-line','AQUIFER EVIDENCE','aquiferEvidence','fractured bedrock','mapped aquifer','groundwater']
          for term in terms:
              print('\n###',term)
              st=0
              count=0
              while True:
                  i=s.find(term,st)
                  if i<0 or count>=12: break
                  print('POS',i)
                  print(s[max(0,i-1200):i+3200].replace('\n',' '))
                  st=i+len(term);count+=1
          PY
