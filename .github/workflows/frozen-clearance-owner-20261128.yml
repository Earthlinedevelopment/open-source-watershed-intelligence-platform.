name: Earthline run-scoped frozen clearance safety
on:
  push:
    branches: [repair/run-scoped-clearance-20261128, pages-live]
    paths:
      - index.html
      - tests/frozen-clearance-owner-20261128.mjs
      - .github/workflows/frozen-clearance-owner-20261128.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  frozen-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Apply portable source-owner repair on isolated branch only
        if: github.ref_name == 'repair/run-scoped-clearance-20261128'
        run: python3 tools/repair-frozen-clearance-owner-20261128.py
      - name: Verify canonical frozen science, fail-closed safety and retained Vermont source behavior
        run: node tests/frozen-clearance-owner-20261128.mjs
      - name: Commit verified fix to isolated branch only
        if: github.ref_name == 'repair/run-scoped-clearance-20261128'
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name 'Earthline Recovery Test'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'fix(property): use frozen Property evidence instead of camera-dependent water filters'
            git push origin HEAD:repair/run-scoped-clearance-20261128
          fi
