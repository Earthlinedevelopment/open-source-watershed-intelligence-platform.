name: Earthline Terrain Integrity 17293
on:
  push:
    branches: [repair/browser-terrain-integrity-17293]
    paths:
      - 'tests/apply-terrain-integrity-17293.py'
      - '.github/workflows/earthline-browser-terrain-integrity-17293.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit-repeat:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/browser-terrain-integrity-17293
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply candidate
        run: |
          python3 tests/apply-exact-jurisdiction-fast-screen-17270.py
          python3 tests/apply-consolidated-jurisdiction-screen-17262.py
          python3 tests/apply-crosscall-jurisdiction-cache-17272.py
          python3 tests/apply-grid-point-cache-17274.py
          python3 tests/apply-terrain-hedge-17275.py
          python3 tests/apply-percentile-cache-17279.py
          python3 tests/apply-dem-sampling-17280.py
          python3 tests/apply-hydrology-core-17278.py
          python3 tests/apply-densify-fastpath-17285.py
          python3 tests/apply-land-ring-index-17289.py
          python3 tests/apply-time-budget-yield-17292.py
          python3 tests/apply-terrain-integrity-17293.py
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Repeat Texas and Vermont
        run: env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='webkit' HEADLESS='true' WAIT_MS='120000' STATES='Texas|Vermont|Texas|Vermont' node tests/mantra46-16791-50state-production.mjs
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/browser-terrain-integrity-17293
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply candidate
        run: |
          python3 tests/apply-exact-jurisdiction-fast-screen-17270.py
          python3 tests/apply-consolidated-jurisdiction-screen-17262.py
          python3 tests/apply-crosscall-jurisdiction-cache-17272.py
          python3 tests/apply-grid-point-cache-17274.py
          python3 tests/apply-terrain-hedge-17275.py
          python3 tests/apply-percentile-cache-17279.py
          python3 tests/apply-dem-sampling-17280.py
          python3 tests/apply-hydrology-core-17278.py
          python3 tests/apply-densify-fastpath-17285.py
          python3 tests/apply-land-ring-index-17289.py
          python3 tests/apply-time-budget-yield-17292.py
          python3 tests/apply-terrain-integrity-17293.py
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps firefox
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run Texas and Vermont
        run: xvfb-run -a env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='firefox' HEADLESS='false' WAIT_MS='120000' STATES='Texas|Vermont' node tests/mantra46-16791-50state-production.mjs
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/browser-terrain-integrity-17293
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply candidate
        run: |
          python3 tests/apply-exact-jurisdiction-fast-screen-17270.py
          python3 tests/apply-consolidated-jurisdiction-screen-17262.py
          python3 tests/apply-crosscall-jurisdiction-cache-17272.py
          python3 tests/apply-grid-point-cache-17274.py
          python3 tests/apply-terrain-hedge-17275.py
          python3 tests/apply-percentile-cache-17279.py
          python3 tests/apply-dem-sampling-17280.py
          python3 tests/apply-hydrology-core-17278.py
          python3 tests/apply-densify-fastpath-17285.py
          python3 tests/apply-land-ring-index-17289.py
          python3 tests/apply-time-budget-yield-17292.py
          python3 tests/apply-terrain-integrity-17293.py
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run Texas and Vermont
        run: env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='chromium' HEADLESS='true' WAIT_MS='120000' STATES='Texas|Vermont' node tests/mantra46-16791-50state-production.mjs
