name: Earthline Property Button Listener Audit
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-property-button-listener-audit.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 0
      - name: Audit all live Property button owners
        run: |
          git show origin/pages-live:index.html > /tmp/live-index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/live-index.html').read_text(encoding='utf-8').splitlines()
          terms=['earthlineDeclareProperty16169','earthlineMarkExplicitAnalysisIntent16325','earthlineGovernedPropertyRun16202']
          for term in terms:
              print('\n===== '+term+' =====')
              for i,line in enumerate(s):
                  if term in line:
                      print(f'--- HIT {i+1} ---')
                      for n in range(max(0,i-8),min(len(s),i+18)): print(f'{n+1}: {s[n]}')
          PY