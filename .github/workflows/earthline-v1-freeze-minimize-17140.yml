name: Earthline V1 Freeze Minimize 17140
on:
  push:
    branches: [stabilize/v1-freeze-17064-search]
    paths:
      - '.github/workflows/earthline-v1-freeze-minimize-17140.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/v1-freeze-17064-search
          fetch-depth: 0
      - run: |
          python3 .github/scripts/earthline-v1-freeze-minimize-17140.py
          git diff --check
      - run: |
          rm -f .github/workflows/earthline-v1-freeze-minimize-17140.yml
          rm -f .github/scripts/earthline-v1-freeze-minimize-17140.py
          git config user.name "earthline-release-bot"
          git config user.email "earthline-release-bot@users.noreply.github.com"
          git add index.html .github/workflows/earthline-v1-freeze-minimize-17140.yml .github/scripts/earthline-v1-freeze-minimize-17140.py
          git commit -m "candidate: minimize V1 freeze to search stability 17140"
          git push origin HEAD:stabilize/v1-freeze-17064-search
