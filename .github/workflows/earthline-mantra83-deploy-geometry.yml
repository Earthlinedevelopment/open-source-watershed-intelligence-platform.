name: Mantra 83 Deploy Geometry Correction
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/earthline-mantra83-deploy-geometry.yml'
      - 'tests/mantra83-fix-regional-geometry.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mantra83-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra83-shadow-live
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          cp tests/mantra83-fix-regional-geometry.mjs /tmp/fix-geometry.mjs
          cp tests/mantra83-fix-regional-four-percent.mjs /tmp/fix-slope.mjs
          cp tests/mantra83-fix-jsonp-late-callback.mjs /tmp/fix-jsonp.mjs
          git fetch origin pages-live
          git checkout -B pages-live origin/pages-live
          node /tmp/fix-slope.mjs
          node /tmp/fix-geometry.mjs
          node /tmp/fix-jsonp.mjs
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');if(!s.includes('const segment=raw;if(segment.length<10)return null;'))process.exit(2);if(!s.includes('minSlope=0,maxSlope=4'))process.exit(3);if(!s.includes('if(focusMode||preferredEligibleCount16539<36){'))process.exit(4);"
          git config user.name "earthline-ci"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "science: shorten and correct Regional swale geometry eligibility"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
