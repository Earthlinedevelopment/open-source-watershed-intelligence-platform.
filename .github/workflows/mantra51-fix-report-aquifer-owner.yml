name: Mantra 51 Fix Report Aquifer Owner
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - 'scripts/fix_report_map_truth_and_hierarchy_16937.py'
      - '.github/workflows/mantra51-fix-report-aquifer-owner.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 scripts/fix_report_map_truth_and_hierarchy_16937.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          s=Path('index.html').read_text(errors='ignore')
          assert 'EARTHLINE_ACCEPTED_REGIONAL_AQUIFER_GEOJSON_16373' in s
          assert "getSource?.('el-live-aquifer-15970')" in s
          assert 'AQUIFER CONTEXT' in s
          assert 'rgba(58,142,199,.18)' in s
          assert "mainW=r.grade==='A'?2.15" in s
          class P(HTMLParser):
              def __init__(self): super().__init__();self.ins=False;self.buf=[];self.scripts=[]
              def handle_starttag(self,t,a):
                  if t.lower()=='script': self.ins=True;self.buf=[]
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.ins:self.scripts.append(''.join(self.buf));self.ins=False
              def handle_data(self,d):
                  if self.ins:self.buf.append(d)
          p=P();p.feed(s);out=Path('/tmp/el-js');out.mkdir(exist_ok=True)
          for i,j in enumerate(p.scripts):(out/f'{i:03}.js').write_text(j)
          PY
          for f in /tmp/el-js/*.js; do node --check "$f" >/dev/null; done
          git add index.html
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git commit -m "fix: connect report aquifers to authoritative geometry"
          git push
