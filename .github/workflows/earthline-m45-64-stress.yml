name: Earthline Mantra45 64x64 Coverage Stress
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-m45-64-stress.yml']
permissions:
  contents: write
jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          git fetch origin pages-live
          mkdir -p /tmp/e64
          git show origin/pages-live:index.html > /tmp/base.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/base.html').read_text()
          old="loadDEM(tile16731.b,96,96,8000,'coverage-gap refinement '+tile16731.id)"
          assert s.count(old)==1, s.count(old)
          new="loadDEM(tile16731.b,64,64,8000,'coverage-gap refinement '+tile16731.id)"
          Path('/tmp/e64/index.html').write_text(s.replace(old,new))
          PY
          python3 -m http.server 8787 --bind 127.0.0.1 --directory /tmp/e64 >/tmp/e64.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/e64.log; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Stress difficult states
        shell: bash
        run: |
          mkdir -p lab
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true});
          const states=['Vermont','Maryland','California','Florida','Louisiana','Colorado','Oklahoma','New York','Texas','Alaska','Hawaii'];
          async function run(state){
            const page=await browser.newPage({viewport:{width:1800,height:1000}});
            let error=null,timedOut=false;
            try{
              await page.goto('http://127.0.0.1:8787/index.html?m4564='+encodeURIComponent(state)+'-'+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForSelector('#searchInput',{timeout:30000});
              await page.evaluate((q)=>{
                window.EARTHLINE_REGIONAL_COVERAGE_AUDIT_16731=null;
                const i=document.getElementById('searchInput'),b=document.getElementById('runBtn');
                i.value=q+' state';i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));b.click();
              },state);
              await page.waitForFunction(()=>{
                const p=window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167,d=window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020;
                return Number(p?.generated||0)>0&&Number(p?.generated||0)===Number(d?.swaleLines||0);
              },null,{timeout:75000,polling:100});
              await page.waitForTimeout(250);
            }catch(e){timedOut=true;error=String(e&&e.message||e);}
            const snap=await page.evaluate(()=>{
              const perf=window.EARTHLINE_REGIONAL_PERFORMANCE_16191||{};
              const pub=window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167||{};
              const d=window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020||{};
              const flow=window.EARTHLINE_LAND_VALIDITY_FLOW_AUDIT_16584||{};
              const land=window.EARTHLINE_LAND_VALIDITY_16584||{};
              const gap=window.EARTHLINE_COVERAGE_GAP_REFINEMENT_16731||{};
              const late=window.EARTHLINE_LATE_GAP_REFINEMENT_16741||{};
              const contain=window.EARTHLINE_REGIONAL_JURISDICTION_AUDIT_16539||window.EARTHLINE_VERMONT_PRODUCT_BOUNDARY_AUDIT_16178||null;
              return {
                totalMs:Number(perf.totalMs||NaN),phaseTotalsMs:perf.phaseTotalsMs||null,
                generated:Number(pub.generated||0),visible:Number(d.swaleLines||0),
                unsafe:Number(flow.unsafeSegments??NaN),waterReady:Array.isArray(land.waterParts),
                coveragePassed:window.EARTHLINE_REGIONAL_COVERAGE_AUDIT_16731?.passed===true,
                unresolved:Number(window.EARTHLINE_REGIONAL_COVERAGE_AUDIT_16731?.unresolved?.length||0),
                gapTiles:Number(gap.selected?.length||0),gapMs:Number(gap.elapsedMs||0),gapAdded:Number(gap.added||0),
                lateTiles:Number(late.selected?.length||0),lateMs:Number(late.elapsedMs||0),
                containment:contain
              };
            }).catch(()=>({}));
            await page.close();
            const failures=[];
            if(error)failures.push('error');
            if(!(Number.isFinite(snap.totalMs)&&snap.totalMs<=15000))failures.push('core '+snap.totalMs);
            if(!(snap.generated>0&&snap.generated===snap.visible))failures.push('generated-visible');
            if(snap.unsafe!==0)failures.push('unsafe '+snap.unsafe);
            if(!snap.waterReady)failures.push('water-sidecar');
            if(!snap.coveragePassed||snap.unresolved!==0)failures.push('coverage');
            return {state,timedOut,error,...snap,failures,pass:failures.length===0};
          }
          const rows=[];for(const state of states)rows.push(await run(state));
          await browser.close();
          const out={at:new Date().toISOString(),rows,failed:rows.filter(r=>!r.pass).map(r=>({state:r.state,failures:r.failures})),pass:rows.every(r=>r.pass)};
          fs.writeFileSync('lab/mantra45-64-stress.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(rows.map(r=>({state:r.state,totalMs:r.totalMs,gapTiles:r.gapTiles,gapMs:r.gapMs,lateTiles:r.lateTiles,generated:r.generated,visible:r.visible,unsafe:r.unsafe,pass:r.pass,failures:r.failures}))));
          if(!out.pass)process.exitCode=2;
          JS
      - name: Persist evidence
        if: always()
        shell: bash
        run: |
          git config user.name "Earthline Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add lab/mantra45-64-stress.json
          git commit -m "diag: persist Mantra45 64x64 stress evidence [skip ci]" || true
          git pull --rebase origin main
          git push origin HEAD:main
