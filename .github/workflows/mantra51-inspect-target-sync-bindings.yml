name: Mantra 51 Inspect Target Sync Bindings
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-inspect-target-sync-bindings.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: mantra51-global-repair-campaign}
      - name: Print all target sync bindings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needle="syncPropertyTargetFromMap16201"
          pos=0;n=0
          while True:
            i=s.find(needle,pos)
            if i<0: break
            n+=1
            print(f"\n===== HIT {n} @ {i} =====\n")
            print(s[max(0,i-4500):min(len(s),i+9000)])
            pos=i+len(needle)
          print("\nTOTAL",n)
          PY
