name: Earthline clean technical report 16979
on:
  push:
    branches:
      - pages-live
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Simplify technical report map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          a=s.index("function mapSvg(d,small=false){")
          b=s.index("  return parts.join('');\n}",a)+len("  return parts.join('');\n}")
          fn=s[a:b]
          if 'el-report-technical-plan-16978' not in fn:
              raise SystemExit("16978 renderer marker missing")
          fn=fn.replace('el-report-technical-plan-16978','el-report-technical-plan-16979',1)

          fn,n=re.subn(r"const principal=flowRank\.slice\([^;]+;", "const principal=flowRank.slice(0,Math.min(3,flowRank.length));", fn, count=1)
          if n!=1: raise SystemExit("principal line missing")

          fn,n=re.subn(r"for\(let i=0;i<reportContours\.length;i\+=7\)\{[^\n]+\}",
                       "for(let i=0;i<reportContours.length;i+=18){const dp=path(reportContours[i]);if(dp)parts.push('<path d=\"'+dp+'\" fill=\"none\" stroke=\"#b9b5ad\" stroke-width=\".48\" opacity=\".18\" vector-effect=\"non-scaling-stroke\"/>')}",
                       fn,count=1)
          if n!=1: raise SystemExit("contour line missing")

          aq_start=fn.index("  for(const f of aquiferFeatures){")
          aq_end=fn.index("  let fi=0;",aq_start)
          aq='''  for(const f of aquiferFeatures){\n    const g=f&&f.geometry;if(!g)continue;\n    const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];\n    for(const poly of polys){\n      const rings=poly.filter(r=>Array.isArray(r)&&r.length>=3);if(!rings.length)continue;\n      const dp=rings.map(r=>pathCoords(r)+' Z').join(' ');\n      parts.push('<path d="'+dp+'" fill="#d78a44" fill-opacity=".075" fill-rule="evenodd" stroke="#bd7336" stroke-width=".42" stroke-opacity=".28" vector-effect="non-scaling-stroke"/>');\n    }\n  }\n\n'''
          fn=fn[:aq_start]+aq+fn[aq_end:]

          fn=fn.replace('stroke="#cfe8ee" stroke-width="3.2" opacity=".72"','stroke="#dcecf0" stroke-width="2.4" opacity=".72"')
          fn=fn.replace('stroke="#176f90" stroke-width="1.45" opacity=".96"','stroke="#287b97" stroke-width="1.15" opacity=".94"')

          fn,n=re.subn(r"/\* C opportunities omitted from the report overview for readability\. \*/\n\s*for\(const r of rows\.filter\(r=>r\.grade==='B'\)\.slice\(0,12\)\)draw\(r\);\n\s*for\(const r of rows\.filter\(r=>r\.grade==='A'\)\.slice\(0,18\)\)draw\(r\);",
                       "/* Overview shows only the highest-priority swales. */\n  for(const r of rows.filter(r=>r.grade==='A').slice(0,6))draw(r);",
                       fn,count=1)
          if n!=1: raise SystemExit("overview filter block missing")

          fn=fn.replace('stroke="#315f3d" stroke-width="3.15" opacity=".82"','stroke="#315f3d" stroke-width="2.55" opacity=".86"')
          fn=fn.replace('stroke="#78a567" stroke-width="2.05" opacity=".90"','stroke="#79a86d" stroke-width="1.55" opacity=".94"')
          fn=fn.replace('stroke="#176f90" stroke-width=".78" opacity=".96"','stroke="#2a7890" stroke-width=".52" opacity=".92"')
          fn=fn.replace('r="9.4"','r="7.5"',1)
          fn=fn.replace('font-size="6.6"','font-size="5.8"',1)

          lg_start=fn.index("  if(!small){")
          lg_end=fn.index("  parts.push('</svg>');",lg_start)
          legend='''  if(!small){\n    const lx=mapX+16,ly=mapY+16;\n    parts.push('<g transform="translate('+lx+','+ly+')"><rect width="188" height="69" rx="5" fill="#fffef9" fill-opacity=".94" stroke="#c5c0b5" stroke-width=".55"/><text x="12" y="17" fill="#233b34" font-family="Noto Sans,Arial,sans-serif" font-size="7.3" font-weight="850" letter-spacing=".7">ENGINE OUTPUT</text><path d="M12 25 H176" stroke="#64a6bd" stroke-width=".8"/><path d="M13 39 H37" stroke="#315f3d" stroke-width="2.5"/><path d="M13 39 H37" stroke="#79a86d" stroke-width="1.5"/><text x="45" y="42" fill="#4b5c54" font-family="Noto Sans,Arial,sans-serif" font-size="5.8">Priority bioswale</text><path d="M103 39 H127" stroke="#287b97" stroke-width="1.2"/><text x="135" y="42" fill="#4b5c54" font-family="Noto Sans,Arial,sans-serif" font-size="5.8">Water path</text><rect x="13" y="51" width="22" height="7" fill="#d78a44" fill-opacity=".16" stroke="#bd7336" stroke-width=".45"/><text x="45" y="57" fill="#4b5c54" font-family="Noto Sans,Arial,sans-serif" font-size="5.8">Mapped aquifer context</text></g>');\n  }\n'''
          fn=fn[:lg_start]+legend+fn[lg_end:]

          out=s[:a]+fn+s[b:]
          if 'el-report-technical-plan-16979' not in out: raise SystemExit("16979 marker missing")
          p.write_text(out,encoding="utf-8")
          PY
          git config user.name "Earthline Build Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "style: clean explanatory technical report map 16979"
          git push origin HEAD:pages-live
