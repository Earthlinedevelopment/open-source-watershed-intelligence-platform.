name: Earthline Texas Product Phase Source
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/trace-product-phase.py'
      - '.github/workflows/earthline-product-phase-trace.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tests/trace-product-phase.py
