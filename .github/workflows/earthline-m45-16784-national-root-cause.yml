name: Earthline 16784 National Root-Cause Audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-m45-16784-national-root-cause.yml']
permissions:
  contents: write
jobs:
  audit:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - batch: b1
            states: "Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia"
          - batch: b2
            states: "Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland"
          - batch: b3
            states: "Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey"
          - batch: b4
            states: "New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina"
          - batch: b5
            states: "South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Audit live batch
        shell: bash
        run: |
          set +e
          EARTHLINE_URL='https://earthlinedevelopment.org/' STATES='${{ matrix.states }}' OUT='rootcause-${{ matrix.batch }}.json' node lab/validate-16784-root-cause.mjs
          echo "$?" > "rootcause-${{ matrix.batch }}.exit"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: "rootcause-16784-${{ matrix.batch }}"
          path: |
            rootcause-${{ matrix.batch }}.json
            rootcause-${{ matrix.batch }}.exit
          if-no-files-found: error
  aggregate:
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: rootcause-16784-*
          path: /tmp/rootcause16784
          merge-multiple: true
      - name: Aggregate national diagnosis
        shell: bash
        run: |
          mkdir -p lab
          python3 - <<'PY'
          import json,glob,datetime,os,collections
          rows=[]; exits={}
          for p in sorted(glob.glob('/tmp/rootcause16784/rootcause-*.json')):
              with open(p) as f:o=json.load(f)
              rows.extend(o.get('rows',[]))
              batch=os.path.basename(p).replace('rootcause-','').replace('.json','')
              ep=p.replace('.json','.exit')
              exits[batch]=open(ep).read().strip() if os.path.exists(ep) else 'missing'
          stage=collections.Counter((r.get('firstFailedStage') or 'none') for r in rows)
          machine_fail=[{'state':r.get('state'),'failures':r.get('machineFailures',[])} for r in rows if not r.get('machinePass')]
          by_stage={}
          for r in rows:
              by_stage.setdefault(r.get('firstFailedStage') or 'none',[]).append(r.get('state'))
          out={
            'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'liveAuditBuild':'EARTHLINE 16784',
            'pagesLiveCommit':'5202c67fa9436a88b7f4f1963640d14af515ac8b',
            'count':len(rows),
            'machinePassed':sum(1 for r in rows if r.get('machinePass')),
            'machineFailed':machine_fail,
            'auditPassed':sum(1 for r in rows if r.get('auditPass') is True),
            'firstFailedStageCounts':dict(stage),
            'statesByFirstFailedStage':by_stage,
            'batchExits':exits,
            'rows':rows
          }
          with open('lab/mantra45-16784-national-root-cause.json','w') as f:json.dump(out,f,indent=2)
          print(json.dumps({k:out[k] for k in ['count','machinePassed','machineFailed','auditPassed','firstFailedStageCounts','statesByFirstFailedStage','batchExits']}))
          PY
      - name: Persist national diagnosis
        shell: bash
        run: |
          git config user.name "Earthline Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add lab/mantra45-16784-national-root-cause.json
          git commit -m "audit: persist 16784 national root-cause diagnosis [skip ci]" || true
          git pull --rebase origin main
          git push origin HEAD:main
