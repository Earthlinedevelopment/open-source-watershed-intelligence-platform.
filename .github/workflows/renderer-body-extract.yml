name: Mantra 83 Renderer Body Extract
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/renderer-body-extract.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: sed -n '35135,35230p' index.html
