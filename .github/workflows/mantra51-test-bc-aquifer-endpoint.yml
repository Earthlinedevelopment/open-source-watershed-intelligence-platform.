name: Mantra 51 Test BC Aquifer Endpoint
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths: ['.github/workflows/mantra51-test-bc-aquifer-endpoint.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Query BC Ground Water Aquifers for Vancouver Island bbox
        run: |
          set -euxo pipefail
          URL='https://delivery.maps.gov.bc.ca/arcgis/rest/services/whse/bcgw_pub_whse_water_management/MapServer/48/query?where=1%3D1&geometry=-128.4320374%2C48.3078651%2C-123.2653903%2C50.8787003&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=AQUIFER_ID%2CNAME%2CMATERIAL%2CSUBTYPE%2CVULNERABILITY%2CMAPPING_YEAR%2CAQUIFER_DETAILS_URL&returnGeometry=true&outSR=4326&f=geojson'
          curl -L --fail --retry 2 --connect-timeout 20 "$URL" -o /tmp/aquifers.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/aquifers.json'))
          fs=j.get('features') or []
          print('features',len(fs))
          print('types',sorted(set((f.get('geometry') or {}).get('type') for f in fs)))
          print('sample',[(f.get('properties') or {}).get('AQUIFER_ID') for f in fs[:10]])
          if not fs: raise SystemExit('no aquifers returned')
          PY
