name: Mantra 83 Zero Task Yield Candidate
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - 'tests/mantra83-zero-task-yield.mjs'
      - '.github/workflows/earthline-mantra83-zero-task-yield.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        client: [desktop-chromium, desktop-webkit, iphone-webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLIENT: ${{ matrix.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/mantra83-zero-task-yield.mjs
