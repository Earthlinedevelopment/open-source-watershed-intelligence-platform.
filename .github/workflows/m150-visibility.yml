name: M150 real short-corridor SVG visibility verification
on:
  push:
    branches: ['candidate/m150-short-regional-corridor-visibility']
    paths: ['.github/workflows/m150-visibility.yml']
permissions:
  contents: write
jobs:
  compare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare unchanged baseline and isolated candidate
        run: |
          cp index.html index.baseline.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          old="const pts=points(f.geometry.coordinates),len=polyLength(pts);if(pts.length<3||len<22)continue;"
          new="const pts=points(f.geometry.coordinates),len=polyLength(pts);if(pts.length<2||len<.35)continue;"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          print('M142_CANDIDATE_SPACING_PRESELECTION_ONLY',len(s))
          PY
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run identical regional searches against baseline and candidate
        run: |
          cat > /tmp/m142.mjs <<'JS'
          import { chromium } from 'playwright';
          import { existsSync, readFileSync, statSync } from 'node:fs';
          import path from 'node:path';
          const browser=await chromium.launch({headless:true});
          const outputs=[];
          for(const html of ['index.baseline.html','index.html']){
            for(const term of ['Iowa','Arkansas','Texas','Vermont']){
              const page=await browser.newPage({viewport:{width:1600,height:950}});
              const errors=[];page.on('pageerror',err=>errors.push(String(err).slice(0,160)));
              await page.route('**/*',async route=>{
                const url=new URL(route.request().url());
                if(url.origin!=='https://earthlinedevelopment.org')return route.continue();
                let rel=decodeURIComponent(url.pathname).replace(/^\/+/, '')||'index.html';
                if(rel==='index.html')rel=html;
                const root=process.cwd(),p=path.resolve(root,rel);
                if(!p.startsWith(root+path.sep)||!existsSync(p)||!statSync(p).isFile())return route.abort();
                const ext=path.extname(p).toLowerCase();
                const mime={'.html':'text/html; charset=utf-8','.js':'application/javascript','.mjs':'application/javascript','.json':'application/json','.css':'text/css','.geojson':'application/geo+json','.png':'image/png','.webp':'image/webp'};
                return route.fulfill({status:200,contentType:mime[ext]||'application/octet-stream',body:readFileSync(p)});
              });
              try {
                await page.goto('https://earthlinedevelopment.org/?m142='+encodeURIComponent(html+term),{waitUntil:'domcontentloaded',timeout:60000});
                await page.locator('#searchInput').fill(term);
                const suggestion=page.locator('#earthlineSearchSuggestions15970 button[data-query]').first();
                await suggestion.click({timeout:18000});
                await page.waitForTimeout(700);
                if(!(await page.evaluate(()=>!!window.EARTHLINE_LAST_LIVE_REGIONAL_RUN_15970)))await page.locator('#runBtn').evaluate(el=>el.click());
                await page.waitForFunction(()=>!!window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167||!!window.EARTHLINE_LAST_LIVE_REGIONAL_ERROR_15970,null,{timeout:75000,polling:300});
                await page.waitForTimeout(1200);
                const a=await page.evaluate(()=>({
                  p:window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167||null,
                  g:window.EARTHLINE_SWALE_GENERATION_AUDIT_16167||null,
                  o:window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||null,
                  error:window.EARTHLINE_LAST_LIVE_REGIONAL_ERROR_15970||null
                }));
                const rec={mode:html,place:term,generated:a.p?.generated??null,selected:a.g?.chosenBeforeTierGate??null,overlayLines:a.p?.overlaySwaleLines??null,overlayLabels:a.p?.overlayLocationPills??null,reason:a.g?.reason||null,error:a.error?.error||null,errors};
                outputs.push(rec);
                console.log('M142_REGION '+JSON.stringify(rec));
              }catch(e){const rec={mode:html,place:term,error:String(e),errors};outputs.push(rec);console.log('M142_REGION '+JSON.stringify(rec));}
              finally{await page.close();}
            }
          }
          await browser.close();
          const comparisons=['Iowa','Arkansas','Texas','Vermont'].map(place=>({place,baseline:outputs.find(x=>x.place===place&&x.mode==='index.baseline.html'),candidate:outputs.find(x=>x.place===place&&x.mode==='index.html')}));
          console.log('M142_COMPARISON '+JSON.stringify(comparisons));
          const pass=comparisons.every(x=>!x.candidate.error&&x.candidate.generated===x.baseline.generated&&x.candidate.overlayLines===x.candidate.generated&&x.candidate.overlayLabels>0)&&comparisons.some(x=>x.candidate.overlayLines>x.baseline.overlayLines);
          console.log('M142_PASS '+pass);
          if(!pass)process.exitCode=1;
          JS
          cp /tmp/m142.mjs ./m142-temporary-test.mjs
          node ./m142-temporary-test.mjs
      - name: Commit verified UI-only visual swale inclusion into isolated branch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(regional-ui): display all genuinely projected short swale centerlines"
          git push origin HEAD:candidate/m150-short-regional-corridor-visibility
