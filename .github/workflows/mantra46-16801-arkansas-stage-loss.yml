name: Mantra 46 16801 Arkansas Stage Loss

on:
  push:
    branches:
      - diagnostic-m46-16795-fine-coverage
    paths:
      - 'tests/mantra46-16801-arkansas-stage-loss.mjs'
      - '.github/workflows/mantra46-16801-arkansas-stage-loss.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Trace Arkansas stage loss
        run: node tests/mantra46-16801-arkansas-stage-loss.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16801-arkansas-stage-loss
          path: artifacts/mantra46-16801-arkansas-stage-loss/
          if-no-files-found: error
