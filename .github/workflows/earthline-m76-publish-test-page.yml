name: Earthline M76 Publish Isolated Test Page
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-publish-test-page.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Publish repaired M76 product commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 3e2a0d694e5d17ff055cf3a89df66306a259b3ea
          git show 3e2a0d694e5d17ff055cf3a89df66306a259b3ea:index.html > m76-swale-test.html
          test "$(git hash-object m76-swale-test.html)" = "$(git rev-parse 3e2a0d694e5d17ff055cf3a89df66306a259b3ea:index.html)"
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add m76-swale-test.html
          git commit -m "test: publish repaired local-interception swales" || true
          git push origin HEAD:pages-live
