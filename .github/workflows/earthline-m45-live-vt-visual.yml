name: Earthline Mantra45 Live Vermont Visual
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-m45-live-vt-visual.yml']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture live Vermont 16771
        shell: bash
        run: |
          mkdir -p lab
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1800,height:1100},deviceScaleFactor:1});
          await page.goto('https://earthlinedevelopment.org/?m45vtvisual='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForSelector('#searchInput',{timeout:30000});
          await page.evaluate(()=>{
            window.EARTHLINE_REGIONAL_COVERAGE_AUDIT_16731=null;
            const i=document.getElementById('searchInput'),b=document.getElementById('runBtn');
            i.value='vermont state';
            i.dispatchEvent(new Event('input',{bubbles:true}));
            i.dispatchEvent(new Event('change',{bubbles:true}));
            b.click();
          });
          await page.waitForFunction(()=>{
            const p=window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167;
            const d=window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020;
            const s=window.EARTHLINE_SPATIAL_COVERAGE_SELECTION_16736;
            return s?.build==='EARTHLINE 16771'&&Number(p?.generated||0)>0&&Number(p?.generated||0)===Number(d?.swaleLines||0);
          },null,{timeout:70000,polling:100});
          await page.waitForTimeout(800);
          const meta=await page.evaluate(()=>{
            const p=window.EARTHLINE_REGIONAL_PERFORMANCE_16191||{};
            const s=window.EARTHLINE_SPATIAL_COVERAGE_SELECTION_16736||{};
            const pub=window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167||{};
            const d=window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020||{};
            const map=(window.earthlineMap||null)?.getContainer?.()||document.getElementById('map');
            const r=map?.getBoundingClientRect?.();
            return {
              spatialBuild:s.build||null,
              totalMs:Number(p.totalMs||NaN),
              generated:Number(pub.generated||0),
              visible:Number(d.swaleLines||0),
              mapRect:r?{x:r.x,y:r.y,width:r.width,height:r.height}:null
            };
          });
          fs.writeFileSync('lab/mantra45-live-vt-visual.json',JSON.stringify(meta,null,2));
          const map=page.locator('#map');
          if(await map.count()) await map.screenshot({path:'lab/mantra45-live-vt-16771.png'});
          else await page.screenshot({path:'lab/mantra45-live-vt-16771.png',fullPage:false});
          await browser.close();
          JS
      - name: Persist visual evidence
        shell: bash
        run: |
          git config user.name "Earthline Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add lab/mantra45-live-vt-visual.json lab/mantra45-live-vt-16771.png
          git commit -m "diag: persist Mantra45 live Vermont visual [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

# trigger capture
