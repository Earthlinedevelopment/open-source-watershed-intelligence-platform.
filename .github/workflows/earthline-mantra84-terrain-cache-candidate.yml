name: Mantra 84 Terrain Cache Candidate
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - 'tests/mantra84-terrain-cache-candidate.mjs'
      - '.github/workflows/earthline-mantra84-terrain-cache-candidate.yml'
permissions: {contents: read}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        client: [webkit]
        q: [Vermont, Arizona]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLIENT: ${{ matrix.client }}
      Q: ${{ matrix.q }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps webkit
      - run: node tests/mantra84-terrain-cache-candidate.mjs
