name: Earthline Prescriber Root-Cause Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths:
      - .github/workflows/earthline-prescriber-root-cause-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Extract prescriber and Regional limits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(errors='ignore')
          terms=[
            'const work15771=isRegionalTile15769',
            'flowFirstAudit15836.unserved.push',
            'rejectFinalSpacing',
            'afterDedupe',
            'const kept',
            'let kept',
            'maxCandidates',
            'Regional Opportunity Tile',
            'effectiveSeedBudget15841',
            'regionalTile15769'
          ]
          for term in terms:
            hits=[m.start() for m in re.finditer(re.escape(term),s)]
            print('\n###',term,'COUNT',len(hits))
            for pos in hits[-8:]:
              print('\n---',pos,'---')
              print(s[max(0,pos-5000):min(len(s),pos+12000)])
          PY
