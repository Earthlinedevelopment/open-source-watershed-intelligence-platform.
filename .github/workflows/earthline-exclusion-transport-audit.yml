name: Earthline Exclusion Transport Audit
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-exclusion-transport-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - name: Extract exclusion transport owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for term in ["overpass-api.de/api/interpreter","const endpoints=[","endpointAttempts16846","AbortController"]:
              print("\n===== "+term+" =====")
              start=0
              n=0
              while True:
                  i=s.find(term,start)
                  if i<0 or n>=6: break
                  print(s[max(0,i-3200):min(len(s),i+8000)])
                  print("\n---")
                  start=i+len(term); n+=1
          PY
