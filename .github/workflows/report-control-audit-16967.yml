name: Earthline report control audit 16967
on:
  push:
    branches: [report-map-candidate-16967]
    paths:
      - '.github/workflows/report-control-audit-16967.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: report-map-candidate-16967
      - name: Audit launch controls and report owner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          for term in ["LOGIN","DONATE","MERCH","earthlineLaunch","data-action=\"close\"","panel.classList.add('open')"]:
              print("\n=== "+term+" ===")
              for m in list(re.finditer(re.escape(term),s,re.I))[:20]:
                  a=max(0,m.start()-360); b=min(len(s),m.end()+520)
                  print(s[a:b].replace("\n"," ")+"\n---")
          PY
