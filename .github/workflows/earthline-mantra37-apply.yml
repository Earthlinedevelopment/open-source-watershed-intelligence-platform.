name: Earthline Mantra 37 apply NY repair

on:
  push:
    branches:
      - main
    paths:
      - .earthline-mantra37-trigger

permissions:
  contents: write

jobs:
  repair-pages-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0

      - name: Verify existing exact NY Regional repairs
        shell: bash
        run: |
          set -euo pipefail
          python lab/mantra37-repair-16633.py
          python lab/mantra37-repair-16634.py
          node lab/mantra37-verify.js
          git diff --check

      - name: Extract complete mapped-water gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.find('  async function earthlineMappedWaterSwaleGate16609(')
          if start < 0:
            raise SystemExit('mapped-water gate owner not found')
          candidates=[x for x in [s.find('\n  function ',start+20),s.find('\n  async function ',start+20)] if x>start]
          end=min(candidates) if candidates else min(len(s),start+40000)
          gate=s[start:end]
          call=s.find("U.S. state mapped-water verification unavailable")
          callctx=s[max(0,call-3000):min(len(s),call+3000)] if call>=0 else 'CALL SITE NOT FOUND'
          out='===== COMPLETE GATE =====\n'+gate+'\n\n===== CALL SITE =====\n'+callctx+'\n'
          Path('lab/mantra37-mappedwater-diagnostic.txt').write_text(out,encoding='utf-8')
          print('diagnostic bytes',len(out))
          PY

      - name: Publish diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name earthline-ci
          git config user.email actions@users.noreply.github.com
          git add lab/mantra37-mappedwater-diagnostic.txt
          if git diff --cached --quiet; then
            echo "No diagnostic change."
            exit 0
          fi
          git commit -m "diag: capture complete NY mapped-water gate"
          git push origin HEAD:pages-live
