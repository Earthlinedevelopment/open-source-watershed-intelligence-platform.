name: Earthline Mantra 37 apply NY repair

on:
  push:
    branches:
      - main
    paths:
      - .earthline-mantra37-trigger

permissions:
  contents: write

jobs:
  repair-pages-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0

      - name: Apply exact NY Regional repairs
        shell: bash
        run: |
          set -euo pipefail
          python lab/mantra37-repair-16633.py
          python lab/mantra37-repair-16634.py
          node lab/mantra37-verify.js
          git diff --check

      - name: Publish repaired pages-live index
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "No index change required."
            exit 0
          fi
          git config user.name earthline-ci
          git config user.email actions@users.noreply.github.com
          git add index.html
          git commit -m "perf: apply exact NY Regional repair 16633-16634"
          git push origin HEAD:pages-live
