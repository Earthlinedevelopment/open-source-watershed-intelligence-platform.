name: Earthline Mantra 37 apply NY repair

on:
  push:
    branches:
      - main
    paths:
      - .earthline-mantra37-trigger

permissions:
  contents: write

jobs:
  repair-pages-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0

      - name: Apply NY Regional mapped-water repair
        shell: bash
        run: |
          set -euo pipefail
          python lab/mantra37-repair-16633.py
          python lab/mantra37-repair-16634.py
          python lab/mantra37-repair-16635.py
          node lab/mantra37-verify.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          if(!s.includes('EARTHLINE 16635 — U.S. MAPPED-WATER AUTHORITY CONSISTENCY.')) throw new Error('16635 marker missing');
          if((s.match(/async function earthlineMappedWaterSwaleGate16609\(/g)||[]).length!==1) throw new Error('mapped-water gate owner count changed');
          if((s.match(/const verified16609=/g)||[]).length!==1) throw new Error('mapped-water verdict count changed');
          if(!s.includes('const verified16609=useTiger16617?tigerVerified16617:mapWaterVerified16635;')) throw new Error('16635 authority verdict missing');
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim()) continue;
            try{new Function(m[1]);}catch(e){throw new Error('script '+i+' syntax: '+e.message);}
          }
          NODE
          git diff --check

      - name: Publish repaired pages-live index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name earthline-ci
          git config user.email actions@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then
            echo "No index change required."
            exit 0
          fi
          git commit -m "fix: make TIGER authoritative for U.S. mapped-water verification 16635"
          git push origin HEAD:pages-live
