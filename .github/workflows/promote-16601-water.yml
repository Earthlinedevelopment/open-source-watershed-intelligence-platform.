name: Promote 16601 water mask to live index

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/promote-16601-water.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Append tested 16601 shared-water owner at absolute EOF
        shell: bash
        run: |
          set -euo pipefail
          marker='builds/16601/earthline-shared-water-mask.js'
          if grep -Fq "$marker" index.html; then
            echo '16601 live water loader already present; no change.'
            exit 0
          fi
          printf '\n<script src="/builds/16601/earthline-shared-water-mask.js?v=16601-live-water-20260909"></script>\n' >> index.html
          tail -n 5 index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(live): promote tested 16601 shared water mask'
          git push origin HEAD:pages-live
