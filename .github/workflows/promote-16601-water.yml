name: Promote tested live patches to index

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/promote-16601-water.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Append tested late owners at absolute EOF
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          water='builds/16601/earthline-shared-water-mask.js'
          camera='builds/16602/earthline-regional-camera-scale.js'
          if ! grep -Fq "$water" index.html; then
            printf '\n<script src="/builds/16601/earthline-shared-water-mask.js?v=16601-live-water-20260909"></script>\n' >> index.html
            changed=1
          fi
          if ! grep -Fq "$camera" index.html; then
            printf '\n<script src="/builds/16602/earthline-regional-camera-scale.js?v=16602-live-regional-20260909"></script>\n' >> index.html
            changed=1
          fi
          tail -n 7 index.html
          if [ "$changed" -eq 0 ]; then
            echo 'All tested live loaders already present; no change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(live): promote Regional camera scale gate'
          git push origin HEAD:pages-live
