name: Mantra 46 Camera Late Owner Diagnostic

on:
  push:
    branches: [diagnostic-m46-camera-trace]
    paths:
      - 'tests/mantra46-camera-late-owner.mjs'
      - '.github/workflows/mantra46-camera-late-owner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Trace late camera owner
        run: node tests/mantra46-camera-late-owner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-camera-late-owner
          path: artifacts/mantra46-camera-late-owner/
          if-no-files-found: error
