name: Earthline M75 Iowa Regional Diagnostic
on:
  push:
    branches:
      - recovery/mantra75-current-engine
    paths:
      - .github/workflows/earthline-m75-iowa-regional-diagnostic.yml
permissions:
  contents: read
jobs:
  regional:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Iowa Regional
        shell: bash
        run: |
          cat > ./iowa-regional.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1800,height:1000}});
          await page.route('https://api.mapbox.com/**',async route=>{
            const h={...route.request().headers(),referer:'https://earthlinedevelopment.org/',origin:'https://earthlinedevelopment.org'};
            await route.continue({headers:h});
          });
          const errs=[];page.on('pageerror',e=>errs.push(String(e)));
          await page.goto('http://127.0.0.1:8787/?regional='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
          await page.waitForSelector('#searchInput',{timeout:30000});
          await page.waitForFunction(()=>window.earthlineMap||(typeof earthlineMap!=='undefined'&&earthlineMap),null,{timeout:30000});
          const input=page.locator('#searchInput');
          await input.fill('Iowa');await page.waitForTimeout(900);
          const opts=page.locator('#earthlineSearchSuggestions15970 [role="option"]:visible');
          if(await opts.count())await opts.first().click({force:true});else await input.press('Enter').catch(()=>{});
          await page.waitForTimeout(250);
          const t0=Date.now();await page.locator('#runBtn').click({force:true});
          let settled=false;
          try{
            await page.waitForFunction(()=>{
              const d=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null;
              const tier=String(d&&(d.tier||d.mode)||'').toLowerCase();
              const busy=document.getElementById('runBtn')?.getAttribute('aria-busy');
              return tier==='regional'&&busy!=='true';
            },null,{timeout:90000,polling:250});
            settled=true;
          }catch(_){}
          await page.waitForTimeout(1200);
          const out=await page.evaluate(()=>{
            const st=window.earthlineRegional15778||window.earthlineRegional15761||null;
            return {
              displayed:window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null,
              performance:window.EARTHLINE_REGIONAL_PERFORMANCE_16191||st?.lastRegionalPerformance16191||null,
              summary:st?.summary||null,
              tiles:(st?.tiles||[]).map((t,i)=>({i:i+1,status:t.status,lat:t.lat,lng:t.lng})),
              tileStats:(st?.tileStats||[]).map((x,i)=>({i:i+1,status:x?.status,swales:x?.swales,timings:x?.timings,error:x?.error||null})),
              corridorFeatures:st?.opportunityLines?.features?.length||0,
              rawCorridors:st?.rawCorridors?.length||0,
              withheld:st?.withheld||0,
              busy:document.getElementById('runBtn')?.getAttribute('aria-busy'),
              buttonText:document.getElementById('runBtn')?.textContent||''
            };
          });
          console.log('EARTHLINE_IOWA_REGIONAL_RESULT '+JSON.stringify({settled,elapsedMs:Date.now()-t0,errors:errs,...out}));
          await browser.close();
          NODE
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/iowa-regional.log 2>&1 &
          PID=$!;trap 'kill $PID || true' EXIT
          for i in {1..30};do curl -fsS http://127.0.0.1:8787/ >/dev/null&&break;sleep 1;done
          node ./iowa-regional.mjs
