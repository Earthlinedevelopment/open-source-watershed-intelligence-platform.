name: Prepare safe short swales and first-click exclusion map readiness
on:
  push:
    branches: [repair/arizona-visible-valid-swales-20261113]
    paths: [.github/workflows/az-exclusion-ready-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Preserve no-build fail-closed wait, remove premature map-inactive veto
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "0c50f384f2bbac85eb6dbe7d86bcf348e4969d68"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          old='  if(!earthlineMapActive())return {ready:false,status:"map-inactive",waitedMs:0};'
          new=chr(10).join([
            '  // Do not fail immediately when Mapbox is still initializing; existing style poll',
            '  // waits for relevant exclusion layers then fails closed on timeout.',
            '  // This prevents a valid first Property click from publishing before style readiness.'
          ])
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          test "$(git hash-object index.html)" = "133f36605b9a0d58a85eae759580aa9eadeffe7a"
          git rm .github/workflows/az-exclusion-ready-prepare.yml
          git config user.name 'Earthline Property map-ready repair'
          git config user.email 'info@earthlinedevelopment.org'
          git add index.html
          git commit -m 'fix(property): await exclusion style availability on initial Mapbox load'
          git push origin HEAD:repair/arizona-visible-valid-swales-20261113
