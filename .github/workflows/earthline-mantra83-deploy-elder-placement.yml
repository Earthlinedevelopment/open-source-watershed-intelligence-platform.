name: Mantra 83 Deploy Elder Script Placement
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - 'tests/mantra83-fix-elder-script-placement.mjs'
      - '.github/workflows/earthline-mantra83-deploy-elder-placement.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mantra83-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra83-shadow-live
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          cp tests/mantra83-fix-elder-script-placement.mjs /tmp/fix-elder-placement.mjs
          git fetch origin pages-live
          git checkout -B pages-live origin/pages-live
          node /tmp/fix-elder-placement.mjs
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const a=s.indexOf('earthline-elder-restored-17097.js');const b=s.indexOf('</head>');if(a<0||b<0||a>b)process.exit(2);"
          git config user.name "earthline-ci"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "restore: execute Elder Tree engine in page head"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
