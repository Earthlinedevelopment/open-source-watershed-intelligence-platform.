name: Earthline Candidate 50-State Regression Gate

on:
  push:
    branches: [earthline-regression-candidate]
    paths:
      - 'index.html'
      - 'EARTHLINE_GOVERNANCE_CONTRACT.md'
      - 'EARTHLINE_ENGINEERING_ERROR_LEDGER.md'
      - 'earthline-accepted-baseline.json'
      - 'earthline-change-declaration.json'
      - 'earthline-current-50-state-snapshot.json'
      - 'earthline-state-regression-baseline.json'
      - 'tests/earthline-governance-preflight.py'
      - 'tests/all-state-live-regression-audit.mjs'
      - '.github/workflows/earthline-all-state-live-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - "Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia"
          - "Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland"
          - "Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey"
          - "New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina"
          - "South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming"
    steps:
      - uses: actions/checkout@v4
      - name: Governance preflight
        run: python tests/earthline-governance-preflight.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Audit candidate source
        env:
          STATES: ${{ matrix.shard }}
          EARTHLINE_URL: https://earthlinedevelopment.org/
          EARTHLINE_INDEX: index.html
        run: node tests/all-state-live-regression-audit.mjs
