name: Earthline Full Regression Audit 2026-10-06

on:
  push:
    branches: [regression-audit-2026-10-06]
    paths:
      - '.github/workflows/earthline-full-regression-audit-2026-10-06.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regional-50:
    name: 50-State Regional Launch Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/final-launch-smoke-17001.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-audit-regional-50
          path: artifacts/final-launch-smoke-17001/
          if-no-files-found: warn

  property-us:
    name: US Property \${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: b1
            states: "Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia"
          - batch: b2
            states: "Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland"
          - batch: b3
            states: "Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey"
          - batch: b4
            states: "New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina"
          - batch: b5
            states: "South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Property certification
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          STATES: \${{ matrix.states }}
          OUT: property-audit-\${{ matrix.batch }}.json
        run: node tests/validate-property-50states-final.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-audit-property-\${{ matrix.batch }}
          path: property-audit-\${{ matrix.batch }}.json
          if-no-files-found: warn

  sea3:
    name: Laos Thailand Vietnam Regional + Property
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run SEA certification
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          STATES: "Laos|Thailand|Vietnam"
          OUT: sea3-regression-audit.json
        run: node tests/validate-property-50states-final.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-audit-sea3
          path: sea3-regression-audit.json
          if-no-files-found: warn
