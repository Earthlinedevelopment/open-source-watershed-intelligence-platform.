name: Earthline M75 Engine Core Repair Runner
on:
  push:
    branches:
      - recovery/mantra74-stability
    paths:
      - tools/repair-m75-engine-core.py
      - .github/workflows/earthline-m75-engine-core-runner.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-engine-core
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          path: harness
      - name: Apply repair
        run: python3 harness/tools/repair-m75-engine-core.py
      - name: Parse page
        run: node --check earthline-launch-16872.js
      - name: Commit repair
        run: |
          git config user.name Earthlinedevelopment
          git config user.email info@earthlinedevelopment.org
          git add index.html
          git commit -m 'fix: remove duplicate swales and widen Regional coverage'
          git push origin HEAD:recovery/mantra75-engine-core