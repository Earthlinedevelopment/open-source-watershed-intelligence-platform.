name: Earthline 16755 Regional Density Recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-run-16755.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Fetch and apply density repair
        run: |
          git fetch origin main
          git show origin/main:lab/apply-16755-regional-density-recovery.py > /tmp/apply-16755.py
          python3 /tmp/apply-16755.py
          git diff --check
      - name: Publish pages-live
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'repair: restore terrain-proportional Regional corridor density'
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
  validate:
    needs: repair
    strategy:
      fail-fast: false
      matrix:
        state: [Minnesota, Iowa, Oklahoma, Maryland, Vermont, Texas, Florida, California, Colorado]
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate density state
        shell: bash
        run: |
          sleep 5
          set +e
          EARTHLINE_URL='https://earthlinedevelopment.org/' STATES='${{ matrix.state }}' OUT='state.json' node lab/validate-16731-coverage-gap.mjs
          code=$?
          echo "$code" > state.exit
          cat state.json
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: "density-${{ matrix.state }}"
          path: |
            state.json
            state.exit
          if-no-files-found: error
