name: Earthline Colorado Property Arizona Sequence
on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/co-property-az-sequence.mjs'
      - '.github/workflows/earthline-co-property-az-sequence.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/co-property-az-sequence.mjs
