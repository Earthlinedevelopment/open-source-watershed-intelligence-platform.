name: Earthline 16841 Public-Domain Arkansas Verify
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-m47-16837-readonly-extract.yml'
      - 'lab/TRIGGER-16837-READONLY.txt'
      - 'lab/earthline-16841-live-verify.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify public production Arkansas on 16841
        run: node lab/earthline-16841-live-verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-16841-live-verify
          path: out/
          retention-days: 2
