name: Earthline 16844 Final Supported Capacity A B
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-m47-16837-readonly-extract.yml'
      - 'lab/TRIGGER-16837-READONLY.txt'
      - 'lab/earthline-16844-capacity-finish-ab.mjs'
permissions:
  contents: read
jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Run 16844 final supported-capacity A/B
        run: node lab/earthline-16844-capacity-finish-ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-16844-capacity-finish-ab
          path: out/
          retention-days: 2
