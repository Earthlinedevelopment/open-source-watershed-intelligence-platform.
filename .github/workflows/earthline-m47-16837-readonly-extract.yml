name: Earthline 16838 Readonly Arkansas Void Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-m47-16837-readonly-extract.yml'
      - 'lab/TRIGGER-16837-READONLY.txt'
      - 'lab/earthline-16838-void-audit.mjs'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Measure exact Arkansas void geometry
        run: node lab/earthline-16838-void-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: earthline-16838-void-audit
          path: out/
          retention-days: 2
