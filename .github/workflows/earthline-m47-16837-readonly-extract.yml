name: Earthline 16842 Selection Capacity Owner Extract
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-m47-16837-readonly-extract.yml'
      - 'lab/TRIGGER-16837-READONLY.txt'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Extract current selection capacity owners
        shell: bash
        run: |
          mkdir -p out
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          pats=['chosen.length','let chosen','const chosen','chosen=','maxSwales','maxCorridor','targetCount','targetSwales','corridorCap','selectionCap','slice(0,','EARTHLINE_SPATIAL_COVERAGE_SELECTION','EARTHLINE_FINAL_PUBLISHED_SPREAD']
          out=[]
          for pat in pats:
            out.append(f'===== {pat} =====')
            pos=0;hits=[]
            while True:
              i=s.find(pat,pos)
              if i<0: break
              hits.append(i);pos=i+len(pat)
            out.append(f'hits={hits[:80]} count={len(hits)}')
            for i in hits[:30]:
              out.append(s[max(0,i-2200):min(len(s),i+4200)])
          # also capture lines that contain likely hard numeric ceilings around selection code
          lines=s.splitlines()
          out.append('===== SELECTED LINES =====')
          for n,line in enumerate(lines,1):
            lo=line.lower()
            if ('chosen' in lo or 'candidate' in lo or 'corridor' in lo or 'swale' in lo) and any(k in lo for k in ['limit','cap','target','max','slice','length']):
              out.append(f'{n}: {line}')
          Path('out/selection-owner-current.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: earthline-16842-selection-owner
          path: out/selection-owner-current.txt
          retention-days: 2
