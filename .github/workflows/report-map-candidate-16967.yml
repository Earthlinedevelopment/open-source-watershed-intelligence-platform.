name: Earthline report map candidate 16967
on:
  push:
    branches: [report-map-candidate-16967]
    paths:
      - '.github/workflows/report-map-candidate-16967.yml'
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: report-map-candidate-16967
      - name: Build isolated candidate and preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, math
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          # Keep report isolated from site controls.
          style='''<style id="earthlineReportIsolation16967">
          html.earthline-report-open-16967 #earthlineRail16188,
          html.earthline-report-open-16967 #earthlineLaunchFallbackRail16872,
          html.earthline-report-open-16967 #earthlineLaunchLogin16872,
          html.earthline-report-open-16967 #earthlineLaunchDonate16872,
          html.earthline-report-open-16967 #earthlineLaunchMerch16872,
          html.earthline-report-open-16967 #searchOrb,
          html.earthline-report-open-16967 [id*="SearchOrb"],
          html.earthline-report-open-16967 [id^="earthlineRail"],
          html.earthline-report-open-16967 .earthline-launch-rail-btn-16872,
          html.earthline-report-open-16967 .el-rail-control-16188,
          html.earthline-report-open-16967 .mapboxgl-ctrl {
            display:none!important; visibility:hidden!important; pointer-events:none!important;
          }
          </style>'''
          if 'earthlineReportIsolation16967' not in s:
              s=s.replace('</head>',style+'\n</head>',1)
          s=s.replace("earthline-report-open-16966","earthline-report-open-16967")

          new_map=r'''function mapSvg(d,small=false){
            const b=reportBounds(d),W=1080,H=small?450:600;
            const mapX=28,mapY=28,mapW=W-56,mapH=H-56;
            const xSpan=Math.max(.000001,b[2]-b[0]),ySpan=Math.max(.000001,b[3]-b[1]);
            const sx=x=>mapX+(x-b[0])/xSpan*mapW,sy=y=>mapY+mapH-(y-b[1])/ySpan*mapH;
            const pathCoords=coords=>(coords||[]).map((q,i)=>(i?'L':'M')+sx(+q[0]).toFixed(1)+' '+sy(+q[1]).toFixed(1)).join(' ');
            const path=f=>pathCoords(f?.geometry?.coordinates||[]);
            const mid=f=>{const a=f?.geometry?.coordinates||[];const q=a[Math.floor(a.length/2)];return Array.isArray(q)&&q.length>1?q:null};
            const slen=f=>{const a=f?.geometry?.coordinates||[];let L=0;for(let i=1;i<a.length;i++)L+=Math.hypot(sx(+a[i][0])-sx(+a[i-1][0]),sy(+a[i][1])-sy(+a[i-1][1]));return L};
            const reportContours=contours().filter(f=>f?.geometry?.type==='LineString').slice(0,220);
            const reportFlows=flows().filter(f=>f?.geometry?.type==='LineString').slice(0,240);
            const rows=graded(),aquiferFeatures=reportAquifers();
            const flowRank=reportFlows.map(f=>({f,L:slen(f)})).sort((a,b)=>b.L-a.L);
            const major=flowRank.slice(0,Math.min(small?10:16,flowRank.length));
            const secondary=flowRank.slice(major.length,Math.min(major.length+(small?12:22),flowRank.length));
            const reportPlace=String(d?.query||d?.location||d?.placeName||'Analysis Area').trim();
            const lonSpan=Math.max(.0001,b[2]-b[0]),midLat=(b[1]+b[3])/2,kmWide=lonSpan*111.32*Math.cos(midLat*Math.PI/180);
            const niceKm=kmWide>300?100:kmWide>120?50:kmWide>50?20:kmWide>20?10:kmWide>8?5:kmWide>3?2:1;
            const barPx=Math.max(54,Math.min(160,niceKm/kmWide*mapW));
            const clipId='elClip16967',aqPat='elAq16967',parts=[];
            parts.push('<svg class="el-report-landscape-plan-16967" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc('Earthline '+reportPlace+' landscape water plan')+'">');
            parts.push('<defs><linearGradient id="elGround16967" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf4"/><stop offset=".46" stop-color="#eff3e8"/><stop offset="1" stop-color="#e3ebe2"/></linearGradient><pattern id="'+aqPat+'" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="13" height="13" fill="#e99748" fill-opacity=".25"/><path d="M0 0 V13" stroke="#bf6824" stroke-width=".7" stroke-opacity=".25"/></pattern><filter id="elSoft16967" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter><clipPath id="'+clipId+'"><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="4"/></clipPath><marker id="elArrow16967" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L5 2.5 L0 5 Z" fill="#257a9d" opacity=".78"/></marker></defs>');
            parts.push('<rect width="'+W+'" height="'+H+'" fill="#f4f1e8"/><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="4" fill="url(#elGround16967)" stroke="#94a097" stroke-width=".9"/><g clip-path="url(#'+clipId+')">');

            // Soft terrain massing from existing contour geometry; sparse index contours only.
            for(let i=0;i<reportContours.length;i+=12){const dp=path(reportContours[i]);if(!dp)continue;parts.push('<path d="'+dp+'" fill="none" stroke="#6d806f" stroke-width="42" opacity=".022" stroke-linecap="round" filter="url(#elSoft16967)" vector-effect="non-scaling-stroke"/>')}
            for(let i=0;i<reportContours.length;i+=8){const dp=path(reportContours[i]);if(!dp)continue;parts.push('<path d="'+dp+'" fill="none" stroke="#6f7b73" stroke-width=".55" opacity=".18" vector-effect="non-scaling-stroke"/>')}

            // Aquifer as orange field.
            for(const f of aquiferFeatures){const g=f&&f.geometry;if(!g)continue;const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];for(const poly of polys){const rings=poly.filter(r=>Array.isArray(r)&&r.length>=3);if(!rings.length)continue;const dp=rings.map(r=>pathCoords(r)+' Z').join(' ');parts.push('<path d="'+dp+'" fill="url(#'+aqPat+')" fill-rule="evenodd" stroke="#b96222" stroke-width="1.05" opacity=".95" vector-effect="non-scaling-stroke"/>')}}

            // Secondary drainage is context, not the subject.
            for(const x of secondary){const dp=path(x.f);if(dp)parts.push('<path d="'+dp+'" fill="none" stroke="#7ba1ae" stroke-width=".62" opacity=".10" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>')}
            let fi=0;for(const x of major){const dp=path(x.f);if(!dp)continue;parts.push('<path d="'+dp+'" fill="none" stroke="#fffdf7" stroke-width="4.6" opacity=".88" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#247a9f" stroke-width="1.30" opacity=".87" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"'+(fi++%4===0?' marker-end="url(#elArrow16967)"':'')+'/>')}

            // Opportunity corridors: A reads as constructed vegetated swale, B as secondary, C as quiet context.
            const draw=r=>{const dp=path(r.f);if(!dp)return;
              if(r.grade==='C'){parts.push('<path d="'+dp+'" fill="none" stroke="#8e826c" stroke-width=".70" opacity=".12" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');return}
              if(r.grade==='B'){parts.push('<path d="'+dp+'" fill="none" stroke="#fffdf8" stroke-width="10" opacity=".78" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#d1dec9" stroke-width="6.8" opacity=".60" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#677a5e" stroke-width="1.0" opacity=".72" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');return}
              parts.push('<path d="'+dp+'" fill="none" stroke="#fffdf8" stroke-width="18" opacity=".97" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#b8d2ab" stroke-width="12.6" opacity=".82" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#2f5d3d" stroke-width="1.55" opacity=".98" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" transform="translate(-1.55 -1.55)" fill="none" stroke="#54a9c1" stroke-width=".72" opacity=".96" stroke-dasharray="2.2 2.8" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" transform="translate(1.55 1.55)" fill="none" stroke="#54a9c1" stroke-width=".72" opacity=".96" stroke-dasharray="2.2 2.8" stroke-linecap="round" vector-effect="non-scaling-stroke"/>')
            };
            for(const r of rows.filter(r=>r.grade==='C'))draw(r);for(const r of rows.filter(r=>r.grade==='B'))draw(r);for(const r of rows.filter(r=>r.grade==='A'))draw(r);

            let ai=0;for(const r of rows.filter(r=>r.grade==='A').slice(0,8)){const q=mid(r.f);if(!q)continue;const x=sx(+q[0]),y=sy(+q[1]);parts.push('<g><rect x="'+(x-12).toFixed(1)+'" y="'+(y-7).toFixed(1)+'" width="24" height="13" rx="6.5" fill="#fffdf8" stroke="#5e7864" stroke-width=".7"/><text x="'+x.toFixed(1)+'" y="'+(y+2).toFixed(1)+'" text-anchor="middle" fill="#2c4d37" font-family="Noto Sans,Arial,sans-serif" font-size="6.7" font-weight="850">A'+(++ai)+'</text></g>')}

            parts.push('</g>');
            // Compact furniture only.
            if(!small){const lx=mapX+18,ly=mapY+18;parts.push('<g transform="translate('+lx+','+ly+')"><rect width="214" height="78" rx="4" fill="#fffef9" fill-opacity=".92" stroke="#c1c8c2" stroke-width=".6"/><text x="14" y="19" fill="#203a33" font-family="Noto Sans,Arial,sans-serif" font-size="8.0" font-weight="850" letter-spacing=".8">PLAN KEY</text><rect x="14" y="31" width="22" height="9" rx="1" fill="url(#'+aqPat+')" stroke="#b96222" stroke-width=".65"/><text x="44" y="38" fill="#465750" font-family="Noto Sans,Arial,sans-serif" font-size="6.2">Aquifer field</text><path d="M14 55 H36" stroke="#247a9f" stroke-width="1.25"/><text x="44" y="58" fill="#465750" font-family="Noto Sans,Arial,sans-serif" font-size="6.2">Primary water path</text><path d="M116 36 H140" stroke="#b8d2ab" stroke-width="10" opacity=".82" stroke-linecap="round"/><path d="M116 36 H140" stroke="#2f5d3d" stroke-width="1.4"/><text x="149" y="39" fill="#465750" font-family="Noto Sans,Arial,sans-serif" font-size="6.2">A · priority swale</text><path d="M116 57 H140" stroke="#d1dec9" stroke-width="5.8" opacity=".65" stroke-linecap="round"/><path d="M116 57 H140" stroke="#677a5e" stroke-width="1"/><text x="149" y="60" fill="#465750" font-family="Noto Sans,Arial,sans-serif" font-size="6.2">B · strong</text></g>')}
            parts.push('<g transform="translate('+(mapX+18)+','+(mapY+mapH-20)+')"><path d="M0 0 H'+barPx+'" stroke="#42544c" stroke-width="1.4"/><path d="M0 -4 V4 M'+barPx+' -4 V4" stroke="#42544c" stroke-width=".9"/><text x="'+(barPx/2)+'" y="13" text-anchor="middle" fill="#56645e" font-family="Noto Sans,Arial,sans-serif" font-size="6.5" font-weight="700">'+niceKm+' km</text></g>');
            parts.push('<g transform="translate('+(mapX+mapW-47)+','+(mapY+20)+')"><circle cx="12" cy="13" r="19" fill="#fffdf8" fill-opacity=".90" stroke="#a9b3ab" stroke-width=".7"/><text x="12" y="-1" text-anchor="middle" fill="#294239" font-family="Noto Sans,Arial,sans-serif" font-size="7.5" font-weight="850">N</text><path d="M12 4 V30" stroke="#294239" stroke-width="1"/><path d="M12 4 L6 16 L12 12 L18 16 Z" fill="#294239"/></g>');
            parts.push('</svg>');return parts.join('');
          }
          '''
          start=s.find("function mapSvg(d,small=false){")
          end=s.find("function gradeSummary",start)
          if start<0 or end<0 or end<=start:
              raise SystemExit(f"mapSvg boundary not found start={start} end={end}")
          s=s[:start]+new_map+s[end:]
          p.write_text(s,encoding="utf-8")

          # Deterministic visual QA board matching the same grammar, kept on candidate branch only.
          W,H=1080,600
          svg=[f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} {H}">']
          svg.append('<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf4"/><stop offset=".46" stop-color="#eff3e8"/><stop offset="1" stop-color="#e3ebe2"/></linearGradient><pattern id="aq" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="13" height="13" fill="#e99748" fill-opacity=".25"/><path d="M0 0V13" stroke="#bf6824" stroke-width=".7" stroke-opacity=".25"/></pattern></defs>')
          svg.append('<rect width="1080" height="600" fill="#f4f1e8"/><rect x="28" y="28" width="1024" height="544" rx="4" fill="url(#g)" stroke="#94a097"/>')
          # terrain bands
          for i in range(8):
              y=115+i*48
              pts=[]
              for x in range(45,1040,22):
                  yy=y+18*math.sin(x/110+i*.7)+6*math.sin(x/35+i)
                  pts.append((x,yy))
              d='M'+' L'.join(f'{x:.1f} {y:.1f}' for x,y in pts)
              svg.append(f'<path d="{d}" fill="none" stroke="#6f7b73" stroke-width=".7" opacity=".19"/>')
          # aquifer fields
          svg.append('<path d="M590 105 C760 60 935 135 1015 255 L1010 420 C875 470 735 420 625 340 C565 270 545 180 590 105Z" fill="url(#aq)" stroke="#b96222" stroke-width="1.3"/>')
          svg.append('<path d="M120 385 C210 320 330 330 390 405 C340 490 225 525 125 475Z" fill="url(#aq)" stroke="#b96222" stroke-width="1.2" opacity=".8"/>')
          # principal drainage
          flows=[
            [(90,115),(210,155),(310,210),(405,260),(500,330),(625,390),(770,425),(955,500)],
            [(175,85),(260,145),(340,185),(405,260)],
            [(515,90),(500,180),(500,330)],
            [(735,95),(690,175),(625,250),(625,390)],
            [(960,120),(870,205),(770,290),(625,390)]
          ]
          for pts in flows:
              d='M'+' L'.join(f'{x} {y}' for x,y in pts)
              svg.append(f'<path d="{d}" fill="none" stroke="#fffdf7" stroke-width="5" stroke-linecap="round"/><path d="{d}" fill="none" stroke="#247a9f" stroke-width="1.6" stroke-linecap="round"/>')
          # A swales
          swales=[
            [(115,245),(235,225),(365,235),(500,260),(635,290),(790,295),(925,270)],
            [(130,310),(255,295),(385,305),(520,330),(650,355),(790,360),(920,345)],
            [(155,375),(285,360),(420,375),(555,402),(690,420),(820,420)],
            [(250,445),(390,430),(530,445),(665,470),(790,485)]
          ]
          for n,pts in enumerate(swales,1):
              d='M'+' L'.join(f'{x} {y}' for x,y in pts)
              svg.append(f'<path d="{d}" fill="none" stroke="#fffdf8" stroke-width="19" stroke-linecap="round"/><path d="{d}" fill="none" stroke="#b8d2ab" stroke-width="13" stroke-linecap="round"/><path d="{d}" fill="none" stroke="#2f5d3d" stroke-width="1.7" stroke-linecap="round"/><path d="{d}" transform="translate(-1.6 -1.6)" fill="none" stroke="#54a9c1" stroke-width=".8" stroke-dasharray="2.4 2.8" stroke-linecap="round"/><path d="{d}" transform="translate(1.6 1.6)" fill="none" stroke="#54a9c1" stroke-width=".8" stroke-dasharray="2.4 2.8" stroke-linecap="round"/>')
              x,y=pts[len(pts)//2]
              svg.append(f'<rect x="{x-13}" y="{y-8}" width="26" height="14" rx="7" fill="#fffdf8" stroke="#5e7864"/><text x="{x}" y="{y+2}" text-anchor="middle" fill="#2c4d37" font-family="Arial" font-size="8" font-weight="700">A{n}</text>')
          # compact legend
          svg.append('<g transform="translate(52 52)"><rect width="230" height="82" rx="4" fill="#fffef9" fill-opacity=".94" stroke="#c1c8c2"/><text x="14" y="20" font-family="Arial" font-size="10" font-weight="700" fill="#203a33">PLAN KEY</text><rect x="14" y="32" width="22" height="9" fill="url(#aq)" stroke="#b96222"/><text x="44" y="40" font-family="Arial" font-size="8" fill="#465750">Aquifer field</text><path d="M14 58H36" stroke="#247a9f" stroke-width="1.6"/><text x="44" y="61" font-family="Arial" font-size="8" fill="#465750">Primary water path</text><path d="M126 37H151" stroke="#b8d2ab" stroke-width="10" stroke-linecap="round"/><path d="M126 37H151" stroke="#2f5d3d" stroke-width="1.5"/><text x="160" y="40" font-family="Arial" font-size="8" fill="#465750">Priority swale</text></g>')
          svg.append('<g transform="translate(992 56)"><circle cx="12" cy="13" r="20" fill="#fffdf8" stroke="#a9b3ab"/><text x="12" y="-1" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700" fill="#294239">N</text><path d="M12 4V31" stroke="#294239"/><path d="M12 4L6 16L12 12L18 16Z" fill="#294239"/></g>')
          svg.append('</svg>')
          Path("REPORT-MAP-CANDIDATE-16967.svg").write_text(''.join(svg),encoding="utf-8")
          PY
      - name: Validate and commit candidate
        shell: bash
        run: |
          grep -q "el-report-landscape-plan-16967" index.html
          grep -q "earthlineReportIsolation16967" index.html
          grep -q "REPORT-MAP-CANDIDATE-16967" <(ls)
          git config user.name "Earthline Mantra 54"
          git config user.email "info@earthlinedevelopment.org"
          git rm .github/workflows/report-map-candidate-16967.yml
          git add index.html REPORT-MAP-CANDIDATE-16967.svg
          git commit -m "candidate: report map landscape plan 16967"
          git push origin report-map-candidate-16967
