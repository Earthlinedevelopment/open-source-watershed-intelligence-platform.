name: Earthline Live V1 Elder Layer Lifecycle 17159
on:
  push:
    branches: [research/elder-browser-engine-17129]
    paths:
      - 'tests/live-v1-elder-layer-lifecycle-17159.mjs'
      - '.github/workflows/earthline-live-v1-elder-layer-lifecycle-17159.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/live-v1-elder-layer-lifecycle-17159.mjs
