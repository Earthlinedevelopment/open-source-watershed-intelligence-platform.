name: Mantra 51 Candidate 16922 Germany Regression
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths: ['.github/workflows/mantra51-candidate-16922-germany-regression.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: mantra51-global-repair-campaign}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 >/tmp/earthline-http.log 2>&1 &
          echo $! >/tmp/earthline-http.pid
      - run: |
          cat > candidate-16922-test.mjs <<'JS'
          import { chromium } from 'playwright';
          import { readFile } from 'fs/promises';
          const html=await readFile('index.html','utf8');
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1800,height:1000}});
          await page.route('https://earthlinedevelopment.org/**', async route=>{
            const req=route.request();
            if(req.isNavigationRequest() && req.resourceType()==='document'){
              await route.fulfill({status:200,contentType:'text/html',body:html,headers:{'cache-control':'no-store'}});
            } else await route.continue();
          });
          await page.goto('https://earthlinedevelopment.org/?candidate16922='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForSelector('#searchInput',{timeout:30000});
          async function run(q){await page.evaluate(q=>{const i=document.getElementById('searchInput'),b=document.getElementById('runBtn');i.value=q;i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));b.click();},q)}
          await run('germany country');
          await page.waitForFunction(()=>window.EARTHLINE_REGIONAL_TERMINAL_16539?.status==='published',null,{timeout:180000,polling:250});
          await page.waitForTimeout(1200);
          const hit=page.locator('.earthline-swale-hit-16070,.earthline-swale-label-16149').first();
          if(await hit.count()) await hit.click({force:true});
          await page.waitForTimeout(500);
          const z=page.locator('#earthlineCorridorDetail16149 [data-action="zoom"]').first();
          if(await z.count()) await z.click();
          await page.waitForTimeout(900);
          const prop=page.locator('#earthlineDeclareProperty16169').first();
          if(await prop.count()) await prop.click({timeout:10000});
          await page.waitForFunction(()=>window.EARTHLINE_PROPERTY_RUN_AUDIT_16173?.settled===true,null,{timeout:90000,polling:200});
          const p=await page.evaluate(()=>({tier:document.documentElement.dataset.earthlineAnalysisTier,swales:Array.isArray(M?.swales)?M.swales.length:null,displayed:window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null,status:document.getElementById('earthlineVermontStatus16147')?.textContent||''}));
          console.log('CANDIDATE_PROPERTY '+JSON.stringify(p));
          await run('germany country');
          await page.waitForFunction(()=>window.EARTHLINE_REGIONAL_TERMINAL_16539?.status==='published' && String((window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||{}).tier||'')==='regional',null,{timeout:180000,polling:250});
          const r=await page.evaluate(()=>({tier:document.documentElement.dataset.earthlineAnalysisTier,displayed:window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null,error:window.EARTHLINE_LAST_LIVE_REGIONAL_ERROR_15970||null,terminal:window.EARTHLINE_REGIONAL_TERMINAL_16539||null,status:document.getElementById('earthlineVermontStatus16147')?.textContent||'',report:document.getElementById('earthlineVermontReport16149')?.textContent||''}));
          console.log('CANDIDATE_RETURN '+JSON.stringify(r));
          if(!r.displayed||String(r.displayed.tier||r.displayed.mode)!=='regional'||r.error) process.exitCode=2;
          await browser.close();
          JS
          node candidate-16922-test.mjs

# Mantra 51 final pre-promotion rerun
