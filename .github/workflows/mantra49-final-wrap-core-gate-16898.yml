name: Earthline final wrap core gate 16898
on:
  push:
    branches: [mantra49-final-wrap-16896]
    paths:
      - .github/workflows/mantra49-final-wrap-core-gate-16898.yml
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra49-final-wrap-16896
      - name: Verify NZ bbox camera source repair shape
        run: |
          python tools/apply-nz-camera-16897.py
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          legacy='''    const targetZoom=propertyTarget\n      ?Math.max(17,Number(loc.zoomHint||17))\n      :Math.max(9,Number(loc.zoomHint||12));'''
          if legacy in s: raise SystemExit('FAIL legacy targetZoom owner remains')
          required=[
            'let targetCenter=[Number(loc.lng),Number(loc.lat)];',
            'if(!propertyTarget&&Array.isArray(loc.bbox)&&loc.bbox.length===4',
            'cameraForBounds',
            'center:targetCenter,',
            'Math.min(11,Number(cam.zoom))'
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('FAIL bbox camera repair missing: '+repr(missing))
          print('NZ CAMERA SOURCE CANDIDATE PASS')
          PY
      - name: Install browser
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install playwright@1.55.0 --no-save
      - name: Core-state live regression
        run: |
          cat > core16898.js <<'JS'
          const {chromium}=require('playwright');
          const states=['Arizona','New Mexico','Colorado','Texas','California','Vermont','New York','Maryland'];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function one(b,q){
            const c=await b.newContext({viewport:{width:1600,height:900}}),p=await c.newPage();
            await p.goto('https://earthlinedevelopment.org/?core16898='+encodeURIComponent(q)+'-'+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForSelector('#searchInput',{timeout:30000});await sleep(1500);
            await p.fill('#searchInput',q);
            const waiter=p.evaluate(()=>new Promise(resolve=>{let done=false;const f=(kind,d)=>{if(done)return;done=true;resolve({kind,d,runState:document.documentElement.dataset.earthlineRunState||'',status:document.getElementById('earthlineVermontStatus16147')?.textContent||''})};document.addEventListener('earthline:analysis-complete',e=>f('complete',e.detail));document.addEventListener('earthline:analysis-failed',e=>f('failed',e.detail));setTimeout(()=>f('timeout',{}),55000)}));
            await p.press('#searchInput','Enter');
            const result=await waiter;
            console.log('CORE',q,JSON.stringify(result));await c.close();return result;
          }
          (async()=>{const b=await chromium.launch({headless:true,executablePath:'/usr/bin/chromium',args:['--no-sandbox']});for(const q of states){const r=await one(b,q);if(r.kind!=='complete')throw Error(q+' '+r.kind+' '+r.status)}await b.close();console.log('CORE STATES LIVE PASS')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node core16898.js
