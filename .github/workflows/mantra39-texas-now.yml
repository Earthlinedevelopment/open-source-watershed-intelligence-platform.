name: Mantra 39 Texas Now

on:
  push:
    branches: [mantra39-texas-test]
    paths:
      - 'lab/mantra39-texas-now.mjs'
      - '.github/workflows/mantra39-texas-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texas-now:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Trace Texas production source
        run: node lab/mantra39-texas-now.mjs
      - name: Upload Texas evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mantra39-texas-now
          path: lab-results/mantra39-texas-now.json
          if-no-files-found: warn
          retention-days: 7
