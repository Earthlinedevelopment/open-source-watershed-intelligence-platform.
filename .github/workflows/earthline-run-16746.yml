name: Earthline 16746 Midpoint Coverage Truth
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-run-16746.yml']
permissions:
  contents: write
jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Fetch repair and validator
        run: |
          git fetch origin main
          git show origin/main:lab/apply-16746-midpoint-coverage-truth.py > /tmp/apply-16746.py
          git show origin/main:lab/validate-16731-coverage-gap.mjs > ./validate-16746.mjs
      - name: Apply repair
        run: |
          python3 /tmp/apply-16746.py
          git diff --check
      - name: Publish pages-live
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'repair: require anchored corridor presence for coverage'
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate problem states
        id: validate
        shell: bash
        run: |
          sleep 6
          set +e
          EARTHLINE_URL='https://earthlinedevelopment.org/' STATES='Oklahoma|Maryland|Texas|Louisiana|Florida|New York|Colorado|California' OUT='lab/16746-validation.json' node ./validate-16746.mjs
          code=$?
          echo "pass=$([ "$code" -eq 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record evidence
        run: |
          git pull --rebase origin pages-live
          git add lab/16746-validation.json
          git commit -m 'test: record 16746 anchored coverage validation' || true
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
      - name: Enforce validation
        run: test "${{ steps.validate.outputs.pass }}" = "1"
