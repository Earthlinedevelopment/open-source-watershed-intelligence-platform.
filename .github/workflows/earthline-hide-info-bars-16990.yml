name: Earthline hide floating info bars 16990
on:
  push:
    branches:
      - pages-live
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Hide floating map info bars only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker='earthline-launch-hide-floating-info-bars-16990'
          if marker not in s:
              css='''
<style id="earthline-launch-hide-floating-info-bars-16990">
#earthlineSwaleLegend16050,
#earthlineAquiferLegend16070,
#earthlineDiagramLegend16080{
  display:none!important;
  visibility:hidden!important;
  pointer-events:none!important;
}
</style>
'''
              i=s.lower().rfind('</head>')
              if i<0: raise SystemExit('head close not found')
              s=s[:i]+css+s[i:]
          p.write_text(s,encoding="utf-8")
          PY
          git config user.name "Earthline Build Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "style: hide floating map info bars 16990"
          git push origin HEAD:pages-live
