name: M156 relocate map hint, preserve sequential corridor guidance
on:
  push:
    branches: ['repair/m156-sequential-guidance-right-middle']
    paths: ['.github/workflows/m156-ui.yml']
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch only existing M136 CSS, not both-popups behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          start=s.index('<style id="earthline-m136-regional-layout-only">')
          end=s.index('</style>',start)
          style=s[start:end]
          assert 'body:has(#earthlineTemporaryMapHint126) #earthlineCorridorTip16248.open{' in style
          assert 'display:none!important' in style
          assert 'M156 right-middle temporary map instruction' not in style
          addition="""
          /* M156 right-middle temporary map instruction: preserve the
             M136 one-popup-at-a-time suppression above. */
          #earthlineTemporaryMapHint126{
            left:auto!important;right:20px!important;top:50%!important;bottom:auto!important;
            transform:translateY(-50%)!important;max-width:min(420px,calc(100vw - var(--el-map-left-m136) - 40px))!important;
          }
          @media(max-width:760px){
            #earthlineTemporaryMapHint126{
              left:auto!important;right:10px!important;top:50%!important;
              transform:translateY(-50%)!important;
              max-width:calc(100vw - var(--el-rail-16188,54px) - 20px)!important;
            }
          }
          """
          s=s[:end]+addition+s[end:];p.write_text(s)
          print('M156_ONLY_MAP_POSITION_AND_ONE_POPUP_RULE_RETAINED')
          PY
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate note, suppression, and post-dismissal tab tip at desktop/mobile
        run: |
          cat > /tmp/m156-test.mjs <<'JS'
          import {chromium} from 'playwright';
          import {readFileSync} from 'node:fs';
          const s=readFileSync('index.html','utf8'),css=s.split('<style id="earthline-m136-regional-layout-only">')[1]?.split('</style>')[0];
          if(!css)throw Error('M136 missing');
          const browser=await chromium.launch({headless:true});
          for(const width of [1500,390]){
            const page=await browser.newPage({viewport:{width,height:900}});
            await page.setContent('<style>'+css+'</style><aside id="earthlineTemporaryMapHint126" style="position:fixed;top:96px;left:50%;transform:translateX(-50%);display:flex">Place hand cursor over bare land to move map</aside><aside id="earthlineCorridorTip16248" class="open" style="display:block;position:fixed">Choose a tab</aside>');
            const state=await page.evaluate(()=>{let a=document.getElementById('earthlineTemporaryMapHint126'),b=document.getElementById('earthlineCorridorTip16248'),r=a.getBoundingClientRect();return {r:Math.round(innerWidth-r.right),y:Math.round(r.y+r.height/2),display:getComputedStyle(b).display}});
            if(state.display!=='none'||state.r<0||state.r>30||Math.abs(state.y-450)>25)throw Error('incorrect sequential layout '+width+' '+JSON.stringify(state));
            await page.evaluate(()=>document.getElementById('earthlineTemporaryMapHint126').remove());
            const second=await page.evaluate(()=>getComputedStyle(document.getElementById('earthlineCorridorTip16248')).display);
            if(second==='none')throw Error('Choose a tab still hidden after note dismissed at '+width);
            console.log('M156_UI_PASS '+JSON.stringify({width,note:state,tabTipAfterDismiss:second}));
            await page.close();
          }
          await browser.close();
          JS
          cp /tmp/m156-test.mjs ./m156-test.mjs
          node m156-test.mjs
      - name: Commit UI-only candidate after success
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(ui): move temporary navigation note right-middle without overlapping tab tip"
          git push origin HEAD:repair/m156-sequential-guidance-right-middle
