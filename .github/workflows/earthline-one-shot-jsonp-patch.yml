name: Earthline one-time bounded JSONP callback guard
on:
  push:
    branches:
      - fix/final-mobile-panel-release-proof-20261128
    paths:
      - tools/earthline-jsonp-late-callback-patch.py
permissions:
  contents: write
jobs:
  candidate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair late JSONP callback cleanup on exact candidate
        run: python3 tools/earthline-jsonp-late-callback-patch.py
      - name: Retire temporary updater before validation
        run: git rm .github/workflows/earthline-one-shot-jsonp-patch.yml
      - name: Validate HTML/JS without changing science
        run: |
          git diff --check
          python3 tools/earthline-release-airlock-static.py
      - name: Commit to isolated candidate only
        run: |
          set -euo pipefail
          git config user.name "Earthline candidate repair"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix(transport): guard late JSONP response without modifying safety evidence"
          git push origin HEAD:refs/heads/fix/final-mobile-panel-release-proof-20261128
