name: Mantra 51 Final Three Surface Runtime Review
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-final-three-surface-runtime-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - run: python3 -m http.server 8787 >/tmp/el-http.log 2>&1 &
      - name: Review informational surfaces and report shell
        run: |
          cat > final-review.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:1100}});
          await page.goto('http://127.0.0.1:8787/index.html?finalreview='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForSelector('#earthlineHamburgerMenu16233 a[href="#swales-explained"]',{state:'attached',timeout:30000});
          await page.waitForTimeout(1200);
          await page.evaluate(()=>{location.hash='#swales-explained';window.dispatchEvent(new HashChangeEvent('hashchange'));});
          await page.waitForSelector('#earthlineSwalesPage16125.open',{timeout:10000});
          await page.waitForTimeout(500);
          const swInfo=await page.evaluate(()=>{
            const sw=document.getElementById('earthlineSwalesPage16125');
            const iframe=sw?.querySelector('iframe');
            let text='',sources=0;
            try{const doc=iframe?.contentDocument;text=doc?.body?.innerText||'';sources=doc?.querySelectorAll('.el12-source-list p').length||0}catch{}
            return {text,sources,z:sw?getComputedStyle(sw).zIndex:null};
          });
          console.log(JSON.stringify({swalesTextLength:swInfo.text.length,swalesSources:swInfo.sources,swalesZ:swInfo.z},null,2));
          if(!/How Bioswales Work/i.test(swInfo.text)) throw new Error('Swales Explained canonical narrative missing');
          if(!/Corrections Registry/i.test(swInfo.text)) throw new Error('Swales Explained Corrections Registry missing');
          if(Number(swInfo.z)<50000) throw new Error('Swales Explained layering too low');
          await page.evaluate(()=>window.earthlineCloseSwalesExplained16125?.());
          await page.evaluate(()=>{location.hash='#earthline-process';window.dispatchEvent(new HashChangeEvent('hashchange'));});
          await page.waitForSelector('#earthlineProcessPage16265.open',{timeout:10000});
          const processInfo=await page.evaluate(()=>{
            const p=document.getElementById('earthlineProcessPage16265');
            return {text:p?.innerText||'',z:p?getComputedStyle(p).zIndex:null};
          });
          if(!/Sources/i.test(processInfo.text)) throw new Error('Earthline Process sources missing');
          if(Number(processInfo.z)<50000) throw new Error('Earthline Process layering too low');
          const staticAudit=await page.evaluate(()=>{
            const src=[...document.scripts].map(s=>s.textContent||'').join('\n');
            return {
              reportNoFullHBW:!src.includes('${howBioswalesReportPages16388(data)}'),
              reportNoCorrectionsDup:!src.includes('${EARTHLINE_CORRECTIONS_REGISTRY_16513}'),
              finalSources:src.includes('el16864-final-sources'),
              elevationLabels:src.includes('el-report-contour-label'),
              waterStroke:src.includes('#178fc4'),
              aquiferFill:src.includes('rgba(35,126,196,.11)')
            };
          });
          console.log(JSON.stringify({processTextLength:processInfo.text.length,processZ:processInfo.z,staticAudit},null,2));
          if(Object.values(staticAudit).some(v=>!v)) throw new Error('report runtime owner mismatch');
          await browser.close();
          JS
          node final-review.mjs
