name: Earthline report map candidate 16969
on:
  push:
    branches: [report-map-candidate-16967]
    paths:
      - '.github/workflows/report-map-candidate-16969.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: report-map-candidate-16967
      - name: Refine corridor hierarchy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("el-report-landscape-plan-16968","el-report-landscape-plan-16969")
          s=s.replace("elClip16968","elClip16969").replace("elAq16968","elAq16969").replace("elGround16968","elGround16969").replace("elSoft16968","elSoft16969").replace("elArrow16968","elArrow16969")
          s=s.replace("Math.min(small?10:16,flowRank.length)","Math.min(small?8:12,flowRank.length)")
          s=s.replace("Math.min(major.length+(small?12:22),flowRank.length)","Math.min(major.length+(small?8:14),flowRank.length)")
          s=s.replace('stroke="#6f7b73" stroke-width=".55" opacity=".18"','stroke="#6f7b73" stroke-width=".50" opacity=".15"')

          old="""const draw=r=>{const dp=path(r.f);if(!dp)return;
              if(r.grade==='C'){parts.push('<path d="'+dp+'" fill="none" stroke="#8e826c" stroke-width=".70" opacity=".12" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');return}
              if(r.grade==='B'){parts.push('<path d="'+dp+'" transform="translate(0 1.2)" fill="none" stroke="#536d57" stroke-width="7.3" opacity=".07" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#d4e0cf" stroke-width="6.6" opacity=".58" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#f0f4ec" stroke-width="3.8" opacity=".84" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#677a5e" stroke-width=".85" opacity=".68" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');return}
              parts.push('<path d="'+dp+'" transform="translate(0 1.8)" fill="none" stroke="#536d57" stroke-width="12.5" opacity=".11" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#a9c59d" stroke-width="11.5" opacity=".88" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#edf3e8" stroke-width="7.2" opacity=".96" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#355f40" stroke-width=".95" opacity=".92" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" transform="translate(-1.45 -1.45)" fill="none" stroke="#4ba5bf" stroke-width=".72" opacity=".96" stroke-dasharray="2 3.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" transform="translate(1.45 1.45)" fill="none" stroke="#4ba5bf" stroke-width=".72" opacity=".96" stroke-dasharray="2 3.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>')
            };
            for(const r of rows.filter(r=>r.grade==='C'))draw(r);for(const r of rows.filter(r=>r.grade==='B'))draw(r);for(const r of rows.filter(r=>r.grade==='A'))draw(r);"""
          new="""const draw=(r,priority=true)=>{const dp=path(r.f);if(!dp)return;
              if(r.grade==='C'){parts.push('<path d="'+dp+'" fill="none" stroke="#8e826c" stroke-width=".52" opacity=".045" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');return}
              if(r.grade==='B'){parts.push('<path d="'+dp+'" fill="none" stroke="#71826b" stroke-width=".72" opacity=".14" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');return}
              if(!priority){parts.push('<path d="'+dp+'" fill="none" stroke="#5f785f" stroke-width="1.05" opacity=".23" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');return}
              parts.push('<path d="'+dp+'" transform="translate(0 1.25)" fill="none" stroke="#526b56" stroke-width="10.2" opacity=".08" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#9fbe94" stroke-width="9.2" opacity=".86" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#edf3e8" stroke-width="5.7" opacity=".96" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#355f40" stroke-width=".82" opacity=".90" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" transform="translate(-1.20 -1.20)" fill="none" stroke="#43a1bd" stroke-width=".66" opacity=".94" stroke-dasharray="1.8 3.1" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" transform="translate(1.20 1.20)" fill="none" stroke="#43a1bd" stroke-width=".66" opacity=".94" stroke-dasharray="1.8 3.1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>')
            };
            for(const r of rows.filter(r=>r.grade==='C'))draw(r);
            for(const r of rows.filter(r=>r.grade==='B'))draw(r);
            const aRows=rows.filter(r=>r.grade==='A');
            const priorityLimit=small?6:10;
            for(let i=0;i<aRows.length;i++)draw(aRows[i],i<priorityLimit);"""
          if old not in s:
              raise SystemExit("16968 corridor grammar not found")
          s=s.replace(old,new,1)
          s=s.replace("rows.filter(r=>r.grade==='A').slice(0,8)","aRows.slice(0,priorityLimit)")
          s=s.replace('stroke="#a9c59d" stroke-width="9" opacity=".88"','stroke="#9fbe94" stroke-width="8" opacity=".86"')
          s=s.replace('stroke="#355f40" stroke-width=".95"','stroke="#355f40" stroke-width=".82"')
          p.write_text(s,encoding="utf-8")
          PY
      - name: Validate and commit candidate
        shell: bash
        run: |
          grep -q "el-report-landscape-plan-16969" index.html
          grep -q "priorityLimit=small?6:10" index.html
          grep -q "opacity=\".045\"" index.html
          git config user.name "Earthline Mantra 54"
          git config user.email "info@earthlinedevelopment.org"
          git rm -f .github/workflows/report-map-candidate-16969.yml .github/workflows/property-control-audit-16968.yml
          git add index.html
          git commit -m "candidate: quiet corridor hierarchy 16969"
          git push origin report-map-candidate-16967
