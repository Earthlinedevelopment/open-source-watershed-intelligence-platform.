name: Earthline aquifer swale live diagnostic
on:
  push:
    branches: [diagnostic/aquifer-swale-visibility-20261115]
    paths: [.github/workflows/aquifer-swale-visibility-20261115.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check tests/aquifer-swale-visibility-20261115.mjs
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node tests/aquifer-swale-visibility-20261115.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthline-aquifer-swale-visibility-20261115
          path: artifacts/aquifer-swale
          retention-days: 14
