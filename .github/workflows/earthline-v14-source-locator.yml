name: Earthline v1.4 globe source locator
on:
  push:
    branches: [diagnose/v14-globe-root-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Locate startup globe and status hooks in accepted base
        run: python3 tests/locate-v14-globe.py
