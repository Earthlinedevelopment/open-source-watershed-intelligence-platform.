name: Earthline Exact Three-State 17576 # 9483cb7d3c9e
on:
  push:
    branches: [test/exclusion-three-17576]
    paths:
      - '.github/workflows/earthline-exact-three-state-17576.yml'
      - 'lab/validate-16728-property-50states.mjs'
  workflow_dispatch:
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/exclusion-three-17576
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Fetch exact candidate index
        run: |
          git fetch origin candidate/earthline-launch-17576
          git show origin/candidate/earthline-launch-17576:index.html > /tmp/earthline-17576-index.html
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run exact three-state candidate gate
        run: |
          LOCAL_INDEX='/tmp/earthline-17576-index.html' EARTHLINE_URL='https://earthlinedevelopment.org/' STATES='Alaska|Minnesota|Mississippi' OUT='property-three-exact-17576.json' node lab/validate-16728-property-50states.mjs
