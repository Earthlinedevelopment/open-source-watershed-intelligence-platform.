name: Mantra 51 Inspect Terminal Property Binding
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-inspect-terminal-property-binding.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needles=[
            "terminalPropertyRun)",
            "terminalPropertyRun,",
            "terminalPropertyRun;",
            "terminalPropertyRun}",
            "earthlineDeclarePropertyAtCrosshair16173()",
            "earthlineDeclarePropertyAtCrosshair16173(",
            "dataset.terminalOwner",
            "terminalOwner"
          ]
          for needle in needles:
            print("\n###",needle)
            p=0;n=0
            while n<40:
              i=s.find(needle,p)
              if i<0:break
              print(s[max(0,i-1400):min(len(s),i+2400)].replace("\n"," "))
              print("---");p=i+len(needle);n+=1
          PY
