name: Earthline Live First-Press Crosshair Validation
'on':
  push:
    branches:
      - candidate-next
    paths:
      - tests/live-first-press-crosshair.mjs
      - .github/workflows/earthline-live-first-press-crosshair.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/live-first-press-crosshair.mjs
      - name: Commit visual evidence
        run: |
          git config user.name "earthline-bot"
          git config user.email "info@earthlinedevelopment.org"
          git add tests/live-arizona-first.jpg tests/live-arizona-second.jpg
          git commit -m "test: record live Arizona visual evidence" || exit 0
          git push origin HEAD:candidate-next
