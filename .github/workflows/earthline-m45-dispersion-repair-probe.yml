name: Earthline 16844 Exact-Parent Production Deploy Fallback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-m45-dispersion-repair-probe.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Assert exact live 16843 parent
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          EXPECTED=ed52b565bef53cd76bb359e731fc812da3b1f1fc
          echo "actual=$ACTUAL expected=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"
      - name: Apply exact tested 16844 patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:lab/apply-16844-final-supported-capacity.py > /tmp/apply-16844.py
          python3 /tmp/apply-16844.py index.html
          git diff --check
          test "$(grep -F -c 'EARTHLINE 16844 — FINAL FINE-SUPPORT REGIONAL CAPACITY' index.html)" = "1"
          test "$(grep -F -c 'Math.min(54,Math.max(0,Math.floor((fineSupportCells16755.size-baseRegionalCapacity16755)*.75)))' index.html)" = "1"
      - name: Publish exact-parent 16844
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Earthline CI'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'repair: deploy 16844 final fine-supported Regional capacity'
          NEW=$(git rev-parse HEAD)
          PARENT=$(git rev-parse HEAD^)
          test "$PARENT" = 'ed52b565bef53cd76bb359e731fc812da3b1f1fc'
          git push origin HEAD:pages-live
          echo "new=$NEW parent=$PARENT"
