name: Mantra 46 16788 Priority Terrain A-B

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/mantra46-16788-priority-terrain-ab.mjs'
      - '.github/workflows/earthline-m46-16788-priority-terrain-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  priority-terrain-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run prioritized terrain A-B
        run: node tests/mantra46-16788-priority-terrain-ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16788-priority-terrain-ab
          path: artifacts/mantra46-16788-ab/
          if-no-files-found: warn
