name: Earthline Overpass Exact Owner Audit
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-overpass-exact-owner-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - name: Extract exact Overpass owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for exact in ["async function earthlineFetchOverpass15862P","function earthlineFetchOverpass15862P"]:
              i=s.find(exact)
              if i>=0:
                  print(s[max(0,i-1000):min(len(s),i+18000)])
                  break
          PY
