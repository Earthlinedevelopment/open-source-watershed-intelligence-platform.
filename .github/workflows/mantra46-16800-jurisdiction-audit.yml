name: Mantra 46 16800 Jurisdiction-Aware Coverage Audit

on:
  push:
    branches:
      - diagnostic-m46-16800-jurisdiction-audit
    paths:
      - 'tests/mantra46-16800-jurisdiction-audit.mjs'
      - '.github/workflows/mantra46-16800-jurisdiction-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run jurisdiction-aware coverage audit
        run: node tests/mantra46-16800-jurisdiction-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16800-jurisdiction-audit
          path: artifacts/mantra46-16800-jurisdiction-audit/
          if-no-files-found: error
