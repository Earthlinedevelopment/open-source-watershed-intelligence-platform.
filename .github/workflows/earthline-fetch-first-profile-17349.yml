name: Earthline Fetch First Phase Profile 17349
on:
  push:
    branches: [repair/browser-performance-live-17268]
    paths:
      - '.github/workflows/earthline-fetch-first-profile-17349.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/browser-performance-live-17268}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          python3 tests/apply-browser-yield-fastpath-17295.py
          python3 tests/apply-wasm-pip-kernel-17319.py
          python3 tests/apply-certified-interior-supertile-17301.py
          python3 tests/apply-skip-regional-preferred-screen-17305.py
          python3 tests/apply-run-scoped-segment-clip-cache-17315.py
          python3 tests/apply-consolidated-provisional-jurisdiction-17325.py
          python3 tests/apply-scale-fetch-first-17348.py
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps firefox
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: xvfb-run -a env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='firefox' HEADLESS='false' STATE='Texas' node tests/browser-refinement-dump-17344.mjs
  webkit:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/browser-performance-live-17268}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          python3 tests/apply-browser-yield-fastpath-17295.py
          python3 tests/apply-wasm-pip-kernel-17319.py
          python3 tests/apply-certified-interior-supertile-17301.py
          python3 tests/apply-skip-regional-preferred-screen-17305.py
          python3 tests/apply-run-scoped-segment-clip-cache-17315.py
          python3 tests/apply-consolidated-provisional-jurisdiction-17325.py
          python3 tests/apply-scale-fetch-first-17348.py
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - run: |
          python3 -m http.server 8787 --bind 0.0.0.0 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='webkit' HEADLESS='false' STATE='Texas' node tests/browser-refinement-dump-17344.mjs
