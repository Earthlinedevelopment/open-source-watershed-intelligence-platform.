name: Mantra 51 Inspect Alaska Drag Owner
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-inspect-alaska-drag-owner.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: mantra51-global-repair-campaign}
      - name: Inspect drag and camera owners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needles=["dragPan.disable","dragPan.enable","scrollZoom.disable","doubleClickZoom.disable","boxZoom.disable","keyboard.disable","touchZoomRotate.disable","map.on(\"drag","map.on('drag","moveend","setMaxBounds","maxBounds","earthlineCancelSearchCameraLock"]
          for needle in needles:
            print("\n===== "+needle+" =====")
            pos=0; count=0
            while count<30:
              i=s.find(needle,pos)
              if i<0: break
              print(s[max(0,i-1800):min(len(s),i+4200)].replace("\n"," "))
              print("\n---")
              pos=i+len(needle);count+=1
          PY
