name: Earthline Hotfix Candidate 17486 Final
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/earthline-hotfix-17485.yml'
      - 'tests/hotfix-live-origin-17485.mjs'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  live-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/earthline-launch-17486, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/hotfix-live-origin-17485.mjs > tests/hotfix-live-origin-17485.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/hotfix-live-origin-17485.mjs
