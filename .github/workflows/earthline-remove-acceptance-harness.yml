name: Earthline Remove Acceptance Harness
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['tools/mantra74-remove-acceptance-harness.py']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          fetch-depth: 0
      - run: python3 tools/mantra74-remove-acceptance-harness.py
      - name: Validate active owner preservation
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          for(const good of [
            'id="earthline-build-15824-direct-water-overlay"',
            'id="earthline-build-15827-visible-analysis-boundary"',
            'function run15786(ev)',
            'async function runProperty15778(parent,anchor)',
            'function earthlineRecoveryPreflight15870()',
            'window.earthlineApplyRendererOwnership15805=',
            'window.earthlineSyncLivingSwales15792=syncLivingSwales15792;'
          ])if(!s.includes(good))throw Error('active owner missing: '+good);
          for(const bad of [
            'earthline-build-15882-display-proof-controller',
            'earthlineRestoreSwales15882',
            'earthlineRunEssexAcceptance15847',
            'earthlineRunViewportTest15822',
            'earthlineAuthorityAudit15872',
            'earthlineReloadAudit15873'
          ])if(s.includes(bad))throw Error('retired harness remains: '+bad);
          console.log('EARTHLINE_17660_INLINE_SCRIPTS_OK',parsed);
          NODE
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Earthline Stability Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git rm -f tools/mantra74-remove-acceptance-harness.py .github/workflows/earthline-remove-acceptance-harness.yml
          git add index.html
          git commit -m "stability: remove obsolete acceptance and display recovery harnesses"
          git push origin HEAD:recovery/mantra74-stability
