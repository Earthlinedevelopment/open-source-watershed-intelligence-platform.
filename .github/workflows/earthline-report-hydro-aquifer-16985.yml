name: Earthline hydrology aquifer report 16985
on:
  push:
    branches:
      - pages-live
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Apply report map update
        run: |
          python .github/scripts/earthline_report_hydro_aquifer_16985.py
          git config user.name "Earthline Build Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "style: hydrology and aquifer context report map 16985"
          git push origin HEAD:pages-live
