name: Earthline process overlay audit
on:
  push:
    branches: [pages-live]
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Locate process panel ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for n in ["The Earthline Process","EARTHLINE PROCESS","Earthline Process","processPanel","ProcessPanel","earthlineProcess","earthline-process","process-open","processOpen","openProcess","earthlineLaunchLogin16872","earthlineLaunchDonate16872","earthlineLaunchMerch16872"]:
              print("\n###",n)
              start=0
              for _ in range(16):
                  i=s.find(n,start)
                  if i<0: break
                  print("---",i,"---")
                  print(s[max(0,i-2200):min(len(s),i+4200)])
                  start=i+len(n)
          PY
