name: Earthline Property Coverage Patch 17233
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - '.github/workflows/earthline-property-coverage-patch-17233.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
          fetch-depth: 0
      - name: Apply fair contour-level candidate budget
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='EARTHLINE_PROPERTY_FULL_LEVEL_COVERAGE_17233'
          if marker not in s:
              old1="const primaryLimit15836=Math.min(work15771.maxCandidates,Math.max(1,canonicalPaths15836.length));"
              new1="const contourReserve17233=isRegionalTile15769?0:Math.min(levels.length,Math.max(0,work15771.maxCandidates-1));\n    const primaryLimit15836=Math.min(\n      Math.max(0,work15771.maxCandidates-contourReserve17233),\n      Math.max(1,canonicalPaths15836.length)\n    ); /* EARTHLINE_PROPERTY_FULL_LEVEL_COVERAGE_17233 */"
              if s.count(old1)!=1: raise SystemExit('primary limit anchor count '+str(s.count(old1)))
              s=s.replace(old1,new1,1)
              old2="      const seeds=selectedSeeds15841.slice(0,work15771.maxSeedsPerLevel);\n      /* BUILD-CHECK-15803-DIAGNOSTIC-BEGIN */"
              new2="      const seeds=selectedSeeds15841.slice(0,work15771.maxSeedsPerLevel);\n      const remainingLevels17233=Math.max(1,levels.length-li);\n      const remainingSlots17233=Math.max(0,work15771.maxCandidates-swales.length);\n      const levelCandidateBudget17233=isRegionalTile15769\n        ? work15771.perLevel\n        : Math.max(0,Math.min(work15771.perLevel,Math.ceil(remainingSlots17233/remainingLevels17233)));\n      /* BUILD-CHECK-15803-DIAGNOSTIC-BEGIN */"
              if s.count(old2)!=1: raise SystemExit('seed anchor count '+str(s.count(old2)))
              s=s.replace(old2,new2,1)
              old3="if(acceptedAtLevel>=work15771.perLevel)break;"
              new3="if(acceptedAtLevel>=levelCandidateBudget17233)break;"
              if s.count(old3)!=2: raise SystemExit('per-level break count '+str(s.count(old3)))
              s=s.replace(old3,new3)
              p.write_text(s,encoding='utf-8')
          s=p.read_text(encoding='utf-8')
          assert s.count('EARTHLINE_PROPERTY_FULL_LEVEL_COVERAGE_17233')==1
          assert s.count('acceptedAtLevel>=levelCandidateBudget17233')==2
          assert 'const remainingLevels17233=' in s
          # EARTHLINE_CORRIDOR_TIP_PUBLICATION_BRIDGE_17238
          # Restore the existing one-time Regional A4 onboarding owner's evidence gate
          # to the current authoritative corridor publication audit. No new owner,
          # listener, timer, renderer, hydrology rule, or browser-specific behavior.
          old_tip="clickable=document.querySelectorAll('.earthline-swale-label-16149,.earthline-swale-hit-16070').length,regionalEvidence=clickable>0||Number(d?.derived?.swaleOpportunityLines||0)>0||Number(d?.corridorCount||0)>0"
          new_tip="clickable=document.querySelectorAll('.earthline-swale-label-16149,.earthline-swale-hit-16070').length,publicationGenerated16248=Number(window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167?.generated||0),regionalEvidence=clickable>0||publicationGenerated16248>0||Number(d?.derived?.swaleOpportunityLines||0)>0||Number(d?.corridorCount||0)>0"
          s=p.read_text(encoding='utf-8')
          if 'EARTHLINE_CORRIDOR_TIP_PUBLICATION_BRIDGE_17238' not in s:
              if s.count(old_tip)!=1: raise SystemExit('corridor tip evidence anchor count '+str(s.count(old_tip)))
              s=s.replace(old_tip,new_tip,1)
              banner="<!-- EARTHLINE_CORRIDOR_TIP_PUBLICATION_BRIDGE_17238 — Existing Regional A4 onboarding tip now recognizes the authoritative current corridor publication audit; preserves once-per-page-load acknowledgment behavior. -->\n"
              s=banner+s
              p.write_text(s,encoding='utf-8')
          s=p.read_text(encoding='utf-8')
          assert s.count('EARTHLINE_CORRIDOR_TIP_PUBLICATION_BRIDGE_17238')==1
          assert 'publicationGenerated16248=Number(window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167?.generated||0)' in s


          # EARTHLINE_COUNTRY_PROPERTY_LINEAGE_17240
          # Crosshair Property targets must retain their Regional parent lineage, and
          # late country-context completion must never overwrite a user-moved crosshair.
          s=p.read_text(encoding='utf-8')
          marker_country='EARTHLINE_COUNTRY_PROPERTY_LINEAGE_17240'
          if marker_country not in s:
              anchor_set="function setPropertyTarget16201(target,options={}){if(!target||!Number.isFinite(Number(target.lng))||!Number.isFinite(Number(target.lat)))return false;const displayed16347="
              pset=s.rfind(anchor_set)
              if pset<0: raise SystemExit('active setPropertyTarget16201 anchor not found')
              replacement="function setPropertyTarget16201(target,options={}){if(!target||!Number.isFinite(Number(target.lng))||!Number.isFinite(Number(target.lat)))return false;if(String(target.source||'')==='country-center'&&window.EARTHLINE_COUNTRY_TARGET_USER_UNLOCKED_17240===true)return true;/* EARTHLINE_COUNTRY_PROPERTY_LINEAGE_17240 */const previousTarget17240=window.EARTHLINE_PROPERTY_TARGET_16201||null;const displayed16347="
              s=s[:pset]+s[pset:].replace(anchor_set,replacement,1)
              old_parent="parentRunToken16347=target.parentRunToken?String(target.parentRunToken):(target.code&&displayedTier16347==='regional'?String(displayed16347&&displayed16347.runToken||''):'');"
              new_parent="parentRunToken16347=target.parentRunToken?String(target.parentRunToken):(displayedTier16347==='regional'?String(displayed16347&&displayed16347.runToken||''):String(previousTarget17240&&previousTarget17240.parentRunToken||''));"
              ppar=s.find(old_parent,pset)
              if ppar<0: raise SystemExit('active parentRunToken anchor not found')
              s=s[:ppar]+s[ppar:].replace(old_parent,new_parent,1)

              # User map interaction permanently unlocks the country-center target for
              # the current country run; late context cannot relock it.
              unlock="window.EARTHLINE_COUNTRY_TARGET_LOCK_16845=false;"
              punlock=s.find(unlock,pset)
              if punlock<0: raise SystemExit('country unlock anchor not found')
              s=s[:punlock]+s[punlock:].replace(unlock,"window.EARTHLINE_COUNTRY_TARGET_USER_UNLOCKED_17240=true;"+unlock,1)

              # Reset the user-unlocked latch only when a new governed country Regional
              # run starts.
              country_anchor="let countryPackage16845=null;\n    if(countryRequest16845){"
              pcountry=s.rfind(country_anchor,0,pset)
              if pcountry<0: raise SystemExit('country run-start anchor not found')
              s=s[:pcountry]+s[pcountry:].replace(country_anchor,country_anchor+"\n      window.EARTHLINE_COUNTRY_TARGET_USER_UNLOCKED_17240=false;",1)
              p.write_text(s,encoding='utf-8')

          s=p.read_text(encoding='utf-8')
          assert s.count('EARTHLINE_COUNTRY_PROPERTY_LINEAGE_17240')==1
          assert "window.EARTHLINE_COUNTRY_TARGET_USER_UNLOCKED_17240=true;window.EARTHLINE_COUNTRY_TARGET_LOCK_16845=false;" in s
          assert "displayedTier16347==='regional'?String(displayed16347&&displayed16347.runToken||''):String(previousTarget17240&&previousTarget17240.parentRunToken||'')" in s
          PY
          git diff --check
          test "$(git diff --name-only)" = "index.html"
      - name: Commit isolated candidate
        shell: bash
        run: |
          git config user.name "earthline-release-bot"
          git config user.email "earthline-release-bot@users.noreply.github.com"
          git add index.html
          git commit -m "repair: preserve country crosshair Property lineage 17240"
          git pull --rebase origin repair/v1-property-coverage-17223
          git push origin HEAD:repair/v1-property-coverage-17223
