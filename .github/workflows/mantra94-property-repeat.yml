name: M94 independent pinned Property repeat integrity
on:
  push:
    branches: [validation/mantra94-property-only-20261102]
    paths:
      - .github/workflows/mantra94-property-repeat.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  property-repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/mantra94-property-pinned.mjs
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Arizona Regional to two pinned Property results
        run: node tests/mantra94-property-pinned.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m94-property-pinned-evidence
          path: artifacts/arizona-controls
          retention-days: 7
