name: M132 map-style readiness owner inspection
on:
  push:
    branches: [candidate/mantra132-exclusion-engineering]
    paths: [.github/workflows/mantra132-map-style-inspect.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          for term in ['map-inactive','readinessWait','styleQueryAttempted16516','earthlineWaitForStyle','style-ready','loaded-style-first','all-attempted-open-data-exclusion-sources-failed']:
            print('M132_STYLE_TERM',term,'count',s.count(term))
            idx=0
            for n in range(min(3,s.count(term))):
              p=s.find(term,idx)
              print('M132_STYLE_CONTEXT',term,repr(s[max(0,p-1500):p+3200]))
              idx=p+len(term)
          PY
