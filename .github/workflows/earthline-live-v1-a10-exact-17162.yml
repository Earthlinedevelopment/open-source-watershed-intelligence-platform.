name: Earthline Live V1 Exact A10 17162
on:
  push:
    branches: [research/elder-browser-engine-17129]
    paths:
      - 'tests/live-v1-a10-exact-17162.mjs'
      - '.github/workflows/earthline-live-v1-a10-exact-17162.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/live-v1-a10-exact-17162.mjs
