name: Mantra 51 Apply Country Crosshair Persistence
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - 'lab/mantra51-fix-country-crosshair-persistence.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra51-global-repair-campaign
          fetch-depth: 0
      - name: Apply NZ interactive crosshair release fix
        run: python3 lab/mantra51-fix-country-crosshair-persistence.py
      - name: Verify interactive country target owner
        run: |
          grep -n "EARTHLINE_COUNTRY_TARGET_LOCK_16845" index.html
          grep -n "EARTHLINE_COUNTRY_CROSSHAIR_UNLOCK_BOUND_16845" index.html
          grep -n "source:'country-center'" index.html
          grep -n "source:'crosshair'" index.html
      - name: Commit candidate index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change required"
            exit 0
          fi
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: release NZ country target to user crosshair movement"
          git push origin HEAD:mantra51-global-repair-campaign
