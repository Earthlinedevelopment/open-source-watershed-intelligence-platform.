name: Earthline report map font pass 16986
on:
  push:
    branches:
      - pages-live
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Increase report map typography only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          a=s.index("function mapSvg(d,small=false){")
          b=s.index("  return parts.join('');\n}",a)+len("  return parts.join('');\n}")
          fn=s[a:b]
          if "el-report-hydro-aquifer-16985" not in fn:
              raise SystemExit("16985 report renderer missing")
          fn=fn.replace("el-report-hydro-aquifer-16985","el-report-hydro-aquifer-16986",1)
          changes=[
            ('font-size="12.2"','font-size="14.5"'),
            ('font-size="6.2"','font-size="8.1"'),
            ('font-size="5.7" font-weight="700"','font-size="7.3" font-weight="700"'),
            ('font-size="6.7" font-weight="850"','font-size="8.5" font-weight="850"'),
            ('font-size="8.1" font-weight="850"','font-size="10.8" font-weight="850"'),
            ('font-size="7.1" font-weight="800"','font-size="9.1" font-weight="800"'),
            ('font-size="5.5"','font-size="7.2"'),
            ('font-size="7.5" font-weight="850"','font-size="9.8" font-weight="850"'),
            ('font-size="6.1"','font-size="8.0"'),
            ('font-size="5.8"','font-size="7.6"'),
            ('font-size="5.7" font-weight="800"','font-size="7.5" font-weight="800"'),
            ('font-size="5.4"','font-size="7.1"'),
            ('font-size="5.1"','font-size="6.8"')
          ]
          for old,new in changes:
              if old not in fn:
                  raise SystemExit("missing typography token: "+old)
              fn=fn.replace(old,new)
          out=s[:a]+fn+s[b:]
          if "el-report-hydro-aquifer-16986" not in out:
              raise SystemExit("16986 marker missing")
          p.write_text(out,encoding="utf-8")
          PY
          git config user.name "Earthline Build Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "style: enlarge report map typography 16986"
          git push origin HEAD:pages-live
