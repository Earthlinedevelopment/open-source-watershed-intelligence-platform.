name: Mantra 51 Extract Regional Aquifer Flow Publish
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths: ['.github/workflows/mantra51-extract-regional-aquifer-flow.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: mantra51-global-repair-campaign}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needles=[
            "M.usgsAquifers=",
            "loadAquifer",
            "fetchAquifer",
            "IDS.aquifer",
            "guardedSetGeo(runToken,m,IDS.aquifer",
            "regionalRecharge16492",
            "EARTHLINE_ACCEPTED_REGIONAL_AQUIFER_GEOJSON_16373",
            "let flows=makeFlows(hy)"
          ]
          for needle in needles:
            print("\n===== "+needle+" =====")
            pos=0; count=0
            while count<12:
              i=s.find(needle,pos)
              if i<0: break
              print(s[max(0,i-5000):min(len(s),i+12000)].replace("\n"," "))
              print("\n---")
              pos=i+len(needle);count+=1
          PY
