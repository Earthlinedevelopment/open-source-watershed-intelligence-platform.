name: Mantra 92 recovery gate
on:
  push:
    branches: [mantra92-recovery]
    paths:
      - index.html
      - tests/mantra92-recovery-gate.mjs
      - .github/workflows/mantra92-recovery-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Current live production baseline
        run: node tests/mantra92-recovery-gate.mjs
      - name: Same-origin candidate regression and performance
        if: always()
        run: CANDIDATE=1 node tests/mantra92-recovery-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra92-recovery-evidence
          path: artifacts/mantra92/recovery
          retention-days: 14
