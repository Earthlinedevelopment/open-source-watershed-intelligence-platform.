name: Earthline Land Validity Performance Trace
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths: ['tests/trace-land-validity-performance.py','.github/workflows/earthline-land-validity-performance.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tests/trace-land-validity-performance.py
