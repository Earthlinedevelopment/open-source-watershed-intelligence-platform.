name: Earthline M76 Primary Reach Trace
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-primary-reach-trace.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Trace primary reach through publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['earthlineLocalContourReachM76(rawSeg15836,path15836)','primaryFlowFirst15836','function earthlineSwaleFromPts','earthlineSwaleFromPts(seg15836','kept.push','swales.push']:
              print('\n===== '+needle+' =====')
              for m in list(re.finditer(re.escape(needle),s))[:8]:
                  i=m.start(); print(s[max(0,i-1800):min(len(s),i+4200)])
          PY
