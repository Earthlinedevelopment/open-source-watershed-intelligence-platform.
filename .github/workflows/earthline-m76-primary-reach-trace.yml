name: Earthline M76 Deterministic Property Repair
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-primary-reach-trace.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Remove wall-clock selection from Property
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='const deadline15771=started+work15771.maxMs;'
          new='const deadline15771=isRegionalTile15769?(started+work15771.maxMs):Number.POSITIVE_INFINITY;'
          if s.count(old)!=1:
              raise SystemExit('deadline owner count '+str(s.count(old)))
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and publish
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const deadline15771=isRegionalTile15769?(started+work15771.maxMs):Number.POSITIVE_INFINITY;' index.html
          grep -q 'function earthlineCrossSlopeLocalGuardM76' index.html
          node -e "const fs=require('fs'),s=fs.readFileSync('index.html','utf8');for(const m of s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)){if(m[1].trim())new Function(m[1])};console.log('M76_DETERMINISTIC_PROPERTY_OK')"
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: make Property swale selection deterministic"
          git push origin HEAD:pages-live
