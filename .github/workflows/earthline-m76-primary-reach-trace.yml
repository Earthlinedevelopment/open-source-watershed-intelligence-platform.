name: Earthline M76 Cross-Slope Repair
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-primary-reach-trace.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Patch Property cross-slope guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='function earthlineCrossSlopeLocalGuardM76(seg){'
          anchor='function earthlineLocalContourReachM76(seg,path){'
          helper="""/* EARTHLINE M76H — Property swales must stay locally cross-slope. */
          function earthlineCrossSlopeLocalGuardM76(seg){
            if(!Array.isArray(seg)||seg.length<3)return false;
            const along=[];
            for(let i=1;i<seg.length;i++){
              const a=seg[i-1],b=seg[i];
              const mx=(Number(a[0])+Number(b[0]))/2,my=(Number(a[1])+Number(b[1]))/2;
              const x=Math.max(1,Math.min(GW-2,Math.round(mx))),y=Math.max(1,Math.min(GH-2,Math.round(my)));
              const sp=Math.max(0,Number(slopePct(x,y)||0));
              if(sp<1.0)continue;
              const g=gradAt(x,y),gm=Math.hypot(Number(g[0]||0),Number(g[1]||0));
              const tx=Number(b[0])-Number(a[0]),ty=Number(b[1])-Number(a[1]),tm=Math.hypot(tx,ty);
              if(!(gm>1e-9&&tm>1e-9))continue;
              along.push(Math.abs((tx*Number(g[0])+ty*Number(g[1]))/(tm*gm)));
            }
            if(!along.length)return true;
            along.sort((a,b)=>a-b);
            const p90=along[Math.min(along.length-1,Math.floor(along.length*.90))];
            return along[along.length-1]<=0.65&&p90<=0.35;
          }

          """
          if marker not in s:
              if s.count(anchor)!=1: raise SystemExit('helper anchor mismatch')
              s=s.replace(anchor,helper+anchor,1)
          primary='const seg15836=earthlineLocalContourReachM76(rawSeg15836,path15836);'
          if 'local-downslope-kink' not in s:
              if s.count(primary)!=1: raise SystemExit('primary anchor mismatch')
              s=s.replace(primary,primary+'\n          if(!isRegionalTile15769&&!earthlineCrossSlopeLocalGuardM76(seg15836)){lastReason15836="local-downslope-kink";continue;}',1)
          secondary='const segs=rawSegsM76.map(seg=>earthlineLocalSeedReachM76(seg,sd.x,sd.y));'
          secondary_new='const segs=rawSegsM76.map(seg=>earthlineLocalSeedReachM76(seg,sd.x,sd.y)).filter(seg=>isRegionalTile15769||earthlineCrossSlopeLocalGuardM76(seg));'
          if secondary_new not in s:
              if s.count(secondary)!=1: raise SystemExit('secondary anchor mismatch')
              s=s.replace(secondary,secondary_new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and publish
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'function earthlineCrossSlopeLocalGuardM76' index.html
          grep -q 'local-downslope-kink' index.html
          grep -Fq 'filter(seg=>isRegionalTile15769||earthlineCrossSlopeLocalGuardM76(seg))' index.html
          node -e "const fs=require('fs'),s=fs.readFileSync('index.html','utf8');for(const m of s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)){if(m[1].trim())new Function(m[1])};console.log('M76H_OK')"
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: reject locally downhill Property swale kinks"
          git push origin HEAD:pages-live
