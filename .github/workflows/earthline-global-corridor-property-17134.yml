name: Earthline Global Corridor Property Diagnostic 17134
on:
  push:
    branches: [research/elder-density-calibration-17100]
    paths: ['.github/workflows/earthline-global-corridor-property-17134.yml','lab/earthline-17134-global-corridor-property.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ['Comoros','Cabo Verde','New Zealand','Uruguay','Thailand']
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/elder-density-calibration-17100}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - env:
          TARGET: ${{ matrix.target }}
        run: node lab/earthline-17134-global-corridor-property.mjs
