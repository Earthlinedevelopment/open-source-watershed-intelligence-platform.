name: Earthline Provenance Field Trace
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-provenance-field-trigger']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['usgsAquiferAudit=','usgsAquiferAudit =','vectorNoBuildCoverage=','vectorNoBuildCoverage =','sourceLabel','sourceName','provider','authoritySource','wellSource','mappedSource']
          for n in needles:
            print('\n===',n,'===')
            start=0; hits=0
            while True:
              i=s.find(n,start)
              if i<0: break
              print(s[max(0,i-1800):min(len(s),i+4200)])
              start=i+len(n); hits+=1
              if hits>=12: break
          PY
