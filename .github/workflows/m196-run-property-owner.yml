name: M196 RUN PROPERTY must retain published Property mode
on:
  push:
    branches: ['repair/m196-keep-property-when-rerun']
    paths: ['.github/workflows/m196-rerun-fix.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fix scientific-tier rerun state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          assert 'earthline-run-property-owner-m196' not in s
          script="""<script id="earthline-run-property-owner-m196">
          /* Explicit Property button routes through the already governed,
             independently validated Property action, never a Regional rerun. */
          (function(){
            document.addEventListener('click',function(event){
              const btn=event.target?.closest?.('#runBtn,#runBtnSide');
              if(!btn)return;
              if(String(document.documentElement.dataset.earthlineAnalysisTier||'').toLowerCase()!=='property')return;
              const property=document.getElementById('earthlineDeclareProperty16169');
              if(!property||property.disabled)return;
              event.preventDefault();
              event.stopImmediatePropagation();
              event.stopPropagation();
              window.EARTHLINE_RUN_PROPERTY_ROUTING_M196={owner:'earthlineDeclareProperty16169',when:new Date().toISOString(),tier:'property'};
              property.click();
            },true);
          })();
          </script>"""
          s=s.rstrip()+'\n'+script+'\n'
          p.write_text(s)
          print('M196_PROPERTY_RERUN_MODE_GUARD_PATCHED')
          PY
      - name: Check single-owner gate, JS syntax
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          s=Path('index.html').read_text()
          assert s.count('earthline-run-property-owner-m196')==1
          assert 'EARTHLINE_RUN_PROPERTY_ROUTING_M196' in s
          assert "event.stopImmediatePropagation()" in s
          for i,js in enumerate(re.findall(r'<script\b[^>]*>(.*?)</script>',s,re.S|re.I)):
            if not js.strip() or js.lstrip().startswith('{'):continue
            f=Path('/tmp/m196-'+str(i)+'.js');f.write_text(js)
            z=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
            if z.returncode:raise RuntimeError(str(i)+': '+z.stderr[:500])
          print('M196_JS_PASS')
          PY
      - name: Commit test candidate (not production)
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "fix(property): preserve active Property run when RUN PROPERTY repeats"
          git push origin HEAD:repair/m196-keep-property-when-rerun
