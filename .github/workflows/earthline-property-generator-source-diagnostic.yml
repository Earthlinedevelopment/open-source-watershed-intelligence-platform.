name: Earthline Property Generator Source Diagnostic
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-property-generator-source-diagnostic.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
      - name: Print canonical generator owners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=[
            'function earthlineNearestContourCell',
            'function earthlineSplitUsableSegments',
            'function seedCandidatesForLevel',
            'function traceLevelContour',
            'secondaryFillStarted',
            'const kept=',
            'const kept =',
            'rejectFinalSpacing',
            'rejectOverlap',
            'earthlinePathsCloserThan15770',
            'measuredMedianSpacingM',
            'acceptedSpacingM',
            'TARGET_M',
            'MIN_M',
            'function earthlineBuildNoBuildMask',
            'noBuildCellsFromWater',
            'waterCoreMask',
            'function streamThreshold',
            'function prescribeSwales15778',
            'no-safe-contour-near-flow-path'
          ]
          lines=s.splitlines()
          for term in terms:
              print('\n===== '+term+' =====')
              found=False
              for i,line in enumerate(lines):
                  if term in line:
                      found=True
                      a=max(0,i-20); b=min(len(lines),i+120)
                      for n in range(a,b):
                          print(f'{n+1}: {lines[n]}')
                      break
              if not found: print('NOT FOUND')
          PY
