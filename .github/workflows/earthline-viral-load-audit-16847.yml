name: Earthline Viral Load Audit 16847

on:
  push:
    branches:
      - audit-viral-load-16847
  workflow_dispatch:

jobs:
  inventory-live-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch live Earthline page
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 https://earthlinedevelopment.org/ -o /tmp/earthline-live.html
          echo "LIVE_BYTES=$(wc -c < /tmp/earthline-live.html)"
      - name: Inspect Mapbox request fanout
        shell: python
        run: |
          import re
          text=open('/tmp/earthline-live.html','r',encoding='utf-8',errors='replace').read()
          def redact(s):
              s=re.sub(r'pk\.[A-Za-z0-9._-]{20,}','<MAPBOX_PUBLIC_TOKEN>',s)
              s=re.sub(r'([?&]access_token=)[^&\"\'\s`]+',r'\1<REDACTED>',s,flags=re.I)
              return re.sub(r'\s+',' ',s)
          for needle in ['earthlineTilequerySamples15862P','earthlinePropertyTilePlan16453','fetchRegionalSatellite','earthlineFetchPropertySatellitePreview']:
              print('\n===',needle,'===')
              start=0;n=0
              while True:
                  i=text.find(needle,start)
                  if i<0: break
                  n+=1
                  print('-- occurrence',n,'--')
                  print(redact(text[max(0,i-1000):min(len(text),i+3000)]))
                  start=i+len(needle)
                  if n>=3: break
