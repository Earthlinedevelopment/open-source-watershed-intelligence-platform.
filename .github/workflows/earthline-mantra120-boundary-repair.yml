name: Earthline Mantra 120 Boundary Callback Repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-mantra120-boundary-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Patch exact JSONP cleanup defect
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function cleanup(){clearTimeout(timer);script.remove();try{delete window[cb]}catch(_){window[cb]=undefined}}"
          new="function cleanup(){clearTimeout(timer);script.remove();window[cb]=function(){/* retired JSONP callback: late VCGI script must not throw */};}"
          assert s.count(old)==1, 'unsafe patch: expected exactly one callback cleanup site'
          p.write_text(s.replace(old,new),encoding='utf-8')
          print('PATCH_OK one exact JSONP cleanup replaced')
          PY
      - name: Inspect script syntax and patch invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'window[cb]=function(){/* retired JSONP callback' in s
          assert 'try{delete window[cb]}' not in s
          print('PATCH_VALIDATED source invariant')
          PY
      - name: Create isolated repair branch without public deployment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C mantra120-boundary-repair
          git add index.html
          git commit -m "repair: prevent late Vermont boundary JSONP callback ReferenceError"
          git push --force origin HEAD:refs/heads/mantra120-boundary-repair
