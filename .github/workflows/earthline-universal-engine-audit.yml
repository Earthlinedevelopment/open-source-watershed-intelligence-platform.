name: Earthline Universal Engine Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.github/workflows/earthline-universal-engine-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - name: Audit active place-specific runtime code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          files=[Path('index.html'),Path('earthline-launch-16872.js'),Path('earthline-language-hotfix-16890.js')]
          places=['vermont','new zealand','vancouver','arizona','colorado','california','new york','maryland','iowa','arkansas','texas','thailand','vietnam','laos','switzerland','netherlands','iceland']
          out=[]
          for p in files:
            s=p.read_text(encoding='utf-8')
            lines=s.splitlines()
            for i,line in enumerate(lines,1):
              low=line.lower()
              for place in places:
                if place in low:
                  kind='identifier-or-static-name'
                  if any(tok in low for tok in ['if(','if (','===','==','includes(','match(','test(','countrycode','statecode','query','location']):
                    kind='runtime-condition'
                  out.append({'file':str(p),'line':i,'place':place,'kind':kind,'text':line[:900]})
          print('EARTHLINE_UNIVERSAL_ENGINE_AUDIT '+json.dumps(out))
          print('EARTHLINE_UNIVERSAL_RUNTIME_CONDITIONS',sum(1 for x in out if x['kind']=='runtime-condition'))
          PY
