name: M95 apply late context camera reset fix
on:
  push:
    branches: [fix/m95-arizona-actual-property-ui]
    paths: [.github/workflows/m95-apply-context-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 tools/m95-block-context-camera-reset.py
          git diff --check
          git config user.name "Earthline Repair CI"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix(M95): stop optional Regional context from recentering user's Property crosshair"
          git push origin HEAD:fix/m95-arizona-actual-property-ui
