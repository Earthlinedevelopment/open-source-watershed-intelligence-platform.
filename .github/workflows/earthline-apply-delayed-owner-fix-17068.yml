name: Earthline Apply Delayed Owner Fix 17068
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-apply-delayed-owner-fix-17068.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: candidate/property-delayed-owner-17068
      - name: Patch authoritative Property ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''    const swaleOn=propertyCommitted&&!!(M.layers&&M.layers.swales&&M.layers.swales.on);
    const rechargeOn=propertyCommitted&&!!(M.layers&&M.layers.recharge&&M.layers.recharge.on)&&validationView==="all";'''
          new='''    const swaleOn=propertyCommitted&&!!(M.layers&&M.layers.swales&&M.layers.swales.on);
    /* EARTHLINE 17068 — the 15792 living-swale renderer is fallback only once
       the verified natural Property renderer has taken ownership. Its delayed
       rehydrate must not republish duplicate visual swales after settlement. */
    const naturalPropertySwalesReady=!!(
      property&&window.EARTHLINE_PROPERTY_TEXTURE_AUDIT_16169&&
      Number(window.EARTHLINE_PROPERTY_TEXTURE_AUDIT_16169.centerlines||0)>0&&
      Number(window.EARTHLINE_PROPERTY_TEXTURE_AUDIT_16169.footprints||0)===Number(window.EARTHLINE_PROPERTY_TEXTURE_AUDIT_16169.centerlines||0)
    );
    const rechargeOn=propertyCommitted&&!!(M.layers&&M.layers.recharge&&M.layers.recharge.on)&&validationView==="all";'''
          if s.count(old)!=1:
              raise SystemExit(f'17068 swale anchor count={s.count(old)}')
          s=s.replace(old,new)
          old2='''    setGroup(active.water,flowOn);setGroup(active.swales,swaleOn);
    setGroup(active.recharge,rechargeOn);setGroup(active.contours,contourOn);setGroup(active.aquifer,aquiferOn);'''
          new2='''    setGroup(active.water,flowOn);setGroup(active.swales,swaleOn&&!naturalPropertySwalesReady);
    setGroup(active.recharge,rechargeOn);setGroup(active.contours,contourOn);setGroup(active.aquifer,aquiferOn);'''
          if s.count(old2)!=1:
              raise SystemExit(f'17068 ownership anchor count={s.count(old2)}')
          s=s.replace(old2,new2)
          p.write_text(s,encoding='utf-8')
          if s.count('EARTHLINE 17068')!=1:
              raise SystemExit('17068 marker count mismatch')
          PY
          git diff --check
          git diff -- index.html
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "candidate: prevent delayed legacy Property swale republish 17068"
          git push origin HEAD:candidate/property-delayed-owner-17068
