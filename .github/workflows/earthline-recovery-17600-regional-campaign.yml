name: Earthline Recovery 17600 Regional Science Campaign
on:
  push:
    branches: [recovery/full-science-blue-elders-17600]
    paths: ['.github/workflows/earthline-recovery-17600-regional-campaign.yml']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  regional:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/full-science-blue-elders-17600
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run live-origin intercepted Regional campaign
        run: |
          cat >tests/_earthline-recovery-regional-17600.mjs <<'JS'
          import { chromium } from 'playwright';
          import { readFileSync } from 'node:fs';
          const candidateIndex=readFileSync('index.html','utf8');
          const candidateLaunch=readFileSync('earthline-launch-16872.js','utf8');
          const candidateWorker=readFileSync('earthline-elder-worker-17129.js','utf8');
          const candidateDetector=readFileSync('tools/elder_trees/chmv2_array_detector_17129.py','utf8');
          const STATES=['Vermont','New York','Massachusetts','Texas','Florida','Iowa','Arkansas','Nebraska','California','Colorado','Oklahoma','Arizona'];
          const browser=await chromium.launch({headless:true});
          const rows=[];
          for(const query of STATES){
            const context=await browser.newContext({viewport:{width:1800,height:950}});
            await context.route('https://earthlinedevelopment.org/**',async route=>{
              const u=new URL(route.request().url());
              const headers={'cache-control':'no-store'};
              if(u.pathname==='/'||u.pathname==='/index.html')return route.fulfill({status:200,body:candidateIndex,headers:{...headers,'content-type':'text/html; charset=utf-8'}});
              if(u.pathname==='/earthline-launch-16872.js')return route.fulfill({status:200,body:candidateLaunch,headers:{...headers,'content-type':'text/javascript; charset=utf-8'}});
              if(u.pathname==='/earthline-elder-worker-17129.js')return route.fulfill({status:200,body:candidateWorker,headers:{...headers,'content-type':'text/javascript; charset=utf-8'}});
              if(u.pathname==='/tools/elder_trees/chmv2_array_detector_17129.py')return route.fulfill({status:200,body:candidateDetector,headers:{...headers,'content-type':'text/plain; charset=utf-8'}});
              return route.continue();
            });
            const page=await context.newPage();
            const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));
            let loadError=null,timedOut=false;
            const started=Date.now();
            try{
              await page.goto('https://earthlinedevelopment.org/?regional17600='+encodeURIComponent(query)+'-'+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
              await page.waitForSelector('#searchInput',{timeout:30000});
              await page.locator('#searchInput').fill(query);
              await page.waitForTimeout(650);
              const opts=page.locator('#earthlineSearchSuggestions15970 [role="option"]:visible');
              if(await opts.count())await opts.first().click();
              const run=page.locator('#runBtn');
              if(await run.isVisible()){
                const busy=await run.evaluate(b=>b.dataset.busy==='1'||b.disabled);
                if(!busy)await run.click();
              }
              try{
                await page.waitForFunction(q=>{
                  if(window.EARTHLINE_LAST_LIVE_REGIONAL_ERROR_15970)return true;
                  const perf=window.EARTHLINE_REGIONAL_PERFORMANCE_16191||null;
                  const root=window.EARTHLINE_STANDARD_ROOT_CAUSE_AUDIT_16784||null;
                  return !!perf&&!!root&&String(root.query||'').toLowerCase().includes(q.toLowerCase());
                },query,{timeout:120000,polling:150});
              }catch(_){timedOut=true}
            }catch(e){loadError=String(e)}
            const a=loadError?{}:await page.evaluate(()=>({
              perf:window.EARTHLINE_REGIONAL_PERFORMANCE_16191||null,
              pub:window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167||null,
              display:window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020||null,
              flow:window.EARTHLINE_LAND_VALIDITY_FLOW_AUDIT_16584||null,
              boundary:window.EARTHLINE_REGIONAL_JURISDICTION_BOUNDARY_AUDIT_16539||null,
              root:window.EARTHLINE_STANDARD_ROOT_CAUSE_AUDIT_16784||null,
              lastError:window.EARTHLINE_LAST_LIVE_REGIONAL_ERROR_15970||null,
              tier:String(document.documentElement.dataset.earthlineAnalysisTier||'').toLowerCase()
            }));
            const generated=Number(a?.pub?.generated??NaN);
            const visible=Number(a?.display?.swaleLines??a?.pub?.overlaySwaleLines??NaN);
            const unsafe=Number(a?.flow?.unsafeSegments??NaN);
            const outside=a?.boundary?.outsideAfterClip||null;
            const hardRootFail=Array.isArray(a?.root?.rankedCauses)&&a.root.rankedCauses.some(r=>r.status==='critical'||r.status==='fail');
            const countConsistent=Number.isFinite(generated)&&Number.isFinite(visible)&&generated===visible;
            const exclusionSafe=Number.isFinite(unsafe)&&unsafe===0;
            const boundarySafe=Number(outside?.swales||0)===0;
            const coreMs=Number(a?.perf?.totalMs??NaN);
            const pass=!loadError&&!timedOut&&!a?.lastError&&!pageErrors.length&&a?.tier==='regional'&&countConsistent&&exclusionSafe&&boundarySafe&&!hardRootFail&&Number.isFinite(coreMs)&&coreMs<=15000;
            const row={query,pass,wallMs:Date.now()-started,coreMs,generated,visible,unsafe,outsideAfterClip:outside,rootPass:a?.root?.pass??null,tier:a?.tier||null,loadError,timedOut,lastError:a?.lastError||null,pageErrors};
            rows.push(row);
            console.log('EARTHLINE_REGIONAL_RECOVERY_17600 '+JSON.stringify(row));
            await context.close();
          }
          await browser.close();
          const summary={total:rows.length,pass:rows.filter(r=>r.pass).length,fail:rows.filter(r=>!r.pass).length,rows};
          console.log('EARTHLINE_REGIONAL_RECOVERY_17600_SUMMARY '+JSON.stringify(summary));
          if(summary.fail)process.exitCode=1;
          JS
          node tests/_earthline-recovery-regional-17600.mjs
