name: Mantra 51 Apply Country Crosshair Sync
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-apply-country-crosshair.yml'
      - 'lab/mantra51-patch-country-crosshair.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra51-global-repair-campaign
          fetch-depth: 0
      - name: Apply authoritative country crosshair sync
        run: |
          python3 lab/mantra51-patch-country-crosshair.py
          git diff --check
      - name: Commit candidate only
        run: |
          git config user.name 'Earthline CI'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: synchronize country crosshair to authoritative interior center' || exit 0
          git push origin HEAD:mantra51-global-repair-campaign
