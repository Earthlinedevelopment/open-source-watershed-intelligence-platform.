name: Mantra 51 Launch Presentation Repair
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - 'scripts/launch_report_map_and_title_16938.py'
      - '.github/workflows/mantra51-launch-presentation-repair.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 scripts/launch_report_map_and_title_16938.py
          python3 scripts/restructure_how_swales_16936.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          s=Path('index.html').read_text(errors='ignore')
          assert '<title>Earthline — Aquifer Recharging Starts Here.</title>' in s
          assert 'EARTHLINE_ACCEPTED_REGIONAL_AQUIFER_GEOJSON_16373' in s
          assert "getSource?.('el-live-aquifer-15970')" in s
          assert 'AQUIFER CONTEXT' in s
          assert 'rgba(69,151,207,.17)' in s
          assert "mainW=r.grade==='A'?2.2" in s
          assert 'Water falls. Water runs downhill. Bioswales interrupt that loss' in s
          assert 'visualBlock+canonicalBlock+correctionsBlock+sourceBlock' in s
          class P(HTMLParser):
              def __init__(self): super().__init__();self.ins=False;self.buf=[];self.scripts=[]
              def handle_starttag(self,t,a):
                  if t.lower()=='script': self.ins=True;self.buf=[]
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.ins:self.scripts.append(''.join(self.buf));self.ins=False
              def handle_data(self,d):
                  if self.ins:self.buf.append(d)
          p=P();p.feed(s);out=Path('/tmp/el-js');out.mkdir(exist_ok=True)
          for i,j in enumerate(p.scripts):(out/f'{i:03}.js').write_text(j)
          PY
          for f in /tmp/el-js/*.js; do node --check "$f" >/dev/null; done
          git add index.html
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git commit -m "fix: professionalize launch report presentation"
          git push

# rerun after literal-safe How Swales restructuring
