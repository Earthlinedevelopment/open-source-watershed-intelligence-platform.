name: Earthline Prepared Jurisdiction Cache A-B 17269
on:
  push:
    branches: [repair/browser-jurisdiction-cache-17269]
    paths:
      - 'tests/apply-prepared-jurisdiction-cache-17269.py'
      - '.github/workflows/earthline-browser-jurisdiction-cache-17269.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firefox:
    strategy:
      fail-fast: false
      matrix:
        variant: [prepared-only, prepared-plus-consolidated]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/browser-jurisdiction-cache-17269
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 tests/apply-prepared-jurisdiction-cache-17269.py
      - if: matrix.variant == 'prepared-plus-consolidated'
        run: python3 tests/apply-consolidated-jurisdiction-screen-17262.py
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps firefox
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run Texas and Vermont
        run: xvfb-run -a env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='firefox' HEADLESS='false' WAIT_MS='120000' STATES='Texas|Vermont' node tests/mantra46-16791-50state-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jurisdiction-cache-firefox-${{ matrix.variant }}-17269
          path: artifacts/mantra46-16791-50state/
          if-no-files-found: warn

  webkit:
    strategy:
      fail-fast: false
      matrix:
        variant: [prepared-only, prepared-plus-consolidated]
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/browser-jurisdiction-cache-17269
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 tests/apply-prepared-jurisdiction-cache-17269.py
      - if: matrix.variant == 'prepared-plus-consolidated'
        run: python3 tests/apply-consolidated-jurisdiction-screen-17262.py
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run Texas and Vermont
        run: env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='webkit' HEADLESS='true' WAIT_MS='120000' STATES='Texas|Vermont' node tests/mantra46-16791-50state-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jurisdiction-cache-webkit-${{ matrix.variant }}-17269
          path: artifacts/mantra46-16791-50state/
          if-no-files-found: warn

  chromium-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/browser-jurisdiction-cache-17269
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          python3 tests/apply-prepared-jurisdiction-cache-17269.py
          python3 tests/apply-consolidated-jurisdiction-screen-17262.py
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run Texas and Vermont
        run: env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='chromium' HEADLESS='true' WAIT_MS='120000' STATES='Texas|Vermont' node tests/mantra46-16791-50state-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jurisdiction-cache-chromium-17269
          path: artifacts/mantra46-16791-50state/
          if-no-files-found: warn
