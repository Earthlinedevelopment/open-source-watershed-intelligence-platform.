name: Earthline M75 Engine Core Repair
on:
  push:
    branches: [recovery/mantra74-stability]
    paths:
      - .github/workflows/earthline-m75-engine-core-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-engine-core
          fetch-depth: 0
      - name: Repair Regional truncation and exact duplicate swales
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(errors='strict')

          old_budget="""    const work15771=isRegionalTile15769
      ? {maxLevels:14,maxSeedsPerLevel:4,maxCandidates:10,maxFinal:6,perLevel:1,maxMs:2000}
      : {maxLevels:72,maxSeedsPerLevel:16,maxCandidates:256,maxFinal:200,perLevel:16,maxMs:120000};"""
          new_budget="""    const work15771=isRegionalTile15769
      ? {maxLevels:18,maxSeedsPerLevel:6,maxCandidates:24,maxFinal:12,perLevel:2,maxMs:2000}
      : {maxLevels:72,maxSeedsPerLevel:16,maxCandidates:256,maxFinal:200,perLevel:16,maxMs:120000};"""
          if s.count(old_budget)!=1:
              raise SystemExit(f'regional budget target count {s.count(old_budget)}, expected 1')
          s=s.replace(old_budget,new_budget,1)

          old_seed="const effectiveSeedBudget15841=isRegionalTile15769?2:work15771.maxSeedsPerLevel;"
          new_seed="const effectiveSeedBudget15841=isRegionalTile15769?4:work15771.maxSeedsPerLevel;"
          if s.count(old_seed)!=1:
              raise SystemExit(f'regional seed target count {s.count(old_seed)}, expected 1')
          s=s.replace(old_seed,new_seed,1)

          old_kept="""    const kept=[],keptBBox16204=[];
    const spacingPadCells16204=Math.max(0,Number(minSpacingM15771||0)/Math.max(.05,Number(M.cellM||1)));"""
          new_kept="""    const kept=[],keptBBox16204=[];
    const exactGeometryKeys17699=new Set();
    function exactSwaleKey17699(sw){
      const pts=Array.isArray(sw&&sw.pts)?sw.pts:[];
      if(!pts.length)return '';
      const norm=pts.map(p=>[Number(p[0]).toFixed(5),Number(p[1]).toFixed(5)]);
      const f=JSON.stringify(norm),r=JSON.stringify(norm.slice().reverse());
      return f<r?f:r;
    }
    const spacingPadCells16204=Math.max(0,Number(minSpacingM15771||0)/Math.max(.05,Number(M.cellM||1)));"""
          if s.count(old_kept)!=1:
              raise SystemExit(f'dedupe setup target count {s.count(old_kept)}, expected 1')
          s=s.replace(old_kept,new_kept,1)

          old_loop="""      let tooClose=false;const swBBox16204=earthlineSwaleGridBBox16204(sw);
      const spacingCandidates16456=spacingIndexCandidates16456(swBBox16204);"""
          new_loop="""      let tooClose=false;const swBBox16204=earthlineSwaleGridBBox16204(sw);
      const exactKey17699=exactSwaleKey17699(sw);
      if(exactKey17699&&exactGeometryKeys17699.has(exactKey17699)){
        if(finalRec15803){
          finalRec15803.status="rejected-final-spacing";
          finalRec15803.reason="exact-duplicate-geometry";
          earthlineCoverageZone15803(coverageDiag15803,finalRec15803.x,finalRec15803.y).rejections.finalSpacing++;
        }
        M.swaleDiagnostics.stage.rejectFinalSpacing++;
        continue;
      }
      const spacingCandidates16456=spacingIndexCandidates16456(swBBox16204);"""
          if s.count(old_loop)!=1:
              raise SystemExit(f'dedupe loop target count {s.count(old_loop)}, expected 1')
          s=s.replace(old_loop,new_loop,1)

          old_push="kept.push(sw);keptBBox16204.push(swBBox16204);spacingIndexAdd16456(kept.length-1,swBBox16204);"
          new_push="kept.push(sw);if(exactKey17699)exactGeometryKeys17699.add(exactKey17699);keptBBox16204.push(swBBox16204);spacingIndexAdd16456(kept.length-1,swBBox16204);"
          if s.count(old_push)!=1:
              raise SystemExit(f'dedupe accept target count {s.count(old_push)}, expected 1')
          s=s.replace(old_push,new_push,1)

          p.write_text(s)
          print('EARTHLINE_M75_ENGINE_CORE_REPAIR_OK')
          PY
      - name: Parse-check
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          console.log('EARTHLINE_M75_ENGINE_CORE_PARSE_OK',parsed);
          NODE
      - name: Commit repaired engine
        shell: bash
        run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: remove duplicate swales and widen Regional coverage"
          git push origin HEAD:recovery/mantra75-engine-core
