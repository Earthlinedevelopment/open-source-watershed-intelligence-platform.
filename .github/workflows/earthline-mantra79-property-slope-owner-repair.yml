name: Earthline Mantra 79 Property Slope Owner Repair

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-mantra79-property-slope-owner-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Repair authoritative Property generation spacing owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          if "const thr=streamThreshold(),chanThr=thr*3.2,maxS=4;" not in s:
              raise SystemExit("STOP: locked <=4% Property slope ceiling missing")
          if "const pick=(step===0)?candidates[firstPick%candidates.length]:candidates[0];" in s:
              raise SystemExit("STOP: regressive contour selector is present")

          old_pair="const medSlopeRaw=Number(medianSlopeInParcel());\n    const medSlope=clampN(Number.isFinite(medSlopeRaw)?medSlopeRaw:0.012,0.012,0.45);"
          new_pair="const medSlopeRaw=Number(medianSlopeInParcel());\n    const eligibleSlopeSamples15771=[];\n    for(let sy15771=2;sy15771<GH-2;sy15771+=2)for(let sx15771=2;sx15771<GW-2;sx15771+=2){\n      if(!earthlineSafeCell(sx15771,sy15771,maxS))continue;\n      const eligibleSlope15771=Number(slopePct(sx15771,sy15771))/100;\n      if(Number.isFinite(eligibleSlope15771)&&eligibleSlope15771<=maxS/100)eligibleSlopeSamples15771.push(eligibleSlope15771);\n    }\n    eligibleSlopeSamples15771.sort((a,b)=>a-b);\n    const eligibleMedianSlope15771=eligibleSlopeSamples15771.length?eligibleSlopeSamples15771[Math.floor(eligibleSlopeSamples15771.length/2)]:NaN;\n    const medSlope=clampN(Number.isFinite(eligibleMedianSlope15771)?eligibleMedianSlope15771:Math.min(Number.isFinite(medSlopeRaw)?medSlopeRaw:0.012,maxS/100),0.012,maxS/100);\n    M.propertyEligibleSlopeSpacing15771={sampleCount:eligibleSlopeSamples15771.length,rawParcelMedian:medSlopeRaw,eligibleMedian:eligibleMedianSlope15771,spacingSlope:medSlope,maxSlope:maxS/100};"
          old_budget="? {maxLevels:14,maxSeedsPerLevel:4,maxCandidates:10,maxFinal:6,perLevel:1,maxMs:2000}\n      : {maxLevels:72,maxSeedsPerLevel:16,maxCandidates:256,maxFinal:200,perLevel:16,maxMs:120000};"
          new_budget="? {maxLevels:14,maxSeedsPerLevel:4,maxCandidates:10,maxFinal:6,perLevel:1,maxMs:2000}\n      : {maxLevels:256,maxSeedsPerLevel:16,maxCandidates:256,maxFinal:200,perLevel:16,maxMs:120000};"

          if s.count(old_pair)!=1:
              raise SystemExit(f"median-slope owner anchor count={s.count(old_pair)}")
          if s.count(old_budget)!=1:
              raise SystemExit(f"Property contour-level budget anchor count={s.count(old_budget)}")

          s=s.replace(old_pair,new_pair,1).replace(old_budget,new_budget,1)

          required=[
              "eligibleSlopeSamples15771=[]",
              "eligibleMedianSlope15771",
              "maxLevels:256,maxSeedsPerLevel:16,maxCandidates:256,maxFinal:200",
              "const thr=streamThreshold(),chanThr=thr*3.2,maxS=4;"
          ]
          for term in required:
              if term not in s:
                  raise SystemExit(f"post-repair assertion missing: {term}")
          if "const pick=(step===0)?candidates[firstPick%candidates.length]:candidates[0];" in s:
              raise SystemExit("post-repair contour regression detected")

          p.write_text(s,encoding="utf-8")
          print("Repaired existing Property prescriber: contour spacing now derives from eligible <=4% cells; Property contour-level budget raised to 256.")
          PY
          git diff --check
      - name: Commit single-owner generation correction
        run: |
          git config user.name "Earthline Engine"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: derive Property contour spacing from eligible <=4% cells"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
