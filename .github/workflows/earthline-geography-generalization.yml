name: Earthline Geography Generalization
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['tools/mantra74-geography-generalization.py']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          fetch-depth: 0
      - run: python3 tools/mantra74-geography-generalization.py
      - shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          for(const m of s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi))if(m[1].trim())new Function(m[1]);
          for(const x of ['fullAlaskaExtent16905','const CHIANG=','function isChiang','prepareChiang()'])if(s.includes(x))throw Error(x);
          if(!s.includes('governedAdministrativeExtent16905'))throw Error('generic governed extent missing');
          NODE
          git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "Earthline Stability Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git rm -f tools/mantra74-geography-generalization.py .github/workflows/earthline-geography-generalization.yml
          git add index.html
          git commit -m "stability: replace Alaska and Chiang Mai runtime exceptions"
          git push origin HEAD:recovery/mantra74-stability
