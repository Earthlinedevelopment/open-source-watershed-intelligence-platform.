name: Earthline M76 Fix Secondary Worm Source Live
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-fix-secondary-worm-live.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Remove full-contour fallback from local reach cutters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""  const out=earthlineCleanPath(seg.slice(lo,hi+1));
  return out.length>=3?out:seg;
}"""
          new="""  while((hi-lo+1)<3&&lo>0)lo--;
  while((hi-lo+1)<3&&hi<seg.length-1)hi++;
  const out=earthlineCleanPath(seg.slice(lo,hi+1));
  return out.length>=3?out:[];
}"""
          n=s.count(old)
          if n!=2:
              raise SystemExit(f'local reach fallback owner count {n}')
          s=s.replace(old,new,2)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Foc 'return out.length>=3?out:[];' index.html)" = "2"
          ! grep -Fq 'return out.length>=3?out:seg;' index.html
          grep -q 'EARTHLINE M76G — zero-runoff secondary Property swales are not publishable' index.html
          grep -q 'earthlinePickContourExitM76(candidates,pts)' index.html
          node -e "const fs=require('fs'),s=fs.readFileSync('index.html','utf8');let n=0;for(const m of s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)){if(!m[1].trim())continue;new Function(m[1]);n++}console.log('M76_LOCAL_REACH_FALLBACK_REMOVED',n)"
      - name: Publish live
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: never fall back to full contour from local reach"
          git push origin HEAD:pages-live
