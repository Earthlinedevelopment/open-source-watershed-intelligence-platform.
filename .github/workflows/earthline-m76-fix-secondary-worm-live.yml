name: Earthline M76 Fix Secondary Worm Source Live
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-fix-secondary-worm-live.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Patch actual live secondary contour geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const segs=earthlineSplitUsableSegments(pts,maxS).slice(0,3);"
          if s.count(old)!=1:
              raise SystemExit(f'secondary owner count {s.count(old)}')
          marker="/* BUILD-CHECK-15768"
          helper="/* EARTHLINE M76D — local construction reach for contour-fill candidates. */\nfunction earthlineLocalSeedReachM76(seg,x,y){\n  if(!Array.isArray(seg)||seg.length<3)return seg;\n  let bestI=0,bestD=Infinity;\n  for(let i=0;i<seg.length;i++){\n    const p=seg[i],dx=p[0]-x,dy=p[1]-y,d=dx*dx+dy*dy;\n    if(d<bestD){bestD=d;bestI=i;}\n  }\n  const totalM=Math.max(30,Math.min(60,Number(M.cellM||1)*8));\n  const halfM=totalM/2;\n  let lo=bestI,hi=bestI,leftM=0,rightM=0;\n  while(lo>0&&leftM<halfM){\n    leftM+=Math.hypot(seg[lo][0]-seg[lo-1][0],seg[lo][1]-seg[lo-1][1])*M.cellM;\n    lo--;\n  }\n  while(hi<seg.length-1&&rightM<halfM){\n    rightM+=Math.hypot(seg[hi+1][0]-seg[hi][0],seg[hi+1][1]-seg[hi][1])*M.cellM;\n    hi++;\n  }\n  const out=earthlineCleanPath(seg.slice(lo,hi+1));\n  return out.length>=3?out:seg;\n}\n\n"
          if 'function earthlineLocalSeedReachM76(' not in s:
              if s.count(marker)<1:
                  raise SystemExit('insert marker missing')
              s=s.replace(marker,helper+marker,1)
          new="const rawSegsM76=earthlineSplitUsableSegments(pts,maxS).slice(0,3);\n        const segs=rawSegsM76.map(seg=>earthlineLocalSeedReachM76(seg,sd.x,sd.y));"
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'function earthlineLocalSeedReachM76' index.html
          grep -q 'earthlineLocalSeedReachM76(seg,sd.x,sd.y)' index.html
          test "$(grep -c 'earthlineLocalSeedReachM76(seg,sd.x,sd.y)' index.html)" = "1"
          ! grep -q 'const segs=earthlineSplitUsableSegments(pts,maxS).slice(0,3);' index.html
          node -e "const fs=require('fs'),s=fs.readFileSync('index.html','utf8');let n=0;for(const m of s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)){if(!m[1].trim())continue;new Function(m[1]);n++}console.log('M76D_LIVE_PARSE_OK',n)"
      - name: Publish live
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: trim secondary contour swales to local seed reach"
          git push origin HEAD:pages-live
