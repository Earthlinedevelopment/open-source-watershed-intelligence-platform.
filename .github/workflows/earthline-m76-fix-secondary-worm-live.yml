name: Earthline M76 Fix Secondary Worm Source Live
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-fix-secondary-worm-live.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Restore Elder compute-only prime after Property frame
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="/* M76 elder early start retired */"
          new="try{void window.EARTHLINE_ELDER_TREES_V1_17097?.primePropertyEvidence?.()}catch(_){} /* M76 Elder compute-only prime; publication remains post-science. */"
          if s.count(old)!=1:
              raise SystemExit(f'frame Elder marker count {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Foc 'primePropertyEvidence?.()' index.html)" -ge "1"
          test "$(grep -Foc 'startProperty?.()' index.html)" = "1"
          grep -q 'elder-display-only-m76' index.html
          grep -q 'earthlinePickContourExitM76(candidates,pts)' index.html
          node -e "const fs=require('fs'),s=fs.readFileSync('index.html','utf8');let n=0;for(const m of s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)){if(!m[1].trim())continue;new Function(m[1]);n++}console.log('M76_ELDER_PRIME_OK',n)"
      - name: Publish live
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: restore Elder compute prime after Property frame"
          git push origin HEAD:pages-live
