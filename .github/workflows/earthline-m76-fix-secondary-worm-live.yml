name: Earthline M76 Fix Secondary Worm Source Live
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-fix-secondary-worm-live.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Reject zero-runoff secondary Property swales
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""          if(!isRegionalTile15769&&Number(flowEvidence15833.crossingHits||0)<=0&&
             Number(sw.seedFlowCrossing15833||0)<=0&&Number(sw.seedCrossingGeometry15833||0)<=0){
            M.swaleDiagnostics.stage.rejectConversion++;
            continue;
          }"""
          new="""          if(!isRegionalTile15769&&Number(flowEvidence15833.crossingHits||0)<=0&&
             Number(sw.seedFlowCrossing15833||0)<=0){
            M.swaleDiagnostics.stage.rejectConversion++;
            continue;
          }"""
          if s.count(old)!=1:
              raise SystemExit(f'zero-runoff Property guard owner count {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Number(flowEvidence15833.crossingHits||0)<=0' index.html
          ! grep -q 'Number(sw.seedCrossingGeometry15833||0)<=0' index.html
          grep -q 'earthlinePickContourExitM76(candidates,pts)' index.html
          node -e "const fs=require('fs'),s=fs.readFileSync('index.html','utf8');let n=0;for(const m of s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)){if(!m[1].trim())continue;new Function(m[1]);n++}console.log('M76_ZERO_RUNOFF_FILTER_OK',n)"
      - name: Publish live
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: reject zero-runoff secondary Property swales"
          git push origin HEAD:pages-live
