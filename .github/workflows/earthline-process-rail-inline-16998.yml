name: Earthline Process rail inline 16998
on:
  push:
    branches: [pages-live]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: python .github/scripts/earthline_process_rail_inline_16998.py
      - run: |
          git config user.name EarthlineBuildBot
          git config user.email info@earthlinedevelopment.org
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: hide launch buttons on Earthline Process 16998"
          git push origin HEAD:pages-live
