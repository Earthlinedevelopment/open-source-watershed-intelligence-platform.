name: Mantra 83 Pre Swale Profile
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - 'tests/mantra83-pre-swale-profile.mjs'
      - '.github/workflows/earthline-mantra83-pre-swale-profile.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps webkit
      - run: node tests/mantra83-pre-swale-profile.mjs
