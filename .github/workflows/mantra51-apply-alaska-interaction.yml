name: Mantra 51 Apply Alaska Interaction Repair
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - 'lab/mantra51-fix-alaska-interaction.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: mantra51-global-repair-campaign, fetch-depth: 0}
      - run: python3 lab/mantra51-fix-alaska-interaction.py
      - run: |
          grep -n "earthline-alaska-map-interaction-16921" index.html
          git diff --check
      - run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: let Alaska map drag pass through regional swale hit paths"
          git push origin HEAD:mantra51-global-repair-campaign
