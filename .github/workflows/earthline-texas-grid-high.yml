name: Earthline Texas High Grid Sweep
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/texas-regional-grid-high-sweep.mjs'
      - '.github/workflows/earthline-texas-grid-high.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node tests/texas-regional-grid-high-sweep.mjs
