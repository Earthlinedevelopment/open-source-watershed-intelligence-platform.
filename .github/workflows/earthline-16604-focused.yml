name: Earthline 16604 Focused Regression

on:
  push:
    branches: [pages-live]
    paths:
      - 'index.html'
      - '.github/workflows/earthline-16604-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exact public 16604 bytes
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 20 "https://earthlinedevelopment.org/?flow16604=${GITHUB_RUN_ID}-${i}" -o /tmp/earthline-16604.html; then
              if grep -Fq 'coords.length<5' /tmp/earthline-16604.html && grep -Fq 'Math.floor((coords.length-1)/5)||1' /tmp/earthline-16604.html && grep -Fq 'lineSafe16584(retrySmooth16584)' /tmp/earthline-16604.html && grep -Fq 'regional land-validity flow audit failed: ' /tmp/earthline-16604.html; then
                echo 'Public 16604 bytes verified.'
                exit 0
              fi
            fi
            sleep 4
          done
          echo 'Public 16604 bytes did not settle.'
          exit 1
      - name: Restrict matrix to short-flow controls
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='lab/global-country-matrix.mjs';
          let s=fs.readFileSync(p,'utf8');
          const old='const TESTS=COUNTRIES.filter((_,i)=>i%SHARD_TOTAL===SHARD_INDEX);';
          const names=['Saint Kitts and Nevis','Solomon Islands','Vanuatu','Antigua and Barbuda','Barbados','United States','Germany','Mexico','Indonesia','France','Singapore','China'];
          const replacement=`const TESTS=COUNTRIES.filter(c=>${JSON.stringify(names)}.includes(c.name));`;
          if(!s.includes(old))throw new Error('TESTS selector not found');
          fs.writeFileSync(p,s.replace(old,replacement));
          NODE
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run focused public regression
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          EARTHLINE_SHARD_INDEX: 0
          EARTHLINE_SHARD_TOTAL: 1
        run: node lab/global-country-matrix-v2.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthline-16604-focused
          path: lab-results/global-0-of-1.json
          if-no-files-found: warn
          retention-days: 7
