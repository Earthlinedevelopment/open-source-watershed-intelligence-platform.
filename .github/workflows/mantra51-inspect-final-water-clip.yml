name: Mantra 51 Inspect Final Water Clip
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-inspect-final-water-clip.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for needle in ["function earthlineFinalWaterClip16584","earthlineFinalWaterClip16584(hy,flows","setGeo(m,IDS.flows","EARTHLINE_STYLE_WATER_INDEX_16584"]:
            print("\n====",needle,"====")
            pos=0
            for _ in range(12):
              i=s.find(needle,pos)
              if i<0: break
              print(s[max(0,i-3500):min(len(s),i+10000)].replace("\n"," "))
              print("\n---")
              pos=i+len(needle)
          PY
