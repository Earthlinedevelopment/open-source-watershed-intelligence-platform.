name: Mantra 125 paired display repair validation
on:
  push:
    branches: [candidate/mantra125-ui-restore]
    paths:
      - 'tests/mantra125-ui-compare.mjs'
      - '.github/workflows/mantra125-ui-restore.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser engines
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Compare baseline and UI bundle
        shell: bash
        run: |
          set +e
          ENGINE=chromium node tests/mantra125-ui-compare.mjs
          C=$?
          ENGINE=webkit node tests/mantra125-ui-compare.mjs
          W=$?
          set -e
          printf '{"chromium_exit":%s,"webkit_exit":%s}\n' "$C" "$W" > artifacts/mantra125/exits.json
          test "$C" -eq 0 && test "$W" -eq 0
      - name: Save result files even if installation or tests fail
        if: always()
        shell: bash
        run: |
          mkdir -p reviews/mantra125
          for E in chromium webkit; do
            if test -f "artifacts/mantra125/$E/results.json"; then
              cp "artifacts/mantra125/$E/results.json" "reviews/mantra125/$E-results.json"
            else
              printf '{"engine":"%s","result":"NO_TEST_RESULT","reason":"Test did not produce a result file; see workflow job logs"}\n' "$E" > "reviews/mantra125/$E-results.json"
            fi
          done
          if test -f artifacts/mantra125/exits.json; then
            cp artifacts/mantra125/exits.json reviews/mantra125/run-status.json
          else
            printf '{"result":"TEST_NOT_COMPLETED","production":"56009ce"}\n' > reviews/mantra125/run-status.json
          fi
          git config user.name 'earthline-ci'
          git config user.email 'earthline-ci@users.noreply.github.com'
          git add reviews/mantra125
          git commit -m 'test(mantra125): record browser outcomes or failure placeholders' || true
          git push origin HEAD:candidate/mantra125-ui-restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra125-paired-evidence
          path: artifacts/mantra125/
          retention-days: 14
