name: Earthline October stabilization baseline
on:
  push:
    branches: [staging/october-stabilization-2026-11-13]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check standalone page and existing app entrypoints
        run: node --test tests/stability-baseline.test.mjs
