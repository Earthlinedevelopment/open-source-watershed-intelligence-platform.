name: Earthline 17450 User Feedback Diagnostics
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/earthline-user-feedback-17450.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        script: [vermont-state-country-17450, alabama-regional-elder-17450, alabama-repeat-ready-17450]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17445
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/${{ matrix.script }}.mjs > tests/${{ matrix.script }}.mjs
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - id: diag
        continue-on-error: true
        run: env EARTHLINE_URL='http://127.0.0.1:8787/' node tests/${{ matrix.script }}.mjs
      - name: Persist result
        if: always()
        run: |
          git fetch origin repair/property-one-click-17441
          rm -rf /tmp/earthline-17450
          git worktree add /tmp/earthline-17450 origin/repair/property-one-click-17441
          mkdir -p /tmp/earthline-17450/test-results
          cp artifacts/${{ matrix.script }}.json /tmp/earthline-17450/test-results/${{ matrix.script }}.json
          cd /tmp/earthline-17450
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results/${{ matrix.script }}.json
          git commit -m "test: persist ${{ matrix.script }}" || true
          git pull --rebase origin repair/property-one-click-17441 || true
          git push origin HEAD:repair/property-one-click-17441
      - name: Enforce diagnostic
        if: steps.diag.outcome != 'success'
        run: exit 1
