name: Earthline process rail audit 16998
on:
  push:
    branches: [pages-live]
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Inspect process page and launch rail
        run: |
          python - <<'PY'
          from pathlib import Path
          for fn in ["index.html","earthline-launch-16872.js"]:
              s=Path(fn).read_text(encoding="utf-8")
              print("\n===== FILE",fn,"=====")
              for n in ["ensureEarthlineProcessPage16265","earthlineProcessPage16265","earthline-process","EARTHLINE PROCESS","Earthline Process","earthlineLaunchLogin16872","earthlineLaunchDonate16872","earthlineLaunchMerch16872","earthlineRail16188"]:
                  print("\n###",n)
                  start=0
                  for _ in range(12):
                      i=s.find(n,start)
                      if i<0: break
                      print("---",i,"---")
                      print(s[max(0,i-1600):min(len(s),i+4200)])
                      start=i+len(n)
          PY
