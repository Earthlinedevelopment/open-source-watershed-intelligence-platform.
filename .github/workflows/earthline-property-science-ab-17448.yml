name: Earthline Property Science A-B 17448
on:
  push:
    branches: [repair/property-science-selector-17448]
    paths:
      - 'tests/property-science-diagnostic-17448.mjs'
      - 'tests/apply-property-spatial-selector-17448.py'
      - '.github/workflows/earthline-property-science-ab-17448.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/property-science-selector-17448}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Baseline exact screenshot sites
        run: env EARTHLINE_URL='http://127.0.0.1:8787/' VARIANT='baseline' node tests/property-science-diagnostic-17448.mjs
      - name: Apply Property science repair
        run: python3 tests/apply-property-spatial-selector-17448.py
      - name: Repaired exact screenshot sites
        run: env EARTHLINE_URL='http://127.0.0.1:8787/' VARIANT='repaired' node tests/property-science-diagnostic-17448.mjs
