name: Earthline Exact Safe Swale Builder 17034
on:
  push:
    branches: [test-property-coverage-17031]
    paths:
      - '.github/workflows/exact-safe-swale-builder-17034.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exact assignments
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=[
            'M.authoritativePropertySwales15800=',
            'M.authoritativeSafeSwales15815=',
            'M.propertyResultLock15815=',
            'M.safetyAudit15806=',
            'M.propertyPublication15816='
          ]
          for n in needles:
              print('\n===== '+n+' =====')
              st=0; k=0
              while True:
                  i=s.find(n,st)
                  if i<0: break
                  print('\n--- @',i,'---')
                  print(s[max(0,i-2600):min(len(s),i+5200)])
                  st=i+len(n);k+=1
              print('HITS',k)
          PY
