name: Earthline Candidate Flow-First Science Correction

on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-candidate-flow-first-science.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 0
      - name: Apply isolated Property science correction
        run: python3 tools/apply_flow_first_safe_contour.py
      - name: Verify and commit
        run: |
          git diff --check
          git config user.name "Earthline Engine"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "science: serve runoff paths from adjacent safe contours"
          git pull --rebase origin candidate-next
          git push origin HEAD:candidate-next
