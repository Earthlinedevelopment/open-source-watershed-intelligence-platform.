name: Earthline V1 Stability Gate 17187
on:
  push:
    branches: [repair/v1-stability-17166]
    paths:
      - 'tests/v1-stability-candidate-17166.mjs'
      - '.github/workflows/earthline-v1-stability-gate-17187.yml'
      - 'index.html'
      - 'earthline-elder-worker-17129.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendered-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-stability-17166
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run rendered V1 stability gate
        run: node tests/v1-stability-candidate-17166.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-v1-stability-17187
          path: artifacts/v1-stability-17166/
          if-no-files-found: warn
