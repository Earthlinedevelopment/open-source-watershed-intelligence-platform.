name: Earthline M75 Apply Property Presentation Truth
on:
  push:
    branches:
      - recovery/mantra75-current-clean
    paths:
      - .github/workflows/earthline-m75-apply-property-presentation-truth.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-current-clean
          fetch-depth: 0
      - run: python3 tools/fix-property-presentation-truth-17703.py
      - run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          if(!s.includes("function propertyBasemapReady16262()"))throw Error("basemap readiness owner missing");
          if(!s.includes("current-viewport-property-swales-17703"))throw Error("current viewport renderer truth missing");
          if(!s.includes("const presentation17703=await settlePropertyMapVisibility16260"))throw Error("awaited settlement missing");
          console.log("EARTHLINE_PROPERTY_PRESENTATION_TRUTH_PARSE_OK",parsed);
          NODE
      - run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: settle Property only after current map presentation verifies"
          git push origin HEAD:recovery/mantra75-current-clean
