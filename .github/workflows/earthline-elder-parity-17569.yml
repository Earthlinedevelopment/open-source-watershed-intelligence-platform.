name: Earthline Elder Parity 17569
on:
  push:
    branches: [test/elder-parity-17569]
    paths:
      - '.github/workflows/earthline-elder-parity-17569.yml'
      - 'tests/elder-parity-17569.mjs'
      - 'tests/earthline-elder-worker-python-17569.js'
  workflow_dispatch:
env:
  CANDIDATE_SHA: fdd4d45368850fe0a36ba497bd9cd934759f595e
jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps firefox
      - run: echo "Parity target $CANDIDATE_SHA"
      - run: xvfb-run -a node tests/elder-parity-17569.mjs
