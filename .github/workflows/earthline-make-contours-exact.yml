name: Earthline MakeContours Exact Trace
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/trace-make-contours-exact.py'
      - '.github/workflows/earthline-make-contours-exact.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tests/trace-make-contours-exact.py
