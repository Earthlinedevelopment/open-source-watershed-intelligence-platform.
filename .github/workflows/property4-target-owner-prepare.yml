name: Prepare pinned Property target ownership fix
on:
  push:
    branches: [repair/property4-gentle-contour-split-20261113]
    paths: [.github/workflows/property4-target-owner-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prevent stale Mapbox moveend from replacing explicit Property coordinates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "1c3ad17464c54cd6c9d8656fb5e3a0a792d776ac"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          marker='function syncPropertyTargetFromMap16201(){'
          start=s.index(marker)
          a=s.index('const existing=window.EARTHLINE_PROPERTY_TARGET_16201;',start)
          b=a+len('const existing=window.EARTHLINE_PROPERTY_TARGET_16201;')
          fragment=base64.b64decode('').decode()
          assert s.count(marker)==1 and s[a:b].startswith('const existing=')
          s=s[:a]+fragment+s[b:]
          before="  }"+chr(10)+"  "+chr(10)+"  if(existing&&existing.source==='country-center'&&window"
          alternate="  }"+chr(10)+"  "+chr(10)+"  if(existing&&existing.source==='country-center' &&window"
          after="  }"+chr(10)+"  if(existing&&existing.source==='country-center' &&window"
          assert before in s or alternate in s
          s=s.replace(before if before in s else alternate,after,1)
          p.write_text(s)
          PY
          test "$(git hash-object index.html)" = "84927595f42e0f8a4d3000cc371761909a30af29"
          git rm .github/workflows/property4-target-owner-prepare.yml
          git config user.name 'Earthline explicit Property target repair'
          git config user.email 'info@earthlinedevelopment.org'
          git add index.html
          git commit -m 'fix(property): retain explicit target across stale moveend including degenerate camera'
          git push origin HEAD:repair/property4-gentle-contour-split-20261113
