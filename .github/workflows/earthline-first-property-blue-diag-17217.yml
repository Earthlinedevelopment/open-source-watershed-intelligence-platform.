name: Earthline First Property Blue Diagnostic 17217
on:
  push:
    branches: [repair/v1-first-property-blue-17217]
    paths:
      - '.github/workflows/earthline-first-property-blue-diag-17217.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-first-property-blue-17217
      - name: Inspect authoritative safe water paint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          term="earthline-property-safe-water-16221"
          start=0
          for i in range(20):
              p=s.find(term,start)
              if p<0: break
              block=s[max(0,p-1200):p+2200]
              if 'addLayer' in block or "'line-color'" in block or 'setPaintProperty' in block:
                  print("\n===== occurrence",i,"=====\n",block)
              start=p+len(term)
          PY
