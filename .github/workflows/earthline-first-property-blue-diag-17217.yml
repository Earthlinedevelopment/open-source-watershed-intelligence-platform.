name: Earthline First Property Blue Diagnostic 17217
on:
  push:
    branches: [repair/v1-first-property-blue-17217]
    paths:
      - '.github/workflows/earthline-first-property-blue-diag-17217.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-first-property-blue-17217
      - name: Inspect safe and neutral swale paint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for term in ["const SAFE_LAYERS_16221={","id:LAYERS.neutral"]:
              p=s.find(term)
              print("\n===== "+term+" =====")
              print(s[p:p+6000] if p>=0 else "NOT FOUND")
          PY
