name: Earthline First Property Blue Diagnostic 17217
on:
  push:
    branches: [repair/v1-first-property-blue-17217]
    paths:
      - '.github/workflows/earthline-first-property-blue-diag-17217.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-first-property-blue-17217
      - name: Inspect natural Property swale layer styles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.find('async function ensureTextureLayers()')
          b=s.find('function widthPx()',a)
          block=s[a:b]
          print(block[:14000])
          PY
