name: Earthline First Property Blue Diagnostic 17217
on:
  workflow_dispatch:
  push:
    branches: [repair/v1-first-property-blue-17217]
    paths:
      - '.github/workflows/earthline-first-property-blue-diag-17217.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-first-property-blue-17217
      - name: Inspect Property swale renderer handoff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for term in [
            "const LAYERS=",
            "const SAFE_LAYERS_16221",
            "natural swale renderer no longer owns",
            "earthline-property-safe-water-16221",
            "earthline-property-swale-natural"
          ]:
              p=s.find(term)
              print("\n===== "+term+" =====")
              print(s[max(0,p-2500):p+6500] if p>=0 else "NOT FOUND")
          PY
