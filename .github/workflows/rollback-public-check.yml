name: Rollback live Property functionality validation
on:
  push:
    branches: [repair/arizona-visible-valid-swales-20261113]
    paths: [tests/rollback-public-live-acceptance.mjs, .github/workflows/rollback-public-check.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node tests/rollback-public-live-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-public-property-screenshots
          path: artifacts/rollback-live-control
          retention-days: 14
