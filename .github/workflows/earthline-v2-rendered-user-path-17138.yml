name: Earthline V2 Rendered User Path 17138
on:
  push:
    branches: [v2/stable-replacement-17138]
    paths:
      - 'index.html'
      - 'earthline-launch-16872.js'
      - 'earthline-launch-16872.css'
      - 'earthline-elder-worker-17129.js'
      - 'tools/elder_trees/chmv2_array_detector_17129.py'
      - 'v2/**'
      - 'tests/v2-rendered-user-path-17138.mjs'
      - '.github/workflows/earthline-v2-rendered-user-path-17138.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendered:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve V2 branch
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 > /tmp/earthline-v2-http.log 2>&1 &
          echo $! > /tmp/earthline-v2-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/earthline-v2-http.log
          exit 1
      - name: Run rendered V2 user path
        run: node tests/v2-rendered-user-path-17138.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-v2-rendered-user-path-17138
          path: artifacts/v2-rendered-user-path-17138/
          if-no-files-found: error
          retention-days: 7
