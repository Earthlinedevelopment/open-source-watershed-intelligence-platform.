name: Earthline M76 Safe Yield Race Repair
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths: ['.github/workflows/earthline-m76-safe-yield-race-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra76-audit-restart
          fetch-depth: 0
      - name: Remove first-paint race from fallback yield
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="if(naturalReady16221&&naturalRendered16221>0){"
          new="if(naturalReady16221){"
          if s.count(old)!=1:
              raise SystemExit(f'fallback natural-ready gate count {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate exact ownership change
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'if(naturalReady16221){' index.html
          ! grep -q 'if(naturalReady16221&&naturalRendered16221>0){' index.html
          grep -q 'delegatedToNatural:true' index.html
          grep -q 'EARTHLINE_M76_NATURAL_FROM_VERIFIED_SAFE_GEOMETRY' index.html
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          console.log('M76_SAFE_YIELD_RACE_PARSE_OK',parsed);
          NODE
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/earthline-m76-safe-yield-race-repair.yml
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/earthline-m76-safe-yield-race-repair.yml
          git commit -m "fix: remove safe fallback first-paint race"
          git push origin HEAD:recovery/mantra76-audit-restart
