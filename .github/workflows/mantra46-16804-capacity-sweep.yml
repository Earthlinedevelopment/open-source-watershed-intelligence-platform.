name: Mantra 46 16804 Capacity Sweep

on:
  push:
    branches:
      - diagnostic-m46-16795-fine-coverage
    paths:
      - 'tests/mantra46-16804-capacity-sweep.mjs'
      - '.github/workflows/mantra46-16804-capacity-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run capacity sweep
        run: node tests/mantra46-16804-capacity-sweep.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16804-capacity-sweep
          path: artifacts/mantra46-16804-capacity-sweep/
          if-no-files-found: error
