name: Earthline live US globe seven-pass gate
on:
  push:
    branches: [pages-live]
    paths:
      - .github/workflows/earthline-us-home-seven-gated.yml
permissions:
  contents: write
concurrency:
  group: earthline-us-home-seven
  cancel-in-progress: false
jobs:
  seven-browser-passes:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source and modify only the home globe center
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html'); raw=p.read_bytes()
          def blob(v): return hashlib.sha1(b'blob '+str(len(v)).encode()+b'\0'+v).hexdigest()
          assert blob(raw)=='d3f4e47829ca6968743cb7486fd656b65a51fc03',('Unexpected source',blob(raw))
          old=b'm.jumpTo({center:[0,18],zoom:1.25,bearing:0,pitch:0})'
          new=b'm.jumpTo({center:[-96,39],zoom:1.25,bearing:0,pitch:0})'
          assert raw.count(old)==1,('Not exact start camera',raw.count(old))
          out=raw.replace(old,new,1)
          p.write_bytes(out)
          Path('expected-home-blob.txt').write_text(blob(out))
          assert raw.count(b'earthlineSuggestionsSuppressed')>0
          print('HOME_ONLY_SHA',blob(out),'BYTE_DELTA',len(out)-len(raw))
          PY
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Seven independent page-level interaction passes
        run: |
          mkdir -p artifacts/us-home-seven
          cat > artifacts/us-home-seven/check.mjs <<'JS'
          import { chromium } from 'playwright';
          import { readFile, writeFile } from 'node:fs/promises';
          const html=await readFile('index.html');
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
          const output=[];
          for(let k=1;k<=7;k++){
            const context=await browser.newContext({viewport:{width:1800,height:900},serviceWorkers:'block'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.route('**/*',route=>route.request().isNavigationRequest()&&route.request().resourceType()==='document'?route.fulfill({status:200,contentType:'text/html; charset=utf-8',body:html}):route.continue());
            const pass={number:k,checks:{},errors};
            try{
              await page.goto('https://earthlinedevelopment.org/?seven-home='+k,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForFunction(()=>{const m=typeof earthlineMap!=='undefined'?earthlineMap:window.earthlineMap;return m&&m.getCenter&&m.getZoom},null,{timeout:30000});
              pass.home=await page.evaluate(()=>{const m=typeof earthlineMap!=='undefined'?earthlineMap:window.earthlineMap;return {center:m.getCenter(),zoom:m.getZoom()}});
              pass.checks.usFacing=Math.abs(pass.home.center.lng+96)<1&&Math.abs(pass.home.center.lat-39)<1;
              pass.checks.searchVisible=await page.locator('#searchInput').isVisible();
              pass.checks.runVisible=await page.locator('#runBtn').isVisible();
              pass.checks.logoExists=(await page.locator('img[alt*="Earthline"],#earthlineLogo,.earthline-logo').count())>0|| (await page.locator('text=Earthline').count())>0;
              await page.locator('#searchInput').fill('iow');
              await page.waitForFunction(()=>document.querySelector('#earthlineSearchSuggestions15970')?.classList.contains('open'),null,{timeout:15000});
              pass.checks.autocompleteOpened=true;
              if(k%2===0){
                await page.locator('#searchInput').press('Enter');
              }else{
                await page.locator('#earthlineSearchSuggestions15970 button[data-query]').first().click();
              }
              await page.waitForTimeout(500);
              pass.checks.autocompleteClosed=await page.locator('#earthlineSearchSuggestions15970').evaluate(el=>getComputedStyle(el).display==='none'&&!el.classList.contains('open'));
              pass.checks.noPageErrors=errors.length===0;
              if(k===1||k===7)await page.screenshot({path:'artifacts/us-home-seven/pass-'+k+'.png'});
            }catch(e){pass.failure=String(e)}
            pass.ok=!pass.failure&&Object.values(pass.checks).length>=6&&Object.values(pass.checks).every(Boolean);
            output.push(pass);
            console.log('SEVEN_GATE_PASS '+JSON.stringify(pass));
            await context.close();
          }
          await writeFile('artifacts/us-home-seven/results.json',JSON.stringify(output,null,2));
          await browser.close();
          if(output.length!==7||output.some(x=>!x.ok))throw Error('Seven-pass gate failed; no site change published');
          JS
          node artifacts/us-home-seven/check.mjs
      - name: Publish one-line home camera patch only after seven passes
        run: |
          set -euo pipefail
          expected="$(cat expected-home-blob.txt)"
          test "$(git hash-object index.html)" = "$expected"
          test "$(git hash-object earthline-elder-restored-17097.js)" = "808890f0c86d501939e8cfdf00148287c7dd3ebc"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --numstat
          test "$(git diff --cached --name-only)" = "index.html"
          git commit -m 'fix(live): US-facing home globe with seven browser passes'
          git push origin HEAD:pages-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-home-seven-pass-evidence
          path: artifacts/us-home-seven/
          retention-days: 30
