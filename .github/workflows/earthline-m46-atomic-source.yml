name: Mantra 46 Atomic Source Extract
on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/mantra46-atomic-source-extract.mjs'
      - '.github/workflows/earthline-m46-atomic-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract atomic source
        run: node tests/mantra46-atomic-source-extract.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mantra46-atomic-source
          path: artifacts/mantra46-atomic-source/
