name: Earthline Firefox Pyodide Phase 17523
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/earthline-firefox-pyodide-phase-17523.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps firefox
      - run: |
          git show origin/repair/property-one-click-17441:tests/firefox-pyodide-phase-17523.mjs > /tmp/test.mjs || cp tests/firefox-pyodide-phase-17523.mjs /tmp/test.mjs
          xvfb-run -a node /tmp/test.mjs
