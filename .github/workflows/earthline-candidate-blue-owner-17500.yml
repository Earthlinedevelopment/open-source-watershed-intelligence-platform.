name: Earthline Candidate Authoritative Blue Property Owner
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/earthline-blue-owner-trigger.txt'
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply canonical presentation correction
        run: python3 tests/apply-authoritative-blue-property-17500.py
      - name: Confirm scope
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Validate Arizona science, one-action target, Elders and blue presentation
        run: env EARTHLINE_URL='http://127.0.0.1:8787/' node tests/authoritative-blue-property-17500.mjs
      - name: Commit validated candidate
        run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "presentation: restore authoritative blue Property swales"
          git push origin HEAD:candidate-next
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-blue-owner-17500
          path: /tmp/earthline-blue-owner-17500.png
          if-no-files-found: warn
