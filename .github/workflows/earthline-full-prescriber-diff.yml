name: Earthline Full Prescriber Diff
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-full-prescriber-diff.yml'
permissions: {contents: read}
jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Diff complete accepted/live prescriber
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,difflib
          live=Path("index.html").read_text(encoding="utf-8")
          old=subprocess.check_output(["git","show","74343a24f90fed7d7abbe9267ef11a2836220de7:index.html"],text=True)

          def extract(src,name):
              starts=["async function "+name,"function "+name]
              i=-1
              for st in starts:
                  i=src.find(st)
                  if i>=0: break
              if i<0: raise SystemExit("missing "+name)
              b=src.find("{",i)
              depth=0
              quote=None
              esc=False
              line=False
              block=False
              j=b
              while j<len(src):
                  c=src[j]
                  n=src[j+1] if j+1<len(src) else ""
                  if line:
                      if c=="\n": line=False
                  elif block:
                      if c=="*" and n=="/":
                          block=False
                          j+=1
                  elif quote:
                      if esc:
                          esc=False
                      elif c=="\\":
                          esc=True
                      elif c==quote:
                          quote=None
                  else:
                      if c=="/" and n=="/":
                          line=True
                          j+=1
                      elif c=="/" and n=="*":
                          block=True
                          j+=1
                      elif c=="'" or c=='"':
                          quote=c
                      elif c=="{":
                          depth+=1
                      elif c=="}":
                          depth-=1
                          if depth==0:
                              return src[i:j+1]
                  j+=1
              raise SystemExit("unterminated "+name)

          for name in ["prescribeSwales15778","traceLevelContour"]:
              a=extract(old,name)
              b=extract(live,name)
              print("\n===== "+name+" lengths accepted/live =====",len(a),len(b))
              diff=difflib.unified_diff(a.splitlines(),b.splitlines(),fromfile="accepted-16584",tofile="live",lineterm="")
              for k,line in enumerate(diff):
                  if k>=3000: break
                  print(line)
          PY
