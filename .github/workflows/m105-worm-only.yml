name: M105 worm-only candidate repair
on:
  push:
    branches: ['fix/mantra105-worm-only']
    paths: ['.github/workflows/m105-worm-only.yml', 'tools/m105-worm-only.py']
permissions:
  contents: write
jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only M105 swale geometry repair to isolated candidate
        run: |
          set -euo pipefail
          python3 tools/m105-worm-only.py
          node tests/mantra102-no-spline-swales.mjs
          python3 tools/earthline-release-airlock-static.py
          git diff --check
          git diff --stat -- index.html
      - name: Commit tested candidate to isolated branch
        run: |
          set -euo pipefail
          git config user.name "earthline-m105-github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix(mantra105): eliminate re-smoothed Regional worms from terrain swale source"
          git push origin HEAD:fix/mantra105-worm-only
