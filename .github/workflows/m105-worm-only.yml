name: M105 worm-only source audit
on:
  push:
    branches: ['fix/mantra105-worm-only']
    paths: ['.github/workflows/m105-worm-only.yml', 'tools/m105-worm-only.py']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace active worm-producing owners without modifying site
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          txt=Path("index.html").read_text()
          print("M105_INDEX_BYTES",len(txt))
          lines=txt.splitlines()
          needles=[r"function makeSwales\(",r"function addPath\(",r"function spline\(",r"Chaikin",r"chaikin",r"worm",r"natural-casing",r"natural-up",r"natural-flip",r"natural-footprint",r"neutral-16177",r"safe-lines",r"swale-opportunities",r"function earthlineRenderRegionalOverlay16020",r"earthlineRenderRegionalOverlay16020",r"function renderSwales",r"setLayoutProperty\(",r"earthlineSwalePolylineM102",r"swale.*(smoothing|smooth)",r"\.setData\("]
          for needle in needles:
            hits=[i for i,line in enumerate(lines) if re.search(needle,line,re.I)]
            print("M105_TERM",needle,"TOTAL",len(hits),"LINES",[i+1 for i in hits[:16]])
            for i in hits[:4]:
              before=max(0,i-1);after=min(len(lines),i+2)
              print("M105_SOURCE",needle,i+1,repr("\n".join(lines[before:after]))[:2000])
          PY
