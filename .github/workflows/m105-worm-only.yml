name: M105 worm-only source audit
on:
  push:
    branches: ['fix/mantra105-worm-only']
    paths: ['.github/workflows/m105-worm-only.yml', 'tools/m105-worm-only.py']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact Regional worm owner and final SVG code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path("index.html").read_text().splitlines()
          ranges=[(29605,29785),(29800,29848),(31348,31380),(31740,31790),(33398,33448),(33480,33545)]
          for start,end in ranges:
            print(f'M105_RANGE {start}-{end}')
            for i in range(start-1,min(end,len(lines))):
              line=lines[i]
              print(f'{i+1:05d}: {line[:550]}'+(' [...TRUNCATED]' if len(line)>550 else ''))
          PY
