name: Earthline Exclusion Style Readiness Repair
on:
  push:
    branches:
      - recovery/mantra75-exclusion-style-ready
    paths:
      - tools/apply-exclusion-style-ready-patch.py
      - .github/workflows/earthline-exclusion-style-ready-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-exclusion-style-ready
          fetch-depth: 0
      - run: python3 tools/apply-exclusion-style-ready-patch.py
      - run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          console.log('EARTHLINE_EXCLUSION_STYLE_READY_PARSE_OK',parsed);
          NODE
      - run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: query local exclusion layers before source-settlement"
          git push origin HEAD:recovery/mantra75-exclusion-style-ready
