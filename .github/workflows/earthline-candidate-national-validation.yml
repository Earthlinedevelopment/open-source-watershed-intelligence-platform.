name: Earthline Candidate National Validation
on:
  push:
    branches: [candidate-next]
    paths:
      - 'index.html'
      - 'earthline-launch-16872.js'
      - 'earthline-elder-worker-17129.js'
      - 'data/elder-trees/**'
      - 'tests/browser-regional-ab-17269.mjs'
      - 'tests/validate-property-50states-final.mjs'
      - 'tests/candidate-origin-router.mjs'
      - '.github/workflows/earthline-candidate-national-validation.yml'
permissions:
  contents: read

jobs:
  regional:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate-next}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run 50-state Regional shard
        shell: bash
        run: |
          case "${{ matrix.shard }}" in
            0) STATES='Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia' ;;
            1) STATES='Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland' ;;
            2) STATES='Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey' ;;
            3) STATES='New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina' ;;
            4) STATES='South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming' ;;
          esac
          env EARTHLINE_URL='https://earthlinedevelopment.org/' EARTHLINE_CANDIDATE_ORIGIN='1' BROWSER='chromium' HEADLESS='true' WAIT_MS='90000' STATES="$STATES" node tests/browser-regional-ab-17269.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-50state-${{ matrix.shard }}
          path: artifacts/browser-regional-17269/
          if-no-files-found: warn

  property:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate-next}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run 50-state Property shard
        shell: bash
        run: |
          case "${{ matrix.shard }}" in
            0) STATES='Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia' ;;
            1) STATES='Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland' ;;
            2) STATES='Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey' ;;
            3) STATES='New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina' ;;
            4) STATES='South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming' ;;
          esac
          env EARTHLINE_URL='https://earthlinedevelopment.org/' EARTHLINE_CANDIDATE_ORIGIN='1' STATES="$STATES" OUT="property50-${{ matrix.shard }}.json" node tests/validate-property-50states-final.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: property-50state-${{ matrix.shard }}
          path: property50-${{ matrix.shard }}.json
          if-no-files-found: warn

  southeast-asia:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate-next}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Regional Thailand Vietnam Laos controls
        run: env EARTHLINE_URL='https://earthlinedevelopment.org/' EARTHLINE_CANDIDATE_ORIGIN='1' BROWSER='chromium' HEADLESS='true' WAIT_MS='90000' STATES='Thailand|Vietnam|Laos|Chiang Mai|Can Tho' node tests/browser-regional-ab-17269.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: southeast-asia-regional
          path: artifacts/browser-regional-17269/
          if-no-files-found: warn
