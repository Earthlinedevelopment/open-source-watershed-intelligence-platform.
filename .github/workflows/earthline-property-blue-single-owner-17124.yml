name: Earthline Property Blue Single Owner 17124

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-property-blue-single-owner-17124.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0

      - name: Remove duplicate Property swale visibility writer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          old="    for(const id of Object.values(PROPERTY))visible(id,property);if(t==='regional'){setPaint('earthline-ranked-swale-water-15777','line-color','#008cff');setPaint('earthline-ranked-swale-water-15777','line-opacity',1)}"
          new="    /* EARTHLINE 17124 — BUILD-CHECK-15805 is the single Property swale visibility owner. */if(t==='regional'){setPaint('earthline-ranked-swale-water-15777','line-color','#008cff');setPaint('earthline-ranked-swale-water-15777','line-opacity',1)}"

          if s.count(old) != 1:
              raise SystemExit(f"Expected exactly one duplicate Property visibility writer; found {s.count(old)}")

          # Preserve the two user-verified presentation repairs exactly.
          blue="paint:{'line-color':'#008cff','line-width':['interpolate',['linear'],['zoom'],14,3.4,17,5.4,20,7.2],'line-opacity':.82}}"
          zoom=".el49-detail-shell{width:min(680px,96vw);max-height:calc(100vh - 36px);overflow:auto;"
          if blue not in s:
              raise SystemExit("Verified Property blue lock missing; refusing patch")
          if zoom not in s:
              raise SystemExit("Verified Zoom repair missing; refusing patch")
          if "earthline-presentation-lock-17139" in s:
              raise SystemExit("Regional presentation override present; refusing patch")

          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          PY

          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          assert "EARTHLINE 17124 — BUILD-CHECK-15805 is the single Property swale visibility owner." in s
          assert "for(const id of Object.values(PROPERTY))visible(id,property);" not in s
          assert "paint:{'line-color':'#008cff','line-width':['interpolate',['linear'],['zoom'],14,3.4,17,5.4,20,7.2],'line-opacity':.82}}" in s
          assert ".el49-detail-shell{width:min(680px,96vw);max-height:calc(100vh - 36px);overflow:auto;" in s
          assert "earthline-presentation-lock-17139" not in s
          print("17124 single-owner contract PASS")
          PY

      - name: Commit exact repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/earthline-property-blue-single-owner-17124.yml
          git config user.name "earthline-release-bot"
          git config user.email "earthline-release-bot@users.noreply.github.com"
          git add index.html .github/workflows/earthline-property-blue-single-owner-17124.yml
          git diff --cached --name-only
          git commit -m "ui: make 15805 sole Property swale visibility owner 17124"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
