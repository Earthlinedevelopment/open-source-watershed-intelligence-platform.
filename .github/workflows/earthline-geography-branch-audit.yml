name: Earthline Geography Branch Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-geography-branch-trigger']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=[
            "fullAlaskaExtent16905",
            "ca-cgndb-vancouver-island",
            "vancouver\\s+island",
            "function isChiang",
            "const CHIANG=",
            "isChiang("
          ]
          for n in needles:
            print("\n===",n,"===")
            start=0
            while True:
              i=s.find(n,start)
              if i<0: break
              print(s[max(0,i-3500):min(len(s),i+9000)])
              start=i+len(n)
          PY
