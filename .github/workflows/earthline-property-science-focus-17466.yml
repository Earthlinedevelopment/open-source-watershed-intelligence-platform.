name: Earthline Property Science Focus Control 17466
on:
  push:
    branches: [repair/mantra67-launch-final-17454]
    paths:
      - 'tests/property-science-focus-17466.mjs'
      - '.github/workflows/earthline-property-science-focus-17466.yml'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  science:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/http.log 2>&1 & sleep 2
      - id: test
        continue-on-error: true
        run: env EARTHLINE_URL='http://127.0.0.1:8787/' node tests/property-science-focus-17466.mjs
      - name: Persist result
        if: always()
        run: |
          mkdir -p test-results
          cp artifacts/science-focus-17466.json test-results/science-focus-17466.json || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results/science-focus-17466.json
          git commit -m "test: persist science focus 17466" || true
          git pull --rebase origin repair/mantra67-launch-final-17454 || true
          git push origin HEAD:repair/mantra67-launch-final-17454 || true
      - name: Enforce
        if: steps.test.outcome != 'success'
        run: exit 1
