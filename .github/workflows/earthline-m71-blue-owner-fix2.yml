name: Earthline Mantra 71 Blue Gate Fix
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-m71-blue-owner-fix2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Patch water owner gate
        run: python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); old='state.mode===\"property\"&&\\n      String((window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||{}).tier||(window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||{}).mode||document.documentElement.dataset.earthlineAnalysisTier||\"\").toLowerCase()===\"property\"'; assert s.count(old)==1,s.count(old); s=s.replace(old,'state.mode===\"property\"').replace('EARTHLINE 17564 — committed Property publication owns direct blue water; stale legacy Regional active state may not erase it.','EARTHLINE 17565 — committed safety-verified Property publication owns blue water; transient displayed-tier UI state may not erase it.'); p.write_text(s)"
      - name: Validate
        run: node -e "const fs=require('fs'),s=fs.readFileSync('index.html','utf8'); if((s.match(/EARTHLINE 17565/g)||[]).length!==1)throw Error('marker'); if((s.match(/function propertyActive15824\(\)/g)||[]).length!==1)throw Error('owner'); for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){if(!m[1].trim())continue;new Function(m[1])}"
      - name: Publish
        run: |
          git config user.name "Earthline Production Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git rm .github/workflows/earthline-m71-blue-owner-fix.yml || true
          git rm .github/workflows/earthline-m71-blue-owner-fix2.yml
          git add index.html
          git commit -m "fix: keep committed first Property water independent of transient UI tier"
          git push origin HEAD:pages-live
