# Mantra 92 — permanently retire an old unverified production writer.
# Original implementation and data remain available in Git history and in
# the current production snapshot. No runtime or scientific data is modified.
name: Retired legacy mantra38-production-sequence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Reject direct production mutation
        run: |
          echo "::error::This direct production writer is retired by Earthline Mantra 92."
          echo "::error::Use a pinned, accepted candidate and explicit release gate."
          exit 1
