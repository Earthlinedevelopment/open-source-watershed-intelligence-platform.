name: Mantra 38 Production Sequence

on:
  push:
    branches: [pages-live]
    paths:
      - 'tools/mantra38-inspect-16584-water-validity.mjs'
      - '.github/workflows/mantra38-production-sequence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspect 16584 lake-validity owner
        run: node tools/mantra38-inspect-16584-water-validity.mjs
