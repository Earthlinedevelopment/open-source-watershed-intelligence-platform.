name: Mantra 38 Production Sequence

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/mantra38-production-sequence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify repaired owner is serving
        run: curl -fsS --max-time 30 https://earthlinedevelopment.org/ | grep -q 'earthlineLoadedStyleWaterIndex16584'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify NY against serving map water
        run: |
          sed -i 's#https://live.earthlinedevelopment.org/#https://earthlinedevelopment.org/#' tests/mantra38-visible-water-audit.mjs
          node tests/mantra38-visible-water-audit.mjs
