name: Earthline makeSwales Callers 17449
on:
  push:
    branches: [repair/property-science-final-17447]
    paths:
      - 'tests/extract-makeswales-callers-17449.py'
      - '.github/workflows/earthline-makeswales-callers-17449.yml'
permissions: {contents: read}
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/property-science-final-17447}
      - run: python3 tests/extract-makeswales-callers-17449.py
      - uses: actions/upload-artifact@v4
        with:
          name: makeswales-callers-17449
          path: makeswales-callers-17449.txt
