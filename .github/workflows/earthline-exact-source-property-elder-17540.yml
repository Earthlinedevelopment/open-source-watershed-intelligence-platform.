name: Earthline Exact Source Property Elder 17540
on:
  push:
    branches: [candidate/earthline-launch-17540]
    paths:
      - 'index.html'
      - 'earthline-launch-16872.js'
      - 'earthline-elder-worker-17129.js'
      - 'tools/elder_trees/chmv2_array_detector_17129.py'
      - 'tests/exact-source-property-elder-17540.mjs'
      - '.github/workflows/earthline-exact-source-property-elder-17540.yml'
  workflow_dispatch:
permissions: {contents: read}

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/earthline-launch-17540}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          if [ '${{ matrix.browser }}' = 'firefox' ]; then
            xvfb-run -a env EARTHLINE_URL='https://earthlinedevelopment.org/' BROWSER='firefox' HEADLESS='false' node tests/exact-source-property-elder-17540.mjs
          else
            env EARTHLINE_URL='https://earthlinedevelopment.org/' BROWSER='chromium' HEADLESS='true' node tests/exact-source-property-elder-17540.mjs
          fi

  webkit:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/earthline-launch-17540}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - run: env EARTHLINE_URL='https://earthlinedevelopment.org/' BROWSER='webkit' HEADLESS='true' node tests/exact-source-property-elder-17540.mjs
