name: Earthline R15 canopy source isolated New York Property two-run gate
on:
  push:
    branches: [test/r15-edge-property-isolated-20261122]
permissions:
  contents: read
jobs:
  property:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        profile: [chrome, safari]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact current-live R15 candidate
        run: |
          python3 tools/build-r15-candidate.py index.html earthline-property-swales.js /tmp/r15-base.html
          python3 tools/build_r15_usfs_candidate.py /tmp/r15-base.html /tmp/r15-source.html
          cp /tmp/r15-source.html index.html
          test "$(sha256sum earthline-usfs-canopy-r15.js | cut -d' ' -f1)" = 'a3c8a3dba1060387fa1bc66ee240917cbd7e35689dd7fa75a9bcd9fed5088df7'
      - name: Install test browsers
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Exact public map coordinates, property twice, forest mask integrity
        env:
          EARTHLINE_PROFILE: ${{ matrix.profile }}
        run: node tests/r15-edge-ny-property-only.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r15-edge-property-only-${{ matrix.profile }}
          path: founder-regression/${{ matrix.profile }}/
          retention-days: 7
