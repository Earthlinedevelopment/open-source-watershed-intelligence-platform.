name: Earthline Extract Property Control Owner 17488
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/earthline-extract-property-control-17488.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17487
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['earthlineDeclareProperty16169','restoreControls','earthlinePropertyClickOwner16546','earthlinePointerLaunch17444','property.onclick','property.onpointerup','EARTHLINE_PROPERTY_REPEAT_ONE_PRESS_17451']
          out=[]
          for t in terms:
              start=0
              while True:
                  i=s.find(t,start)
                  if i<0: break
                  out.append(f'===== {t} @ {i} =====\n'+s[max(0,i-8000):i+16000])
                  start=i+1
          Path('/tmp/property-control-owner-17488.txt').write_text('\n\n'.join(out),encoding='utf-8')
          print('sections',len(out))
          PY
      - run: |
          git fetch origin repair/property-one-click-17441
          rm -rf /tmp/gate
          git worktree add /tmp/gate origin/repair/property-one-click-17441
          mkdir -p /tmp/gate/test-results
          cp /tmp/property-control-owner-17488.txt /tmp/gate/test-results/property-control-owner-17488.txt
          cd /tmp/gate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results/property-control-owner-17488.txt
          git commit -m "test: persist Property control owner 17488" || true
          git push origin HEAD:repair/property-one-click-17441
