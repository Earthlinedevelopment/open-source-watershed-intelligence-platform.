name: Earthline Elder Parity 17560
on:
  push:
    branches: [test/elder-parity-17560]
    paths:
      - '.github/workflows/earthline-elder-parity-17560.yml'
      - 'tests/elder-parity-17560.mjs'
      - 'tests/earthline-elder-worker-python-17560.js'
  workflow_dispatch:
jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps firefox
      - run: xvfb-run -a node tests/elder-parity-17560.mjs
