name: Earthline M76 Property Interception and Elder Live Fix
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-property-interception-elder-live.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Require runoff interception and restore post-science Elder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          pat=r"(sw\.flowEvidence15833=flowEvidence15833;\s*sw\.prescriptionFlowScore15833=Number\(flowEvidence15833\.score\|\|0\);\s*sw\.seedFlowCrossing15833=Number\(sd&&sd\.flowCrossingValue\|\|0\);\s*sw\.seedCrossingGeometry15833=Number\(sd&&sd\.crossingGeometry\|\|0\);)"
          guard=r"""\1
          /* EARTHLINE M76E — Property secondary-fill corridors must intercept modeled runoff. */
          if(!isRegionalTile15769&&Number(flowEvidence15833.crossingHits||0)<=0&&
             Number(sw.seedFlowCrossing15833||0)<=0&&Number(sw.seedCrossingGeometry15833||0)<=0){
            M.swaleDiagnostics.stage.rejectConversion++;
            continue;
          }"""
          s,n=re.subn(pat,guard,s,count=1)
          if n!=1:
              raise SystemExit(f'secondary flow-evidence regex matches {n}')

          old="void Promise.resolve(window.EARTHLINE_ELDER_TREES_V1_17097?.startProperty?.()).finally(()=>{"
          new="void Promise.resolve(window.EARTHLINE_ELDER_TREES_V1_17097?.primePropertyEvidence?.()).then(()=>window.EARTHLINE_ELDER_TREES_V1_17097?.startProperty?.()).finally(()=>{"
          if s.count(old)!=1:
              raise SystemExit(f'post-science Elder start count {s.count(old)}')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          node -e "const fs=require('fs'),s=fs.readFileSync('index.html','utf8');if(!s.includes('Property secondary-fill corridors must intercept modeled runoff'))throw Error('interception guard missing');if(!s.includes('primePropertyEvidence?.()).then(()=>window.EARTHLINE_ELDER_TREES_V1_17097?.startProperty?.())'))throw Error('Elder post-science prime missing');let n=0;for(const m of s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)){if(!m[1].trim())continue;new Function(m[1]);n++}console.log('M76E_PARSE_OK',n)"
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: require runoff interception for Property swales and restore Elder"
          git push origin HEAD:pages-live
