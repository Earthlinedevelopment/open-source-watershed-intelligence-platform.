name: Mantra 51 How Swales Structure Audit
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - '.github/workflows/mantra51-how-swales-structure-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - run: python3 -m http.server 8787 >/tmp/el-http.log 2>&1 &
      - run: |
          cat > audit.mjs <<'JS'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({viewport:{width:1600,height:1100}});
          await p.goto('http://127.0.0.1:8787/index.html?structure='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await p.waitForTimeout(3500);
          await p.evaluate(()=>{location.hash='#swales-explained'});
          await p.waitForTimeout(1200);
          const out=await p.evaluate(()=>{
            const d=document.querySelector('#earthlineSwalesPage16125 iframe')?.contentDocument;
            const nodes=[...(d?.querySelectorAll('main h1,main h2,main h3,main .el49-kicker')||[])];
            return nodes.map((n,i)=>({i,tag:n.tagName,cls:n.className||'',text:(n.textContent||'').trim().replace(/\s+/g,' ')}));
          });
          console.log(JSON.stringify(out,null,2));
          await b.close();
          JS
          node audit.mjs
