name: Earthline Property Final Spacing Diagnostic
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-property-final-spacing-diagnostic.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 0
      - name: Compare current and 16584-era spacing owners
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          refs=[('CURRENT','HEAD'),('RESTORED_16584','d04ecacc82dd76ff809ba7954c6c7658e049e86d')]
          for label,ref in refs:
              if ref=='HEAD':
                  s=Path('index.html').read_text(encoding='utf-8')
              else:
                  s=subprocess.check_output(['git','show',ref+':index.html'],text=True,errors='replace')
              lines=s.splitlines()
              print('\n===== '+label+' seed separation =====')
              for i,line in enumerate(lines):
                  if 'if(out.every(s=>Math.hypot(c.x-s.x,c.y-s.y)>' in line:
                      for n in range(max(0,i-12),min(len(lines),i+18)): print(f'{n+1}: {lines[n]}')
                      break
              print('\n===== '+label+' final spacing =====')
              hits=[i for i,line in enumerate(lines) if 'rejectFinalSpacing' in line]
              for i in hits[:4]:
                  for n in range(max(0,i-25),min(len(lines),i+70)): print(f'{n+1}: {lines[n]}')
          PY
