name: Earthline M76 Swale Geometry and Color Repair
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths: ['.github/workflows/earthline-m76-swale-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra76-audit-restart
          fetch-depth: 0
      - name: Repair authoritative swale geometry and existing renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # 1) Geometry: one universal construction-shape rule.
          old_len='''function earthlineSegmentLengthM(pts){
  if(!pts||pts.length<2)return 0;
  let d=0;
  for(let i=1;i<pts.length;i++)d+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1])*M.cellM;
  return d;
}'''
          new_len=old_len+'''

/* EARTHLINE M76 — construction-shape guard.
   A level interception corridor may curve with the terrain, but it must not wrap
   around a landform as a long serpentine contour. This is one geography-neutral
   shape rule; it does not alter DEM, contour elevation, exclusions, hydrology,
   spacing, or runoff-path ownership. */
function earthlineSegmentTortuosityM76(pts){
  if(!pts||pts.length<2)return Infinity;
  const lenM=earthlineSegmentLengthM(pts),a=pts[0],b=pts[pts.length-1];
  const chordM=Math.hypot(b[0]-a[0],b[1]-a[1])*M.cellM;
  return lenM/Math.max(1,chordM);
}'''
          if s.count(old_len)!=1: raise SystemExit('segment length owner count != 1')
          s=s.replace(old_len,new_len,1)

          old_accept='''function earthlineSwaleGeometryAcceptable(pts,lenM){
  if(!pts||pts.length<3||lenM<12)return false;
  const a=pts[0],b=pts[pts.length-1],gapM=Math.hypot(a[0]-b[0],a[1]-b[1])*M.cellM;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const p of pts){minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1]);}
  const diagM=Math.hypot(maxX-minX,maxY-minY)*M.cellM;
  const loopish=gapM<Math.max(8,lenM*0.12);
  // Suppress small closed rings and compact bullseyes caused by neighborhood/DEM artifacts.
  if(loopish&&(lenM<240||lenM/Math.max(1,diagM)>3.2))return false;
  if(lenM/Math.max(1,diagM)>6)return false;
  return true;
}'''
          new_accept='''function earthlineSwaleGeometryAcceptable(pts,lenM){
  if(!pts||pts.length<3||lenM<12)return false;
  const a=pts[0],b=pts[pts.length-1],gapM=Math.hypot(a[0]-b[0],a[1]-b[1])*M.cellM;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const p of pts){minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1]);}
  const diagM=Math.hypot(maxX-minX,maxY-minY)*M.cellM;
  const loopish=gapM<Math.max(8,lenM*0.12);
  const tortuosityM76=earthlineSegmentTortuosityM76(pts);
  // A swale is an interception earthwork, not a closed contour ring or a winding contour trace.
  if(loopish)return false;
  if(tortuosityM76>1.55)return false;
  if(lenM/Math.max(1,diagM)>1.80)return false;
  return true;
}'''
          if s.count(old_accept)!=1: raise SystemExit('geometry acceptance owner count != 1')
          s=s.replace(old_accept,new_accept,1)

          old_split='''  segs.sort((a,b)=>earthlineSegmentLengthM(b)-earthlineSegmentLengthM(a));
  return segs;'''
          new_split='''  segs.sort((a,b)=>
    (earthlineSegmentTortuosityM76(a)-earthlineSegmentTortuosityM76(b))||
    (earthlineSegmentLengthM(b)-earthlineSegmentLengthM(a))
  );
  return segs;'''
          if s.count(old_split)!=1: raise SystemExit('usable-segment sort owner count != 1')
          s=s.replace(old_split,new_split,1)

          old_flow='''        segs15836.sort((a,b)=>earthlineSegmentLengthM(b)-earthlineSegmentLengthM(a));
        for(const seg15836 of segs15836){'''
          new_flow='''        // Prefer the least-winding safe contour crossing; length breaks ties only.
        // This keeps the runoff interception but prevents an entire curling contour
        // from winning merely because it is longest.
        segs15836.sort((a,b)=>
          (earthlineSegmentTortuosityM76(a)-earthlineSegmentTortuosityM76(b))||
          (earthlineSegmentLengthM(b)-earthlineSegmentLengthM(a))
        );
        for(const seg15836 of segs15836){'''
          if s.count(old_flow)!=1: raise SystemExit('flow-first longest sort owner count != 1')
          s=s.replace(old_flow,new_flow,1)

          # 2) Color: strengthen the already-authoritative natural renderer, no new layers.
          replacements=[
            ("footprint:{'fill-color':'#5d4a31','fill-opacity':.065,'fill-outline-color':'#163020'}",
             "footprint:{'fill-color':'#6f5137','fill-opacity':.10,'fill-outline-color':'#244d32'}"),
            ("casing:{'line-color':'#102117','line-opacity':.64,'line-width':26}",
             "casing:{'line-color':'#6b4d32','line-opacity':.88,'line-width':26}"),
            ("neutral:{'line-color':'#7f9568','line-opacity':.66,'line-width':18,'line-dasharray':[1.25,.55]}",
             "neutral:{'line-color':'#5f985c','line-opacity':.86,'line-width':18,'line-dasharray':[1.25,.55]}"),
            ("up:{'line-pattern':IMG_UP,'line-opacity':.72,'line-width':22}",
             "up:{'line-pattern':IMG_UP,'line-opacity':.90,'line-width':22}"),
            ("flip:{'line-pattern':IMG_FLIP,'line-opacity':.72,'line-width':22}",
             "flip:{'line-pattern':IMG_FLIP,'line-opacity':.90,'line-width':22}"),
            ("paint:{'fill-color':'#5d4a31','fill-opacity':.065,'fill-outline-color':'#163020'}",
             "paint:{'fill-color':'#6f5137','fill-opacity':.10,'fill-outline-color':'#244d32'}"),
            ("paint:{'line-color':'#102117','line-opacity':.64,'line-width':26}",
             "paint:{'line-color':'#6b4d32','line-opacity':.88,'line-width':26}"),
            ("paint:{'line-color':'#7f9568','line-opacity':.66,'line-width':18,'line-dasharray':[1.25,.55]}",
             "paint:{'line-color':'#5f985c','line-opacity':.86,'line-width':18,'line-dasharray':[1.25,.55]}"),
            ("paint:{'line-pattern':IMG_UP,'line-opacity':.72,'line-width':22}",
             "paint:{'line-pattern':IMG_UP,'line-opacity':.90,'line-width':22}"),
            ("paint:{'line-pattern':IMG_FLIP,'line-opacity':.72,'line-width':22}",
             "paint:{'line-pattern':IMG_FLIP,'line-opacity':.90,'line-width':22}"),
            ("if(mp.getLayer?.(LAYERS.footprint))mp.setPaintProperty(LAYERS.footprint,'fill-opacity',.025);",
             "if(mp.getLayer?.(LAYERS.footprint))mp.setPaintProperty(LAYERS.footprint,'fill-opacity',.085);")
          ]
          for old,new in replacements:
              c=s.count(old)
              if c!=1: raise SystemExit(f'color owner match count {c}: {old[:70]}')
              s=s.replace(old,new,1)

          old_safe="""{id:SAFE_LAYERS_16221.water,type:'line',source:SAFE_SOURCE_16221,layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#4ec9ff','line-opacity':.98,'line-width':['interpolate',['linear'],['zoom'],14,3.90625,17,8.203125,20,12.5],'line-offset':['interpolate',['linear'],['zoom'],14,1.2,17,2.5,20,3.8]}}"""
          new_safe="""{id:SAFE_LAYERS_16221.water,type:'line',source:SAFE_SOURCE_16221,layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#3aaee8','line-opacity':.82,'line-width':['interpolate',['linear'],['zoom'],14,2.6,17,5.2,20,7.2],'line-offset':['interpolate',['linear'],['zoom'],14,1.2,17,2.2,20,3.2]}}"""
          if s.count(old_safe)!=1: raise SystemExit('safe water style owner count != 1')
          s=s.replace(old_safe,new_safe,1)

          old_owner="""if(typeof window.earthlineApplyRendererOwnership15805==='function')window.earthlineApplyRendererOwnership15805('property');if(mp.getLayer?.('earthline-property-swale-ditch-16166'))mp.moveLayer('earthline-property-swale-ditch-16166')"""
          new_owner="""if(typeof window.earthlineApplyRendererOwnership15805==='function')window.earthlineApplyRendererOwnership15805('property');/* EARTHLINE M76 — the natural Property renderer is the final swale presentation owner. A legacy ownership call may restore older living/safe line visibility, so retire those same existing layers again after ownership settles; do not create a second renderer. */for(const id of OLD)visible(id,false);for(const id of ['earthline-property-safe-casing-16221','earthline-property-safe-earth-16221','earthline-property-safe-life-16221','earthline-property-safe-water-16221']){try{if(mp.getLayer?.(id))mp.setPaintProperty(id,'line-opacity',0)}catch(_){}}if(mp.getLayer?.('earthline-property-swale-ditch-16166'))mp.moveLayer('earthline-property-swale-ditch-16166')"""
          if s.count(old_owner)!=1: raise SystemExit('natural renderer ownership handoff count != 1')
          s=s.replace(old_owner,new_owner,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate swale-only repair
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'function earthlineSegmentTortuosityM76' index.html
          grep -q 'tortuosityM76>1.55' index.html
          grep -q 'least-winding safe contour crossing' index.html
          grep -q "fill-opacity',.085" index.html
          grep -q "'line-color':'#6b4d32'" index.html
          grep -q "'line-color':'#5f985c'" index.html
          grep -q "'line-color':'#3aaee8','line-opacity':.82" index.html
          grep -q 'natural Property renderer is the final swale presentation owner' index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('function earthlineSegmentTortuosityM76(')==1
          assert s.count('function earthlineSwaleGeometryAcceptable(')==1
          assert s.count('async function prescribeSwales15778(')==1
          assert 'segs15836.sort((a,b)=>earthlineSegmentLengthM(b)-earthlineSegmentLengthM(a))' not in s
          # No state/country scab in the repair marker block.
          i=s.index('/* EARTHLINE M76 — construction-shape guard.')
          j=s.index('function earthlineMinimumSwaleLengthM15768',i)
          block=s[i:j]
          for term in ['Arizona','Iowa','Vermont','Thailand','stateCode','countryCode']:
              assert term not in block
          PY
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          function tort(pts){let d=0;for(let i=1;i<pts.length;i++)d+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);const a=pts[0],b=pts[pts.length-1],c=Math.hypot(b[0]-a[0],b[1]-a[1]);return d/Math.max(1,c)}
          const straight=[[0,0],[10,0],[20,0],[30,0]];
          const gentle=[[0,0],[10,1],[20,3],[30,5]];
          const worm=[[0,0],[10,0],[15,8],[10,16],[0,16],[-5,8],[0,1]];
          if(!(tort(straight)<1.05&&tort(gentle)<1.15&&tort(worm)>1.55))throw Error('tortuosity discriminator failed');
          console.log('M76_SWALE_REPAIR_PARSE_OK',parsed,'worm',tort(worm).toFixed(3));
          NODE

      - name: Commit product repair and remove diagnostic scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/earthline-m76-swale-inspect.yml
          rm -f .github/workflows/earthline-m76-swale-inspect-2.yml
          rm -f .github/workflows/earthline-m76-swale-inspect-3.yml
          rm -f .github/workflows/earthline-m76-swale-repair.yml
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows
          git commit -m "fix: remove worm swales and restore natural corridor colors"
          git push origin HEAD:recovery/mantra76-audit-restart
