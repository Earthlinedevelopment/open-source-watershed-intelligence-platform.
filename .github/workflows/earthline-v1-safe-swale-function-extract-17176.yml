name: Earthline V1 Safe-First Presentation 17181
on:
  push:
    branches:
      - research/elder-browser-engine-17129
    paths:
      - .github/workflows/earthline-v1-safe-swale-function-extract-17176.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-stability-17166
          fetch-depth: 0
      - name: Require rendered safe swales before optional context settle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8",errors="strict")
          marker="EARTHLINE_SAFE_FIRST_PRESENTATION_17181"

          old1="""    const visibleLayers=Object.values(SAFE_LAYERS_16221).filter(id=>{try{return !!mp.getLayer?.(id)&&mp.getLayoutProperty?.(id,'visibility')!=='none'}catch(_){return false}});
    const ok=visibleLayers.length===Object.keys(SAFE_LAYERS_16221).length;
    const audit={build:BUILD,reason,active,verified:true,count,sourceReady:true,layersReady:true,visible:ok,visibleLayers,moved,geometrySource:'M.authoritativeSafeSwales15815',safetyGate:'propertyPublication15816 + propertyResultLock15815 + safetyAudit15806 + searchGen match',at:new Date().toISOString()};"""
          new1="""    const visibleLayers=Object.values(SAFE_LAYERS_16221).filter(id=>{try{return !!mp.getLayer?.(id)&&mp.getLayoutProperty?.(id,'visibility')!=='none'}catch(_){return false}});
    let renderedFeatures17181=0;
    try{
      const canvas17181=mp.getCanvas?.();
      const box17181=canvas17181&&[[0,0],[canvas17181.clientWidth||canvas17181.width,canvas17181.clientHeight||canvas17181.height]];
      if(box17181&&visibleLayers.length)renderedFeatures17181=(mp.queryRenderedFeatures?.(box17181,{layers:visibleLayers})||[]).length;
    }catch(_){}
    const ok=visibleLayers.length===Object.keys(SAFE_LAYERS_16221).length&&renderedFeatures17181>0; /* EARTHLINE_SAFE_FIRST_PRESENTATION_17181 */
    const audit={build:BUILD,reason,active,verified:true,count,sourceReady:true,layersReady:true,visible:ok,renderedFeatures:renderedFeatures17181,visibleLayers,moved,geometrySource:'M.authoritativeSafeSwales15815',safetyGate:'propertyPublication15816 + propertyResultLock15815 + safetyAudit15806 + searchGen match',at:new Date().toISOString()};"""
          if marker not in s:
              if old1 not in s:
                  raise SystemExit("safe rendered verification anchor not found")
              s=s.replace(old1,new1,1)

          old2="""        let safeOk=count===0;
        try{const safe=syncSafePropertyFallback16221('bounded-postpublish-16521-'+delay);safeOk=count===0||!!(safe&&safe.ok);last=Object.assign({},last||{},{safe})}catch(_){ }
        try{if(typeof window.earthlineSchedulePropertyWater15823==='function')window.earthlineSchedulePropertyWater15823('bounded-postpublish-16521-'+delay)}catch(_){ }"""
          new2="""        let safeOk=count===0;
        try{const safe=syncSafePropertyFallback16221('bounded-postpublish-16521-'+delay);safeOk=count===0||!!(safe&&safe.ok);last=Object.assign({},last||{},{safe})}catch(_){ }
        if(count>0&&!safeOk)continue; /* EARTHLINE_SAFE_FIRST_PRESENTATION_17181: paint authoritative swales before optional context work */
        try{if(typeof window.earthlineSchedulePropertyWater15823==='function')window.earthlineSchedulePropertyWater15823('bounded-postpublish-16521-'+delay)}catch(_){ }"""
          if old2 not in s:
              raise SystemExit("postpublish safe-first anchor not found")
          s=s.replace(old2,new2,1)

          if s.count(marker)!=2:
              raise SystemExit("expected two safe-first markers, found "+str(s.count(marker)))
          p.write_text(s,encoding="utf-8")
          print("safe-first presentation patch PASS")
          PY
          git diff --check
          test "$(git diff --name-only)" = "index.html"
      - name: Commit candidate repair
        shell: bash
        run: |
          git config user.name earthline-release-bot
          git config user.email earthline-release-bot@users.noreply.github.com
          git add index.html
          git commit -m "repair: paint safe swales before optional Property context 17181"
          git pull --rebase origin repair/v1-stability-17166
          git push origin HEAD:repair/v1-stability-17166
