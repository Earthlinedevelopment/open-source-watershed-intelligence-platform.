name: Earthline V1 Postpublish Block Inspect 17180
on:
  push:
    branches:
      - research/elder-browser-engine-17129
    paths:
      - .github/workflows/earthline-v1-safe-swale-function-extract-17176.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-stability-17166
          fetch-depth: 1
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8",errors="ignore")
          for term in [
            "const texture=",
            "syncNatural",
            "settleCurrentPropertyPresentation16521",
            "frameDeclaredProperty(site)",
            "earthlineSchedulePropertyWater15823",
            "publishPropertyDisplay16220(site,selectedCode)",
            "verifySafePropertyFallback16221"
          ]:
              print("\n===== "+term+" =====")
              p=0
              while True:
                  i=s.find(term,p)
                  if i<0: break
                  print("\n---",i,"---")
                  print(s[max(0,i-7000):min(len(s),i+15000)])
                  p=i+len(term)
          PY
