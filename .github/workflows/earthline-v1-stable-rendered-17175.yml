name: Earthline V1 Stable Rendered 17175
on:
  push:
    branches: [repair/v1-stable-17175]
    paths:
      - 'earthline-launch-16872.js'
      - 'earthline-elder-worker-17129.js'
      - 'index.html'
      - 'tests/v1-stable-rendered-17175.mjs'
      - '.github/workflows/earthline-v1-stable-rendered-17175.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendered:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/v1-stable-rendered-17175.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-v1-stable-rendered-17175
          path: artifacts/v1-stable-rendered-17175/
          if-no-files-found: warn
          retention-days: 7
