name: Earthline report click audit 16994
on:
  push:
    branches: [pages-live]
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Inspect report click/open owners
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for n in ["earthlineVermontReport16149","openReport","earthlineVermontReportPanel16149","addEventListener('click'","onclick","data-ready","reportData()","buildReport("]:
              print("\n###",n)
              start=0
              for _ in range(30):
                  i=s.find(n,start)
                  if i<0: break
                  print("---",i,"---")
                  print(s[max(0,i-2200):min(len(s),i+5200)])
                  start=i+len(n)
          PY
