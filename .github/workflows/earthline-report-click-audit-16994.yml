name: Earthline stable restore 16995
on:
  push:
    branches:
      - pages-live
permissions:
  contents: write
jobs:
  restore:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Restore stable index
        run: |
          git checkout 94ede55b733b7d83aaee8c94ed33b5b41b0e3c20 -- index.html
          git config user.name EarthlineBuildBot
          git config user.email info@earthlinedevelopment.org
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore stable 16990 index"
          git push origin HEAD:pages-live
