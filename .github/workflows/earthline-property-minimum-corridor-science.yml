name: Earthline Property Minimum Corridor Science
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-property-minimum-corridor-science.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 0
      - name: Apply Property-specific minimum corridor science
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old='''function earthlineMinimumSwaleLengthM15768(){
  const cell=Math.max(0.25,Number(M.cellM||1));
  return Math.max(12,Math.min(40,cell*4));
}'''
          new='''function earthlineMinimumSwaleLengthM15768(){
  const cell=Math.max(0.25,Number(M.cellM||1));
  const regional=!!(M.loc&&(/Regional Opportunity Tile/i.test(String(M.loc.name||""))||(Array.isArray(M.loc.zones)&&M.loc.zones.includes("Regional Tile"))));
  return regional?Math.max(12,Math.min(40,cell*4)):Math.max(6,Math.min(18,cell*3));
}'''
          if s.count(old)!=1:
              raise SystemExit("canonical minimum-corridor owner count="+str(s.count(old)))
          p.write_text(s.replace(old,new),encoding="utf-8")
          PY
          test "$(git diff --name-only)" = "index.html"
          git diff --check
      - name: Commit candidate science
        run: |
          git config user.name "Earthline Engine"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "science: preserve shorter valid Property contour reaches"
          git push origin HEAD:candidate-next
