name: Mantra 46 16798 Anchor Low-Relief Fallback

on:
  push:
    branches:
      - diagnostic-m46-16798-anchor-relaxed-fallback
    paths:
      - 'tests/mantra46-16798-anchor-relaxed-fallback.mjs'
      - '.github/workflows/mantra46-16798-anchor-relaxed-fallback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Evaluate 16798 spatial-anchor fallback
        run: node tests/mantra46-16798-anchor-relaxed-fallback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16798-anchor-relaxed-fallback
          path: artifacts/mantra46-16798-anchor-relaxed-fallback/
          if-no-files-found: error
