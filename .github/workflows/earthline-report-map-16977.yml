name: Earthline launch-passable report map 16977
on:
  push:
    branches:
      - pages-live
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Simplify report map for launch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          a=s.index("function mapSvg(d,small=false){")
          b=s.index("  return parts.join('');\n}",a)+len("  return parts.join('');\n}")
          fn=s[a:b]
          reps=[
            ('class="el-report-real-site-render-16974"','class="el-report-real-site-render-16977"'),
            ('stroke="#f6fbfb" stroke-width="4.4" opacity=".46"','stroke="#f6fbfb" stroke-width="2.6" opacity=".16"'),
            ('stroke="#08698f" stroke-width="2.2" opacity=".96"','stroke="#0b7699" stroke-width="1.35" opacity=".88"'),
            ('stroke="#3d6650" stroke-width="1.7" opacity=".16"','stroke="#3d6650" stroke-width=".82" opacity=".07"'),
            ('stroke="#4f805e" stroke-width="1.15" opacity=".20"','stroke="#4f805e" stroke-width=".62" opacity=".09"'),
            ('stroke="#2b6970" stroke-width=".58" opacity=".24"','stroke="#2b6970" stroke-width=".34" opacity=".10"'),
            ('stroke="#15362d" stroke-width="5.6" opacity=".38"','stroke="#173d31" stroke-width="3.0" opacity=".24"'),
            ('stroke="#4f8a5f" stroke-width="3.3" opacity=".58"','stroke="#4f8a5f" stroke-width="2.15" opacity=".62"'),
            ('stroke="#0a6176" stroke-width="1.75" opacity=".97"','stroke="#087f9a" stroke-width=".92" opacity=".94"'),
            ('stroke="#72cfe1" stroke-width=".54" opacity=".34"','stroke="#72cfe1" stroke-width=".40" opacity="0"'),
            ("rows.filter(r=>r.grade==='A').slice(0,3)","rows.filter(r=>r.grade==='A').slice(0,0)")
          ]
          for old,new in reps:
              n=fn.count(old)
              if n<1:
                  raise SystemExit("missing token: "+old)
              fn=fn.replace(old,new)
          out=s[:a]+fn+s[b:]
          if "el-report-real-site-render-16977" not in out:
              raise SystemExit("16977 marker missing")
          p.write_text(out,encoding="utf-8")
          PY
          git config user.name "Earthline Build Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "style: launch-passable report map 16977"
          git push origin HEAD:pages-live
