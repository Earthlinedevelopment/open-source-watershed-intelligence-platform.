name: Earthline Elder Trees CHMv2 Tile Inspect

on:
  push:
    branches:
      - v2/elder-tree-layer-research
    paths:
      - 'tools/elder_trees/chmv2_tile_inspect.py'
      - '.github/workflows/earthline-elder-tree-chmv2-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/elder-tree-layer-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rasterio
      - name: Inspect Vermont CHMv2 COG
        run: python tools/elder_trees/chmv2_tile_inspect.py 0302330023
