name: Earthline Black Paragraph Diagnostic

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-black-paragraph-diagnostic.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Extract exact panel source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          needles = [
            'Results have been modelled for climate change impacts',
            'Earthline analyzes slope and',
            'professional landscape expert'
          ]
          out=[]
          for needle in needles:
              i=s.find(needle)
              out.append(f'===== NEEDLE {needle!r} INDEX {i} =====\n')
              if i >= 0:
                  out.append(s[max(0,i-6000):min(len(s),i+12000)])
                  out.append('\n\n')
          Path('lab-results').mkdir(exist_ok=True)
          Path('lab-results/black-paragraph-source.txt').write_text(''.join(out), encoding='utf-8')
          PY
      - name: Commit diagnostic result
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add lab-results/black-paragraph-source.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: record black paragraph source context'
          git push origin HEAD:pages-live
