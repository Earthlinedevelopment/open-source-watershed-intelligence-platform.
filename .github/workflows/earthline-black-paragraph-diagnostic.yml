name: Earthline Black Paragraph Diagnostic

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-black-paragraph-diagnostic.yml'
  workflow_dispatch:

jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public site serves panel-overlap repair
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            curl -fsSL --retry 2 --retry-delay 2 'https://earthlinedevelopment.org/?earthline-live-check=legend-panel' -o /tmp/live.html
            if grep -Fq 'Keep the existing Regional map legends on the map, never underneath the translucent panel.' /tmp/live.html; then
              break
            fi
            if [ "$i" = 6 ]; then
              echo 'Live site has not served the repaired index yet.' >&2
              exit 1
            fi
            sleep 10
          done
          grep -Fq 'html.earthline-panel-open-16188 #earthlineSwaleLegend16050' /tmp/live.html
          grep -Fq 'left:calc(var(--el-rail-16188) + var(--el-panel-16188) + 18px)!important' /tmp/live.html
          echo 'PASS: public site serves the Regional legend panel-overlap repair.'
