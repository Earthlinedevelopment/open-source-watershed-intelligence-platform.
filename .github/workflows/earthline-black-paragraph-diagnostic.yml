name: Earthline Black Paragraph Diagnostic

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-black-paragraph-diagnostic.yml'
      - 'index.html'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Inspect panel source around climate note and SEARCH
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          needles = [
            'Results have been modelled for climate change impacts',
            'SEARCH',
            'Earthline analyzes slope and',
            'professional landscape expert'
          ]
          for needle in needles:
              i=s.find(needle)
              print('\n===== NEEDLE', repr(needle), 'INDEX', i, '=====')
              if i >= 0:
                  print(s[max(0,i-2500):min(len(s),i+4500)])
          print('\n===== DARK/TEXT STYLE CANDIDATES near first climate marker =====')
          i=s.find('Results have been modelled for climate change impacts')
          if i>=0:
              chunk=s[max(0,i-5000):min(len(s),i+10000)]
              for m in re.finditer(r'(?is)<[^>]+(?:color|opacity|display|visibility)[^>]*>|<p[^>]*>.*?</p>|<div[^>]*>.*?</div>', chunk):
                  x=' '.join(m.group(0).split())
                  if len(x)>1000: x=x[:1000]+' ...'
                  print(x)
          PY
