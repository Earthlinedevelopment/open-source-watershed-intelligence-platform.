name: Earthline Black Paragraph Diagnostic

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-black-paragraph-diagnostic.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Find exact dark-copy source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          needles = ['regional only','aquifer context','mapped aquifer','initial','strong','general','climate change impacts']
          out=[]
          low=s.lower()
          for needle in needles:
              pos=0; hits=0
              while True:
                  i=low.find(needle.lower(), pos)
                  if i<0: break
                  hits+=1
                  out.append(f'\n===== {needle!r} HIT {hits} INDEX {i} =====\n')
                  out.append(s[max(0,i-1800):min(len(s),i+2800)])
                  out.append('\n')
                  pos=i+len(needle)
                  if hits>=30: break
              out.append(f'\nTOTAL {needle!r}: {hits}\n')
          Path('lab-results').mkdir(exist_ok=True)
          Path('lab-results/black-paragraph-needles.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostic result
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add lab-results/black-paragraph-needles.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: record black paragraph string matches'
          git push origin HEAD:pages-live
