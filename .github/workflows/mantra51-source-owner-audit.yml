name: Mantra 51 Source Owner Audit
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-source-owner-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='ignore')
          for n in ['function sourceEntries16864','function sourceRows','const sourceEntries16864','const sourceRows']:
              i=s.find(n)
              print('\n###',n,i)
              if i>=0: print(s[i:i+6500].replace('\n',' '))
          PY
