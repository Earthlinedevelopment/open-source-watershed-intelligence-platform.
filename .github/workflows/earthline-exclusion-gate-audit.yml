name: Earthline Exclusion Evidence Gate Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-exclusion-gate-trigger']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          needles=[
            'earthlineLockPropertyResult15815(',
            'await vectorNoBuild15778',
            'vectorNoBuild15778(',
            'earthlineFinalizeVectorVerification16343(',
            'M.vectorNoBuildCoverage.publicationAllowed'
          ]
          for n in needles:
            print('\n###',n)
            for i,line in enumerate(lines,1):
              if n in line:
                a=max(1,i-8); b=min(len(lines),i+12)
                print(f'-- hit {i} --')
                for k in range(a,b+1): print(f'{k}: {lines[k-1]}')
          PY
