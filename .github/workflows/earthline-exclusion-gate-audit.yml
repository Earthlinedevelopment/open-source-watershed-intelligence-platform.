name: Earthline Exclusion Evidence Gate Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-exclusion-gate-trigger']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          needles=['mapped roads/buildings','mapping roads and structures','rebuildModel=','rebuildModel =','async function rebuildModel','earthlineBuildVectorNoBuildMask(']
          for n in needles:
            print('\n###',n)
            for i,line in enumerate(lines,1):
              if n in line:
                a=max(1,i-22); b=min(len(lines),i+42)
                print(f'-- {i} --')
                for k in range(a,b+1): print(f'{k}: {lines[k-1]}')
          PY
