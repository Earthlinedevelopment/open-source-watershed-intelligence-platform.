name: Earthline Exclusion Evidence Gate Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-exclusion-gate-trigger']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for n in ['function earthlineFrozenPropertyClearanceAudit16255','earthlineFrozenPropertyClearanceAudit16255=','FROZEN_PROPERTY_CLEARANCE']:
            i=s.find(n)
            if i>=0:
              print('\n===',n,'===\n')
              print(s[max(0,i-2200):min(len(s),i+9000)])
          PY
