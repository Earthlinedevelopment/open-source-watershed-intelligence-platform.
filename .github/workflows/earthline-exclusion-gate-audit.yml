name: Earthline Exclusion Evidence Gate Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-exclusion-gate-trigger']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for n in ['function filterCorridors15788','function exclusionIndex15788','function auditCorridors15806']:
            i=s.find(n)
            print('\n###',n,'AT',i)
            if i>=0: print(s[i:i+12000])
          PY
