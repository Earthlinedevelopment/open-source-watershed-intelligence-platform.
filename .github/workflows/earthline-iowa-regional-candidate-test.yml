name: Earthline Iowa Regional Candidate Test
on:
  push:
    branches: [recovery/mantra74-stability]
    paths:
      - tests/iowa-regional-candidate.mjs
      - .github/workflows/earthline-iowa-regional-candidate-test.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-regional-engine
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd harness
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Iowa Regional candidate
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 --directory candidate >/tmp/iowa-regional-candidate-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node harness/tests/iowa-regional-candidate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iowa-regional-candidate
          path: |
            iowa-regional-candidate.json
            iowa-regional-candidate.png
