name: Earthline Planting Parity Runner
on:
  push:
    branches:
      - recovery/mantra74-stability
    paths:
      - tools/apply-property-planting-parity.py
      - .github/workflows/earthline-iowa-live-diagnostic.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-regional-engine-clean2
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          path: controller
      - name: Apply live planting parity
        run: python3 controller/tools/apply-property-planting-parity.py
      - name: Parse-check
        run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim()) continue;
            try{ new Function(m[1]); parsed++; } catch(e){ throw Error('inline script '+i+': '+e.message); }
          }
          console.log('EARTHLINE_PLANTING_PARITY_PARSE_OK',parsed);
          NODE
      - name: Commit parity
        run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: preserve live Property planting on Regional repair candidate"
          git push origin HEAD:recovery/mantra75-regional-engine-clean2
