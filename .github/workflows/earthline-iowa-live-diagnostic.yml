name: Earthline Iowa Live Property Persistence
on:
  push:
    branches:
      - recovery/mantra74-stability
    paths:
      - tests/iowa-live-diagnostic.mjs
      - .github/workflows/earthline-iowa-live-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run live Iowa Property persistence audit
        run: node tests/iowa-live-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iowa-live-property-persistence
          path: |
            iowa-live-diagnostic.json
            iowa-property-settlement.png
            iowa-property-after5s.png
