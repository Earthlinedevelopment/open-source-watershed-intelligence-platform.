name: Earthline Iowa Regional Grid Verification
on:
  push:
    branches:
      - recovery/mantra74-stability
    paths:
      - tests/iowa-regional-grid-test.mjs
      - .github/workflows/earthline-iowa-live-diagnostic.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-regional-engine-clean2
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          path: controller
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser runtime
        run: |
          cd controller
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Iowa statewide Regional verification
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 --directory candidate >/tmp/earthline-grid-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          cd controller
          EARTHLINE_URL=http://127.0.0.1:8787/ node tests/iowa-regional-grid-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iowa-regional-grid-test
          path: |
            controller/iowa-regional-grid-test.json
            controller/iowa-regional-grid-test.png
