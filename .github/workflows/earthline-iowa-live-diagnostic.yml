name: Earthline Iowa Live Diagnostic
on:
  push:
    branches: [recovery/mantra74-stability]
    paths:
      - tests/iowa-live-diagnostic.mjs
      - earthline-launch-16872.js
      - .github/workflows/earthline-iowa-live-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
      - run: |
          EARTHLINE_URL=https://earthlinedevelopment.org/ node tests/iowa-live-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iowa-live-diagnostic
          path: iowa-live-diagnostic.json
