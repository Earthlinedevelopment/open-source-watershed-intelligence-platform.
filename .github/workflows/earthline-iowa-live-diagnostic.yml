name: Earthline Regional 16060 Render Repair Runner
on:
  push:
    branches:
      - recovery/mantra74-stability
    paths:
      - tools/remove-regional-16060-width-override.py
      - .github/workflows/earthline-iowa-live-diagnostic.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-regional-render-clean
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          path: controller
      - name: Remove 16060 Regional width override
        run: python3 controller/tools/remove-regional-16060-width-override.py
      - name: Parse-check
        run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim()) continue;
            try{ new Function(m[1]); parsed++; } catch(e){ throw Error('inline script '+i+': '+e.message); }
          }
          console.log('EARTHLINE_REGIONAL_16060_PARSE_OK',parsed);
          NODE
      - name: Commit render repair
        run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: retire legacy Regional worm width overrides"
          git push origin HEAD:recovery/mantra75-regional-render-clean
