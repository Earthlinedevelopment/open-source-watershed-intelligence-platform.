name: Earthline 16736 Refined Selection Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-selection-16736.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: EARTHLINE_URL='https://earthlinedevelopment.org/' OUT='selection16736.json' node lab/diag-16736-selection.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: selection16736
          path: selection16736.json
