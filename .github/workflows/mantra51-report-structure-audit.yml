name: Mantra 51 Report Structure Audit
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - '.github/workflows/mantra51-report-structure-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='ignore')
          for term in [
              'function reportAquifers()',
              'function mapSvg(d,small=false)',
              'The core idea',
              'If you have two minutes',
              '§6.0',
              'How Bioswales Work',
              'function buildReport'
          ]:
              print('\n###',term)
              st=0
              for _ in range(6):
                  i=s.find(term,st)
                  if i<0: break
                  print('POS',i)
                  print(s[max(0,i-2200):i+10000].replace('\n',' '))
                  st=i+len(term)
          PY
