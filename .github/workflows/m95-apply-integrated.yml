name: M95 integrate pinned 12-state source and camera repair
on:
  push:
    branches: [fix/m95-arizona-actual-property-ui]
    paths: [.github/workflows/m95-apply-integrated.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply four checked repair sites, preserve science and report hash
        run: |
          set -euo pipefail
          python3 tools/m95-integrate-repair.py
          git diff --check
          git config user.name "Earthline Repair CI"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix(M95): retain twelve-state core; prevent late camera hijack and incorrect exclusion warning"
          git push origin HEAD:fix/m95-arizona-actual-property-ui
