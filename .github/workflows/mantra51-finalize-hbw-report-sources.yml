name: Mantra 51 Finalize HBW and Report Sources
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - 'scripts/finalize_hbw_report_sources_16934.py'
      - '.github/workflows/mantra51-finalize-hbw-report-sources.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/finalize_hbw_report_sources_16934.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='ignore')
          assert "holder.querySelectorAll('#earthlineHowBioswalesApproved16388,#earthlineSuccessfulSystems16149,.el12-corrections')" in s
          assert "+canonicalBlock+preserved+correctionsBlock+sourceBlock+" in s
          assert s.count('<h3>Evidence register</h3>${body}') == 0
          assert 'earthline-report-contrast-16932' in s
          assert 'sparse elevation labels in metres' in s
          PY
          git add index.html
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git commit -m "fix: finalize report narrative and source ownership"
          git push