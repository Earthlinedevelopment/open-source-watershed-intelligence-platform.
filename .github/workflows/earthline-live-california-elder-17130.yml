name: Earthline Live California Elder Acceptance 17130

on:
  push:
    branches:
      - research/elder-browser-engine-17129
    paths:
      - '.github/workflows/earthline-live-california-elder-17130.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for exact live 17130 assets
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 20 https://earthlinedevelopment.org/data/elder-trees/v2/manifest.json > /tmp/manifest.json &&
               grep -q 'california-regional-overview-17130' /tmp/manifest.json &&
               curl -fsSL --max-time 20 https://earthlinedevelopment.org/earthline-elder-worker-17129.js > /tmp/worker.js &&
               grep -q 'RANGE_PROXY' /tmp/worker.js; then
              ok=1; break
            fi
            sleep 5
          done
          test "$ok" = 1
          curl -fsSL --max-time 20 https://earthlinedevelopment.org/data/elder-trees/v2/california-regional-overview.geojson > /tmp/california.geojson
          node -e 'const f=require("fs");const m=JSON.parse(f.readFileSync("/tmp/manifest.json"));const d=m.datasets.filter(x=>x.id==="california-regional-overview-17130");if(d.length!==1||d[0].property_eligible!==false)process.exit(1);const g=JSON.parse(f.readFileSync("/tmp/california.geojson"));if(g.features.length!==190)process.exit(2);console.log("live regional assets",g.features.length)'

      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run production-origin California Property detector
        run: |
          cat > run-live.mjs <<'JS'
          import { chromium } from "playwright";
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          page.on("pageerror",e=>console.error("PAGEERROR",e));
          await page.goto("https://earthlinedevelopment.org/",{waitUntil:"domcontentloaded",timeout:60000});
          const result=await page.evaluate(async()=>{
            const bbox=[-118.754,36.559,-118.751,36.562];
            const id="live-17130-"+Date.now(),t0=performance.now();
            return await new Promise((resolve,reject)=>{
              const w=new Worker("/earthline-elder-worker-17129.js",{type:"module"});
              const tm=setTimeout(()=>{try{w.terminate()}catch(_){};reject(new Error("live worker timeout"))},90000);
              w.onmessage=e=>{
                if(e.data?.id!==id)return;
                clearTimeout(tm);try{w.terminate()}catch(_){}
                if(!e.data?.ok)reject(new Error(e.data?.error||"live worker failed"));
                else resolve({elapsedMs:performance.now()-t0,result:e.data.result});
              };
              w.onerror=e=>{clearTimeout(tm);reject(new Error(e.message||"live worker error"))};
              w.postMessage({id,bbox,options:{displayPerTile:24,maxPerTile:240}});
            });
          });
          await browser.close();
          console.log(JSON.stringify({elapsedMs:Math.round(result.elapsedMs),pool:result.result?.earthline?.candidate_pool_count,display:result.result?.earthline?.display_count,tiles:result.result?.earthline?.tile_results},null,2));
          if(!(result.result?.earthline?.candidate_pool_count>0))throw new Error("live candidate pool zero");
          if(!(result.result?.earthline?.display_count>0))throw new Error("live display zero");
          if((result.result?.earthline?.tile_results||[]).some(t=>t.status!=="OK"))throw new Error("live CHMv2 tile failed");
          if(result.elapsedMs>20000)throw new Error("live bounded Elder detector exceeded 20s gate");
          JS
          node run-live.mjs
