name: Earthline Alaska Elder Refine Radius Sweep 17102

on:
  push:
    branches:
      - research/elder-density-calibration-17100
    paths:
      - '.github/workflows/earthline-alaska-elder-refine-radius-17102.yml'
      - 'tools/elder_trees/chmv2_aoi_candidates.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/elder-density-calibration-17100
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy rasterio pyproj requests
      - name: Alaska native-refinement radius sweep
        run: |
          set -e
          BBOX="-135.36,57.045,-135.34,57.060"
          for R in 45 30 20 15 10; do
            python tools/elder_trees/chmv2_aoi_candidates.py --bbox="$BBOX" --max-per-tile=2000 --screen-size=1024 --refine-radius-m="$R" --out="artifacts/alaska-r$R"
          done
      - name: Summarize radius sweep
        run: |
          python - <<'PY'
          import glob,json,pathlib
          out={}
          for p in glob.glob('artifacts/alaska-r*/*.json'):
              if p.endswith('.geojson'): continue
              d=json.load(open(p))
              r=pathlib.Path(p).parent.name.split('r')[-1]
              tiles=[t for t in d.get('tile_results',[]) if t.get('status')=='OK']
              out[r]={
                'candidate_count':d.get('candidate_count',0),
                'forest_area_ha':round(sum(t.get('forest_area_ha',0) for t in tiles),3),
                'current_selected_total':sum(t.get('current_selected_total',0) for t in tiles),
                'future_selected_total':sum(t.get('future_selected_total',0) for t in tiles),
                'reference_peak_count':sum(t.get('reference_peak_count',0) for t in tiles),
                'refine_radius_m':d.get('refine_radius_m')
              }
          print(json.dumps(out,indent=2))
          vals={int(k):v['candidate_count'] for k,v in out.items()}
          if not vals or max(vals.values())==0: raise SystemExit('No refined Alaska candidates')
          pathlib.Path('artifacts/alaska-radius-summary.json').write_text(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-alaska-elder-refine-radius-17102
          path: artifacts/
          retention-days: 14

