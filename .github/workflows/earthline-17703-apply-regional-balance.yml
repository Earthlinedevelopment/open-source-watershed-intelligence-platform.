name: Earthline 17703 Apply Regional Balance
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-17703-trigger']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          fetch-depth: 0
      - run: python3 scripts/apply-17703-regional-balance.py
      - name: Commit exact Regional balance repair
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "Earthline"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "repair: restore score-first Regional capacity after coverage floor"
          git push origin HEAD:recovery/mantra74-stability
