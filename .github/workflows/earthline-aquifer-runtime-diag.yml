name: Earthline Selector Source Diagnostic

on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/selector-source-window.mjs'
      - '.github/workflows/earthline-aquifer-runtime-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selector-source-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspect live selector source
        run: node tests/selector-source-window.mjs
