name: Earthline Regional Grid Source Trace

on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/regional-grid-source-window.mjs'
      - '.github/workflows/earthline-aquifer-runtime-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regional-grid-source-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Trace Regional grid source owner
        run: node tests/regional-grid-source-window.mjs
