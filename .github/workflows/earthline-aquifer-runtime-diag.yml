name: Earthline Shared Regional Hydrology Scale Metadata

on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/shared-regional-hy-scale-metadata.mjs'
      - '.github/workflows/earthline-aquifer-runtime-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-regional-hy-scale-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Inspect Regional hydrology scale metadata
        run: node tests/shared-regional-hy-scale-metadata.mjs
