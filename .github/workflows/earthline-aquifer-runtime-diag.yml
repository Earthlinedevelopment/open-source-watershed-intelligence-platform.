name: Earthline Shared Regional Scale-Aware Length Control

on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/shared-regional-scale-aware-length-control.mjs'
      - '.github/workflows/earthline-aquifer-runtime-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-regional-scale-aware-length-control:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run scale-aware Regional length control
        run: node tests/shared-regional-scale-aware-length-control.mjs
