name: Earthline Direct Regional Grid Owner Trace

on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/trace-regional-grid-owner.py'
      - '.github/workflows/earthline-aquifer-runtime-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-regional-grid-owner-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Trace Regional grid owner directly from source
        run: python tests/trace-regional-grid-owner.py
