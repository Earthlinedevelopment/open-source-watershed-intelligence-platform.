name: Earthline Shared Regional Length 8 Control Matrix

on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/shared-regional-length-8-control-matrix.mjs'
      - '.github/workflows/earthline-aquifer-runtime-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-regional-length-8-control-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run shared regional length 8 control matrix
        run: node tests/shared-regional-length-8-control-matrix.mjs
