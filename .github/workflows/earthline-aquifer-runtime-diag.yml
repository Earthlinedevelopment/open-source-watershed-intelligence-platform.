name: Earthline Paired Regional Length 10 vs 8 Controls

on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/shared-regional-length-10-vs-8-paired.mjs'
      - '.github/workflows/earthline-aquifer-runtime-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-regional-length-10-vs-8:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run paired regional length 10 vs 8 controls
        run: node tests/shared-regional-length-10-vs-8-paired.mjs
