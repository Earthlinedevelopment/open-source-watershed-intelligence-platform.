name: Earthline Salida Regional Lifecycle

on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/salida-regional-lifecycle.mjs'
      - '.github/workflows/earthline-aquifer-runtime-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  salida-regional-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Salida Regional lifecycle transitions
        run: node tests/salida-regional-lifecycle.mjs
