name: Earthline Texas Coastal Swale Diagnostic

on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/texas-coastal-swale-diag.mjs'
      - '.github/workflows/earthline-aquifer-runtime-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texas-coastal-swale-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Texas coastal swale diagnostic
        run: node tests/texas-coastal-swale-diag.mjs
