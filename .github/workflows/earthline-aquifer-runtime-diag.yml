name: Earthline Texas Regional Length Threshold Sweep

on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/texas-regional-length-threshold-sweep.mjs'
      - '.github/workflows/earthline-aquifer-runtime-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texas-regional-length-threshold-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Texas regional length threshold sweep
        run: node tests/texas-regional-length-threshold-sweep.mjs
