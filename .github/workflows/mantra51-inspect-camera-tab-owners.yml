name: Mantra 51 Inspect Country Camera And Tab Zoom Owners
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths: ['.github/workflows/mantra51-inspect-camera-tab-owners.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: mantra51-global-repair-campaign}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needles=[
            "zoom to location","ZOOM TO LOCATION","Zoom to location",
            "earthlineRegionalCorridorTabs16323",
            "fitBounds(","flyTo(","easeTo(",
            "regionalExtent","countrywide Regional screening extent",
            "EARTHLINE_PROPERTY_TARGET_16201",
            "ANALYZE THIS LOCATION"
          ]
          for needle in needles:
            print("\n===== "+needle+" =====")
            pos=0;n=0
            while n<12:
              i=s.find(needle,pos)
              if i<0: break
              print(s[max(0,i-2200):min(len(s),i+5000)])
              print("\n---")
              pos=i+len(needle);n+=1
          PY
