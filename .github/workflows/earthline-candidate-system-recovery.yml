name: Earthline Candidate System Recovery Gate
on:
  push:
    branches: [audit/mantra82-owner-convergence]
    paths:
      - 'index.html'
      - 'earthline-launch-16872.js'
      - 'earthline-elder-worker-17129.js'
      - 'earthline-language-hotfix-16890.js'
      - 'tools/elder_trees/chmv2_array_detector_17129.py'
      - 'tests/earthline-system-recovery-gate.mjs'
      - 'tests/browser-regional-ab-17269.mjs'
      - 'tests/elder-user-flow-17418.mjs'
      - 'tests/candidate-origin-router.mjs'
      - '.github/workflows/earthline-candidate-system-recovery.yml'
  pull_request:
    branches: [pages-live]
    paths:
      - 'tests/earthline-system-recovery-gate.mjs'
      - 'tests/browser-regional-ab-17269.mjs'
      - 'tests/elder-user-flow-17418.mjs'
      - '.github/workflows/earthline-candidate-system-recovery.yml'
permissions:
  contents: write
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/mantra82-owner-convergence
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Candidate Property slope publication repair (working copy only)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          a=s.index('function earthlineSwaleGeoJSON(){')
          b=s.index('function earthlineSyncSwaleLayer(){',a)
          block=s[a:b]
          before=block
          block=block.replace('earthlineSplitUsableSegments(s.pts,33)','earthlineSplitUsableSegments(s.pts,4)')
          block=block.replace('earthlineFinalSafeSegments15771(displaySeg,33)','earthlineFinalSafeSegments15771(displaySeg,4)')
          if 'earthlineSplitUsableSegments(s.pts,33)' in block or 'earthlineFinalSafeSegments15771(displaySeg,33)' in block:
              raise SystemExit('Property publication slope patch did not converge')
          if 'earthlineSplitUsableSegments(s.pts,4)' not in block or 'earthlineFinalSafeSegments15771(displaySeg,4)' not in block:
              raise SystemExit('Property publication <=4% owner missing')
          p.write_text(s[:a]+block+s[b:],encoding='utf-8')
          print('PASS Property publication slope <=4% state ready; changed='+str(block!=before))
          PY
      - name: Canonical science invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          import re
          required=[
            "const safeSlope=slopePct(x,y)<=4;",
            "maxS=Number(lg.maxSlopePct||4);",
            "const requested=Number(M.targetSwaleSpacingM||6.096);",
            "return clamp(requested,4.572,7.620);",
            "const minSpacingM15771=isRegionalTile15769?targetSpacingM15771*.68:MIN_M;",
            "const maxSpacingM15771=isRegionalTile15769?targetSpacingM15771*1.40:MAX_M;"
          ]
          forbidden=[
            "const thr=streamThreshold(),chanThr=thr*3.2,maxS=33;",
            "const safeSlope=slopePct(x,y)<=33;",
            "maxS=Number(lg.maxSlopePct||33);",
            "eligibleSlopeSamples15771=[]",
            "maxLevels:256,maxSeedsPerLevel:16,maxCandidates:256,maxFinal:200"
          ]
          slope_owner_ok=bool(re.search(r"const\s+thr\s*=\s*streamThreshold\(\)\s*,\s*chanThr\s*=\s*Math\.max\(thr\s*\*\s*3\.2\s*,\s*Number\(M\.maxAcc\|\|0\)\s*\*\s*0\.06\)\s*,\s*maxS\s*=\s*4\s*;",s))
          property_slope_ok=('earthlineSplitUsableSegments(s.pts,4)' in s and 'earthlineFinalSafeSegments15771(displaySeg,4)' in s)
          lines=s.splitlines()
          slope_lines=[ln.strip()[:500] for ln in lines if ('streamThreshold' in ln or 'maxS=' in ln or 'maxSlopePct' in ln)]
          safe_calls=[]
          for n,ln in enumerate(lines,1):
              if 'earthlineFinalSafeSegments15771(' in ln:
                  safe_calls.append({'line':n,'text':ln.strip()[:900],'context':' || '.join(x.strip()[:300] for x in lines[max(0,n-3):min(len(lines),n+2)])})
          slices={}
          for target in [4406,4454,15517,15556,15696]:
              lo=max(0,target-18); hi=min(len(lines),target+22)
              slices[target]='\n'.join(f"{i+1}: {lines[i]}" for i in range(lo,hi))
          missing=[x for x in required if x not in s]
          present=[x for x in forbidden if x in s]
          if missing or present or not slope_owner_ok or not property_slope_ok:
              raise SystemExit(f"science invariant failure slope_owner_ok={slope_owner_ok} property_slope_ok={property_slope_ok} missing={missing} forbidden={present} slope_lines={slope_lines[:30]} safe_calls={safe_calls[:30]} slices={slices}")
          print("PASS canonical <=4% slope and 15-25 ft spacing invariants; rejected generation experiment absent")
          PY
      - name: Regional regression matrix
        run: env EARTHLINE_URL='https://earthlinedevelopment.org/' EARTHLINE_CANDIDATE_ORIGIN='1' BROWSER='chromium' HEADLESS='true' WAIT_MS='90000' STATES='Vermont|Texas|New York|Arkansas|Iowa|Colorado|California' node tests/browser-regional-ab-17269.mjs
      - name: Elder user flow
        run: env EARTHLINE_URL='https://earthlinedevelopment.org/' EARTHLINE_CANDIDATE_ORIGIN='1' BROWSER='chromium' HEADLESS='true' node tests/elder-user-flow-17418.mjs
      - name: Integrated Property science and presentation
        run: env EARTHLINE_URL='https://earthlinedevelopment.org/' EARTHLINE_CANDIDATE_ORIGIN='1' node tests/earthline-system-recovery-gate.mjs
      - name: Commit validated Property slope owner repair to audit branch
        if: success()
        run: |
          if git diff --quiet -- index.html; then
            echo "Validated Property repair already committed."
            exit 0
          fi
          git config user.name "Earthline Mantra 82 Audit"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "science: enforce <=4% Property swale publication gate"
          git push origin HEAD:audit/mantra82-owner-convergence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-candidate-system-recovery
          path: |
            /tmp/earthline-system-recovery-gate.png
            artifacts/browser-regional-17269/
          if-no-files-found: warn
