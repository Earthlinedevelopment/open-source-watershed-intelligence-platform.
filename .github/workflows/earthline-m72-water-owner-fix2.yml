name: Earthline Mantra 72 Water Owner Repair
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-m72-water-owner-fix2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Patch exact conflicting mutations
        run: python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old1=\"      const direct16334=document.getElementById('earthlinePropertyWaterOverlay15824');\\n      if(direct16334){direct16334.replaceChildren();direct16334.style.display='none';}\\n\"; old2=\"      const water=document.getElementById('earthlinePropertyWaterOverlay15824');\\n      if(water){water.replaceChildren();water.style.display='none'}\\n\"; assert s.count(old1)==1,s.count(old1); assert s.count(old2)==1,s.count(old2); s=s.replace(old1,\"      /* EARTHLINE 17567 — only 15824 may mutate the authoritative blue-water SVG. */\\n\").replace(old2,\"      /* EARTHLINE 17567 — retirement cannot mutate the authoritative blue-water SVG. */\\n\"); p.write_text(s,encoding='utf-8')"
      - name: Validate
        run: node -e "const fs=require('fs'),s=fs.readFileSync('index.html','utf8');if((s.match(/EARTHLINE 17567/g)||[]).length!==2)throw Error('marker');if(s.includes('direct16334.replaceChildren()'))throw Error('regional mutator');if(s.includes(\"if(water){water.replaceChildren();water.style.display='none'}\"))throw Error('retirement mutator');for(const [i,m] of [...s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].entries()){if(!m[1].trim())continue;new Function(m[1])}"
      - name: Publish
        run: |
          git config user.name "Earthline Production Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git rm .github/workflows/earthline-m72-water-ownership.yml || true
          git rm .github/workflows/earthline-m72-water-owner-fix2.yml
          git add index.html
          git commit -m "fix: stop external cleanup from erasing Property blue water"
          git push origin HEAD:pages-live
