name: Earthline Mantra45 16771 Global Protocol Gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-m45-16771-protocol-gate.yml']
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build isolated 16771 candidate from live pages branch
        shell: bash
        run: |
          git fetch origin pages-live
          mkdir -p /tmp/e16771m45
          git show origin/pages-live:index.html > /tmp/e16771m45/index.html
          cp lab/apply-16771-subsector-spread.py /tmp/e16771m45/apply.py
          cd /tmp/e16771m45
          python3 apply.py
          grep -q "EARTHLINE 16771" index.html
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve candidate
        shell: bash
        run: |
          cd /tmp/e16771m45
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/e16771m45-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/e16771m45-server.log
          exit 1
      - name: Vermont fine-dispersion and protocol snapshot
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1800,height:1000}});
          await page.goto('http://127.0.0.1:8787/index.html?m45fine='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForSelector('#searchInput',{timeout:30000});
          await page.evaluate(()=>{
            window.EARTHLINE_REGIONAL_COVERAGE_AUDIT_16731=null;
            const i=document.getElementById('searchInput'),b=document.getElementById('runBtn');
            i.value='vermont state';i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));b.click();
          });
          await page.waitForFunction(()=>{
            const a=window.EARTHLINE_REGIONAL_COVERAGE_AUDIT_16731,p=window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167,d=window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020;
            return a?.passed===true&&Number(p?.generated||0)>0&&Number(p?.generated||0)===Number(d?.swaleLines||0);
          },null,{timeout:70000,polling:100});
          await page.waitForTimeout(500);
          const out=await page.evaluate(()=>{
            const vis=window.EARTHLINE_REGIONAL_VISUAL_DATA_16020||{},bounds=vis.bounds||null;
            const occ=n=>{
              const s=new Set(); if(!Array.isArray(bounds)||bounds.length!==4)return 0;
              const [w,so,e,no]=bounds;
              for(const f of vis?.swales?.features||[]){
                const c=f?.geometry?.coordinates;if(!Array.isArray(c)||!c.length)continue;
                const m=c[Math.floor((c.length-1)/2)];
                const bx=Math.max(0,Math.min(n-1,Math.floor((Number(m[0])-w)/Math.max(1e-12,e-w)*n)));
                const by=Math.max(0,Math.min(n-1,Math.floor((no-Number(m[1]))/Math.max(1e-12,no-so)*n)));
                s.add(bx+','+by);
              }
              return s.size;
            };
            const dr=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16149||window.EARTHLINE_DISPLAYED_RUN_16147||null;
            const flow=window.EARTHLINE_LAND_VALIDITY_FLOW_AUDIT_16584||null;
            const land=window.EARTHLINE_LAND_VALIDITY_16584||null;
            const pub=window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167||{};
            const disp=window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020||{};
            const perf=window.EARTHLINE_REGIONAL_PERFORMANCE_16191||{};
            const spatial=window.EARTHLINE_SPATIAL_COVERAGE_SELECTION_16736||{};
            const boundary=window.EARTHLINE_REGIONAL_JURISDICTION_BOUNDARY_AUDIT_16539||{};
            return {
              spatialBuild:spatial.build||null,
              generated:Number(pub.generated||0),visible:Number(disp.swaleLines||0),
              fine12Occupied:occ(12),fine18Occupied:occ(18),
              coreMs:Number(perf.totalMs||NaN),
              slopeReady:!!dr?.terrain?.source&&Number.isFinite(Number(dr?.recharge?.components?.slope)),
              waterPaths:Number(dr?.derived?.waterPaths??disp?.waterPaths??0),
              aquiferReady:!!dr?.aquifers&&typeof dr.aquifers.status==='string',
              aquiferSource:String(dr?.aquifers?.source||''),
              exclusionsReady:!!flow&&Number(flow?.unsafeSegments??NaN)===0,
              unsafe:flow?Number(flow.unsafeSegments??NaN):NaN,
              waterSidecarReady:!!land&&Array.isArray(land?.waterParts),
              waterParts:Array.isArray(land?.waterParts)?land.waterParts.length:null,
              outsideAfterClip:boundary?.outsideAfterClip||null,
              coveragePassed:window.EARTHLINE_REGIONAL_COVERAGE_AUDIT_16731?.passed===true,
              reserved:Number(spatial.reserved||0),capacity:Number(spatial.capacity||0),
              subsectorExtraSelected:Number(spatial.subsectorExtraSelected||0)
            };
          });
          await browser.close();
          fs.writeFileSync('lab/mantra45-16771-vt-fine.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out));
          JS
      - name: Run global stress set through four owners plus Water Sidecar
        shell: bash
        run: |
          set +e
          EARTHLINE_URL='http://127.0.0.1:8787/index.html'           STATES='Vermont|Maryland|California|Florida|Louisiana|Colorado|Oklahoma|New York|Texas'           OUT='lab/mantra45-16771-stress-gate.json'           node lab/validate-16753-final-us.mjs
          code=$?
          set -e
          echo "$code" > lab/mantra45-16771-stress-exit.txt
          test -f lab/mantra45-16771-stress-gate.json || echo '{"pass":false,"failed":[{"state":"validator","failures":["no output"]}]}' > lab/mantra45-16771-stress-gate.json
      - name: Persist evidence regardless of pass/fail
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, datetime
          fine=json.loads(pathlib.Path('lab/mantra45-16771-vt-fine.json').read_text())
          stress=json.loads(pathlib.Path('lab/mantra45-16771-stress-gate.json').read_text())
          code=int(pathlib.Path('lab/mantra45-16771-stress-exit.txt').read_text().strip())
          out={
            'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'candidate':'EARTHLINE 16771 isolated from current pages-live',
            'baseline':{'build':'EARTHLINE 16767','fine12Occupied':53,'fine18Occupied':72},
            'vermont':fine,
            'stressGateExit':code,
            'stress':stress,
            'pass':bool(code==0 and stress.get('pass') is True and fine.get('generated')==fine.get('visible') and fine.get('unsafe')==0 and fine.get('coreMs',999999)<=15000 and fine.get('slopeReady') and fine.get('waterPaths',0)>0 and fine.get('aquiferReady') and fine.get('exclusionsReady') and fine.get('waterSidecarReady'))
          }
          pathlib.Path('lab/mantra45-16771-protocol-gate.json').write_text(json.dumps(out,indent=2))
          print(json.dumps({'pass':out['pass'],'baseline':out['baseline'],'vermont':fine,'stressFailed':stress.get('failed')}))
          PY
          git config user.name "Earthline Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add lab/mantra45-16771-vt-fine.json lab/mantra45-16771-stress-gate.json lab/mantra45-16771-stress-exit.txt lab/mantra45-16771-protocol-gate.json
          git commit -m "diag: persist Mantra45 16771 global protocol gate [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
