name: Earthline M76 Swale Owner Inspect 2
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths: ['.github/workflows/earthline-m76-swale-inspect-2.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra76-audit-restart
          fetch-depth: 0
      - name: Print candidate construction and natural renderer owner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          p0=s.rfind("async function prescribeSwales15778(")
          p1=s.find("\n  prescribeSwales=prescribeSwales15778;",p0)
          if p0<0 or p1<0: raise SystemExit("prescriber owner missing")
          owner=s[p0:p1]
          print("PRESCRIBER",p0,p1,"LEN",len(owner))
          markers=[
            "for(const path15836 of canonicalPaths15836){",
            "flowFirstAudit15836.primaryCandidates",
            "segmentCrossesPath15836(",
            "bandKey:",
            "levelH:",
            "const swales",
            "let swales",
            "ordered=",
            "traceContour",
            "trace(",
            "contour-fill",
            "contour fill"
          ]
          for marker in markers:
              print("\n===== OWNER MARKER",marker,"=====")
              hits=[m.start() for m in re.finditer(re.escape(marker),owner,re.I)]
              print("COUNT",len(hits),hits)
              for i in hits[:8]:
                  print(owner[max(0,i-2500):min(len(owner),i+9500)])
          t0=s.find("const BUILD='EARTHLINE 16236';")
          if t0<0: raise SystemExit("natural texture owner missing")
          t1=s.find("</script>",t0)
          block=s[t0:t1]
          block=re.sub(r"(const TILE_(?:UP|FLIP)='data:image/[^']+)'",r"\1<BASE64-OMITTED>'",block)
          print("\n===== NATURAL TEXTURE OWNER =====")
          print("START",t0,"END",t1,"LEN",len(block))
          print(block)
          PY
