name: Earthline Arizona A1 Property Mobile

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/arizona-a1-property-mobile.mjs'
      - 'tests/arizona-desktop-crosshair-m78.mjs'
      - '.github/workflows/earthline-arizona-a1-property-mobile.yml'
      - 'tools/m78_9_zero_style_fallback.py'
      - 'tools/m78_11_12_shared_repairs.py'
      - 'tools/m78_32_property_declaration_site.py'
      - 'tools/m78_33_crosshair_authority.py'
      - 'tools/m78_39_press_target_latch.py'
      - 'tools/m78_43_moveend_crosshair_owner.py'
      - 'tools/m78_44_remove_rejected_levelset.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-m78-5:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Apply M78 Property owner repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old_start="try{void window.EARTHLINE_ELDER_TREES_V1_17097?.primePropertyEvidence?.()}catch(_){} /* M76 Elder compute-only prime; publication remains post-science. */"
          new_start=("/* EARTHLINE M78.1 — SINGLE PROPERTY ELDER LIFECYCLE OWNER.\n"
                     "       The exact 20-acre declaration is authoritative now. Start Elder asynchronously\n"
                     "       from this declaration immediately; startProperty owns pending -> committed and\n"
                     "       rejects a stale identity internally. Elder remains display-only and never gates\n"
                     "       Property hydrology or mutates authoritativeSafeSwales15815. */\n"
                     "    try{void window.EARTHLINE_ELDER_TREES_V1_17097?.startProperty?.()}catch(_){}")
          if new_start not in s:
              if s.count(old_start)!=1:
                  raise SystemExit(f"exact Property Elder start anchor count={s.count(old_start)}")
              s=s.replace(old_start,new_start,1)
          block_start="      /* EARTHLINE M78 — ELDER DISPLAY-ONLY RUN BINDING."
          block_end="    /* M78 Elder remains display-only; authoritativeSafeSwales15815 is untouched. */"
          replacement=("      /* EARTHLINE M78.1 — Elder already started from the exact Property declaration.\n"
                       "         Do not create a second post-science Elder lifecycle owner. */")
          if "elderPropertySerialM78" in s:
              a=s.find(block_start)
              b=s.find(block_end,a)
              if a<0 or b<0:
                  raise SystemExit("M78 delayed Elder owner block anchors missing")
              s=s[:a]+replacement+s[b+len(block_end):]
          if "elderPropertySerialM78" in s:
              raise SystemExit("delayed Elder owner still present")
          if s.count("SINGLE PROPERTY ELDER LIFECYCLE OWNER")!=1:
              raise SystemExit("single Elder owner marker count wrong")

          # EARTHLINE M78.2 — external exclusion evidence may never consume
          # Earthline's own generated map layers from a prior Property run.
          nl=chr(10)
          layer_anchor='        const id=((l.id||"")+" "+(l["source-layer"]||"")).toLowerCase();'
          layer_repl=('        const earthlineOwnedM782=/^earthline-/.test(String(l.id||"").toLowerCase())||/^earthline-/.test(String(l.source||"").toLowerCase());'+nl+
                      '        if(earthlineOwnedM782)return false; /* EARTHLINE M78.2 — internal render products are not external exclusion evidence. */'+nl+
                      layer_anchor)
          if "EARTHLINE M78.2 — internal render products are not external exclusion evidence." not in s:
              if s.count(layer_anchor)!=2:
                  raise SystemExit(f"external exclusion style anchor count={s.count(layer_anchor)}")
              s=s.replace(layer_anchor,layer_repl)

          cls_anchor='  const cls=(layerText+" "+propText).trim();'
          cls_repl=(cls_anchor+nl+
                    '  const sourceId=String(f&&f.source||"").toLowerCase();'+nl+
                    '  const earthlineOwnedM782=/^earthline-/.test(layerId)||/^earthline-/.test(sourceId); /* EARTHLINE M78.2 — fail closed against self-generated exclusions. */')
          if "fail closed against self-generated exclusions" not in s:
              if s.count(cls_anchor)!=1:
                  raise SystemExit(f"feature classifier anchor count={s.count(cls_anchor)}")
              s=s.replace(cls_anchor,cls_repl,1)
              parking_old='  const parking=/parking|parking_aisle/.test(cls);'
              road_old='  const road=!railOrFerry&&(roadLayer||roadProperty||parking);'
              building_old='  const building=buildingLayer||buildingProperty;'
              water_old='  const water=waterLayer||waterProperty;'
              for old in (parking_old,road_old,building_old,water_old):
                  if s.count(old)!=1:
                      raise SystemExit(f"classifier line anchor count={s.count(old)} for {old}")
              s=s.replace(parking_old,'  const parking=!earthlineOwnedM782&&/parking|parking_aisle/.test(cls);',1)
              s=s.replace(road_old,'  const road=!earthlineOwnedM782&&!railOrFerry&&(roadLayer||roadProperty||parking);',1)
              s=s.replace(building_old,'  const building=!earthlineOwnedM782&&(buildingLayer||buildingProperty);',1)
              s=s.replace(water_old,'  const water=!earthlineOwnedM782&&(waterLayer||waterProperty);',1)

          if s.count("EARTHLINE M78.2 — internal render products are not external exclusion evidence.")!=2:
              raise SystemExit("M78.2 style-owner marker count wrong")
          if s.count("fail closed against self-generated exclusions")!=1:
              raise SystemExit("M78.2 classifier marker count wrong")
          # EARTHLINE M78.5 — the legacy final clearance owner must never
          # index Earthline-generated presentation layers as environmental evidence.
          legacy_tag='        const tag=((l.id||"")+" "+(l["source-layer"]||"")).toLowerCase();'
          legacy_type='        const type=String(l.type||"").toLowerCase();'
          legacy_layer_repl=('        const earthlineOwnedM785=/^earthline-/.test(String(l.id||"").toLowerCase())||/^earthline-/.test(String(l.source||"").toLowerCase());'+nl+
                             '        if(earthlineOwnedM785)return false; /* EARTHLINE M78.5 — final clearance excludes Earthline presentation layers. */'+nl+
                             legacy_tag+nl+legacy_type)
          if "EARTHLINE M78.5 — final clearance excludes Earthline presentation layers." not in s:
              legacy_pair=legacy_tag+nl+legacy_type
              if s.count(legacy_pair)!=1:
                  raise SystemExit(f"M78.5 legacy layer selector anchor count={s.count(legacy_pair)}")
              s=s.replace(legacy_pair,legacy_layer_repl,1)

          legacy_class_line='    const tag=featureTag(f),type=String(f&&f.layer&&f.layer.type||"").toLowerCase();'
          legacy_class_pair='  function featureClass(f){'+nl+legacy_class_line
          legacy_class_repl=('  function featureClass(f){'+nl+
                             '    const layerIdM785=String(f&&f.layer&&f.layer.id||"").toLowerCase();'+nl+
                             '    const sourceIdM785=String(f&&f.source||"").toLowerCase();'+nl+
                             '    if(/^earthline-/.test(layerIdM785)||/^earthline-/.test(sourceIdM785))return ""; /* EARTHLINE M78.5 — self-generated features cannot become exclusions. */'+nl+
                             legacy_class_line)
          if "EARTHLINE M78.5 — self-generated features cannot become exclusions." not in s:
              if s.count(legacy_class_pair)!=1:
                  raise SystemExit(f"M78.5 legacy classifier anchor count={s.count(legacy_class_pair)}")
              s=s.replace(legacy_class_pair,legacy_class_repl,1)

          if s.count("EARTHLINE M78.5 — final clearance excludes Earthline presentation layers.")!=1:
              raise SystemExit("M78.5 selector marker count wrong")
          if s.count("EARTHLINE M78.5 — self-generated features cannot become exclusions.")!=1:
              raise SystemExit("M78.5 classifier marker count wrong")
          p.write_text(s,encoding="utf-8")
          PY
      - name: Apply shared zero-style exclusion fallback
        run: python3 tools/m78_9_zero_style_fallback.py
      - name: Apply unique-flow and OSM resilience repairs
        run: python3 tools/m78_11_12_shared_repairs.py
      - name: Apply stale Property presentation and Elder cache repair
        run: python3 tools/m78_17_property_clear.py
      - name: Apply canonical Property crosshair frame
        run: python3 tools/m78_22_crosshair_frame.py
      - name: Apply crosshair jitter lock
        run: python3 tools/m78_25_crosshair_jitter.py
      - name: Apply realistic Property swale width
        run: python3 tools/m78_20_realistic_swale_width.py
      - name: Apply contour-start consistency repair
        run: python3 tools/m78_27_contour_start_consistency.py
      - name: Apply atomic Property declaration-site binding
        run: python3 tools/m78_32_property_declaration_site.py
      - name: Apply explicit crosshair authority over stale selection
        run: python3 tools/m78_33_crosshair_authority.py
      - name: Apply immutable Property press target latch
        run: python3 tools/m78_39_press_target_latch.py
      - name: Apply accepted-crosshair moveend ownership repair
        run: python3 tools/m78_43_moveend_crosshair_owner.py
      - name: Apply rejected-science rollback
        run: python3 tools/m78_44_remove_rejected_levelset.py
      - name: Verify M78 repair scope
        run: |
          git diff --check
          changed="$(git diff --name-only | tr -d '\r')"
          test -z "$changed" -o "$changed" = "index.html"
          grep -q "SINGLE PROPERTY ELDER LIFECYCLE OWNER" index.html
          ! grep -q "elderPropertySerialM78" index.html
          grep -q "internal render products are not external exclusion evidence" index.html
          grep -q "fail closed against self-generated exclusions" index.html
          grep -q "final clearance excludes Earthline presentation layers" index.html
          grep -q "self-generated features cannot become exclusions" index.html
          grep -q "shared-style-zero-plus-infrastructure-fallback" index.html
          grep -q "one canonical owner per minor-flow cell" index.html
          grep -q "resilient free global OSM transport" index.html
          grep -q "clear prior Property presentation at authoritative run start" index.html
          grep -q "canonical five-decimal crosshair owns the Property analysis frame" index.html
          grep -q "sub-meter camera jitter cannot replace the accepted crosshair target" index.html
          grep -q "earthline-launch-16872.js?v=17606" index.html
          grep -q "realistic non-overlapping Property swale presentation" index.html
          grep -q "contour start and marcher share one half-open crossing rule" index.html
          grep -q "groundWidthM:3" index.html
          grep -q "accepted crosshair atomically rebinds the Property declaration site" index.html
          grep -q "explicit crosshair authority overrides stale Regional selection residue" index.html
          grep -q "physical Property press latches immutable target into terminal owner" index.html
          grep -q "generic moveend cannot replace an accepted crosshair target" index.html
          grep -q "rejected local level-set pivot removed; pre-pivot contour prescriber restored" index.html
          ! grep -q "earthlineTraceLocalLevelSetM78" index.html
          grep -q "effectiveOpenDataRespondedM7812" index.html
      - name: Commit repaired index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: dedupe minor flow paths and harden OSM exclusions"
          git push origin HEAD:pages-live

  test:
    needs: repair-m78-5
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0
      - run: node tests/arizona-desktop-crosshair-m78.mjs
      - name: Upload M78 desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m78-desktop-screens
          path: |
            /tmp/m78-desktop-first.png
            /tmp/m78-desktop-second.png
          if-no-files-found: error
      - run: node tests/arizona-a1-property-mobile.mjs

# M78.17 trigger exact desktop repair

# M78.22 trigger canonical crosshair frame

# M78.25 trigger crosshair jitter lock

# M78.20 render-width correction trigger

# M78.20 wiring correction trigger

# M78.27 trigger contour-start consistency repair

# M78.29 capture exact desktop production screenshots

# Earthline Science Kernel v1.0.0 governance lock

# Science Kernel v1 runtime migration trigger

# M78.32 atomic Property declaration-site binding trigger

# M78.33 explicit crosshair authority trigger

# M78.39 immutable accepted Property target trigger

# M78.43 accepted-crosshair moveend ownership trigger

# M78.44 rejected-science rollback trigger
