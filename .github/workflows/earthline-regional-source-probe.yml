name: Earthline Regional Source Probe

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-regional-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Regional extent source
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='replace')
          for needle in ['async function runRegional(','jurisdictionBoundaryPromise16539','const b=','regionalAnalysisBounds','earthlineClipRegionalProducts16539','function regionalBounds']:
              i=s.find(needle)
              print('\n===== NEEDLE',needle,'INDEX',i,'=====')
              if i>=0:
                  print(s[max(0,i-6500):i+18000])
          PY
