name: Mantra 46 16801 Prime Selection Audit

on:
  push:
    branches:
      - diagnostic-m46-16801-prime-selection
    paths:
      - 'tests/mantra46-16801-prime-selection.mjs'
      - '.github/workflows/mantra46-16801-prime-selection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run prime selection audit
        run: node tests/mantra46-16801-prime-selection.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16801-prime-selection
          path: artifacts/mantra46-16801-prime-selection/
          if-no-files-found: error
