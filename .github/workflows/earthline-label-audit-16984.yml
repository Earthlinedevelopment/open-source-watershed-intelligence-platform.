name: Earthline label audit 16984
on:
  push:
    branches:
      - pages-live
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Audit swale label owners
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needles=["authoritativeSafeSwales15815","authoritativeWaterPaths15824","text-field","symbol-sort-key","A1","grade","rank","label"]
          for n in needles:
              print("\n###",n)
              start=0
              shown=0
              while shown<25:
                  i=s.find(n,start)
                  if i<0: break
                  print("---",i,"---")
                  print(s[max(0,i-450):min(len(s),i+950)].replace("\n"," "))
                  start=i+len(n)
                  shown+=1
          PY
