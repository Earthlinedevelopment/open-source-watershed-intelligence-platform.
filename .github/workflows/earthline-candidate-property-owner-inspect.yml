name: Earthline Candidate Property Presentation Owner Inspect
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-candidate-property-owner-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
      - name: Extract canonical Property presentation owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=[
            "function ensureSafePropertyVisibility16221",
            "function renderSafeProperty",
            "SAFE_LAYERS_16221.casing",
            "SAFE_LAYERS_16221.earth",
            "SAFE_LAYERS_16221.life",
            "SAFE_LAYERS_16221.water",
            "const safeOpacity17172=0",
            "EARTHLINE M76 — natural Property renderer remains"
          ]
          for n in needles:
              i=s.find(n)
              print("\n=== EXACT",n,"INDEX",i,"===")
              if i>=0: print(s[max(0,i-1800):min(len(s),i+7200)])
          PY
