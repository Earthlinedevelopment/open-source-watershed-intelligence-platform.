name: Earthline Candidate Property Presentation Owner Inspect
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-candidate-property-owner-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
      - name: Extract Regional renderer ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=[
            "earthlineRegionalVectorOverlay16020",
            "EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040",
            "swaleLines",
            "earthline-swale"
          ]
          for n in needles:
              start=0
              for k in range(4):
                  i=s.find(n,start)
                  if i<0: break
                  print("\n=== REGIONAL",n,"HIT",k+1,"INDEX",i,"===")
                  print(s[max(0,i-2600):min(len(s),i+7000)])
                  start=i+len(n)
          PY
