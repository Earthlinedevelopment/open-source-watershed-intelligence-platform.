name: Earthline Candidate Science Owner Inspect
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-candidate-property-owner-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
      - name: Prove spacing owner and slope anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for n in ['targetSpacingM','acceptedSpacing','15*0.3048','25*0.3048','20*0.3048','15–25','15-25','maxS=4','slopePct(x,y)<=4']:
              start=0; hits=0
              while True:
                  i=s.find(n,start)
                  if i<0: break
                  print('\n===',repr(n),'AT',i,'===')
                  print(s[max(0,i-900):min(len(s),i+2200)])
                  start=i+len(n);hits+=1
                  if hits>=12: break
          PY
