name: Earthline M75 Regional Worm Repair Runner
on:
  push:
    branches:
      - recovery/mantra74-stability
    paths:
      - tools/m75_regional_worm_repair.py
      - .github/workflows/earthline-m75-regional-worm-repair-runner.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-regional-engine
          path: candidate
          fetch-depth: 0
      - name: Apply Regional worm repair
        run: python3 controller/tools/m75_regional_worm_repair.py candidate/index.html
      - name: Parse-check repaired page
        working-directory: candidate
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          console.log('EARTHLINE_M75_REGIONAL_WORM_PARSE_OK',parsed);
          NODE
      - name: Commit repaired renderer
        working-directory: candidate
        run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: restore clean Regional corridor presentation"
          git push origin HEAD:recovery/mantra75-regional-engine
