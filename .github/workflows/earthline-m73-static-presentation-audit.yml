name: Earthline M73 Corridor Hit Owner Audit
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-m73-static-presentation-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - name: Extract corridor hit owner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          for term in ['earthline-ranked-swale-hit-16153','swaleGradeLabels','earthlineRegionalCorridorTabs16323']:
              print('TERM',term)
              for i,l in enumerate(lines):
                  if term in l:
                      print('---',i+1,'---')
                      for j in range(max(0,i-35),min(len(lines),i+55)): print(f'{j+1}: {lines[j]}')
          PY
