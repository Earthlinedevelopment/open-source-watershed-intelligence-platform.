name: Earthline M73 Regional Corridor Audit
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-m73-static-presentation-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - name: Find exact Regional corridor interaction owner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          terms=['earthlineRegionalVectorOverlay16020','Zoom to location','zoom to location','data-corridor','regional corridor','earthlineOpportunityNav15782']
          for term in terms:
              print('TERM',term)
              hits=[i for i,l in enumerate(lines) if term.lower() in l.lower()]
              print('HITS',[i+1 for i in hits])
              for i in hits:
                  print('---',i+1,'---')
                  for j in range(max(0,i-18),min(len(lines),i+35)): print(f'{j+1}: {lines[j]}')
          PY
