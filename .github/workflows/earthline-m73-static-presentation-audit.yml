name: Earthline M73 Focused Presentation Audit
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-m73-static-presentation-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - name: Extract focused presentation ownership code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          ranges=[(21740,22340),(23380,24090),(34090,34220),(34440,34510)]
          for a,b in ranges:
              print(f'EARTHLINE_RANGE_{a}_{b}')
              for n in range(a,b+1):
                  if 1<=n<=len(lines): print(f'{n}: {lines[n-1]}')
          PY
