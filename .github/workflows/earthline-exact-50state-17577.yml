name: Earthline Exact 50-State Property 17577
on:
  push:
    branches: [test/exclusion-three-17576]
    paths:
      - '.github/workflows/earthline-exact-50state-17577.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - batch: b1
            states: "Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia"
          - batch: b2
            states: "Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland"
          - batch: b3
            states: "Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey"
          - batch: b4
            states: "New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina"
          - batch: b5
            states: "South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming"
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/exclusion-three-17576
          fetch-depth: 0
      - name: Fetch exact candidate index
        run: |
          git fetch origin candidate/earthline-launch-17577
          git show origin/candidate/earthline-launch-17577:index.html > /tmp/earthline-17577-index.html
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run live Property certification
        shell: bash
        run: |
          set +e
          LOCAL_INDEX='/tmp/earthline-17577-index.html' EARTHLINE_URL='https://earthlinedevelopment.org/' STATES='${{ matrix.states }}' OUT='property50-17577-${{ matrix.batch }}.json' node lab/validate-16728-property-50states.mjs
          code=$?
          echo "$code" > "property50-17577-${{ matrix.batch }}.exit"
          cat "property50-17577-${{ matrix.batch }}.json"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: property50-17577-${{ matrix.batch }}
          path: |
            property50-17577-${{ matrix.batch }}.json
            property50-17577-${{ matrix.batch }}.exit
          if-no-files-found: error
      - name: Enforce batch result
        if: always()
        run: test "$(cat property50-17577-${{ matrix.batch }}.exit)" = "0"
  aggregate:
    needs: certify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: property50-17577-*
          path: /tmp/property50-17569
          merge-multiple: true
      - name: Aggregate
        run: |
          python3 - <<'PY'
          import json,glob,os
          rows=[]; exits={}
          for p in sorted(glob.glob('/tmp/property50-17569/property50-17577-*.json')):
              with open(p) as f:o=json.load(f)
              rows.extend(o.get('rows',[]))
              batch=os.path.basename(p).replace('property50-17577-','').replace('.json','')
              ep=p.replace('.json','.exit')
              exits[batch]=open(ep).read().strip() if os.path.exists(ep) else 'missing'
          failed=[{'state':r.get('state'),'failures':r.get('failures',[]),'swales':r.get('swales',r.get('safeCount'))} for r in rows if not r.get('pass')]
          out={'count':len(rows),'passed':sum(1 for r in rows if r.get('pass')),'failed':failed,'batchExits':exits,'pass':len(rows)==50 and not failed and all(v=='0' for v in exits.values())}
          print('EARTHLINE_17577_PROPERTY50 '+json.dumps(out))
          if not out['pass']: raise SystemExit(1)
          PY