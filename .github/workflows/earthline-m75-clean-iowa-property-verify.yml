name: Earthline M75 Clean Iowa Property Verify
on:
  push:
    branches:
      - recovery/mantra74-stability
    paths:
      - .github/workflows/earthline-m75-clean-iowa-property-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0692f83dc8922c051da93e33bebb3f60e9fd2bcc
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-regional-engine
          path: harness
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd harness
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run exact Iowa Property
        shell: bash
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 --directory candidate >/tmp/m75-iowa-property.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          cd harness
          EARTHLINE_URL='http://127.0.0.1:8787/' node tests/iowa-property-engine.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m75-clean-iowa-property
          path: |
            harness/iowa-property-engine.json
            harness/iowa-property-engine.png
