name: Mantra 83 Yield Sites Current
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/earthline-mantra83-yield-sites-current.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          start=s.find('async function makeSwales')
          end=s.find('function makeFlows',start)
          t=s[start:end if end>start else start+80000]
          needle='earthlineCooperativeYield16661()'
          pos=0
          while True:
              i=t.find(needle,pos)
              if i<0: break
              print('YIELD_SITE',t[max(0,i-220):i+180].replace('\n',' '))
              pos=i+len(needle)
          PY
