name: Render Earthline report map candidate 16968
on:
  push:
    branches: [report-map-candidate-16967]
    paths:
      - '.github/workflows/render-report-map-candidate-16968.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: report-map-candidate-16967
      - name: Render exact candidate
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1080 -h 600 REPORT-MAP-CANDIDATE-16968.svg -o REPORT-MAP-CANDIDATE-16968.png
          file REPORT-MAP-CANDIDATE-16968.png
      - name: Commit QA render
        shell: bash
        run: |
          git config user.name "Earthline Mantra 54"
          git config user.email "info@earthlinedevelopment.org"
          git rm .github/workflows/render-report-map-candidate-16968.yml
          git add REPORT-MAP-CANDIDATE-16968.png
          git commit -m "qa: render report map candidate 16968"
          git push origin report-map-candidate-16967
