name: Mantra 123 Hotfix 3 review (Chromium + WebKit)
on:
  push:
    branches: [mantra123-hotfix3-review]
    paths:
      - index.html
      - earthline-elder-restored-17097.js
      - tests/hotfix3-browser.mjs
      - .github/workflows/mantra123-hotfix3-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install selected Playwright engine
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run protected review (no deployment)
        env:
          HF3_ENGINE: ${{ matrix.engine }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/hotfix3/${{ matrix.engine }}
          node tests/hotfix3-browser.mjs 2>&1 | tee artifacts/hotfix3/${{ matrix.engine }}/run.log
      - name: Preserve run outcome even if setup or browser fails
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/hotfix3/${{ matrix.engine }}
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path('artifacts/hotfix3')/os.environ['BROWSER_ENGINE']
          result=root/'results.json'
          status={'engine':os.environ['BROWSER_ENGINE'],
                  'candidate_sha':os.environ['GITHUB_SHA'],
                  'result_file_present':result.is_file(),
                  'run_log_present':(root/'run.log').is_file(),
                  'note':'Browser acceptance is unverified if result_file_present is false'}
          (root/'job-evidence-status.json').write_text(json.dumps(status,indent=2))
          print('HOTFIX3_EVIDENCE_STATUS',json.dumps(status))
          PY
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
      - name: Archive screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotfix3-${{ matrix.engine }}-screenshots
          path: artifacts/hotfix3/
          retention-days: 30
          if-no-files-found: warn
