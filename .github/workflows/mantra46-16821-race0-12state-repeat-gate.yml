name: Mantra 46 16821 Race0 12-State Repeat Gate
on:
  push:
    branches: [diagnostic-m46-16795-fine-coverage]
    paths:
      - '.github/workflows/mantra46-16821-race0-12state-repeat-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Generate race0 candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('tests/mantra46-16809-opportunity-gap-swap-ab.mjs').read_text()
          def make(states,out,loop):
              s=base
              old="const STATES=['Arkansas','Maryland','Texas','Florida','Colorado'];"
              assert s.count(old)==1
              s=s.replace(old,"const STATES="+json.dumps(states,separators=(',',':'))+";",1)
              s=s.replace("const OUT='artifacts/mantra46-16809-opportunity-gap-swap-ab';",f"const OUT='artifacts/{out}';",1)
              oldloop="for(const q of STATES){await runOne(q,false);await runOne(q,true)}"
              assert s.count(oldloop)==1
              s=s.replace(oldloop,loop,1)
              anchor="if(variant){\n   const capOld="
              assert s.count(anchor)==1
              inject="if(variant){\n   const raceOld=\"stagger=setTimeout(startAlternate,1200);\";\n   if(body.split(raceOld).length-1!==1)throw new Error('terrain race owner mismatch');\n   body=body.replace(raceOld,\"stagger=setTimeout(startAlternate,0);\");\n   const infraCleanupOld=\"function cleanup(){try{script.remove()}catch(_){}try{delete window[cb]}catch(_){window[cb]=undefined}}\";\n   if(body.split(infraCleanupOld).length-1!==1)throw new Error('Vermont infra callback cleanup owner mismatch');\n   body=body.replace(infraCleanupOld,\"function cleanup(){try{script.remove()}catch(_){}window[cb]=()=>{}}\");\n   const capOld="
              s=s.replace(anchor,inject,1)
              return s
          states=['Iowa','Arkansas','Oklahoma','Nebraska','Vermont','Texas','Florida','Louisiana','California','New York','Maryland','Colorado']
          Path('tests/.mantra46-16821-12state.mjs').write_text(make(states,'mantra46-16821-12state',"for(const q of STATES){await runOne(q,true)}"))
          Path('tests/.mantra46-16821-texas-repeat.mjs').write_text(make(['Texas'],'mantra46-16821-texas-repeat',"for(let i=0;i<5;i++){await runOne('Texas',true)}"))
          Path('tests/.mantra46-16821-louisiana-repeat.mjs').write_text(make(['Louisiana'],'mantra46-16821-louisiana-repeat',"for(let i=0;i<3;i++){await runOne('Louisiana',true)}"))
          PY
      - name: Run 12-state gate sample
        run: node tests/.mantra46-16821-12state.mjs || true
      - name: Run Texas five-repeat gate
        run: node tests/.mantra46-16821-texas-repeat.mjs || true
      - name: Run Louisiana three-repeat gate
        run: node tests/.mantra46-16821-louisiana-repeat.mjs || true
      - name: Evaluate all gates
        run: |
          python - <<'PY'
          import json,pathlib,sys
          targets={'Iowa':{'largest':55,'coverage':.7101},'Arkansas':{'largest':90,'coverage':.6268,'target':5000},'Oklahoma':{'largest':212,'coverage':.4957},'Nebraska':{'largest':62,'coverage':.6643},'Vermont':{'largest':165,'coverage':.5416},'Texas':{'largest':107,'coverage':.5077},'Florida':{'largest':8,'coverage':.8415},'Louisiana':{'largest':157,'coverage':.4855},'California':{'largest':163,'coverage':.5320},'New York':{'largest':218,'coverage':.4045},'Maryland':{'largest':360,'coverage':.2888},'Colorado':{'largest':7,'coverage':.8312}}
          def load(name):
              p=pathlib.Path(f'artifacts/{name}/results.json')
              if not p.exists(): return []
              d=json.loads(p.read_text()); return d if isinstance(d,list) else d.get('rows',d.get('results',[]))
          def check(r):
              q=r.get('query'); a=r.get('audit') or {}; t=targets.get(q); outside=a.get('outside') or {}; clusters=a.get('gapClusters') or []; largest=clusters[0] if clusters else 0; page=r.get('pageErrors') or []
              ok=bool(t) and not r.get('loadError') and not r.get('timedOut') and not page and float(a.get('coreMs') or 1e9)<=15000 and int(a.get('generated') or -1)==int(a.get('visible') or -2) and int(a.get('unsafe') or 0)==0 and int(outside.get('swales') or 0)==0 and largest<=t['largest'] and float(a.get('coverageRatio') or 0)>=t['coverage'] and ('target' not in t or float(a.get('targetNearest') or 1e99)<=t['target'])
              return {'query':q,'pass':ok,'coreMs':a.get('coreMs'),'generated':a.get('generated'),'visible':a.get('visible'),'unsafe':a.get('unsafe'),'largest':largest,'coverage':a.get('coverageRatio'),'targetNearest':a.get('targetNearest'),'pageErrors':page}
          stateRows=[check(r) for r in load('mantra46-16821-12state')]
          txRows=[check(r) for r in load('mantra46-16821-texas-repeat')]
          laRows=[check(r) for r in load('mantra46-16821-louisiana-repeat')]
          missing=[q for q in targets if q not in [r['query'] for r in stateRows]]
          fail=[r for r in stateRows+txRows+laRows if not r['pass']]
          repeatOK=len(txRows)==5 and len(laRows)==3
          summary={'stateRows':stateRows,'texasRepeats':txRows,'louisianaRepeats':laRows,'missing':missing,'repeatCountsOK':repeatOK,'failed':fail}
          pathlib.Path('artifacts/mantra46-16821-summary').mkdir(parents=True,exist_ok=True)
          pathlib.Path('artifacts/mantra46-16821-summary/gate-summary.json').write_text(json.dumps(summary,indent=2))
          print('EARTHLINE_M46_16821 '+json.dumps(summary))
          if missing or fail or not repeatOK: sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16821-race0-12state-repeat-gate
          path: |
            artifacts/mantra46-16821-*
          if-no-files-found: error
