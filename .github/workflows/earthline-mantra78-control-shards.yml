name: Earthline Mantra 78 Control Shards
on:
  push:
    branches:
      - recovery/mantra76-audit-restart
    paths:
      - 'tests/mantra78-live-controls-matrix.mjs'
      - '.github/workflows/earthline-mantra78-control-shards.yml'
permissions:
  contents: read
jobs:
  control:
    strategy:
      fail-fast: false
      matrix:
        case_id: [az-good, az-bad, poudre]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra76-audit-restart
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          google-chrome --version
          npm install --no-save playwright-core@1.55.0
      - name: Run five-repeat production control
        env:
          CASE_ID: ${{ matrix.case_id }}
        run: node tests/mantra78-live-controls-matrix.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-mantra78-${{ matrix.case_id }}
          path: artifacts/mantra78-live-controls/results.json
          if-no-files-found: warn
