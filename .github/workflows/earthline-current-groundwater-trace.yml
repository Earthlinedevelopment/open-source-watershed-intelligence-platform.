name: Earthline Current Regional Groundwater Trace
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/trace-current-regional-groundwater.py'
      - '.github/workflows/earthline-current-groundwater-trace.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tests/trace-current-regional-groundwater.py
