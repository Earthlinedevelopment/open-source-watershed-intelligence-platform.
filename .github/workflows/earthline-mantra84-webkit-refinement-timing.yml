name: Mantra 84 WebKit Refinement Timing
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - 'tests/mantra84-webkit-refinement-timing.mjs'
      - '.github/workflows/earthline-mantra84-webkit-refinement-timing.yml'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: {Q: Arizona}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps webkit
      - run: node tests/mantra84-webkit-refinement-timing.mjs
