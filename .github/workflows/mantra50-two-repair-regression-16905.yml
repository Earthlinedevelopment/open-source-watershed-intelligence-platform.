name: Mantra 50 two repair regression 16905
on:
  push:
    branches: [mantra50-two-launch-repairs-16905]
    paths:
      - 'index.html'
      - 'tests/mantra50-two-repair-regression.mjs'
      - '.github/workflows/mantra50-two-repair-regression-16905.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra50-two-launch-repairs-16905
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run exact NM to TX and Alaska regressions
        run: node tests/mantra50-two-repair-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra50-two-repair-regression
          path: artifacts/mantra50-two-repair/
          if-no-files-found: warn
