name: Mantra 51 Production Germany 16922 Regression
on:
  workflow_dispatch:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-production-germany-16922.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - name: Germany Regional to Property to same Regional
        run: |
          cat > germany-production-16922.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1800,height:1000}});
          await page.goto('https://earthlinedevelopment.org/?prod16922='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForSelector('#searchInput',{timeout:30000});
          async function run(q){
            await page.evaluate(q=>{
              const i=document.getElementById('searchInput'),b=document.getElementById('runBtn');
              i.value=q;
              i.dispatchEvent(new Event('input',{bubbles:true}));
              i.dispatchEvent(new Event('change',{bubbles:true}));
              b.click();
            },q);
          }
          await run('germany country');
          await page.waitForFunction(()=>window.EARTHLINE_REGIONAL_TERMINAL_16539?.status==='published',null,{timeout:180000,polling:250});
          await page.waitForTimeout(1200);
          const hit=page.locator('.earthline-swale-hit-16070,.earthline-swale-label-16149').first();
          if(!(await hit.count())) throw new Error('No Germany Regional corridor hit target found');
          await hit.click({force:true});
          await page.waitForTimeout(500);
          const z=page.locator('#earthlineCorridorDetail16149 [data-action="zoom"]').first();
          if(!(await z.count())) throw new Error('Corridor zoom action missing');
          await z.click();
          await page.waitForTimeout(900);
          const prop=page.locator('#earthlineDeclareProperty16169').first();
          if(!(await prop.count())) throw new Error('20-acre Property action missing');
          await prop.click({timeout:10000});
          await page.waitForFunction(()=>window.EARTHLINE_PROPERTY_RUN_AUDIT_16173?.settled===true,null,{timeout:90000,polling:200});
          const p=await page.evaluate(()=>({
            tier:document.documentElement.dataset.earthlineAnalysisTier,
            swales:Array.isArray(M?.swales)?M.swales.length:null,
            displayed:window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null,
            status:document.getElementById('earthlineVermontStatus16147')?.textContent||''
          }));
          console.log('PRODUCTION_PROPERTY '+JSON.stringify(p));
          if(String(p.tier)!=='property'||!(p.swales>0)||!p.displayed) throw new Error('Germany Property did not publish visible swales');
          await run('germany country');
          await page.waitForFunction(()=>window.EARTHLINE_REGIONAL_TERMINAL_16539?.status==='published' && String((window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||{}).tier||'')==='regional',null,{timeout:180000,polling:250});
          const r=await page.evaluate(()=>({
            tier:document.documentElement.dataset.earthlineAnalysisTier,
            displayed:window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null,
            error:window.EARTHLINE_LAST_LIVE_REGIONAL_ERROR_15970||null,
            terminal:window.EARTHLINE_REGIONAL_TERMINAL_16539||null,
            status:document.getElementById('earthlineVermontStatus16147')?.textContent||'',
            report:document.getElementById('earthlineVermontReport16149')?.textContent||''
          }));
          console.log('PRODUCTION_RETURN '+JSON.stringify(r));
          if(!r.displayed||String(r.displayed.tier||r.displayed.mode)!=='regional'||r.error) throw new Error('Same-query Germany Regional return failed');
          if(/RUN ANALYSIS FIRST/i.test(r.report)||/property engine returned no verified result/i.test(r.status)) throw new Error('Stale Property/report failure remains');
          await browser.close();
          JS
          node germany-production-16922.mjs
