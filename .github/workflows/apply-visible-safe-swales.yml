name: Apply Visible Safe Swale Repair
'on':
  push:
    branches:
      - repair/visible-safe-swales-20261029
    paths:
      - tools/apply-visible-safe-swales.py
      - .github/workflows/apply-visible-safe-swales.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/visible-safe-swales-20261029
      - run: python3 tools/apply-visible-safe-swales.py
      - run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
      - run: |
          git config user.name "Earthline Engine"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: require actual rendered safe Property swales"
          git push origin HEAD:repair/visible-safe-swales-20261029
