name: Mantra 92 tune isolated candidate screening
on:
  push:
    branches: [audit/mantra92-regional-fallback-isolation]
    paths:
      - tools/mantra92-tune-yield-on-candidate.mjs
      - .github/workflows/mantra92-build-metric-candidate.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tune isolated metric candidate; never write production
        shell: bash
        env:
          EARTHLINE_M92_YIELD_RATE: '1536'
        run: |
          set -euo pipefail
          cp tools/mantra92-tune-yield-on-candidate.mjs /tmp/m92-tune.mjs
          git fetch origin refs/heads/candidate/mantra92-metric-recovery:refs/remotes/origin/candidate/mantra92-metric-recovery
          git checkout -B candidate/mantra92-metric-recovery refs/remotes/origin/candidate/mantra92-metric-recovery
          test "$(git rev-parse HEAD)" = "4939a8033b07a9c54bf7f9f61ad96844da8fec3d" || { echo "::error::Candidate head advanced; refuse"; exit 1; }
          cp /tmp/m92-tune.mjs ./m92-tune.mjs
          node m92-tune.mjs
          rm m92-tune.mjs
          python3 tools/earthline-release-airlock-static.py
          git diff --check
          test "$(git diff --name-only)" = "index.html" || { echo "::error::Only index.html may change"; exit 1; }
          git config user.name "Earthline recovery"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "perf(mantra92): pace screened corridors in 1536-candidate batches"
          git push origin HEAD:refs/heads/candidate/mantra92-metric-recovery
