name: Mantra 92 repair isolated candidate Regional SVG
on:
  push:
    branches: [audit/mantra92-regional-fallback-isolation]
    paths:
      - tools/mantra92-fix-subpixel-swale.mjs
      - .github/workflows/mantra92-build-metric-candidate.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover actual Mapbox-projected corridor in isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          cp tools/mantra92-fix-subpixel-swale.mjs /tmp/m92-render.mjs
          git fetch origin refs/heads/candidate/mantra92-metric-recovery:refs/remotes/origin/candidate/mantra92-metric-recovery
          git checkout -B candidate/mantra92-metric-recovery refs/remotes/origin/candidate/mantra92-metric-recovery
          test "$(git rev-parse HEAD)" = "7db945d8893060a70119bef5fe524062005b9e2d" || { echo "::error::Candidate advanced; do not overwrite"; exit 1; }
          cp /tmp/m92-render.mjs ./m92-render.mjs
          node m92-render.mjs
          rm m92-render.mjs
          python3 tools/earthline-release-airlock-static.py
          git diff --check
          test "$(git diff --name-only)" = "index.html" || { echo "::error::Unexpected modified files"; exit 1; }
          git config user.name "Earthline recovery"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "render(mantra92): retain valid regional subpixel swale projection"
          git push origin HEAD:refs/heads/candidate/mantra92-metric-recovery
