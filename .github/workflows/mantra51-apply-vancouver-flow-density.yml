name: Mantra 51 Apply Vancouver Flow Density
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths: ['lab/mantra51-fix-vancouver-flow-density.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: mantra51-global-repair-campaign}
      - run: python3 lab/mantra51-fix-vancouver-flow-density.py
      - run: |
          grep -n "EARTHLINE_VANCOUVER_FLOW_DENSITY_16917" index.html
          grep -n "vancouverFlowDensity16917?0.72:0.84" index.html
      - run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: increase Vancouver Island modeled water-path density"
          git push origin HEAD:mantra51-global-repair-campaign
