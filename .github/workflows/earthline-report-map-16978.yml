name: Earthline technical report map 16978
on:
  push:
    branches:
      - pages-live
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Convert report to technical drawing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          a=s.index("function mapSvg(d,small=false){")
          b=s.index("  return parts.join('');\n}",a)+len("  return parts.join('');\n}")
          fn=s[a:b]

          def one(old,new,label):
              global fn
              if old not in fn:
                  raise SystemExit("missing "+label)
              fn=fn.replace(old,new,1)

          one('class="el-report-real-site-render-16977"',
              'class="el-report-technical-plan-16978"',"renderer marker")

          # Replace the entire photographic/contour prelude with a clean technical sheet.
          st=fn.index("  if(conus){")
          en=fn.index("  for(const f of aquiferFeatures){",st)
          technical='''  parts.push('<rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" fill="#f8f6ef"/>');\n  for(let i=0;i<reportContours.length;i+=7){const dp=path(reportContours[i]);if(dp)parts.push('<path d="'+dp+'" fill="none" stroke="#aaa59b" stroke-width=".58" opacity=".52" vector-effect="non-scaling-stroke"/>')}\n'''
          fn=fn[:st]+technical+fn[en:]

          fn=fn.replace('fill="url(#elGround16971)"','fill="#f8f6ef"',1)

          one('stroke="#f6fbfb" stroke-width="2.6" opacity=".16"',
              'stroke="#cfe8ee" stroke-width="3.2" opacity=".72"',"flow halo")
          one('stroke="#0b7699" stroke-width="1.35" opacity=".88"',
              'stroke="#176f90" stroke-width="1.45" opacity=".96"',"flow line")

          one('stroke="#3d6650" stroke-width=".82" opacity=".07"',
              'stroke="#76887a" stroke-width="1.05" opacity=".36" stroke-dasharray="4 3"',"B casing")
          one('stroke="#4f805e" stroke-width=".62" opacity=".09"',
              'stroke="#7f927f" stroke-width=".62" opacity=".24" stroke-dasharray="4 3"',"B green")
          one('stroke="#2b6970" stroke-width=".34" opacity=".10"',
              'stroke="#6b8e95" stroke-width=".30" opacity=".20"',"B water")

          one('stroke="#173d31" stroke-width="3.0" opacity=".24"',
              'stroke="#315f3d" stroke-width="3.15" opacity=".82"',"A outer")
          one('stroke="#4f8a5f" stroke-width="2.15" opacity=".62"',
              'stroke="#78a567" stroke-width="2.05" opacity=".90"',"A green")
          one('stroke="#087f9a" stroke-width=".92" opacity=".94"',
              'stroke="#176f90" stroke-width=".78" opacity=".96"',"A center")

          one("for(const r of rows.filter(r=>r.grade==='C'))draw(r);",
              "/* C opportunities omitted from the report overview for readability. */","C display")
          one("for(const r of rows.filter(r=>r.grade==='B'))draw(r);",
              "for(const r of rows.filter(r=>r.grade==='B').slice(0,12))draw(r);","B display")
          one("for(const r of rows.filter(r=>r.grade==='A'))draw(r);",
              "for(const r of rows.filter(r=>r.grade==='A').slice(0,18))draw(r);","A display")
          one("rows.filter(r=>r.grade==='A').slice(0,0)",
              "rows.filter(r=>r.grade==='A').slice(0,3)","A labels")

          fn=fn.replace("REAL-SITE WATER PLAN","ENGINE TECHNICAL PLAN")
          fn=fn.replace("Aerial: USDA NAIP · Earthline frozen run geometry","Technical plan · Earthline frozen run geometry")

          out=s[:a]+fn+s[b:]
          if "el-report-technical-plan-16978" not in out:
              raise SystemExit("16978 marker missing")
          p.write_text(out,encoding="utf-8")
          PY
          git config user.name "Earthline Build Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "style: technical explanatory report map 16978"
          git push origin HEAD:pages-live
