name: Mantra 83 Shadow Runner
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - 'shadow/mantra83-shadow-runner.mjs'
      - 'tests/mantra83-shadow-runner.mjs'
      - '.github/workflows/earthline-mantra83-shadow-runner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/mantra83-shadow-runner.mjs
      - run: node tests/mantra83-full-purity.mjs
