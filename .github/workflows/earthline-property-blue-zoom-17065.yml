name: Earthline Property Blue + Zoom 17065

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-property-blue-zoom-17065.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0

      - name: Apply exactly two presentation repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          old_water="""for(const id of ['earthline-property-safe-casing-16221','earthline-property-safe-earth-16221','earthline-property-safe-life-16221','earthline-property-safe-water-16221']){try{if(mp.getLayer?.(id))mp.setPaintProperty(id,'line-opacity',0)}catch(_){}}"""
          new_water="""for(const id of ['earthline-property-safe-casing-16221','earthline-property-safe-earth-16221','earthline-property-safe-life-16221','earthline-property-safe-water-16221']){try{if(mp.getLayer?.(id))mp.setPaintProperty(id,'line-opacity',id==='earthline-property-safe-water-16221'?.82:0)}catch(_){}}"""

          old_zoom=".el49-detail-shell{width:min(680px,96vw);max-height:90vh;overflow:auto;"
          new_zoom=".el49-detail-shell{width:min(680px,96vw);max-height:calc(100vh - 36px);overflow:auto;"

          if s.count(old_water) != 1:
              raise SystemExit(f"Expected exactly one Property water owner anchor; found {s.count(old_water)}")
          if s.count(old_zoom) != 1:
              raise SystemExit(f"Expected exactly one Zoom shell anchor; found {s.count(old_zoom)}")

          s=s.replace(old_water,new_water,1)
          s=s.replace(old_zoom,new_zoom,1)

          # Fail if the known bad Regional override is present.
          if "earthline-presentation-lock-17139" in s:
              raise SystemExit("Bad 17139 Regional override present; refusing patch")

          p.write_text(s,encoding="utf-8")
          PY

          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          assert "id==='earthline-property-safe-water-16221'?.82:0" in s
          assert ".el49-detail-shell{width:min(680px,96vw);max-height:calc(100vh - 36px);overflow:auto;" in s
          assert "earthline-presentation-lock-17139" not in s
          print("Two-repair contract PASS")
          PY

      - name: Commit only index.html
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "earthline-release-bot"
          git config user.email "earthline-release-bot@users.noreply.github.com"
          git add index.html
          test "$(git diff --cached --name-only)" = "index.html"
          git commit -m "ui: more Property blue and unclip Zoom button 17065" || exit 0
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
