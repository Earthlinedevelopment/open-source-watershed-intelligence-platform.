name: Earthline Bioswale Report Off-Production Audit 17077

on:
  push:
    branches:
      - stability/v1-launch-audit-17075
    paths:
      - '.github/workflows/earthline-report-offprod-audit-17077.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated site
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-report-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/earthline-report-http.log
          exit 1
      - name: Run report layout audit
        run: |
          mkdir -p artifacts/report-offprod-17077
          cat > tests/report-audit-17077-run.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';

          const browser=await chromium.launch({headless:true});
          const cases=[
            {name:'desktop',w:1440,h:900,mobile:false},
            {name:'tablet',w:1024,h:768,mobile:false},
            {name:'phone',w:390,h:844,mobile:true}
          ];
          const rows=[];
          for(const tc of cases){
            const context=await browser.newContext({viewport:{width:tc.w,height:tc.h},isMobile:tc.mobile,hasTouch:tc.mobile});
            const page=await context.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            const row={case:tc,errors};
            try{
              await page.goto('http://127.0.0.1:8787/?reportAudit17077='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForSelector('#searchInput',{timeout:20000});
              await page.waitForTimeout(1200);

              // Use the real Regional -> crosshair -> Property pathway.
              await page.evaluate(()=>{
                const i=document.getElementById('searchInput'),b=document.getElementById('runBtn');
                i.value='Vermont';
                i.dispatchEvent(new Event('input',{bubbles:true}));
                i.dispatchEvent(new Event('change',{bubbles:true}));
                b.click();
              });
              await page.waitForFunction(()=>/screening published\./i.test(String(document.getElementById('earthlineVermontStatus16147')?.textContent||''))||!!window.EARTHLINE_LAST_LIVE_REGIONAL_ERROR_15970,{timeout:30000,polling:120}).catch(()=>{});
              const regErr=await page.evaluate(()=>window.EARTHLINE_LAST_LIVE_REGIONAL_ERROR_15970||null);
              row.regionalError=regErr;
              if(!regErr){
                // Place crosshair by moving map center, then use the real Property declaration.
                await page.evaluate(()=>{
                  const m=window.earthlineMap||(typeof earthlineMap!=='undefined'?earthlineMap:null);
                  m?.jumpTo?.({center:[-73.012909,44.513845],zoom:13,bearing:0,pitch:0});
                });
                await page.waitForTimeout(500);
                const propertyResult=await page.evaluate(async()=>{
                  try{
                    const f=window.earthlineDeclarePropertyAtCrosshair16169||window.earthlineDeclarePropertyAtCrosshair16173;
                    if(typeof f!=='function')return {ok:false,reason:'property crosshair owner unavailable'};
                    const v=await f();
                    return {ok:!!v,value:v};
                  }catch(e){return {ok:false,reason:String(e)}}
                });
                row.propertyResult=propertyResult;
                await page.waitForTimeout(1000);

                const button=page.locator('#earthlineVermontReport16149');
                row.reportButton=await button.count()?await button.evaluate(el=>({disabled:el.disabled,ready:el.dataset.ready,text:el.textContent.trim()})):null;
                if(row.reportButton && !row.reportButton.disabled){
                  await button.click();
                  await page.waitForTimeout(600);
                  row.layout=await page.evaluate(()=>{
                    const panel=document.getElementById('earthlineVermontReportPanel16149');
                    const shell=panel?.querySelector('.el49-shell');
                    const toolbar=panel?.querySelector('.el49-toolbar');
                    const report=panel?.querySelector('.el49-report');
                    const box=e=>{if(!e)return null;const s=getComputedStyle(e),r=e.getBoundingClientRect();return{
                      x:r.x,y:r.y,w:r.width,h:r.height,scrollH:e.scrollHeight,clientH:e.clientHeight,scrollW:e.scrollWidth,clientW:e.clientWidth,
                      overflow:s.overflow,overflowY:s.overflowY,position:s.position,display:s.display,alignItems:s.alignItems,justifyContent:s.justifyContent,
                      zIndex:s.zIndex,maxHeight:s.maxHeight,padding:s.padding,background:s.backgroundColor
                    }};
                    return {
                      rootClass:document.documentElement.className,
                      panel:box(panel),shell:box(shell),toolbar:box(toolbar),report:box(report),
                      panelOpen:panel?.classList.contains('open')||false,
                      pageCount:panel?.querySelectorAll('.el49-page').length||0,
                      closeCount:panel?.querySelectorAll('[data-action="close"]').length||0
                    };
                  });
                  await page.screenshot({path:`artifacts/report-offprod-17077/${tc.name}.png`,fullPage:true});
                  // verify close state
                  await page.locator('#earthlineVermontReportPanel16149 [data-action="close"]').click();
                  await page.waitForTimeout(250);
                  row.afterClose=await page.evaluate(()=>({
                    panelOpen:document.getElementById('earthlineVermontReportPanel16149')?.classList.contains('open')||false,
                    reportClass:document.documentElement.classList.contains('earthline-report-open-16966')
                  }));
                }
              }
            }catch(e){row.fatal=String(e)}
            rows.push(row);
            console.log('EARTHLINE_REPORT_17077 '+JSON.stringify(row));
            await context.close();
          }
          await browser.close();
          writeFileSync('artifacts/report-offprod-17077/results.json',JSON.stringify(rows,null,2));
          EOF
          node tests/report-audit-17077-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-report-offprod-17077
          path: artifacts/report-offprod-17077/
          if-no-files-found: warn
          retention-days: 7
