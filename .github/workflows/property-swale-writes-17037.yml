name: Earthline Property Swale Writes 17037
on:
  push:
    branches: [test-property-coverage-17031]
    paths:
      - '.github/workflows/property-swale-writes-17037.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exact Property swale writes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          lines=s.splitlines()
          for needle in ['earthlineGovernedPropertyRun16202','M.swales=','M.swales =','makeSwales(','rawEngineCorridors']:
              print('\n===== '+needle+' =====')
              for idx,line in enumerate(lines):
                  if needle in line:
                      print('\n--- LINE',idx+1,'---')
                      for j in range(max(0,idx-18),min(len(lines),idx+28)):
                          print(f'{j+1:05d}: {lines[j]}')
          PY
