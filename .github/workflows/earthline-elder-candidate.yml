# Tests the CANDIDATE index.html in this branch inside real browsers, against the public site's data services.
# Does not publish anything and does not touch pages-live. Results go to the branch "elder-candidate-results".
name: Earthline Elder bar candidate test
on:
  push:
    branches: [candidate/elder-bar]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  detector-test:
    name: detector test (synthetic canopy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install numpy scipy
      - name: Run against the detector now live (baseline) and the candidate
        run: |
          git show origin/pages-live:tools/elder_trees/chmv2_array_detector_17129.py > /tmp/live_detector.py
          python3 tests/elder-bar-test.py tools/elder_trees/chmv2_array_detector_17129.py /tmp/live_detector.py
  test:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop-chrome, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browsers
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox webkit
      - name: Test the live site
        env:
          EARTHLINE_PROFILE: ${{ matrix.profile }}
          EARTHLINE_PINNED: '1'
          EARTHLINE_PINNED_EXTRA: tools/elder_trees/chmv2_array_detector_17129.py
          EARTHLINE_RESULTS_DIR: elder-candidate-results
        run: node tests/earthline-live-site-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elder-candidate-${{ matrix.profile }}
          path: elder-candidate-results/
          retention-days: 14
  publish:
    name: Publish results
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: collected
          merge-multiple: true
      - name: Push results to the elder-candidate-results branch
        run: |
          cd collected
          git init -q -b elder-candidate-results
          git config user.name "earthline-live-test"
          git config user.email "live-test@users.noreply.github.com"
          date -u > TESTED-AT.txt
          git add -A
          git commit -q -m "Candidate test results ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" elder-candidate-results
