name: Mantra 51 Production Final Report Gate
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - '.github/workflows/mantra51-production-final-report-gate.yml'
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - run: |
          cat > prod.mjs <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:1100},deviceScaleFactor:1});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          await page.goto('https://earthlinedevelopment.org/?reportfinal='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(4500);

          await page.evaluate(()=>{location.hash='#swales-explained'});
          await page.waitForSelector('#earthlineSwalesPage16125.open',{timeout:15000});
          await page.waitForTimeout(700);
          const sw=await page.evaluate(()=>{
            const h=document.getElementById('earthlineSwalesPage16125'),d=h?.querySelector('iframe')?.contentDocument;
            const ex=d?.querySelector('[aria-labelledby="swaleExamplesTitle"]');
            const core=[...(d?.querySelectorAll('h2')||[])].find(x=>/idea in one minute/i.test(x.textContent||''));
            let coreText='';
            if(core){for(let n=core.nextSibling;n&&!(n.nodeType===1&&n.tagName==='H2');n=n.nextSibling)coreText+=n.textContent||''}
            const src=d?.getElementById('earthlineCanonicalHowBioswalesSources16923');
            return {
              images:d?.querySelectorAll('img').length||0,
              imagesFirst:!!ex&&!!core&&!!(ex.compareDocumentPosition(core)&Node.DOCUMENT_POSITION_FOLLOWING),
              core:!!core,
              brokenRefs:/§\s*\d|If you have two minutes|If you have ten/i.test(coreText),
              corrections:/Corrections Registry/i.test(d?.body?.innerText||''),
              sources:!!src
            };
          });
          await page.locator('#earthlineSwalesPage16125 iframe').screenshot({path:'production-how-swales.png'});
          await page.evaluate(()=>window.earthlineCloseSwalesExplained16125?.());

          const report=await page.evaluate(()=>{
            const tok='earthline-production-report-final',bounds=[-112.4,33.1,-111.7,33.7];
            window.EARTHLINE_ACTIVE_RUN_TOKEN_16151=tok;
            window.EARTHLINE_DISPLAYED_RUN_16151={runToken:tok,bounds,query:'Arizona Production Gate',tier:'regional',mode:'regional',extentClass:'regional',completedAt:new Date().toISOString(),terrain:{source:'gate terrain',surfaceType:'DTM'},watersheds:{source:'gate',features:1},aquifers:{source:'gate aquifer source',features:1,boundaryClass:'context'},derived:{contours:3,waterPaths:2,swaleOpportunityLines:2}};
            window.EARTHLINE_REGIONAL_VISUAL_DATA_16020={bounds,
              contours:{features:[
                {type:'Feature',properties:{ele:400},geometry:{type:'LineString',coordinates:[[-112.32,33.18],[-111.80,33.55]]}},
                {type:'Feature',properties:{ele:500},geometry:{type:'LineString',coordinates:[[-112.35,33.28],[-111.78,33.60]]}},
                {type:'Feature',properties:{ele:600},geometry:{type:'LineString',coordinates:[[-112.30,33.38],[-111.76,33.64]]}}
              ]},
              flows:{features:[
                {type:'Feature',properties:{},geometry:{type:'LineString',coordinates:[[-112.28,33.58],[-112.08,33.42],[-111.84,33.22]]}},
                {type:'Feature',properties:{},geometry:{type:'LineString',coordinates:[[-112.20,33.62],[-112.02,33.48],[-111.90,33.32]]}}
              ]},
              swales:{features:[
                {type:'Feature',properties:{grade:'A',score:86},geometry:{type:'LineString',coordinates:[[-112.24,33.48],[-112.08,33.46],[-111.90,33.45]]}},
                {type:'Feature',properties:{grade:'B',score:71},geometry:{type:'LineString',coordinates:[[-112.22,33.36],[-112.04,33.35],[-111.86,33.34]]}}
              ]},
              aquifers:{features:[{type:'Feature',properties:{name:'Mapped regional aquifer'},geometry:{type:'MultiPolygon',coordinates:[[[[-112.18,33.29],[-111.90,33.29],[-111.90,33.52],[-112.18,33.52],[-112.18,33.29]]]]}}]}
            };
            const opened=window.earthlineOpenVermontReport16151?.();
            const p=document.getElementById('earthlineVermontReportPanel16149');
            const html=p?.innerHTML||'';
            return {
              opened:!!opened,
              panel:!!p?.classList.contains('open'),
              maps:p?.querySelectorAll('.el49-figure svg').length||0,
              title:/Hydrology and Bioswale Opportunity Plan/.test(html),
              aquiferShapes:(html.match(/rgba\(92,170,202,.18\)/g)||[]).length,
              aquiferSpam:(html.match(/AQUIFER\s*·/g)||[]).length,
              aquiferCount:/Mapped aquifer context[\s\S]*?<b>1<\/b>|<b>1<\/b>[\s\S]*?Mapped aquifer context/.test(html),
              water:html.includes('#5b9fc2'),
              swale:html.includes('#4f8b5d'),
              elevation:html.includes('400 m'),
              texture:html.includes('paperTexture'),
              legend:/Mapped aquifer context/.test(html)&&/Planted bioswale/.test(html)&&/Contour \/ elevation/.test(html)
            };
          });
          await page.waitForTimeout(500);
          await page.locator('#earthlineVermontReportPanel16149 .el49-page').nth(2).screenshot({path:'production-bioswale-report-map.png'});
          console.log(JSON.stringify({sw,report,errors},null,2));
          if(sw.images<1||!sw.imagesFirst||!sw.core||sw.brokenRefs||!sw.corrections||!sw.sources)throw new Error('Production How Swales failed');
          if(!report.opened||!report.panel||report.maps!==1||!report.title||report.aquiferShapes<1||report.aquiferSpam!==0||!report.water||!report.swale||!report.elevation||!report.texture||!report.legend)throw new Error('Production report map failed');
          if(errors.some(e=>/Invalid or unexpected token|ReferenceError/i.test(e)))throw new Error('Production runtime error');
          await browser.close();
          JS
          node prod.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mantra51-production-final-report-visuals
          path: |
            production-how-swales.png
            production-bioswale-report-map.png
