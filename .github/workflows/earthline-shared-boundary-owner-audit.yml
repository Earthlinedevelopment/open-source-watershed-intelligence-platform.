name: Earthline Shared Boundary Owner Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.github/workflows/earthline-shared-boundary-owner-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          grep -n -F "function earthlineAdministrativeCapability16539" index.html || true
          grep -n -F "function earthlineResolveJurisdictionBoundary16539" index.html || true
          grep -n -F "function earthlineClipRegionalProducts16539" index.html || true
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8').splitlines()
          needles=['function earthlineAdministrativeCapability16539','function earthlineResolveJurisdictionBoundary16539','function earthlineClipRegionalProducts16539']
          for needle in needles:
              for i,line in enumerate(s):
                  if needle in line:
                      a=max(0,i-15); b=min(len(s),i+95)
                      print('\n===',needle,'lines',a+1,'-',b,'===')
                      for n in range(a,b):
                          print(f'{n+1}:{s[n]}')
                      break
          PY
