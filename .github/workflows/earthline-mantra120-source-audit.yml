name: Earthline Mantra120 Source Audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-mantra120-source-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Extract error sites and regional re-entry owners
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          p=Path('index.html')
          s=p.read_text(encoding='utf-8',errors='replace')
          patterns=['__earthlineVtBoundary16178','EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040','EARTHLINE_DISPLAYED_RUN_16151','regional2','earthlineVtBoundary16178','EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167']
          out=['size='+str(len(s)),'lines='+str(s.count(chr(10))+1)]
          for pat in patterns:
              positions=[m.start() for m in re.finditer(re.escape(pat),s)]
              out.append('PATTERN '+pat+' COUNT '+str(len(positions)))
              for i,pos in enumerate(positions[:12]):
                  out.append('OCCURRENCE '+str(i+1)+' OFFSET '+str(pos))
                  out.append(s[max(0,pos-1500):min(len(s),pos+2300)])
          Path('/tmp/earthline-source-audit.txt').write_text('\n'.join(out))
          PY
      - name: Publish audit to main branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -C main origin/main
          mkdir -p .earthline-tests/mantra120
          cp /tmp/earthline-source-audit.txt .earthline-tests/mantra120/source-audit.txt
          git add .earthline-tests/mantra120/source-audit.txt
          git commit -m "diagnostic: capture Mantra120 source error sites" || true
          git push origin HEAD:main
