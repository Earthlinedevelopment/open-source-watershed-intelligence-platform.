name: Mantra 83 Deploy Verified Science Corrections
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/earthline-mantra83-deploy-verified.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mantra83-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra83-shadow-live
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          cp tests/mantra83-fix-regional-four-percent.mjs /tmp/fix-slope.mjs
          cp tests/mantra83-fix-jsonp-late-callback.mjs /tmp/fix-jsonp.mjs
          git fetch origin pages-live
          git checkout -B pages-live origin/pages-live
          node /tmp/fix-slope.mjs
          node /tmp/fix-jsonp.mjs
          git config user.name "earthline-ci"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "science: enforce four-percent Regional swales and guard late Vermont callback"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
