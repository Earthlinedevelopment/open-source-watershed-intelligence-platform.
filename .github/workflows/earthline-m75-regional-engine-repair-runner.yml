name: Earthline M75 Regional Engine Repair Runner
on:
  push:
    branches:
      - recovery/mantra74-stability
    paths:
      - tools/m75_regional_engine_repair.py
      - .github/workflows/earthline-m75-regional-engine-repair-runner.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-regional-engine
          path: candidate
          fetch-depth: 0
      - name: Apply guarded engine repair
        run: python3 controller/tools/m75_regional_engine_repair.py candidate/index.html
      - name: Parse-check repaired page
        working-directory: candidate
        run: node --check earthline-launch-16872.js
      - name: Commit repaired engine
        working-directory: candidate
        run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: expand Regional prescriber coverage budget"
          git push origin HEAD:recovery/mantra75-regional-engine
