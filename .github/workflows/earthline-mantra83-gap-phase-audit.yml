name: Mantra 83 Gap Phase Audit
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - 'tests/mantra83-gap-phase-audit.mjs'
      - '.github/workflows/earthline-mantra83-gap-phase-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright
      - run: node tests/mantra83-gap-phase-audit.mjs
