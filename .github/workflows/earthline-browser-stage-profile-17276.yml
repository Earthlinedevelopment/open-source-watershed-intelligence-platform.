name: Earthline Browser Stage Profile 17276
on:
  push:
    branches: [diag/browser-stage-profile-17276]
    paths:
      - 'tests/apply-browser-stage-profile-17276.py'
      - '.github/workflows/earthline-browser-stage-profile-17276.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    runs-on: ${{ matrix.browser == 'webkit' && 'macos-14' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/browser-stage-profile-17276
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          python3 tests/apply-exact-jurisdiction-fast-screen-17270.py
          python3 tests/apply-consolidated-jurisdiction-screen-17262.py
          python3 tests/apply-crosscall-jurisdiction-cache-17272.py
          python3 tests/apply-grid-point-cache-17274.py
          python3 tests/apply-terrain-hedge-17275.py
          python3 tests/apply-browser-stage-profile-17276.py
      - name: Add console forwarding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/mantra46-16791-50state-production.mjs')
          s=p.read_text(encoding='utf-8')
          old="  const page=await context.newPage();\n  const pageErrors=[];"
          new="  const page=await context.newPage();\n  page.on('console',m=>{const t=m.text();if(t.includes('EARTHLINE_BROWSER_STAGE_PROFILE_17276'))console.log(t)});\n  const pageErrors=[];"
          if s.count(old)!=1: raise SystemExit('console anchor '+str(s.count(old)))
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - run: |
          npm install --no-save playwright@1.55.0
          if [ "${{ matrix.browser }}" = "webkit" ]; then npx playwright install webkit; else npx playwright install --with-deps firefox; fi
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Profile Texas and Vermont
        run: |
          if [ "${{ matrix.browser }}" = "firefox" ]; then
            xvfb-run -a env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='firefox' HEADLESS='false' WAIT_MS='120000' STATES='Texas|Vermont' node tests/mantra46-16791-50state-production.mjs || true
          else
            env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='webkit' HEADLESS='true' WAIT_MS='120000' STATES='Texas|Vermont' node tests/mantra46-16791-50state-production.mjs || true
          fi
