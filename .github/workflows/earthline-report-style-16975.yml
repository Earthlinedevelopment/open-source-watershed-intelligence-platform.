name: Earthline report decisive restyle 16975
on:
  push:
    branches:
      - pages-live
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Apply decisive property-language report restyle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          start=s.index("function mapSvg(d,small=false){")
          end=s.index("  return parts.join('');\n}",start)+len("  return parts.join('');\n}")
          fn=s[start:end]

          def one(a,b,label):
              global fn
              n=fn.count(a)
              if n!=1:
                  raise SystemExit(f"{label}: expected 1, found {n}")
              fn=fn.replace(a,b,1)

          def many(a,b,n,label):
              global fn
              c=fn.count(a)
              if c!=n:
                  raise SystemExit(f"{label}: expected {n}, found {c}")
              fn=fn.replace(a,b)

          one('class="el-report-real-site-render-16974"','class="el-report-real-site-render-16975"',"marker")

          one('<linearGradient id="elGround16971" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbe4d8"/><stop offset=".58" stop-color="#c7d5c6"/><stop offset="1" stop-color="#b9c9bb"/></linearGradient><linearGradient id="elAerialWash16972" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5df" stop-opacity=".055"/><stop offset=".34" stop-color="#5f775f" stop-opacity=".010"/><stop offset=".72" stop-color="#365344" stop-opacity=".018"/><stop offset="1" stop-color="#25463a" stop-opacity=".035"/></linearGradient><radialGradient id="elAerialVignette16972" cx="50%" cy="44%" r="72%"><stop offset="0" stop-color="#173b30" stop-opacity="0"/><stop offset=".66" stop-color="#1d4035" stop-opacity=".010"/><stop offset="1" stop-color="#13342b" stop-opacity=".04"/></radialGradient><filter id="elAerialTone16972" x="-2%" y="-2%" width="104%" height="104%"><feColorMatrix type="saturate" values="1.02" result="sat"/><feComponentTransfer in="sat"><feFuncR type="linear" slope="1.07" intercept=".035"/><feFuncG type="linear" slope="1.09" intercept=".034"/><feFuncB type="linear" slope="1.03" intercept=".030"/></feComponentTransfer></filter>',
              '<linearGradient id="elGround16971" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7eadf"/><stop offset=".58" stop-color="#d1dbcc"/><stop offset="1" stop-color="#c6d1c4"/></linearGradient><linearGradient id="elAerialWash16972" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0c9" stop-opacity=".055"/><stop offset=".42" stop-color="#6d8b70" stop-opacity=".012"/><stop offset=".78" stop-color="#2c5b4d" stop-opacity=".025"/><stop offset="1" stop-color="#153f37" stop-opacity=".045"/></linearGradient><radialGradient id="elAerialVignette16972" cx="52%" cy="46%" r="76%"><stop offset="0" stop-color="#f4f0d2" stop-opacity=".018"/><stop offset=".72" stop-color="#1a4b40" stop-opacity="0"/><stop offset="1" stop-color="#0b312a" stop-opacity=".055"/></radialGradient><filter id="elAerialTone16972" x="-2%" y="-2%" width="104%" height="104%"><feColorMatrix type="saturate" values="1.14" result="sat"/><feComponentTransfer in="sat"><feFuncR type="linear" slope="1.18" intercept=".045"/><feFuncG type="linear" slope="1.20" intercept=".045"/><feFuncB type="linear" slope="1.12" intercept=".038"/></feComponentTransfer></filter>',
              "aerial grade")

          one('<pattern id="'+aqPat+'" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><rect width="12" height="12" fill="#e89139" fill-opacity=".24"/><path d="M0 0 V12" stroke="#a94f18" stroke-width=".72" stroke-opacity=".34"/></pattern>',
              '<pattern id="'+aqPat+'" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><rect width="14" height="14" fill="#e89036" fill-opacity=".11"/><path d="M0 0 V14" stroke="#b85a1d" stroke-width=".55" stroke-opacity=".16"/></pattern>',
              "aquifer pattern")

          one('<marker id="elArrow16971" markerWidth="5.5" markerHeight="5.5" refX="4.7" refY="2.75" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L5.5 2.75 L0 5.5 Z" fill="#0a6c91" opacity=".96"/></marker>',
              '<marker id="elArrow16971" markerWidth="5" markerHeight="5" refX="4.4" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L5 2.5 L0 5 Z" fill="#77cfe5" opacity=".78"/></marker>',
              "flow arrow")

          one('fill="#e9e2d5"','fill="#f0ede6"',"board")
          one('stroke="#29483d" stroke-width="1.35"','stroke="#31584c" stroke-width="1.05"',"map frame")

          one('opacity="'+(conus?'.10':'.09')+'"','opacity="'+(conus?'.035':'.07')+'"',"contour dark")
          one('opacity="'+(conus?'.24':'.15')+'"','opacity="'+(conus?'.08':'.13')+'"',"contour light")

          one('fill="url(#'+aqPat+')" fill-rule="evenodd" stroke="#ad541b" stroke-width="1.25" opacity=".86"',
              'fill="url(#'+aqPat+')" fill-rule="evenodd" stroke="#c56724" stroke-width=".9" opacity=".56"',
              "aquifer field")
          one('stroke="#f5c276" stroke-width=".46" opacity=".78"',
              'stroke="#f0b66d" stroke-width=".38" opacity=".34"',
              "aquifer highlight")

          one('stroke="#f6fbfb" stroke-width="4.4" opacity=".46"',
              'stroke="#061722" stroke-width="3.1" opacity=".54"',
              "flow casing")
          one('stroke="#08698f" stroke-width="2.2" opacity=".96"',
              'stroke="#35b9dd" stroke-width="1.45" opacity=".90"',
              "flow line")

          one('parts.push(\'<path d="'+dp+'" fill="none" stroke="#3d6650" stroke-width="1.7" opacity=".16" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>\');\n      parts.push(\'<path d="'+dp+'" fill="none" stroke="#4f805e" stroke-width="1.15" opacity=".20" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>\');\n      parts.push(\'<path d="'+dp+'" fill="none" stroke="#2b6970" stroke-width=".58" opacity=".24" stroke-linecap="round" vector-effect="non-scaling-stroke"/>\');return}',
              'parts.push(\'<path d="'+dp+'" fill="none" stroke="#5d4026" stroke-width="3.2" opacity=".26" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>\');\n      parts.push(\'<path d="'+dp+'" fill="none" stroke="#7f943f" stroke-width="2.05" opacity=".34" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>\');\n      parts.push(\'<path d="'+dp+'" fill="none" stroke="#42b9d8" stroke-width=".78" opacity=".42" stroke-linecap="round" vector-effect="non-scaling-stroke"/>\');return}',
              "B property style")

          one('parts.push(\'<path d="'+dp+'" fill="none" stroke="#15362d" stroke-width="5.6" opacity=".38" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>\');\n    parts.push(\'<path d="'+dp+'" fill="none" stroke="#4f8a5f" stroke-width="3.3" opacity=".58" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>\');\n    parts.push(\'<path d="'+dp+'" fill="none" stroke="#0a6176" stroke-width="1.75" opacity=".97" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>\');\n    parts.push(\'<path d="'+dp+'" transform="translate(-1.25 -1.25)" fill="none" stroke="#72cfe1" stroke-width=".54" opacity=".34" stroke-dasharray="1.2 3.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>\');\n    parts.push(\'<path d="'+dp+'" transform="translate(1.25 1.25)" fill="none" stroke="#72cfe1" stroke-width=".54" opacity=".34" stroke-dasharray="1.2 3.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>\');',
              'parts.push(\'<path d="'+dp+'" fill="none" stroke="#5d4026" stroke-width="6.1" opacity=".78" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>\');\n    parts.push(\'<path d="'+dp+'" fill="none" stroke="#4f9e4b" stroke-width="4.25" opacity=".93" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>\');\n    parts.push(\'<path d="'+dp+'" fill="none" stroke="#8fc260" stroke-width="2.15" opacity=".76" stroke-dasharray=".15 4.7" stroke-linecap="round" vector-effect="non-scaling-stroke"/>\');\n    parts.push(\'<path d="'+dp+'" fill="none" stroke="#42b9d8" stroke-width="1.48" opacity=".96" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>\');\n    parts.push(\'<path d="'+dp+'" transform="translate(-1.05 -1.05)" fill="none" stroke="#79d5e8" stroke-width=".58" opacity=".88" stroke-dasharray="1 3.1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>\');\n    parts.push(\'<path d="'+dp+'" transform="translate(1.05 1.05)" fill="none" stroke="#79d5e8" stroke-width=".58" opacity=".88" stroke-dasharray="1 3.1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>\');',
              "A property luxe")

          one('r="9.4" fill="#173f2f" fill-opacity=".94" stroke="#fff8e9" stroke-width=".9"',
              'r="8.2" fill="#15362d" fill-opacity=".88" stroke="#d9ead7" stroke-width=".7"',
              "A label bubble")

          one('width="250" height="112" rx="5" fill="#fffef9" fill-opacity=".80" stroke="#aeb8b0" stroke-width=".7"',
              'width="238" height="104" rx="8" fill="#f8f5eb" fill-opacity=".76" stroke="#8aa197" stroke-width=".55"',
              "legend panel")
          one('x="235"','x="223"',"legend rule")
          one('stroke="#8dbd82" stroke-width="10" opacity=".88"',
              'stroke="#5d4026" stroke-width="6.1" opacity=".78"',
              "legend A soil")
          one('stroke="#224d31" stroke-width="1.5"',
              'stroke="#4f9e4b" stroke-width="4.25"',
              "legend A plant")
          one('stroke="#b7caa8" stroke-width="5" opacity=".8"',
              'stroke="#7f943f" stroke-width="2.05" opacity=".5"',
              "legend B")
          one('stroke="#496d4b" stroke-width="1"',
              'stroke="#42b9d8" stroke-width=".78" opacity=".55"',
              "legend B water")

          out=s[:start]+fn+s[end:]
          if out.count("el-report-real-site-render-16975")!=1:
              raise SystemExit("16975 marker validation failed")
          if "el-report-real-site-render-16974" in out:
              raise SystemExit("16974 marker remains")
          p.write_text(out,encoding="utf-8")
          PY
          git config user.name "Earthline Build Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "style: decisive property-language report map 16975"
          git push origin HEAD:pages-live
