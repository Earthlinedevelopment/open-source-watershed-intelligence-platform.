name: Earthline Report Visual Trace 17613
on:
  push:
    branches: [diag/release-17606-source]
    paths:
      - '.github/workflows/earthline-report-visual-trace-17613.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Trace report visual helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ["function mapSvg","function gradeChart","function corridorTable","function corridorSummary","function reportData","function swales()","function contours()","function flows()"]:
            i=s.find(needle)
            if i<0: continue
            line=s.count("\n",0,i)+1
            print("\n### "+needle+f" LINE {line}")
            print(s[max(0,i-1200):min(len(s),i+9500)].replace("\n"," "))
          PY
