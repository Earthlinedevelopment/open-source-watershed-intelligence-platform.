name: Earthline Cold Elder Gate 17384
on:
  push:
    branches: [repair/property-clean-run-17383]
    paths:
      - 'earthline-launch-16872.js'
      - 'earthline-elder-worker-17129.js'
      - 'tools/elder_trees/chmv2_array_detector_17129.py'
      - 'tests/elder-cold-property-17384.mjs'
      - '.github/workflows/earthline-elder-cold-17384.yml'
permissions: {contents: read}
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/property-clean-run-17383}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          python3 tests/apply-browser-yield-fastpath-17295.py
          python3 tests/apply-wasm-pip-kernel-17319.py
          python3 tests/apply-certified-interior-supertile-17301.py
          python3 tests/apply-skip-regional-preferred-screen-17305.py
          python3 tests/apply-run-scoped-segment-clip-cache-17315.py
          python3 tests/apply-consolidated-provisional-jurisdiction-17325.py
          python3 tests/apply-land-validity-scanline-17352.py
          python3 tests/apply-vermont-cors-first-17360.py
          python3 tests/apply-regional-screen-reuse-17365.py
          python3 tests/apply-telemetry-origin-guard-17368.py
          python3 tests/apply-jurisdiction-edge-fastpath-17373.py
          python3 tests/apply-fast-pip-row-index-17378.py
          python3 tests/apply-fast-pip-geometry-cache-17379.py
          python3 tests/apply-property-clean-run-17383.py
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: |
          if [ '${{ matrix.browser }}' = 'firefox' ]; then
            xvfb-run -a env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='firefox' HEADLESS='false' node tests/elder-cold-property-17384.mjs
          else
            env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='chromium' HEADLESS='true' node tests/elder-cold-property-17384.mjs
          fi
  webkit:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/property-clean-run-17383}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          python3 tests/apply-browser-yield-fastpath-17295.py
          python3 tests/apply-wasm-pip-kernel-17319.py
          python3 tests/apply-certified-interior-supertile-17301.py
          python3 tests/apply-skip-regional-preferred-screen-17305.py
          python3 tests/apply-run-scoped-segment-clip-cache-17315.py
          python3 tests/apply-consolidated-provisional-jurisdiction-17325.py
          python3 tests/apply-land-validity-scanline-17352.py
          python3 tests/apply-vermont-cors-first-17360.py
          python3 tests/apply-regional-screen-reuse-17365.py
          python3 tests/apply-telemetry-origin-guard-17368.py
          python3 tests/apply-jurisdiction-edge-fastpath-17373.py
          python3 tests/apply-fast-pip-row-index-17378.py
          python3 tests/apply-fast-pip-geometry-cache-17379.py
          python3 tests/apply-property-clean-run-17383.py
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - run: |
          python3 -m http.server 8787 --bind 0.0.0.0 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='webkit' HEADLESS='false' node tests/elder-cold-property-17384.mjs
