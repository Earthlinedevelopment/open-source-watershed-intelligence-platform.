name: Earthline Frozen Safety Repair
on:
  push:
    branches:
      - recovery/mantra74-stability
    paths:
      - .earthline-frozen-safety-repair-trigger
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          fetch-depth: 0
      - name: Apply shared frozen-mask repair
        run: python3 tools/earthline-frozen-safety-repair.py
      - name: Validate scripts
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw new Error('inline script '+i+': '+e.message)}
          }
          if(!s.includes('EARTHLINE 17710 — shared frozen-mask pre-publication safety filter'))throw new Error('17710 marker missing');
          console.log('EARTHLINE_17710_PARSE_OK',parsed);
          NODE
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Earthline Stability Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "safety: remove frozen-mask corridor conflicts before publication"
          git push origin HEAD:recovery/mantra74-stability
