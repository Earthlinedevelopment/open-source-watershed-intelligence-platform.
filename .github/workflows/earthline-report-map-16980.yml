name: Earthline funder-aligned report 16980
on:
  push:
    branches:
      - pages-live
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Install funder-aligned report map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          a=s.index("function mapSvg(d,small=false){")
          b=s.index("  return parts.join('');\n}",a)+len("  return parts.join('');\n}")
          fn="function mapSvg(d,small=false){\n  const W=1100,H=small?470:620,mapX=28,mapY=28,mapW=W-56,mapH=H-56;\n  const tier=String(d?.tier||d?.mode||d?.extentClass||'').toLowerCase();\n  const isProperty=tier.includes('property');\n  const lineFeatures=fc=>fc&&fc.type==='FeatureCollection'&&Array.isArray(fc.features)?fc.features.filter(f=>f?.geometry?.type==='LineString'):[];\n  const propSwales=(typeof M!=='undefined')?lineFeatures(M.authoritativeSafeSwales15815):[];\n  const propFlows=(typeof M!=='undefined')?lineFeatures(M.authoritativeWaterPaths15824):[];\n  const mapSwales=isProperty?propSwales:swales().filter(f=>f?.geometry?.type==='LineString');\n  const mapFlows=isProperty?propFlows:flows().filter(f=>f?.geometry?.type==='LineString');\n  const mapContours=isProperty?[]:contours().filter(f=>f?.geometry?.type==='LineString').slice(0,120);\n  const aquiferFeatures=reportAquifers();\n\n  let b;\n  if(isProperty&&d?.center&&Number.isFinite(+d.center.lng)&&Number.isFinite(+d.center.lat)){\n    const lat=+d.center.lat,lng=+d.center.lng,acres=Math.max(2,+d.acres||20);\n    const areaM2=acres*4046.8564224,baseW=Math.sqrt(areaM2*1.15),baseH=areaM2/baseW;\n    const pad=1.32,halfW=baseW*pad/2,halfH=baseH*pad/2;\n    const dy=halfH/111320,dx=halfW/(111320*Math.max(.2,Math.cos(lat*Math.PI/180)));\n    b=[lng-dx,lat-dy,lng+dx,lat+dy];\n  }else{\n    b=reportBounds(d);\n  }\n\n  const midLat=(b[1]+b[3])/2,cosLat=Math.max(.2,Math.cos(midLat*Math.PI/180));\n  let cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2,dxDeg=Math.max(.000001,b[2]-b[0]),dyDeg=Math.max(.000001,b[3]-b[1]);\n  const target=mapW/mapH,current=(dxDeg*cosLat)/dyDeg;\n  if(current<target)dxDeg=(dyDeg*target)/cosLat;else dyDeg=(dxDeg*cosLat)/target;\n  b=[cx-dxDeg/2,cy-dyDeg/2,cx+dxDeg/2,cy+dyDeg/2];\n\n  const xSpan=b[2]-b[0],ySpan=b[3]-b[1];\n  const sx=x=>mapX+(x-b[0])/xSpan*mapW,sy=y=>mapY+mapH-(y-b[1])/ySpan*mapH;\n  const pathCoords=coords=>(coords||[]).map((q,i)=>(i?'L':'M')+sx(+q[0]).toFixed(1)+' '+sy(+q[1]).toFixed(1)).join(' ');\n  const path=f=>pathCoords(f?.geometry?.coordinates||[]);\n  const mid=f=>{const a=f?.geometry?.coordinates||[];return a.length?a[Math.floor((a.length-1)/2)]:null};\n  const slen=f=>{const a=f?.geometry?.coordinates||[];let L=0;for(let i=1;i<a.length;i++)L+=Math.hypot(sx(+a[i][0])-sx(+a[i-1][0]),sy(+a[i][1])-sy(+a[i-1][1]));return L};\n\n  const flowRank=mapFlows.map(f=>({f,rank:Number(f?.properties?.accumulation||0)*1000+Number(f?.properties?.strength||0)*100+slen(f)})).sort((a,b)=>b.rank-a.rank);\n  const principal=flowRank.slice(0,Math.min(3,flowRank.length));\n  const priority=mapSwales.slice(0,Math.min(isProperty?6:5,mapSwales.length));\n\n  const kmWide=Math.max(.001,xSpan*111.32*cosLat),mWide=kmWide*1000;\n  const candidates=[50,100,200,500,1000,2000,5000,10000,20000,50000,100000];\n  let niceM=candidates[0];for(const c of candidates){if(c<=mWide*.24)niceM=c;else break}\n  const barPx=Math.max(48,Math.min(180,niceM/mWide*mapW));\n  const barLabel=niceM>=1000?(niceM/1000)+' km':niceM+' m';\n\n  const clipId='elClip16980',arrowId='elArrow16980',parts=[];\n  parts.push('<svg class=\"el-report-funder-plan-16980\" viewBox=\"0 0 '+W+' '+H+'\" role=\"img\" aria-label=\"Earthline hydrology and recharge opportunity plan\">');\n  parts.push('<defs><clipPath id=\"'+clipId+'\"><rect x=\"'+mapX+'\" y=\"'+mapY+'\" width=\"'+mapW+'\" height=\"'+mapH+'\" rx=\"5\"/></clipPath><marker id=\"'+arrowId+'\" markerWidth=\"5\" markerHeight=\"5\" refX=\"4.4\" refY=\"2.5\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0 0 L5 2.5 L0 5 Z\" fill=\"#2f7f9b\"/></marker></defs>');\n  parts.push('<rect width=\"'+W+'\" height=\"'+H+'\" fill=\"#ffffff\"/><rect x=\"'+mapX+'\" y=\"'+mapY+'\" width=\"'+mapW+'\" height=\"'+mapH+'\" rx=\"5\" fill=\"#f7f7f3\" stroke=\"#c9cfcb\" stroke-width=\"1\"/>');\n  parts.push('<g clip-path=\"url(#'+clipId+')\">');\n\n  if(!isProperty){\n    for(let i=0;i<mapContours.length;i+=12){const dp=path(mapContours[i]);if(dp)parts.push('<path d=\"'+dp+'\" fill=\"none\" stroke=\"#c9c7c0\" stroke-width=\".45\" opacity=\".26\" vector-effect=\"non-scaling-stroke\"/>')}\n  }\n\n  for(const f of aquiferFeatures){\n    const g=f&&f.geometry;if(!g)continue;\n    const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];\n    for(const poly of polys){\n      const rings=poly.filter(r=>Array.isArray(r)&&r.length>=3);if(!rings.length)continue;\n      const dp=rings.map(r=>pathCoords(r)+' Z').join(' ');\n      parts.push('<path d=\"'+dp+'\" fill=\"#e5a35e\" fill-opacity=\".12\" fill-rule=\"evenodd\" stroke=\"#c98342\" stroke-width=\".45\" stroke-opacity=\".34\" vector-effect=\"non-scaling-stroke\"/>');\n    }\n  }\n\n  let fi=0;\n  for(const row of principal){\n    const dp=path(row.f);if(!dp)continue;\n    parts.push('<path d=\"'+dp+'\" fill=\"none\" stroke=\"#d8eaef\" stroke-width=\"3.0\" opacity=\".88\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/>');\n    parts.push('<path d=\"'+dp+'\" fill=\"none\" stroke=\"#2f7f9b\" stroke-width=\"1.35\" opacity=\".98\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"'+(fi++<2?' marker-end=\"url(#'+arrowId+')\"':'')+'/>');\n  }\n\n  for(const f of priority){\n    const dp=path(f);if(!dp)continue;\n    parts.push('<path d=\"'+dp+'\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"4.5\" opacity=\".96\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/>');\n    parts.push('<path d=\"'+dp+'\" fill=\"none\" stroke=\"#3d724b\" stroke-width=\"2.65\" opacity=\".98\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/>');\n    parts.push('<path d=\"'+dp+'\" fill=\"none\" stroke=\"#86ad77\" stroke-width=\"1.15\" opacity=\".96\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/>');\n  }\n\n  for(let i=0;i<Math.min(3,priority.length);i++){\n    const q=mid(priority[i]);if(!q)continue;const x=sx(+q[0]),y=sy(+q[1]);\n    parts.push('<g><circle cx=\"'+x.toFixed(1)+'\" cy=\"'+y.toFixed(1)+'\" r=\"7\" fill=\"#ffffff\" stroke=\"#3d724b\" stroke-width=\"1.2\"/><text x=\"'+x.toFixed(1)+'\" y=\"'+(y+2.1).toFixed(1)+'\" text-anchor=\"middle\" fill=\"#315d3e\" font-family=\"Noto Sans,Arial,sans-serif\" font-size=\"6.2\" font-weight=\"800\">'+(i+1)+'</text></g>');\n  }\n  parts.push('</g>');\n\n  const lx=mapX+16,ly=mapY+16;\n  parts.push('<g transform=\"translate('+lx+','+ly+')\"><rect width=\"205\" height=\"78\" rx=\"4\" fill=\"#ffffff\" fill-opacity=\".96\" stroke=\"#d2d6d2\" stroke-width=\".6\"/><text x=\"12\" y=\"18\" fill=\"#203c35\" font-family=\"Noto Sans,Arial,sans-serif\" font-size=\"7.6\" font-weight=\"850\" letter-spacing=\".7\">RECHARGE OPPORTUNITY PLAN</text><path d=\"M12 26 H193\" stroke=\"#5aa5bd\" stroke-width=\".9\"/><path d=\"M13 40 H37\" stroke=\"#3d724b\" stroke-width=\"2.6\"/><path d=\"M13 40 H37\" stroke=\"#86ad77\" stroke-width=\"1.1\"/><text x=\"45\" y=\"43\" fill=\"#4c5e56\" font-family=\"Noto Sans,Arial,sans-serif\" font-size=\"5.8\">Priority bioswale</text><path d=\"M111 40 H135\" stroke=\"#2f7f9b\" stroke-width=\"1.3\"/><text x=\"143\" y=\"43\" fill=\"#4c5e56\" font-family=\"Noto Sans,Arial,sans-serif\" font-size=\"5.8\">Water path</text><rect x=\"13\" y=\"53\" width=\"22\" height=\"8\" fill=\"#e5a35e\" fill-opacity=\".20\" stroke=\"#c98342\" stroke-width=\".45\"/><text x=\"45\" y=\"60\" fill=\"#4c5e56\" font-family=\"Noto Sans,Arial,sans-serif\" font-size=\"5.8\">Mapped aquifer context</text><text x=\"12\" y=\"72\" fill=\"#7b857f\" font-family=\"Noto Sans,Arial,sans-serif\" font-size=\"4.8\">Earthline Screening Method v1.0 · displayed-run geometry</text></g>');\n\n  parts.push('<g transform=\"translate('+(mapX+16)+','+(mapY+mapH-18)+')\"><path d=\"M0 0 H'+barPx+'\" stroke=\"#31453e\" stroke-width=\"1.1\"/><path d=\"M0 -3 V3 M'+barPx+' -3 V3\" stroke=\"#31453e\" stroke-width=\".8\"/><text x=\"'+(barPx/2)+'\" y=\"12\" text-anchor=\"middle\" fill=\"#53625c\" font-family=\"Noto Sans,Arial,sans-serif\" font-size=\"5.8\" font-weight=\"700\">'+barLabel+'</text></g>');\n  parts.push('<g transform=\"translate('+(mapX+mapW-34)+','+(mapY+17)+')\"><text x=\"8\" y=\"7\" text-anchor=\"middle\" fill=\"#2d4740\" font-family=\"Noto Sans,Arial,sans-serif\" font-size=\"7\" font-weight=\"850\">N</text><path d=\"M8 12 V34\" stroke=\"#2d4740\" stroke-width=\"1\"/><path d=\"M8 12 L4 20 L8 17 L12 20 Z\" fill=\"#2d4740\"/></g>');\n  parts.push('</svg>');\n  return parts.join('');\n}"
          s=s[:a]+fn+s[b:]
          old="Figure 1. Hydrology and bioswale opportunity plan generated from the frozen published geometry for this run. Fine green, olive, and earth-toned lines show graded bioswale-opportunity corridors; blue hierarchy shows primary and secondary modeled surface-water movement; translucent orange fields show mapped aquifer context; contours and elevation labels describe landform. Screening only; field verification is required before design."
          new="Figure 1. Earthline engine output for the recorded analysis extent. Green lines show priority bioswale opportunities, blue lines show modeled surface-water paths, and pale orange areas show mapped aquifer context. Screening only; field verification is required before design."
          if old in s:s=s.replace(old,new,1)
          if "el-report-funder-plan-16980" not in s:raise SystemExit("16980 marker missing")
          p.write_text(s,encoding="utf-8")
          PY
          git config user.name "Earthline Build Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "style: funder-aligned property-scale report plan 16980"
          git push origin HEAD:pages-live
