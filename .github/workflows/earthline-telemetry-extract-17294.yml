name: Earthline Telemetry Extract 17294
on:
  push:
    branches: [diag/telemetry-17294]
    paths:
      - '.github/workflows/earthline-telemetry-extract-17294.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/telemetry-17294
      - name: Extract telemetry owners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needles=['earthline-telemetry','ccucaqwbdsskcwxxbqiz','telemetry','supabase.co/functions/v1']
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              try: s=p.read_text(encoding='utf-8',errors='ignore')
              except Exception: continue
              low=s.lower()
              for needle in needles:
                  start=0
                  while True:
                      i=low.find(needle.lower(),start)
                      if i<0: break
                      print('\n===== '+str(p)+' :: '+needle+' @ '+str(i)+' =====')
                      print(s[max(0,i-5000):i+10000])
                      start=i+len(needle)
          PY
