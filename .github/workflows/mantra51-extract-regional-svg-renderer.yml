name: Mantra 51 Extract Regional SVG Renderer
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths: ['.github/workflows/mantra51-extract-regional-svg-renderer.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needle="earthlineRegionalVectorOverlay16020"
          pos=0; n=0
          while n<12:
            i=s.find(needle,pos)
            if i<0: break
            print("\n===== HIT",n+1,"=====\n")
            print(s[max(0,i-8000):min(len(s),i+18000)])
            pos=i+len(needle); n+=1
          PY
