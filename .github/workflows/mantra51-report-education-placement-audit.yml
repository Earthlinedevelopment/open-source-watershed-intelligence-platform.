name: Mantra 51 Report Education Placement Audit
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-report-education-placement-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='ignore')
          needles=['howBioswalesReportPages16388(data)','EARTHLINE_CORRECTIONS_REGISTRY_16513','How Bioswales Work ·','Comparable Systems and Precedents','Conclusions and Recommended Next Step','finalSourcesPage16864(data)']
          for needle in needles:
            print('\n###',needle)
            start=0
            for _ in range(8):
              i=s.find(needle,start)
              if i<0: break
              print('POS',i)
              print(s[max(0,i-1800):min(len(s),i+3500)].replace('\n',' ')[:5300])
              start=i+len(needle)
          PY
