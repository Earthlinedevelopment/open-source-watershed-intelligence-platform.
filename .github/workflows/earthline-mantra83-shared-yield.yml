name: Mantra 83 Shared Yield
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - 'tests/mantra83-fix-shared-yield.mjs'
      - 'tests/mantra83-shared-yield.mjs'
      - '.github/workflows/earthline-mantra83-shared-yield.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright
      - run: npx playwright install webkit
      - run: node tests/mantra83-shared-yield.mjs
