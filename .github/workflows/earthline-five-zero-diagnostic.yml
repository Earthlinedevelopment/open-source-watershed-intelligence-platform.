# rerun exact 17802
# rerun 17801
name: Earthline Five Zero-Corridor Diagnostics
'on':
  push:
    branches: [candidate-next]
    paths:
      - tests/property-five-zero-diagnostic.mjs
      - .github/workflows/earthline-five-zero-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        state: [Colorado, California, Arkansas, Texas]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Zero diagnostic — ${{ matrix.state }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve candidate
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Diagnose patched candidate origin
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          EARTHLINE_CANDIDATE_ORIGIN: '1'
          STATES: ${{ matrix.state }}
          OUT: diag.json
        run: node tests/property-five-zero-diagnostic.mjs
