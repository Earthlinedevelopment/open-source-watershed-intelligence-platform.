name: Earthline M76 Property Terminal Repair
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-terminal-owner-live.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Clear Property Orb on failed terminal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="if(a&&a.scientificSettled===true)stopPropertyOrb16244();\n      else if(propertyOrbSawRunning16244&&propertyState==='idle'&&a&&a.settled===true)stopPropertyOrb16244();"
          new="if(a&&a.scientificSettled===true)stopPropertyOrb16244();\n      else if(a&&a.settled===true&&a.result===false)stopPropertyOrb16244();\n      else if(propertyOrbSawRunning16244&&propertyState==='idle'&&a&&a.settled===true)stopPropertyOrb16244();"
          assert s.count(old)==1, f'property terminal owner count {s.count(old)}'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and publish
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "a&&a.settled===true&&a.result===false" index.html
          node -e "const fs=require('fs'),s=fs.readFileSync('index.html','utf8');for(const m of s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)){if(m[1].trim())new Function(m[1])}"
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: clear Property Orb on failed terminal"
          git push origin HEAD:pages-live
