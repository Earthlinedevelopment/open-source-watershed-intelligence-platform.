name: Earthline M76 Regional Terminal Owner Live
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-terminal-owner-live.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Patch authoritative Regional terminal owner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="    if(terminal16537==='published'){\\n      try{window.earthlineRestoreUi16488&&window.earthlineRestoreUi16488.syncGauge&&window.earthlineRestoreUi16488.syncGauge()}catch(_){ }\\n    }\\n    return terminal16537;"
          new="    if(terminal16537==='published'){\\n      try{window.earthlineRestoreUi16488&&window.earthlineRestoreUi16488.syncGauge&&window.earthlineRestoreUi16488.syncGauge()}catch(_){ }\\n    }\\n    try{setBusy(false,'RUN ANALYSIS')}catch(_){ }\\n    try{if(typeof window.earthlineStopRegionalOrb16244==='function')window.earthlineStopRegionalOrb16244()}catch(_){ }\\n    return terminal16537;"
          assert s.count(old)==1, f'terminal owner count {s.count(old)}'
          s=s.replace(old,new,1)
          old2="  function stopRegionalOrb16244(){regionalOrbLatched16244=false;regionalRequested16233=false;regionalOrbToken16244='';regionalOrbPriorToken16244='';regionalOrbStartedAt16244=0;document.documentElement.classList.remove('earthline-regional-orb-latched-16244','earthline-regional-running-16233')}"
          new2=old2+"\\n  window.earthlineStopRegionalOrb16244=stopRegionalOrb16244;"
          assert s.count(old2)==1, f'orb stop owner count {s.count(old2)}'
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and publish
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "window.earthlineStopRegionalOrb16244=stopRegionalOrb16244" index.html
          grep -Fq "window.earthlineStopRegionalOrb16244()" index.html
          node -e "const fs=require('fs'),s=fs.readFileSync('index.html','utf8');for(const m of s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)){if(m[1].trim())new Function(m[1])}"
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: clear Regional Orb in authoritative terminal owner"
          git push origin HEAD:pages-live
