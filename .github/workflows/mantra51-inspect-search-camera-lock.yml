name: Mantra 51 Inspect Search Camera Lock
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-inspect-search-camera-lock.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Inspect camera lock owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needle="earthlineApplySearchCameraLock"
          pos=0
          while True:
            i=s.find(needle,pos)
            if i<0: break
            print("\n===== HIT =====\n")
            print(s[max(0,i-3500):min(len(s),i+9000)])
            pos=i+len(needle)
          PY
