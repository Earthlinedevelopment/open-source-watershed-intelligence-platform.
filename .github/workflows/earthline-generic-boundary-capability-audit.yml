name: Earthline Property Input Owner Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.github/workflows/earthline-generic-boundary-capability-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          grep -n -A80 -B35 "earthlineActivateProperty17494" index.html || true
          grep -n -A35 -B20 "earthlineDeclareProperty16169" index.html | grep -E "onpointer|onclick|ActivateProperty|DeclareProperty|addEventListener" || true
