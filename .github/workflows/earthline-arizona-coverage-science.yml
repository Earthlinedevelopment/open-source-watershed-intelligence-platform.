name: Earthline Arizona Coverage Science
on:
  push:
    branches: [science-coverage-recovery]
    paths:
      - 'tests/arizona-coverage-science.mjs'
      - 'tests/apply-property-minimum-length-science.py'
      - 'tests/apply-property-component-science.py'
      - '.github/workflows/earthline-arizona-coverage-science.yml'
# minimum-length consistency run
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: science-coverage-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Evaluate complete Property coverage science locally
        run: |
          python3 tests/apply-property-component-science.py index.html
          python3 tests/apply-property-minimum-length-science.py index.html
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Exact Arizona screenshot controls
        run: env EARTHLINE_URL='https://earthlinedevelopment.org/' EARTHLINE_CANDIDATE_ORIGIN='1' node tests/arizona-coverage-science.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arizona-coverage-science
          path: /tmp/earthline-arizona-coverage-science.png
          if-no-files-found: warn
