name: Earthline Arizona Coverage Science
on:
  push:
    branches: [science-coverage-recovery]
    paths:
      - 'tests/arizona-coverage-science.mjs'
      - '.github/workflows/earthline-arizona-coverage-science.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: science-coverage-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Evaluate Property contour component science locally
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          if s.count("const stride=regional?4:2") != 2:
              raise SystemExit("unexpected seed stride owner count")
          s=s.replace("const stride=regional?4:2","const stride=regional?4:1")
          old='''    found.sort((a,b)=>
      b.flowCrossingValue-a.flowCrossingValue||
      b.legacyQuality-a.legacyQuality||
      b.accumulation-a.accumulation||
      a.y-b.y||a.x-b.x
    );
    const out=[];
    for(const c of found){
      if(out.every(s=>Math.hypot(c.x-s.x,c.y-s.y)>(regional?18:24)))out.push(c);
      if(out.length>=maxSeeds)break;
    }
'''
          new='''    found.sort((a,b)=>
      b.flowCrossingValue-a.flowCrossingValue||
      b.legacyQuality-a.legacyQuality||
      b.accumulation-a.accumulation||
      a.y-b.y||a.x-b.x
    );
    const out=[];
    if(regional){
      for(const c of found){
        if(out.every(s=>Math.hypot(c.x-s.x,c.y-s.y)>18))out.push(c);
        if(out.length>=maxSeeds)break;
      }
    }else{
      const byCell=new Map(found.map(c=>[c.x+","+c.y,c]));
      const seen=new Set();
      for(const c of found){
        const key=c.x+","+c.y;
        if(seen.has(key))continue;
        out.push(c);
        const queue=[c];seen.add(key);
        for(let qi=0;qi<queue.length;qi++){
          const q=queue[qi];
          for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
            if(!dx&&!dy)continue;
            const nk=(q.x+dx)+","+(q.y+dy);
            if(seen.has(nk))continue;
            const n=byCell.get(nk);
            if(n){seen.add(nk);queue.push(n);}
          }
        }
        if(out.length>=maxSeeds)break;
      }
      M.propertyContourComponentSeedAudit={
        build:"EARTHLINE PROPERTY <=4% COMPONENT COVERAGE",
        level:Number(L),eligibleCrossingCells:found.length,
        selectedComponents:out.length,maxSeeds,at:new Date().toISOString()
      };
    }
'''
          if s.count(old) != 1:
              raise SystemExit("canonical seed selection block not found exactly")
          p.write_text(s.replace(old,new),encoding="utf-8")
          PY
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          console.log('LOCAL_SCIENCE_PARSE_OK',parsed);
          NODE
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Exact Arizona screenshot controls
        run: env EARTHLINE_URL='https://earthlinedevelopment.org/' EARTHLINE_CANDIDATE_ORIGIN='1' node tests/arizona-coverage-science.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arizona-coverage-science
          path: /tmp/earthline-arizona-coverage-science.png
          if-no-files-found: warn
