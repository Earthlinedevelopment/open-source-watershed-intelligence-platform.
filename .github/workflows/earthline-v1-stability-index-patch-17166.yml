name: Earthline V1 Immediate Property Frame 17185
on:
  push:
    branches: [repair/v1-stability-17166]
    paths:
      - '.github/workflows/earthline-v1-stability-index-patch-17166.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-stability-17166
          fetch-depth: 0
      - name: Make existing Property frame immediate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8',errors='strict')
          marker='EARTHLINE_PROPERTY_FRAME_IMMEDIATE_17185'
          old="mp.fitBounds(bounds,{padding:{top:92,right:92,bottom:92,left:92},duration:850,maxZoom:19.1});"
          new="mp.fitBounds(bounds,{padding:{top:92,right:92,bottom:92,left:92},duration:0,maxZoom:19.1}); /* EARTHLINE_PROPERTY_FRAME_IMMEDIATE_17185 */"
          if marker not in s:
              if s.count(old)!=1:
                  raise SystemExit('Expected one Property fitBounds owner, found '+str(s.count(old)))
              s=s.replace(old,new,1)
          if s.count(marker)!=1:
              raise SystemExit('Immediate Property frame marker count invalid')
          p.write_text(s,encoding='utf-8')
          print('V1 immediate Property frame patch PASS')
          PY
          git diff --check
          test "$(git diff --name-only)" = "index.html"
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name "earthline-release-bot"
          git config user.email "earthline-release-bot@users.noreply.github.com"
          git add index.html
          git commit -m "repair: frame Property immediately for first-paint stability 17185"
          git pull --rebase origin repair/v1-stability-17166
          git push origin HEAD:repair/v1-stability-17166
