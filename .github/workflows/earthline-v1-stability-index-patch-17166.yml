name: Earthline V1 Corridor Identity Repair 17190
on:
  push:
    branches: [repair/v1-stability-17166]
    paths:
      - '.github/workflows/earthline-v1-stability-index-patch-17166.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-stability-17166
          fetch-depth: 0
      - name: Bind corridor selection to the rendered feature identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8',errors='strict')
          marker='EARTHLINE_CORRIDOR_RENDERED_IDENTITY_17190'
          old="""if(!f)return false;const rows=graded(),row=rows.find(x=>x.f===f)||rows[index]||{p:f.properties||{},grade:'C',rank:index+1,code:'C'+(index+1),score:0,km:lineLengthKm(f.geometry?.coordinates||[])};const p=row.p||{},slope="""
          new="""if(!f)return false;const rows=graded(),fp=f.properties||{},fg=/^[ABC]$/.test(String(fp.grade||''))?String(fp.grade):'C',fr=Math.max(1,Number(fp.display_rank||fp.rank||index+1)),fc=String(fp.display_code||'').trim()||(fg+fr),row=rows.find(x=>x.f===f)||{p:Object.assign({},fp,{display_rank:fr,display_code:fc}),grade:fg,rank:fr,code:fc,score:Math.round(Number(fp.score||0)),km:lineLengthKm(f.geometry?.coordinates||[]),index:Number(index||0),identityOwner:'EARTHLINE_CORRIDOR_RENDERED_IDENTITY_17190'};const p=row.p||{},slope="""
          if marker not in s:
              if s.count(old)!=1:
                  raise SystemExit('Expected one corridor row resolver, found '+str(s.count(old)))
              s=s.replace(old,new,1)
          if s.count(marker)!=1:
              raise SystemExit('17190 marker count invalid: '+str(s.count(marker)))
          p.write_text(s,encoding='utf-8')
          print('V1 rendered corridor identity patch PASS')
          PY
          git diff --check
          test "$(git diff --name-only)" = "index.html"
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name "earthline-release-bot"
          git config user.email "earthline-release-bot@users.noreply.github.com"
          git add index.html
          git commit -m "repair: bind corridor click to rendered identity 17190"
          git pull --rebase origin repair/v1-stability-17166
          git push origin HEAD:repair/v1-stability-17166
