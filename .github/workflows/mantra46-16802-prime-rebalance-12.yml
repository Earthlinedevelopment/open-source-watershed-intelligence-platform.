name: Mantra 46 16802 Difficult-State Regression

on:
  push:
    branches:
      - diagnostic-m46-16802-prime-rebalance
    paths:
      - 'tests/mantra46-16802-prime-rebalance-12.mjs'
      - '.github/workflows/mantra46-16802-prime-rebalance-12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run difficult-state 16802 regression
        run: node tests/mantra46-16802-prime-rebalance-12.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16802-prime-rebalance-12
          path: artifacts/mantra46-16802-prime-rebalance-12/
          if-no-files-found: error
