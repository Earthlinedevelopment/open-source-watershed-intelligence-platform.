name: Mantra 83 27 State Fast
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - 'tests/mantra83-27-state-fast.mjs'
      - '.github/workflows/earthline-mantra83-27-state-fast.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save playwright
      - run: node tests/mantra83-27-state-fast.mjs
