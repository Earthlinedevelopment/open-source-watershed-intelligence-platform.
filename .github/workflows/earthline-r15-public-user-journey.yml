name: Earthline R15 REAL public site Chrome Safari NY Property twice
on:
  push:
    branches: [test/r15-live-ny-real-user-20261122]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        profile: [chrome, safari]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm LIVE immutable exact R15 release assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 35 "https://earthlinedevelopment.org/?r15_live_browsertest=20261122" -o /tmp/r15-live-page
          curl -fsSL --max-time 20 "https://earthlinedevelopment.org/earthline-usfs-canopy-r15.js?v=a3c8a3db" -o /tmp/r15-live-canopy
          test "$(sha256sum /tmp/r15-live-page | cut -d' ' -f1)" = "e0171632f433e40d1f820f7bf6e8a6cd0c4e15ca03d2f1c4dd07097acf863787"
          test "$(sha256sum /tmp/r15-live-canopy | cut -d' ' -f1)" = "a3c8a3dba1060387fa1bc66ee240917cbd7e35689dd7fa75a9bcd9fed5088df7"
      - name: Install actual browsers
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Run actual New York state search physical drag and Property twice on PUBLIC site
        env:
          EARTHLINE_PROFILE: ${{ matrix.profile }}
          EARTHLINE_LIVE: '1'
        run: node tests/r15-public-real-ny-property.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r15-public-ny-${{ matrix.profile }}
          path: founder-regression/${{ matrix.profile }}/
          retention-days: 7
