name: Earthline Candidate Property Integrity Repair 17019
on:
  push:
    branches: [candidate-property-integrity-17019]
    paths:
      - 'tools/apply-property-integrity-17019.py'
      - '.github/workflows/apply-property-integrity-17019.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-property-integrity-17019
          fetch-depth: 0
      - run: python3 tools/apply-property-integrity-17019.py
      - run: git diff --check
      - name: Static assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'baseRegionalCapacity16755=focusMode?52:' in s
          assert 'regionalCapacity16755=focusMode?52:' in s
          assert 'primarySpacing=focusMode?Math.max(6' in s
          assert 'focusMode?Math.max(4,Math.round(primarySpacing*.72))' in s
          assert 'acquisitionResult==="screened-clear"' in s
          assert "build:'EARTHLINE 17019'" in s
          assert "displayedToken16347===liveToken16347" not in s
          print('static assertions PASS')
          PY
      - name: Commit candidate only
        shell: bash
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'candidate: restore Property integrity from accepted baseline 17019'
          git push origin HEAD:candidate-property-integrity-17019
