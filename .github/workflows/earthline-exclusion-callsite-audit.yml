name: Earthline Exclusion Callsite Audit
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-exclusion-callsite-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - name: Print vector exclusion owner and infrastructure callsites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          lines=s.splitlines()
          print("===== INFRA CALLS =====")
          for i,line in enumerate(lines):
              if "earthlineCollectParcelInfrastructure15862P(" in line and "function earthlineCollect" not in line:
                  print(f"\n--- line {i+1} ---")
                  for j in range(max(0,i-25),min(len(lines),i+35)):
                      print(f"{j+1}: {lines[j]}")
          print("\n===== VECTOR OWNER =====")
          for exact in ["async function vectorNoBuild15778","function vectorNoBuild15778"]:
              i=s.find(exact)
              if i>=0:
                  print(s[max(0,i-1000):min(len(s),i+26000)])
                  break
          PY
