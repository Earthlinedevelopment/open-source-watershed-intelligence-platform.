name: Earthline candidate DOM audit 16968
on:
  push:
    branches: [report-map-candidate-16967]
    paths:
      - '.github/workflows/e2e-dom-audit-16968.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: report-map-candidate-16967
      - name: Parse active DOM controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          s=re.sub(r'<!--.*?-->','',s,flags=re.S)
          for label in ["Property Search","Run Analysis","Bioswale Impact Report"]:
              print("\n==",label,"==")
              for m in re.finditer(re.escape(label),s,re.I):
                  a=max(0,s.rfind("<",0,m.start()-1)); b=s.find(">",m.end())
                  print(s[max(0,m.start()-700):min(len(s),m.end()+1200)].replace("\n"," ")[:2200])
                  print("---")
          print("\n== explicit controls ==")
          for pat in [r'<input[^>]+id="searchInput"[^>]*>',r'<button[^>]+id="[^"]+"[^>]*>[^<]*(?:Run Analysis|Property Search)[^<]*</button>',r'<button[^>]+id="earthlineVermontReport[^"]*"[^>]*>[^<]*</button>']:
              print("PATTERN",pat)
              for x in re.findall(pat,s,re.I|re.S):
                  print(re.sub(r'\s+',' ',x))
          PY
