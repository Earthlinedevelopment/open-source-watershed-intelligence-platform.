name: Mantra 51 Inspect Same Query Routing
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths: ['.github/workflows/mantra51-inspect-same-query-routing.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: mantra51-global-repair-campaign}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needles=[
            "property analysis did not publish",
            "address resolved, but the property engine returned no verified result",
            "selected_site",
            "propertyMode",
            "regionalMode",
            "geocodeMapbox(",
            "async function earthlineRunAnalysis",
            "function earthlineRunAnalysis",
            "EARTHLINE_PROPERTY_DECLARATION_16169",
            "displayedTier"
          ]
          for needle in needles:
            print("\n===== "+needle+" =====")
            pos=0;n=0
            while n<12:
              i=s.find(needle,pos)
              if i<0: break
              print(s[max(0,i-3200):min(len(s),i+7000)])
              print("\n---")
              pos=i+len(needle);n+=1
          PY
