name: M96 isolated safe Property visual repair
on:
  push:
    branches: [fix/m96-visible-property-swales-elders]
    paths: [.github/workflows/m96-apply-safe-visual.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only the two water strips in the safe source and handle texture fallback
        run: |
          set -euo pipefail
          python3 tools/m96-patch-property-water.py
          git diff --check
          git diff --stat
          git config user.name "Earthline Repair CI"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix(M96): expose two bright dotted blue strips on each vetted Property swale"
          git push origin HEAD:fix/m96-visible-property-swales-elders
