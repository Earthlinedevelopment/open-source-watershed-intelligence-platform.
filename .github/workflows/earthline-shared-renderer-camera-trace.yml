name: Earthline Shared Renderer Camera Trace

on:
  push:
    branches: [earthline-regression-candidate]
    paths:
      - 'tests/shared-renderer-camera-reclaim.mjs'
      - '.github/workflows/earthline-shared-renderer-camera-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Trace Wisconsin and Vermont renderer/camera lifecycle
        run: node tests/shared-renderer-camera-reclaim.mjs
