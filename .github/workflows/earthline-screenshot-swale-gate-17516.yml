name: Earthline Screenshot Swale Gate 17516
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/earthline-screenshot-swale-gate-17516.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/earthline-launch-17515, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/screenshot-swale-gate-17516.mjs > tests/screenshot-swale-gate-17516.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/screenshot-swale-gate-17516.mjs
