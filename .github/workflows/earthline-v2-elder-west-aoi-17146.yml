name: Earthline V2 Elder West AOI 17146
on:
  push:
    branches:
      - v2/stable-replacement-17138
    paths:
      - tests/v2-elder-west-aoi-17146.mjs
      - .github/workflows/earthline-v2-elder-west-aoi-17146.yml
      - earthline-elder-worker-17129.js
      - tools/elder_trees/chmv2_array_detector_17129.py
  workflow_dispatch:
jobs:
  elder-west-aoi:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/v2-elder-west-aoi-17146.mjs
