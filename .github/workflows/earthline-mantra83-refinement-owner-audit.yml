name: Mantra 83 Refinement Owner Audit
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - 'tests/mantra83-refinement-owner-audit.mjs'
      - '.github/workflows/earthline-mantra83-refinement-owner-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra83-shadow-live
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          git fetch origin pages-live
          git show origin/pages-live:index.html > /tmp/pages-live-index.html
          cp /tmp/pages-live-index.html index.html
          node tests/mantra83-refinement-owner-audit.mjs
