name: Mantra 51 Current Report Aquifer Owner
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - '.github/workflows/mantra51-current-report-aquifer-owner.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='ignore')
          i=s.find('function reportAquifers()')
          print(s[i:i+4200].replace('\n',' '))
          PY
