name: Verify Property Selector 17046

on:
  push:
    branches:
      - "candidate/property-restore-working-selector-17046"

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "candidate/property-restore-working-selector-17046"
          fetch-depth: 0

      - name: Verify exact five-line selector rollback
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          live = "2b81511751939751087065c39a1d40d758cba90f"
          current = Path("index.html").read_text(encoding="utf-8")
          old = subprocess.check_output(["git","show",f"{live}:index.html"], text=True)

          a = old.splitlines()
          b = current.splitlines()
          changed = [(i+1, x, y) for i,(x,y) in enumerate(zip(a,b)) if x != y]
          if len(a) != len(b):
              raise SystemExit(f"Line count changed: live={len(a)} candidate={len(b)}")
          if len(changed) != 5:
              raise SystemExit(f"Expected exactly 5 changed lines; found {len(changed)}")

          expected_new = {
              "const chosen=[],primarySpacing=Math.max(3,Math.round(hy.w/31));",
              "const baseRegionalCapacity16755=focusMode?80:Math.min(120,Math.max(80,coverageGroups16736.size*4));",
              "const regionalCapacity16755=focusMode?80:baseRegionalCapacity16755+supportExtra16755;",
              "const spacing=chosen.length<20?primarySpacing:Math.max(2,Math.round(primarySpacing*.72));",
              "if(!focusMode&&chosen.length&&candidates.length){",
          }
          actual_new = {y.strip() for _,_,y in changed}
          if actual_new != expected_new:
              raise SystemExit("Changed lines do not exactly match approved rollback.")

          Path("/tmp/changed.txt").write_text(
              "\n".join(f"{n}: {x.strip()}  ==>  {y.strip()}" for n,x,y in changed),
              encoding="utf-8"
          )

      - name: Syntax-check inline JavaScript
        shell: python
        run: |
          import re, subprocess, tempfile
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b([^>]*)>(.*?)</script\s*>", html, flags=re.I|re.S)
          checked = 0
          for attrs, body in scripts:
              if re.search(r"\bsrc\s*=", attrs, flags=re.I):
                  continue
              m = re.search(r"\btype\s*=\s*['\"]([^'\"]+)['\"]", attrs, flags=re.I)
              if m and m.group(1).lower() not in ("text/javascript","application/javascript","module"):
                  continue
              with tempfile.NamedTemporaryFile("w", suffix=".mjs", encoding="utf-8", delete=False) as f:
                  f.write(body)
                  name=f.name
              subprocess.run(["node","--check",name], check=True, capture_output=True, text=True)
              checked += 1
          if checked == 0:
              raise SystemExit("No inline JavaScript blocks checked.")
          Path("/tmp/script-count.txt").write_text(str(checked), encoding="utf-8")

      - name: Record PASS marker
        shell: bash
        run: |
          {
            echo "EARTHLINE 17046 OFF-PRODUCTION VERIFICATION: PASS"
            echo "Live parent: 2b81511751939751087065c39a1d40d758cba90f"
            echo "Candidate branch: candidate/property-restore-working-selector-17046"
            echo "Exact changed selector lines: 5"
            echo -n "Inline JavaScript blocks syntax-checked: "
            cat /tmp/script-count.txt
            echo
            cat /tmp/changed.txt
          } > verification-17046.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification-17046.txt
          git commit -m "test: property selector rollback 17046 off-production PASS [skip ci]"
          git push origin HEAD:"candidate/property-restore-working-selector-17046"
