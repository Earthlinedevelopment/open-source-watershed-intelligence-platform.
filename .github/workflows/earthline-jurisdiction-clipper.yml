name: Earthline Jurisdiction Clipper Trace
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/trace-jurisdiction-clipper.py'
      - '.github/workflows/earthline-jurisdiction-clipper.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tests/trace-jurisdiction-clipper.py
