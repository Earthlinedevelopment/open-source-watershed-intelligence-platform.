name: Property repeat owner diagnostic (read-only)
on:
  push:
    branches: [diagnose/property-repeat-owner-20261119]
    paths:
      - tests/property-repeat-owner-diagnostic.mjs
      - .github/workflows/property-repeat-owner-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser engines
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Diagnose same-coordinate Property repeat on public website
        run: node tests/property-repeat-owner-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: property-repeat-owner-evidence
          path: artifacts/property-repeat-owner/
          retention-days: 14
