name: Earthline Property Publication Owner Audit 17032
on:
  push:
    branches: [candidate-property-integrity-17019]
    paths:
      - '.github/workflows/property-publication-owner-audit-17032.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract downstream publication owners
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['authoritativeSafeSwales15815','propertyPublication15816','Property detail published','screened bioswale corridors','M.swales','swales.push']
          for n in needles:
            print('\n===== '+n+' =====')
            start=0;hits=0
            while True:
              i=s.find(n,start)
              if i<0: break
              print('\n--- @',i,'---')
              print(s[max(0,i-4500):min(len(s),i+9000)])
              start=i+len(n);hits+=1
              if hits>=8: break
            print('HITS',hits)
          PY
