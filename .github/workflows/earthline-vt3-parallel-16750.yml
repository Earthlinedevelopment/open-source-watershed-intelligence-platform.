name: Earthline 16750 Vermont Parallel Triple
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-vt3-parallel-16750.yml']
permissions:
  contents: read
jobs:
  confirm:
    strategy:
      fail-fast: false
      matrix:
        attempt: [one, two, three]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Confirm Vermont
        shell: bash
        run: |
          set +e
          EARTHLINE_URL='https://earthlinedevelopment.org/' STATES='Vermont' OUT='vt-${{ matrix.attempt }}.json' node lab/validate-16731-coverage-gap.mjs
          code=$?
          cat 'vt-${{ matrix.attempt }}.json'
          exit "$code"
