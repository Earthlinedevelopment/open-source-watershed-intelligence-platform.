name: Mantra 51 Polish Report Maps
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - 'scripts/polish_report_maps_16928.py'
      - '.github/workflows/mantra51-polish-report-maps.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/polish_report_maps_16928.py
          git diff --check
          git add index.html
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git commit -m "fix: polish Bioswale Impact Report map presentation"
          git push
