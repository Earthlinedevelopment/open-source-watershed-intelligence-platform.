name: Mantra 51 Editorial Residual Probe
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - '.github/workflows/mantra51-editorial-residual-probe.yml'
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - run: python3 -m http.server 8787 >/tmp/el-http.log 2>&1 &
      - run: |
          cat > probe.mjs <<'JS'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true});const p=await b.newPage();
          await p.goto('http://127.0.0.1:8787/index.html?probe='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await p.waitForTimeout(3500);await p.evaluate(()=>{location.hash='#swales-explained'});
          await p.waitForSelector('#earthlineSwalesPage16125.open',{timeout:15000});await p.waitForTimeout(500);
          const out=await p.evaluate(()=>{
            const d=document.querySelector('#earthlineSwalesPage16125 iframe')?.contentDocument,body=d?.body?.innerText||'';
            const lines=body.split(/\n+/).map(x=>x.trim()).filter(Boolean);
            const terms=['§','most of it does not soak in','joins the groundwater below','only stormwater structure','exact intervention','upper bound','local hydrogeology','Distributed hillslope','On soil carbon'];
            const hits={};for(const t of terms)hits[t]=lines.filter(x=>x.includes(t));
            return hits;
          });
          console.log(JSON.stringify(out,null,2));await b.close();
          JS
          node probe.mjs
