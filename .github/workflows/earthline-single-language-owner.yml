name: Earthline Single Language Owner
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['tools/mantra74-single-language-owner.py']
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          fetch-depth: 0
      - run: python3 tools/mantra74-single-language-owner.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check earthline-launch-16872.js
          ! grep -q "earthline-language-hotfix-16890.js" index.html
          ! grep -q "function applyLanguage(" index.html
          ! grep -q "function earthlineApplyUiLanguage16871(" index.html
          grep -q "function ensureLanguage(){" index.html
          grep -q "languageControl.value=launchLangOverride" earthline-launch-16872.js
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1])}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          console.log('EARTHLINE_17700_SINGLE_LANGUAGE_OWNER_OK');
          NODE
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Earthline Stability Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git rm -f earthline-language-hotfix-16890.js
          git rm -f tools/mantra74-single-language-owner.py .github/workflows/earthline-single-language-owner.yml
          git add index.html earthline-launch-16872.js
          git commit -m "stability: consolidate language control and state ownership"
          git push origin HEAD:recovery/mantra74-stability
