name: Earthline M92 Property science and rendering truth
on:
  push:
    branches: [audit/mantra92-regional-fallback-isolation]
    paths:
      - tests/mantra92-property-truth.mjs
      - .github/workflows/mantra92-property-truth.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  truth:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check tests/mantra92-property-truth.mjs
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Audit real Property masks, displayed opacity and source geometry
        run: node tests/mantra92-property-truth.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-Property-truth-evidence
          path: artifacts/property-truth
          retention-days: 14
