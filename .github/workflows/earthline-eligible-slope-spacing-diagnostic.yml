name: Earthline Eligible Slope Spacing Diagnostic
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-eligible-slope-spacing-diagnostic.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
      - name: Inspect slope statistic ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          lines=s.splitlines()
          for term in ['function medianSlopeInParcel','medianSlopeInParcel()','levelStepRaw=medSlope*targetSpacingM15771']:
              print('\n===== '+term+' =====')
              for i,line in enumerate(lines):
                  if term in line:
                      for n in range(max(0,i-35),min(len(lines),i+90)): print(f'{n+1}: {lines[n]}')
                      break
          PY
