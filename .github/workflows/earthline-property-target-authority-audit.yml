name: Earthline Property Target Authority Audit
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-property-target-authority-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - name: Audit Property target authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          terms=[
            "EARTHLINE_PROPERTY_TARGET_16201",
            "setPropertyTarget16201",
            "syncPropertyTargetFromMap16201",
            "country-center",
            "selectedLocation",
            "runRegional",
            "Arizona"
          ]
          for term in terms:
              print("\n===== "+term+" =====")
              start=0
              n=0
              while True:
                  i=s.find(term,start)
                  if i<0 or n>=12: break
                  print(s[max(0,i-2200):min(len(s),i+5200)])
                  print("\n---")
                  start=i+len(term); n+=1
          PY
