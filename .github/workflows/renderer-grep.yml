name: Mantra 83 Renderer Grep
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/renderer-grep.yml'
permissions:
  contents: read
jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          grep -n "earthlineRenderRegionalOverlay16020" index.html | head -30
          grep -n "function render" index.html | grep -E "16020|Regional|regional" | head -30
