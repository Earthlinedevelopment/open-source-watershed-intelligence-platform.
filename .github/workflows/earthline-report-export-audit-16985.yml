name: Earthline report export audit 16985
on:
  push:
    branches:
      - pages-live
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Audit current map/report owners
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needles=[
            "new mapboxgl.Map",
            "mapboxgl.accessToken",
            "function reportData",
            "function buildReport",
            "function mapSvg(d,small=false){",
            "function reportAquifers",
            "function visual",
            "EARTHLINE_REGIONAL_VISUAL_DATA_16020",
            "EARTHLINE_LAST_LIVE_PROPERTY",
            "authoritativeWaterPaths15824"
          ]
          for n in needles:
              print("\n### "+n)
              i=s.find(n)
              print("INDEX",i)
              if i>=0: print(s[max(0,i-1200):min(len(s),i+6500)])
          PY
