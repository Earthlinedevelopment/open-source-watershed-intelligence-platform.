name: Earthline Mantra 71 Blue Owner Fix 3
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-m71-blue-owner-fix3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Patch canonical Property blue-water owner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''    return !!(
      M&&M.analysisReady&&
      currentPublication&&
      state.mode==="property"
    );'''
          new='''    const displayed=window.EARTHLINE_DISPLAYED_RUN_16151||
      window.EARTHLINE_DISPLAYED_RUN_16147||null;
    const displayedTier=String(
      displayed&&(displayed.tier||displayed.mode)||""
    ).toLowerCase();
    /* EARTHLINE 17566 — committed, safety-verified canonical Property display owns
       direct blue water; legacy mode/search-generation bookkeeping may not erase it. */
    return !!(
      M&&M.analysisReady&&
      publication&&
      publication.committed===true&&
      publication.safetyVerified===true&&
      displayed&&
      displayedTier==="property"
    );'''
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'expected one live 15824 gate, found {count}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          if((s.match(/EARTHLINE 17566/g)||[]).length!==1) throw new Error('17566 marker count');
          if((s.match(/function propertyActive15824\(\)/g)||[]).length!==1) throw new Error('15824 owner count');
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim()) continue;
            try{new Function(m[1]);}catch(e){throw new Error('script '+i+' syntax: '+e.message);}
          }
          NODE
      - name: Publish
        shell: bash
        run: |
          git config user.name "Earthline Production Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git rm .github/workflows/earthline-m71-blue-owner-fix2.yml || true
          git rm .github/workflows/earthline-m71-blue-owner-fix3.yml
          git add index.html
          git commit -m "fix: bind first Property blue water to canonical committed Property display"
          git push origin HEAD:pages-live
