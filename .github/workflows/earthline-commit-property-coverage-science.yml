name: Earthline Commit Validated Property Coverage Science
on:
  push:
    branches: [science-coverage-recovery]
    paths:
      - '.github/workflows/earthline-commit-property-coverage-science.yml'
permissions:
  contents: write
jobs:
  commit-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: science-coverage-recovery
          fetch-depth: 1
      - name: Apply validated Property science
        run: |
          python3 tests/apply-property-level-spacing-science.py index.html
          python3 tests/apply-property-component-science.py index.html
          python3 tests/apply-property-minimum-length-science.py index.html
          python3 tests/apply-property-loop-geometry-science.py index.html
          python3 tests/apply-property-target-spacing-science.py index.html
      - name: Verify only product runtime changed
        run: |
          test "$(git diff --name-only)" = "index.html"
          grep -q 'propertySafeSlopeFractions15771' index.html
          grep -q 'propertyContourComponentSeedAudit' index.html
          grep -q 'earthlineMinimumSwaleLengthM15768' index.html
          grep -q 'propertySlopeSafeShare15771' index.html
      - name: Commit isolated science
        run: |
          git fetch origin science-coverage-recovery
          test "$(git rev-parse origin/science-coverage-recovery)" = "$GITHUB_SHA"
          git config user.name "Earthline Science"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "science: restore complete <=4% Property contour coverage"
          git push origin HEAD:science-coverage-recovery
