name: Mantra 83 Jurisdiction Screen Audit
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/jurisdiction-screen-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          grep -n "function screenJurisdictionCandidate16539" index.html
          grep -n "screenJurisdictionCandidate16539" index.html | head -20
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          const at=s.indexOf('function screenJurisdictionCandidate16539');
          console.log(s.slice(at-2000,at+9000));
          NODE
