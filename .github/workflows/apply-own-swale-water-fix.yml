name: Apply exact own-bioswale-water exclusion repair (isolated)
on:
  push:
    branches: [repair/exclude-own-swale-water-layers-20261114]
    paths: [.github/workflows/apply-own-swale-water-fix.yml]
permissions: {contents: write}
jobs:
  surgical_patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "a25fc2f7df75d63a96b095f0c8d2017d81623fb1"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          needle='return (style&&style.layers||[]).filter(l=>{\n        const tag=((l.id||"")+" "+(l["source-layer"]||"")).toLowerCase();'
          assert s.count(needle)==1,s.count(needle)
          replacement='return (style&&style.layers||[]).filter(l=>{\n        /* EARTHLINE SELF-WATER EXCLUSION FIX: blue water inside an already-published bioswale is NOT mapped hydrography. */\n        if(l.id==="earthline-living-swales-water-15792"||l.id==="earthline-property-safe-water-16221")return false;\n        const tag=((l.id||"")+" "+(l["source-layer"]||"")).toLowerCase();'
          s=s.replace(needle,replacement,1)
          p.write_text(s)
          assert s.count('EARTHLINE SELF-WATER EXCLUSION FIX')==1
          print('PATCH VERIFIED: exclude two specifically observed own-swale water display layer IDs, preserve all other mapped exclusion layer rules')
          PY
          git diff --numstat -- index.html
          git diff --check
          git rm .github/workflows/apply-own-swale-water-fix.yml
          git config user.name "Earthline isolated repair"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix(exclusions): do not classify Earth's bioswale water decoration as natural waterways"
          git push origin HEAD:repair/exclude-own-swale-water-layers-20261114
