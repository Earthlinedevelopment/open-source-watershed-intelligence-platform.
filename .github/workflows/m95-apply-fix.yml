name: M95 apply exact Property target and evidence correction
on:
  push:
    branches: [fix/m95-arizona-actual-property-ui]
    paths: [.github/workflows/m95-apply-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source and patch only approved repair points
        run: |
          set -euo pipefail
          python3 tools/m95-property-target-fix.py
          git diff --check
          git diff --stat
          git config user.name "Earthline Repair CI"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix(M95): preserve selected crosshair through UI dismissal and correctly label screened-clear evidence"
          git push origin HEAD:fix/m95-arizona-actual-property-ui
