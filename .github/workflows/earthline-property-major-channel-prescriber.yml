name: Earthline Property Major Channel Prescriber Science
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-property-major-channel-prescriber.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 0
      - name: Align prescriber with major-waterway science
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='    const thr=streamThreshold(),chanThr=thr*3.2,maxS=4;'
          new='    const thr=streamThreshold(),chanThr=Math.max(thr*3.2,Number(M.maxAcc||0)*0.06),maxS=4;'
          a=s.index('async function prescribeSwales15778')
          pos=s.index(old,a)
          s=s[:pos]+new+s[pos+len(old):]
          p.write_text(s,encoding='utf-8')
          PY
          test "$(git diff --name-only)" = "index.html"
          test "$(git diff --numstat | awk '{print $1" "$2}')" = "1 1"
      - name: Commit candidate science
        run: |
          git config user.name "Earthline Engine"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "science: align Property prescriber with major waterways"
          git push origin HEAD:candidate-next
