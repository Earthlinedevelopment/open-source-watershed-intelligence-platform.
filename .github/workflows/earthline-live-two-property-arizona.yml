name: Earthline Live Two-Property Arizona Validation
'on':
  push:
    branches:
      - candidate-next
    paths:
      - tests/live-two-property-arizona.mjs
      - .github/workflows/earthline-live-two-property-arizona.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/live-two-property-arizona.mjs
