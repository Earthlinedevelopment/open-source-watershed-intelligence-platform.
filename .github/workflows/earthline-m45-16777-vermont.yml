name: Earthline 16777 Vermont Exact Gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-m45-16777-vermont.yml']
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Certify exact Vermont query
        shell: bash
        run: |
          set +e
          EARTHLINE_URL='https://earthlinedevelopment.org/' STATES='Vermont' OUT='lab/mantra45-16777-vermont-exact.json' node lab/validate-16777-machine.mjs
          code=$?
          cat lab/mantra45-16777-vermont-exact.json
          exit $code
      - name: Persist
        if: always()
        shell: bash
        run: |
          git config user.name "Earthline Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add lab/mantra45-16777-vermont-exact.json
          git commit -m "test: persist 16777 Vermont exact gate [skip ci]" || true
          git pull --rebase origin main
          git push origin HEAD:main
