name: Earthline report visual step 16973
on:
  push:
    branches:
      - pages-live
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Apply stronger property-style report treatment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          start=s.index("function mapSvg(d,small=false){")
          end=s.index("  return parts.join('');\n}", start)+len("  return parts.join('');\n}")
          fn=s[start:end]

          def one(a,b,label):
              global fn
              n=fn.count(a)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {n}")
              fn=fn.replace(a,b,1)

          one('class="el-report-real-site-render-16972"',
              'class="el-report-real-site-render-16973"',
              "marker")

          one('<feColorMatrix type="saturate" values=".78" result="sat"/><feComponentTransfer in="sat"><feFuncR type="linear" slope=".90" intercept=".018"/><feFuncG type="linear" slope=".94" intercept=".012"/><feFuncB type="linear" slope=".88" intercept=".014"/></feComponentTransfer>',
              '<feColorMatrix type="saturate" values=".90" result="sat"/><feComponentTransfer in="sat"><feFuncR type="linear" slope="1.01" intercept=".026"/><feFuncG type="linear" slope="1.04" intercept=".024"/><feFuncB type="linear" slope=".98" intercept=".020"/></feComponentTransfer>',
              "aerial lift")

          one('<stop offset="0" stop-color="#fff1cf" stop-opacity=".10"/><stop offset=".34" stop-color="#315340" stop-opacity=".035"/><stop offset=".72" stop-color="#173a31" stop-opacity=".09"/><stop offset="1" stop-color="#092820" stop-opacity=".18"/>',
              '<stop offset="0" stop-color="#fff3d8" stop-opacity=".08"/><stop offset=".34" stop-color="#4d6b55" stop-opacity=".018"/><stop offset=".72" stop-color="#25483b" stop-opacity=".035"/><stop offset="1" stop-color="#17382f" stop-opacity=".07"/>',
              "aerial wash")

          one('<stop offset=".66" stop-color="#102f27" stop-opacity=".03"/><stop offset="1" stop-color="#071d19" stop-opacity=".16"/>',
              '<stop offset=".66" stop-color="#17372e" stop-opacity=".018"/><stop offset="1" stop-color="#0b2922" stop-opacity=".08"/>',
              "vignette")

          one('stroke="#746f55" stroke-width=".85" opacity=".31" stroke-dasharray="2.6 3.4"',
              'stroke="#5d725f" stroke-width=".62" opacity=".11" stroke-dasharray="2.4 4.2"',
              "C corridors")

          one('stroke="#fffdf5" stroke-width="8.4" opacity=".78"',
              'stroke="#173d31" stroke-width="4.4" opacity=".30"',
              "B underlay")
          one('stroke="#b4c99e" stroke-width="5.7" opacity=".84"',
              'stroke="#4f805e" stroke-width="2.8" opacity=".48"',
              "B ribbon")
          one('stroke="#345a3c" stroke-width="1.15" opacity=".92"',
              'stroke="#1f6670" stroke-width=".95" opacity=".70"',
              "B core")

          one('stroke="#fffaf0" stroke-width="17.5" opacity=".94"',
              'stroke="#102f29" stroke-width="8.2" opacity=".55"',
              "A underlay")
          one('stroke="#7fb273" stroke-width="11.8" opacity=".90"',
              'stroke="#4c875d" stroke-width="5.8" opacity=".78"',
              "A planted ribbon")
          one('stroke="#173f2a" stroke-width="1.8" opacity=".99"',
              'stroke="#0a5567" stroke-width="2.15" opacity=".98"',
              "A water core")
          one('translate(-2.15 -2.15)" fill="none" stroke="#35b6d2" stroke-width="1.05" opacity=".99" stroke-dasharray="2.2 2.8"',
              'translate(-1.25 -1.25)" fill="none" stroke="#72cfe1" stroke-width=".82" opacity=".95" stroke-dasharray="1.2 2.5"',
              "A highlight 1")
          one('translate(2.15 2.15)" fill="none" stroke="#35b6d2" stroke-width="1.05" opacity=".99" stroke-dasharray="2.2 2.8"',
              'translate(1.25 1.25)" fill="none" stroke="#72cfe1" stroke-width=".82" opacity=".95" stroke-dasharray="1.2 2.5"',
              "A highlight 2")

          one("rows.filter(r=>r.grade==='A').slice(0,8)",
              "rows.filter(r=>r.grade==='A').slice(0,5)",
              "label count")

          one('width="250" height="112" rx="5" fill="#fffef9" fill-opacity=".92"',
              'width="250" height="112" rx="5" fill="#fffef9" fill-opacity=".80"',
              "legend opacity")

          out=s[:start]+fn+s[end:]
          if out.count("el-report-real-site-render-16973") != 1:
              raise SystemExit("16973 marker validation failed")
          if "el-report-real-site-render-16972" in out:
              raise SystemExit("16972 marker still present")
          p.write_text(out,encoding="utf-8")
          PY
          git config user.name "Earthline Build Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "style: stronger property-style report map 16973"
          git push origin HEAD:pages-live
