name: Validate Clean Regional Candidate 17425
on:
  push:
    branches: [repair/regional-clean-presentation-17424]
    paths:
      - '.github/workflows/validate-clean-regional-candidate-17425.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/regional-clean-presentation-17424
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: candidate/browser-elder-clean-regional-17425
          path: candidate
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          cd harness
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 --directory candidate >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: |
          cd harness
          if [ '${{ matrix.browser }}' = 'firefox' ]; then
            xvfb-run -a env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='firefox' HEADLESS='false' node tests/regional-clean-presentation-17424.mjs
            xvfb-run -a env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='firefox' HEADLESS='false' WAIT_MS='90000' STATES='Vermont|Texas|New York|Arkansas|Iowa|Colorado|California' node tests/browser-regional-ab-17269.mjs
          else
            env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='chromium' HEADLESS='true' node tests/regional-clean-presentation-17424.mjs
            env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='chromium' HEADLESS='true' WAIT_MS='90000' STATES='Vermont|Texas|New York|Arkansas|Iowa|Colorado|California' node tests/browser-regional-ab-17269.mjs
          fi
  webkit:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/regional-clean-presentation-17424
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: candidate/browser-elder-clean-regional-17425
          path: candidate
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          cd harness
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - run: |
          python3 -m http.server 8787 --bind 0.0.0.0 --directory candidate >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: |
          cd harness
          env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='webkit' HEADLESS='false' node tests/regional-clean-presentation-17424.mjs
          env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='webkit' HEADLESS='false' WAIT_MS='90000' STATES='Vermont|Texas|New York|Arkansas|Iowa|Colorado|California' node tests/browser-regional-ab-17269.mjs
