name: Earthline 17704 Iowa Arkansas Regional Visibility
on:
  push:
    branches: [recovery/mantra74-stability]
    paths:
      - tests/ia-ar-regional-visible-17704.mjs
      - .github/workflows/earthline-17704-ia-ar-visibility.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.55.0
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-17704-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node tests/ia-ar-regional-visible-17704.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ia-ar-regional-visible-17704
          path: |
            ia-ar-regional-visible-17704.json
            regional-visible-*.png
