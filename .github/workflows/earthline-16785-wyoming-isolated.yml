name: Earthline 16785 Wyoming Isolated Property
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-16785-wyoming-isolated.yml']
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Certify Wyoming Property
        shell: bash
        run: |
          set +e
          EARTHLINE_URL='https://earthlinedevelopment.org/' STATES='Wyoming' OUT='lab/mantra45-16785-wyoming-isolated.json' node lab/validate-16728-property-50states.mjs
          code=$?
          cat lab/mantra45-16785-wyoming-isolated.json
          echo "validator_exit=$code"
          exit 0
      - name: Persist evidence
        shell: bash
        run: |
          git config user.name "Earthline Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add lab/mantra45-16785-wyoming-isolated.json
          git commit -m "test: persist 16785 Wyoming isolated Property [skip ci]" || true
          git pull --rebase origin main
          git push origin HEAD:main
