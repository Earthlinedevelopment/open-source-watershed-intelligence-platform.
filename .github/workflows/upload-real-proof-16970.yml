name: Upload real render proof 16970
on:
  push:
    branches: [mantra54-real-report-render-16970]
    paths:
      - '.github/workflows/upload-real-proof-16970.yml'
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra54-real-report-render-16970
      - uses: actions/upload-artifact@v4
        with:
          name: real-report-proof-16970
          path: real-report-proof-16970.png
          if-no-files-found: error
          retention-days: 1
