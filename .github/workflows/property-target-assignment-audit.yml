name: Mantra 83 Property Target Assignment Audit
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/property-target-assignment-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          for(const term of ['window.EARTHLINE_PROPERTY_TARGET_16201=','EARTHLINE_PROPERTY_TARGET_16201 =','const target={lng:Number(loc.lng)','earthlineDeclarePropertyAtCrosshair16173']){
            let from=0,n=0;while(true){const at=s.indexOf(term,from);if(at<0)break;console.log('ASSIGN '+JSON.stringify({term,at,text:s.slice(Math.max(0,at-2200),Math.min(s.length,at+6000))}));from=at+term.length;if(++n>=12)break;}
          }
          NODE
