name: Earthline Property Matrix

on:
  push:
    branches: [pages-live]
    paths:
      - 'lab/property-matrix.mjs'
      - 'builds/16601/**'
      - 'builds/16602/**'
      - 'lab.html'
      - '.github/workflows/earthline-property-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  us-property:
    name: US Property shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wait for exact public 16602 audit marker
        run: |
          for i in $(seq 1 36); do
            body="$(curl -fsSL "https://earthlinedevelopment.org/builds/16602/earthline-regional-camera-scale.js?gate=${GITHUB_SHA}" || true)"
            if printf '%s' "$body" | grep -q 'auditOnly:true'; then
              echo 'Exact 16602 audit-only surface is live.'
              exit 0
            fi
            sleep 5
          done
          echo 'Public surface did not expose exact 16602 audit marker.' >&2
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run current public Property tests
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          EARTHLINE_AREA: US
          EARTHLINE_SHARD_INDEX: ${{ matrix.shard }}
          EARTHLINE_SHARD_TOTAL: 5
        run: node lab/property-matrix.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthline-property-us-${{ matrix.shard }}
          path: lab-results/property-us-${{ matrix.shard }}-of-5.json
          if-no-files-found: warn
          retention-days: 7

  se-asia-property:
    name: Southeast Asia Property
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wait for exact public 16602 audit marker
        run: |
          for i in $(seq 1 36); do
            body="$(curl -fsSL "https://earthlinedevelopment.org/builds/16602/earthline-regional-camera-scale.js?gate=${GITHUB_SHA}" || true)"
            if printf '%s' "$body" | grep -q 'auditOnly:true'; then
              echo 'Exact 16602 audit-only surface is live.'
              exit 0
            fi
            sleep 5
          done
          echo 'Public surface did not expose exact 16602 audit marker.' >&2
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run current public Property tests
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          EARTHLINE_AREA: SEA
          EARTHLINE_SHARD_INDEX: 0
          EARTHLINE_SHARD_TOTAL: 1
        run: node lab/property-matrix.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthline-property-se-asia
          path: lab-results/property-sea-0-of-1.json
          if-no-files-found: warn
          retention-days: 7
