name: Earthline seven problem search diagnostic 16903
on:
  push:
    branches: [mantra49-launch-five-searches-16902]
    paths:
      - .github/workflows/mantra49-five-search-diagnose-16902.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Trace authoritative crosshair owners in source
        run: |
          echo '=== PROPERTY TARGET WRITERS ==='
          grep -n -C 8 'EARTHLINE_PROPERTY_TARGET_16201' index.html | head -n 320 || true
          echo '=== CROSSHAIR + DRAGEND OWNERS ==='
          grep -n -C 8 -E 'dragend|crosshair|earthlineDeclareProperty16169' index.html | grep -E -C 8 'EARTHLINE_PROPERTY_TARGET_16201|dragend|earthlineDeclareProperty16169' | head -n 520 || true
      - name: Install browser
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install playwright@1.55.0 --no-save
      - name: Probe map owners on affected and working controls
        run: |
          cat > owners16903.js <<'JS'
          const {chromium}=require('playwright');
          const qs=['New Zealand country','Australia country','Alaska','India country','Hawaii','Vietnam country','Germany country'];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function one(b,q){
            const c=await b.newContext({viewport:{width:1600,height:900}}),p=await c.newPage();
            await p.goto('https://earthlinedevelopment.org/?owners16903='+encodeURIComponent(q)+'-'+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForSelector('#searchInput',{timeout:30000});await p.fill('#searchInput',q);
            const wait=p.evaluate(()=>new Promise(res=>{let z=false;const f=k=>{if(!z){z=true;res(k)}};document.addEventListener('earthline:analysis-complete',()=>f('complete'));document.addEventListener('earthline:analysis-failed',()=>f('failed'));setTimeout(()=>f('timeout'),55000)}));
            await p.press('#searchInput','Enter');const term=await wait;await sleep(700);
            const snap=async()=>p.evaluate(()=>{
              const maps=[];
              for(const k of Object.keys(window)){
                let v;try{v=window[k]}catch(_){continue}
                if(v&&typeof v==='object'&&typeof v.getCenter==='function'&&typeof v.getZoom==='function'&&typeof v.on==='function'){
                  try{const c=v.getCenter();maps.push({k,center:{lng:c.lng,lat:c.lat},zoom:v.getZoom()})}catch(_){}
                }
              }
              return {maps,target:window.EARTHLINE_PROPERTY_TARGET_16201||null,selected:window.EARTHLINE_SELECTED_LOCATION||null};
            });
            const before=await snap();
            const canvas=p.locator('.mapboxgl-canvas').first();if(await canvas.count()){const box=await canvas.boundingBox();if(box){const x=box.x+box.width*.62,y=box.y+box.height*.5;await p.mouse.move(x,y);await p.mouse.down();await p.mouse.move(x-280,y,{steps:18});await p.mouse.up();await sleep(1100)}}
            const after=await snap();console.log('OWNER',q,JSON.stringify({term,before,after}));await c.close();
          }
          (async()=>{const b=await chromium.launch({headless:true,executablePath:'/usr/bin/chromium',args:['--no-sandbox']});for(const q of qs)await one(b,q);await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node owners16903.js
