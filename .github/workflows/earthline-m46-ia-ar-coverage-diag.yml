name: Mantra 46 Iowa Arkansas Coverage Diagnostic
on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/mantra46-ia-ar-coverage-diag.mjs'
      - '.github/workflows/earthline-m46-ia-ar-coverage-diag.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run coverage diagnostic
        run: node tests/mantra46-ia-ar-coverage-diag.mjs
