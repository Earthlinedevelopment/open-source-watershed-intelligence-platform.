name: Materialize Earthline Hotfix 17500
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/materialize-earthline-hotfix-17500.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/earthline-launch-17500, fetch-depth: 0}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/apply-elder-compute-prime-17500.py > /tmp/a.py
          git show origin/repair/property-one-click-17441:tests/apply-property-elder-prime-17500.py > /tmp/b.py
          python3 /tmp/a.py
          python3 /tmp/b.py
      - run: |
          git config user.name "Earthline CI"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html earthline-launch-16872.js
          git commit -m "candidate: exact-target Elder compute prime 17500"
          git push origin HEAD:candidate/earthline-launch-17500
