name: Earthline Direct Arizona Runtime Comparison
on:
  push:
    branches: [candidate-next]
    paths:
      - 'tests/direct-arizona-runtime-compare.mjs'
      - '.github/workflows/earthline-direct-arizona-runtime.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Direct exact-parcel runtime comparison
        run: node tests/direct-arizona-runtime-compare.mjs
