name: Earthline Texas-California Coastal Starvation Audit

on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - '.github/workflows/earthline-all-state-coastal-starvation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Governance preflight
        run: python tests/earthline-governance-preflight.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Texas-California coastal starvation audit
        env:
          STATES: "Texas|California"
        run: |
          node tests/all-state-coastal-starvation-audit.mjs | tee coastal-starvation-pair.log
      - name: Record diagnostic result
        run: |
          {
            echo "EARTHLINE COASTAL STARVATION PAIR — diagnostic only"
            echo "Commit: $GITHUB_SHA"
            echo
            grep 'EARTHLINE_COASTAL_STARVATION ' coastal-starvation-pair.log || true
            echo
            grep 'EARTHLINE_COASTAL_STARVATION_SUMMARY ' coastal-starvation-pair.log || true
          } > EARTHLINE_COASTAL_STARVATION_PAIR_LATEST.txt
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add EARTHLINE_COASTAL_STARVATION_PAIR_LATEST.txt
          git commit -m "diag: record Texas California coastal starvation ratios" || exit 0
          git push origin HEAD:diag-aquifer-east-texas
