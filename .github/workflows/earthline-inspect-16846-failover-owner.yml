name: Earthline Inspect 16846 Failover Owner

on:
  push:
    branches: [us-launch-candidate-16844]
    paths:
      - '.github/workflows/earthline-inspect-16846-failover-owner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-16846-clean
      - name: Locate stale generation definition
        run: |
          grep -n -E 'function[[:space:]]+earthlineIsStale|earthlineIsStale[[:space:]]*=|const[[:space:]]+earthlineIsStale|let[[:space:]]+earthlineIsStale|var[[:space:]]+earthlineIsStale' index.html | head -20
          grep -n -E 'function[[:space:]]+earthlineNewGen|earthlineGen|myGen|generation' index.html | head -80
