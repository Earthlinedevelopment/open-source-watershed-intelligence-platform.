name: Earthline Inspect 16846 Failover Owner

on:
  push:
    branches: [us-launch-candidate-16844]
    paths:
      - '.github/workflows/earthline-inspect-16846-failover-owner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-16846-clean
      - name: Print stale-generation context
        run: |
          grep -n -m 3 -B 8 -A 12 'earthlineIsStale' index.html
