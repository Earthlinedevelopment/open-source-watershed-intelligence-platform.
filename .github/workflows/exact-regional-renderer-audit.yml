name: Mantra 83 Exact Regional Renderer Audit
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/exact-regional-renderer-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          for(const term of ['function renderRegionalOverlay16020','earthlineRenderRegionalOverlay16020=','earthline-swale-core-16168']){
            let from=0,n=0;
            while(true){
              const at=s.indexOf(term,from); if(at<0)break;
              console.log('RENDER '+JSON.stringify({term,at,text:s.slice(Math.max(0,at-3500),Math.min(s.length,at+14000))}));
              from=at+term.length;if(++n>=8)break;
            }
          }
          NODE
