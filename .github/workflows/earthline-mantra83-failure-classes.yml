name: Mantra 83 Failure Class Regression
on:
  push:
    branches: [mantra83-forensic]
    paths:
      - 'tests/mantra83-failure-classes.mjs'
      - '.github/workflows/earthline-mantra83-failure-classes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/mantra83-failure-classes.mjs
      - run: node tests/mantra83-full-purity.mjs
