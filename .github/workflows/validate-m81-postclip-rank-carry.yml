name: Validate M81 Post Clip Rank Carry
on:
  push:
    branches: [m81-postclip-rank-carry]
    paths:
      - index.html
      - .github/workflows/validate-m81-postclip-rank-carry.yml
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        round: [1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    name: "Round ${{ matrix.round }} · rank carry"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m81-postclip-rank-carry
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          EARTHLINE_CANDIDATE_ORIGIN: '1'
          STATES: Vermont|Colorado|Nevada|Arkansas|California|Texas
          OUT: rank-carry-${{ matrix.round }}.json
        run: node tests/validate-property-50states-final.mjs
