name: Mantra 46 16806 Midpoint Candidate Coverage

on:
  push:
    branches:
      - diagnostic-m46-16795-fine-coverage
    paths:
      - 'tests/mantra46-16806-midpoint-candidate-coverage.mjs'
      - '.github/workflows/mantra46-16806-midpoint-candidate-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Measure candidate midpoint coverage
        run: node tests/mantra46-16806-midpoint-candidate-coverage.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16806-midpoint-candidate-coverage
          path: artifacts/mantra46-16806-midpoint-candidate-coverage/
          if-no-files-found: error
