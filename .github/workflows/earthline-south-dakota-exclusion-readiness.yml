# validate-exclusion-clear-corridor-99ffb150
name: Earthline South Dakota Exclusion Readiness
on:
  push:
    branches: [candidate-next]
    paths:
      - 'tests/south-dakota-exclusion-readiness.mjs'
      - '.github/workflows/earthline-south-dakota-exclusion-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Diagnose South Dakota exclusion readiness with Overpass unavailable
        env:
          EARTHLINE_URL: 'https://earthlinedevelopment.org/'
        run: node tests/south-dakota-exclusion-readiness.mjs
