name: Earthline Mantra45 Coverage Refinement Resolution Probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-m45-coverage-resolution-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          git fetch origin pages-live
          mkdir -p /tmp/e64 /tmp/e72
          git show origin/pages-live:index.html > /tmp/base.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/base.html').read_text()
          old="loadDEM(tile16731.b,96,96,8000,'coverage-gap refinement '+tile16731.id)"
          assert s.count(old)==1, s.count(old)
          Path('/tmp/e64/index.html').write_text(s.replace(old,"loadDEM(tile16731.b,64,64,8000,'coverage-gap refinement '+tile16731.id)"))
          Path('/tmp/e72/index.html').write_text(s.replace(old,"loadDEM(tile16731.b,72,72,8000,'coverage-gap refinement '+tile16731.id)"))
          PY
          python3 -m http.server 8787 --bind 127.0.0.1 --directory /tmp/e64 >/tmp/e64.log 2>&1 &
          python3 -m http.server 8788 --bind 127.0.0.1 --directory /tmp/e72 >/tmp/e72.log 2>&1 &
          for port in 8787 8788; do
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:$port/index.html >/dev/null && break; sleep 1; done
          done
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Compare 64 and 72 refinement
        shell: bash
        run: |
          mkdir -p lab
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true});
          async function run(url,label,state,iteration){
            const page=await browser.newPage({viewport:{width:1800,height:1000}});
            let error=null;
            try{
              await page.goto(url+'?m45res='+label+'-'+state+'-'+iteration+'-'+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForSelector('#searchInput',{timeout:30000});
              await page.evaluate((q)=>{
                window.EARTHLINE_REGIONAL_COVERAGE_AUDIT_16731=null;
                const i=document.getElementById('searchInput'),b=document.getElementById('runBtn');
                i.value=q+' state';i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));b.click();
              },state);
              await page.waitForFunction(()=>{
                const p=window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167;
                const d=window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020;
                const s=window.EARTHLINE_SPATIAL_COVERAGE_SELECTION_16736;
                return s?.build==='EARTHLINE 16771'&&Number(p?.generated||0)>0&&Number(p?.generated||0)===Number(d?.swaleLines||0);
              },null,{timeout:70000,polling:100});
              await page.waitForTimeout(250);
            }catch(e){error=String(e&&e.message||e);}
            const snap=await page.evaluate(()=>{
              const perf=window.EARTHLINE_REGIONAL_PERFORMANCE_16191||{};
              const gap=window.EARTHLINE_COVERAGE_GAP_REFINEMENT_16731||{};
              const late=window.EARTHLINE_LATE_GAP_REFINEMENT_16741||{};
              const pub=window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167||{};
              const d=window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020||{};
              const flow=window.EARTHLINE_LAND_VALIDITY_FLOW_AUDIT_16584||{};
              const land=window.EARTHLINE_LAND_VALIDITY_16584||{};
              return {
                totalMs:Number(perf.totalMs||NaN),
                phaseTotalsMs:perf.phaseTotalsMs||null,
                gapTiles:Number(gap.selected?.length||0),
                gapMs:Number(gap.elapsedMs||0),
                gapAdded:Number(gap.added||0),
                highResCounts:gap.highResCounts16735||null,
                lateTiles:Number(late.selected?.length||0),
                lateMs:Number(late.elapsedMs||0),
                unresolved:Number(window.EARTHLINE_REGIONAL_COVERAGE_AUDIT_16731?.unresolved?.length||0),
                coveragePassed:window.EARTHLINE_REGIONAL_COVERAGE_AUDIT_16731?.passed===true,
                generated:Number(pub.generated||0),
                visible:Number(d.swaleLines||0),
                unsafe:Number(flow.unsafeSegments??NaN),
                waterReady:Array.isArray(land.waterParts)
              };
            }).catch(()=>({}));
            await page.close();
            return {label,state,iteration,error,...snap};
          }
          const rows=[];
          for(const state of ['vermont','oklahoma']){
            for(const [label,url] of [['r64','http://127.0.0.1:8787/index.html'],['r72','http://127.0.0.1:8788/index.html']]){
              for(let i=1;i<=2;i++)rows.push(await run(url,label,state,i));
            }
          }
          await browser.close();
          fs.writeFileSync('lab/mantra45-coverage-resolution-probe.json',JSON.stringify({at:new Date().toISOString(),rows},null,2));
          console.log(JSON.stringify(rows.map(r=>({label:r.label,state:r.state,iteration:r.iteration,error:r.error,totalMs:r.totalMs,gapMs:r.gapMs,gapTiles:r.gapTiles,gapAdded:r.gapAdded,late:r.lateTiles,unresolved:r.unresolved,coverage:r.coveragePassed,generated:r.generated,visible:r.visible,unsafe:r.unsafe}))));
          JS
      - name: Persist evidence
        shell: bash
        run: |
          git config user.name "Earthline Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add lab/mantra45-coverage-resolution-probe.json
          git commit -m "diag: persist Mantra45 coverage resolution probe [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
