name: Earthline No-Scab Map Integrity Gate

on:
  push:
    branches: [pages-live]
    paths:
      - 'index.html'
      - 'lab/map-integrity-gate.mjs'
      - '.github/workflows/earthline-map-integrity-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify rolled-back public product identity
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if curl -fsSL --max-time 25 "https://earthlinedevelopment.org/?mapintegrity=${GITHUB_RUN_ID}-${i}" -o /tmp/earthline.html; then
              has16603=0
              has16605=0
              grep -F 'lineSafe16584(retrySmooth16584)' /tmp/earthline.html >/dev/null && has16603=1 || true
              grep -F 'EARTHLINE 16605' /tmp/earthline.html >/dev/null && has16605=1 || true
              if [ "$has16603" -eq 1 ] && [ "$has16605" -eq 0 ]; then
                echo 'Public product is 16603 retained / 16605 rolled back.'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Public product identity mismatch.' >&2
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run map integrity gate
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
        run: node lab/map-integrity-gate.mjs
      - name: Upload map-integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthline-map-integrity-gate
          path: |
            /tmp/map-integrity-gate.json
            /tmp/map-integrity-*.png
          if-no-files-found: warn
          retention-days: 7
