name: Earthline Vancouver Adapter Generalization
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['tools/mantra74-vancouver-adapter-generalization.py']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          fetch-depth: 0
      - run: python3 tools/mantra74-vancouver-adapter-generalization.py
      - shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          for(const m of s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi))if(m[1].trim())new Function(m[1]);
          for(const x of ["nk.includes('vancouver island')","/vancouver\\s+island/i.test(String(q||\"\"))","EARTHLINE 16915 — Vancouver Island display hierarchy"])if(s.includes(x))throw Error(x);
          if(!s.includes("String(boundary16912&&boundary16912.capability||'')==='ca-cgndb-vancouver-island'"))throw Error('capability-gated BC adapter missing');
          NODE
          git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "Earthline Stability Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git rm -f tools/mantra74-vancouver-adapter-generalization.py .github/workflows/earthline-vancouver-adapter-generalization.yml
          git add index.html
          git commit -m "stability: make Canadian source adapter capability-driven"
          git push origin HEAD:recovery/mantra74-stability
