name: Earthline Inspect Regional Publication 16613
on:
  push:
    branches: [pages-live]
    paths:
      - 'lab/inspect-regional-publication-16613.mjs'
      - '.github/workflows/earthline-inspect-regional-publication-16613.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture Regional publication owner context
        run: node lab/inspect-regional-publication-16613.mjs > regional-publication-16613.txt
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: regional-publication-16613
          path: regional-publication-16613.txt
          retention-days: 1
