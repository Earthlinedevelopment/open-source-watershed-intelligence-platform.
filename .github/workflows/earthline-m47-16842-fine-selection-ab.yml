name: Earthline 16842 Fine Opportunity Selection A B
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-m47-16842-fine-selection-ab.yml'
      - 'lab/earthline-16842-fine-selection-ab.mjs'
permissions:
  contents: read
jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Run Arkansas 16842 fine-selection A/B
        run: node lab/earthline-16842-fine-selection-ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-16842-fine-selection-ab
          path: out/
          retention-days: 2
