name: Mantra 83 Property Four Percent Vermont
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - 'tests/mantra83-property-four-percent-vermont.mjs'
      - '.github/workflows/earthline-mantra83-property-four-percent-vermont.yml'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/mantra83-property-four-percent-vermont.mjs
