name: Essex Iowa genuine Property-path check
on:
  push:
    branches: [repair/restore-approved-copy-elder-20261114]
    paths: [.github/workflows/essex-iowa-real-route.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node tests/essex-iowa-working-route-reproduction.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-essex-iowa-current-public
          path: artifacts/essex-iowa-real-property
          retention-days: 14
