name: Earthline Build Clean Property Repair 17027
on:
  push:
    branches:
      - candidate-property-integrity-17019
    paths:
      - .github/workflows/build-clean-property-repair-17027.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-property-integrity-clean-17027
          fetch-depth: 0
      - name: Fetch isolated patch script
        run: |
          git fetch origin candidate-property-integrity-17019
          git show origin/candidate-property-integrity-17019:tools/apply-property-integrity-17027.py > /tmp/apply-17027.py
      - name: Apply and verify repair
        run: |
          python3 /tmp/apply-17027.py
          git diff --check
          test "$(git status --short | wc -l)" -eq 1
          git status --short
      - name: Commit clean candidate
        run: |
          git config user.name earthline-ci
          git config user.email actions@users.noreply.github.com
          git add index.html
          git commit -m "candidate: restore accepted Property density and repair handoff evidence owners"
          git push origin HEAD:candidate-property-integrity-clean-17027
