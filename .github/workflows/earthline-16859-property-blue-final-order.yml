# trigger 16859-owner-diag
name: Earthline 16859 authoritative renderer owner diagnostic
permissions:
  contents: write
on:
  push:
    branches:
      - fix-16859-property-blue-final-order
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-16859-property-blue-final-order
      - name: Extract authoritative renderer owner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          needle='earthlineApplyRendererOwnership15805'
          out=[f'NEEDLE: {needle} COUNT={t.count(needle)}']
          start=0;n=0
          while True:
              i=t.find(needle,start)
              if i<0: break
              n+=1
              out.append(f'--- occurrence {n} at {i} ---')
              out.append(t[max(0,i-1800):min(len(t),i+2600)])
              start=i+1
          Path('EARTHLINE-16859-OWNER-DIAG.txt').write_text('\n\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostic only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EARTHLINE-16859-OWNER-DIAG.txt
          git commit -m 'diag: authoritative 15805 renderer owner'
          git push origin HEAD:fix-16859-property-blue-final-order
