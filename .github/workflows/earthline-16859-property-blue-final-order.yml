name: Earthline 16859 Property blue final-order only
permissions:
  contents: write
on:
  push:
    branches:
      - fix-16859-property-blue-final-order
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-16859-property-blue-final-order
      - name: Apply blue layer after final renderer ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          old="if(mp.getLayer?.('earthline-property-swale-ditch-16166'))mp.moveLayer('earthline-property-swale-ditch-16166');if(typeof window.earthlineApplyRendererOwnership15805==='function')window.earthlineApplyRendererOwnership15805('property')"
          new="if(typeof window.earthlineApplyRendererOwnership15805==='function')window.earthlineApplyRendererOwnership15805('property');if(mp.getLayer?.('earthline-property-swale-ditch-16166'))mp.moveLayer('earthline-property-swale-ditch-16166')"
          c=t.count(old)
          if c != 1:
              raise SystemExit(f'expected exactly one 16858 pre-owner blue move, found {c}')
          blue="'line-color':'#008cff','line-width':['interpolate',['linear'],['zoom'],14,3.4,17,5.4,20,7.2],'line-opacity':1"
          if t.count(blue) != 1:
              raise SystemExit(f'expected existing 16857 blue style exactly once, found {t.count(blue)}')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Verify final-order-only repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          expected="if(typeof window.earthlineApplyRendererOwnership15805==='function')window.earthlineApplyRendererOwnership15805('property');if(mp.getLayer?.('earthline-property-swale-ditch-16166'))mp.moveLayer('earthline-property-swale-ditch-16166')"
          assert t.count(expected) == 1
          assert t.count("'line-color':'#008cff','line-width':['interpolate',['linear'],['zoom'],14,3.4,17,5.4,20,7.2],'line-opacity':1") == 1
          print('PASS: final renderer ownership completes before the existing blue Property layer is raised; color/width/pattern/geometry unchanged')
          PY
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'candidate: 16859 keep Property blue after final renderer owner'
          git push origin HEAD:fix-16859-property-blue-final-order
