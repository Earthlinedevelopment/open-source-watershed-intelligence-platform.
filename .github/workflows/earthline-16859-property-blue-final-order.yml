# trigger 16859-authoritative-blue
name: Earthline 16859 authoritative Property blue paint owner
permissions:
  contents: write
on:
  push:
    branches:
      - fix-16859-property-blue-final-order
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-16859-property-blue-final-order
      - name: Enforce existing blue in the authoritative renderer owner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          old='''    setGroup(active.water,flowOn);setGroup(active.swales,swaleOn);\n    setGroup(active.recharge,rechargeOn);setGroup(active.contours,contourOn);setGroup(active.aquifer,aquiferOn);'''
          new='''    setGroup(active.water,flowOn);setGroup(active.swales,swaleOn);\n    /* EARTHLINE 16859 — Property blue presentation only. The one authoritative\n       renderer owner reasserts the already-approved saturated blue paint after\n       every Property ownership handoff. Width, pattern, geometry and science stay unchanged. */\n    if(property){\n      try{\n        const blue16166="earthline-property-swale-ditch-16166";\n        if(earthlineMap.getLayer(blue16166)){\n          earthlineMap.setPaintProperty(blue16166,"line-color","#008cff");\n          earthlineMap.setPaintProperty(blue16166,"line-opacity",1);\n        }\n      }catch(_){ }\n    }\n    setGroup(active.recharge,rechargeOn);setGroup(active.contours,contourOn);setGroup(active.aquifer,aquiferOn);'''
          c=t.count(old)
          if c != 1:
              raise SystemExit(f'expected one authoritative setGroup handoff, found {c}')
          if t.count('EARTHLINE 16859 — Property blue presentation only'):
              raise SystemExit('16859 marker already present')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Verify presentation-only scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          assert t.count('EARTHLINE 16859 — Property blue presentation only') == 1
          assert 'earthlineMap.setPaintProperty(blue16166,"line-color","#008cff")' in t
          assert 'earthlineMap.setPaintProperty(blue16166,"line-opacity",1)' in t
          assert "'line-width':['interpolate',['linear'],['zoom'],14,3.4,17,5.4,20,7.2]" in t
          print('PASS: authoritative Property owner reasserts blue color/opacity only; width/pattern/geometry untouched')
          PY
      - name: Remove branch diagnostics and commit candidate
        shell: bash
        run: |
          rm -f EARTHLINE-16859-RENDERER-HANDOFF-DIAG.txt EARTHLINE-16859-OWNER-DIAG.txt EARTHLINE-16859-APPLY-OWNERSHIP.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html EARTHLINE-16859-RENDERER-HANDOFF-DIAG.txt EARTHLINE-16859-OWNER-DIAG.txt EARTHLINE-16859-APPLY-OWNERSHIP.txt || true
          git commit -m 'candidate: 16859 authoritative Property blue paint owner'
          git push origin HEAD:fix-16859-property-blue-final-order
