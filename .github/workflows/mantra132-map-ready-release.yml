name: M132 map initialization reliability gated patch
on:
  push:
    branches: [candidate/mantra132-exclusion-engineering]
    paths:
      - tools/mantra132-map-ready-wait.py
      - .github/workflows/mantra132-map-ready-release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: earthline-m132-map-ready
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/mantra132-exclusion-engineering
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact candidate to pinned live parent
        shell: bash
        run: |
          set -euo pipefail
          cp tools/mantra132-map-ready-wait.py /tmp/m132-ready.py
          git fetch origin pages-live
          git checkout -B pages-live origin/pages-live
          test "$(git rev-parse HEAD)" = "37d9aac3e4ccd162a346b9c403a25f0c597c4c1a"
          python3 /tmp/m132-ready.py
          test "$(git diff --name-only)" = "index.html"
      - name: Test browser and fail-closed evidence behavior
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          mkdir -p artifacts/m132-ready
          cat > artifacts/m132-ready/check.mjs <<'JS'
          import {chromium} from 'playwright';
          import {readFile,writeFile} from 'node:fs/promises';
          const html=await readFile('index.html');
          const b=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
          const p=await b.newPage({viewport:{width:1800,height:1000},serviceWorkers:'block'});
          const o={checks:{},errors:[]};p.on('pageerror',e=>o.errors.push(String(e)));
          await p.route('**/*',r=>r.request().isNavigationRequest()&&r.request().resourceType()==='document'?r.fulfill({status:200,contentType:'text/html; charset=utf-8',body:html}):r.continue());
          try{
            await p.goto('https://earthlinedevelopment.org/?m132mapready='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await p.locator('#searchInput').fill('Iowa');await p.locator('#searchInput').press('Enter');
            await p.waitForFunction(()=>!!window.EARTHLINE_LAST_LIVE_REGIONAL_RUN_15970,null,{timeout:100000});
            await p.waitForTimeout(1300);
            await p.evaluate(()=>{
              window.M132_CAMERA_HISTORY=[];
              const m=typeof earthlineMap!=='undefined'?earthlineMap:window.earthlineMap;
              const log=label=>window.M132_CAMERA_HISTORY.push({label,at:performance.now(),center:m.getCenter().toArray(),zoom:m.getZoom(),moving:m.isMoving()});
              m.on('moveend',()=>log('moveend'));
              m.on('movestart',()=>log('movestart'));
              m.stop();log('before-jump');m.jumpTo({center:[-93.51983,42.08043],zoom:17.7});log('after-jump');
            });
            await p.waitForTimeout(2700);
            o.preclick=await p.evaluate(()=>{
              const m=typeof earthlineMap!=='undefined'?earthlineMap:window.earthlineMap;
              return {center:m.getCenter().toArray(),zoom:m.getZoom(),history:window.M132_CAMERA_HISTORY,
                location:(typeof M!=='undefined'?M:window.M)?.loc};
            });
            await p.locator('#earthlineDeclareProperty16169').click({timeout:16000});
            await p.waitForFunction(()=>window.EARTHLINE_PROPERTY_RUN_AUDIT_16173?.settled===true,null,{timeout:105000});
            o.state=await p.evaluate(()=>{
              const m=typeof M!=='undefined'?M:window.M,a=window.EARTHLINE_PROPERTY_RUN_AUDIT_16173||{},sw=Array.isArray(m?.swales)?m.swales:[],v=m?.vectorNoBuildCoverage;
              return {result:a.result,error:a.error,swales:sw.length,coverage:v,
                maxSlope:Math.max(0,...sw.map(s=>Number(s.slope)||0)),
                location:m?.lastLocationIntegrity15801||m?.propertyRunFailure16539?.audit||window.EARTHLINE_LOCATION_INTEGRITY_15801||null,propertyFailure:m?.propertyRunFailure16539||null,mapCenter:(typeof earthlineMap!=='undefined'?earthlineMap:window.earthlineMap)?.getCenter?.(),
                safety:m?.safetyAudit15806?.verified,
                publication:m?.propertyPublication15816?.committed===true,
                stage:m?.swaleDiagnostics?.stage,cameraHistory:window.M132_CAMERA_HISTORY};
            });
            o.checks.gotEvidence=!!o.state.coverage?.publicationAllowed;
            o.checks.noLocationDrift=o.state.location?.ok!==false;
            o.checks.safeNoSteep=o.state.maxSlope<=4.00001;
            o.checks.safetyVerified=o.state.safety===true;
            o.checks.actualPublication=o.state.publication===true&&o.state.swales>0;
            o.checks.noPageErrors=o.errors.length===0;
            await p.screenshot({path:'artifacts/m132-ready/iowa.png',timeout:20000});
          }catch(e){o.failure=String(e)}
          await writeFile('artifacts/m132-ready/result.json',JSON.stringify(o,null,2));
          console.log('M132_MAP_READY_RESULT '+JSON.stringify(o).slice(0,14000));
          await b.close();
          if(o.failure||Object.keys(o.checks).length!==6||Object.values(o.checks).some(x=>!x))process.exitCode=1;
          JS
          node artifacts/m132-ready/check.mjs
      - name: Publish only tested map initialization readiness fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "index.html"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(live): wait for Mapbox initialization before excluding map-style evidence'
          git push origin HEAD:pages-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m132-map-ready-evidence
          path: artifacts/m132-ready/
          retention-days: 30
