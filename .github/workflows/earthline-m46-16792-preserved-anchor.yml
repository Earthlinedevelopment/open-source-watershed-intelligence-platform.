name: Mantra 46 16792 Preserved Anchor A-B
on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/mantra46-16792-preserved-anchor-ab.mjs'
      - '.github/workflows/earthline-m46-16792-preserved-anchor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserved-anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run preserved-anchor test
        run: node tests/mantra46-16792-preserved-anchor-ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16792-preserved-anchor
          path: artifacts/mantra46-16792-preserved-anchor/
          if-no-files-found: error
