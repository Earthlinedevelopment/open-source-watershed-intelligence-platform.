name: Earthline 16846 Direct Failover Proof

on:
  push:
    branches: [us-launch-candidate-16844]
    paths:
      - '.github/workflows/earthline-16846-california-failover-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-owner-failover:
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-16846-clean
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Build test-only wrapper around exact shipping owner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          anchor='    result.overpass.error="all-overpass-endpoints-failed: "+result.overpass.endpointAttempts16846.map(x=>x.endpoint+"="+(x.error||("HTTP "+x.httpStatus))).join("; ");\n    return false;\n  }\n  function earthlineTilequerySamples15862P(boundary){'
          inject='    result.overpass.error="all-overpass-endpoints-failed: "+result.overpass.endpointAttempts16846.map(x=>x.endpoint+"="+(x.error||("HTTP "+x.httpStatus))).join("; ");\n    return false;\n  }\n  window.EARTHLINE_DIRECT_FAILOVER_TEST_16846=(result,boundary)=>earthlineFetchOverpass15862P(result,boundary,M.searchGen);\n  function earthlineTilequerySamples15862P(boundary){'
          if s.count(anchor)!=1: raise SystemExit('shipping owner anchor changed')
          Path('/tmp/index-16846-direct-proof.html').write_text(s.replace(anchor,inject,1))
          PY
      - name: Verify clean release identity
        run: |
          test "$(git rev-parse HEAD)" = "1c6080f24288250a48aa735ef61f441a01783850"
          grep -q 'EARTHLINE 16846 — PROPERTY EXCLUSION SOURCE FAILOVER' index.html
          grep -q 'https://overpass-api.de/api/interpreter' index.html
          grep -q 'https://lz4.overpass-api.de/api/interpreter' index.html
      - name: Force canonical 504 and prove lz4 HTTP 200 takeover
        env:
          REP: ${{ matrix.rep }}
        run: |
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const html=fs.readFileSync('/tmp/index-16846-direct-proof.html','utf8');
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1200,height:800}});
          const requests=[];
          page.on('request',r=>{if(r.url().includes('overpass-api.de/api/interpreter'))requests.push({url:r.url(),method:r.method()});});
          await page.route('https://overpass-api.de/api/interpreter',route=>route.fulfill({status:504,contentType:'text/plain',body:'forced canonical failure'}));
          await page.route('https://lz4.overpass-api.de/api/interpreter',route=>route.fulfill({status:200,contentType:'application/json',body:'{"elements":[]}'}));
          await page.route('https://earthlinedevelopment.org/**',async route=>{
            const r=route.request();
            if(r.isNavigationRequest()&&r.resourceType()==='document') return route.fulfill({status:200,contentType:'text/html; charset=utf-8',body:html});
            return route.continue();
          });
          await page.goto('https://earthlinedevelopment.org/?direct-failover-16846='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForFunction(()=>typeof window.EARTHLINE_DIRECT_FAILOVER_TEST_16846==='function',{timeout:30000});
          const out=await page.evaluate(async()=>{
            const result={processedGeometryCount:0,overpass:{attempted:false,ok:false,error:null,roadGeometryCount:0,buildingGeometryCount:0,parkingGeometryCount:0,waterGeometryCount:0}};
            const boundary=[[-119.6550,37.9100],[-119.6540,37.9100],[-119.6540,37.9110],[-119.6550,37.9110]];
            const returned=await window.EARTHLINE_DIRECT_FAILOVER_TEST_16846(result,boundary);
            return {returned,overpass:result.overpass,processedGeometryCount:result.processedGeometryCount};
          });
          const a=out.overpass?.endpointAttempts16846||[];
          if(a.length!==2) throw new Error('expected exactly two endpoint attempts: '+JSON.stringify(out));
          if(a[0].endpoint!=='canonical'||a[0].httpStatus!==504||a[0].ok!==false) throw new Error('canonical failure not recorded: '+JSON.stringify(out));
          if(a[1].endpoint!=='lz4-direct-fallback'||a[1].httpStatus!==200||a[1].ok!==true) throw new Error('lz4 success not recorded: '+JSON.stringify(out));
          if(out.overpass?.ok!==true||out.overpass?.endpoint16846!=='lz4-direct-fallback'||out.overpass?.error!==null) throw new Error('fallback did not become authoritative: '+JSON.stringify(out));
          if(out.overpass?.rawElementCount!==0) throw new Error('controlled zero-feature response not preserved: '+JSON.stringify(out));
          if(out.returned!==false) throw new Error('zero-feature response should return no applied geometry while remaining a successful acquisition');
          if(!requests.some(x=>x.url==='https://overpass-api.de/api/interpreter')) throw new Error('canonical request not observed');
          if(!requests.some(x=>x.url==='https://lz4.overpass-api.de/api/interpreter')) throw new Error('lz4 request not observed');
          console.log(JSON.stringify({pass:true,rep:process.env.REP,requests,out}));
          await browser.close();
          NODE
