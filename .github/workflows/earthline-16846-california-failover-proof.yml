name: Earthline 16846 California Failover Proof

on:
  push:
    branches: [us-launch-candidate-16844]
    paths:
      - '.github/workflows/earthline-16846-california-failover-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forced-primary-failure:
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-16846-clean
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Build production-origin forced-failover harness
        shell: bash
        run: |
          cp lab/validate-16728-property-50states.mjs lab/property-16846-forced-failover.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lab/property-16846-forced-failover.mjs')
          s=p.read_text()
          s=s.replace("const rows=[];","const rows=[];\nconst CANDIDATE_HTML=fs.readFileSync('index.html','utf8');",1)
          anchor="  const page=await browser.newPage({viewport:{width:1600,height:900}});"
          inject=anchor+"\n  const overpassRequests=[];\n  page.on('request',r=>{if(r.url().includes('overpass-api.de/api/interpreter'))overpassRequests.push(r.url());});\n  await page.route('https://earthlinedevelopment.org/**',async route=>{const r=route.request();if(r.isNavigationRequest()&&r.resourceType()==='document')await route.fulfill({status:200,contentType:'text/html; charset=utf-8',body:CANDIDATE_HTML});else await route.continue();});\n  await page.route('https://overpass-api.de/api/interpreter',route=>route.fulfill({status:504,contentType:'text/plain',body:'forced-primary-failure-16846'}));"
          if s.count(anchor)!=1: raise SystemExit('newPage anchor changed')
          s=s.replace(anchor,inject,1)
          anchor2="  rows.push({state:stateName,elapsedMs:Date.now()-started,regionalMs,propertyMs,usedTarget,attempts,snap:s,failures,pass:failures.length===0});"
          repl2="  rows.push({state:stateName,overpassRequests,elapsedMs:Date.now()-started,regionalMs,propertyMs,usedTarget,attempts,snap:s,failures,pass:failures.length===0});"
          if s.count(anchor2)!=1: raise SystemExit('rows anchor changed')
          s=s.replace(anchor2,repl2,1)
          p.write_text(s)
          PY
      - name: Verify clean 16846 release marker
        run: grep -q 'EARTHLINE 16846 — PROPERTY EXCLUSION SOURCE FAILOVER' index.html
      - name: Run California with canonical endpoint forced to HTTP 504
        env:
          EARTHLINE_URL: 'https://earthlinedevelopment.org/'
          STATES: 'California'
          OUT: ca-16846-forced-${{ matrix.rep }}.json
        run: node lab/property-16846-forced-failover.mjs
      - name: Prove fallback request and safe publication
        env:
          OUT: ca-16846-forced-${{ matrix.rep }}.json
        run: |
          node - <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync(process.env.OUT,'utf8')); const r=x.rows[0];
          if(!x.pass||!r?.pass) throw new Error('Property did not pass under forced primary failure');
          if(!r.overpassRequests?.some(u=>u.includes('https://lz4.overpass-api.de/api/interpreter'))) throw new Error('lz4 fallback was not requested');
          if(!r.overpassRequests?.some(u=>u.includes('https://overpass-api.de/api/interpreter'))) throw new Error('canonical primary request not observed');
          if(!(Number(r.propertyMs)<=15000)) throw new Error('Property exceeded 15-second ceiling: '+r.propertyMs);
          if(r.snap?.published!==true||r.snap?.renderVerified!==true||r.snap?.safeVisible!==true) throw new Error('safe publication evidence missing');
          console.log(JSON.stringify({pass:true,propertyMs:r.propertyMs,requests:r.overpassRequests,published:r.snap.published,renderVerified:r.snap.renderVerified,safeVisible:r.snap.safeVisible}));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ca-16846-forced-production-origin-${{ matrix.rep }}
          path: ca-16846-forced-${{ matrix.rep }}.json
          retention-days: 3
