name: Earthline Elder Native JS Real AB 17542
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/earthline-elder-native-ab-real-17542.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17529
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:earthline-elder-worker-js-17527.js > earthline-elder-worker-js-17527.js
          git show origin/repair/property-one-click-17441:tests/elder-native-ab-real-17542.mjs > tests/elder-native-ab-real-17542.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps firefox
      - run: node tests/elder-native-ab-real-17542.mjs