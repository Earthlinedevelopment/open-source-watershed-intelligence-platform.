name: Earthline exact uploaded release deploy
on:
  push:
    branches: [ops/earthline-five-file-guarded-20261121]
permissions:
  contents: write
concurrency:
  group: earthline-exact-uploaded-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and deploy only five approved uploaded release files
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          git fetch origin '+refs/heads/pages-live:refs/remotes/origin/pages-live' '+refs/heads/candidate/swale-engine:refs/remotes/origin/candidate/swale-engine'
          LIVE_SHA="$(git rev-parse origin/pages-live)"
          git checkout -B earthline-release "$LIVE_SHA"
          test "$(sha256sum index.html | cut -d' ' -f1)" = '4bad128f0e1342c222cc2d25e05e0527d086280f4ca8cd24b0597ae0f37e4322'
          mkdir -p tools
          for f in earthline-elder-restored-17097.js earthline-elder-worker-17129.js earthline-property-swale-bridge.js earthline-property-swales.js; do
            git show "$SOURCE_SHA:$f" > "$f"
          done
          for f in tools/apply-swale-engine-candidate.py tools/adapter-16600.js tools/lock-16600.js; do
            git show "origin/candidate/swale-engine:$f" > "$f"
          done
          python3 tools/apply-swale-engine-candidate.py index.html /tmp/earthline-release-index.html
          mv /tmp/earthline-release-index.html index.html
          printf '%s\n' \
            '2c755c26ff4f65c0b6948c15118a6e526a574b9016087b79e86ddc52a7a44926  earthline-elder-restored-17097.js' \
            'cea459e8737cb39580639f000fa33910c11dd55952eeec0fa852e5dc4c37ffea  earthline-elder-worker-17129.js' \
            '37ac5f9b80785bc9cd23f92fd287271d93d6df25a242d6c2d70a5225d5c27ab6  earthline-property-swale-bridge.js' \
            '83fe88cf454b0d9198090664ceaf4ea6a3d0e50043e710e41928de43572ef9f7  earthline-property-swales.js' \
            'c97a1ad5c38bff7f23d7c07b63e75a88dda8a4f2ad7c6caf3c5d75ecd14ef088  index.html' \
            > /tmp/earthline-release-SHA256SUMS.txt
          sha256sum --check /tmp/earthline-release-SHA256SUMS.txt
          for f in earthline-elder-restored-17097.js earthline-elder-worker-17129.js earthline-property-swale-bridge.js earthline-property-swales.js; do
            node --check "$f"
          done
          git add -- index.html earthline-elder-restored-17097.js earthline-elder-worker-17129.js earthline-property-swale-bridge.js earthline-property-swales.js
          printf '%s\n' earthline-elder-restored-17097.js earthline-elder-worker-17129.js earthline-property-swale-bridge.js earthline-property-swales.js index.html > /tmp/expected-files
          git diff --cached --name-only > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git config user.name 'Earthline verified release'
          git config user.email 'earthline-release@users.noreply.github.com'
          git commit -m 'Release Earthline exact five-file clean swale and Elder build'
          git fetch origin '+refs/heads/pages-live:refs/remotes/origin/pages-live'
          test "$(git rev-parse origin/pages-live)" = "$LIVE_SHA"
          git push origin HEAD:pages-live
          echo 'EARTHLINE EXACT FIVE-FILE DEPLOYED'
