name: Earthline Current Property Prescriber Source
'on':
  push:
    branches: [candidate-next]
    paths:
      - tests/current-property-prescriber-source.mjs
      - .github/workflows/earthline-current-property-prescriber-source.yml
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/current-property-prescriber-source.mjs
      - run: cat property-prescriber-source.txt
