          ref: 229b6e94dad0cf7902b0072eb574685cfca11a23
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/world-gate-17550.mjs > tests/world-gate-17550.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
