name: Earthline M76 Cross-Slope Anchor Audit
on:
  push:
    branches:
      - recovery/mantra76-audit-restart
    paths:
      - .github/workflows/earthline-m76-cross-slope-anchor-audit.yml
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Find anchors
        run: |
          grep -n -F 'earthlineLocalSeedReachM76' index.html || true
          grep -n -F 'earthlineLocalContourReachM76(rawSeg15836,path15836)' index.html || true
