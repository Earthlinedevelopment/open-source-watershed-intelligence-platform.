name: Earthline Telemetry Repo Extract 17331
on:
  push:
    branches: [repair/browser-performance-live-17268]
    paths:
      - 'tests/extract-telemetry-repo-17331.py'
      - '.github/workflows/earthline-telemetry-repo-extract-17331.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/browser-performance-live-17268}
      - run: python3 tests/extract-telemetry-repo-17331.py
      - uses: actions/upload-artifact@v4
        with:
          name: telemetry-repo-snippet-17331
          path: telemetry-repo-snippet-17331.txt
