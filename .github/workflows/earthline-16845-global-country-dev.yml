name: Earthline 16845 Global Country Dev
on:
  push:
    branches: [global-search-development-16845]
    paths:
      - 'lab/apply-16845-global-country-owner.py'
      - 'lab/repair-16845-country-state-owner.py'
      - 'lab/add-16845-dev-preset-hook.py'
      - 'lab/earthline-16845-local-global-gate.mjs'
      - '.github/workflows/earthline-16845-global-country-dev.yml'
      - 'index.html'
permissions:
  contents: read
jobs:
  patch-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-search-development-16845
          fetch-depth: 0
      - name: Prepare isolated candidate and dev-only injector
        run: |
          python3 lab/apply-16845-global-country-owner.py
          python3 lab/repair-16845-country-state-owner.py
          python3 lab/add-16845-dev-preset-hook.py
      - name: Verify U.S. launch lock untouched
        run: |
          grep -q 'EARTHLINE 16845 — GLOBAL COUNTRY ATOMIC JURISDICTION OWNER' index.html
          git fetch origin us-launch-lock-16844
          test "$(git rev-parse origin/us-launch-lock-16844)" = "a795ff5f80ed3500cfe3d77c7f5d153462bef340"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start isolated candidate server
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-16845-http.log 2>&1 &
          sleep 2
      - name: Original global problem set plus U.S. controls
        env:
          EARTHLINE_URL: http://127.0.0.1:8787/
          TARGETS: Singapore|India|Australia|Indonesia|Philippines|Brunei|Cabo Verde|Comoros|Mauritius|Seychelles|Arkansas|Hawaii
        run: node lab/earthline-16845-local-global-gate.mjs
        continue-on-error: true
      - name: Preserve gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: earthline-16845-original-problem-gate
          path: |
            gate-16845.json
            gate-16845-*.jpg
          if-no-files-found: warn
          retention-days: 3
      - name: Prove dev-only injector was not persisted
        run: |
          git checkout -- index.html
          ! grep -q 'setDevPreset16845' index.html
          git diff --exit-code -- index.html
