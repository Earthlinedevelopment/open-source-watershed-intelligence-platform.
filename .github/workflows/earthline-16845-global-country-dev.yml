name: Earthline 16845 Global Country Dev
on:
  push:
    branches: [global-search-development-16845]
    paths:
      - 'lab/apply-16845-global-country-owner.py'
      - 'lab/earthline-16845-local-global-gate.mjs'
      - '.github/workflows/earthline-16845-global-country-dev.yml'
      - 'index.html'
permissions:
  contents: write
jobs:
  patch-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-search-development-16845
          fetch-depth: 0
      - name: Apply isolated country owner patch
        run: python3 lab/apply-16845-global-country-owner.py
      - name: Verify marker and U.S. launch lock untouched
        run: |
          grep -q 'EARTHLINE 16845 — GLOBAL COUNTRY ATOMIC JURISDICTION OWNER' index.html
          git fetch origin us-launch-lock-16844
          test "$(git rev-parse origin/us-launch-lock-16844)" = "a795ff5f80ed3500cfe3d77c7f5d153462bef340"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start isolated candidate server
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-16845-http.log 2>&1 &
          sleep 2
      - name: Mixed global and U.S. gate
        env:
          EARTHLINE_URL: http://127.0.0.1:8787/
          TARGETS: Singapore|India|Comoros|Arkansas|Hawaii
        run: node lab/earthline-16845-local-global-gate.mjs
        continue-on-error: true
      - name: Preserve gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: earthline-16845-isolated-global-gate
          path: |
            gate-16845.json
            gate-16845-*.jpg
          if-no-files-found: warn
          retention-days: 3
      - name: Commit isolated candidate only
        run: |
          if git diff --quiet -- index.html; then
            echo 'index already patched'
            exit 0
          fi
          git config user.name 'Earthline CI'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'candidate: 16845 global country atomic jurisdiction owner'
          git push origin HEAD:global-search-development-16845
