name: Mantra 83 Deploy First Property Elders Simple
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - 'tests/deploy-first-property-elders.mjs'
      - '.github/workflows/deploy-first-property-elders-simple.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra83-shadow-live
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cp tests/deploy-first-property-elders.mjs /tmp/deploy-first-property-elders.mjs
      - run: |
          git fetch origin pages-live
          git checkout -B pages-live origin/pages-live
          node /tmp/deploy-first-property-elders.mjs
          git config user.name earthline-ci
          git config user.email actions@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "repair: make Elder evidence ready on first Property completion"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
