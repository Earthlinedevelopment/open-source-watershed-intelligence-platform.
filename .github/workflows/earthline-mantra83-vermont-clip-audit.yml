name: Mantra 83 Vermont Clip Audit
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/earthline-mantra83-vermont-clip-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          for(const term of ['earthlineClipVermontProducts16178','earthlineClipVermontLine16178','function earthlineClipVermont']){
            let from=0,n=0;
            while(true){
              const at=s.indexOf(term,from);if(at<0)break;
              console.log('M83VTCLIP '+JSON.stringify({term,at,text:s.slice(Math.max(0,at-1400),Math.min(s.length,at+7000))}));
              from=at+term.length;if(++n>=12)break;
            }
          }
          NODE
