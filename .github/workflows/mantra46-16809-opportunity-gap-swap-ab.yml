name: Mantra 46 16809 Opportunity Gap Swap A-B
on:
  push:
    branches: [diagnostic-m46-16795-fine-coverage]
    paths:
      - 'tests/mantra46-16809-opportunity-gap-swap-ab.mjs'
      - '.github/workflows/mantra46-16809-opportunity-gap-swap-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run opportunity gap swap A-B
        run: node tests/mantra46-16809-opportunity-gap-swap-ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16809-opportunity-gap-swap-ab
          path: artifacts/mantra46-16809-opportunity-gap-swap-ab/
          if-no-files-found: error
