name: Earthline Regional SVG Renderer Trace
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/trace-regional-svg-renderer.py'
      - '.github/workflows/earthline-regional-svg-renderer-trace.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tests/trace-regional-svg-renderer.py
