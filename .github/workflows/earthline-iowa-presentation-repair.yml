name: Earthline Iowa Presentation Repair
on:
  push:
    branches: [recovery/mantra74-stability]
    paths:
      - tools/repair-iowa-property-presentation.py
      - .github/workflows/earthline-iowa-presentation-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/repair-iowa-property-presentation.py
      - run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          console.log('EARTHLINE_INLINE_SCRIPTS_OK',parsed);
          NODE
      - run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: keep Property ownership until swale presentation verifies"
          git push origin HEAD:recovery/mantra74-stability
