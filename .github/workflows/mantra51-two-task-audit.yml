name: Mantra 51 Two Task Audit
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-two-task-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='ignore')
          terms=[
            'function reportAquifers',
            'function visual',
            'function mapSvg',
            'el49-cover-map',
            'Technical screening map generated',
            'earthline-swale-examples',
            'swaleExamplesTitle',
            'earthlineCanonicalHowBioswales16923',
            'earthline-swales-professional-16389'
          ]
          for term in terms:
              print('\n###',term)
              st=0
              for _ in range(5):
                  i=s.find(term,st)
                  if i<0: break
                  print('POS',i)
                  print(s[max(0,i-2200):i+8000].replace('\n',' '))
                  st=i+len(term)
          PY
