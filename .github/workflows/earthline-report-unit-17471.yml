name: Earthline Fast Global Report Unit 17471
on:
  push:
    branches: [repair/mantra67-launch-final-17454]
    paths:
      - 'tests/report-unit-17471.mjs'
      - '.github/workflows/earthline-report-unit-17471.yml'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium firefox
      - run: python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/http.log 2>&1 & sleep 2
      - id: c
        continue-on-error: true
        run: env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='chromium' HEADLESS='true' node tests/report-unit-17471.mjs
      - id: f
        continue-on-error: true
        run: xvfb-run -a env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='firefox' HEADLESS='false' node tests/report-unit-17471.mjs
      - name: Persist
        if: always()
        run: |
          mkdir -p test-results/report-unit-17471
          cp artifacts/report-unit-17471/*.json test-results/report-unit-17471/ || true
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results/report-unit-17471
          git commit -m "test: persist report unit linux 17471" || true
          git pull --rebase origin repair/mantra67-launch-final-17454 || true
          git push origin HEAD:repair/mantra67-launch-final-17454 || true
      - name: Enforce
        if: steps.c.outcome != 'success' || steps.f.outcome != 'success'
        run: exit 1
  webkit:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install webkit
      - run: python3 -m http.server 8787 --bind 0.0.0.0 >/tmp/http.log 2>&1 & sleep 2
      - id: w
        continue-on-error: true
        run: env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='webkit' HEADLESS='false' node tests/report-unit-17471.mjs
      - name: Persist
        if: always()
        run: |
          mkdir -p test-results/report-unit-17471
          cp artifacts/report-unit-17471/*.json test-results/report-unit-17471/ || true
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results/report-unit-17471
          git commit -m "test: persist report unit webkit 17471" || true
          git pull --rebase origin repair/mantra67-launch-final-17454 || true
          git push origin HEAD:repair/mantra67-launch-final-17454 || true
      - name: Enforce
        if: steps.w.outcome != 'success'
        run: exit 1
