name: Earthline Property Contour Sampling Correction
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-property-contour-sampling-correction.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 0
      - name: Apply isolated contour sampling science
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old1="let levelStepRaw=medSlope*targetSpacingM15771;"
          new1="let levelStepRaw=medSlope*(isRegionalTile15769?targetSpacingM15771:targetSpacingM15771*.5);"
          old2="Math.min(320,requestedLevelCount15771)"
          new2="Math.min(512,requestedLevelCount15771)"
          for old,new in ((old1,new1),(old2,new2)):
              if s.count(old)!=1:
                  raise SystemExit("canonical contour sampling owner count="+str(s.count(old))+" for "+old)
              s=s.replace(old,new)
          p.write_text(s,encoding="utf-8")
          PY
          test "$(git diff --name-only)" = "index.html"
          git diff --check
      - name: Commit candidate science correction
        run: |
          git config user.name "Earthline Engine"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "science: sample Property contours densely before final spacing"
          git push origin HEAD:candidate-next
