name: Earthline 16745 Maryland Coverage Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-md-16745.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate Maryland
        shell: bash
        run: |
          set +e
          EARTHLINE_URL='https://earthlinedevelopment.org/' STATES='Maryland' OUT='md16745.json' node lab/validate-16731-coverage-gap.mjs
          cat md16745.json
          exit 0
