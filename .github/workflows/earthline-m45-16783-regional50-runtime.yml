name: Earthline 16783 Regional 50-State Runtime Gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-m45-16783-regional50-runtime.yml']
permissions:
  contents: write
jobs:
  certify:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - batch: b1
            states: "Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia"
          - batch: b2
            states: "Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland"
          - batch: b3
            states: "Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey"
          - batch: b4
            states: "New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina"
          - batch: b5
            states: "South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Certify live runtime batch
        shell: bash
        run: |
          set +e
          EARTHLINE_URL='https://earthlinedevelopment.org/' STATES='${{ matrix.states }}' OUT='runtime-${{ matrix.batch }}.json' node lab/validate-16783-machine.mjs
          code=$?
          echo "$code" > "runtime-${{ matrix.batch }}.exit"
          cat "runtime-${{ matrix.batch }}.json"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: "m45-16783-runtime-${{ matrix.batch }}"
          path: |
            runtime-${{ matrix.batch }}.json
            runtime-${{ matrix.batch }}.exit
          if-no-files-found: error
  aggregate:
    needs: certify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: m45-16783-runtime-*
          path: /tmp/m45-16783-runtime
          merge-multiple: true
      - name: Aggregate
        shell: bash
        run: |
          mkdir -p lab
          python3 - <<'PY'
          import json,glob,datetime,os
          rows=[]; exits={}
          for p in sorted(glob.glob('/tmp/m45-16783-runtime/runtime-*.json')):
              with open(p) as f: o=json.load(f)
              rows.extend(o.get('rows',[]))
              batch=os.path.basename(p).replace('runtime-','').replace('.json','')
              ep=p.replace('.json','.exit')
              exits[batch]=open(ep).read().strip() if os.path.exists(ep) else 'missing'
          failed=[{'state':r.get('state'),'failures':r.get('failures',[])} for r in rows if not r.get('pass')]
          out={
            'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'liveProduct':'EARTHLINE 16783',
            'pagesLiveCommit':'a4c6a361f4a14aa129a5e51430b521e05329a2ba',
            'count':len(rows),'passed':sum(1 for r in rows if r.get('pass')),
            'failed':failed,'batchExits':exits,
            'pass':len(rows)==50 and not failed and all(v=='0' for v in exits.values()),
            'rows':rows
          }
          with open('lab/mantra45-16783-regional50-runtime.json','w') as f: json.dump(out,f,indent=2)
          print(json.dumps({'count':out['count'],'passed':out['passed'],'failed':out['failed'],'batchExits':exits,'pass':out['pass']}))
          PY
      - name: Persist runtime gate
        shell: bash
        run: |
          git config user.name "Earthline Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add lab/mantra45-16783-regional50-runtime.json
          git commit -m "test: persist Mantra45 16783 50-state runtime gate [skip ci]" || true
          git pull --rebase origin main
          git push origin HEAD:main
