name: Mantra 51 Inspect Alaska SVG Pointer Blocker
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-inspect-alaska-svg-blocker.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: mantra51-global-repair-campaign}
      - name: Inspect SVG overlays and pointer events
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needles=["pointer-events:all","pointer-events: all","pointer-events:auto","pointer-events: auto","position:absolute","earthlineRecharge","<svg","map-area"]
          for needle in needles:
            print("\n===== "+needle+" =====")
            pos=0; count=0
            while count<80:
              i=s.lower().find(needle.lower(),pos)
              if i<0: break
              print(s[max(0,i-900):min(len(s),i+2200)].replace("\n"," "))
              print("\n---")
              pos=i+len(needle);count+=1
          PY
