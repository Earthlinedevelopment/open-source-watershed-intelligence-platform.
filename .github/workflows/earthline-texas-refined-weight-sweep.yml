name: Earthline Texas Supplemental Weight Sweep

on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/texas-refined-weight-sweep.mjs'
      - '.github/workflows/earthline-texas-refined-weight-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Governance preflight
        run: python tests/earthline-governance-preflight.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node tests/texas-refined-weight-sweep.mjs
