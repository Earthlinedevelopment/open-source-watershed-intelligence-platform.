name: Earthline Exact Arizona History Comparison
on:
  push:
    branches: [candidate-next]
    paths:
      - 'tests/exact-arizona-history-compare.mjs'
      - '.github/workflows/earthline-exact-arizona-history.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Compare exact Arizona control through history
        run: node tests/exact-arizona-history-compare.mjs
