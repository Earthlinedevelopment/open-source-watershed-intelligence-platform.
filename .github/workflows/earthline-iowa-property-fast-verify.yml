name: Earthline Iowa Property Fast Verify
on:
  push:
    branches: [recovery/mantra74-stability]
    paths:
      - .github/workflows/earthline-iowa-property-fast-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-regional-engine
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd harness
          npm install --no-save playwright@1.55.0
      - name: Verify Iowa Property
        shell: bash
        run: |
          cp harness/tests/iowa-live-diagnostic.mjs ./iowa-property-fast.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('iowa-property-fast.mjs')
          s=p.read_text()
          s=s.replace("await browser.close();","await page.screenshot({path:'iowa-property-fast.png',fullPage:false});\nawait browser.close();")
          p.write_text(s)
          PY
          python3 -m http.server 8787 --bind 127.0.0.1 --directory candidate >/tmp/iowa-property-fast-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          EARTHLINE_URL='http://127.0.0.1:8787/' node ./iowa-property-fast.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iowa-property-fast
          path: |
            iowa-live-diagnostic.json
            iowa-property-fast.png
