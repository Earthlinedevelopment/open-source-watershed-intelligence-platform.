name: Mantra 51 How Swales Numbering Audit
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - '.github/workflows/mantra51-how-swales-numbering-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='ignore')
          terms=['The core idea','If you have two minutes','If you have ten','If you are checking our work']
          for term in terms:
              i=s.find(term)
              print('\n###',term,'POS',i)
              if i>=0: print(s[max(0,i-3500):i+9000].replace('\n',' '))
          PY
