name: Earthline Apply Audit-Density Safety 17577
on:
  push:
    branches: [test/exclusion-three-17576]
    paths:
      - '.github/workflows/earthline-apply-audit-density-17577.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17577
          fetch-depth: 0
      - name: Align scientific safety sampling with final audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          # Narrow scientific path checks only: split usable corridors + 17576 safe smoothing helper.
          old='Math.ceil(Math.hypot(p[0]-prev[0],p[1]-prev[1])*2)'
          positions=[]
          start=0
          while True:
            i=s.find(old,start)
            if i<0: break
            positions.append(i); start=i+1
          if len(positions)<3:
            raise SystemExit(f'expected at least three half-cell checks, got {len(positions)}')
          # Replace the occurrence inside earthlineSafeCleanPath17576 and the occurrence
          # inside the scientific earthlineSplitUsableSegments only. Leave display-only
          # earthlineFinalSafeSegments15771 unchanged.
          ranges=[]
          for fn in ['function earthlineSafeCleanPath17576','function earthlineSplitUsableSegments']:
            a=s.find(fn)
            if a<0: raise SystemExit(fn+' missing')
            b=s.find('\nfunction ',a+10)
            if b<0: b=len(s)
            ranges.append((a,b))
          replaced=0
          for a,b in sorted(ranges, reverse=True):
            chunk=s[a:b]
            n=chunk.count(old)
            if n!=1: raise SystemExit(f'{s[a:a+60]} expected 1 density check, got {n}')
            chunk=chunk.replace(old,'Math.ceil(Math.hypot(p[0]-prev[0],p[1]-prev[1])*2.5)',1)
            s=s[:a]+chunk+s[b:]
            replaced+=1
          if replaced!=2: raise SystemExit('unexpected replacement count')
          p.write_text(s)
          PY
          git diff --check
          git diff -- index.html | head -160
          git config user.name "Earthline CI"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: match prescriber safety sampling to final audit 17577"
          git push origin HEAD:candidate/earthline-launch-17577
