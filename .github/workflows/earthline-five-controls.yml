name: Earthline Five Launch Controls

on:
  push:
    branches: [pages-live]
    paths:
      - 'tools/launch-controls.mjs'
      - '.github/workflows/earthline-five-controls.yml'
      - 'builds/16601/**'
      - 'builds/16602/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run authoritative five-location controls
        run: node tools/launch-controls.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthline-five-controls
          path: runtime-results/earthline-five-controls.json
          if-no-files-found: warn
          retention-days: 7
