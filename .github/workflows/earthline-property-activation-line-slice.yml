name: Earthline Property Activation Line Slice
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-property-activation-line-slice.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 0
      - run: |
          git show origin/pages-live:index.html > /tmp/live-index.html
          sed -n '33079,33117p' /tmp/live-index.html