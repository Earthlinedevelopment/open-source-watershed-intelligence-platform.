name: Mantra 47 16833 Refinement Source Extract

on:
  push:
    branches: [diagnostic-m47-16822-ar-pipeline]
    paths:
      - 'tests/mantra47-16833-source-extract.mjs'
      - '.github/workflows/earthline-m47-16833-source-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Extract live refinement source blocks
        run: node tests/mantra47-16833-source-extract.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra47-16833-source-extract
          path: artifacts/mantra47-16833-source-extract/
          if-no-files-found: error
