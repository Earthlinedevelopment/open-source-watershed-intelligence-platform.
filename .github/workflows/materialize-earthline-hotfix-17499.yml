name: Materialize Earthline Hotfix 17499
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/materialize-earthline-hotfix-17499.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/earthline-launch-17499, fetch-depth: 0}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/apply-property-single-elder-owner-17499.py > /tmp/a.py
          git show origin/repair/property-one-click-17441:tests/apply-elder-corridor-single-owner-17499.py > /tmp/b.py
          python3 /tmp/a.py
          python3 /tmp/b.py
      - run: |
          git config user.name "Earthline CI"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html earthline-launch-16872.js
          git commit -m "candidate: single governed Elder owner 17499"
          git push origin HEAD:candidate/earthline-launch-17499
