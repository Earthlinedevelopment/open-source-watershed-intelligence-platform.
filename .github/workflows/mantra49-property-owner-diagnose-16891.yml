name: Earthline Property owner diagnose 16891
on:
  push:
    branches:
      - mantra49-release-audit-clean-16882
    paths:
      - .github/workflows/mantra49-property-owner-diagnose-16891.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Show Property owner source anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['function terminalPropertyRun','if(running)return false','let running=false','running=false','earthlineDeclarePropertyAtCrosshair16173=terminalPropertyRun']:
              print('\n===',needle,'===')
              start=0; n=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  n+=1
                  print('MATCH',n,'OFFSET',i)
                  print(s[max(0,i-900):i+1800])
                  start=i+len(needle)
                  if n>=6: break
              if n==0: print('NO MATCH')
          PY
