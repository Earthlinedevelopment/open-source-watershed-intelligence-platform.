name: Mantra 46 16791 Iowa Arkansas Visual Capture

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/mantra46-16791-ia-ar-visual.mjs'
      - '.github/workflows/earthline-m46-16791-ia-ar-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture live Iowa Arkansas
        run: node tests/mantra46-16791-ia-ar-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16791-ia-ar-visual
          path: artifacts/mantra46-16791-ia-ar-visual/
          if-no-files-found: error
