name: Earthline Iowa Regional Engine Test
on:
  push:
    branches:
      - recovery/mantra75-engine-test
    paths:
      - tests/iowa-regional-test.mjs
      - .github/workflows/earthline-iowa-regional-engine-test.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-engine-test
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/iowa-regional-test-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node tests/iowa-regional-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iowa-regional-test
          path: |
            iowa-regional-test.json
            iowa-regional-test.png
