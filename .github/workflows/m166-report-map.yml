name: M166 repair report map location and actual aquifer geometry
on:
  push:
    branches: ['repair/m166-report-map-place-aquifers']
    paths: ['.github/workflows/m166-report-map.yml']
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fix report map only, no scientific changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          changes=[
            ("const title=(String(d?.tier||d?.mode||'regional').toLowerCase()==='focus'?'Earthline focus screening map':'Earthline Vermont regional screening map');",
             "const place=String(d?.query||d?.normalizedQuery||'Analysis area').trim(),title='Earthline '+place+' screening map';"),
            ('<text x="${pad}" y="20" fill="#153947" font-size="13" font-weight="800">${title}</text>',
             '<text x="${pad}" y="20" fill="#153947" font-size="13" font-weight="800">${esc(title)}</text><text x="${pad}" y="35" fill="#36535d" font-size="10">${esc(d?.placeLine||place)}</text>'),
            ("parts.push(`<path d=\"${pathCoords(state)}\" fill=\"none\" stroke=\"#5e7d72\" stroke-width=\"1.5\" opacity=\".9\"/>`);",
             "if(b[2]>-73.45&&b[0]<-71.4&&b[3]>42.7&&b[1]<45.1)parts.push(`<path d=\"${pathCoords(state)}\" fill=\"none\" stroke=\"#5e7d72\" stroke-width=\"1.5\" opacity=\".9\"/>`);"),
            ("for(const r of roads)parts.push(`<path d=\"${pathCoords(r)}\" fill=\"none\" stroke=\"#b59664\" stroke-width=\"1.15\" opacity=\".55\"/>`);",
             "if(b[2]>-73.45&&b[0]<-71.4&&b[3]>42.7&&b[1]<45.1)for(const r of roads)parts.push(`<path d=\"${pathCoords(r)}\" fill=\"none\" stroke=\"#b59664\" stroke-width=\"1.15\" opacity=\".55\"/>`);"),
            ("fc=src?._data||aquiferCache;","fc=src?._data||src?.serialize?.()?.data||(typeof aquiferCache!=='undefined'?aquiferCache:null);"),
            ("mapSvg(Object.assign({},d,{reportAquifer:data.reportAquifer}),","mapSvg(Object.assign({},d,{reportAquifer:data.reportAquifer,placeLine:data.placeLine}),")
          ]
          for a,b in changes:
            n=s.count(a);assert n in ([2] if 'mapSvg(Object' in a else [1]),(a[:50],n)
            s=s.replace(a,b)
          start=s.index("    function inFrame(f){",s.index("async function reportAquiferContext123"))
          end=s.index("    const deadline=Date.now()+2500;",start)
          old=s[start:end]
          new="""    function inFrame(f){
            if(!validBounds)return false;
            let west=Infinity,south=Infinity,east=-Infinity,north=-Infinity;
            const visit=x=>{
              if(!Array.isArray(x))return;
              if(x.length>=2&&typeof x[0]==='number'&&typeof x[1]==='number'){
                west=Math.min(west,x[0]);east=Math.max(east,x[0]);
                south=Math.min(south,x[1]);north=Math.max(north,x[1]);
              }else for(const v of x)visit(v);
            };
            visit(f?.geometry?.coordinates);
            /* Include verified polygons enclosing the map frame even when none
               of their vertices fall inside the frame. No synthesized aquifer. */
            return Number.isFinite(west)&&east>=b[0]&&west<=b[2]&&north>=b[1]&&south<=b[3];
          }
          """
          assert 'if(inside||!Array.isArray(x))return;' in old
          s=s[:start]+new+s[end:]
          assert s.count("const aq=d?.reportAquifer;")==1
          p.write_text(s)
          print('M166_REPORT_MAP_LOCATION_AND_BOUNDED_AQUIFER_PATCH')
          PY
      - name: Check source and all inline scripts syntax
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess
          class Scripts(HTMLParser):
            def __init__(self):super().__init__();self.in_script=False;self.buf='';self.blocks=[]
            def handle_starttag(self,tag,attrs):
              if tag=='script':self.in_script=True;self.buf='';self.type=dict(attrs).get('type','')
            def handle_data(self,data):
              if self.in_script:self.buf+=data
            def handle_endtag(self,tag):
              if tag=='script' and self.in_script:
                if self.type not in ['application/json','application/ld+json'] and self.buf.strip():self.blocks.append(self.buf)
                self.in_script=False
          a=Scripts();a.feed(Path('index.html').read_text())
          for i,s in enumerate(a.blocks):
            p=Path('/tmp/earthline-check-'+str(i)+'.js');p.write_text(s)
            q=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
            if q.returncode:raise RuntimeError(str(i)+' '+q.stderr[:500])
          print('M166_INLINE_SCRIPT_SYNTAX_PASS',len(a.blocks))
          PY
      - name: Commit candidate only after tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(report): show actual place and available bounded aquifer geometry on map"
          git push origin HEAD:repair/m166-report-map-place-aquifers
