name: Earthline M73 Production Stability Diagnostic
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-m73-production-stability-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Trace live first Property water lifecycle
        shell: bash
        run: |
          cat > /tmp/m73.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror:'+String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
          const BASE='https://earthlinedevelopment.org/?m73diag='+Date.now();
          await page.goto(BASE,{waitUntil:'domcontentloaded',timeout:90000});
          await page.waitForSelector('#searchInput',{timeout:30000});
          await page.waitForFunction(()=>window.earthlineMap||(typeof earthlineMap!=='undefined'&&earthlineMap),null,{timeout:30000,polling:100});
          const input=page.locator('#searchInput');
          await input.fill('Essex, Vermont');
          await page.waitForTimeout(700);
          const opts=page.locator('#earthlineSearchSuggestions15970 [role="option"]:visible');
          if(await opts.count()) await opts.first().click();
          await page.waitForTimeout(200);
          await page.locator('#runBtn').click();
          await page.waitForFunction(()=>{
            const d=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null;
            const tier=String(d&&(d.tier||d.mode)||'').toLowerCase();
            const busy=document.getElementById('runBtn')?.getAttribute('aria-busy')==='true';
            return tier==='regional'&&!busy;
          },null,{timeout:60000,polling:150});
          const hit=page.locator('#earthlineRegionalVectorOverlay16020 .earthline-swale-hit-16070:visible').first();
          if(!(await hit.count())) throw new Error('No visible Regional corridor hit in Essex');
          await hit.click({force:true});
          const zoom=page.getByRole('button',{name:/zoom to (this )?location/i}).first();
          if(!(await zoom.count())) throw new Error('Zoom to location unavailable');
          await zoom.click();
          await page.waitForFunction(()=>{
            const b=document.getElementById('earthlineDeclareProperty16169');
            return !!b&&!b.disabled;
          },null,{timeout:12000,polling:100});

          await page.evaluate(()=>{
            window.__M73={samples:[],events:[],started:performance.now()};
            const snap=(label)=> {
              const m=typeof M!=='undefined'?M:null;
              const st=window.earthlineRegional15778||null;
              const d=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null;
              const pub=m&&m.propertyPublication15816||null;
              const svg=document.getElementById('earthlinePropertyWaterOverlay15824');
              const cs=svg?getComputedStyle(svg):null;
              const row={
                t:Number((performance.now()-window.__M73.started).toFixed(1)),label,
                searchGen:Number(m&&m.searchGen||0),
                pubGen:pub?Number(pub.searchGen):null,
                committed:!!(pub&&pub.committed===true),
                safety:!!(pub&&pub.safetyVerified===true),
                analysisReady:!!(m&&m.analysisReady),
                mode:String(st&&st.mode||''),regionalActive:!!(st&&st.active),
                displayedTier:String(d&&(d.tier||d.mode)||'').toLowerCase(),
                propertyState:String(document.documentElement.dataset.earthlinePropertyRunState||''),
                runState:String(document.documentElement.dataset.earthlineRunState||''),
                svgExists:!!svg,svgConnected:!!(svg&&svg.isConnected),
                display:svg?String(cs&&cs.display||svg.style.display||''):'',
                children:svg?svg.childElementCount:0,
                renderer:m&&m.directWaterRenderer15824?JSON.parse(JSON.stringify(m.directWaterRenderer15824)):null
              };
              window.__M73.samples.push(row); if(window.__M73.samples.length>500)window.__M73.samples.shift();
              return row;
            };
            window.__M73.snap=snap;
            const origReplace=Element.prototype.replaceChildren;
            Element.prototype.replaceChildren=function(...args){
              if(this&&this.id==='earthlinePropertyWaterOverlay15824'){
                window.__M73.events.push({type:'replaceChildren',before:snap('before-replace'),argCount:args.length,stack:String(new Error().stack||'')});
              }
              const out=origReplace.apply(this,args);
              if(this&&this.id==='earthlinePropertyWaterOverlay15824'){
                window.__M73.events.push({type:'replaceChildren-after',after:snap('after-replace')});
              }
              return out;
            };
            const origRemoveChild=Node.prototype.removeChild;
            Node.prototype.removeChild=function(child){
              if(child&&child.id==='earthlinePropertyWaterOverlay15824')window.__M73.events.push({type:'removeChild',before:snap('before-remove'),stack:String(new Error().stack||'')});
              return origRemoveChild.call(this,child);
            };
            const mo=new MutationObserver(ms=>{
              for(const m of ms){
                const target=m.target;
                if(target&&target.id==='earthlinePropertyWaterOverlay15824'){
                  window.__M73.events.push({type:'mutation:'+m.type,attr:m.attributeName||null,snap:snap('mutation')});
                }
              }
            });
            mo.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['style','class']});
            for(const name of ['earthlineRenderDirectWater15824','earthlineSchedulePropertyWater15823','earthlineApplyRendererOwnership15805','earthlinePublishDisplayedRun16151','earthlineDeliverPropertyResult15817']){
              const fn=window[name];
              if(typeof fn!=='function')continue;
              window[name]=function(...args){
                window.__M73.events.push({type:'call:'+name,args:args.map(x=>typeof x==='object'?'[object]':String(x)),before:snap('before-'+name),stack:String(new Error().stack||'')});
                let out;
                try{out=fn.apply(this,args)}catch(e){window.__M73.events.push({type:'throw:'+name,error:String(e),after:snap('throw-'+name)});throw e}
                Promise.resolve(out).then(()=>window.__M73.events.push({type:'return:'+name,after:snap('return-'+name)})).catch(()=>{});
                return out;
              };
            }
          });

          const btn=page.locator('#earthlineDeclareProperty16169');
          await btn.click();
          let firstVisibleAt=null, firstOffAt=null;
          for(let i=0;i<240;i++){
            const row=await page.evaluate(()=>window.__M73.snap('poll'));
            const visible=row.svgExists&&row.display!=='none'&&row.children>0&&row.renderer&&row.renderer.visible===true;
            if(firstVisibleAt===null&&visible)firstVisibleAt=row.t;
            if(firstVisibleAt!==null&&firstOffAt===null&&!visible&&row.t>firstVisibleAt+100){firstOffAt=row.t;break;}
            await page.waitForTimeout(100);
          }
          const result=await page.evaluate(({firstVisibleAt,firstOffAt,errors})=>({
            firstVisibleAt,firstOffAt,
            final:window.__M73.snap('final'),
            events:(window.__M73.events||[]).slice(-120),
            samples:(window.__M73.samples||[]).slice(-180),
            propertyAudit:window.EARTHLINE_PROPERTY_RUN_AUDIT_16173||null,
            publicationAudit:window.EARTHLINE_PROPERTY_PUBLICATION_AUDIT_16220||null,
            runLedger:(window.EARTHLINE_RUN_LEDGER_16147||[]).slice(-30),
            errors
          }),{firstVisibleAt,firstOffAt,errors});
          console.log('EARTHLINE_M73_DIAGNOSTIC '+JSON.stringify(result));
          await browser.close();
          if(firstVisibleAt===null) process.exitCode=2;
          else if(firstOffAt!==null) process.exitCode=3;
          EOF
          node /tmp/m73.mjs
