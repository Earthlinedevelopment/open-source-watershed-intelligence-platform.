name: Earthline Public Iowa Regional Verify
on:
  push:
    branches:
      - recovery/mantra74-stability
    paths:
      - .github/workflows/public-iowa-regional-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/iowa-regional-live.mjs
