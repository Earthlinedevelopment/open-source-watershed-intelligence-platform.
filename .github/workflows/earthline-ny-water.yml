# 16633 NY-first launch gate after exact pruning inside the existing Regional flow-validity owner.
name: Earthline NY Water Regression

on:
  push:
    branches: [pages-live]
    paths:
      - 'index.html'
      - 'tests/ny-water-regression.mjs'
      - 'tests/vt-property-control.mjs'
      - 'tests/final-vt-ny-regression.mjs'
      - 'builds/16601/**'
      - 'builds/16602/**'
      - 'lab.html'
      - '.github/workflows/earthline-ny-water.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EARTHLINE_LIVE_URL: https://earthlinedevelopment.org/

jobs:
  ny-water:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exact live host has 16633 and promoted water path
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            html="$(curl -fsSL -A 'Earthline-launch-gate/16633' "${EARTHLINE_LIVE_URL}?earthline_probe=${GITHUB_SHA}-${i}" || true)"
            if grep -Fq 'builds/16601/earthline-shared-water-mask.js' <<<"$html" && grep -Fq 'builds/16602/earthline-regional-camera-scale.js' <<<"$html" && grep -Fq 'EARTHLINE 16628 — FINAL MAPPED-WATER MASK OWNS REGIONAL FLOWS' <<<"$html" && grep -Fq 'EARTHLINE 16629 — FINAL WATER MASK PRESERVES VALID FLOW ARROWS' <<<"$html" && grep -Fq 'EARTHLINE 16630 — SINGLE VALIDITY OWNER / NO DUPLICATE FLOW WALK' <<<"$html" && grep -Fq 'EARTHLINE 16631 — FAST EXACT IN-BOUNDS VALIDITY SAMPLER' <<<"$html" && grep -Fq 'EARTHLINE 16633 — EXACT PREFIX-PRUNED SAMPLE WALK.' <<<"$html"; then
              echo "EARTHLINE_LIVE_16633_READY host=${EARTHLINE_LIVE_URL} sha=${GITHUB_SHA} attempt=${i}"
              exit 0
            fi
            sleep 5
          done
          echo "Exact live host did not expose the full 16633 production lineage."
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run New York shoreline water regression on exact live host
        env:
          EARTHLINE_URL: ${{ env.EARTHLINE_LIVE_URL }}
        run: node tests/ny-water-regression.mjs
      - name: Run Vermont fixed Property control on exact live host
        env:
          EARTHLINE_URL: ${{ env.EARTHLINE_LIVE_URL }}
        run: node tests/vt-property-control.mjs
      - name: Run final Vermont New York regression on exact live host
        env:
          EARTHLINE_URL: ${{ env.EARTHLINE_LIVE_URL }}
        run: node tests/final-vt-ny-regression.mjs

# mantra37 trigger 16633
