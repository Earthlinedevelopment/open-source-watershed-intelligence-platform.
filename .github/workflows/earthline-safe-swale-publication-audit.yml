name: Earthline Safe Swale Publication Audit
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-safe-swale-publication-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - name: Extract authoritative safe-swale publication owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for term in [
            "authoritativeSafeSwales15815",
            "propertyResultLock15815",
            "propertyPublication15816",
            "safetyAudit15806",
            "authoritativePropertySwales15800"
          ]:
              print("\n===== "+term+" =====")
              start=0; n=0
              while True:
                  i=s.find(term,start)
                  if i<0 or n>=10: break
                  print(s[max(0,i-2600):min(len(s),i+6500)])
                  print("\n---")
                  start=i+len(term); n+=1
          PY
