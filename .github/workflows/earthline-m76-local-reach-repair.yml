name: Earthline M76 Local Contour Reach Repair
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths: ['.github/workflows/earthline-m76-local-reach-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra76-audit-restart
          fetch-depth: 0
      - name: Trim swales to local contour reach around runoff crossing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor="""function earthlineSegmentTortuosityM76(pts){
  if(!pts||pts.length<2)return Infinity;
  const lenM=earthlineSegmentLengthM(pts),a=pts[0],b=pts[pts.length-1];
  const chordM=Math.hypot(b[0]-a[0],b[1]-a[1])*M.cellM;
  return lenM/Math.max(1,chordM);
}"""
          helper=anchor+"""

/* EARTHLINE M76B — publish only the local contour reach that actually intercepts
   the runoff path. Never publish the entire traced contour fragment. */
function earthlineLocalContourReachM76(seg,path){
  if(!Array.isArray(seg)||seg.length<3||!Array.isArray(path)||!path.length)return seg;
  let bestI=0,bestD=Infinity;
  for(let i=0;i<seg.length;i++){
    const a=seg[i];
    for(let j=0;j<path.length;j++){
      const b=path[j],d=(a[0]-b[0])*(a[0]-b[0])+(a[1]-b[1])*(a[1]-b[1]);
      if(d<bestD){bestD=d;bestI=i;}
    }
  }
  const maxReachM=Math.max(36,Math.min(96,Number(M.cellM||1)*10));
  const halfM=maxReachM/2;
  let lo=bestI,hi=bestI,leftM=0,rightM=0;
  while(lo>0&&leftM<halfM){
    leftM+=Math.hypot(seg[lo][0]-seg[lo-1][0],seg[lo][1]-seg[lo-1][1])*M.cellM;
    lo--;
  }
  while(hi<seg.length-1&&rightM<halfM){
    rightM+=Math.hypot(seg[hi+1][0]-seg[hi][0],seg[hi+1][1]-seg[hi][1])*M.cellM;
    hi++;
  }
  const out=earthlineCleanPath(seg.slice(lo,hi+1));
  return out.length>=3?out:seg;
}"""
          if s.count(anchor)!=1:
              raise SystemExit(f'tortuosity anchor count {s.count(anchor)}')
          s=s.replace(anchor,helper,1)
          loop="for(const seg15836 of segs15836){"
          repl="""for(const rawSeg15836 of segs15836){
                    const seg15836=earthlineLocalContourReachM76(rawSeg15836,path15836);"""
          if s.count(loop)!=1:
              raise SystemExit(f'flow loop count {s.count(loop)}')
          s=s.replace(loop,repl,1)
          # Tighten construction-shape acceptance after trimming.
          s=s.replace("if(tortuosityM76>1.55)return false;","if(tortuosityM76>1.35)return false;",1)
          s=s.replace("if(lenM/Math.max(1,diagM)>1.80)return false;","if(lenM/Math.max(1,diagM)>1.55)return false;",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'function earthlineLocalContourReachM76' index.html
          grep -q 'const seg15836=earthlineLocalContourReachM76(rawSeg15836,path15836)' index.html
          grep -q 'tortuosityM76>1.35' index.html
          grep -q 'lenM/Math.max(1,diagM)>1.55' index.html
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1])}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          console.log('M76B_PARSE_OK');
          NODE
      - name: Commit product repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/earthline-m76-local-reach-repair.yml
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/earthline-m76-local-reach-repair.yml
          git commit -m "fix: trim swales to local runoff interception reach"
          git push origin HEAD:recovery/mantra76-audit-restart
