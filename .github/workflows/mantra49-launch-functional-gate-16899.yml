name: Earthline launch functional gate 16899
on:
  push:
    branches: [mantra49-final-wrap-16896]
    paths:
      - .github/workflows/mantra49-launch-functional-gate-16899.yml
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install playwright@1.55.0 --no-save
      - name: Launch functional checks
        run: |
          cat > launch16899.js <<'JS'
          const {chromium}=require('playwright');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const base='https://earthlinedevelopment.org/?launch16899='+Date.now();
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/chromium',args:['--no-sandbox']});
            const c=await b.newContext({viewport:{width:1600,height:900}}); const p=await c.newPage();
            const errs=[]; p.on('pageerror',e=>errs.push('page:'+e.message)); p.on('console',m=>{if(m.type()==='error'&&!/favicon|telemetry/i.test(m.text())) errs.push('console:'+m.text())});
            await p.goto(base,{waitUntil:'domcontentloaded',timeout:60000}); await p.waitForSelector('#searchInput',{timeout:30000}); await sleep(1800);
            const sel='#earthlineLanguage16488'; if(!(await p.locator(sel).count())) throw Error('language selector missing');
            async function lang(v,expect){await p.selectOption(sel,v); await sleep(350); const got=await p.locator('#runBtn').innerText(); const html=await p.evaluate(()=>document.documentElement.lang); console.log('LANG',v,JSON.stringify({got,html})); if(html!==v) throw Error(v+' html lang '+html); if(expect&&!expect.some(x=>got.includes(x))) throw Error(v+' run label '+got)}
            await lang('th',['เรียกใช้']); await p.reload({waitUntil:'domcontentloaded'}); await p.waitForSelector('#runBtn'); await sleep(1000); let th=await p.locator('#runBtn').innerText(); console.log('LANG_RELOAD_TH',th); if(!/เรียกใช้/.test(th)) throw Error('Thai refresh regression '+th);
            await lang('es',['EJECUTAR']); await lang('vi',['CHẠY']); await lang('en',['RUN']);
            const ids=['earthlineReportBtn','earthlineDataButton','earthlineContactBtn'];
            for(const id of ids){const n=await p.locator('#'+id).count(); console.log('SURFACE',id,n); if(!n) throw Error(id+' missing')}
            const geo=await p.evaluate(()=>{const btns=[...document.querySelectorAll('button,a,select')].filter(x=>{const r=x.getBoundingClientRect();return r.width>0&&r.height>0}); const bad=btns.filter(x=>{const r=x.getBoundingClientRect();return r.right>innerWidth+2||r.left<-2||r.bottom>innerHeight+200}).map(x=>({id:x.id,text:(x.textContent||'').trim().slice(0,40),r:{l:r.left,right:r.right,t:r.top,b:r.bottom}})); return {w:innerWidth,bad};}); console.log('LAYOUT',JSON.stringify(geo)); if(geo.bad.length) throw Error('taskbar/control overflow '+JSON.stringify(geo.bad.slice(0,5)));
            const cfg=await p.evaluate(async()=>{try{const r=await fetch('/earthline-search-limits.json',{cache:'no-store'}); return {status:r.status,text:await r.text()}}catch(e){return {err:String(e)}}}); console.log('CAPCFG',JSON.stringify(cfg)); if(cfg.status!==200) throw Error('search limit config unavailable'); let j; try{j=JSON.parse(cfg.text)}catch{throw Error('search limit config invalid json')} if(Number(j.guestDaily)<100||Number(j.accountDaily)<100||Number(j.perMinute)<1||j.failClosed!==true) throw Error('search limit config unsafe/unexpected '+cfg.text);
            await p.fill('#searchInput','Vermont'); const waiter=p.evaluate(()=>new Promise(resolve=>{let done=false;const f=(k,d)=>{if(done)return;done=true;resolve({k,d,state:document.documentElement.dataset.earthlineRunState||''})};document.addEventListener('earthline:analysis-complete',e=>f('complete',e.detail));document.addEventListener('earthline:analysis-failed',e=>f('failed',e.detail));setTimeout(()=>f('timeout',{}),55000)})); await p.press('#searchInput','Enter'); const rr=await waiter; console.log('REGIONAL',JSON.stringify(rr)); if(rr.k!=='complete'||rr.state!=='published') throw Error('regional failed '+JSON.stringify(rr));
            const cross=await p.evaluate(()=>window.EARTHLINE_PROPERTY_TARGET_16201||null); console.log('CROSSHAIR',JSON.stringify(cross)); if(!cross) throw Error('property target missing after regional');
            console.log('ERRORS',JSON.stringify(errs.slice(0,20))); if(errs.some(x=>/Uncaught|ReferenceError|TypeError/i.test(x))) throw Error('runtime JS errors '+JSON.stringify(errs.slice(0,10)));
            await b.close(); console.log('LAUNCH FUNCTIONAL GATE PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node launch16899.js
