name: Mantra 83 Live Line Extract
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/earthline-mantra83-live-line-extract.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.find("/* EARTHLINE 16841")
          b=s.find("EARTHLINE_LATE_GAP_REFINEMENT_16741",a)
          if a<0: raise SystemExit('16839 owner not found')
          if b<0: b=a+35000
          print(s[a:min(len(s),b+7000)])
          PY
