name: Mantra 83 Live Line Extract
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/earthline-mantra83-live-line-extract.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          for term in ['jurisdictionEligibleCount16539','preferredEligibleCount16539','candidatesBeforeJurisdiction16539']:
              pos=0
              while True:
                  i=s.find(term,pos)
                  if i<0: break
                  print('\nM83JURIS',term,i)
                  print(s[max(0,i-1800):min(len(s),i+5000)])
                  pos=i+len(term)
          PY
