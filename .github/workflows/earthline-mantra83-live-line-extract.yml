name: Mantra 83 Live Line Extract
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/earthline-mantra83-live-line-extract.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.find('async function makeContours')
          b=s.find('async function earthlineCooperativeYield16661',a)
          if a<0 or b<0: raise SystemExit('makeContours owner not found')
          print(s[a:b])
          PY
