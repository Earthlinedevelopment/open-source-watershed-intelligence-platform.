name: Mantra 83 Live Line Extract
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/earthline-mantra83-live-line-extract.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          term='swaleCandidateContours16609'
          pos=0
          while True:
              i=s.find(term,pos)
              if i<0: break
              print('\nM83_CAND_CONTOURS',i)
              print(s[max(0,i-2600):min(len(s),i+6200)])
              pos=i+len(term)
          PY
