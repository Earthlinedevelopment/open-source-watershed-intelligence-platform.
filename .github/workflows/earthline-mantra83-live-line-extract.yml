name: Mantra 83 Live Line Extract
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/earthline-mantra83-live-line-extract.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          i=s.find('async function jurisdictionEligibleCount16539')
          if i<0: raise SystemExit('owner not found')
          print(s[i:i+5200])
          PY
