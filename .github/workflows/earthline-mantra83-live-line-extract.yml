name: Mantra 83 Live Line Extract
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/earthline-mantra83-live-line-extract.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          grep -nE "earthlineMap|new mapboxgl\\.Map|const map=|let map=|var map=" index.html | head -80
