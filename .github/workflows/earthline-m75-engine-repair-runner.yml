name: Earthline M75 Engine Repair Runner
on:
  push:
    branches:
      - recovery/mantra74-stability
    paths:
      - tools/repair-m75-engine.py
      - .github/workflows/earthline-m75-engine-repair-runner.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-engine-repair
          fetch-depth: 0
      - run: python3 ../open-source-watershed-intelligence-platform./tools/repair-m75-engine.py
      - run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim()) continue;
            try{new Function(m[1])}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          console.log('EARTHLINE_M75_ENGINE_PARSE_OK');
          NODE
      - run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: repair Regional coverage budget and exact swale dedupe"
          git push origin HEAD:recovery/mantra75-engine-repair
