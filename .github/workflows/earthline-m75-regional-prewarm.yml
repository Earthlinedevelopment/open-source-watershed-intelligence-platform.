name: Earthline M75 Regional DEM Prewarm
on:
  push:
    branches: [recovery/mantra74-stability]
    paths:
      - tools/repair-m75-regional-prewarm.py
      - .github/workflows/earthline-m75-regional-prewarm.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-engine-atomic
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          path: harness
      - name: Apply Regional DEM prewarm
        run: python3 harness/tools/repair-m75-regional-prewarm.py
      - name: Parse page
        run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          console.log('EARTHLINE_M75_PREWARM_PARSE_OK',parsed);
          NODE
      - name: Commit candidate
        run: |
          git config user.name Earthlinedevelopment
          git config user.email info@earthlinedevelopment.org
          git add index.html
          git commit -m 'perf: prewarm Regional DEM tiles before serial hydrology'
          git push origin HEAD:recovery/mantra75-engine-atomic