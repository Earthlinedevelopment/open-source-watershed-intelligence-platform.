name: Earthline Live Presentation Owner Inspect
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-live-presentation-owner-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 0
      - run: |
          git show origin/pages-live:index.html > /tmp/live-index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/live-index.html').read_text(encoding='utf-8').splitlines()
          terms=['async function ensureTextureLayers','async function verifyPropertyTexture','function verifySafePropertyFallback16221','earthline-property-safe-visible-16221','earthline-property-swale-texture-16174']
          for term in terms:
              print('\n===== '+term+' =====')
              for i,line in enumerate(s):
                  if term in line:
                      for n in range(max(0,i-18),min(len(s),i+90)): print(f'{n+1}: {s[n]}')
                      break
          PY