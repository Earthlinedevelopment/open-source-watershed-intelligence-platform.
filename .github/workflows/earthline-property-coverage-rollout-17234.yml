name: Earthline Cross-Browser Refinement A-B 17243
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - '.github/workflows/earthline-property-coverage-rollout-17234.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  linux-engines:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply isolated cross-browser refinement repair
        shell: bash
        run: |
          python3 - <<'PY'
          p='index.html'
          s=open(p,encoding='utf-8').read()
          old="async function earthlineCooperativeYield16661(){if(globalThis.scheduler&&typeof globalThis.scheduler.yield==='function')return globalThis.scheduler.yield();return new Promise(r=>setTimeout(r,0));}"
          new="async function earthlineCooperativeYield16661(){if(globalThis.scheduler&&typeof globalThis.scheduler.yield==='function')return globalThis.scheduler.yield();return Promise.resolve();}"
          assert old in s
          s=s.replace(old,new,1)
          local_calls=[
            "makeSwales(h16702,c16702,false,swaleJurisdictionGeometry16539,null)",
            "makeSwales(h16730,c16730,false,swaleJurisdictionGeometry16539,null)",
            "makeSwales(sub16839,c16839,false,swaleJurisdictionGeometry16539,null)",
            "makeSwales(h16780,c16780,false,swaleJurisdictionGeometry16539,null)",
            "makeSwales(h16731,c16731,false,swaleJurisdictionGeometry16539,null)",
            "makeSwales(h16741,c16741,false,swaleJurisdictionGeometry16539,null)"
          ]
          for call in local_calls:
            assert call in s, call
            s=s.replace(call,call.replace("swaleJurisdictionGeometry16539","null"),1)
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Install browser
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve isolated candidate
        shell: bash
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run Texas and Vermont
        shell: bash
        run: |
          if [ '${{ matrix.browser }}' = 'firefox' ]; then
            xvfb-run -a env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='firefox' HEADLESS='false' WAIT_MS='120000' STATES='Texas|Vermont' node tests/mantra46-16791-50state-production.mjs
          else
            env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='chromium' HEADLESS='true' WAIT_MS='120000' STATES='Texas|Vermont' node tests/mantra46-16791-50state-production.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser17243-${{ matrix.browser }}
          path: artifacts/mantra46-16791-50state/
          if-no-files-found: warn

  webkit-macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply isolated cross-browser refinement repair
        shell: bash
        run: |
          python3 - <<'PY'
          p='index.html'
          s=open(p,encoding='utf-8').read()
          old="async function earthlineCooperativeYield16661(){if(globalThis.scheduler&&typeof globalThis.scheduler.yield==='function')return globalThis.scheduler.yield();return new Promise(r=>setTimeout(r,0));}"
          new="async function earthlineCooperativeYield16661(){if(globalThis.scheduler&&typeof globalThis.scheduler.yield==='function')return globalThis.scheduler.yield();return Promise.resolve();}"
          assert old in s
          s=s.replace(old,new,1)
          local_calls=[
            "makeSwales(h16702,c16702,false,swaleJurisdictionGeometry16539,null)",
            "makeSwales(h16730,c16730,false,swaleJurisdictionGeometry16539,null)",
            "makeSwales(sub16839,c16839,false,swaleJurisdictionGeometry16539,null)",
            "makeSwales(h16780,c16780,false,swaleJurisdictionGeometry16539,null)",
            "makeSwales(h16731,c16731,false,swaleJurisdictionGeometry16539,null)",
            "makeSwales(h16741,c16741,false,swaleJurisdictionGeometry16539,null)"
          ]
          for call in local_calls:
            assert call in s, call
            s=s.replace(call,call.replace("swaleJurisdictionGeometry16539","null"),1)
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Install WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - name: Serve isolated candidate
        shell: bash
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run Texas and Vermont
        run: env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='webkit' HEADLESS='true' WAIT_MS='120000' STATES='Texas|Vermont' node tests/mantra46-16791-50state-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser17243-webkit
          path: artifacts/mantra46-16791-50state/
          if-no-files-found: warn
