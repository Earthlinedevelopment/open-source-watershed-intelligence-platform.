name: Earthline Exact Clip Fast-Path A-B 17244
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - '.github/workflows/earthline-property-coverage-rollout-17234.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  linux-engines:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact boundary-clip fast path
        shell: bash
        run: |
          python3 - <<'PY'
          p='index.html'
          s=open(p,encoding='utf-8').read()
          old_yield="async function earthlineCooperativeYield16661(){if(globalThis.scheduler&&typeof globalThis.scheduler.yield==='function')return globalThis.scheduler.yield();return new Promise(r=>setTimeout(r,0));}"
          new_yield="async function earthlineCooperativeYield16661(){if(globalThis.scheduler&&typeof globalThis.scheduler.yield==='function')return globalThis.scheduler.yield();return Promise.resolve();}"
          assert old_yield in s
          s=s.replace(old_yield,new_yield,1)
          start=s.index("  function earthlineClipLine16539(coords,g){")
          end=s.index("  async function earthlineClipFeatureCollection16539",start)
          old=s[start:end]
          new=r'''  const earthlineBoundaryEdgeGrid17244=new WeakMap();
  function earthlineBoundaryEdgeIndex17244(g){
    const prepared=earthlinePrepareJurisdiction16539(g);if(!prepared)return null;
    let idx=earthlineBoundaryEdgeGrid17244.get(prepared);if(idx)return idx;
    const scale=8,cells=new Map();let edgeId=0;
    const addRing=ring=>{
      if(!Array.isArray(ring)||ring.length<2)return;
      for(let i=0,j=ring.length-1;i<ring.length;j=i++){
        const a=ring[j],b=ring[i];if(!earthlineFinitePoint16539(a)||!earthlineFinitePoint16539(b))continue;
        const minX=Math.min(Number(a[0]),Number(b[0])),maxX=Math.max(Number(a[0]),Number(b[0])),minY=Math.min(Number(a[1]),Number(b[1])),maxY=Math.max(Number(a[1]),Number(b[1]));
        const edge={id:edgeId++,minX,maxX,minY,maxY};
        const x0=Math.floor(minX*scale),x1=Math.floor(maxX*scale),y0=Math.floor(minY*scale),y1=Math.floor(maxY*scale);
        for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const k=x+','+y;let list=cells.get(k);if(!list)cells.set(k,list=[]);list.push(edge);}
      }
    };
    for(const poly of prepared.polygons||[]){addRing(poly.outer);for(const h of poly.holes||[])addRing(h.ring);}
    idx={scale,cells};earthlineBoundaryEdgeGrid17244.set(prepared,idx);return idx;
  }
  function earthlineLineMayTouchBoundary17244(raw,g){
    const idx=earthlineBoundaryEdgeIndex17244(g);if(!idx)return true;
    for(let i=1;i<raw.length;i++){
      const a=raw[i-1],b=raw[i],minX=Math.min(Number(a[0]),Number(b[0])),maxX=Math.max(Number(a[0]),Number(b[0])),minY=Math.min(Number(a[1]),Number(b[1])),maxY=Math.max(Number(a[1]),Number(b[1]));
      const x0=Math.floor(minX*idx.scale),x1=Math.floor(maxX*idx.scale),y0=Math.floor(minY*idx.scale),y1=Math.floor(maxY*idx.scale),seen=new Set();
      for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)for(const edge of (idx.cells.get(x+','+y)||[])){
        if(seen.has(edge.id))continue;seen.add(edge.id);
        if(edge.maxX>=minX&&edge.minX<=maxX&&edge.maxY>=minY&&edge.minY<=maxY)return true;
      }
    }
    return false;
  }
  function earthlineClipLine16539(coords,g){
    const raw=(coords||[]).filter(earthlineFinitePoint16539);if(raw.length<2)return [];
    const pts=[raw[0]];for(let i=1;i<raw.length;i++){const a=raw[i-1],b=raw[i],steps=Math.max(1,Math.ceil(Math.max(Math.abs(Number(b[0])-Number(a[0])),Math.abs(Number(b[1])-Number(a[1])))/.01));for(let k=1;k<=steps;k++)pts.push(earthlineInterpolate16539(a,b,k/steps));}
    if(!earthlineLineMayTouchBoundary17244(raw,g))return earthlinePointInJurisdiction16539(raw[0],g)?[pts]:[];
    const runs=[];let run=[];let prev=pts[0],prevIn=earthlinePointInJurisdiction16539(prev,g);if(prevIn)run=[prev];
    for(let i=1;i<pts.length;i++){const cur=pts[i],curIn=earthlinePointInJurisdiction16539(cur,g);if(prevIn&&curIn){if(!run.length)run=[prev];run.push(cur)}else if(prevIn&&!curIn){const x=earthlineBoundaryPoint16539(prev,cur,g,true);if(!run.length)run=[prev];run.push(x);if(run.length>=2)runs.push(run);run=[]}else if(!prevIn&&curIn){const x=earthlineBoundaryPoint16539(prev,cur,g,false);run=[x,cur]}prev=cur;prevIn=curIn;}
    if(run.length>=2)runs.push(run);return runs;
  }
'''
          s=s[:start]+new+s[end:]
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Install browser
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve isolated candidate
        shell: bash
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run Texas and Vermont
        shell: bash
        run: |
          if [ '${{ matrix.browser }}' = 'firefox' ]; then
            xvfb-run -a env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='firefox' HEADLESS='false' WAIT_MS='120000' STATES='Texas|Vermont' node tests/mantra46-16791-50state-production.mjs
          else
            env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='chromium' HEADLESS='true' WAIT_MS='120000' STATES='Texas|Vermont' node tests/mantra46-16791-50state-production.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clip17244-${{ matrix.browser }}
          path: artifacts/mantra46-16791-50state/
          if-no-files-found: warn

