name: Earthline Browser Regional Performance Diagnostic 17239
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - 'tests/mantra46-16791-50state-production.mjs'
      - '.github/workflows/earthline-property-coverage-rollout-17234.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose Texas and Vermont — Chromium
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          BROWSER: chromium
          HEADLESS: 'true'
          WAIT_MS: '120000'
          STATES: Texas|Vermont
        run: node tests/mantra46-16791-50state-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-diag-chromium-17239
          path: artifacts/mantra46-16791-50state/
          if-no-files-found: warn

  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Firefox and Xvfb
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps firefox
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Diagnose Texas and Vermont — Firefox headed
        shell: bash
        run: |
          xvfb-run -a env \
          EARTHLINE_URL='https://earthlinedevelopment.org/' \
          BROWSER='firefox' \
          HEADLESS='false' \
          WAIT_MS='120000' \
          STATES='Texas|Vermont' \
          node tests/mantra46-16791-50state-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-diag-firefox-17239
          path: artifacts/mantra46-16791-50state/
          if-no-files-found: warn

  safari-engine:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - name: Diagnose Texas and Vermont — WebKit on macOS
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          BROWSER: webkit
          HEADLESS: 'true'
          WAIT_MS: '120000'
          STATES: Texas|Vermont
        run: node tests/mantra46-16791-50state-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-diag-webkit-macos-17239
          path: artifacts/mantra46-16791-50state/
          if-no-files-found: warn

  branded-chromium:
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install branded browser
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          if [ '${{ matrix.browser }}' = 'edge' ]; then
            npx playwright install --with-deps msedge
          else
            npx playwright install --with-deps chrome
          fi
      - name: Diagnose Texas and Vermont — ${{ matrix.browser }}
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          BROWSER: ${{ matrix.browser }}
          HEADLESS: 'true'
          WAIT_MS: '120000'
          STATES: Texas|Vermont
        run: node tests/mantra46-16791-50state-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-diag-${{ matrix.browser }}-17239
          path: artifacts/mantra46-16791-50state/
          if-no-files-found: warn
