name: Earthline makeSwales Cross-Browser Profile 17257
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - 'tests/apply-makeswales-profile-17257.py'
      - '.github/workflows/earthline-property-coverage-rollout-17234.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply profiler and console forwarding
        shell: bash
        run: |
          python3 tests/apply-makeswales-profile-17257.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/mantra46-16791-50state-production.mjs')
          s=p.read_text(encoding='utf-8')
          old="  const page=await context.newPage();\n  const pageErrors=[];"
          new="  const page=await context.newPage();\n  page.on('console',m=>{const t=m.text();if(t.includes('EARTHLINE_MAKESWALES_PROFILE_17257'))console.log(t)});\n  const pageErrors=[];"
          if s.count(old)!=1: raise SystemExit('console anchor '+str(s.count(old)))
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Install browser
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve
        shell: bash
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Profile Texas and Vermont
        shell: bash
        run: |
          if [ '${{ matrix.browser }}' = 'firefox' ]; then
            xvfb-run -a env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='firefox' HEADLESS='false' WAIT_MS='120000' STATES='Texas|Vermont' node tests/mantra46-16791-50state-production.mjs || true
          else
            env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='chromium' HEADLESS='true' WAIT_MS='120000' STATES='Texas|Vermont' node tests/mantra46-16791-50state-production.mjs || true
          fi

  webkit:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply profiler and console forwarding
        shell: bash
        run: |
          python3 tests/apply-makeswales-profile-17257.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/mantra46-16791-50state-production.mjs')
          s=p.read_text(encoding='utf-8')
          old="  const page=await context.newPage();\n  const pageErrors=[];"
          new="  const page=await context.newPage();\n  page.on('console',m=>{const t=m.text();if(t.includes('EARTHLINE_MAKESWALES_PROFILE_17257'))console.log(t)});\n  const pageErrors=[];"
          if s.count(old)!=1: raise SystemExit('console anchor '+str(s.count(old)))
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Install WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - name: Serve
        shell: bash
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Profile Texas and Vermont
        run: env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='webkit' HEADLESS='true' WAIT_MS='120000' STATES='Texas|Vermont' node tests/mantra46-16791-50state-production.mjs || true
