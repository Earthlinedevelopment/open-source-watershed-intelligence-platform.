name: Earthline Seven-State Cross-Browser Gate 17236
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - 'lab/validate-16728-property-50states.mjs'
      - '.github/workflows/earthline-property-coverage-rollout-17234.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-gate:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright browser engines
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Run seven rollout states in ${{ matrix.browser }}
        shell: bash
        run: |
          set +e
          EARTHLINE_URL='https://earthlinedevelopment.org/' \
          BROWSER='${{ matrix.browser }}' \
          STATES='Arizona|New Mexico|Colorado|Texas|California|Vermont|New York' \
          OUT='property-rollout-${{ matrix.browser }}-17236.json' \
          node lab/validate-16728-property-50states.mjs
          code=$?
          echo "$code" > 'property-rollout-${{ matrix.browser }}-17236.exit'
          cat 'property-rollout-${{ matrix.browser }}-17236.json'
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-seven-state-${{ matrix.browser }}-17236
          path: |
            property-rollout-${{ matrix.browser }}-17236.json
            property-rollout-${{ matrix.browser }}-17236.exit
          if-no-files-found: error
      - name: Enforce browser gate
        if: always()
        shell: bash
        run: |
          test -f 'property-rollout-${{ matrix.browser }}-17236.exit'
          test "$(cat 'property-rollout-${{ matrix.browser }}-17236.exit')" = "0"
