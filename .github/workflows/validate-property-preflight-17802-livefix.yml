name: Validate Property Preflight 17802 Livefix
'on':
  push:
    branches:
      - property-preflight-17802-livefix
    paths:
      - .github/workflows/validate-property-preflight-17802-livefix.yml
      - tools/apply-regional-property-preflight.py
      - tools/upgrade-regional-property-preflight-17802.py
      - tests/validate-property-50states-final.mjs
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        state: [Vermont, Colorado, Nevada, Arkansas, California]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    name: Preflight — ${{ matrix.state }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: property-preflight-17802-livefix
      - name: Apply exact two-stage patch in working tree
        run: |
          python3 tools/apply-regional-property-preflight.py
          python3 tools/upgrade-regional-property-preflight-17802.py
          git diff --check
          grep -q 'EARTHLINE 17802' index.html
      - name: Extend diagnostic Regional timeout only
        run: sed -i 's/timeout:60000,polling:100/timeout:120000,polling:100/' tests/validate-property-50states-final.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start patched local candidate
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          sleep 1
      - name: Validate patched candidate
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          EARTHLINE_CANDIDATE_ORIGIN: '1'
          STATES: ${{ matrix.state }}
          OUT: result.json
        run: node tests/validate-property-50states-final.mjs
