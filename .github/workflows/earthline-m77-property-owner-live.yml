name: Earthline M77 Property Owner Validation

on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - ".github/workflows/earthline-m77-property-owner-live.yml"

permissions:
  contents: read

jobs:
  validate-pages-live:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0

      - name: Validate exact M77 live owner consolidation
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="28c19b3f792d9a2ee3936bd19b26e413e9427115"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"

          python3 <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          checks={
            "M77 markers": s.count("EARTHLINE M77") == 2,
            "strong same-run Property guard": s.count("pubGen===currentGen&&(!Number.isFinite(displayedGen)||displayedGen===currentGen)") == 1,
            "old weak Property guard retired": "function propertyActive(){const s=state(),m=model();return !!(m&&m.analysisReady&&s.mode==='property'&&!s.active)}" not in s,
            "delayed swale retry ladder retired": "[60,180,480,1100,2200]" not in s,
            "camera-motion texture republish retired": "['load','style.load','zoomend','moveend','rotateend','pitchend']" not in s,
            "post-await identity recheck": s.count("currentDisplayedM77") >= 2,
            "analysis-complete guarded sync": "earthline:analysis-complete',()=>{void syncTexture('analysis-complete')" in s,
            "single deterministic delivery": s.count("return attempt(0);") == 1,
          }
          bad=[k for k,v in checks.items() if not v]
          print(checks)
          if bad:
              raise SystemExit("M77 validation failed: "+", ".join(bad))
          PY

          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          let n=0;
          for(const m of s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)){
            if(!m[1].trim()) continue;
            new Function(m[1]);
            n++;
          }
          console.log('M77_INLINE_SCRIPT_PARSE_OK',n);
          NODE

          git diff --check
