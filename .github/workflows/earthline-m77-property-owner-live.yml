name: Earthline M77 Portable Exclusion Transport Diagnostic

on:
  push:
    branches:
      - recovery/mantra76-audit-restart
    paths:
      - ".github/workflows/earthline-m77-property-owner-live.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Lock live build
        run: |
          test "$(git rev-parse HEAD)" = "8d5809b8c36790e5a928e968818750e485b8b481"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install playwright@1.55.0
      - name: Capture exact portable exclusion transport result
        shell: bash
        run: |
          cat > m77-transport.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const candidates=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'];
          const executablePath=candidates.find(p=>fs.existsSync(p));
          if(!executablePath)throw new Error('installed Chrome/Chromium not found');
          console.log('M77_BROWSER',executablePath);
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          page.on('console',m=>console.log('PAGE',m.type(),m.text()));
          await page.goto('https://earthlinedevelopment.org/?m77transport='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForSelector('#searchInput',{timeout:30000});
          await page.fill('#searchInput','Colorado');
          await page.waitForSelector('#earthlineSearchSuggestions15970 button',{timeout:15000});
          await page.click('#runBtn');
          await page.waitForFunction(()=>{
            const r=document.documentElement,d=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null;
            const tier=String(d&&(d.tier||d.mode)||'').toLowerCase();
            return r.dataset.earthlineRunState==='published'&&(tier==='regional'||tier==='focus');
          },null,{timeout:75000});
          await page.evaluate(()=>{
            window.earthlineSetPropertyTarget16201({lat:40.6412,lng:-105.2237,source:'crosshair-m77-transport'},{openPanel:false});
          });
          await page.locator('#earthlineDeclareProperty16169').click({force:true});
          await page.waitForFunction(()=>{
            const m=(typeof M!=='undefined'?M:null);
            const a=window.EARTHLINE_PROPERTY_RUN_AUDIT_16173||null;
            return !!(m?.propertyRunFailure16539||a?.settled===true||document.documentElement.dataset.earthlinePropertyRunState==='idle');
          },null,{timeout:60000}).catch(()=>null);
          await page.waitForTimeout(600);
          const snap=await page.evaluate(()=>{
            const m=(typeof M!=='undefined'?M:null),v=m?.vectorNoBuildCoverage||{},infra=v.infrastructure15862P||{},op=infra.overpass||{};
            return {
              searchGen:Number(m?.searchGen),
              terrainStamp:String(m?.terrainStamp||''),
              failure:m?.propertyRunFailure16539||null,
              coverage:{
                scientificSourceOwner17631:v.scientificSourceOwner17631||null,
                evidencePath17630:v.evidencePath17630||null,
                verificationState:v.verificationState||null,
                unverifiedReason:v.unverifiedReason||null,
                sourceTier:v.sourceTier||null,
                acquisitionResult:v.acquisitionResult||null,
                publicationAllowed:v.publicationAllowed===true,
                featureCount:Number(v.featureCount||0),
                sourceFeatureCount:Number(v.sourceFeatureCount||0),
                processedFeatureCount:Number(v.processedFeatureCount||0)
              },
              overpass:{
                attempted:op.attempted,ok:op.ok,httpStatus:op.httpStatus,error:op.error,
                rawElementCount:op.rawElementCount,
                roadGeometryCount:op.roadGeometryCount,buildingGeometryCount:op.buildingGeometryCount,
                parkingGeometryCount:op.parkingGeometryCount,waterGeometryCount:op.waterGeometryCount,
                endpoint16846:op.endpoint16846,endpointAttempts16846:op.endpointAttempts16846||[]
              },
              owner:window.EARTHLINE_PORTABLE_EXCLUSION_OWNER_17631||null,
              runAudit:window.EARTHLINE_PROPERTY_RUN_AUDIT_16173||null
            };
          });
          console.log('M77_TRANSPORT_SNAPSHOT',JSON.stringify(snap));
          await browser.close();
          if(!snap.coverage.publicationAllowed)process.exitCode=17;
          JS
          node m77-transport.mjs
