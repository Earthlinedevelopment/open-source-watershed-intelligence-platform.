name: Earthline Mantra 70 First Property Blue Fix
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-m70-blue-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Patch authoritative first-Property water gate
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old='state.mode===\"property\"&&!state.active&&\\n      currentPublication'; new='currentPublication&&\\n      state.mode===\"property\"&&\\n      String((window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||{}).tier||(window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||{}).mode||document.documentElement.dataset.earthlineAnalysisTier||\"\").toLowerCase()===\"property\"'; assert s.count(old)==1, s.count(old); s=s.replace(old,new); marker='/* EARTHLINE 17564 — committed Property publication owns direct blue water; stale legacy Regional active state may not erase it. */\\n    '; anchor='return !!(\\n      M&&M.analysisReady&&\\n      currentPublication'; assert s.count(anchor)==1, s.count(anchor); s=s.replace(anchor,marker+anchor); p.write_text(s,encoding='utf-8')"
          node -e "const fs=require('fs'),s=fs.readFileSync('index.html','utf8'); if((s.match(/EARTHLINE 17564/g)||[]).length!==1)throw Error('17564 marker'); if((s.match(/function propertyActive15824\(\)/g)||[]).length!==1)throw Error('owner count'); for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){if(!m[1].trim())continue;try{new Function(m[1])}catch(e){throw Error('script '+i+' '+e.message)}}"
      - name: Publish patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Earthline Production Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git rm .github/workflows/earthline-m70-blue-fix.yml
          git add index.html
          git commit -m "fix: bind first Property blue water to committed Property owner"
          git push origin HEAD:pages-live
