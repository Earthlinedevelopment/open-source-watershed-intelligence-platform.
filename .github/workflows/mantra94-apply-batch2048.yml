name: M94 isolated 2048 batch candidate patch
on:
  push:
    branches: [candidate/mantra94-batch2048]
    paths:
      - .github/workflows/mantra94-apply-batch2048.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: One exact scheduling-only patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          patterns=[
             '(++yieldCount16661%384)===0',
             '(++finalScreenYield16661%384)===0',
             '(++featureIndex16661%384)===0'
          ]
          counts=[s.count(x) for x in patterns]
          assert counts==[1,1,2],f'Refuse unexpected production source, found {counts}'
          for x in patterns:s=s.replace(x,x.replace('%384','%2048'))
          assert s.count('%2048)===0')>=4
          p.write_text(s,encoding='utf-8')
          print('M94_BATCH_PATCH_ONLY '+str(dict(zip(patterns,counts))))
          PY
          git config user.name "earthline-ci"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "perf(mantra94): exact-science 2048-element cooperative yield batching"
          git push origin HEAD:candidate/mantra94-batch2048
