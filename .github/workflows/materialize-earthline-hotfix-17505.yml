name: Materialize Earthline Hotfix 17505
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/materialize-earthline-hotfix-17505.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/earthline-launch-17505, fetch-depth: 0}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/apply-elder-static-background-17505.py > /tmp/apply.py
          python3 /tmp/apply.py
      - run: |
          git config user.name "Earthline CI"
          git config user.email "info@earthlinedevelopment.org"
          git add earthline-launch-16872.js
          git commit -m "candidate: nonblocking Property Elder registry load 17505"
          git push origin HEAD:candidate/earthline-launch-17505
