name: Mantra 46 16804 Fast Opportunity Retry 2

on:
  push:
    branches:
      - diagnostic-m46-16795-fine-coverage
    paths:
      - '.github/workflows/mantra46-16804-fast-opportunity-retry2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Correct harness typo in workspace and run
        run: |
          sed -i 's/},q,{timeout:70000/},query,{timeout:70000/' tests/mantra46-16804-fast-opportunity-ab.mjs
          node tests/mantra46-16804-fast-opportunity-ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16804-fast-opportunity-retry2
          path: artifacts/mantra46-16804-fast-opportunity/
          if-no-files-found: error
