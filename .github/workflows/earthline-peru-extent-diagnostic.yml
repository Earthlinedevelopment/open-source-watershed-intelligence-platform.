name: Earthline Mantra 37 NY Repair

on:
  push:
    branches:
      - pages-live
    paths:
      - '.github/workflows/earthline-peru-extent-diagnostic.yml'
      - 'lab/mantra37-exact-prune.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact repair
        run: python lab/mantra37-exact-prune.py

      - name: Verify browser script syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('index.html','utf8');
          if ((s.match(/function earthlineRegionalSegmentValid16584\(/g)||[]).length !== 1) throw new Error('Regional validity owner count changed');
          if (!s.includes('EARTHLINE 16633 — EXACT PREFIX-PRUNED SAMPLE WALK.')) throw new Error('16633 marker missing');
          for (const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()) {
            const src = m[1];
            if (!src.trim()) continue;
            try { new Function(src); } catch (e) { throw new Error(`script ${i} syntax: ${e.message}`); }
          }
          console.log('browser script syntax verified');
          NODE

      - name: Publish repaired candidate to pages-live
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'Repair already present; no index delta.'
            exit 0
          fi
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'repair: 16633 exact NY Regional prefix prune'
          git push origin HEAD:pages-live
