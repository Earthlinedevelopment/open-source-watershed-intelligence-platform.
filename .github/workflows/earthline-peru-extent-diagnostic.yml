name: Earthline Peru Portugal Thailand Rollback Gate
on:
  push:
    branches: [pages-live]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Verify rolled-back public bytes
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..18}; do
            html="$(curl -fsSL --max-time 30 https://earthlinedevelopment.org/)"
            has16603=0
            has16605=0
            grep -F 'lineSafe16584(retrySmooth16584)' <<<"$html" >/dev/null && has16603=1 || true
            grep -F 'EARTHLINE 16605' <<<"$html" >/dev/null && has16605=1 || true
            if [ "$has16603" -eq 1 ] && [ "$has16605" -eq 0 ]; then exit 0; fi
            sleep 10
          done
          echo 'rolled-back public bytes not ready' >&2
          exit 1
      - name: Run Peru Portugal Thailand Regional diagnostic
        run: node lab/peru-extent-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peru-portugal-thailand-rollback-gate
          path: |
            /tmp/peru-extent-diagnostic.json
            /tmp/peru.png
            /tmp/thailand.png
            /tmp/portugal.png
          if-no-files-found: warn
