name: Earthline rollback to accepted 16989
on:
  push:
    branches:
      - pages-live
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Restore accepted 16989 index
        run: |
          git checkout d8f016e7276802d87eaf571f0f5e4e800b8fdc7d -- index.html
          git config user.name EarthlineBuildBot
          git config user.email info@earthlinedevelopment.org
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore accepted 16989 interactive index"
          git push origin HEAD:pages-live
