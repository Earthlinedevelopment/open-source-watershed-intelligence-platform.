name: M89 isolated exact one-hunk repair
on:
  push:
    branches:
      - repair/m89-null-interior-point-20261115
    paths:
      - .github/workflows/m89-isolated-patch-20261115.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Ensure isolated branch and apply exact repair
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/repair/m89-null-interior-point-20261115"
          python3 tools/apply-m89-isolated-20261115.py
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          grep -Fq 'rawLatM89' index.html
          git config user.name "Earthline Precision Patch"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix(m89): missing state INTPT must never become (0,0)"
          git push origin HEAD:repair/m89-null-interior-point-20261115
