name: Mantra 51 Inspect Regional Boundary Hook
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-inspect-regional-boundary-hook.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra51-global-repair-campaign
      - name: Print exact boundary hook
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needles=[
            "function earthlineAdministrativeCapability16539",
            "function earthlineResolveJurisdictionBoundary16539",
            "jurisdictionBoundaryPromise16539",
            "jurisdictionBoundary16539",
            "pointInPolygon",
            "clip"
          ]
          for needle in needles:
            print("\n===== "+needle+" =====")
            pos=0; count=0
            while count<12:
              i=s.find(needle,pos)
              if i<0: break
              print(s[max(0,i-2500):min(len(s),i+9000)])
              print("\n---")
              pos=i+len(needle);count+=1
          PY
