name: Mantra 51 Finish Report Visuals
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - 'scripts/report_visual_finish_16945.py'
      - '.github/workflows/mantra51-finish-report-visuals.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 scripts/report_visual_finish_16945.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          s=Path('index.html').read_text(errors='ignore')
          assert 'Hydrology and Bioswale Opportunity Plan' in s
          assert 'paperTexture' in s
          assert 'Mapped aquifer context</text>' in s
          assert 'Contour / elevation</text>' in s
          assert "metric('Mapped aquifer context',reportAquifers().length" in s
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.ins=False; self.buf=[]; self.scripts=[]
              def handle_starttag(self,t,a):
                  if t.lower()=='script': self.ins=True; self.buf=[]
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.ins:self.scripts.append(''.join(self.buf));self.ins=False
              def handle_data(self,d):
                  if self.ins:self.buf.append(d)
          p=P();p.feed(s)
          out=Path('/tmp/el-js');out.mkdir(exist_ok=True)
          for i,j in enumerate(p.scripts):(out/f'{i:03}.js').write_text(j)
          PY
          for f in /tmp/el-js/*.js; do node --check "$f" >/dev/null; done
          git config user.name Earthlinedevelopment
          git config user.email info@earthlinedevelopment.org
          git add index.html
          git commit -m 'fix: finish professional report map presentation'
          git push
