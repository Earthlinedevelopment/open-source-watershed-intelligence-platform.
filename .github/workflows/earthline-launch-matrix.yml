name: Earthline Shared Regional Terrain Repair

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/repair-shared-terrain-deadline.py'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-terrain-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact shared terrain-owner repair
        run: python tests/repair-shared-terrain-deadline.py
      - name: Verify delta
        run: |
          git diff --check
          git diff -- index.html
          grep -F "const openGrid16201=focusMode?220:96,mapGrid16201=focusMode?180:96;" index.html >/dev/null
          grep -F "const openBudget16353=focusMode?14000:6000;" index.html >/dev/null
          grep -F "const fallbackBudget16353=focusMode?10000:6500;" index.html >/dev/null
      - name: Commit repaired product
        run: |
          git config user.name "Earthline Repair Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "repair: stabilize shared Regional terrain source deadlines"
          git push
