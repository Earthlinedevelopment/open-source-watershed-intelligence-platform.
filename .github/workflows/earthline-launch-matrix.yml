name: Earthline Launch Matrix

on:
  push:
    branches: [pages-live]
    paths:
      - 'lab.html'
      - 'lab/**'
      - 'builds/**'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  us-regional:
    name: US Regional shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run current public US Regional tests
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          EARTHLINE_AREA: US
          EARTHLINE_SHARD_INDEX: ${{ matrix.shard }}
          EARTHLINE_SHARD_TOTAL: 5
        run: node lab/launch-matrix.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthline-regional-us-${{ matrix.shard }}
          path: lab-results/regional-us-${{ matrix.shard }}-of-5.json
          if-no-files-found: warn
          retention-days: 7

  se-asia-regional:
    name: Southeast Asia Regional
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run current public Southeast Asia Regional tests
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          EARTHLINE_AREA: SEA
          EARTHLINE_SHARD_INDEX: 0
          EARTHLINE_SHARD_TOTAL: 1
        run: node lab/launch-matrix.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthline-regional-se-asia
          path: lab-results/regional-sea-0-of-1.json
          if-no-files-found: warn
          retention-days: 7
