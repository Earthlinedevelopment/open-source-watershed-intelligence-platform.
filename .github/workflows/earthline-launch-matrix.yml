name: Earthline East Texas Candidate Fate Diagnostic

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/texas-east-candidate-fate-diagnostic.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  east-texas-candidate-fate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Trace east Texas candidate fate
        run: node tests/texas-east-candidate-fate-diagnostic.mjs
