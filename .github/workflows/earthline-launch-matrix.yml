name: Earthline Launch Matrix

on:
  push:
    branches: [pages-live]
    paths:
      - 'lab.html'
      - 'lab/**'
      - 'builds/**'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Earthline current public launch matrix
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
        run: node lab/launch-matrix.mjs
      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthline-launch-matrix-current
          path: lab-results/earthline-launch-matrix-current.json
          if-no-files-found: warn
          retention-days: 7
