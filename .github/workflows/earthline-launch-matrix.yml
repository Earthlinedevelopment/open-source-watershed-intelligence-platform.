name: Earthline Existing Renderer Cold-Run Repair

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/repair-shared-renderer-resize.py'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-existing-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact renderer repair
        run: python tests/repair-shared-renderer-resize.py
      - name: Verify delta
        run: |
          git diff --check
          git diff -- index.html
          grep -F "lastResizeRunToken16020" index.html >/dev/null
          grep -F "map.resize&&map.resize()" index.html >/dev/null
      - name: Commit repaired product
        run: |
          git config user.name "Earthline Repair Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "repair: synchronize existing Regional renderer before projection"
          git push
