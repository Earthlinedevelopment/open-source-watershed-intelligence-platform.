name: Earthline Final Shared Regional Candidate Gate

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/shared-regional-candidate-final.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-shared-regional-candidate-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Texas New York Vermont final shared candidate gate
        run: node tests/shared-regional-candidate-final.mjs
