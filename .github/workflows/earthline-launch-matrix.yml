name: Earthline Texas Louisiana Neighbor Diagnostic

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/texas-louisiana-neighbor-state-diagnostic.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texas-louisiana-neighbor-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Texas Louisiana neighbor-state diagnostic
        run: node tests/texas-louisiana-neighbor-state-diagnostic.mjs
