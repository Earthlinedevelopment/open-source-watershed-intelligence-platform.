name: Earthline Coarse-Step Quantile Candidate Gate

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/shared-coarse-step-quantile-gate.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coarse-step-quantile-candidate-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run coarse-step quantile candidate gate
        run: node tests/shared-coarse-step-quantile-gate.mjs
