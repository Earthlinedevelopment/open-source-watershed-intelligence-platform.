name: Earthline Texas Phase Owner Trace

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/extract-texas-publication-owner.py'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-owner-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Trace existing Texas phase owners
        run: python tests/extract-texas-publication-owner.py
