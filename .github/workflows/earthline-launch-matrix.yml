name: Earthline Texas Hotspot Extract

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/extract-texas-hotspots.py'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-hotspots:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Extract swale and boundary hotspots
        run: python tests/extract-texas-hotspots.py
      - name: Upload hotspot extract
        uses: actions/upload-artifact@v4
        with:
          name: texas-hotspots-extract
          path: texas-hotspots-extract.txt
          if-no-files-found: error
          retention-days: 1
