name: Earthline Texas Publication Owner Extract

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/extract-texas-publication-owner.py'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-publication-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact publication owner
        run: python tests/extract-texas-publication-owner.py
      - name: Upload publication owner evidence
        uses: actions/upload-artifact@v4
        with:
          name: texas-publication-owner-extract
          path: texas-publication-owner-extract.txt
          if-no-files-found: error
          retention-days: 1
