name: Earthline Texas Geographic Containment Gate

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/texas-containment-probe.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tx-containment-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run live Texas geographic containment gate
        run: node tests/texas-containment-probe.mjs
      - name: Upload containment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-geographic-containment-gate
          path: |
            texas-containment-probe.json
            texas-containment-probe.png
          if-no-files-found: error
          retention-days: 1
