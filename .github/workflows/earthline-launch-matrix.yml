name: Earthline Shared Boundary Transport Repair

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/repair-shared-boundary-transport.py'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-boundary-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact shared-owner repair
        run: python tests/repair-shared-boundary-transport.py
      - name: Verify delta
        run: |
          git diff --check
          git diff -- index.html
          grep -F "maxAllowableOffset:'0.0025'" index.html >/dev/null
          grep -F "f:'geojson'" index.html >/dev/null
          if grep -F "const raw=await jsonp(cap.endpoint,params,6500)" index.html >/dev/null; then exit 1; fi
      - name: Commit repaired product
        run: |
          git config user.name "Earthline Repair Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "repair: restore reliable shared boundary transport"
          git push
