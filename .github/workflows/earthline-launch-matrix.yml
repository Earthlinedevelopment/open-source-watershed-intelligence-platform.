name: Earthline Launch Matrix
# Mantra 32 full U.S. rerun against current public 16611 state core.

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  us-regional:
    name: US Regional shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wait for exact public 16610 launch core
        run: |
          for i in $(seq 1 36); do
            body="$(curl -fsSL "https://earthlinedevelopment.org/?gate=${GITHUB_SHA}" || true)"
            if printf '%s' "$body" | grep -q 'EARTHLINE 16610 — DIRECT VECTOR WATER SOURCE QUERY'; then
              echo 'Exact 16610 launch core is live.'
              exit 0
            fi
            sleep 5
          done
          echo 'Public surface did not expose exact 16610 launch core.' >&2
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run all U.S. Regional tests
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          EARTHLINE_AREA: US
          EARTHLINE_SHARD_INDEX: ${{ matrix.shard }}
          EARTHLINE_SHARD_TOTAL: 5
        run: node lab/launch-matrix.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthline-regional-us-${{ matrix.shard }}
          path: lab-results/regional-us-${{ matrix.shard }}-of-5.json
          if-no-files-found: warn
          retention-days: 7
