name: Earthline Texas Live P-P-R Gate

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/texas-live-ppr.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texas-live-ppr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run live Texas Property Property Regional gate
        run: node tests/texas-live-ppr.mjs
