name: Earthline Texas Live Five Run Gate

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/texas-candidate-diagnostic.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texas-live-five-run-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run live Texas five-run gate
        env:
          EARTHLINE_URL: 'https://earthlinedevelopment.org/'
        run: node tests/texas-candidate-diagnostic.mjs
