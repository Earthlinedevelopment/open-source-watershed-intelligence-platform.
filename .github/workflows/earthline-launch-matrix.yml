name: Earthline Shared Regional Renderer Extract

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/extract-regional-renderer-owner.py'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-regional-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Extract shared Regional renderer owner
        run: python tests/extract-regional-renderer-owner.py
      - name: Upload renderer extract
        uses: actions/upload-artifact@v4
        with:
          name: regional-renderer-owner-extract
          path: regional-renderer-owner-extract.txt
          if-no-files-found: error
          retention-days: 1
