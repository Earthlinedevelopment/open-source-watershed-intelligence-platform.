name: Earthline Shared Regional No-Camera Gate

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/shared-regional-candidate-no-camera.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-regional-no-camera-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Texas New York Vermont shared no-camera gate
        run: node tests/shared-regional-candidate-no-camera.mjs
