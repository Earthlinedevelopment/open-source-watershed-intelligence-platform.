name: Earthline Texas Candidate Contour Strategy AB

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/texas-candidate-contour-strategy-ab.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texas-candidate-contour-strategy-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Compare candidate-only contour strategies
        run: node tests/texas-candidate-contour-strategy-ab.mjs
