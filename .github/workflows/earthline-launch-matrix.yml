name: Earthline Texas Boundary Timing

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/texas-production-diagnostic.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texas-boundary-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Texas boundary timing
        run: node tests/texas-production-diagnostic.mjs
      - name: Upload Texas boundary timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-boundary-timing-results
          path: texas-production-diagnostic-results.json
          if-no-files-found: error
          retention-days: 1
