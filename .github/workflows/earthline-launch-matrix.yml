name: Earthline Regional Visual Jurisdiction Repair

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/repair-regional-jurisdiction-visual-clip.py'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-regional-visual-containment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply authoritative visual jurisdiction clip
        run: python tests/repair-regional-jurisdiction-visual-clip.py
      - name: Verify delta
        run: |
          git diff --check
          git diff -- index.html
          grep -F "function jurisdictionClipD16020" index.html >/dev/null
          grep -F "earthlineJurisdictionClip16020" index.html >/dev/null
          grep -F "clipPathUnits:'userSpaceOnUse'" index.html >/dev/null
      - name: Commit repaired product
        run: |
          git config user.name "Earthline Repair Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "repair: clip Regional SVG output to authoritative jurisdiction"
          git push
