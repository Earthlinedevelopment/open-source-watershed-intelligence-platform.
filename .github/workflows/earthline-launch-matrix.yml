name: Earthline Texas Renderer Owner Trace

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/extract-texas-publication-owner.py'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-renderer-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Extract renderer and publication owner
        run: python tests/extract-texas-publication-owner.py
      - name: Upload renderer trace
        uses: actions/upload-artifact@v4
        with:
          name: texas-renderer-owner-trace
          path: texas-publication-owner-extract.txt
          if-no-files-found: error
          retention-days: 1
