name: Earthline Shared Jurisdiction Geometry Trace

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/extract-texas-publication-owner.py'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-jurisdiction-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Trace shared jurisdiction geometry internals
        run: python tests/extract-texas-publication-owner.py
