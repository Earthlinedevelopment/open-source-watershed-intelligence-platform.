name: Earthline Texas Jurisdiction Contour Probe

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/probe-texas-jurisdiction-contour-sampling.py'
      - 'tests/texas-spacing-anchor-probe.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texas-jurisdiction-contours:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build local A/B product variant only
        run: python tests/probe-texas-jurisdiction-contour-sampling.py
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Texas contour-sampling variant under production origin
        run: node tests/texas-spacing-anchor-probe.mjs
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-jurisdiction-contour-probe
          path: texas-spacing-anchor-probe.json
          if-no-files-found: error
          retention-days: 1
