name: Earthline Texas Terrain Owner Extract

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/extract-terrain-hotspots.py'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Extract terrain owner hotspots
        run: python tests/extract-terrain-hotspots.py
      - name: Upload terrain extract
        uses: actions/upload-artifact@v4
        with:
          name: terrain-owner-hotspots
          path: terrain-owner-hotspots.txt
          if-no-files-found: error
          retention-days: 1
