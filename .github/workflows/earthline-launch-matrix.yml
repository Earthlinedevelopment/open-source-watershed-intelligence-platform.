name: Earthline Apply Coarse-Step Candidate Repair

on:
  push:
    branches: [pages-live]
    paths:
      - 'tools/apply-coarse-step-quantile-candidate.py'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-coarse-step-candidate-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated shared repair
        run: python tools/apply-coarse-step-quantile-candidate.py
      - name: Verify product diff
        run: |
          git diff --check
          git diff --stat -- index.html
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
      - name: Commit live product candidate
        run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "repair: add coarse-step candidate contours"
          git push origin HEAD:pages-live
