name: Earthline Shared Administrative Containment Repair

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/repair-jurisdiction-clipping-16539.py'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-shared-containment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact shared containment repair
        run: python tests/repair-jurisdiction-clipping-16539.py
      - name: Verify delta
        run: |
          git diff --check
          git diff -- index.html
          grep -F "let insideT=aInside?0:1,outsideT=aInside?1:0" index.html >/dev/null
          grep -F "outsideAfterClip" index.html >/dev/null
          grep -F "administrative boundary containment invariant failed" index.html >/dev/null
      - name: Commit repaired product
        run: |
          git config user.name "Earthline Repair Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "repair: enforce shared administrative product containment"
          git push
