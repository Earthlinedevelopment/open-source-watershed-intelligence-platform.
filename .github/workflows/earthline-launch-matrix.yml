name: Earthline Texas Cap-80 Product Gate

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/texas-ny-regression.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tx-cap80-product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Texas cap-80 product and New York control
        run: node tests/texas-ny-regression.mjs
      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-cap80-product-results
          path: tx-ny-regression-results.json
          if-no-files-found: error
          retention-days: 1
