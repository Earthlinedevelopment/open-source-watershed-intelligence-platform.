name: Earthline Boundary Owner Extract

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-boundary-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact boundary owner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=[
            'earthlineResolveJurisdictionBoundary16539',
            'earthlineAdministrativeCapability16539',
            'earthlineClipRegionalProducts16539',
            'EARTHLINE_ACTIVE_JURISDICTION_PACKAGE_16556',
            'appliedAtomically',
            'matchingAtomicBoundary16556',
            'profile16549'
          ]
          chunks=[]
          for needle in needles:
            pos=0; found=0
            while True:
              i=s.find(needle,pos)
              if i<0: break
              found+=1
              a=max(0,i-22000); b=min(len(s),i+26000)
              chunks.append(f'\n===== {needle} occurrence {found} at char {i} =====\n'+s[a:b])
              pos=i+len(needle)
          Path('boundary-owner-source.txt').write_text('\n'.join(chunks),encoding='utf-8')
          print('extracted',len(chunks),'source windows')
          PY
      - name: Upload boundary owner source
        uses: actions/upload-artifact@v4
        with:
          name: earthline-boundary-owner-source
          path: boundary-owner-source.txt
          if-no-files-found: error
          retention-days: 1
