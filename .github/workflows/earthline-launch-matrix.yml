# Mantra 92 release-safety fix.
# The former workflow silently committed index.html directly to pages-live from
# a push or manual dispatch, bypassing an immutable candidate/release gate.
# Retired on purpose; historical repair logic remains in git history.
name: Earthline legacy auto-promotion retired
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Block unverified direct production mutation
        run: |
          echo "::error::This legacy auto-promotion workflow was retired by Mantra 92."
          echo "::error::Use the pinned-candidate scientific/visual release gate, then the approved promotion path."
          exit 1
