name: Earthline Vermont Render Threshold Probe

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/vermont-render-threshold-probe.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vermont-render-threshold:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Measure Vermont rendered corridor lengths
        run: node tests/vermont-render-threshold-probe.mjs
      - name: Persist evidence on pages-live
        if: always()
        run: |
          mkdir -p tests/evidence
          cp vermont-render-threshold-probe.json tests/evidence/vermont-render-threshold-probe.json
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add tests/evidence/vermont-render-threshold-probe.json
          git diff --cached --quiet || git commit -m "test: record Vermont render-threshold evidence [skip ci]"
          git push origin HEAD:pages-live
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vermont-render-threshold-probe
          path: vermont-render-threshold-probe.json
          if-no-files-found: error
          retention-days: 1
