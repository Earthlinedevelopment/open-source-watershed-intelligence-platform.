name: Earthline Minimal Shared Spacing Camera Gate

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/shared-regional-spacing-camera-minimal.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimal-shared-spacing-camera-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Texas New York Vermont minimal candidate gate
        run: node tests/shared-regional-spacing-camera-minimal.mjs
