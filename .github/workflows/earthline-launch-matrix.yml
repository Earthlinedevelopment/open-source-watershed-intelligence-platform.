name: Earthline Texas Contour Resolution AB

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/texas-contour-resolution-ab.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texas-contour-resolution-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Texas contour resolution A-B
        run: node tests/texas-contour-resolution-ab.mjs
