name: Earthline Texas Spacing Policy Probe

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/texas-spacing-policy-probe.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  texas-spacing-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Compare Texas Regional spacing policies
        run: node tests/texas-spacing-policy-probe.mjs
      - name: Persist evidence on pages-live
        if: always()
        run: |
          mkdir -p tests/evidence
          cp texas-spacing-policy-probe.json tests/evidence/texas-spacing-policy-probe.json
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add tests/evidence/texas-spacing-policy-probe.json
          git diff --cached --quiet || git commit -m "test: record Texas spacing policy evidence [skip ci]"
          git push origin HEAD:pages-live
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-spacing-policy-probe
          path: texas-spacing-policy-probe.json
          if-no-files-found: error
          retention-days: 1
