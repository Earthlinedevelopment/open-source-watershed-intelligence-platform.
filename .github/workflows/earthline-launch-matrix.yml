# Mantra 92 release safety: removed an automatic direct production writer.
# The prior workflow committed index.html directly to pages-live without an
# immutable scientific/visual acceptance gate. Full source remains in Git history.
name: Earthline legacy auto-promotion retired
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy direct production mutation
        run: |
          echo "::error::This legacy production writer is disabled."
          echo "::error::Use the immutable candidate certification and approved release path."
          exit 1
