name: Earthline Texas Spacing Loop Trace

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/extract-texas-publication-owner.py'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texas-spacing-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact Regional spacing loop
        run: python tests/extract-texas-publication-owner.py
