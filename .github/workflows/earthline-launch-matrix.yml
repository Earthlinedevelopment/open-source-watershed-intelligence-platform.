name: Earthline Shared Regional Spacing Regression

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/shared-regional-spacing-regression.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spacing-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Texas-first shared spacing regression
        run: node tests/shared-regional-spacing-regression.mjs
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-regional-spacing-regression
          path: shared-regional-spacing-regression.json
          if-no-files-found: error
          retention-days: 1
