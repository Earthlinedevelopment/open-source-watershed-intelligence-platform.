name: Earthline Apply Shared Texas Repair Candidate

on:
  workflow_dispatch:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-launch-matrix.yml'

permissions:
  contents: write

jobs:
  apply-shared-texas-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated shared Regional repair
        run: python tests/apply-shared-regional-candidate.py
      - name: Commit unaccepted product candidate
        run: |
          git config user.name 'Earthline Repair Bot'
          git config user.email 'info@earthlinedevelopment.org'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'repair: shared Regional Texas density and timing candidate'
          git push origin HEAD:pages-live
