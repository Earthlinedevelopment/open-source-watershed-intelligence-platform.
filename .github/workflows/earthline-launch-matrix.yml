name: Earthline Apply Responsive Regional Repair

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/apply-shared-regional-candidate.py'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-responsive-regional-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated shared repair
        run: python tests/apply-shared-regional-candidate.py
      - name: Verify product diff
        run: |
          git diff --check
          git diff --stat -- index.html
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
          grep -q "earthlineCooperativeYield16661" index.html
          grep -q "await makeSwales" index.html
          grep -q "await earthlineClipRegionalProducts16539" index.html
      - name: Commit live product candidate
        run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "performance: keep Regional map responsive during screening"
          git push origin HEAD:pages-live
