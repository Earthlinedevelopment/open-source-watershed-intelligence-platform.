name: Earthline Shared Regional Swale Capacity Repair

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/repair-shared-regional-swale-cap.py'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-shared-swale-cap:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact shared-owner capacity repair
        run: python tests/repair-shared-regional-swale-cap.py
      - name: Verify exact delta
        run: |
          git diff --check
          git diff -- index.html
          test "$(grep -o "if(chosen.length>=80)break;" index.html | wc -l)" -eq 1
          test "$(grep -o "if(chosen.length>=52)break;" index.html | wc -l)" -eq 0
      - name: Commit repaired product
        run: |
          git config user.name "Earthline Repair Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "repair: raise shared Regional swale capacity to validated 80"
          git push
