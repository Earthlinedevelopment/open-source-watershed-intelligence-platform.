name: Earthline Texas Corridor Selection Trace

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/extract-texas-publication-owner.py'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-corridor-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Extract shared corridor selection owner
        run: python tests/extract-texas-publication-owner.py
      - name: Upload corridor selection trace
        uses: actions/upload-artifact@v4
        with:
          name: texas-corridor-selection-owner-trace
          path: texas-corridor-selection-owner-extract.txt
          if-no-files-found: error
          retention-days: 1
