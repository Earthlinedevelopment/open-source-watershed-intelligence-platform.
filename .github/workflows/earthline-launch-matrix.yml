name: Earthline Shared Jurisdiction Selection Repair

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/repair-regional-jurisdiction-before-selection.py'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-jurisdiction-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact shared selection-order repair
        run: python tests/repair-regional-jurisdiction-before-selection.py
      - name: Verify delta
        run: |
          git diff --check
          git diff -- index.html
          grep -F "jurisdiction-before-ranking-spacing-capacity" index.html >/dev/null
          grep -F "selectionBoundary16539=await jurisdictionBoundaryPromise16539" index.html >/dev/null
          grep -F "const boundary16539=selectionBoundary16539||await jurisdictionBoundaryPromise16539" index.html >/dev/null
      - name: Commit repaired product
        run: |
          git config user.name "Earthline Repair Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "repair: select Regional corridors inside jurisdiction first"
          git push
