name: Earthline Texas Publication Phase Probe

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/texas-publication-phase-probe.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texas-publication-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Texas publication phase probe
        run: node tests/texas-publication-phase-probe.mjs
      - name: Upload phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-publication-phase-probe
          path: texas-publication-phase-probe.json
          if-no-files-found: error
          retention-days: 1
