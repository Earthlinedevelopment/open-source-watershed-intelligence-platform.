name: Earthline Final Shared Regional Candidate Gate

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/shared-regional-candidate-final.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-shared-regional-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run final TX NY VT shared Regional candidate gate
        run: node tests/shared-regional-candidate-final.mjs
      - name: Upload final shared gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-regional-candidate-final
          path: shared-regional-candidate-final.json
          if-no-files-found: error
          retention-days: 1
