name: Earthline Texas Contour Threshold Sweep

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/texas-contour-threshold-sweep.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texas-contour-threshold-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Sweep Texas contour thresholds
        run: node tests/texas-contour-threshold-sweep.mjs
