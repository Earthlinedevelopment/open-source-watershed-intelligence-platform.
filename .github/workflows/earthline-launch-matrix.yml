name: Earthline Shared Contour Resolution Control Matrix

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/shared-contour-resolution-control-matrix.mjs'
      - '.github/workflows/earthline-launch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-contour-resolution-control-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run shared contour resolution control matrix
        run: node tests/shared-contour-resolution-control-matrix.mjs
