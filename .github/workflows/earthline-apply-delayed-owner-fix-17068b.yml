name: Earthline Apply Delayed Owner Fix 17068B
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-apply-delayed-owner-fix-17068b.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: candidate/property-delayed-owner-17068
      - name: Apply owner patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch17068.py
          python3 /tmp/patch17068.py
          git diff --check
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "candidate: prevent delayed legacy Property swale republish 17068"
          git push origin HEAD:candidate/property-delayed-owner-17068
