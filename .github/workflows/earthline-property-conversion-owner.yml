name: Earthline Property Conversion Owner Diagnostic
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-property-conversion-owner.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Locate conversion owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['geometry-conversion','rejected-conversion','rejectConversion','earthlineSwaleFrom','SwaleFromPts','conversion']
          for term in terms:
              start=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  print(f"\n===== {term} @ {i} =====")
                  print(s[max(0,i-5000):min(len(s),i+14000)])
                  start=i+len(term)
          PY
