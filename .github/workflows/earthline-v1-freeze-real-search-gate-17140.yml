name: Earthline V1 Freeze Real Search Gate 17140
on:
  push:
    branches: [stabilize/v1-freeze-17064-search]
    paths:
      - 'tests/v1-freeze-real-search-gate-17140.mjs'
      - '.github/workflows/earthline-v1-freeze-real-search-gate-17140.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/v1-freeze-17064-search
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/v1-freeze-real-search-gate-17140.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-v1-freeze-real-search-17140
          path: artifacts/v1-freeze-real-search-17140/
          if-no-files-found: error
          retention-days: 14
