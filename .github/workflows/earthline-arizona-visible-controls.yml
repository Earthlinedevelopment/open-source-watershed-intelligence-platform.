# rerun-geometry-min-length
# rerun-contour-density-science
# rerun-duplicate-correction
name: Earthline Arizona Visible Property Controls
# rerun-major-waterway
# contour-spacing-order-check
# rerun-current-candidate-final
# rerun-contour-sampling-candidate
on:
  push:
    branches: [candidate-next]
    paths:
      - 'index.html'
      - 'earthline-launch-16872.js'
      - 'tests/earthline-system-recovery-gate.mjs'
      - 'tests/arizona-slope-base-science.mjs'
      - '.github/workflows/earthline-arizona-visible-controls.yml'
permissions:
  contents: read
jobs:
  arizona:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Exact Arizona visible controls
        run: env EARTHLINE_URL='https://earthlinedevelopment.org/' EARTHLINE_CANDIDATE_ORIGIN='1' node tests/earthline-system-recovery-gate.mjs
      - name: Exact Arizona base-science slope diagnostic
        if: always()
        run: env EARTHLINE_URL='https://earthlinedevelopment.org/' EARTHLINE_CANDIDATE_ORIGIN='1' node tests/arizona-slope-base-science.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arizona-visible-controls
          path: /tmp/earthline-system-recovery-gate.png
          if-no-files-found: warn
