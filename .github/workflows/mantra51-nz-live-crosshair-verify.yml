name: Mantra 51 NZ Live Crosshair Verify
# exact final Property-publication gate rerun 2026-10-01 b
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-nz-live-crosshair-verify.yml'
permissions:
  contents: read
jobs:
  live_nz_crosshair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra51-global-repair-campaign
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify public production NZ crosshair
        env:
          EARTHLINE_PROD: https://earthlinedevelopment.org/
          EARTHLINE_CANDIDATE: https://earthlinedevelopment.org/
        run: |
          for i in 1 2 3 4 5 6; do
            echo "Live NZ crosshair attempt $i"
            if node lab/mantra51-nz-crosshair-interaction.mjs; then exit 0; fi
            sleep 15
          done
          exit 1
