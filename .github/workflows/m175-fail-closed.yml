name: M175 fail-closed Property exclusion gate
on:
  push:
    branches: ['repair/m175-property-exclusion-failclosed']
    paths: ['.github/workflows/m175-fail-closed.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Block unverified empty exclusion responses before Property publication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          old='c.sourceTier="open-data";c.acquisitionResult="screened-clear";c.publicationAllowed=true;c.exclusionVerified=false;'
          new='c.sourceTier="open-data";c.acquisitionResult="failed";c.publicationAllowed=false;c.exclusionVerified=false;'
          assert s.count(old)==1
          s=s.replace(old,new)
          old2='c.evidenceGrade="OPEN-DATA SCREENING · NO MAPPED EXCLUSIONS RETURNED · FIELD VERIFICATION REQUIRED";'
          new2='c.evidenceGrade="ROAD AND WATER CHECK UNAVAILABLE · TRY AGAIN";'
          assert s.count(old2)==1
          s=s.replace(old2,new2)
          old3='earthlineSetVectorVerification16343(c,"unverified","open-data-screened-clear-not-authoritative");\n      return true;'
          new3='earthlineSetVectorVerification16343(c,"unverified","empty-open-data-does-not-establish-road-or-water-clearance");\n      return false;'
          assert s.count(old3)==1
          s=s.replace(old3,new3)
          old4='earthlineNotice("Property analysis stopped safely. No fallback swales were substituted.");'
          new4='earthlineNotice("Road and water check unavailable, try again. Property swales were not published.");'
          assert s.count(old4)==1
          s=s.replace(old4,new4)
          s=s.replace('/* A successful zero-feature result is screened-clear, never verified-clear and\n         never `unavailable`. Unavailable must be positively established, not inferred\n         from a blank open-data response. A failure of one optional open source does\n         not erase a successful response from another source for the same frame. */','/* M175: an empty non-authoritative map-source response cannot certify road,\n         building or narrow-channel clearance. Fail closed until independent\n         mapped exclusion evidence is available; never treat blank as clear. */')
          p.write_text(s)
          print('M175_EXCLUSION_EMPTY_SOURCE_FAIL_CLOSED_PATCHED')
          PY
      - name: Assert independent source evidence and no code syntax regression
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          start=s.index('function earthlineFinalizeVectorVerification16343(')
          end=s.index('async function vectorNoBuild15778(',start)
          block=s[start:end]
          assert 'c.acquisitionResult="screened-clear";c.publicationAllowed=true' not in block
          assert 'c.acquisitionResult="features-found";c.publicationAllowed=true' in block
          assert 'c.acquisitionResult="clear";c.exclusionVerified=true;c.publicationAllowed=true' in block
          assert 'c.acquisitionResult="failed";c.publicationAllowed=false' in block
          assert 'empty-open-data-does-not-establish-road-or-water-clearance' in block
          assert 'Road and water check unavailable, try again' in s
          print('M175_FAIL_CLOSED_BRANCH_ASSERTIONS_PASS')
          PY
          node --check earthline-elder-restored-17097.js
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          s=Path('index.html').read_text()
          for i,js in enumerate(re.findall(r'<script\b[^>]*>(.*?)</script>',s,re.S|re.I)):
            if not js.strip() or js.lstrip().startswith('{'):continue
            p=Path('/tmp/m175-'+str(i)+'.js');p.write_text(js)
            r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
            if r.returncode:raise RuntimeError(str(i)+': '+r.stderr[:500])
          print('M175_INLINE_JS_PASS')
          PY
      - name: Commit source-only safety change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(property): block publication when road and water clearance has no mapped evidence"
          git push origin HEAD:repair/m175-property-exclusion-failclosed
