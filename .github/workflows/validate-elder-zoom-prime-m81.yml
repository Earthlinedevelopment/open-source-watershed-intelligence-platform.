name: Validate Elder Zoom Prime M81
'on':
  push:
    branches: [elder-zoom-prime-livefix]
    paths:
      - earthline-launch-16872.js
      - tests/elder-zoom-prime-m81.mjs
      - .github/workflows/validate-elder-zoom-prime-m81.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: elder-zoom-prime-livefix }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: node tests/elder-zoom-prime-m81.mjs
