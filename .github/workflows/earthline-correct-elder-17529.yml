name: Earthline Correct Elder Stable Base 17529
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/earthline-correct-elder-17529.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17529
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/elder-correct-source-17538.mjs > tests/elder-correct-source-17538.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps firefox
      - run: xvfb-run -a node tests/elder-correct-source-17538.mjs