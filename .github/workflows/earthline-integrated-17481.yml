name: Earthline Integrated Live-Origin Candidate 17483
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - 'tests/earthline-integrated-live-origin-17481.mjs'
      - '.github/workflows/earthline-integrated-17481.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/earthline-launch-17483, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/earthline-integrated-live-origin-17481.mjs > tests/earthline-integrated-live-origin-17481.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/earthline-integrated-live-origin-17481.mjs
