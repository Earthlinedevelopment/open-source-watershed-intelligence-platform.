name: Mantra 83 Jurisdiction Point Audit
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/jurisdiction-point-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          grep -n "function earthline.*Point.*16539" index.html | head -30
          grep -n "inGeometry16539\|pointIn.*16539\|earthlinePoint" index.html | head -60
