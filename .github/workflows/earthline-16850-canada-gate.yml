name: Earthline 16850 Canada Regional + Property Gate
on:
  workflow_dispatch:
  push:
    branches: [global-search-development-16845]
    paths:
      - '.github/workflows/earthline-16850-canada-gate.yml'
permissions:
  contents: read

jobs:
  canada:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-search-development-16845
      - name: Verify U.S. launch lock remains exact
        run: |
          git fetch origin us-launch-lock-16844
          test "$(git rev-parse origin/us-launch-lock-16844)" = "a795ff5f80ed3500cfe3d77c7f5d153462bef340"
      - name: Add runner-only resolved-location hook
        run: |
          python3 lab/apply-16845-test-location-hook.py
          grep -q 'EARTHLINE_TEST_LOCATION_16845' index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start isolated global candidate
        run: |
          python3 -m http.server 8787 >/tmp/earthline-16850-canada.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Canada Regional country gate
        env:
          EARTHLINE_PROD: https://earthlinedevelopment.org/
          EARTHLINE_CANDIDATE: http://127.0.0.1:8787/
          TARGETS: 'Canada=ca'
        run: node lab/earthline-16847-africa-identity.mjs | tee canada-regional.jsonl
      - name: Southern Alberta 20-acre Property gate
        env:
          EARTHLINE_CANDIDATE: http://127.0.0.1:8787/
          BATCH: canada
          POINTS: 'Canada-Southern-Alberta=49.700000=-112.800000=ca'
          OUTDIR: out-16850-canada-property
        run: node lab/earthline-16849-priority-point-property.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-16850-canada
          path: |
            canada-regional.jsonl
            out-16850-canada-property
          if-no-files-found: ignore
