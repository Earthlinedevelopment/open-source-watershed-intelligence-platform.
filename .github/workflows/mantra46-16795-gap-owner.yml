name: Mantra 46 16795 Gap Owner Audit

on:
  push:
    branches:
      - diagnostic-m46-16795-fine-coverage
    paths:
      - 'tests/mantra46-16795-gap-owner.mjs'
      - '.github/workflows/mantra46-16795-gap-owner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run gap owner audit
        run: node tests/mantra46-16795-gap-owner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16795-gap-owner
          path: artifacts/mantra46-16795-gap-owner/
          if-no-files-found: error
