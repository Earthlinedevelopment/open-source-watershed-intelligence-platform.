name: Earthline report button repair 16993
on:
  push:
    branches: [pages-live]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: python .github/scripts/earthline_report_button_16993.py
      - run: |
          git config user.name EarthlineBuildBot
          git config user.email info@earthlinedevelopment.org
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: restore Bioswale Impact Report button 16993"
          git push
