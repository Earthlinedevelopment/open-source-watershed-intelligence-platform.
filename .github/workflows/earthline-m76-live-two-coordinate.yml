name: Earthline M76 Live Two Coordinate Regression
# rerun-frame-lock-F
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-live-two-coordinate.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra76-audit-restart
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Materialize exact live page
        run: |
          git fetch origin pages-live
          git show origin/pages-live:index.html > live.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('live.html');s=p.read_text(encoding='utf-8')
          old='window.earthlineFilterAuthorityCorridors15874(kept);'
          new='window.__M76_TEST_KEPT=kept.map(s=>Object.assign({},s,{pts:(s.pts||[]).map(p=>[+p[0],+p[1]])}));window.earthlineFilterAuthorityCorridors15874(kept);'
          if s.count(old)!=1: raise SystemExit(f'kept capture owner count {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/m76-http.log 2>&1 &
          echo $! > /tmp/m76-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:8787/live.html >/dev/null && break; sleep 1; done
      - name: Run exact live-byte regression
        run: node tests/m76-live-two-coordinate.mjs
      - name: Save report
        if: always()
        run: |
          if [ -f M76-LIVE-TWO-COORD-REPORT.json ]; then
            git config user.name "Earthline Recovery"
            git config user.email "actions@users.noreply.github.com"
            git add M76-LIVE-TWO-COORD-REPORT.json M76-GOOD-SWALES.svg M76-BAD-SWALES.svg
            git commit -m "test: capture exact Arizona two-coordinate swale regression" || true
            git push origin HEAD:recovery/mantra76-audit-restart
          fi
