name: Earthline 16744 Extract Vermont Boundary Owner
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-extract-vt-owner-16744.yml']
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Extract Vermont boundary owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['earthlineClipVermontProducts16178','earthlineIsVermontRequest16178','maps.vcgi.vermont.gov','EARTHLINE_VERMONT_PRODUCT_BOUNDARY_AUDIT_16178']
          for n in needles:
              print('\n===== '+n+' =====')
              start=0
              for _ in range(6):
                  i=s.find(n,start)
                  if i<0: break
                  print('INDEX',i)
                  print(s[max(0,i-9000):min(len(s),i+18000)])
                  start=i+len(n)
          PY
