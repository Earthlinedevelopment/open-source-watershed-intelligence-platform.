name: Earthline Inspect Language Control 17135
on:
  push:
    branches: [research/elder-browser-engine-17129]
    paths:
      - '.github/workflows/earthline-inspect-language-control-17135.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 1
      - name: Locate rendered Language control
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8',errors='ignore')
          terms=['LANGUAGE','Language','language','Vietnamese','<select','lang']
          seen=set()
          for term in terms:
              start=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  a=max(0,i-500); b=min(len(s),i+1200)
                  key=(a,b)
                  if key not in seen:
                      seen.add(key)
                      print('\n--- TERM',repr(term),'AT',i,'---')
                      print(s[a:b].replace('\n','\\n'))
                  start=i+len(term)
                  if len(seen)>=40: break
              if len(seen)>=40: break
          PY
