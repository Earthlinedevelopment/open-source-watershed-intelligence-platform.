name: Earthline 16750 Vermont Triple Confirmation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-vt3-16750.yml']
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Triple-check Vermont
        shell: bash
        run: |
          set +e
          EARTHLINE_URL='https://earthlinedevelopment.org/' STATES='Vermont|Vermont|Vermont' OUT='vt3.json' node lab/validate-16731-coverage-gap.mjs
          code=$?
          cat vt3.json
          exit "$code"
