name: Mantra 51 Inspect Country Handoff
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-inspect-country-handoff.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra51-global-repair-campaign
      - name: Print country handoff context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['countryPackage16845','runRegional','phaseMark16198']
          for needle in needles:
              print('\n###',needle,'###')
              start=0
              found=False
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  found=True
                  a=max(0,i-1800); b=min(len(s),i+3000)
                  print(s[a:b])
                  print('\n--- OCCURRENCE END ---\n')
                  start=i+len(needle)
              if not found: print('NOT FOUND')
          PY
