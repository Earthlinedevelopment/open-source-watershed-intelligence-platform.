name: Earthline Texas Performance Source Trace
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths: ['tests/trace-texas-performance-source.py','.github/workflows/earthline-texas-performance-source.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tests/trace-texas-performance-source.py
