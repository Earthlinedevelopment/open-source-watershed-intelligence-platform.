name: Mantra 46 16791 New Mexico Selection Diagnostic

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/mantra46-16791-new-mexico-selection-diag.mjs'
      - '.github/workflows/earthline-m46-16791-nm-selection-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nm-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run New Mexico selection diagnostic
        run: node tests/mantra46-16791-new-mexico-selection-diag.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16791-nm-selection
          path: artifacts/mantra46-16791-nm-selection/
          if-no-files-found: warn
