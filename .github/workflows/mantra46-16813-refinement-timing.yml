name: Mantra 46 16813 Texas Refinement Timing
on:
  push:
    branches: [diagnostic-m46-16795-fine-coverage]
    paths:
      - 'tests/mantra46-16813-refinement-timing.mjs'
      - '.github/workflows/mantra46-16813-refinement-timing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run repeated Texas refinement timing
        run: node tests/mantra46-16813-refinement-timing.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16813-refinement-timing
          path: artifacts/mantra46-16813-refinement-timing/
          if-no-files-found: warn
