name: Mantra 51 Restore HBW Corrections
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - 'scripts/restore_hbw_corrections_16931.py'
      - '.github/workflows/mantra51-restore-hbw-corrections.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/restore_hbw_corrections_16931.py
          git diff --check
          git add index.html
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git commit -m "fix: restore canonical How Bioswales corrections registry"
          git push
