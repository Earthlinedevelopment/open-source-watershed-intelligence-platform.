name: Earthline Texas Product Subphase Trace
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/texas-product-subphase-trace.mjs'
      - '.github/workflows/earthline-texas-product-subphase.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node tests/texas-product-subphase-trace.mjs
