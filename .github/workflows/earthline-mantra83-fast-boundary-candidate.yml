name: Mantra 83 Fast Boundary Candidate
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - 'tests/mantra83-fast-boundary-candidate.mjs'
      - '.github/workflows/earthline-mantra83-fast-boundary-candidate.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/mantra83-fast-boundary-candidate.mjs
