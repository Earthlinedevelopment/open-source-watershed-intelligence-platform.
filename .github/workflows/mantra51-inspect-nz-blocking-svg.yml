name: Mantra 51 Inspect NZ Blocking SVG
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - 'lab/mantra51-inspect-nz-blocking-svg.mjs'
      - '.github/workflows/mantra51-inspect-nz-blocking-svg.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: mantra51-global-repair-campaign}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node lab/mantra51-inspect-nz-blocking-svg.mjs
