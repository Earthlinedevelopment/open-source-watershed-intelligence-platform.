name: Earthline Embedded Aquifer Source Trace
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths: ['tests/trace-embedded-principal-aquifers.py','.github/workflows/earthline-embedded-aquifer-trace.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tests/trace-embedded-principal-aquifers.py
