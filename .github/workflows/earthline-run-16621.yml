name: Earthline Last-Three Failure Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-run-16621.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Fetch validator
        run: |
          git fetch origin main
          git show origin/main:lab/validate-16710.mjs > ./validate-16710-run.mjs
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Probe Alaska Hawaii Vermont
        run: |
          set +e
          EARTHLINE_URL='https://earthlinedevelopment.org/' STATES='Alaska|Hawaii|Vermont' OUT='lab/16710-last-three.json' node ./validate-16710-run.mjs
          exit 0
      - name: Save probe
        run: |
          git add lab/16710-last-three.json
          git commit -m 'test: capture last-three failure owners' || true
          git push origin HEAD:pages-live
