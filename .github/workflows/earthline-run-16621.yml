name: Earthline 16716 Alaska Hawaii Diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-run-16621.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Fetch diagnostic
        run: |
          git fetch origin main
          git show origin/main:lab/diag-16716-alaska-hawaii.mjs > ./diag-16716-run.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Diagnose Alaska and Hawaii
        run: |
          EARTHLINE_URL='https://earthlinedevelopment.org/' STATES='Alaska|Hawaii' OUT='lab/16716-alaska-hawaii.json' node ./diag-16716-run.mjs
      - name: Record diagnostic
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add lab/16716-alaska-hawaii.json
          git commit -m 'test: record Alaska Hawaii regional-owner diagnostic' || true
          git push origin HEAD:pages-live
