name: Earthline Run 16621 Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-run-16621.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Validate NY 16621 on deployed site
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
        run: node lab/target-state-phase-diagnostic.mjs
