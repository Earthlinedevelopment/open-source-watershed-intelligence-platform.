name: Earthline 16710 Owner Capture
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-run-16621.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Capture current owners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          for n in ['makeContours(','makeSwales(','candidateQuantile16609','jurisdictionEligibleCount16539','DERIVING WATER PATHS + BIOSWALES','const preferredEligibleCount16539','slope_pct']:
              hits=[];pos=0
              while True:
                  i=s.find(n,pos)
                  if i<0: break
                  hits.append(i);pos=i+len(n)
                  if len(hits)>=8: break
              out.append('\n===== '+n+' '+str(hits)+' =====\n')
              for i in hits[:4]:
                  out.append(s[max(0,i-5000):min(len(s),i+16000)])
          Path('lab/16710-owner.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Publish owner capture
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add lab/16710-owner.txt
          git commit -m 'test: capture live flat-coast owners' || true
          git push origin HEAD:pages-live
