name: Earthline 16712 Validator Debug
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-run-16621.yml'
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Fetch validator
        run: |
          git fetch origin main
          git show origin/main:lab/validate-16710.mjs > ./validate-16712-run.mjs
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Diagnose validator
        shell: bash
        run: |
          set +e
          mkdir -p lab
          {
            echo "bytes $(wc -c < ./validate-16712-run.mjs)"
            echo "lines $(wc -l < ./validate-16712-run.mjs)"
            node --version
            node --check ./validate-16712-run.mjs
            echo "check_exit=$?"
            grep -n "EARTHLINE_REGIONAL_ANALYSIS_EXTENT_16712" ./validate-16712-run.mjs | head
          } > lab/16712-validator-debug.txt 2>&1
          cat lab/16712-validator-debug.txt
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run one-state diagnostic
        shell: bash
        run: |
          set +e
          rm -f lab/16712-one.json
          EARTHLINE_URL='https://earthlinedevelopment.org/' STATES='Vermont' OUT='lab/16712-one.json' node ./validate-16712-run.mjs > lab/16712-one-console.txt 2>&1
          echo "$?" > lab/16712-one-exit.txt
          cat lab/16712-one-console.txt
      - name: Save evidence
        run: |
          git add lab/16712-validator-debug.txt lab/16712-one-console.txt lab/16712-one-exit.txt
          test -f lab/16712-one.json && git add lab/16712-one.json || true
          git commit -m 'test: diagnose 16712 validator harness' || true
          git push origin HEAD:pages-live
