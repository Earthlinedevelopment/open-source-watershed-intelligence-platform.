name: Earthline Inspect Regional Overlay Renderer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-run-16621.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Print renderer owner contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needle='earthlineRenderRegionalOverlay16020'
          pos=0;k=0
          while True:
            i=s.find(needle,pos)
            if i<0: break
            k+=1
            print(f'\n===== OCCURRENCE {k} @ {i} =====')
            print(s[max(0,i-2500):min(len(s),i+7000)])
            pos=i+len(needle)
          print(f'\nTOTAL={k}')
          PY
