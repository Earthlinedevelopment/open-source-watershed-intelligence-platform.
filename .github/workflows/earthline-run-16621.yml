name: Earthline 16718 Alaska Hawaii Fresh Diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-run-16621.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Fetch diagnostic
        run: |
          git fetch origin main
          git show origin/main:lab/diag-16718-ak-hi-fresh.mjs > ./diag-16718-run.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Diagnose Alaska and Hawaii fresh
        run: |
          EARTHLINE_URL='https://earthlinedevelopment.org/' OUT='lab/16718-ak-hi-fresh.json' node ./diag-16718-run.mjs
      - name: Record diagnostic
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin pages-live
          git add lab/16718-ak-hi-fresh.json
          git commit -m 'test: record fresh Alaska Hawaii diagnostic' || true
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
