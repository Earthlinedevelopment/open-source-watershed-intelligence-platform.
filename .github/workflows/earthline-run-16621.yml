name: Earthline Run 16623 Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-run-16621.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Apply 16623
        run: python3 lab/apply-16623.py
      - name: Commit 16623
        run: |
          git diff --check
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- index.html; then exit 0; fi
          git add index.html
          git commit -m 'fix: tighten regional swale locality'
          git push origin HEAD:pages-live
