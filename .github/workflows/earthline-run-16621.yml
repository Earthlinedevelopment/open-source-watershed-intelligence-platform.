name: Earthline 16726 Property Display Ownership Repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-run-16621.yml'
permissions:
  contents: write
jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Fetch repair and validators
        run: |
          git fetch origin main
          git show origin/main:lab/apply-16726-regional-context-property-race.py > /tmp/apply-16726.py
          git show origin/main:lab/validate-16726-property-handoff.mjs > ./validate-16726-run.mjs
          git show origin/main:lab/validate-16715.mjs > ./validate-regression-run.mjs
      - name: Apply Property display-ownership repair
        run: |
          python3 /tmp/apply-16726.py
          git diff --check
      - name: Publish pages-live
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'repair: preserve Property display against late Regional context'
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate Property ownership
        id: property
        shell: bash
        run: |
          set +e
          EARTHLINE_URL='https://earthlinedevelopment.org/' OUT='lab/16726-validation.json' node ./validate-16726-run.mjs
          code=$?
          echo "pass=$([ "$code" -eq 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate Regional controls
        id: regional
        shell: bash
        run: |
          set +e
          EARTHLINE_URL='https://earthlinedevelopment.org/' STATES='Vermont|New York|Massachusetts|Texas' OUT='lab/16726-regional.json' node ./validate-regression-run.mjs
          code=$?
          echo "pass=$([ "$code" -eq 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record evidence
        run: |
          git pull --rebase origin pages-live
          git add lab/16726-validation.json lab/16726-regional.json
          git commit -m 'test: record 16726 Property ownership validation' || true
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
      - name: Enforce validation
        run: |
          test "${{ steps.property.outputs.pass }}" = "1"
          test "${{ steps.regional.outputs.pass }}" = "1"
