name: Earthline Inspect Swale Segment Construction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-run-16621.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Inspect swale segment construction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for n in ['function makeSwales','function sampleSegment','sampleSegment=','const sampleSegment','traceLevelContour','earthlineSplitUsableSegments']:
            pos=[];i=0
            while True:
              i=s.find(n,i)
              if i<0: break
              pos.append(i);i+=len(n)
              if len(pos)>=6: break
            print('\nPOSITIONS',n,pos)
            for j in pos[:3]: print('\n===== @',j,'=====\n',s[max(0,j-7000):j+14000])
          PY
