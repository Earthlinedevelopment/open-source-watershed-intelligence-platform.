name: Earthline 16712 Last-Three Repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-run-16621.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Fetch repair and validator
        run: |
          git fetch origin main
          git show origin/main:lab/apply-16712-last-three.py > /tmp/apply-16712.py
          git show origin/main:lab/validate-16710.mjs > ./validate-16712-run.mjs
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
      - name: Apply repair
        id: apply
        shell: bash
        run: |
          set +e
          mkdir -p lab
          python3 /tmp/apply-16712.py > lab/16712-apply.txt 2>&1
          code=$?
          cat lab/16712-apply.txt
          if [ "$code" -eq 0 ]; then
            git diff --check
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Publish repair
        run: |
          git add lab/16712-apply.txt
          if [ "${{ steps.apply.outputs.ok }}" = "1" ]; then git add index.html; fi
          git commit -m 'repair: fix multipart regional extent and statewide renderer omissions' || true
          git push origin HEAD:pages-live
      - uses: actions/setup-node@v4
        if: steps.apply.outputs.ok == '1'
        with:
          node-version: '20'
      - name: Install browser
        if: steps.apply.outputs.ok == '1'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate last three plus controls
        if: steps.apply.outputs.ok == '1'
        shell: bash
        run: |
          set +e
          rm -f lab/16712-validation.json
          EARTHLINE_URL='https://earthlinedevelopment.org/' STATES='Alaska|Hawaii|Vermont|Texas|California|New York' OUT='lab/16712-validation.json' node ./validate-16712-run.mjs > lab/16712-validator-console.txt 2>&1
          code=$?
          echo "$code" > lab/16712-validator-exit.txt
          cat lab/16712-validator-console.txt
          exit 0
      - name: Save validation
        if: steps.apply.outputs.ok == '1'
        run: |
          git add lab/16712-validation.json lab/16712-validator-console.txt lab/16712-validator-exit.txt
          git commit -m 'test: record 16712 last-three validation' || true
          git push origin HEAD:pages-live
