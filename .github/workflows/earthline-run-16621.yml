name: Earthline 16714B Texas Coverage Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-run-16621.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Fetch corrected validator
        run: |
          git fetch origin main
          git show origin/main:lab/validate-16714b.mjs > ./validate-16714b-run.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate Texas live coverage
        id: validate
        shell: bash
        run: |
          set +e
          EARTHLINE_URL='https://earthlinedevelopment.org/' STATES='Texas' OUT='lab/16714b-validation.json' node ./validate-16714b-run.mjs
          code=$?
          echo "pass=$([ "$code" -eq 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record evidence
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add lab/16714b-validation.json
          git commit -m 'test: record corrected Texas coastal coverage audit' || true
          git push origin HEAD:pages-live
      - name: Enforce validation
        run: |
          test "${{ steps.validate.outputs.pass }}" = "1"
