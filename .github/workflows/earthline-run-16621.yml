name: Earthline Inspect Regional Clip Helper

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-run-16621.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Inspect helper
        run: python3 -c "from pathlib import Path; s=Path('index.html').read_text(encoding='utf-8'); n='earthlineClipFeatureCollection16539'; i=s.find(n); print('INDEX',i); print(s[max(0,i-5000):i+9000])"
