name: Earthline Inspect Regional Swale Generation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-run-16621.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Inspect generation path
        run: python3 -c "from pathlib import Path; s=Path('index.html').read_text(encoding='utf-8'); ns=[\"feature_type:'swale-opportunity'\",'REGIONAL BIOSWALE OPPORTUNITY','swalesRaw','regionalSwales','const swales=','let swales=']; [print('\\n===== '+n+' @'+str(i)+' =====\\n'+s[max(0,i-5000):i+9000]) for n in ns for i in [s.find(n)] if i>=0]"
