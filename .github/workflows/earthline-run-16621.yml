name: Earthline Inspect Regional SVG Render Function

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-run-16621.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Print exact render function
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          anchor=s.find('window.earthlineRenderRegionalOverlay16020=render')
          if anchor<0: raise SystemExit('renderer assignment not found')
          start=s.rfind('function render(',0,anchor)
          if start<0: raise SystemExit('render function start not found')
          end=s.find('function schedule()',start)
          if end<0: end=min(len(s),anchor+8000)
          print(s[start:end])
          PY
