name: Earthline Run 16624 Repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-run-16621.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Apply 16624
        run: python3 lab/apply-16624.py
      - name: Commit 16624
        run: |
          git diff --check
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- index.html; then exit 0; fi
          git add index.html
          git commit -m 'fix: render local regional corridors at statewide scale'
          git push origin HEAD:pages-live
