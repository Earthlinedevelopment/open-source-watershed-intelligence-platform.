name: Earthline Property Integrity Extract
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-extract-property-integrity.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Extract owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['location integrity failed before Property publication','searchGenAtLaunch','scientificSettledAt','earthlineGovernedPropertyRun16202','function terminalPropertyRun','terminalPropertyRun']
          for n in needles:
              print('\n===== '+n+' =====')
              start=0
              for _ in range(4):
                  i=s.find(n,start)
                  if i<0: break
                  print('INDEX',i)
                  print(s[max(0,i-9000):min(len(s),i+15000)])
                  start=i+len(n)
          PY
