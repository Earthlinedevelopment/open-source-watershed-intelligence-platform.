name: Earthline Anchored Renderer Start
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/trace-anchored-renderer-start.py'
      - '.github/workflows/earthline-anchored-renderer-start.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tests/trace-anchored-renderer-start.py
