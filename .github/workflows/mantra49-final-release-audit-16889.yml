name: Earthline Mantra 49 final release audit 16889
on:
  push:
    branches:
      - mantra49-release-audit-clean-16882
    paths:
      - .github/workflows/mantra49-final-release-audit-16889.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EARTHLINE_AUDIT_REVISION: "6"
    steps:
      - uses: actions/checkout@v4
      - name: Isolate New Zealand camera path
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/mantra49-final-release-audit-16889.js')
          s=p.read_text(encoding='utf-8')
          old="await languageAudit(b);await accountAudit(b);const places=[['Germany','Germany'],['India','India'],['Vietnam','Vietnam'],['New Zealand','New Zealand country'],['Australia','Australia'],['Alaska','Alaska'],['Hawaii','Hawaii']];for(let i=0;i<places.length;i++)await placeAudit(b,...places[i],i);"
          new="const places=[['New Zealand','New Zealand']];for(let i=0;i<places.length;i++)await placeAudit(b,...places[i],i);"
          if old not in s:
              old="await languageAudit(b);const places=[['New Zealand','New Zealand'],['Australia','Australia'],['Hawaii','Hawaii'],['Alaska','Alaska'],['Germany','Germany'],['India','India'],['Vietnam','Vietnam']];for(let i=0;i<places.length;i++)await placeAudit(b,...places[i],i);await accountAudit(b);"
          if old not in s: raise SystemExit('main audit anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify candidate syntax
        run: |
          node --check earthline-launch-16872.js
          node --check tools/mantra49-final-release-audit-16889.js
      - name: Install browser driver library only
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install playwright@1.55.0 --no-save
      - name: Run New Zealand isolated candidate over production origin
        run: node tools/mantra49-final-release-audit-16889.js
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthline-mantra49-final-16889
          path: artifacts/mantra49-final-16889/
          if-no-files-found: ignore
