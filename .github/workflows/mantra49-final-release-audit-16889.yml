name: Earthline Mantra 49 final release audit 16889
on:
  push:
    branches:
      - mantra49-release-audit-clean-16882
    paths:
      - .github/workflows/mantra49-final-release-audit-16889.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EARTHLINE_AUDIT_REVISION: "7"
    steps:
      - uses: actions/checkout@v4
      - name: Isolate and instrument New Zealand Property terminal path
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/mantra49-final-release-audit-16889.js')
          s=p.read_text(encoding='utf-8')
          anchors=[
            "await languageAudit(b);await accountAudit(b);const places=[['Germany','Germany'],['India','India'],['Vietnam','Vietnam'],['New Zealand','New Zealand country'],['Australia','Australia'],['Alaska','Alaska'],['Hawaii','Hawaii']];for(let i=0;i<places.length;i++)await placeAudit(b,...places[i],i);",
            "await languageAudit(b);const places=[['New Zealand','New Zealand'],['Australia','Australia'],['Hawaii','Hawaii'],['Alaska','Alaska'],['Germany','Germany'],['India','India'],['Vietnam','Vietnam']];for(let i=0;i<places.length;i++)await placeAudit(b,...places[i],i);await accountAudit(b);",
            "const places=[['New Zealand','New Zealand']];for(let i=0;i<places.length;i++)await placeAudit(b,...places[i],i);"
          ]
          for old in anchors:
              if old in s:
                  s=s.replace(old,"const places=[['New Zealand','New Zealand']];for(let i=0;i<places.length;i++)await placeAudit(b,...places[i],i);",1)
                  break
          else: raise SystemExit('main audit anchor not found')
          old="if(!['complete','displayed'].includes(property.kind))throw new Error(`${name}: property ${property.kind}`);"
          new="if(!['complete','displayed'].includes(property.kind)){const diag=await p.evaluate(()=>{const m=window.M||null,mp=window.earthlineMap||null;let center=null,zoom=null;try{const c=mp&&mp.getCenter&&mp.getCenter();center=c?{lng:Number(c.lng),lat:Number(c.lat)}:null;zoom=mp&&mp.getZoom?Number(mp.getZoom()):null}catch(_){}const names=Object.keys(window).filter(k=>/^EARTHLINE_/.test(k)&&/(PROPERTY|RUN|TARGET|DISPLAY)/.test(k)).slice(0,80);return{center,zoom,target:window.EARTHLINE_PROPERTY_TARGET_16201||null,displayed:window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null,loc:m&&m.loc?{name:m.loc.name,placeType:m.loc.placeType,lat:m.loc.lat,lng:m.loc.lng,bbox:m.loc.bbox,zoomHint:m.loc.zoomHint}:null,searchGen:m&&m.searchGen,demSource:m&&m.demSource,swales:m&&Array.isArray(m.swales)?m.swales.length:null,status:document.getElementById('earthlineVermontStatus16147')?.textContent||'',globalNames:names}});console.log('NEW_ZEALAND_PROPERTY_TERMINAL_DIAG',JSON.stringify(diag));out.places[name]={regional,regionalState,drag,property,diag};save();throw new Error(`${name}: property ${property.kind}`);}"
          if old not in s: raise SystemExit('property terminal anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify candidate syntax
        run: |
          node --check earthline-launch-16872.js
          node --check tools/mantra49-final-release-audit-16889.js
      - name: Install browser driver library only
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install playwright@1.55.0 --no-save
      - name: Run New Zealand isolated candidate over production origin
        run: node tools/mantra49-final-release-audit-16889.js
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthline-mantra49-final-16889
          path: artifacts/mantra49-final-16889/
          if-no-files-found: ignore
