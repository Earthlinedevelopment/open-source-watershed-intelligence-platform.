name: Mantra 51 Identify Vancouver Boundary Constant
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths: ['.github/workflows/mantra51-identify-vancouver-boundary-constant.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: mantra51-global-repair-campaign}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          i=s.find("ca-cgndb-vancouver-island")
          print(s[max(0,i-2500):i+1200])
          PY
