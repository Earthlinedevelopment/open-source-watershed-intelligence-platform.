name: Mantra 51 NM Transition and Alaska Regression
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-nm-alaska-regression.yml'
      - 'tests/mantra51-nm-alaska-regression.mjs'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra51-global-repair-campaign
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start candidate server
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/m51-nm-ak.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/m51-nm-ak.log
          exit 1
      - name: Run exact NM transition and Alaska regression
        run: node tests/mantra51-nm-alaska-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra51-nm-alaska-regression
          path: artifacts/mantra51-nm-alaska/
          if-no-files-found: warn
