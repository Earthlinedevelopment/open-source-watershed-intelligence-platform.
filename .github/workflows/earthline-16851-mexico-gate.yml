name: Earthline 16851 Mexico Regional + Property Gate
on:
  workflow_dispatch:
  push:
    branches: [global-search-development-16845]
    paths:
      - '.github/workflows/earthline-16851-mexico-gate.yml'
permissions:
  contents: read

jobs:
  mexico:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-search-development-16845
      - name: Verify U.S. launch lock remains exact
        run: |
          git fetch origin us-launch-lock-16844
          test "$(git rev-parse origin/us-launch-lock-16844)" = "a795ff5f80ed3500cfe3d77c7f5d153462bef340"
      - name: Add runner-only resolved-location hook
        run: |
          python3 lab/apply-16845-test-location-hook.py
          grep -q 'EARTHLINE_TEST_LOCATION_16845' index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start isolated global candidate
        run: |
          python3 -m http.server 8787 >/tmp/earthline-16851-mexico.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Mexico Regional country gate
        env:
          EARTHLINE_PROD: https://earthlinedevelopment.org/
          EARTHLINE_CANDIDATE: http://127.0.0.1:8787/
          TARGETS: 'Mexico=mx'
        run: node lab/earthline-16847-africa-identity.mjs | tee mexico-regional.jsonl
      - name: Sonora 20-acre Property gate
        env:
          EARTHLINE_CANDIDATE: http://127.0.0.1:8787/
          BATCH: mexico
          POINTS: 'Mexico-Sonora=29.089200=-110.961300=mx'
          OUTDIR: out-16851-mexico-property
        run: node lab/earthline-16849-priority-point-property.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-16851-mexico
          path: |
            mexico-regional.jsonl
            out-16851-mexico-property
          if-no-files-found: ignore
