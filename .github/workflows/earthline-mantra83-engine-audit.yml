name: Mantra 83 Unified Engine Audit

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/mantra83-engine-audit.mjs'
      - '.github/workflows/earthline-mantra83-engine-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit Earthline runtime ownership
        run: node tests/mantra83-engine-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mantra83-engine-audit
          path: artifacts/mantra83-engine-audit/
