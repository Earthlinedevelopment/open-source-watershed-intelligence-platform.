name: Earthline Target Authority Rewrite Audit
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-target-authority-rewrite-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - name: Extract exact rewrite anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          anchors=[
            "function syncPropertyTargetFromMap16201()",
            "function bindPropertyTargetMove16201()",
            "async function runRegional(q,loc,runToken){"
          ]
          for a in anchors:
              i=s.find(a)
              print("\n===== "+a+" =====")
              if i<0:
                  print("MISSING")
              else:
                  print(s[max(0,i-1200):min(len(s),i+11000)])
          PY
