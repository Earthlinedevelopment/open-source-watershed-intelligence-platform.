name: Mantra 83 Current Swale Block
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/earthline-mantra83-current-swale-block.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          at=s.find('async function makeSwales')
          if at<0: raise SystemExit('makeSwales missing')
          print(s[at:at+9000])
          PY
