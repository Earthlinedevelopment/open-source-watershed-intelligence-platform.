name: Earthline Apply Exclusion Readiness Edit
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-apply-exclusion-readiness-edit.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'ops: apply guarded exclusion readiness edit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 1
      - name: Change only canonical exclusion readiness condition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='if(!earthlineMapActive())return {ready:false,status:"map-inactive",waitedMs:0};'
          new='if(!earthlineMap)return {ready:false,status:"map-unavailable",waitedMs:0};'
          if s.count(old)!=1:
              raise SystemExit(f'expected one canonical readiness condition; found {s.count(old)}')
          if new in s:
              raise SystemExit('new readiness condition already present')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          test "$(git diff --name-only)" = "index.html"
          test "$(git diff --numstat | awk '{print $1" "$2}')" = "1 1"
          grep -Fq 'if(!earthlineMap)return {ready:false,status:"map-unavailable",waitedMs:0};' index.html
          ! grep -Fq 'if(!earthlineMapActive())return {ready:false,status:"map-inactive",waitedMs:0};' index.html
      - name: Commit only the validated one-line runtime change
        run: |
          git fetch origin candidate-next
          test "$(git rev-parse origin/candidate-next)" = "$GITHUB_SHA"
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "science: wait for actual exclusion map evidence"
          git push origin HEAD:candidate-next
