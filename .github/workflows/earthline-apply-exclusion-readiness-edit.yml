name: Earthline Apply Exclusion Readiness Edit
on:
  push:
    branches:
      - candidate-next
    paths:
      - .github/workflows/earthline-apply-exclusion-readiness-edit.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 1
      - name: Edit canonical exclusion readiness condition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old='if(!earthlineMapActive())return {ready:false,status:"map-inactive",waitedMs:0};'
          new='if(!earthlineMap)return {ready:false,status:"map-unavailable",waitedMs:0};'
          if s.count(old) != 1:
              raise SystemExit("canonical readiness condition count="+str(s.count(old)))
          if new in s:
              raise SystemExit("new readiness condition already present")
          p.write_text(s.replace(old,new),encoding="utf-8")
          PY
          files="$(git diff --name-only)"
          [ "$files" = "index.html" ]
          grep -Fq 'if(!earthlineMap)return {ready:false,status:"map-unavailable",waitedMs:0};' index.html
          if grep -Fq 'if(!earthlineMapActive())return {ready:false,status:"map-inactive",waitedMs:0};' index.html; then exit 1; fi
      - name: Commit candidate-only runtime edit
        shell: bash
        run: |
          git fetch origin candidate-next
          [ "$(git rev-parse origin/candidate-next)" = "$GITHUB_SHA" ]
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "science: wait for actual exclusion map evidence"
          git push origin HEAD:candidate-next
