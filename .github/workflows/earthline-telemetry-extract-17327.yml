name: Earthline Telemetry Extract 17327
on:
  push:
    branches: [repair/browser-performance-live-17268]
    paths:
      - 'tests/extract-telemetry-17327.py'
      - '.github/workflows/earthline-telemetry-extract-17327.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/browser-performance-live-17268}
      - run: python3 tests/extract-telemetry-17327.py
      - uses: actions/upload-artifact@v4
        with:
          name: telemetry-snippet-17327
          path: telemetry-snippet-17327.txt
