name: Earthline Target Setter Exact Audit
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-target-setter-exact-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - name: Extract exact target setter and callers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          lines=s.splitlines()
          print("===== TARGET OWNER BLOCK 32870-33040 =====")
          for i in range(32869,min(33040,len(lines))):
              print(f"{i+1}: {lines[i]}")
          print("\n===== ALL setPropertyTarget16201 REFERENCES =====")
          for i,line in enumerate(lines):
              if "setPropertyTarget16201" in line or "earthlineSetPropertyTarget16201" in line:
                  print(f"\n--- line {i+1} ---")
                  for j in range(max(0,i-4),min(len(lines),i+5)):
                      print(f"{j+1}: {lines[j]}")
          print("\n===== PROPERTY TARGET + MAP EVENT REFERENCES =====")
          for i,line in enumerate(lines):
              lo=line.lower()
              if ("moveend" in lo or "dragend" in lo or "zoomend" in lo or "jumpTo" in line) and ("16201" in line or "crosshair" in lo or "propertytarget" in lo):
                  print(f"\n--- line {i+1} ---")
                  for j in range(max(0,i-5),min(len(lines),i+6)):
                      print(f"{j+1}: {lines[j]}")
          PY
