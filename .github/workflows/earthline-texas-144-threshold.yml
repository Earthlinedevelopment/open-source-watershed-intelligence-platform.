name: Earthline Texas 144 Threshold Sweep
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/texas-144-threshold-sweep.mjs'
      - '.github/workflows/earthline-texas-144-threshold.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node tests/texas-144-threshold-sweep.mjs
