name: M191 Ernst Creek road-water source connectivity
on:
  push:
    branches: ['repair/m191-ernst-creek-osm-recovery']
    paths: ['.github/workflows/m191-source-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe multiple free OSM services with actual Property BBOX
        run: |
          python3 - <<'PY'
          import requests,time,json
          bbox=(41.9555,-93.3925,41.9595,-93.387)
          bb=','.join(map(str,bbox))
          query='[out:json][timeout:12];(way["building"]('+bb+');way["highway"]('+bb+');way["waterway"]('+bb+');way["natural"="water"]('+bb+');relation["natural"="water"]('+bb+'););out geom;'
          endpoints=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.nchc.org.tw/api/interpreter','https://overpass.private.coffee/api/interpreter']
          for endpoint in endpoints:
            for method in ['GET','POST']:
              start=time.monotonic()
              try:
                if method=='GET':r=requests.get(endpoint,params={'data':query},timeout=17)
                else:r=requests.post(endpoint,data={'data':query},timeout=17)
                content=r.content
                o={'service':endpoint,'method':method,'http':r.status_code,'bytes':len(content),'elapsed':round(time.monotonic()-start,2),'content_type':r.headers.get('Content-Type'),'head':content[:110].decode('utf-8','replace')}
                if r.ok:
                  try:
                    j=r.json();els=j.get('elements',[])
                    o['elements']=len(els);o['tags']={k:sum(1 for x in els if k in x.get('tags',{})) for k in ['waterway','highway','building','natural']}
                  except Exception as e:o['decode_error']=str(e)
                print('M191_SOURCE '+json.dumps(o),flush=True)
              except Exception as e:print('M191_SOURCE '+json.dumps({'service':endpoint,'method':method,'error':str(e),'elapsed':round(time.monotonic()-start,2)}),flush=True)
          PY
