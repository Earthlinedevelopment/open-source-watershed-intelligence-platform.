name: Earthline Apply Regional Property Target Handoff
on:
  push:
    branches: [pages-live]
    paths:
      - 'tools/m78_51_regional_target_handoff.py'
      - '.github/workflows/earthline-apply-regional-target-handoff.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - run: python3 tools/m78_51_regional_target_handoff.py
      - run: |
          git diff --check
          grep -q "published Regional center explicitly owns the default Property target" index.html
      - run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "Earthline Target Repair"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: bind published Regional center to Property target"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
