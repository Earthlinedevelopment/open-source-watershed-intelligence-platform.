name: Prepare Property gentle-contour split science candidate
on:
  push:
    branches: [repair/property4-gentle-contour-split-20261113]
    paths: [.github/workflows/earthline-property4-gentle-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fail-closed single Property slope, contour, gauge candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "a46d094cbdc37ecdc49f53a784bdd870c800627a"
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text()
          changes=[
           ("return !earthlineLargeAreaMode()&&!earthlinePlanningMode()&&!!M.analysisReady&&Array.isArray(M.swales)&&M.swales.length>0;",
            "return !earthlineLargeAreaMode()&&!earthlinePlanningMode()&&!!M.analysisReady&&Array.isArray(M.swales);"),
           ("const thr=streamThreshold(),chanThr=thr*3.2,maxS=33;",
            "const thr=streamThreshold(),chanThr=thr*3.2,maxS=isRegionalTile15769?33:4;"),
           ("Number(M.propertyPublication15816.rawGeographicSegments||0)>0",
            "M.propertyPublication15816.safetyVerified===true")
          ]
          for a,b in changes:
           assert s.count(a)==1,(a,s.count(a))
           s=s.replace(a,b)
          a=s.index('function earthlineSwaleGeoJSON(){')
          b=s.index('function earthlineSyncSwaleLayer()',a)
          f=s[a:b]
          assert f.count('earthlineSplitUsableSegments(s.pts,33)')==1
          assert f.count('earthlineFinalSafeSegments15771(displaySeg,33)')==1
          f=f.replace('earthlineSplitUsableSegments(s.pts,33)','earthlineSplitUsableSegments(s.pts,4)').replace('earthlineFinalSafeSegments15771(displaySeg,33)','earthlineFinalSafeSegments15771(displaySeg,4)')
          s=s[:a]+f+s[b:]
          assert s.count('Recharge Suitability')==6
          s=s.replace('Recharge Suitability','Recharge Potential').replace('Recharge suitability</div>','Recharge potential</div>')
          assert 'earthlineSteepNoteM211' not in s
          Path('index.html').write_text(s)
          PY
          test "$(git hash-object index.html)" = "31d528fa7c72c76f96d40ef3fe9643c4feba48ac"
          git rm .github/workflows/earthline-property4-gentle-prepare.yml
          git config user.name 'Earthline isolated science candidate'
          git config user.email 'info@earthlinedevelopment.org'
          git add index.html
          git commit -m 'fix(property): generate contour segments only on 4pct ground, preserve verified layers, gauge Potential'
          git push origin HEAD:repair/property4-gentle-contour-split-20261113
