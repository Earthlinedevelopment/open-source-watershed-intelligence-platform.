name: Earthline M76 Geometry Guard Audit
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-geometry-guard-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Extract contour and flow geometry guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          for name in ['earthlineOnContourGuard15833','earthlineSegmentFlowEvidence15833','segmentCrossesPath15836','earthlineSwaleFromPts','slopePct']:
              for pat in [f'function {name}(',f'const {name}=',f'let {name}=']:
                  i=s.find(pat)
                  if i>=0:
                      out.append('===== '+name+' =====')
                      out.append(s[max(0,i-1000):min(len(s),i+9000)])
                      break
          Path('/tmp/M76-GUARD-AUDIT.txt').write_text('\n'.join(out),encoding='utf-8')
          print(Path('/tmp/M76-GUARD-AUDIT.txt').read_text(encoding='utf-8'))
          PY
