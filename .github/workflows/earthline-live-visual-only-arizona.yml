name: Earthline Live Visual-Only Arizona Check
on:
  push:
    branches: [candidate-next]
    paths:
      - 'tests/live-visual-only-arizona.mjs'
      - '.github/workflows/earthline-live-visual-only-arizona.yml'
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/live-visual-only-arizona.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-visual-only-arizona
          path: /tmp/AZ-*.png
          if-no-files-found: warn
