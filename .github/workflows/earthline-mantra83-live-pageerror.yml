name: Mantra 83 Live Page Error
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - 'tests/mantra83-live-pageerror.mjs'
      - '.github/workflows/earthline-mantra83-live-pageerror.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save playwright
      - run: node tests/mantra83-live-pageerror.mjs
