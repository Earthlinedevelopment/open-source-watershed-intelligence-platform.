name: Earthline Regional Scheduler Audit
on:
  push:
    branches:
      - recovery/mantra74-stability
    paths:
      - .github/workflows/earthline-regional-scheduler-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Extract Regional scheduler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(errors='ignore')
          terms=['tileSite(','regional tile','Regional Opportunity Tile','regionalTiles','tileCount','for(const tile','for (const tile','Promise.all','earthlineRegional15778','regional-opportunity','maxTiles','tiles.length']
          for term in terms:
            hits=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
            print('\n###',term,'COUNT',len(hits))
            for pos in hits[-10:]:
              print('\n---',pos,'---')
              print(s[max(0,pos-4500):min(len(s),pos+10000)])
          PY