name: Earthline M48 targeted owner extract 16871
on:
  push:
    branches: [mantra48-final-launch-16871]
    paths: [.github/workflows/earthline-m48-final-audit-16871.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p lab
          python - <<'PY'
          from pathlib import Path
          import json
          text=Path('index.html').read_text()
          terms=['CROSSHAIR','crosshair16247','20 ACRES','earthline-property-acres-16869-style','earthlineRenderPropertyTargetLabel16869','function applyLanguage','earthlineLanguage16488','swale-opportunities','earthline-property-swale-ditch-16166']
          out={}
          for term in terms:
            rows=[]; pos=0
            while len(rows)<20:
              i=text.find(term,pos)
              if i<0: break
              rows.append(text[max(0,i-2500):min(len(text),i+7000)])
              pos=i+len(term)
            out[term]=rows
          Path('lab/targeted-owners-16871.json').write_text(json.dumps(out,indent=2))
          PY
      - run: |
          git config user.name earthline-audit-bot
          git config user.email info@earthlinedevelopment.org
          git add lab/targeted-owners-16871.json
          git commit -m 'diag: targeted owner evidence 16871'
          git push origin HEAD:mantra48-final-launch-16871
