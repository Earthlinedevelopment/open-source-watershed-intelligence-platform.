name: Mantra 51 Inspect Map Pointer CSS
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-inspect-map-pointer-css.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for needle in ["#map{","#map {","pointer-events:none","pointer-events: none","mapboxgl-canvas","mapboxgl-map","pointerEvents='none'","pointerEvents = 'none'"]:
            print("\n===",needle,"===")
            p=0;n=0
            while n<30:
              i=s.find(needle,p)
              if i<0:break
              print(s[max(0,i-1000):min(len(s),i+2500)].replace("\n"," "))
              print("---");p=i+len(needle);n+=1
          PY
