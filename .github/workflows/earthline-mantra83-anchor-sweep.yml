name: Mantra 83 Anchor Sweep
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - 'tests/mantra83-anchor-sweep.mjs'
      - '.github/workflows/earthline-mantra83-anchor-sweep.yml'
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save playwright
      - run: node tests/mantra83-anchor-sweep.mjs
