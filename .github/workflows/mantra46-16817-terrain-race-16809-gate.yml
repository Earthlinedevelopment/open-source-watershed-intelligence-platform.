name: Mantra 46 16817 Terrain Race 16809 Gate
on:
  push:
    branches: [diagnostic-m46-16795-fine-coverage]
    paths:
      - 'tests/mantra46-16817-terrain-race-16809-gate.mjs'
      - '.github/workflows/mantra46-16817-terrain-race-16809-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run terrain race spatial and performance gate
        run: node tests/mantra46-16817-terrain-race-16809-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16817-terrain-race-16809-gate
          path: artifacts/mantra46-16817-terrain-race-16809-gate/
          if-no-files-found: warn
