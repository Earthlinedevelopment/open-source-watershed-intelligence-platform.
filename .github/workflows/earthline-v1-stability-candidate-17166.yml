name: Earthline V1 Stability Candidate 17173
on:
  push:
    branches:
      - research/elder-browser-engine-17129
    paths:
      - .github/workflows/earthline-v1-stability-candidate-17166.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendered:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-stability-17166
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/v1-stability-candidate-17166.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-v1-stability-candidate-17166
          path: artifacts/v1-stability-17166/
          if-no-files-found: warn
          retention-days: 7
