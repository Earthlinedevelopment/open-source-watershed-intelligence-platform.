name: Earthline candidate selector audit 16968
on:
  push:
    branches: [report-map-candidate-16967]
    paths:
      - '.github/workflows/e2e-selector-audit-16968.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: report-map-candidate-16967
      - name: Find E2E selectors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          for term in ["Property Search","Run Analysis","Bioswale Impact Report","earthlineVermontReport16149","search","coordinates"]:
              print("\n=== "+term+" ===")
              for m in list(re.finditer(re.escape(term),s,re.I))[:25]:
                  a=max(0,m.start()-500); b=min(len(s),m.end()+850)
                  print(s[a:b].replace("\n"," ")+"\n---")
          PY
