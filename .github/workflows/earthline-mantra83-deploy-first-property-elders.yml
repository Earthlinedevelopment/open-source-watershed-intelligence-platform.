name: Mantra 83 Deploy First Property Elders
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/earthline-mantra83-deploy-first-property-elders.yml'
permissions:
  contents: write
concurrency:
  group: mantra83-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra83-shadow-live
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          git fetch origin pages-live
          git checkout -B pages-live origin/pages-live
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old1="""if(typeof window.earthlineSetPropertyTarget16201==='function')window.earthlineSetPropertyTarget16201(target);
      else window.EARTHLINE_PROPERTY_TARGET_16201=target;
      const governed=window.earthlineDeclarePropertyAtCrosshair16173;"""
          new1="""if(typeof window.earthlineSetPropertyTarget16201==='function')window.earthlineSetPropertyTarget16201(target);
      else window.EARTHLINE_PROPERTY_TARGET_16201=target;
      try{const elders=window.EARTHLINE_ELDER_TREES_V1_17097;if(elders?.prefetchPropertyTarget)void elders.prefetchPropertyTarget();if(elders?.startProperty)void elders.startProperty();}catch(_){}
      const governed=window.earthlineDeclarePropertyAtCrosshair16173;"""
          old2="""setAudit({stage:'published',stageLabel:'published',settled:true,result:true,timedOut:false,corridors:count,renderVerified,renderMode:texture.ok?'natural-texture':(safeFallback.ok?'authoritative-safe-lines':'verified-zero'),sourceEvidence:propertyEvidenceSnapshot16206(),publicationAudit:window.EARTHLINE_PROPERTY_PUBLICATION_AUDIT_16220||null,safeFallback,texture,stageTimings:Object.assign({},m.lastTiming||{}),elapsedSeconds:Math.round((performance.now()-started)/1000),settledAt:new Date().toISOString()});try{window.EARTHLINE_ELDER_TREES_V1_17097?.refresh?.()}catch(_){} /* EARTHLINE_ELDER_REFRESH_RESTORE_17097 */return true;"""
          new2="""setAudit({stage:'published',stageLabel:'published',settled:true,result:true,timedOut:false,corridors:count,renderVerified,renderMode:texture.ok?'natural-texture':(safeFallback.ok?'authoritative-safe-lines':'verified-zero'),sourceEvidence:propertyEvidenceSnapshot16206(),publicationAudit:window.EARTHLINE_PROPERTY_PUBLICATION_AUDIT_16220||null,safeFallback,texture,stageTimings:Object.assign({},m.lastTiming||{}),elapsedSeconds:Math.round((performance.now()-started)/1000),settledAt:new Date().toISOString()});try{await window.EARTHLINE_ELDER_TREES_V1_17097?.startProperty?.()}catch(_){} /* EARTHLINE_ELDER_REFRESH_RESTORE_17097 */return true;"""
          if old1 in s: s=s.replace(old1,new1,1)
          elif new1 not in s: raise SystemExit('direct Property Elder start owner missing')
          if old2 in s: s=s.replace(old2,new2,1)
          elif new2 not in s: raise SystemExit('Property terminal Elder await owner missing')
          p.write_text(s)
          PY
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8'),{spawnSync}=require('child_process');let i=0;
          for(const m of s.matchAll(/<script(?![^>]*src=)[^>]*>([\s\S]*?)<\/script>/gi)){const p='/tmp/in-'+(++i)+'.js';fs.writeFileSync(p,m[1]);const r=spawnSync(process.execPath,['--check',p],{encoding:'utf8'});if(r.status!==0){console.error(r.stderr);process.exit(10)}}
          console.log('M83_INLINE_SYNTAX_PASS '+i);
          NODE
          git config user.name "earthline-ci"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "repair: make Elder evidence ready on first Property completion"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
