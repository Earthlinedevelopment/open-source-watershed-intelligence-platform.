name: Earthline Property Contour Geometry Science
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-property-contour-geometry-science.yml'
      - 'tools/apply_property_contour_geometry_science.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 0
      - name: Apply contour geometry science
        run: |
          test "$(git hash-object index.html)" = "64ca996381fa50d2633a740bbb84190e16bb0e0b"
          python3 tools/apply_property_contour_geometry_science.py
          test "$(git diff --name-only)" = "index.html"
          test "$(git diff --numstat | awk '{print $1" "$2}')" = "2 2"
      - name: Commit contour geometry science
        run: |
          git config user.name "Earthline Engine"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "science: preserve valid curved and short Property contour reaches"
          git push origin HEAD:candidate-next
