name: Earthline Bioswale Report Real-Path Audit 17079

on:
  push:
    branches:
      - stability/v1-launch-audit-17075
    paths:
      - 'tests/report-real-path-17079.mjs'
      - '.github/workflows/earthline-report-real-path-17079.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, edge]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability/v1-launch-audit-17075
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          if [ "${{ matrix.browser }}" = "edge" ]; then
            npx playwright install --with-deps msedge
          else
            npx playwright install --with-deps ${{ matrix.browser }}
          fi
      - name: Run real-path report audit
        env:
          EARTHLINE_BROWSER: ${{ matrix.browser }}
        run: node tests/report-real-path-17079.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-report-real-path-17079-${{ matrix.browser }}
          path: artifacts/report-real-path-17079/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 7
