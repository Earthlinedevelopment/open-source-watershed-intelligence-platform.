name: Earthline Texas Clip Cache Single-Pass

on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/texas-clip-cache-single-pass.mjs'
      - '.github/workflows/earthline-texas-clip-cache-single-pass.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node tests/texas-clip-cache-single-pass.mjs
