name: Earthline Prepare Clean Browser Release 17300
on:
  push:
    branches: [release/browser-fix-17300]
    paths:
      - '.github/workflows/earthline-prepare-release-17300.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/browser-fix-17300
          fetch-depth: 0
      - name: Copy frozen candidate index only
        run: |
          git fetch origin candidate/browser-fix-17299
          git show a0a871471dbe91f87b67635118e953fab4c22006:index.html > index.html
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          markers=[
            'EARTHLINE_EXACT_JURISDICTION_FAST_SCREEN_17270',
            'EARTHLINE_CROSSCALL_JURISDICTION_SCREEN_CACHE_17272',
            'EARTHLINE_GRID_POINT_JURISDICTION_CACHE_17274',
            'EARTHLINE_PERCENTILE_CACHE_17279',
            'EARTHLINE_DEM_SAMPLING_17280',
            'EARTHLINE_HYDROLOGY_CORE_17278',
            'EARTHLINE_DENSIFY_FASTPATH_17285',
            'EARTHLINE_LAND_RING_INDEX_17289',
            'EARTHLINE_TIME_BUDGET_YIELD_17292',
            'EARTHLINE_TERRAIN_INTEGRITY_17293',
            'EARTHLINE_CANCELLED_TERRAIN_HEDGE_17296'
          ]
          missing=[m for m in markers if m not in s]
          if missing: raise SystemExit('missing release markers: '+', '.join(missing))
          print('release markers verified:',len(markers))
          PY
      - name: Commit clean release diff
        run: |
          rm -f .github/workflows/earthline-prepare-release-17300.yml
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/earthline-prepare-release-17300.yml
          git commit -m 'release candidate: browser performance and stability repair 17300'
          git push origin HEAD:release/browser-fix-17300
