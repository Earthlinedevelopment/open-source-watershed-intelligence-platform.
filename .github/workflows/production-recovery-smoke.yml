name: Earthline Production Recovery Smoke
'on':
  push:
    branches: [production-recovery-smoke]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/production-recovery-smoke.mjs
