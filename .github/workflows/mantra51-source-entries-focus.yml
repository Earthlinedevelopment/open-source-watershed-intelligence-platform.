name: Mantra 51 Source Entries Focus
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-source-entries-focus.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='ignore')
          term='sourceEntries16864'
          st=0
          for _ in range(8):
              i=s.find(term,st)
              if i<0: break
              print('\nPOS',i)
              print(s[max(0,i-900):i+3200].replace('\n',' '))
              st=i+len(term)
          PY
