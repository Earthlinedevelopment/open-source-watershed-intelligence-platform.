name: Mantra 51 Rebuild How Swales Structure
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - 'scripts/rebuild_how_swales_structure_16940.py'
      - '.github/workflows/mantra51-rebuild-how-swales-structure.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 scripts/rebuild_how_swales_structure_16940.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          s=Path('index.html').read_text(errors='ignore')
          assert 'earthline-swales-structure-16940' in s
          assert 'earthline-swale-image-link-16940' in s
          assert "take('What a bioswale is')" in s
          assert 'visualBlock+sequence+precedentBlock' in s
          assert "replace(/^§\\d+" in s
          class P(HTMLParser):
              def __init__(self): super().__init__();self.ins=False;self.buf=[];self.scripts=[]
              def handle_starttag(self,t,a):
                  if t.lower()=='script': self.ins=True;self.buf=[]
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.ins:self.scripts.append(''.join(self.buf));self.ins=False
              def handle_data(self,d):
                  if self.ins:self.buf.append(d)
          p=P();p.feed(s);out=Path('/tmp/el-js');out.mkdir(exist_ok=True)
          for i,j in enumerate(p.scripts):(out/f'{i:03}.js').write_text(j)
          PY
          for f in /tmp/el-js/*.js; do node --check "$f" >/dev/null; done
          git add index.html
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git commit -m "fix: rebuild How Swales narrative and image presentation"
          git push
