name: Earthline Final Property Elder Blue E2E 17413
on:
  push:
    branches: [repair/browser-elder-blue-final-17413]
    paths:
      - 'tests/final-property-elder-blue-e2e-17412.mjs'
      - '.github/workflows/earthline-final-e2e-17412.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/browser-elder-blue-final-17413}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          python3 tests/apply-browser-yield-fastpath-17295.py
          python3 tests/apply-wasm-pip-kernel-17319.py
          python3 tests/apply-certified-interior-supertile-17301.py
          python3 tests/apply-skip-regional-preferred-screen-17305.py
          python3 tests/apply-run-scoped-segment-clip-cache-17315.py
          python3 tests/apply-consolidated-provisional-jurisdiction-17325.py
          python3 tests/apply-land-validity-scanline-17352.py
          python3 tests/apply-vermont-cors-first-17360.py
          python3 tests/apply-regional-screen-reuse-17365.py
          python3 tests/apply-telemetry-origin-guard-17368.py
          python3 tests/apply-jurisdiction-edge-fastpath-17373.py
          python3 tests/apply-fast-pip-row-index-17378.py
          python3 tests/apply-fast-pip-geometry-cache-17379.py
          python3 tests/apply-elder-cold-start-17392.py
          python3 tests/apply-elder-worker-numpy-only-17392.py
          python3 tests/apply-elder-postregional-prewarm-17393.py
          python3 tests/apply-property-blue-invariant-17408.py
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          if [ '${{ matrix.browser }}' = 'firefox' ]; then
            xvfb-run -a env BROWSER='firefox' HEADLESS='false' node tests/final-property-elder-blue-e2e-17412.mjs
          else
            env BROWSER='chromium' HEADLESS='true' node tests/final-property-elder-blue-e2e-17412.mjs
          fi
  webkit:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/browser-elder-blue-final-17413}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          python3 tests/apply-browser-yield-fastpath-17295.py
          python3 tests/apply-wasm-pip-kernel-17319.py
          python3 tests/apply-certified-interior-supertile-17301.py
          python3 tests/apply-skip-regional-preferred-screen-17305.py
          python3 tests/apply-run-scoped-segment-clip-cache-17315.py
          python3 tests/apply-consolidated-provisional-jurisdiction-17325.py
          python3 tests/apply-land-validity-scanline-17352.py
          python3 tests/apply-vermont-cors-first-17360.py
          python3 tests/apply-regional-screen-reuse-17365.py
          python3 tests/apply-telemetry-origin-guard-17368.py
          python3 tests/apply-jurisdiction-edge-fastpath-17373.py
          python3 tests/apply-fast-pip-row-index-17378.py
          python3 tests/apply-fast-pip-geometry-cache-17379.py
          python3 tests/apply-elder-cold-start-17392.py
          python3 tests/apply-elder-worker-numpy-only-17392.py
          python3 tests/apply-elder-postregional-prewarm-17393.py
          python3 tests/apply-property-blue-invariant-17408.py
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - run: env BROWSER='webkit' HEADLESS='false' node tests/final-property-elder-blue-e2e-17412.mjs
