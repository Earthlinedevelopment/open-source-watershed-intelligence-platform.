name: Mantra 51 Shared Final Tributary Publication 16922
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - 'lab/mantra51-shared-final-tributary-publication-16922.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra51-global-repair-campaign
          fetch-depth: 0
      - name: Apply shared final tributary publication owner
        run: python3 lab/mantra51-shared-final-tributary-publication-16922.py
      - name: Commit candidate
        run: |
          git config user.name "Earthline"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: preserve validated tributaries through final publication"
          git push origin HEAD:mantra51-global-repair-campaign
