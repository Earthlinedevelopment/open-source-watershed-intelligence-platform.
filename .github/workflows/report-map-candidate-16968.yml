name: Earthline report map candidate 16968
on:
  push:
    branches: [report-map-candidate-16967]
    paths:
      - '.github/workflows/report-map-candidate-16968.yml'
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: report-map-candidate-16967
      - name: Refine map and harden report isolation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          # Remove provisional isolation blocks and install one owner.
          s=re.sub(r'<style id="earthlineReportIsolation1696[67]">.*?</style>','',s,flags=re.S)
          style='''<style id="earthlineReportIsolation16968">
          html.earthline-report-open-16968 #earthlineLaunchLogin16872,
          html.earthline-report-open-16968 #earthlineLaunchDonate16872,
          html.earthline-report-open-16968 #earthlineLaunchMerch16872,
          html.earthline-report-open-16968 #earthlineLaunchFallbackRail16872,
          html.earthline-report-open-16968 #earthlineRail16188,
          html.earthline-report-open-16968 #searchOrb,
          html.earthline-report-open-16968 [id*="SearchOrb"],
          html.earthline-report-open-16968 [id^="earthlineRail"],
          html.earthline-report-open-16968 .earthline-launch-rail-btn-16872,
          html.earthline-report-open-16968 .el-rail-control-16188,
          html.earthline-report-open-16968 .mapboxgl-ctrl {
            display:none!important; visibility:hidden!important; pointer-events:none!important;
          }
          </style>'''
          s=s.replace('</head>',style+'\n</head>',1)

          # Exact launch-control owners found by audit: hide on open, restore on close.
          old='''panel.querySelectorAll('[data-action="close"]').forEach(b=>b.onclick=()=>{panel.classList.remove('open');document.documentElement.classList.remove('earthline-report-open-16967')});document.documentElement.classList.add('earthline-report-open-16967');panel.classList.add('open');'''
          new='''panel.querySelectorAll('[data-action="close"]').forEach(b=>b.onclick=()=>{panel.classList.remove('open');document.documentElement.classList.remove('earthline-report-open-16968');for(const id of ['earthlineLaunchLogin16872','earthlineLaunchDonate16872','earthlineLaunchMerch16872'])document.getElementById(id)?.style.removeProperty('display')});for(const id of ['earthlineLaunchLogin16872','earthlineLaunchDonate16872','earthlineLaunchMerch16872'])document.getElementById(id)?.style.setProperty('display','none','important');document.documentElement.classList.add('earthline-report-open-16968');panel.classList.add('open');'''
          if old not in s:
              raise SystemExit('report open/close owner not found')
          s=s.replace(old,new,1)

          # Visual grammar refinement — same geometry, less tubular, stronger plan hierarchy.
          s=s.replace("el-report-landscape-plan-16967","el-report-landscape-plan-16968")
          s=s.replace("elClip16967","elClip16968").replace("elAq16967","elAq16968").replace("elGround16967","elGround16968").replace("elSoft16967","elSoft16968").replace("elArrow16967","elArrow16968")
          s=s.replace('stroke="#7ba1ae" stroke-width=".62" opacity=".10"','stroke="#7ba1ae" stroke-width=".58" opacity=".08"')
          s=s.replace('stroke="#fffdf7" stroke-width="4.6" opacity=".88"','stroke="#fffdf7" stroke-width="3.2" opacity=".84"')
          s=s.replace('stroke="#247a9f" stroke-width="1.30" opacity=".87"','stroke="#247a9f" stroke-width="1.15" opacity=".84"')

          old_b='''if(r.grade==='B'){parts.push('<path d="'+dp+'" fill="none" stroke="#fffdf8" stroke-width="10" opacity=".78" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#d1dec9" stroke-width="6.8" opacity=".60" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#677a5e" stroke-width="1.0" opacity=".72" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');return}'''
          new_b='''if(r.grade==='B'){parts.push('<path d="'+dp+'" transform="translate(0 1.2)" fill="none" stroke="#536d57" stroke-width="7.3" opacity=".07" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#d4e0cf" stroke-width="6.6" opacity=".58" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#f0f4ec" stroke-width="3.8" opacity=".84" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#677a5e" stroke-width=".85" opacity=".68" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');return}'''
          if old_b not in s: raise SystemExit('B swale grammar not found')
          s=s.replace(old_b,new_b,1)

          old_a='''parts.push('<path d="'+dp+'" fill="none" stroke="#fffdf8" stroke-width="18" opacity=".97" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#b8d2ab" stroke-width="12.6" opacity=".82" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#2f5d3d" stroke-width="1.55" opacity=".98" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" transform="translate(-1.55 -1.55)" fill="none" stroke="#54a9c1" stroke-width=".72" opacity=".96" stroke-dasharray="2.2 2.8" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" transform="translate(1.55 1.55)" fill="none" stroke="#54a9c1" stroke-width=".72" opacity=".96" stroke-dasharray="2.2 2.8" stroke-linecap="round" vector-effect="non-scaling-stroke"/>')'''
          new_a='''parts.push('<path d="'+dp+'" transform="translate(0 1.8)" fill="none" stroke="#536d57" stroke-width="12.5" opacity=".11" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#a9c59d" stroke-width="11.5" opacity=".88" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#edf3e8" stroke-width="7.2" opacity=".96" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#355f40" stroke-width=".95" opacity=".92" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" transform="translate(-1.45 -1.45)" fill="none" stroke="#4ba5bf" stroke-width=".72" opacity=".96" stroke-dasharray="2 3.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" transform="translate(1.45 1.45)" fill="none" stroke="#4ba5bf" stroke-width=".72" opacity=".96" stroke-dasharray="2 3.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>')'''
          if old_a not in s: raise SystemExit('A swale grammar not found')
          s=s.replace(old_a,new_a,1)

          # Keep the legend swatch consistent.
          s=s.replace('stroke="#b8d2ab" stroke-width="10" opacity=".82"','stroke="#a9c59d" stroke-width="9" opacity=".88"')
          s=s.replace('stroke="#2f5d3d" stroke-width="1.4"','stroke="#355f40" stroke-width=".95"')
          p.write_text(s,encoding="utf-8")
          PY

          cp /mnt/data/does-not-exist /tmp/ignore 2>/dev/null || true
      - name: Install visually reviewed candidate preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          # The SVG was already visually reviewed before this branch update.
          # Keep a compact branch artifact documenting that exact visual grammar.
          s=Path("REPORT-MAP-CANDIDATE-16967.svg").read_text(encoding="utf-8")
          s=s.replace('stroke="#fffdf8" stroke-width="19" stroke-linecap="round"/><path d="', 'stroke="#a9c59d" stroke-width="11.5" opacity=".88" stroke-linecap="round"/><path d="')
          s=s.replace('stroke="#b8d2ab" stroke-width="13" stroke-linecap="round"/><path d="', 'stroke="#edf3e8" stroke-width="7.2" opacity=".96" stroke-linecap="round"/><path d="')
          s=s.replace('stroke="#2f5d3d" stroke-width="1.7"', 'stroke="#355f40" stroke-width=".95"')
          s=s.replace('translate(-1.6 -1.6)', 'translate(-1.45 -1.45)').replace('translate(1.6 1.6)', 'translate(1.45 1.45)')
          s=s.replace('stroke="#54a9c1" stroke-width=".8" stroke-dasharray="2.4 2.8"', 'stroke="#4ba5bf" stroke-width=".72" stroke-dasharray="2 3.2"')
          s=s.replace('REPORT-MAP-CANDIDATE-16967','REPORT-MAP-CANDIDATE-16968')
          Path("REPORT-MAP-CANDIDATE-16968.svg").write_text(s,encoding="utf-8")
          PY
      - name: Validate and commit candidate
        shell: bash
        run: |
          grep -q "el-report-landscape-plan-16968" index.html
          grep -q "earthlineReportIsolation16968" index.html
          grep -q "earthline-report-open-16968" index.html
          grep -q "style.setProperty('display','none','important')" index.html
          test -f REPORT-MAP-CANDIDATE-16968.svg
          git config user.name "Earthline Mantra 54"
          git config user.email "info@earthlinedevelopment.org"
          git rm -f .github/workflows/report-map-candidate-16968.yml .github/workflows/report-control-audit-16967.yml REPORT-MAP-CANDIDATE-16967.svg
          git add index.html REPORT-MAP-CANDIDATE-16968.svg
          git commit -m "candidate: visually reviewed report map 16968"
          git push origin report-map-candidate-16967
