name: Mantra 46 16796 Density-Aware Fine Refinement

on:
  push:
    branches:
      - diagnostic-m46-16796-density-refinement
    paths:
      - 'tests/mantra46-16796-density-refinement.mjs'
      - '.github/workflows/mantra46-16796-density-refinement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Evaluate 16796 density-aware refinement
        run: node tests/mantra46-16796-density-refinement.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16796-density-refinement
          path: artifacts/mantra46-16796-density-refinement/
          if-no-files-found: error
