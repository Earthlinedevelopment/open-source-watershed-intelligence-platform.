name: Mantra 121 — Live delivery identity (read-only)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mantra121-live-delivery-readonly.yml

permissions:
  contents: read

jobs:
  check-live-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download live entrypoint and print content identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 https://earthlinedevelopment.org/ -o live.html
          echo "Git blob:"
          git hash-object live.html
          echo "Byte count:"
          wc -c live.html
          echo "SHA-256:"
          sha256sum live.html
          actual="$(git hash-object live.html)"
          expected="745de00dcfafc3aeb6607497fd8a4830c34555b2"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Live Git blob mismatch: expected $expected, got $actual"
            exit 1
          fi
          echo "PASS: live entrypoint matches expected Git blob"
