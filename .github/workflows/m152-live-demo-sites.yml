name: LIVE deployed Earthline no-code Property demo-site screening
on:
  push:
    branches: ['audit/m152-live-no-code-demo-sites']
    paths: ['.github/workflows/m152-live-demo-sites.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        area: [iowa-west, iowa-east, texas, vermont]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test actual public live URL, never intercept same-origin content
        env:
          AREA: ${{ matrix.area }}
        run: |
          cat > m152-live-probe.mjs <<'JS'
          import {chromium} from 'playwright';
          import {mkdirSync,writeFileSync} from 'node:fs';
          const sites={
            'iowa-west':[{id:'IA1',lat:42.20,lng:-93.75},{id:'IA2',lat:42.13,lng:-93.68},{id:'IA3',lat:41.92,lng:-94.02},{id:'IA4',lat:42.08,lng:-93.92}],
            'iowa-east':[{id:'IA5',lat:41.99,lng:-93.42},{id:'IA6',lat:42.16,lng:-93.30},{id:'IA7',lat:42.10,lng:-93.18},{id:'IA8',lat:42.10,lng:-94.20}],
            texas:[{id:'TX1',lat:29.2,lng:-96.47},{id:'TX2',lat:31.7,lng:-97.2}],
            vermont:[{id:'VT1',lat:43.60,lng:-72.97},{id:'VT2',lat:43.75,lng:-72.8}]
          };
          const area=process.env.AREA,points=sites[area],search=area.startsWith('iowa')?'Iowa':area==='texas'?'Texas':'Vermont';
          const browser=await chromium.launch({headless:true});
          mkdirSync('artifacts/live-demo-'+area,{recursive:true});
          const out=[];
          for(const point of points){
            const ctx=await browser.newContext({viewport:{width:1600,height:950},acceptDownloads:true});
            const page=await ctx.newPage();
            const errors=[],bad=[];
            page.on('pageerror',e=>errors.push(String(e).slice(0,250)));
            page.on('response',r=>{if(r.status()>=500)bad.push([r.status(),r.url().slice(0,130)])});
            let r={...point,area,search,origin:'https://earthlinedevelopment.org/',live:true};
            try{
              await page.goto('https://earthlinedevelopment.org/?live_m152='+point.id,{waitUntil:'domcontentloaded',timeout:55000});
              r.build=await page.evaluate(()=>({build:window.EARTHLINE_BUILD||null,footer:document.getElementById('earthlineFooterBuild15784')?.textContent||null}));
              await page.locator('#searchInput').fill(search);
              const suggest=page.locator('#earthlineSearchSuggestions15970 button[data-query]').first();
              if(await suggest.count())await suggest.click({timeout:12000}).catch(()=>{});
              await page.evaluate(q=>{const i=document.getElementById('searchInput');i.value=q;i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));document.getElementById('runBtn')?.click()},search);
              await page.waitForFunction(()=>Boolean(window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167)||Boolean(window.EARTHLINE_LAST_LIVE_REGIONAL_ERROR_15970),null,{timeout:90000,polling:300});
              r.regional=await page.evaluate(()=>({count:window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167?.generated??null,error:window.EARTHLINE_LAST_LIVE_REGIONAL_ERROR_15970?.error||null}));
              if(r.regional.error)throw Error('regional: '+r.regional.error);
              await page.evaluate(p=>{const m=typeof earthlineMap!=='undefined'?earthlineMap:window.earthlineMap;m.stop();m.jumpTo({center:[p.lng,p.lat],zoom:17.7});},point);
              await page.waitForTimeout(1500);
              const target=await page.evaluate(()=>window.EARTHLINE_PROPERTY_TARGET_16201);
              r.target={lng:target?.lng,lat:target?.lat};
              const start=Date.now();
              await page.locator('#earthlineDeclareProperty16169').evaluate(el=>el.click());
              await page.waitForFunction(()=>window.EARTHLINE_PROPERTY_RUN_AUDIT_16173?.settled===true&&document.documentElement.dataset.earthlinePropertyRunState!=='running',null,{timeout:95000,polling:180});
              r.loadSeconds=Number(((Date.now()-start)/1000).toFixed(1));
              try{await page.waitForFunction(()=>['committed','empty','no-coverage','failed'].includes(String(window.EARTHLINE_ELDER_TREE_LAST_17097?.state)),null,{timeout:11000,polling:200})}catch{}
              await page.waitForTimeout(600);
              r.analysis=await page.evaluate(()=>{
                const m=typeof M!=='undefined'?M:window.M||{};
                const a=window.EARTHLINE_PROPERTY_RUN_AUDIT_16173||{};
                const elder=window.EARTHLINE_ELDER_TREE_LAST_17097||{};
                const pu=window.EARTHLINE_PROPERTY_PUBLICATION_AUDIT_16220||{};
                const safe=m.safetyAudit15806||{};
                const ex=m.noBuildProvenance15843||{};
                const reportNodes=[...document.querySelectorAll('button,a,[role="button"]')].filter(el=>/full report|bioswale impact report|view report|open report/i.test(el.textContent||'')).slice(0,12).map(el=>({tag:el.tagName,id:el.id,text:(el.innerText||el.textContent||'').trim().slice(0,120),visible:!!(el.getClientRects().length),href:el.getAttribute('href')||null}));
                return {result:a.result,settled:a.settled,center:a.center,swales:m.swales?.length??0,finalSafe:m.authoritativeSafeSwales15815?.features?.length??0,publication:pu.published,safeCount:pu.safeCount,verified:safe.verified,unsafe:safe.clearance?.unsafeSegments,intersections:safe.clearance?.acceptedIntersections,elderCount:elder.featureCount??null,elderState:elder.state??null,elderPublished:elder.mapPublished??null,elderCoverage:elder.coverageStatus??null,sourceTier:ex.exclusionSourceTier??null,reportNodes,status:document.getElementById('earthlineVermontStatus16147')?.innerText?.slice(0,240)||null};
              });
              await page.screenshot({path:'artifacts/live-demo-'+area+'/'+point.id+'-property.png',fullPage:false});
              const candidate=r.analysis.reportNodes.find(x=>x.visible&&/full report|bioswale impact report|view report|open report/i.test(x.text));
              if(candidate){
                const old=page.url();const before=await page.locator('[role="dialog"],dialog,[id*="ReportModal"],[id*="reportModal"]').count();
                const newPage=ctx.waitForEvent('page',{timeout:6500}).catch(()=>null);
                try{await page.locator(candidate.id?'#'+candidate.id:('[role="button"]')).first().evaluate(el=>el.click())}catch{
                  try{await page.getByText(candidate.text,{exact:false}).first().click({timeout:2500})}catch{}
                }
                await page.waitForTimeout(1200);
                const np=await Promise.race([newPage,Promise.resolve(null)]);
                r.report={clicked:candidate.text,urlChanged:page.url()!==old,dialogsBefore:before,dialogsAfter:await page.locator('[role="dialog"],dialog,[id*="ReportModal"],[id*="reportModal"]').count(),newPage:!!np,reportVisible:await page.getByText('Bioswale', {exact:false}).count()};
                if(np)await np.close().catch(()=>{});
                await page.screenshot({path:'artifacts/live-demo-'+area+'/'+point.id+'-report.png',fullPage:false});
              }else r.report={opened:false,reason:'no visible report controls located'};
            }catch(e){
              r.error=String(e).slice(0,450);
              await page.screenshot({path:'artifacts/live-demo-'+area+'/'+point.id+'-failure.png',fullPage:false}).catch(()=>{});
            }
            r.errors=errors;r.http5xx=bad.slice(-6);
            console.log('M152_LIVE_SITE '+JSON.stringify(r));
            out.push(r);
            await ctx.close();
          }
          writeFileSync('artifacts/live-demo-'+area+'/results.json',JSON.stringify(out,null,2));
          await browser.close();
          JS
          node m152-live-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-demo-${{ matrix.area }}-screens-and-results
          path: artifacts/live-demo-${{ matrix.area }}/
          retention-days: 14
