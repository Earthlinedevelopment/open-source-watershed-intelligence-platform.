name: Earthline report button disappearance audit
on:
  push:
    branches: [pages-live]
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Locate report button and process visibility owners
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for n in ["earthlineVermontReport16149","earthlineReportSection16188","Bioswale Impact Report","earthline-process-open-16991","syncSwalesPage","ensureReport()","style.removeProperty('display')","display:none!important"]:
              print("\n###",n)
              start=0
              for _ in range(20):
                  i=s.find(n,start)
                  if i<0: break
                  print("---",i,"---")
                  print(s[max(0,i-2400):min(len(s),i+4200)])
                  start=i+len(n)
          PY
