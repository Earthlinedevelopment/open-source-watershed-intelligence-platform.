name: Earthline Inspect Property Exclusion Owner
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-inspect-property-exclusions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
      - name: Print canonical exclusion acquisition owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=[
            'all-overpass-endpoints-failed',
            'all-attempted-open-data-exclusion-sources-failed',
            'openDataSources16539',
            'vectorNoBuild15778',
            'vector-exclusion-coverage-unverified',
            'styleReady',
            'earthlineCollectParcelInfrastructure15862P'
          ]
          for needle in needles:
              print('\n===== '+needle+' =====')
              start=0
              hits=0
              while hits<4:
                  i=s.find(needle,start)
                  if i<0: break
                  print('\n--- OFFSET',i,'---')
                  print(s[max(0,i-5000):min(len(s),i+12000)])
                  start=i+len(needle)
                  hits+=1
          PY
