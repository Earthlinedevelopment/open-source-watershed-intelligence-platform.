name: Earthline Eligible Terrain Spacing Correction
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-eligible-terrain-spacing-correction.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 0
      - name: Apply deterministic same-band duplicate correction
        run: |
          python3 tools/apply_same_band_duplicate.py
          test "$(git diff --name-only)" = "index.html"
          git diff --check
      - name: Commit candidate science
        run: |
          git config user.name "Earthline Engine"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "science: remove duplicate same-band Property contours"
          git push origin HEAD:candidate-next
