name: Earthline Poudre First Click Diagnostic
on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/poudre-first-click-diag.mjs'
      - '.github/workflows/earthline-poudre-first-click-diag.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save playwright@1.55.0
      - run: node tests/poudre-first-click-diag.mjs
