name: Mantra 83 Renderer Swale Body
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/renderer-swale-body.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: sed -n '35152,35195p' index.html
