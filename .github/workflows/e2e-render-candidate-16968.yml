name: Earthline E2E report candidate 16968
on:
  push:
    branches: [report-map-candidate-16967]
    paths:
      - '.github/workflows/e2e-render-candidate-16968.yml'
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: report-map-candidate-16967
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Render real candidate report
        shell: bash
        run: |
          cat > e2e16968.cjs <<'JS'
          const fs=require('fs');
          const { chromium }=require('playwright');
          (async()=>{
            const html=fs.readFileSync('index.html','utf8');
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1800,height:1100},deviceScaleFactor:1});
            page.on('console',m=>{if(['error','warning'].includes(m.type()))console.log('BROWSER',m.type(),m.text())});
            page.on('pageerror',e=>console.log('PAGEERROR',e.message));
            await page.route('https://earthlinedevelopment.org/**',async route=>{
              const req=route.request();
              const u=new URL(req.url());
              if(req.resourceType()==='document'&&u.hostname==='earthlinedevelopment.org'){
                await route.fulfill({status:200,body:html,contentType:'text/html; charset=utf-8'});
              }else await route.continue();
            });
            await page.goto('https://earthlinedevelopment.org/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('.mapboxgl-canvas',{timeout:60000});
            await page.waitForTimeout(4500);
            const moved=await page.evaluate(()=>{
              try{
                earthlineMap.jumpTo({center:[-86.68074,32.60936],zoom:17,bearing:0,pitch:0});
                const i=document.getElementById('searchInput');if(i)i.value='';
                return {ok:true,zoom:earthlineMap.getZoom(),center:earthlineMap.getCenter().toArray()};
              }catch(e){return {ok:false,error:String(e&&e.message||e)}}
            });
            console.log('MAP',JSON.stringify(moved));
            if(!moved.ok)throw new Error('map move failed '+moved.error);
            await page.waitForTimeout(1800);
            await page.click('#runBtn');
            await page.waitForFunction(()=>{
              const d=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null;
              return !!(d&&String(d.tier||d.mode||'').toLowerCase()==='property');
            },{timeout:150000});
            await page.waitForSelector('#earthlineVermontReport16149',{state:'visible',timeout:30000});
            await page.click('#earthlineVermontReport16149');
            await page.waitForFunction(()=>document.getElementById('earthlineVermontReportPanel16149')?.classList.contains('open'),{timeout:20000});
            await page.waitForSelector('.el-report-landscape-plan-16968',{state:'visible',timeout:20000});
            await page.waitForTimeout(1200);
            const audit=await page.evaluate(()=>{
              const ids=['earthlineLaunchLogin16872','earthlineLaunchDonate16872','earthlineLaunchMerch16872'];
              const controls=Object.fromEntries(ids.map(id=>{const el=document.getElementById(id);return[id,el?getComputedStyle(el).display:'missing']}));
              const svg=document.querySelector('.el-report-landscape-plan-16968');
              const report=document.getElementById('earthlineVermontReportPanel16149');
              return {
                controls,
                reportOpen:!!report?.classList.contains('open'),
                mapClass:svg?.getAttribute('class')||null,
                mapBox:svg?svg.getBoundingClientRect().toJSON():null,
                header:document.querySelector('#earthlineVermontReportPanel16149 .el49-toolbar small')?.textContent||''
              };
            });
            console.log('AUDIT',JSON.stringify(audit));
            if(!audit.reportOpen||audit.mapClass!=='el-report-landscape-plan-16968')throw new Error('candidate report/map not active');
            for(const [id,v] of Object.entries(audit.controls))if(v!=='none')throw new Error(id+' visible: '+v);
            await page.screenshot({path:'REPORT-E2E-CANDIDATE-16968.png',fullPage:false});
            fs.writeFileSync('REPORT-E2E-CANDIDATE-16968.txt',JSON.stringify(audit,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node e2e16968.cjs
      - name: Commit E2E proof
        shell: bash
        run: |
          git config user.name "Earthline Mantra 54"
          git config user.email "info@earthlinedevelopment.org"
          git rm -f .github/workflows/e2e-render-candidate-16968.yml .github/workflows/e2e-selector-audit-16968.yml .github/workflows/e2e-dom-audit-16968.yml
          git add REPORT-E2E-CANDIDATE-16968.png REPORT-E2E-CANDIDATE-16968.txt
          git commit -m "qa: end-to-end report candidate 16968"
          git push origin report-map-candidate-16967
