name: Earthline M75 Live Engine Core Patch
on:
  push:
    branches:
      - recovery/mantra75-live-engine-core
    paths:
      - tools/m75-live-engine-core-patch.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-live-engine-core
          fetch-depth: 0
      - name: Apply engine core patch
        run: python3 tools/m75-live-engine-core-patch.py
      - name: Parse-check inline scripts
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          console.log('EARTHLINE_M75_ENGINE_CORE_PARSE_OK',parsed);
          NODE
      - name: Commit repaired index
        shell: bash
        run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: recover statewide gaps, spacing, and planting ownership"
          git push origin HEAD:recovery/mantra75-live-engine-core
