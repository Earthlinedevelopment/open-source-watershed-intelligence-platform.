name: Mantra 114 Mapbox lifecycle regression
on:
  push:
    branches: [mantra114-mapbox-lifecycle-repair]
  pull_request:
    branches: [pages-live]
    paths:
      - index.html
      - tests/mantra114-mapbox-idempotence.mjs
      - tests/mantra114-arcgis-jsonp-race.mjs
      - tests/mantra114-elder-report-continuity.mjs
      - earthline-elder-restored-17097.js
      - .github/workflows/mantra114-mapbox-lifecycle.yml
permissions:
  contents: read
jobs:
  state-idempotence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify unchanged source/style writes and JavaScript syntax
        run: |
          node tests/mantra114-mapbox-idempotence.mjs
          node tests/mantra114-arcgis-jsonp-race.mjs
          node tests/mantra114-elder-report-continuity.mjs
          node tests/mantra94-elder-owner.mjs
          node tests/mantra102-no-spline-swales.mjs
      - name: Check exact candidate version
        run: |
          git rev-parse HEAD
          sha256sum index.html
