name: Earthline Swale Science Lineage Audit
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-swale-science-lineage-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Trace flow-first science introduction
        run: |
          echo '=== FLOW-FIRST INTRODUCTION ==='
          git log --all --reverse --format='%H %ad %s' --date=iso -S 'flow-first-tributary-interception-15836-with-contour-fill' -- index.html | head -n 40
          echo '=== FLOW-FIRST OWNER INTRODUCTION ==='
          git log --all --reverse --format='%H %ad %s' --date=iso -S 'flowFirstPlacement15836' -- index.html | head -n 40
          echo '=== ACCEPTED 16584 PARENT ==='
          git show -s --format='%H %P %ad %s' --date=iso 74343a24f90fed7d7abbe9267ef11a2836220de7
          echo '=== SCIENCE HISTORY AROUND ACCEPTED ==='
          git log --all --format='%H %ad %s' --date=iso -- index.html | grep -Ei 'swale|contour|flow|spacing|science|property' | head -n 120
