name: Earthline one-time swale cache refresh
on:
  push:
    branches: [pages-live]
    paths:
      - .github/workflows/earthline-refresh-swale-cache-20261126.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update swale script version from actual SHA256
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          script = Path('earthline-property-swales.js').read_bytes()
          version = hashlib.sha256(script).hexdigest()[:8].encode()
          page = Path('index.html')
          raw = page.read_bytes()
          pattern = rb'earthline-property-swales\.js\?v=[A-Za-z0-9_-]+'
          matches = list(re.finditer(pattern, raw))
          if len(matches) != 1:
              raise SystemExit(f'Refusing ambiguous HTML edit: {len(matches)} matches')
          updated = re.sub(pattern, b'earthline-property-swales.js?v=' + version, raw, count=1)
          page.write_bytes(updated)
          print('Expected swale script cache version:', version.decode())
          PY
      - name: Commit HTML-only cache fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Match Property swale script cache key to served SHA256"
            git push origin HEAD:pages-live
          fi
