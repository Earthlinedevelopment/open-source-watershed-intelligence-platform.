name: Earthline Mantra 72 Committed Water Owner
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-m72-water-generation-owner.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Patch direct-water owner gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          pattern=r'''  function propertyActive15824\(\)\{[\s\S]*?\n  \}\n\n  function viewAllowsWater15824\(\)\{'''
          replacement='''  function propertyActive15824(){
            const publication=M&&M.propertyPublication15816||null;
            /* EARTHLINE 17568 — the committed Property publication generation is the sole
               lifetime owner of direct blue water. Legacy analysisReady/display-tier state
               may repaint or settle independently but may not erase a still-current,
               safety-verified Property publication. A newer Property/Regional search
               supersedes ownership by advancing M.searchGen. */
            return !!(
              M&&
              publication&&
              publication.committed===true&&
              publication.safetyVerified===true&&
              Number(publication.searchGen)===Number(M.searchGen)
            );
          }

          function viewAllowsWater15824(){'''
          if "EARTHLINE 17568" in s:
              raise SystemExit("17568 already present")
          s2,n=re.subn(pattern,replacement,s,count=1)
          assert n==1,n
          assert s2.count("function propertyActive15824()")==1
          assert s2.count("EARTHLINE 17568")==1
          p.write_text(s2,encoding="utf-8")
          PY
      - name: Validate scripts and ownership
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          if((s.match(/EARTHLINE 17568/g)||[]).length!==1) throw Error('17568 marker');
          if((s.match(/function propertyActive15824\(\)/g)||[]).length!==1) throw Error('15824 owner count');
          const start=s.indexOf('function propertyActive15824()');
          const end=s.indexOf('function viewAllowsWater15824()',start);
          if(start<0||end<0) throw Error('owner block');
          const owner=s.slice(start,end);
          if(owner.includes('M&&M.analysisReady')) throw Error('legacy analysisReady owner gate');
          if(owner.includes('EARTHLINE_DISPLAYED_RUN_16151')) throw Error('display-tier owner gate');
          if(!owner.includes('Number(publication.searchGen)===Number(M.searchGen)')) throw Error('generation ownership missing');
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim()) continue;
            try{new Function(m[1])}catch(e){throw Error('script '+i+' '+e.message)}
          }
          NODE
      - name: Publish
        shell: bash
        run: |
          git config user.name "Earthline Production Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git rm .github/workflows/earthline-m72-water-generation-owner.yml
          git add index.html
          git commit -m "fix: bind Property blue water to committed publication generation"
          git push origin HEAD:pages-live
