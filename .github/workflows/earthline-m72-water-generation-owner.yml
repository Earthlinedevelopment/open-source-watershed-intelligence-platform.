name: Earthline Mantra 72 Committed Water Owner
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-m72-water-generation-owner.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Patch direct-water owner gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old='''  function propertyActive15824(){
            const publication=M&&M.propertyPublication15816||null;
            const displayed=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null;
            const displayedTier=String(displayed&&(displayed.tier||displayed.mode)||"").toLowerCase();
            /* EARTHLINE 17566 — canonical committed Property display owns direct blue water; legacy mode/search-generation bookkeeping may not erase it. */
            return !!(
              M&&M.analysisReady&&
              publication&&
              publication.committed===true&&
              publication.safetyVerified===true&&
              displayed&&
              displayedTier==="property"
            );
          }'''
          new='''  function propertyActive15824(){
            const publication=M&&M.propertyPublication15816||null;
            /* EARTHLINE 17568 — the committed Property publication generation is the sole
               lifetime owner of direct blue water. Legacy analysisReady/display-tier state
               may repaint or settle independently but may not erase a still-current,
               safety-verified Property publication. A newer Property/Regional search
               supersedes ownership by advancing M.searchGen. */
            return !!(
              M&&
              publication&&
              publication.committed===true&&
              publication.safetyVerified===true&&
              Number(publication.searchGen)===Number(M.searchGen)
            );
          }'''
          assert s.count(old)==1, s.count(old)
          assert "EARTHLINE 17568" not in s
          s=s.replace(old,new)
          assert s.count("function propertyActive15824()")==1
          assert s.count("EARTHLINE 17568")==1
          p.write_text(s,encoding="utf-8")
          PY
      - name: Validate scripts and ownership
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          if((s.match(/EARTHLINE 17568/g)||[]).length!==1) throw Error('17568 marker');
          if((s.match(/function propertyActive15824\(\)/g)||[]).length!==1) throw Error('15824 owner count');
          const owner=s.match(/function propertyActive15824\(\)\{[\s\S]*?\n  \}/);
          if(!owner) throw Error('owner block');
          if(owner[0].includes('M&&M.analysisReady')) throw Error('legacy analysisReady owner gate');
          if(!owner[0].includes('Number(publication.searchGen)===Number(M.searchGen)')) throw Error('generation ownership missing');
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim()) continue;
            try{new Function(m[1])}catch(e){throw Error('script '+i+' '+e.message)}
          }
          NODE
      - name: Publish
        shell: bash
        run: |
          git config user.name "Earthline Production Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git rm .github/workflows/earthline-m72-water-generation-owner.yml
          git add index.html
          git commit -m "fix: bind Property blue water to committed publication generation"
          git push origin HEAD:pages-live
