name: Earthline M48 recover 16869 verification evidence
on:
  push:
    branches:
      - mantra48-report-isolation-16870
    paths:
      - .github/workflows/earthline-m48-report-diagnostic-16870.yml
permissions:
  actions: read
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download earlier final production verification artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/old16869 lab
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10963961890/zip" > /tmp/old16869.zip
          unzip -o /tmp/old16869.zip -d /tmp/old16869
          if [ -f /tmp/old16869/verification.json ]; then
            cp /tmp/old16869/verification.json lab/mantra48-earlier-final-verification-16869.json
          else
            find /tmp/old16869 -maxdepth 3 -type f -print
            exit 1
          fi
          cat lab/mantra48-earlier-final-verification-16869.json
      - name: Commit recovered evidence to isolation branch
        run: |
          git config user.name "earthline-diagnostic-bot"
          git config user.email "info@earthlinedevelopment.org"
          git add lab/mantra48-earlier-final-verification-16869.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag: recover earlier 16869 final verification evidence"
          git push origin HEAD:mantra48-report-isolation-16870
