name: Earthline Live Elder Worker Direct 17154
on:
  push:
    branches: [v2/stable-replacement-17138]
    paths:
      - 'tests/live-elder-worker-direct-17154.mjs'
      - '.github/workflows/earthline-live-elder-worker-direct-17154.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/live-elder-worker-direct-17154.mjs
