name: Earthline M92 swale regeneration source audit
on:
  push:
    branches: [audit/mantra92-regional-fallback-isolation]
    paths: [.github/workflows/mantra92-swale-cache-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect exact regeneration candidate boundaries
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 166f5a603ef0762889972f1011ef4fac3d206f87
          git show 166f5a603ef0762889972f1011ef4fac3d206f87:index.html >/tmp/site.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/site.html').read_text()
          begin=s.index('async function makeSwales(')
          end=s.index('return swaleCollectionM90;',begin)
          part=s[begin:end+len('return swaleCollectionM90;')]
          print('M92_SWALE_FUNC_LENGTH',len(part))
          for q in ['const candidates','let candidates','candidates.push','supplementalCandidates16702','supplementalCandidates','candidatesBeforeJurisdiction','const preferredEligibleCount16539','if(focusMode||preferredEligibleCount16539<36)','const swaleCollectionM90','return swaleCollectionM90']:
            inds=[m.start() for m in re.finditer(re.escape(q),part)]
            print('M92_SWALE_PART',repr(q),'count',len(inds),'offsets',inds[:12])
            for i in inds[:5]: print('M92_SWALE_SNIP',repr(q),repr(part[max(0,i-600):i+1000]))
          PY
