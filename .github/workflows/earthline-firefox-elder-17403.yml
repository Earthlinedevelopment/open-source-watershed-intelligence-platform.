name: Earthline Firefox Elder Hotpath 17403
on:
  push:
    branches: [repair/browser-elder-final-17392]
    paths:
      - 'tools/elder_trees/chmv2_array_detector_17129.py'
      - '.github/workflows/earthline-firefox-elder-17403.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/browser-elder-final-17392}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps firefox
      - run: xvfb-run -a env BROWSER='firefox' HEADLESS='false' node tests/elder-warm-worker-live-17402.mjs
