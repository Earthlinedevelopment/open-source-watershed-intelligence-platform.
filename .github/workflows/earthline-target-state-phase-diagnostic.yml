name: Earthline Target State Phase Diagnostic

on:
  push:
    branches: [pages-live]
    paths:
      - 'lab/target-state-phase-diagnostic.mjs'
      - '.github/workflows/earthline-target-state-phase-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Run focused phase diagnostic
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
        run: node lab/target-state-phase-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-target-state-phase-diagnostic
          path: lab-results/target-state-phase-diagnostic.json
          retention-days: 7
