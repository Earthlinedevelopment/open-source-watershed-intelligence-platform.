name: Earthline Browser Rollout Gate 17298
on:
  push:
    branches: [gate/browser-rollout-17298]
    paths:
      - 'tests/browser-rollout-production-origin-17298.mjs'
      - '.github/workflows/earthline-browser-rollout-17298.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rollout:
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    runs-on: ${{ matrix.browser == 'webkit' && 'macos-14' || 'ubuntu-24.04' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate/browser-rollout-17298
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build 17296 winning candidate
        run: |
          python3 tests/apply-exact-jurisdiction-fast-screen-17270.py
          python3 tests/apply-consolidated-jurisdiction-screen-17262.py
          python3 tests/apply-crosscall-jurisdiction-cache-17272.py
          python3 tests/apply-grid-point-cache-17274.py
          python3 tests/apply-terrain-hedge-17275.py
          python3 tests/apply-percentile-cache-17279.py
          python3 tests/apply-dem-sampling-17280.py
          python3 tests/apply-hydrology-core-17278.py
          python3 tests/apply-densify-fastpath-17285.py
          python3 tests/apply-land-ring-index-17289.py
          python3 tests/apply-time-budget-yield-17292.py
          python3 tests/apply-terrain-integrity-17293.py
          python3 tests/apply-cancelled-terrain-hedge-17296.py
      - run: |
          npm install --no-save playwright@1.55.0
          if [ "${{ matrix.browser }}" = "webkit" ]; then npx playwright install webkit; else npx playwright install --with-deps firefox; fi
      - name: Run 7-state production-origin gate
        run: |
          if [ "${{ matrix.browser }}" = "firefox" ]; then
            xvfb-run -a env BROWSER=firefox node tests/browser-rollout-production-origin-17298.mjs
          else
            env BROWSER=webkit node tests/browser-rollout-production-origin-17298.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-rollout-${{ matrix.browser }}-17298
          path: artifacts/browser-rollout-17298/${{ matrix.browser }}/
          if-no-files-found: warn
