name: Promote Earthline Property selector restore 17046

on:
  push:
    branches:
      - candidate/property-restore-working-selector-17046

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Verify exact production parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "2b81511751939751087065c39a1d40d758cba90f"
      - name: Cherry-pick selector rollback only
        shell: bash
        run: |
          git config user.name "Earthline CI"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin candidate/property-restore-working-selector-17046
          git cherry-pick 26f65666f5a5918b382a9eabe64267a42c4ece27
      - name: Verify production candidate diff scope
        shell: bash
        run: |
          git diff --name-only HEAD^ HEAD | grep -qx "index.html"
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 1
          test "$(git diff --numstat HEAD^ HEAD | awk '{print $1+$2}')" -eq 10
      - name: Push exact rollback to production
        shell: bash
        run: |
          git push origin HEAD:pages-live
