            const page=await browser.newPage({viewport:{width:1800,height:900}});let injectError=null;
            if(variant)await page.route('https://earthlinedevelopment.org/**',async route=>{const req=route.request();if(req.resourceType()!=='document'){await route.continue();return;}const u=new URL(req.url());if(u.pathname!=='/'&&u.pathname!=='/index.html'){await route.continue();return;}const resp=await route.fetch();let body=await resp.text();const anchor='    /* EARTHLINE 16780 — the coarse 6x6 coverage owner can pass while a large';const at=body.indexOf(anchor);if(at<0){injectError='16780 anchor missing';await route.fulfill({response:resp,body});return;}body=body.slice(0,at)+injection+body.slice(at);await route.fulfill({response:resp,body});});
