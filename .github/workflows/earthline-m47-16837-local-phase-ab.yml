            const counts={r5:0,r10:0,r20:0,r30:0,north30:0};if(geo?.features)for(const f of geo.features){if(f?.geometry?.type!=='LineString')continue;const c=f.geometry.coordinates||[];if(!c.length)continue;const m=c[Math.floor((c.length-1)/2)],km=hav(target,m);if(km<=5)counts.r5++;if(km<=10)counts.r10++;if(km<=20)counts.r20++;if(km<=30)counts.r30++;if(km<=30&&m[1]>=target[1])counts.north30++;}
