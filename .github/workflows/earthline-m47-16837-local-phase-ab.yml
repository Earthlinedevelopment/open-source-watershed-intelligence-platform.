        try{
          const vals16837=[];for(let y16837=r16837.y0;y16837<=r16837.y1;y16837++)for(let x16837=r16837.x0;x16837<=r16837.x1;x16837++){
            const i16837=y16837*hy.w+x16837,sp16837=Number(hy.slope[i16837]),ac16837=Number(hy.acc[i16837]),el16837=Number(hy.elev[i16837]);
            if(hy.validityMask16584[i16837]===1&&Number.isFinite(sp16837)&&sp16837>=.05&&sp16837<=4&&Number.isFinite(ac16837)&&ac16837<channel16837&&Number.isFinite(el16837))vals16837.push(el16837);
