name: Earthline Live Elder Two Property 17151
on:
  push:
    branches: [v2/stable-replacement-17138]
    paths:
      - 'tests/live-elder-two-property-17151.mjs'
      - '.github/workflows/earthline-live-elder-two-property-17151.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-two-property:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/live-elder-two-property-17151.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-live-elder-two-property-17151
          path: artifacts/live-elder-two-property-17151/
          if-no-files-found: warn
          retention-days: 7
