name: Earthline Image Loader Extract 17273B
on:
  push:
    branches: [diag/dem-loader-17273]
    paths:
      - '.github/workflows/earthline-image-loader-extract-17273b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/dem-loader-17273
      - name: Extract image tile loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['fetchImageData','TERRARIUM_ALT','TERRARIUM=']:
              i=s.find(needle)
              print('\n===== '+needle+' @ '+str(i)+' =====')
              if i>=0: print(s[max(0,i-9000):i+9000])
          PY
