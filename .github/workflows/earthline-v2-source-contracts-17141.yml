name: Earthline V2 Source Contracts 17141
on:
  push:
    branches: [v2/stable-replacement-17138]
    paths:
      - 'v2/hydrogeology-source-adapter.js'
      - 'v2/hydrogeology-transport.js'
      - 'v2/data/usgs-hydrogeology-2025/shards-5x5/**'
      - 'v2/source-registry.json'
      - 'v2/naip-imagery-adapter.js'
      - 'tests/v2-hydrogeology-source-adapter.mjs'
      - 'tests/v2-hydrogeology-transport.mjs'
      - 'tests/v2-hydrogeology-representative-regions.mjs'
      - 'tests/v2-naip-imagery-adapter.mjs'
      - '.github/workflows/earthline-v2-source-contracts-17141.yml'
  workflow_dispatch:
concurrency:
  group: earthline-v2-sources-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/v2-hydrogeology-source-adapter.mjs
      - run: node tests/v2-hydrogeology-transport.mjs
      - run: node tests/v2-hydrogeology-representative-regions.mjs
      - name: Validate non-blocking NAIP contract
        run: node tests/v2-naip-imagery-adapter.mjs
