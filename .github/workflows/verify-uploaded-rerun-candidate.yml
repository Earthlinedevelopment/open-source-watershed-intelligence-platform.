name: Verify exact uploaded Property rerun candidate
on:
  push:
    branches: [candidate/property-rerun-fix]
    paths:
      - tools/apply-user-property-rerun-candidate.py
      - .github/workflows/verify-uploaded-rerun-candidate.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-exact-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/property-rerun-fix
          persist-credentials: true
      - name: Apply exact three-line patch and verify supplied SHA-256
        run: python3 tools/apply-user-property-rerun-candidate.py
      - name: Commit ONLY hash-verified HTML, never production
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then exit 0; fi
          test "$(git diff --name-only)" = "index.html"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(candidate): exact supplied three-line Property rerun correction'
          git push origin HEAD:candidate/property-rerun-fix
