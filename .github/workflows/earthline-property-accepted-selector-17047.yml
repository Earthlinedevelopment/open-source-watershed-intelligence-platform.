name: Earthline Property accepted selector 17047
permissions:
  contents: write
on:
  push:
    branches:
      - candidate/property-restore-accepted-selector-17047
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/property-restore-accepted-selector-17047
      - name: Restore accepted Property selector only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          original=t
          changes=[
            ('const chosen=[],primarySpacing=Math.max(3,Math.round(hy.w/31));',
             'const chosen=[],primarySpacing=Math.max(6,Math.round(hy.w/31));'),
            ('const baseRegionalCapacity16755=focusMode?80:Math.min(120,Math.max(80,coverageGroups16736.size*4));',
             'const baseRegionalCapacity16755=focusMode?52:Math.min(120,Math.max(80,coverageGroups16736.size*4));'),
            ('const regionalCapacity16755=focusMode?80:baseRegionalCapacity16755+supportExtra16755;',
             'const regionalCapacity16755=focusMode?52:baseRegionalCapacity16755+supportExtra16755;'),
            ('const spacing=chosen.length<20?primarySpacing:Math.max(2,Math.round(primarySpacing*.72));',
             'const spacing=chosen.length<20?primarySpacing:Math.max(4,Math.round(primarySpacing*.72));')
          ]
          for old,new in changes:
              n=t.count(old)
              if n!=1:
                  raise SystemExit(f'exact selector expression count {n}, expected 1: {old}')
              t=t.replace(old,new,1)
          if t==original:
              raise SystemExit('no selector changes made')
          # Preserve Property exclusion from Regional dispersion owners.
          if t.count('if(!focusMode&&chosen.length&&candidates.length)') < 2:
              raise SystemExit('Regional-only spread guards missing')
          # Verify accepted Property density parameters are present.
          required=[
            'const chosen=[],primarySpacing=Math.max(6,Math.round(hy.w/31));',
            'const regionalCapacity16755=focusMode?52:baseRegionalCapacity16755+supportExtra16755;',
            'const spacing=chosen.length<20?primarySpacing:Math.max(4,Math.round(primarySpacing*.72));'
          ]
          for x in required:
              if x not in t: raise SystemExit('verification failed: '+x)
          p.write_text(t,encoding='utf-8')
          print('PASS: exact accepted Property selector restored: 52 / 6 / 4')
          PY
      - name: Commit clean candidate
        shell: bash
        run: |
          git config user.name 'Earthline CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/earthline-property-accepted-selector-17047.yml
          git add index.html
          git commit -m 'candidate: restore accepted Property selector density 17047 [skip ci]'
          git push origin HEAD:candidate/property-restore-accepted-selector-17047
