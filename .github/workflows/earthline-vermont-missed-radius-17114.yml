name: Earthline Vermont Missed-Control Radius Sweep 17114

on:
  push:
    branches:
      - research/elder-density-calibration-17100
    paths:
      - '.github/workflows/earthline-vermont-missed-radius-17114.yml'
      - 'tools/elder_trees/chmv2_aoi_candidates.py'
      - 'tools/elder_trees/vermont_ql1_pilot.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/elder-density-calibration-17100
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy rasterio pyproj requests
      - name: Generate Vermont controls
        run: python tools/elder_trees/vermont_ql1_pilot.py artifacts/vermont-controls
      - name: Sweep refinement radius on 17111 misses
        run: |
          python - <<'PY'
          import json,subprocess,pathlib,glob,math
          misses=[0,5,7,8,10,11,12,14,16,17,22]
          radii=[3,5,10,15]
          refs=json.load(open('artifacts/vermont-controls/vermont-public-big-tree-controls.geojson'))['features']
          def hav(a,b):
              lon1,lat1=a;lon2,lat2=b;R=6371008.8
              p1,p2=math.radians(lat1),math.radians(lat2)
              dp=math.radians(lat2-lat1);dl=math.radians(lon2-lon1)
              q=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*R*math.asin(min(1,math.sqrt(q)))
          out={}
          for radius in radii:
              ds=[]; detail=[]
              for i in misses:
                  f=refs[i];lon,lat=f['geometry']['coordinates']
                  bbox=f"{lon-.006},{lat-.0045},{lon+.006},{lat+.0045}"
                  root=pathlib.Path('artifacts')/f'r{radius}'/f'control-{i:02d}'
                  subprocess.run([
                    'python','tools/elder_trees/chmv2_aoi_candidates.py',
                    '--bbox='+bbox,'--max-per-tile=6000','--screen-size=1024',
                    f'--refine-radius-m={radius}','--preserve-all-eligible','--out',str(root)
                  ],check=True,stdout=subprocess.DEVNULL)
                  pools=glob.glob(str(root/'elder-tree-candidate-pool-*.geojson'))
                  feats=json.load(open(pools[0]))['features'] if pools else []
                  d=min((hav((lon,lat),g['geometry']['coordinates']) for g in feats),default=None)
                  if d is not None: ds.append(d)
                  detail.append({'control_index':i,'nearest_m':round(d,2) if d is not None else None,'candidate_count':len(feats)})
              s=sorted(ds);n=len(s)
              med=(s[n//2] if n%2 else (s[n//2-1]+s[n//2])/2) if s else None
              out[str(radius)]={
                'missed_controls_with_candidates':len(ds),
                'recovered_within_10m':int(sum(x<=10 for x in ds)),
                'recovered_within_20m':int(sum(x<=20 for x in ds)),
                'recovered_within_30m':int(sum(x<=30 for x in ds)),
                'median_nearest_m':round(med,2) if med is not None else None,
                'detail':detail
              }
          pathlib.Path('artifacts/vermont-missed-radius-17114.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-vermont-missed-radius-17114
          path: artifacts/vermont-missed-radius-17114.json
          retention-days: 14
