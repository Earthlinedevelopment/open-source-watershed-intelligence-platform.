name: Earthline Apply Property Contour Density Science
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-apply-property-contour-density.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 0
      - name: Apply deterministic Property contour-density science
        run: |
          python3 tools/apply_property_contour_density.py
          test "$(git diff --name-only)" = "index.html"
          git diff --check
      - name: Commit candidate science
        run: |
          git config user.name "Earthline Engine"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "science: densify Property contour sampling within eligible terrain"
          git push origin HEAD:candidate-next
