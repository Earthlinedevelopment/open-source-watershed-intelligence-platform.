name: Earthline 16774 Deploy Capacity-Balanced Dispersion
on:
  push:
    branches: [main]
    paths: ['lab/TRIGGER-16774-DEPLOY.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Fetch authoritative patch
        run: |
          git fetch origin main
          git show origin/main:lab/apply-16774-capacity-balanced-dispersion.py > /tmp/apply-16774.py
      - name: Apply 16774
        run: |
          python3 /tmp/apply-16774.py
          grep -q "EARTHLINE 16774" index.html
          git diff --check
      - name: Publish pages-live candidate
        run: |
          git config user.name "Earthline CI"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "repair: balance fine-terrain dispersion with gap-refinement capacity"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
