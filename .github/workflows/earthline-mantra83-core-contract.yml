name: Mantra 83 Core Contract
on:
  push:
    branches: [mantra83-forensic]
    paths:
      - 'science/mantra83-core.mjs'
      - 'science/MANTRA83-SCIENCE-CONTRACT.md'
      - 'tests/mantra83-core-contract.mjs'
      - '.github/workflows/earthline-mantra83-core-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/mantra83-core-contract.mjs
