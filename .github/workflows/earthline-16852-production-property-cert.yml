name: Earthline 16852 Production HTTPS Property Certification
on:
  push:
    branches: [us-launch-candidate-16852]
    paths:
      - '.github/workflows/earthline-16852-production-property-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  property_https:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - batch: b1
            states: "Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia"
          - batch: b2
            states: "Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland"
          - batch: b3
            states: "Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey"
          - batch: b4
            states: "New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina"
          - batch: b5
            states: "South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: us-launch-candidate-16852
      - name: Verify production branch still exact 16844
        run: |
          git fetch origin pages-live
          test "$(git rev-parse origin/pages-live)" = "a795ff5f80ed3500cfe3d77c7f5d153462bef340"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run live HTTPS Property lifecycle gate
        shell: bash
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          STATES: ${{ matrix.states }}
          OUT: production-property-16852-${{ matrix.batch }}.json
        run: |
          set +e
          node lab/validate-16728-property-50states.mjs
          code=$?
          echo "$code" > production-property-16852-${{ matrix.batch }}.exit
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-property-16852-${{ matrix.batch }}
          path: |
            production-property-16852-${{ matrix.batch }}.json
            production-property-16852-${{ matrix.batch }}.exit
          if-no-files-found: error
      - name: Enforce HTTPS Property result
        run: test "$(cat production-property-16852-${{ matrix.batch }}.exit)" = "0"
