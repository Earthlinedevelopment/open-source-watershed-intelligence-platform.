name: Earthline 16776 Nebraska Repeat Gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-m45-16776-ne-repeat.yml']
permissions:
  contents: read
jobs:
  repeat:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        iteration: [1,2,3]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Build 16776 candidate
        shell: bash
        run: |
          mkdir -p /tmp/m45
          curl -fsSL "https://earthlinedevelopment.org/?ne16776=$RANDOM" > /tmp/m45/index.html
          cp lab/apply-16776-full-capacity-dispersion.py /tmp/m45/apply.py
          cd /tmp/m45
          python3 apply.py
          grep -q "EARTHLINE 16776" index.html
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Repeat Nebraska
        shell: bash
        env:
          ITERATION: ${{ matrix.iteration }}
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright'; import fs from 'fs';
          const iteration=Number(process.env.ITERATION),body=fs.readFileSync('/tmp/m45/index.html','utf8');
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1908,height:882}});
          await page.route('https://earthlinedevelopment.org/**',async route=>{
            const req=route.request(),u=new URL(req.url());
            if(req.resourceType()==='document'&&(u.pathname==='/'||u.pathname==='/index.html')){
              const resp=await route.fetch();await route.fulfill({response:resp,body,headers:{...resp.headers(),'cache-control':'no-store'}});return;
            }
            await route.continue();
          });
          await page.goto('https://earthlinedevelopment.org/?ne16776r='+iteration+'-'+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForSelector('#searchInput',{timeout:30000});
          await page.evaluate(()=>{const i=document.getElementById('searchInput'),b=document.getElementById('runBtn');i.value='nebraska state';i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));b.click();});
          await page.waitForFunction(()=>{const s=window.EARTHLINE_SPATIAL_COVERAGE_SELECTION_16736,p=window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167,d=window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020;return s?.build==='EARTHLINE 16776'&&Number(p?.generated||0)>0&&Number(p?.generated||0)===Number(d?.swaleLines||0);},null,{timeout:70000,polling:100});
          await page.waitForTimeout(250);
          const out=await page.evaluate(()=>{const perf=window.EARTHLINE_REGIONAL_PERFORMANCE_16191||{},s=window.EARTHLINE_SPATIAL_COVERAGE_SELECTION_16736||{},p=window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167||{},d=window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020||{},flow=window.EARTHLINE_LAND_VALIDITY_FLOW_AUDIT_16584||{},ref=window.EARTHLINE_COVERAGE_GAP_REFINEMENT_16731||{};return {build:s.build,reserved:Number(s.reserved||0),capacity:Number(s.capacity||0),generated:Number(p.generated||0),visible:Number(d.swaleLines||0),coreMs:Number(perf.totalMs||NaN),refinementMs:Number(ref.elapsedMs||0),unsafe:Number(flow.unsafeSegments??NaN)};});
          out.iteration=iteration; console.log('NE16776 '+JSON.stringify(out)); await browser.close();
          if(!(out.coreMs<=15000&&out.generated===out.visible&&out.generated>0&&out.unsafe===0))process.exit(2);
          JS
