name: Earthline Live Exact Repeat Search 17463
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - 'tests/live-exact-repeat-search-17463.mjs'
      - '.github/workflows/earthline-live-exact-repeat-search-17463.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/earthline-launch-17454, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/live-exact-repeat-search-17463.mjs > tests/live-exact-repeat-search-17463.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: env EARTHLINE_URL='https://earthlinedevelopment.org/' node tests/live-exact-repeat-search-17463.mjs
