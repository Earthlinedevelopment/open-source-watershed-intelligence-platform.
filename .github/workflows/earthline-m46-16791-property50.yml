name: Earthline SEA Live Regression

on:
  push:
    branches: [regression-2026-10-06-sea]
    paths:
      - 'tests/final-launch-smoke-17001.mjs'
      - 'lab/validate-16728-property-50states.mjs'
      - '.github/workflows/earthline-m46-16791-property50.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sea:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: regression-2026-10-06-sea
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Laos Thailand Vietnam Regional smoke
        continue-on-error: true
        env:
          EARTHLINE_QUERIES: "Laos|Thailand|Vietnam"
        run: node tests/final-launch-smoke-17001.mjs
      - name: Recheck Vietnam Regional timing
        continue-on-error: true
        env:
          EARTHLINE_QUERIES: "Vietnam"
        run: node tests/final-launch-smoke-17001.mjs
      - name: Run Laos Thailand Vietnam Property certification
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          STATES: "Laos|Thailand|Vietnam"
          OUT: sea-property-current.json
        run: node lab/validate-16728-property-50states.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-sea-current-regression
          path: |
            artifacts/final-launch-smoke-17001/results.json
            sea-property-current.json
          if-no-files-found: warn
