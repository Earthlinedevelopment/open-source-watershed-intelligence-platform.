name: Earthline Live Swale Owner Audit
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-live-swale-owner-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra76-audit-restart
          fetch-depth: 0
      - name: Audit actual live swale geometry ownership
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin pages-live
          git show origin/pages-live:index.html > /tmp/live.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/live.html').read_text(encoding='utf-8')
          needles=[
            'authoritativeSafeSwales15815','EARTHLINE_PROPERTY_SAFE','safeSwales',
            'prescribeSwales15778','prescribeSwales(','earthlineSwaleFromPts',
            'swales=', 'M.swales','swaleFC','setData(fc)','setData(authoritativeFC',
            'EARTHLINE_M76_NATURAL_FROM_VERIFIED_SAFE_GEOMETRY',
            'flowFirstAudit15836','localContourReachM76'
          ]
          out=[]
          for n in needles:
              hits=[m.start() for m in re.finditer(re.escape(n),s)]
              out.append(f'===== {n} COUNT {len(hits)} =====')
              for i in hits[-20:]:
                  out.append(s[max(0,i-700):min(len(s),i+1400)].replace('\n',' '))
          Path('M76-LIVE-OWNER-AUDIT.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add M76-LIVE-OWNER-AUDIT.txt
          git commit -m "audit: trace live swale geometry owner" || true
          git push origin HEAD:recovery/mantra76-audit-restart
