name: Earthline Texas Aquifer BBox Repair Test
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/texas-aquifer-bbox-repair.mjs'
      - '.github/workflows/earthline-texas-aquifer-bbox.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  texas-aquifer-bbox:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node tests/texas-aquifer-bbox-repair.mjs
