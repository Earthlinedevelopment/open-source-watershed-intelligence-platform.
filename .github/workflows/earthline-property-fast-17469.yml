name: Earthline Property Fast Live-Origin 17469
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - 'tests/property-fast-live-origin-17469.mjs'
      - '.github/workflows/earthline-property-fast-17469.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/earthline-launch-17454, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/apply-property-pointer-fast-17466.py > /tmp/a.py
          git show origin/repair/property-one-click-17441:tests/apply-elder-corridor-compute-prefetch-17468.py > /tmp/b.py
          git show origin/repair/property-one-click-17441:tests/property-fast-live-origin-17469.mjs > tests/property-fast-live-origin-17469.mjs
          python3 /tmp/a.py
          python3 /tmp/b.py
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/property-fast-live-origin-17469.mjs
