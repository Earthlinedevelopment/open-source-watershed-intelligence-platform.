name: Earthline Universal State Boundary
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['tools/mantra74-universal-state-boundary.py']
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          fetch-depth: 0
      - name: Apply universal state boundary path
        run: python3 tools/mantra74-universal-state-boundary.py
      - name: Validate universal engine
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          if(s.includes('vermontRequest'))throw Error('Vermont runtime branch remains');
          if(s.includes('earthlineClipVermontProducts16178({contours'))throw Error('Vermont Regional clip call remains');
          if(!s.includes('EARTHLINE 17690 — universal jurisdiction path'))throw Error('universal state path missing');
          if(!s.includes('const jurisdictionCapability16539=!focusMode?earthlineAdministrativeCapability16539(loc):null;'))throw Error('shared state capability missing');
          console.log('EARTHLINE_17690_INLINE_SCRIPTS_OK',parsed);
          console.log('EARTHLINE_17690_UNIVERSAL_STATE_PATH_OK');
          NODE
          git diff --check
      - name: Commit consolidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Earthline Stability Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git rm -f tools/mantra74-universal-state-boundary.py .github/workflows/earthline-universal-state-boundary.yml
          git add index.html
          git commit -m "stability: route all US states through shared boundary owner"
          git push origin HEAD:recovery/mantra74-stability
