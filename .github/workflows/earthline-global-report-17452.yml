name: Earthline Global Report Cross-Browser 17452
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/earthline-global-report-17452.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        query: [Vermont, Alabama, Canada, Brazil, Switzerland, Thailand, Vietnam, Laos, New Zealand]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/earthline-launch-17445, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/report-global-17452.mjs > tests/report-global-17452.mjs
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - id: test
        continue-on-error: true
        run: env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='${{ matrix.browser }}' HEADLESS='true' QUERY='${{ matrix.query }}' node tests/report-global-17452.mjs
      - name: Persist result
        if: always()
        run: |
          git fetch origin repair/property-one-click-17441
          rm -rf /tmp/global-report
          git worktree add /tmp/global-report origin/repair/property-one-click-17441
          mkdir -p /tmp/global-report/test-results/global-report-17452
          cp artifacts/global-report-17452/*.json /tmp/global-report/test-results/global-report-17452/
          cd /tmp/global-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results/global-report-17452
          git commit -m "test: persist global report ${{ matrix.browser }} ${{ matrix.query }}" || true
          git pull --rebase origin repair/property-one-click-17441 || true
          git push origin HEAD:repair/property-one-click-17441 || true
      - name: Enforce
        if: steps.test.outcome != 'success'
        run: exit 1

  webkit:
    strategy:
      fail-fast: false
      matrix:
        query: [Vermont, Alabama, Canada, Brazil, Switzerland, Thailand, Vietnam, Laos, New Zealand]
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/earthline-launch-17445, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/report-global-17452.mjs > tests/report-global-17452.mjs
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - run: |
          python3 -m http.server 8787 --bind 0.0.0.0 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - id: test
        continue-on-error: true
        run: env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='webkit' HEADLESS='false' QUERY='${{ matrix.query }}' node tests/report-global-17452.mjs
      - name: Persist result
        if: always()
        run: |
          git fetch origin repair/property-one-click-17441
          rm -rf /tmp/global-report
          git worktree add /tmp/global-report origin/repair/property-one-click-17441
          mkdir -p /tmp/global-report/test-results/global-report-17452
          cp artifacts/global-report-17452/*.json /tmp/global-report/test-results/global-report-17452/
          cd /tmp/global-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results/global-report-17452
          git commit -m "test: persist global report webkit ${{ matrix.query }}" || true
          git pull --rebase origin repair/property-one-click-17441 || true
          git push origin HEAD:repair/property-one-click-17441 || true
      - name: Enforce
        if: steps.test.outcome != 'success'
        run: exit 1
