name: Mantra 51 Current Map Aquifer Renderer
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - '.github/workflows/mantra51-current-map-aquifer-renderer.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='ignore')
          i=s.find('const aquiferFeatures=reportAquifers()')
          print(s[i:i+6500].replace('\n',' '))
          PY
