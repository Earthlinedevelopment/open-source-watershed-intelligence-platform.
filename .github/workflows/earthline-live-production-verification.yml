name: Earthline Live Production Verification
on:
  push:
    branches:
      - candidate-next
    paths:
      - '.github/workflows/earthline-live-production-verification.yml'
permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Live integrated recovery gate
        env:
          EARTHLINE_URL: 'https://earthlinedevelopment.org/'
        run: node tests/earthline-system-recovery-gate.mjs
      - name: Live critical Property controls
        env:
          EARTHLINE_URL: 'https://earthlinedevelopment.org/'
          STATES: 'South Dakota|Arizona|Vermont'
          OUT: '/tmp/earthline-live-critical.json'
        run: node tests/validate-property-50states-final.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-live-critical
          path: /tmp/earthline-live-critical.json
          if-no-files-found: warn
