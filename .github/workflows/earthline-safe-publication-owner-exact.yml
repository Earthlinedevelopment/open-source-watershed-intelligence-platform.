name: Earthline Safe Publication Owner Exact Audit
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-safe-publication-owner-exact.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - name: Extract exact safe publication owner and clip helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          def extract(name):
              starts=[f"async function {name}",f"function {name}"]
              st=-1
              for x in starts:
                  st=s.find(x)
                  if st>=0: break
              if st<0:
                  print("MISSING",name); return
              b=s.find("{",st); depth=0; q=None; esc=False; line=False; block=False; i=b
              while i<len(s):
                  c=s[i]; n=s[i+1] if i+1<len(s) else ""
                  if line:
                      if c=="\n": line=False
                  elif block:
                      if c=="*" and n=="/": block=False; i+=1
                  elif q:
                      if esc: esc=False
                      elif c=="\\": esc=True
                      elif c==q: q=None
                  else:
                      if c=="/" and n=="/": line=True; i+=1
                      elif c=="/" and n=="*": block=True; i+=1
                      elif c in ("'",'"'): q=c
                      elif c=="{": depth+=1
                      elif c=="}":
                          depth-=1
                          if depth==0:
                              print("\n===== "+name+" =====\n"+s[st:i+1]); return
                  i+=1
          extract("earthlineLockPropertyResult15815")
          extract("earthlinePublishRawPropertyResult15816")
          print("\n===== CLIP/BBOX HELPERS =====")
          names=[]
          for m in re.finditer(r"function\s+([A-Za-z0-9_$]*(?:clip|Clip|bound|Bound|intersect|Intersect)[A-Za-z0-9_$]*)\s*\(",s):
              nm=m.group(1)
              if nm not in names: names.append(nm)
          print("\n".join(names[:200]))
          print("\n===== analysisBoundaryLngLat nearby =====")
          for m in list(re.finditer("analysisBoundaryLngLat",s))[-25:]:
              print(s[max(0,m.start()-700):min(len(s),m.start()+1800)])
              print("---")
          PY
