name: Prepare short 4pct swales with style-definition renderer readiness
on:
  push:
    branches: [repair/arizona-visible-valid-swales-20261113]
    paths: [.github/workflows/az-style-ready-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Preserve all safety conditions; fix only living-swale style readiness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "8474081675fdf904af8d805a28617ff673e6a525"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          old=chr(10).join([
            '  function mapReady(){',
            '    return !!(typeof earthlineMap!=="undefined"&&earthlineMap&&earthlineMap.isStyleLoaded&&earthlineMap.isStyleLoaded());',
            '  }'
          ])
          new=chr(10).join([
            '  function mapReady(){',
            '    try{return typeof earthlineMap!=="undefined" && !!earthlineMap &&',
            '      typeof earthlineMap.getStyle==="function" && Array.isArray(earthlineMap.getStyle()?.layers);}',
            '    catch(_){return false}',
            '  }'
          ])
          assert s.count(old)==1,('wrong living renderer',s.count(old))
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff --numstat -- index.html
          echo EXACT_CANDIDATE_BLOB=$(git hash-object index.html)
          git rm .github/workflows/az-style-ready-prepare.yml
          git config user.name 'Earthline isolated render readiness repair'
          git config user.email 'info@earthlinedevelopment.org'
          git add index.html
          git commit -m 'fix(property): render approved short gentle swales when style definition exists'
          git push origin HEAD:repair/arizona-visible-valid-swales-20261113
