name: Earthline Property Major Waterway Science
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-property-major-waterway-science.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 0
      - name: Apply major-waterway exclusion threshold
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='  const channelThreshold=Math.max(3,streamThreshold()*3.0);'
          new='  const channelThreshold=Math.max(3,streamThreshold()*3.0,Number(M.maxAcc||0)*0.06);'
          if s.count(old)!=1:
              raise SystemExit(f'expected one waterway threshold owner; found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          test "$(git diff --name-only)" = "index.html"
          test "$(git diff --numstat | awk '{print $1" "$2}')" = "1 1"
      - name: Commit candidate science
        run: |
          git config user.name "Earthline Engine"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "science: reserve no-build water mask for major channels"
          git push origin HEAD:candidate-next
