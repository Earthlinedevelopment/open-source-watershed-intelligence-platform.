name: Earthline Rendered User Path Gate 17134
on:
  push:
    branches: [research/elder-browser-engine-17129]
    paths:
      - 'tests/rendered-user-path-gate-17134.mjs'
      - '.github/workflows/earthline-rendered-user-path-gate-17134.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/elder-browser-engine-17129
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/rendered-user-path-gate-17134.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-rendered-user-path-17134
          path: artifacts/rendered-user-path-17134/
          if-no-files-found: error
          retention-days: 7
