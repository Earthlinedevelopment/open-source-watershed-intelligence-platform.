name: Earthline Elder Refine Radius Cross-Biome 17103

on:
  push:
    branches:
      - research/elder-density-calibration-17100
    paths:
      - '.github/workflows/earthline-elder-refine-radius-cross-biome-17103.yml'
      - 'tools/elder_trees/chmv2_aoi_candidates.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/elder-density-calibration-17100
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy rasterio pyproj requests
      - name: Run 10 m and 15 m across seven biomes
        run: |
          set -e
          run(){ n="$1"; b="$2"; r="$3"; python tools/elder_trees/chmv2_aoi_candidates.py --bbox="$b" --max-per-tile=2000 --screen-size=1024 --refine-radius-m="$r" --out="artifacts/$n-r$r"; }
          for R in 10 15; do
            run alaska "-135.36,57.045,-135.34,57.060" "$R"
            run vermont "-73.205,44.475,-73.185,44.490" "$R"
            run colorado "-105.61,39.625,-105.59,39.640" "$R"
            run england "-0.603,51.430,-0.583,51.445" "$R"
            run thailand "101.420,14.340,101.440,14.355" "$R"
            run laos "103.290,19.990,103.310,20.005" "$R"
            run vietnam "105.610,20.305,105.630,20.320" "$R"
          done
      - name: Compare recall and separation
        run: |
          python - <<'PY'
          import glob,json,pathlib
          out={}
          for p in glob.glob('artifacts/*-r*/*.json'):
              if p.endswith('.geojson'): continue
              d=json.load(open(p))
              stem=pathlib.Path(p).parent.name
              name,r=stem.rsplit('-r',1)
              tiles=[t for t in d.get('tile_results',[]) if t.get('status')=='OK']
              out.setdefault(name,{})[r]={
                'candidate_count':d.get('candidate_count',0),
                'forest_area_ha':round(sum(t.get('forest_area_ha',0) for t in tiles),3),
                'screen_current':sum(t.get('current_selected_total',0) for t in tiles),
                'screen_future':sum(t.get('future_selected_total',0) for t in tiles)
              }
          for name,vals in out.items():
              a=vals.get('10',{}).get('candidate_count',0)
              b=vals.get('15',{}).get('candidate_count',0)
              vals['retention_15_vs_10_pct']=round(100*b/max(1,a),1)
          print(json.dumps(out,indent=2))
          if not out: raise SystemExit('No cross-biome results')
          pathlib.Path('artifacts/cross-biome-radius-summary.json').write_text(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-elder-refine-radius-cross-biome-17103
          path: artifacts/
          retention-days: 14
