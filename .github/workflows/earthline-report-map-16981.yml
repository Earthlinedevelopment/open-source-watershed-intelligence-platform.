name: Earthline institutional focus map 16981
on:
  push:
    branches:
      - pages-live
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Focus regional report on intervention area
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          a=s.index("function mapSvg(d,small=false){")
          b=s.index("  return parts.join('');\n}",a)+len("  return parts.join('');\n}")
          fn=s[a:b]
          if 'el-report-funder-plan-16980' not in fn:
              raise SystemExit("16980 renderer marker missing")
          fn=fn.replace('el-report-funder-plan-16980','el-report-funder-plan-16981',1)
          fn=fn.replace("const clipId='elClip16980',arrowId='elArrow16980',parts=[];","const clipId='elClip16981',arrowId='elArrow16981',parts=[];",1)
          old="\n".join([
              "  let b;",
              "  if(isProperty&&d?.center&&Number.isFinite(+d.center.lng)&&Number.isFinite(+d.center.lat)){",
              "    const lat=+d.center.lat,lng=+d.center.lng,acres=Math.max(2,+d.acres||20);",
              "    const areaM2=acres*4046.8564224,baseW=Math.sqrt(areaM2*1.15),baseH=areaM2/baseW;",
              "    const pad=1.32,halfW=baseW*pad/2,halfH=baseH*pad/2;",
              "    const dy=halfH/111320,dx=halfW/(111320*Math.max(.2,Math.cos(lat*Math.PI/180)));",
              "    b=[lng-dx,lat-dy,lng+dx,lat+dy];",
              "  }else{",
              "    b=reportBounds(d);",
              "  }"
          ])
          new="\n".join([
              "  const analysisBounds=reportBounds(d);",
              "  const prioritySeed=mapSwales.slice(0,Math.min(isProperty?6:5,mapSwales.length));",
              "  let b;",
              "  if(isProperty&&d?.center&&Number.isFinite(+d.center.lng)&&Number.isFinite(+d.center.lat)){",
              "    const lat=+d.center.lat,lng=+d.center.lng,acres=Math.max(2,+d.acres||20);",
              "    const areaM2=acres*4046.8564224,baseW=Math.sqrt(areaM2*1.15),baseH=areaM2/baseW;",
              "    const pad=1.32,halfW=baseW*pad/2,halfH=baseH*pad/2;",
              "    const dy=halfH/111320,dx=halfW/(111320*Math.max(.2,Math.cos(lat*Math.PI/180)));",
              "    b=[lng-dx,lat-dy,lng+dx,lat+dy];",
              "  }else if(prioritySeed.length){",
              "    const pts=[];",
              "    for(const f of prioritySeed){for(const q of (f?.geometry?.coordinates||[])){if(Number.isFinite(+q[0])&&Number.isFinite(+q[1]))pts.push([+q[0],+q[1]])}}",
              "    if(pts.length){",
              "      const xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]);",
              "      let minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);",
              "      const dx=Math.max(.01,maxX-minX),dy=Math.max(.01,maxY-minY),pad=.24;",
              "      b=[minX-dx*pad,minY-dy*pad,maxX+dx*pad,maxY+dy*pad];",
              "    }else b=analysisBounds.slice();",
              "  }else{",
              "    b=analysisBounds.slice();",
              "  }",
              "  const focusBeforeAspect=b.slice();"
          ])
          if old not in fn:
              raise SystemExit("bounds block missing")
          fn=fn.replace(old,new,1)
          fn=fn.replace("const priority=mapSwales.slice(0,Math.min(isProperty?6:5,mapSwales.length));","const priority=prioritySeed;",1)
          anchor="\n".join(["  parts.push('</g>');","","  const lx=mapX+16,ly=mapY+16;"])
          inset="\n".join([
              "  parts.push('</g>');",
              "",
              "  if(!isProperty&&priority.length){",
              "    const ix=mapX+mapW-168,iy=mapY+mapH-94,iw=142,ih=70;",
              "    const aw=Math.max(.000001,analysisBounds[2]-analysisBounds[0]),ah=Math.max(.000001,analysisBounds[3]-analysisBounds[1]);",
              "    const fx0=ix+Math.max(0,Math.min(1,(focusBeforeAspect[0]-analysisBounds[0])/aw))*iw;",
              "    const fx1=ix+Math.max(0,Math.min(1,(focusBeforeAspect[2]-analysisBounds[0])/aw))*iw;",
              "    const fy0=iy+(1-Math.max(0,Math.min(1,(focusBeforeAspect[3]-analysisBounds[1])/ah)))*ih;",
              "    const fy1=iy+(1-Math.max(0,Math.min(1,(focusBeforeAspect[1]-analysisBounds[1])/ah)))*ih;",
              "    parts.push('<g><rect x=\"'+(ix-8)+'\" y=\"'+(iy-18)+'\" width=\"'+(iw+16)+'\" height=\"'+(ih+28)+'\" rx=\"4\" fill=\"#ffffff\" fill-opacity=\".94\" stroke=\"#d4d8d4\" stroke-width=\".6\"/><text x=\"'+ix+'\" y=\"'+(iy-6)+'\" fill=\"#66736d\" font-family=\"Noto Sans,Arial,sans-serif\" font-size=\"5.4\" font-weight=\"750\" letter-spacing=\".45\">ANALYSIS EXTENT / MAP FOCUS</text><rect x=\"'+ix+'\" y=\"'+iy+'\" width=\"'+iw+'\" height=\"'+ih+'\" fill=\"#f5f6f3\" stroke=\"#aeb7b2\" stroke-width=\".7\"/><rect x=\"'+fx0.toFixed(1)+'\" y=\"'+fy0.toFixed(1)+'\" width=\"'+Math.max(4,fx1-fx0).toFixed(1)+'\" height=\"'+Math.max(4,fy1-fy0).toFixed(1)+'\" fill=\"#7da878\" fill-opacity=\".24\" stroke=\"#3d724b\" stroke-width=\".8\"/></g>');",
              "  }",
              "",
              "  const lx=mapX+16,ly=mapY+16;"
          ])
          if anchor not in fn:
              raise SystemExit("inset anchor missing")
          fn=fn.replace(anchor,inset,1)
          fn=fn.replace("RECHARGE OPPORTUNITY PLAN","PRIORITY RECHARGE PLAN",1)
          fn=fn.replace("Earthline Screening Method v1.0 · displayed-run geometry","Main map focuses on published priority corridors · full extent shown at lower right",1)
          out=s[:a]+fn+s[b:]
          if 'el-report-funder-plan-16981' not in out:
              raise SystemExit("16981 marker missing")
          p.write_text(out,encoding="utf-8")
          PY
          git config user.name "Earthline Build Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "style: institutional intervention-focus report map 16981"
          git push origin HEAD:pages-live
