name: Earthline one-time stable touch target repair
on:
  push:
    branches:
      - fix/final-mobile-panel-release-proof-20261128
    paths:
      - tools/earthline-property-touch-stability-patch.py
permissions:
  contents: write
jobs:
  candidate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update only Property button content reconciliation
        run: python3 tools/earthline-property-touch-stability-patch.py
      - name: Retire temporary updater
        run: git rm .github/workflows/earthline-one-shot-property-touch.yml
      - name: Verify static release safety
        run: |
          git diff --check
          python3 tools/earthline-release-airlock-static.py
      - name: Commit only to isolated candidate
        run: |
          set -euo pipefail
          git config user.name "Earthline candidate repair"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix(mobile): preserve Property button touch target during sidebar reconciliation"
          git push origin HEAD:refs/heads/fix/final-mobile-panel-release-proof-20261128
