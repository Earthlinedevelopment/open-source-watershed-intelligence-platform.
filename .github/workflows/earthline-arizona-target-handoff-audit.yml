name: Earthline Arizona Target Handoff Audit
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-arizona-target-handoff-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - name: Extract Arizona regional target handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          terms=[
            "Arizona state",
            "jurisdictionLabel",
            "EARTHLINE_REGIONAL_PERFORMANCE_16191",
            "setPropertyTarget16201",
            "regionalMode",
            "runBtn",
            "earthlineResolve"
          ]
          for term in terms:
              print("\n===== "+term+" =====")
              start=0; n=0
              while True:
                  i=s.find(term,start)
                  if i<0 or n>=10: break
                  print(s[max(0,i-2500):min(len(s),i+7000)])
                  print("\n---")
                  start=i+len(term); n+=1
          PY
