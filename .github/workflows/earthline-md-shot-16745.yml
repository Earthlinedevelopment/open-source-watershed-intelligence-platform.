name: Earthline Maryland Visual Capture 16745
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-md-shot-16745.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture Maryland
        run: |
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1908,height:882}});
            await p.goto('https://earthlinedevelopment.org/?mdshot='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForSelector('#searchInput',{timeout:30000});
            await p.evaluate(()=>{const i=document.getElementById('searchInput'),b=document.getElementById('runBtn');i.value='Maryland';i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));b.click();});
            await p.waitForFunction(()=>/screening published\./i.test(String(document.getElementById('earthlineVermontStatus16147')?.textContent||'')),{timeout:60000,polling:100});
            await p.waitForTimeout(500);
            await p.screenshot({path:'maryland-16745.png',fullPage:true});
            await b.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: maryland-16745
          path: maryland-16745.png
