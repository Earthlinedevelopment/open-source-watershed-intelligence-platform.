name: Earthline Mobile Panel Scroll Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-mobile-panel-scroll-trigger']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8').splitlines()
          needles=['#earthlinePanel16188{','#earthlinePanelBody16188{','#earthlineBioswaleReportSection16188','#earthlineReportSection16188','overflow-y','overflow:auto','max-height']
          for i,line in enumerate(s,1):
            if any(n in line for n in needles) and 31800 <= i <= 32250:
              print(f'{i}: {line}')
          PY
