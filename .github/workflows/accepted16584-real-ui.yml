name: Accepted 16584 - live UI Property plus water smoke
on:
  push:
    branches: [diagnostics/accepted-16584-live-verify-20261103]
    paths: [.github/workflows/accepted16584-real-ui.yml]
permissions:
  contents: read
jobs:
  public-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Click public Vermont Regional and Property, inspect actual visible water layers
        run: node tests/accepted16584-real-ui-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accepted16584-actual-public-ui
          path: artifacts/accepted-16584-real-ui
          retention-days: 4
