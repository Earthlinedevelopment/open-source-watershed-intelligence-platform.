name: Earthline 17702 Apply Core Repair
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-17702-trigger']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          fetch-depth: 0
      - run: python3 scripts/apply-17702-safe-source-idempotence.py
      - name: Commit exact core repair
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- earthline-launch-16872.js tests || true
          git config user.name "Earthline"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "repair: make authoritative safe Property source idempotent per run"
          git push origin HEAD:recovery/mantra74-stability
