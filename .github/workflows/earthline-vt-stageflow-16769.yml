name: Earthline 16769 Vermont Stage-Flow Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-vt-stageflow-16769.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Trace Vermont terrain to publication
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1800,height:1000}});
          await page.goto('https://earthlinedevelopment.org/?vt16769='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForSelector('#searchInput',{timeout:30000});
          await page.evaluate(()=>{
            window.EARTHLINE_REGIONAL_COVERAGE_AUDIT_16731=null;
            const i=document.getElementById('searchInput'),b=document.getElementById('runBtn');
            i.value='vermont state';i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));b.click();
          });
          await page.waitForFunction(()=>{
            const a=window.EARTHLINE_REGIONAL_COVERAGE_AUDIT_16731;
            const p=window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167;
            const d=window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020;
            return a?.passed===true&&Number(p?.generated||0)>0&&Number(p?.generated||0)===Number(d?.swaleLines||0);
          },null,{timeout:60000,polling:100});
          await page.waitForTimeout(700);
          const out=await page.evaluate(()=>{
            const clone=v=>{try{return JSON.parse(JSON.stringify(v))}catch{return null}};
            const fcSummary=(v)=>{
              const found=[];
              const seen=new WeakSet();
              const walk=(x,path,depth)=>{
                if(!x||typeof x!=='object'||depth>5)return;
                if(seen.has(x))return;seen.add(x);
                if(x.type==='FeatureCollection'&&Array.isArray(x.features)){
                  const lines=x.features.filter(f=>String(f?.geometry?.type||'').includes('LineString'));
                  const pts=[];
                  const add=c=>{if(Array.isArray(c)&&typeof c[0]==='number'&&typeof c[1]==='number')pts.push(c);else if(Array.isArray(c))for(const z of c)add(z)};
                  for(const f of lines)add(f.geometry?.coordinates);
                  let bbox=null;
                  if(pts.length){bbox=[Math.min(...pts.map(p=>p[0])),Math.min(...pts.map(p=>p[1])),Math.max(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[1]))]}
                  found.push({path,features:x.features.length,lines:lines.length,bbox,propKeys:Object.keys(lines[0]?.properties||{}).slice(0,15)});
                }
                for(const [k,y] of Object.entries(x)){ if(y&&typeof y==='object') walk(y,path+'.'+k,depth+1); }
              };
              walk(v,'root',0);return found;
            };
            const names=[
              'EARTHLINE_REGIONAL_COVERAGE_AUDIT_16731',
              'EARTHLINE_SPATIAL_COVERAGE_SELECTION_16736',
              'EARTHLINE_REFINED_COVERAGE_SELECTION_16713',
              'EARTHLINE_COVERAGE_CARRY_16749',
              'EARTHLINE_COVERAGE_GAP_REFINEMENT_16731',
              'EARTHLINE_REGIONAL_ANALYSIS_EXTENT_16712',
              'EARTHLINE_VERMONT_PRESELECTION_BOUNDARY_16747',
              'EARTHLINE_SWALE_GENERATION_AUDIT_16167',
              'EARTHLINE_LAST_LIVE_REGIONAL_RUN_15970',
              'EARTHLINE_REGIONAL_VISUAL_DATA_16020',
              'EARTHLINE_LAST_ATOMIC_STATE_PACKAGE_16556'
            ];
            const globals={}; const featureCollections={};
            for(const n of names){globals[n]=clone(window[n]??null);featureCollections[n]=fcSummary(window[n]);}
            const map=window.earthlineMap||window.map||null;
            const mapLayers=[]; const sourceStats=[];
            if(map?.getStyle){
              for(const layer of map.getStyle()?.layers||[]){
                if(/swal|corridor|bioswale/i.test(String(layer.id)+' '+String(layer['source-layer']||'')))mapLayers.push({id:layer.id,type:layer.type,source:layer.source,sourceLayer:layer['source-layer']||null});
              }
              for(const id of Object.keys(map.getStyle()?.sources||{})){
                try{
                  const q=map.querySourceFeatures(id)||[];
                  const lines=q.filter(f=>String(f?.geometry?.type||'').includes('LineString'));
                  if(lines.length)sourceStats.push({id,total:q.length,lines:lines.length,propKeys:Object.keys(lines[0]?.properties||{}).slice(0,12)});
                }catch{}
              }
            }
            return {globals,featureCollections,mapLayers,sourceStats};
          });
          console.log('EARTHLINE16769 '+JSON.stringify(out));
          await browser.close();
          JS
