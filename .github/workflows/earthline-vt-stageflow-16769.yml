name: Earthline Mantra44 Vermont Stage-Flow Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-vt-stageflow-16769.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Trace Vermont terrain to publication
        shell: bash
        run: |
          mkdir -p lab
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1800,height:1000}});
          const consoleRows=[];
          page.on('console',msg=>consoleRows.push({type:msg.type(),text:msg.text().slice(0,1000)}));
          await page.goto('https://earthlinedevelopment.org/?m44vt='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForSelector('#searchInput',{timeout:30000});
          await page.evaluate(()=>{
            window.EARTHLINE_REGIONAL_COVERAGE_AUDIT_16731=null;
            const i=document.getElementById('searchInput'),b=document.getElementById('runBtn');
            i.value='vermont state';
            i.dispatchEvent(new Event('input',{bubbles:true}));
            i.dispatchEvent(new Event('change',{bubbles:true}));
            b.click();
          });
          await page.waitForFunction(()=>{
            const a=window.EARTHLINE_REGIONAL_COVERAGE_AUDIT_16731;
            const p=window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167;
            const d=window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020;
            return a?.passed===true&&Number(p?.generated||0)>0&&Number(p?.generated||0)===Number(d?.swaleLines||0);
          },null,{timeout:60000,polling:100});
          await page.waitForTimeout(700);
          const out=await page.evaluate(()=>{
            const clone=v=>{try{return JSON.parse(JSON.stringify(v))}catch{return null}};
            const names=[
              'EARTHLINE_REGIONAL_COVERAGE_AUDIT_16731',
              'EARTHLINE_SPATIAL_COVERAGE_SELECTION_16736',
              'EARTHLINE_REFINED_COVERAGE_SELECTION_16713',
              'EARTHLINE_COVERAGE_CARRY_16749',
              'EARTHLINE_COVERAGE_GAP_REFINEMENT_16731',
              'EARTHLINE_LATE_GAP_REFINEMENT_16741',
              'EARTHLINE_REGIONAL_ANALYSIS_EXTENT_16712',
              'EARTHLINE_VERMONT_PRESELECTION_BOUNDARY_16747',
              'EARTHLINE_SWALE_GENERATION_AUDIT_16167',
              'EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167',
              'EARTHLINE_REGIONAL_PERFORMANCE_16191',
              'EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040',
              'EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020',
              'EARTHLINE_REGIONAL_VISUAL_DATA_16020',
              'EARTHLINE_LAST_ATOMIC_STATE_PACKAGE_16556'
            ];
            const globals={};
            for(const n of names)globals[n]=clone(window[n]??null);
            const a=window.EARTHLINE_REGIONAL_COVERAGE_AUDIT_16731||{};
            const bins=(a.bins||[]).map(r=>({
              bx:Number(r.bx),by:Number(r.by),valid:Number(r.valid||0),opportunity:Number(r.opportunity||0),
              preferred:Number(r.preferred||0),swales:Number(r.swales||0),densityTarget:Number(r.densityTarget||0),
              densityDeficit:Number(r.densityDeficit||0)
            }));
            const byKey=new Map(bins.map(r=>[r.bx+','+r.by,r]));
            const reserved=(window.EARTHLINE_SPATIAL_COVERAGE_SELECTION_16736?.rows||[]).map(r=>clone(r));
            const reservedByKey={};
            for(const r of reserved){const k=String(r.key||'');reservedByKey[k]=(reservedByKey[k]||0)+1;}
            const macro=(axis)=>{
              const groups=[{preferred:0,swales:0,opportunity:0},{preferred:0,swales:0,opportunity:0},{preferred:0,swales:0,opportunity:0}];
              for(const r of bins){
                const n=axis==='x'?r.bx:r.by,g=Math.max(0,Math.min(2,Math.floor(n/2)));
                groups[g].preferred+=r.preferred;groups[g].swales+=r.swales;groups[g].opportunity+=r.opportunity;
              }
              const tp=groups.reduce((s,r)=>s+r.preferred,0),ts=groups.reduce((s,r)=>s+r.swales,0);
              return groups.map((r,i)=>({...r,index:i,preferredShare:tp?r.preferred/tp:0,swaleShare:ts?r.swales/ts:0,delta:tp&&ts?r.swales/ts-r.preferred/tp:0}));
            };
            const significant=bins.filter(r=>r.valid>=45&&r.opportunity>=8&&(r.opportunity/Math.max(1,r.valid))>=.035)
              .map(r=>({...r,reserved:Number(reservedByKey[r.bx+','+r.by]||0),survivalRatio:r.preferred?r.swales/r.preferred:null}))
              .sort((x,y)=>(y.preferred-x.preferred)||(x.swales-y.swales));
            const sparse=significant.filter(r=>r.preferred>=20&&r.swales<=Math.max(1,Math.floor(r.preferred/25)))
              .sort((x,y)=>(y.preferred/Math.max(1,y.swales))-(x.preferred/Math.max(1,x.swales)));
            const v=window.EARTHLINE_REGIONAL_VISUAL_DATA_16020;
            const coords=[];
            for(const f of v?.swales?.features||[]){
              const c=f?.geometry?.coordinates;if(!Array.isArray(c)||!c.length)continue;
              const m=c[Math.floor((c.length-1)/2)];
              if(Array.isArray(m)&&Number.isFinite(m[0])&&Number.isFinite(m[1]))coords.push(m);
            }
            const bbox=coords.length?[Math.min(...coords.map(p=>p[0])),Math.min(...coords.map(p=>p[1])),Math.max(...coords.map(p=>p[0])),Math.max(...coords.map(p=>p[1]))]:null;
            return {
              build:a.build||null,
              timestamp:new Date().toISOString(),
              summary:{
                bins:bins.length,
                significant:significant.length,
                unresolved:(a.unresolved||[]).length,
                generated:Number(window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167?.generated||0),
                visible:Number((window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020)?.swaleLines||0),
                coreMs:Number(window.EARTHLINE_REGIONAL_PERFORMANCE_16191?.totalMs||NaN),
                reservedRows:reserved.length,
                candidateBins:Number(window.EARTHLINE_SPATIAL_COVERAGE_SELECTION_16736?.candidateBins||0),
                capacity:Number(window.EARTHLINE_SPATIAL_COVERAGE_SELECTION_16736?.capacity||0),
                bbox
              },
              macroX:macro('x'),
              macroY:macro('y'),
              significant,
              sparse,
              reserved,
              globals
            };
          });
          out.consoleTail=consoleRows.slice(-80);
          fs.writeFileSync('lab/mantra44-vt-stageflow.json',JSON.stringify(out,null,2));
          console.log('M44 VT SUMMARY '+JSON.stringify(out.summary));
          console.log('M44 VT MACROX '+JSON.stringify(out.macroX));
          console.log('M44 VT MACROY '+JSON.stringify(out.macroY));
          console.log('M44 VT SPARSE '+JSON.stringify(out.sparse.slice(0,20)));
          await browser.close();
          JS
      - name: Persist diagnostic
        shell: bash
        run: |
          git config user.name "Earthline Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add lab/mantra44-vt-stageflow.json
          git commit -m "diag: persist Mantra44 Vermont stage-flow evidence [skip ci]"
          git push
