name: Earthline Legacy USGS Aquifer Source Trace
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths: ['tests/trace-legacy-usgs-aquifer.py','.github/workflows/earthline-legacy-usgs-aquifer.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tests/trace-legacy-usgs-aquifer.py
