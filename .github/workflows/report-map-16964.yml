name: Earthline report map patch 16964
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/report-map-16964.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Patch authoritative report map
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('  function mapSvg(d,small=false){')
          end=s.index('function gradeSummary()', start)
          replacement=r'''  function mapSvg(d,small=false){
              const b=reportBounds(d),W=1040,H=small?470:620;
              const mapX=42,mapY=112,mapW=small?956:760,mapH=H-mapY-48;
              const sideX=mapX+mapW+22,sideW=W-sideX-34;
              const xSpan=Math.max(.000001,b[2]-b[0]),ySpan=Math.max(.000001,b[3]-b[1]);
              const sx=x=>mapX+(x-b[0])/xSpan*mapW,sy=y=>mapY+mapH-(y-b[1])/ySpan*mapH;
              const pathCoords=coords=>(coords||[]).map((p,i)=>(i?'L':'M')+sx(+p[0]).toFixed(1)+' '+sy(+p[1]).toFixed(1)).join(' ');
              const path=f=>pathCoords(f?.geometry?.coordinates||[]);
              const middle=f=>{const a=f?.geometry?.coordinates||[];const p=a[Math.floor(a.length/2)];return Array.isArray(p)&&p.length>1?p:null};
              const contourElevationM=f=>{const p=f&&f.properties||{};for(const k of ['ele','elevation','elevation_m','elev_m','level','levelM','contour','contour_m','z']){const v=Number(p[k]);if(Number.isFinite(v))return v}return null};
              const reportContours=contours().filter(f=>f?.geometry?.type==='LineString').slice(0,210);
              const reportFlows=flows().filter(f=>f?.geometry?.type==='LineString').slice(0,180);
              const rows=graded(),counts={A:rows.filter(r=>r.grade==='A').length,B:rows.filter(r=>r.grade==='B').length,C:rows.filter(r=>r.grade==='C').length};
              const aquiferFeatures=reportAquifers();
              const reportPlace=String(d?.query||d?.location||d?.placeName||'Analysis Area').trim(),reportTier=String(d?.tier||d?.mode||'regional').toLowerCase(),title=reportPlace||'Analysis Area';
              const lonSpan=Math.max(.0001,b[2]-b[0]),midLat=(b[1]+b[3])/2,kmWide=lonSpan*111.32*Math.cos(midLat*Math.PI/180);
              const niceKm=kmWide>300?100:kmWide>120?50:kmWide>50?20:kmWide>20?10:kmWide>8?5:kmWide>3?2:1,barPx=Math.max(54,Math.min(150,niceKm/kmWide*mapW));
              const clipId='elReportClip16964',aqPat='elAquifer16964',parts=[];
              parts.push('<svg class="el-report-plan-board-16964" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc('Earthline '+title+' hydrology and bioswale opportunity plan')+'">');
              parts.push('<defs><linearGradient id="elPlanPaper16964" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf5"/><stop offset=".55" stop-color="#f4f5ee"/><stop offset="1" stop-color="#edf1e9"/></linearGradient><pattern id="'+aqPat+'" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><rect width="12" height="12" fill="#e89a46" fill-opacity=".20"/><path d="M0 0 V12" stroke="#c96822" stroke-width=".75" stroke-opacity=".25"/></pattern><clipPath id="'+clipId+'"><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="1.5"/></clipPath><marker id="elWaterArrow16964" markerWidth="5" markerHeight="5" refX="4.1" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L5 2.5 L0 5 Z" fill="#177da8" opacity=".72"/></marker></defs>');
              parts.push('<rect width="'+W+'" height="'+H+'" fill="#f3f1e9"/><rect x="0" y="0" width="'+W+'" height="84" fill="#203a33"/><rect x="0" y="84" width="'+W+'" height="4" fill="#55bde0"/>');
              parts.push('<text x="'+mapX+'" y="34" fill="#fff" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="850">'+esc(title)+'</text><text x="'+mapX+'" y="58" fill="#c5d6cf" font-family="Noto Sans,Arial,sans-serif" font-size="8.5" font-weight="750" letter-spacing="1.5">LANDSCAPE WATER PLAN · HYDROLOGY + BIOSWALE OPPORTUNITY</text><text x="'+(W-38)+'" y="34" text-anchor="end" fill="#fff" font-family="Noto Sans,Arial,sans-serif" font-size="8.3" font-weight="850" letter-spacing="1.3">EARTHLINE</text><text x="'+(W-38)+'" y="57" text-anchor="end" fill="#c5d6cf" font-family="Noto Sans,Arial,sans-serif" font-size="6.8" font-weight="700" letter-spacing=".9">'+esc(reportTier.toUpperCase())+' SCREENING</text>');
              parts.push('<rect x="'+(mapX-5)+'" y="'+(mapY-5)+'" width="'+(mapW+10)+'" height="'+(mapH+10)+'" rx="3" fill="#fff" fill-opacity=".78" stroke="#c6cbc5" stroke-width=".7"/><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="2" fill="url(#elPlanPaper16964)" stroke="#aeb6ae" stroke-width=".85"/><g clip-path="url(#'+clipId+')">');
              for(let i=0;i<reportContours.length;i++){if(i%3!==0)continue;const dpath=path(reportContours[i]);if(!dpath)continue;const major=i%12===0;parts.push('<path d="'+dpath+'" fill="none" stroke="'+(major?'#77817a':'#a9afa9')+'" stroke-width="'+(major?'.60':'.30')+'" opacity="'+(major?'.31':'.16')+'" vector-effect="non-scaling-stroke"/>')}
              for(const f of aquiferFeatures){const g=f&&f.geometry;if(!g)continue;const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];for(const poly of polys){const rings=poly.filter(r=>Array.isArray(r)&&r.length>=3);if(!rings.length)continue;const dpath=rings.map(r=>pathCoords(r)+' Z').join(' ');parts.push('<path d="'+dpath+'" fill="url(#'+aqPat+')" fill-rule="evenodd" stroke="#c96822" stroke-width="1.05" opacity=".94" vector-effect="non-scaling-stroke"/>')}}
              const drawSwale=r=>{const dpath=path(r.f);if(!dpath)return;if(r.grade==='A'){parts.push('<path d="'+dpath+'" fill="none" stroke="#fffdf7" stroke-width="11.5" opacity=".93" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dpath+'" fill="none" stroke="#b7cfad" stroke-width="8.8" opacity=".73" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dpath+'" fill="none" stroke="#2f5b3b" stroke-width="1.45" opacity=".98" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dpath+'" fill="none" stroke="#62acc0" stroke-width=".72" opacity=".95" stroke-dasharray="2.2 2.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>')}else if(r.grade==='B'){parts.push('<path d="'+dpath+'" fill="none" stroke="#f8f7f1" stroke-width="7.6" opacity=".80" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dpath+'" fill="none" stroke="#d1ddc7" stroke-width="5.2" opacity=".54" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dpath+'" fill="none" stroke="#647858" stroke-width="1" opacity=".76" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>')}else parts.push('<path d="'+dpath+'" fill="none" stroke="#9a8a6b" stroke-width=".72" opacity=".25" stroke-linecap="round" vector-effect="non-scaling-stroke"/>')};
              for(const r of rows.filter(r=>r.grade==='C'))drawSwale(r);for(const r of rows.filter(r=>r.grade==='B'))drawSwale(r);for(const r of rows.filter(r=>r.grade==='A'))drawSwale(r);
              for(let i=0;i<reportFlows.length;i++){const dpath=path(reportFlows[i]);if(!dpath)continue;parts.push('<path d="'+dpath+'" fill="none" stroke="#fffdf8" stroke-width="3.4" opacity=".86" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dpath+'" fill="none" stroke="#177da8" stroke-width="1.18" opacity=".90" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"'+(i%12===0?' marker-end="url(#elWaterArrow16964)"':'')+'/>')}
              parts.push('</g>');
              let labels=0;for(const r of rows.filter(r=>r.grade==='A')){if(labels>=8)break;const p=middle(r.f);if(!p)continue;const x=sx(+p[0]),y=sy(+p[1]),lab=String(r.code||('A'+(labels+1)));parts.push('<g transform="translate('+x.toFixed(1)+','+y.toFixed(1)+')"><rect x="-10" y="-7" width="20" height="13" rx="6.5" fill="#fff" fill-opacity=".93" stroke="#315b3d" stroke-width=".65"/><text x="0" y="2.4" text-anchor="middle" fill="#315b3d" font-family="Noto Sans,Arial,sans-serif" font-size="6.5" font-weight="850">'+esc(lab)+'</text></g>');labels++}
              let elevLabels=0;for(let i=0;i<reportContours.length&&elevLabels<5;i+=12){const f=reportContours[i],e=contourElevationM(f),p=middle(f);if(!Number.isFinite(e)||!p)continue;parts.push('<text x="'+sx(+p[0]).toFixed(1)+'" y="'+sy(+p[1]).toFixed(1)+'" fill="#727a75" font-family="Noto Sans,Arial,sans-serif" font-size="6.1" font-weight="700" paint-order="stroke" stroke="#f7f6f0" stroke-width="2.2">'+Math.round(e)+' m</text>');elevLabels++}
              const scaleY=mapY+mapH-18;parts.push('<g transform="translate('+(mapX+18)+','+scaleY+')"><rect x="-8" y="-13" width="'+(barPx+16)+'" height="27" rx="2" fill="#fffdf8" fill-opacity=".84"/><path d="M0 0 H'+barPx+'" stroke="#42534d" stroke-width="1.3"/><path d="M0 -4 V4 M'+barPx+' -4 V4" stroke="#42534d" stroke-width=".9"/><text x="'+(barPx/2)+'" y="11" text-anchor="middle" fill="#56635e" font-family="Noto Sans,Arial,sans-serif" font-size="6.4" font-weight="700">'+niceKm+' km</text></g>');
              parts.push('<g transform="translate('+(mapX+mapW-42)+','+(mapY+20)+')"><circle cx="10" cy="12" r="18" fill="#fffdf8" fill-opacity=".88" stroke="#aeb6ae" stroke-width=".65"/><text x="10" y="-1" text-anchor="middle" fill="#2c443c" font-family="Noto Sans,Arial,sans-serif" font-size="7.4" font-weight="850">N</text><path d="M10 4 V28" stroke="#2c443c" stroke-width="1"/><path d="M10 4 L4.5 14 L10 10.5 L15.5 14 Z" fill="#2c443c"/></g>');
              if(!small){parts.push('<rect x="'+sideX+'" y="'+mapY+'" width="'+sideW+'" height="'+mapH+'" rx="3" fill="#fff" fill-opacity=".86" stroke="#c9cec8" stroke-width=".7"/><text x="'+(sideX+16)+'" y="'+(mapY+28)+'" fill="#203a33" font-family="Noto Sans,Arial,sans-serif" font-size="9.6" font-weight="850" letter-spacing="1">READING THE PLAN</text><path d="M'+(sideX+16)+' '+(mapY+40)+' H'+(sideX+sideW-16)+'" stroke="#55bde0" stroke-width="1.6"/>');let yy=mapY+72;const item=(sample,label,sub)=>{parts.push(sample);parts.push('<text x="'+(sideX+58)+'" y="'+yy+'" fill="#3f5049" font-family="Noto Sans,Arial,sans-serif" font-size="7.3" font-weight="760">'+label+'</text>');if(sub)parts.push('<text x="'+(sideX+58)+'" y="'+(yy+12)+'" fill="#7a837e" font-family="Noto Sans,Arial,sans-serif" font-size="5.9">'+sub+'</text>');yy+=39};item('<rect x="'+(sideX+18)+'" y="'+(yy-10)+'" width="28" height="13" rx="1.3" fill="url(#'+aqPat+')" stroke="#c96822" stroke-width=".8"/>','Aquifer context','Mapped hydrogeologic field');item('<path d="M'+(sideX+18)+' '+yy+' H'+(sideX+46)+'" stroke="#177da8" stroke-width="1.3"/>','Water path','Modeled surface movement');item('<path d="M'+(sideX+18)+' '+yy+' H'+(sideX+46)+'" stroke="#b7cfad" stroke-width="8.2" opacity=".74" stroke-linecap="round"/><path d="M'+(sideX+18)+' '+yy+' H'+(sideX+46)+'" stroke="#2f5b3b" stroke-width="1.4"/><path d="M'+(sideX+18)+' '+yy+' H'+(sideX+46)+'" stroke="#62acc0" stroke-width=".7" stroke-dasharray="2 2.5"/>','A · priority bioswale',counts.A+' corridor'+(counts.A===1?'':'s'));item('<path d="M'+(sideX+18)+' '+yy+' H'+(sideX+46)+'" stroke="#d1ddc7" stroke-width="5.2" opacity=".58" stroke-linecap="round"/><path d="M'+(sideX+18)+' '+yy+' H'+(sideX+46)+'" stroke="#647858" stroke-width="1"/>','B · strong opportunity',counts.B+' corridor'+(counts.B===1?'':'s'));item('<path d="M'+(sideX+18)+' '+yy+' H'+(sideX+46)+'" stroke="#9a8a6b" stroke-width=".75" opacity=".32"/>','C · contextual opportunity',counts.C+' corridor'+(counts.C===1?'':'s'));parts.push('<path d="M'+(sideX+18)+' '+yy+' H'+(sideX+46)+'" stroke="#818983" stroke-width=".6"/><text x="'+(sideX+58)+'" y="'+(yy+2.5)+'" fill="#3f5049" font-family="Noto Sans,Arial,sans-serif" font-size="7.3" font-weight="760">Contour / elevation</text>');const noteY=mapY+mapH-94;parts.push('<rect x="'+(sideX+13)+'" y="'+(noteY-18)+'" width="'+(sideW-26)+'" height="72" rx="2.5" fill="#eef3ed" stroke="#d0d8d1" stroke-width=".6"/><text x="'+(sideX+24)+'" y="'+noteY+'" fill="#294139" font-family="Noto Sans,Arial,sans-serif" font-size="7.1" font-weight="850" letter-spacing=".65">SCREENING PLAN</text><text x="'+(sideX+24)+'" y="'+(noteY+17)+'" fill="#65716b" font-family="Noto Sans,Arial,sans-serif" font-size="6.2">Priority is relative to this run.</text><text x="'+(sideX+24)+'" y="'+(noteY+31)+'" fill="#65716b" font-family="Noto Sans,Arial,sans-serif" font-size="6.2">Field verification required</text><text x="'+(sideX+24)+'" y="'+(noteY+44)+'" fill="#65716b" font-family="Noto Sans,Arial,sans-serif" font-size="6.2">before design or construction.</text>')}
              parts.push('</svg>');return parts.join('');
            }'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit authoritative renderer
        shell: bash
        run: |
          git config user.name "Earthline map repair"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: make report map visibly architectural 16964"
          git push origin HEAD:pages-live
