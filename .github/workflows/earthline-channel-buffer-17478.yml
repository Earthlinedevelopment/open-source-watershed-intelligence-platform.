name: Earthline Circular Channel Buffer A-B Fast 17479
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/earthline-channel-buffer-17478.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/earthline-launch-17454, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/apply-circular-channel-buffer-17478.py > /tmp/a.py
          git show origin/repair/property-one-click-17441:tests/property-channel-buffer-live-17478.mjs > tests/property-channel-buffer-live-17478.mjs
          python3 /tmp/a.py
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/property-channel-buffer-live-17478.mjs
