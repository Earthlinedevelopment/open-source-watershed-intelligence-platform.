name: Earthline Core Owner Snippets

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-core-owner-snippets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Apply guarded mapped-water source repair
        run: |
          python3 lab/patch-us-mapped-water-16610.py
          git diff --check
          git diff --numstat -- index.html
          git diff -- index.html | sed -n '1,180p'
      - name: Commit product repair
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: query loaded vector water sources directly'
          git push origin HEAD:pages-live
