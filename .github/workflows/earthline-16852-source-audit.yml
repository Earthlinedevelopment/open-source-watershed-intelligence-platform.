name: Earthline 16852 Read-Only Source Audit
on:
  push:
    branches: [us-launch-candidate-16852]
    paths:
      - '.github/workflows/earthline-16852-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: us-launch-candidate-16852
      - name: Inspect current single-file app without modifying product
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('index.html')
          s=p.read_text(encoding='utf-8', errors='replace')
          terms=['language','Spanish','Español','Vietnamese','Tiếng Việt','Thai','ไทย','Recharge Potential','Aquifer Recharge Potential','Bioswale Report','How Bioswales Work','Earthline Process','localStorage','sessionStorage','mailto:','<form','MAPBOX_TOKEN','api.mapbox.com','contact','info@earthlinedevelopment.org','SCORE 0–100','SCORE 0-100']
          out=[]
          out.append(f'bytes={len(s.encode("utf-8"))}')
          out.append(f'chars={len(s)}')
          for term in terms:
              hits=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
              out.append(f'\n## {term} count={len(hits)}')
              for pos in hits[:8]:
                  a=max(0,pos-220); b=min(len(s),pos+len(term)+420)
                  snippet=re.sub(r'\s+',' ',s[a:b])
                  # Do not emit token values; redact likely Mapbox public-token bodies.
                  snippet=re.sub(r'pk\.[A-Za-z0-9._-]{20,}', 'pk.[REDACTED]', snippet)
                  out.append(snippet)
          # Generic token-like literal census, values always redacted.
          mapbox_tokens=set(re.findall(r'pk\.[A-Za-z0-9._-]{20,}',s))
          out.append(f'\n## mapbox_public_token_literals count={len(mapbox_tokens)} values=REDACTED')
          Path('source-audit-16852.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-audit-16852
          path: source-audit-16852.txt
          if-no-files-found: error
