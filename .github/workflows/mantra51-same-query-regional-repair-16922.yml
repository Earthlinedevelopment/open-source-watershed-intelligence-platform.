name: Mantra 51 Same Query Regional Repair 16922
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra51-global-repair-campaign
          fetch-depth: 0
      - name: Patch same-query resolver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          pat=r"if\(s&&s\.loc&&key\(s\.appliedSearchText\)===qk\)return s\.loc;"
          repl="""/* EARTHLINE 16922 — same-query Regional re-resolution after Property.
               A country/Regional query may legitimately equal the prior Regional appliedSearchText
               while s.loc now points at the selected Property site. Never reuse that Property loc
               as the resolver result for a non-Property search. Explicit same-Property reruns are
               already owned by the guarded Property shortcut above. Science is unchanged. */
            if(s&&s.loc&&key(s.appliedSearchText)===qk){
              const place16922=String(s.loc.placeType||'').toLowerCase();
              const propertyLoc16922=!!(place16922==='selected_site'||s.loc.propertyMode===true||s.loc.userSelectedSite===true);
              if(!propertyLoc16922)return s.loc;
            }"""
          out,n=re.subn(pat,repl,s,count=1)
          if n!=1:
              raise SystemExit(f"expected one resolver target, found {n}")
          p.write_text(out,encoding="utf-8")
          PY
      - name: Commit repair
        run: |
          git config user.name "Earthline Launch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: re-resolve same Regional query after Property"
          git push origin HEAD:mantra51-global-repair-campaign
