name: Earthline Live-Origin Elder Gate 17398
on:
  push:
    branches: [repair/browser-elder-final-17392]
    paths:
      - 'tests/elder-worker-live-origin-17398.mjs'
      - 'tools/elder_trees/chmv2_array_detector_17129.py'
      - '.github/workflows/earthline-elder-live-origin-17398.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/browser-elder-final-17392}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          if [ '${{ matrix.browser }}' = 'firefox' ]; then
            xvfb-run -a env BROWSER='firefox' HEADLESS='false' node tests/elder-worker-live-origin-17398.mjs
          else
            env BROWSER='chromium' HEADLESS='true' node tests/elder-worker-live-origin-17398.mjs
          fi
  webkit:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/browser-elder-final-17392}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - run: env BROWSER='webkit' HEADLESS='false' node tests/elder-worker-live-origin-17398.mjs

# rerun after NumPy mode compatibility fix 17399
