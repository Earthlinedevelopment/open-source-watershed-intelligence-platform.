name: Mantra 50 Alaska diagnostic 16905
on:
  push:
    branches: [mantra50-two-launch-repairs-16905]
    paths:
      - 'tests/mantra50-alaska-diagnostic.mjs'
      - '.github/workflows/mantra50-alaska-diagnostic-16905.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alaska:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Alaska diagnostic
        run: node tests/mantra50-alaska-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra50-alaska-diagnostic
          path: artifacts/mantra50-alaska/
          if-no-files-found: warn
