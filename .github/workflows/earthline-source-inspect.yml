name: Earthline Vermont Publication Source Inspect
on:
  push:
    branches: [earthline-regression-candidate]
    paths:
      - 'tests/inspect-vermont-publication.mjs'
      - '.github/workflows/earthline-source-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/inspect-vermont-publication.mjs
