name: Mantra 83 Live Terrain Source
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/earthline-mantra83-live-terrain-source.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          for term in ['await hydrology(','hydrology(dem','makeContours(','makeFlows(','await makeSwales(','regionalRechargeModel16492','terrainProductsAndPublishMs']:
              pos=0;n=0
              while True:
                  i=s.find(term,pos)
                  if i<0: break
                  print('\nM83_TERRAIN_TERM',term,i)
                  print(s[max(0,i-3500):min(len(s),i+8000)])
                  pos=i+len(term);n+=1
                  if n>=5: break
          PY
