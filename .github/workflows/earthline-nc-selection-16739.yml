name: Earthline NC Selection 16739
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-nc-selection-16739.yml']
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node lab/diag-16739-nc-selection.mjs
