name: Earthline Inspect Shared Engine Owners 16612

on:
  push:
    branches: [pages-live]
    paths:
      - 'lab/inspect-shared-engine-owners-16612.mjs'
      - '.github/workflows/earthline-inspect-shared-engine-owners-16612.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Inspect current shared owners only
        run: node lab/inspect-shared-engine-owners-16612.mjs
