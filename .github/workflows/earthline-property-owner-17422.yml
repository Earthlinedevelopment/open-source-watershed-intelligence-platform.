name: Earthline Property Owner Extract 17422
on:
  push:
    branches: [repair/property-final-candidate-17421]
    paths:
      - 'tests/extract-property-owner-17422.py'
      - '.github/workflows/earthline-property-owner-17422.yml'
permissions: {contents: read}
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/property-final-candidate-17421}
