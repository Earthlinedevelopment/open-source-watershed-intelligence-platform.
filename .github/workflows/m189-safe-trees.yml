name: M189 circular trees from verified Property swale lines
on:
  push:
    branches: ['repair/m189-property-circles-safe-lines']
    paths: ['.github/workflows/m189-safe-trees.yml']
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Add display-only circles sampled from published safe Property swales
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          assert 'earthline-property-safe-tree-points-m189' not in s
          note="""<script id="earthline-property-safe-tree-circles-m189">
          /* Display only. Every tree marker originates on a published,
             independently safety-audited Property corridor LineString. */
          (function(){
            "use strict";
            const src="earthline-property-safe-tree-points-m189";
            const outer="earthline-property-safe-tree-rim-m189",inner="earthline-property-safe-tree-core-m189";
            let priorToken="",priorSource=null;
            const fc=x=>({type:"FeatureCollection",features:x});
            const meters=(a,b)=>{
              const cos=Math.cos(((a[1]+b[1])/2)*Math.PI/180);
              return Math.hypot((b[0]-a[0])*111320*cos,(b[1]-a[1])*111320);
            };
            function pointsFromSafeLines(features){
              const out=[];
              for(const f of (features||[])){
                const coords=f?.geometry?.type==="LineString"?f.geometry.coordinates:null;
                if(!Array.isArray(coords)||coords.length<2)continue;
                const lengths=[];let total=0;
                for(let i=1;i<coords.length;i++){
                  const d=meters(coords[i-1],coords[i]);lengths.push(d);total+=d;
                }
                if(!(total>1))continue;
                const targets=[];
                const spacing=18;
                for(let d=spacing/2;d<total&&targets.length<12;d+=spacing)targets.push(d);
                if(!targets.length)targets.push(total/2);
                for(const target of targets){
                  let cumulative=0;
                  for(let i=0;i<lengths.length;i++){
                    const d=lengths[i];
                    if(target<=cumulative+d||i===lengths.length-1){
                      const t=d?Math.max(0,Math.min(1,(target-cumulative)/d)):0;
                      const a=coords[i],b=coords[i+1];
                      if(a&&b&&Number.isFinite(a[0])&&Number.isFinite(a[1])&&Number.isFinite(b[0])&&Number.isFinite(b[1])){
                        out.push({type:"Feature",properties:{kind:"tree-illustration",swale:String(f.properties?.display_code||f.properties?.id||"")},geometry:{type:"Point",coordinates:[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}});
                      }
                      break;
                    }
                    cumulative+=d;
                  }
                }
                if(out.length>2000)break;
              }
              return out;
            }
            function refresh(){
              try{
                const m=window.earthlineMap||(typeof earthlineMap!=="undefined"?earthlineMap:null);
                if(!m||!m.getStyle?.())return;
                const active=document.documentElement.dataset.earthlineAnalysisTier==="property";
                const audit=window.EARTHLINE_PROPERTY_PUBLICATION_AUDIT_16220||{};
                const model=typeof M!=="undefined"?M:null;
                const safe=model?.authoritativeSafeSwales15815?.features||[];
                const verified=model?.safetyAudit15806?.verified===true;
                const approved=active&&audit.published===true&&verified&&audit.safeCount>0&&safe.length>0;
                if(!approved){
                  for(const id of [outer,inner])if(m.getLayer(id))m.setLayoutProperty(id,"visibility","none");
                  return;
                }
                const token=String(audit.runToken||"")+":"+safe.length;
                if(!m.getSource(src))m.addSource(src,{type:"geojson",data:fc([])});
                const source=m.getSource(src);
                if(token!==priorToken||source!==priorSource){
                  const features=pointsFromSafeLines(safe);
                  source.setData(fc(features));
                  priorToken=token;priorSource=source;
                  window.EARTHLINE_PROPERTY_TREE_CIRCLES_AUDIT_M189={safeSwales:safe.length,treeCircles:features.length,runToken:audit.runToken,verified};
                }
                if(!m.getLayer(outer))m.addLayer({id:outer,type:"circle",source:src,minzoom:15,paint:{
                  "circle-radius":["interpolate",["linear"],["zoom"],15,2.5,18,5.2,20,6.5],
                  "circle-color":"#76502b","circle-stroke-color":"#d4ae79","circle-stroke-width":1,"circle-opacity":.92}});
                if(!m.getLayer(inner))m.addLayer({id:inner,type:"circle",source:src,minzoom:15,paint:{
                  "circle-radius":["interpolate",["linear"],["zoom"],15,1.6,18,3.65,20,4.9],
                  "circle-color":"#3e8d48","circle-stroke-color":"#1e522e","circle-stroke-width":.7,"circle-opacity":.95}});
                for(const id of [outer,inner])m.setLayoutProperty(id,"visibility","visible");
              }catch(e){console.warn("[Earthline M189 trees]",e)}
            }
            document.addEventListener("earthline:analysis-complete",()=>setTimeout(refresh,400),{passive:true});
            setInterval(refresh,1700);
            window.earthlineRefreshPropertyTreeCirclesM189=refresh;
          })();
          </script>"""
          s=s.rstrip()+"\n"+note+"\n"
          p.write_text(s)
          print('M189_SAFE_PROPERTY_CIRCLES_ATTACHED')
          PY
      - name: Source and JS gate
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          s=Path('index.html').read_text()
          assert s.count('earthline-property-safe-tree-points-m189')==1
          assert 'safetyAudit15806?.verified===true' in s
          for i,js in enumerate(re.findall(r'<script\b[^>]*>(.*?)</script>',s,re.S|re.I)):
            if not js.strip() or js.lstrip().startswith('{'):continue
            f=Path('/tmp/m189-'+str(i)+'.js');f.write_text(js)
            r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
            if r.returncode:raise RuntimeError(str(i)+': '+r.stderr[:450])
          print('M189_STATIC_SAFE_PASS')
          PY
      - name: Connected browser visual audit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          cat > m189-test.mjs <<'JS'
          import {chromium} from 'playwright';
          import {existsSync,statSync,readFileSync} from 'node:fs';
          import path from 'node:path';
          const root=process.cwd(),browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:950}});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.route('https://earthlinedevelopment.org/**',route=>{
            const u=new URL(route.request().url()),rel=decodeURIComponent(u.pathname).replace(/^[/]+/,'')||'index.html',local=path.resolve(root,rel);
            if((local!==root&&!local.startsWith(root+path.sep))||!existsSync(local)||!statSync(local).isFile())return route.abort();
            const ext=path.extname(local),types={'.html':'text/html','.js':'application/javascript','.json':'application/json','.css':'text/css','.png':'image/png'};
            return route.fulfill({status:200,contentType:types[ext]||'application/octet-stream',body:readFileSync(local)});
          });
          let result={};
          try{
            await page.goto('https://earthlinedevelopment.org/?m189='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('#searchInput').fill('Iowa');
            await page.locator('#runBtn').evaluate(el=>el.click());
            await page.waitForFunction(()=>window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167?.generated>0||window.EARTHLINE_LAST_LIVE_REGIONAL_ERROR_15970,null,{timeout:60000});
            await page.evaluate(()=>{const m=window.earthlineMap||earthlineMap;m.stop();m.jumpTo({center:[-93.68,42.13],zoom:17.7})});
            await page.waitForTimeout(1500);
            await page.locator('#earthlineDeclareProperty16169').evaluate(el=>el.click());
            await page.waitForFunction(()=>window.EARTHLINE_PROPERTY_RUN_AUDIT_16173?.settled===true,null,{timeout:85000});
            await page.waitForTimeout(1800);
            await page.evaluate(()=>window.earthlineRefreshPropertyTreeCirclesM189?.());
            result=await page.evaluate(()=>{
              const m=window.earthlineMap||earthlineMap;
              const l='earthline-property-safe-tree-core-m189',o='earthline-property-safe-tree-rim-m189',s='earthline-property-safe-tree-points-m189';
              const geo=m.getSource(s)?._data;
              let rendered=0;
              try{rendered=m.getLayer(l)?m.queryRenderedFeatures({layers:[l]}).length:0}catch{}
              return {safe:window.EARTHLINE_PROPERTY_PUBLICATION_AUDIT_16220?.safeCount||0,
                verified:M?.safetyAudit15806?.verified,unsafe:M?.safetyAudit15806?.clearance?.unsafeSegments,
                circles:window.EARTHLINE_PROPERTY_TREE_CIRCLES_AUDIT_M189,
                sourcePoints:geo?.features?.length,outerLayer:!!m.getLayer(o),innerLayer:!!m.getLayer(l),rendered,
                mapStyleLoaded:m.isStyleLoaded(),errors:[]};
            });
          }catch(e){result.error=String(e)}
          result.errors=errors;
          console.log('M189_SAFE_TREES_BROWSER '+JSON.stringify(result));
          await browser.close();
          if(result.safe<=0||result.unsafe!==0||result.verified!==true||result.sourcePoints<=0||!result.outerLayer||!result.innerLayer||errors.length)process.exitCode=1;
          JS
          node m189-test.mjs
      - name: Commit only tested source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(display): draw round trees from verified Property safe swales only"
          git push origin HEAD:repair/m189-property-circles-safe-lines
