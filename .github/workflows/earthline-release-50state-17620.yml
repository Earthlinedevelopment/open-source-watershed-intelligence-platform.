name: Earthline Release 50-State Science Certification 17620
on:
  push:
    branches: [candidate-release-17601]
    paths:
      - '.github/earthline-50state-17620-trigger.txt'
permissions:
  contents: read
jobs:
  certify:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - batch: b1
            states: "Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia"
          - batch: b2
            states: "Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland"
          - batch: b3
            states: "Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey"
          - batch: b4
            states: "New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina"
          - batch: b5
            states: "South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-release-17601
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run candidate 50-state Regional + Property science
        run: env EARTHLINE_URL='https://earthlinedevelopment.org/' STATES='${{ matrix.states }}' OUT='release50-17620-${{ matrix.batch }}.json' node tests/release-50state-17620.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release50-17620-${{ matrix.batch }}
          path: release50-17620-${{ matrix.batch }}.json
          if-no-files-found: error
