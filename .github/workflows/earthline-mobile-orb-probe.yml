name: Earthline Mobile Orb Probe
on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/mobile-orb-probe.mjs'
      - '.github/workflows/earthline-mobile-orb-probe.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/mobile-orb-probe.mjs
