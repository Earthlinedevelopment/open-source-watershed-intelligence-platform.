name: Earthline US Launch Core Repair

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-us-launch-core-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Apply guarded 16627 Regional validity optimization
        run: python3 lab/repair-16627-fast-regional-validity.py
      - name: Verify patch
        run: |
          git diff --check
          git diff --numstat -- index.html
          grep -n "EARTHLINE 16627\|FAST EQUIVALENT REGIONAL VALIDITY WALK\|invSteps16584" index.html | head -20
      - name: Commit 16627 repair
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'perf: preserve Regional validity verdict with direct grid walk'
          git push origin HEAD:pages-live
