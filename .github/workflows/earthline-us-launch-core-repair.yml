name: Earthline US Launch Core Repair

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-us-launch-core-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Apply guarded 16629 final mapped-water flow-arrow repair
        run: python3 lab/repair-16629-final-water-flow-arrows.py
      - name: Verify patch
        run: |
          git diff --check
          git diff --numstat -- index.html
          grep -n "EARTHLINE 16629\|FINAL WATER MASK PRESERVES VALID FLOW ARROWS\|inputArrows16629\|outputArrows16629" index.html | head -20
      - name: Commit 16629 repair
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: preserve valid Regional flow arrows after water masking'
          git push origin HEAD:pages-live

# launch trigger 16629
