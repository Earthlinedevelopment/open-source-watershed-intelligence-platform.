name: Earthline US Launch Core Repair

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-us-launch-core-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Add official US hydrography to existing 16609 final-swale owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='EARTHLINE 16617 — OFFICIAL US FINAL-SWALE HYDROGRAPHY'
          if marker in s:
              raise SystemExit('guard failed: 16617 marker already present')

          sig='  function earthlineMappedWaterSwaleGate16609(map16609,swales16609,runToken16609){'
          if s.count(sig)!=1:
              raise SystemExit(f'guard failed: mapped-water owner signature count {s.count(sig)}')
          s=s.replace(sig,'  async function earthlineMappedWaterSwaleGate16609(map16609,swales16609,runToken16609,useTiger16617=false){',1)

          start=s.index('  async function earthlineMappedWaterSwaleGate16609(')
          seg_anchor='    const segmentHits16609=(a,b)=>{'
          pos=s.index(seg_anchor,start)
          tiger='''    /* EARTHLINE 16617 — OFFICIAL US FINAL-SWALE HYDROGRAPHY.\n       U.S. state publication must not depend on the displayed Mapbox zoom. Query\n       Census TIGERweb Hydro only around the already-generated final swale geometry,\n       then feed those official areal + linear features into this same 16609 gate. */\n    let tigerVerified16617=!useTiger16617,tigerArealFeatures16617=0,tigerLinearFeatures16617=0,tigerPolygonParts16617=0,tigerLines16617=0,tigerMs16617=0,tigerError16617=null;\n    if(useTiger16617&&before16609>0){\n      const rings16617=[];\n      for(const f16617 of (swales16609&&swales16609.features||[])){\n        const c16617=f16617&&f16617.geometry&&f16617.geometry.type==='LineString'?f16617.geometry.coordinates:[];\n        let w16617=Infinity,s16617=Infinity,e16617=-Infinity,n16617=-Infinity;\n        for(const p16617 of c16617){if(!finite16609(p16617))continue;w16617=Math.min(w16617,+p16617[0]);s16617=Math.min(s16617,+p16617[1]);e16617=Math.max(e16617,+p16617[0]);n16617=Math.max(n16617,+p16617[1]);}\n        if(!Number.isFinite(w16617))continue;\n        const pad16617=.005;\n        rings16617.push([[w16617-pad16617,s16617-pad16617],[w16617-pad16617,n16617+pad16617],[e16617+pad16617,n16617+pad16617],[e16617+pad16617,s16617-pad16617],[w16617-pad16617,s16617-pad16617]]);\n      }\n      if(rings16617.length){\n        const geometry16617=JSON.stringify({rings:rings16617,spatialReference:{wkid:4326}});\n        const queryTiger16617=async layer16617=>{\n          const controller16617=new AbortController(),timer16617=setTimeout(()=>controller16617.abort(),5000);\n          const body16617=new URLSearchParams({where:'1=1',geometry:geometry16617,geometryType:'esriGeometryPolygon',inSR:'4326',spatialRel:'esriSpatialRelIntersects',outFields:'NAME',returnGeometry:'true',outSR:'4326',maxAllowableOffset:'0.00002',f:'geojson'});\n          try{\n            const response16617=await fetch('https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/Hydro/MapServer/'+layer16617+'/query',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:body16617,signal:controller16617.signal,cache:'no-store'});\n            const data16617=await response16617.json();\n            if(!response16617.ok||!data16617||!Array.isArray(data16617.features)||data16617.error)throw new Error(String(data16617&&data16617.error&&data16617.error.message||'TIGERweb Hydro query failed'));\n            return data16617.features;\n          }finally{clearTimeout(timer16617);}\n        };\n        const tigerStart16617=performance.now(),polyBefore16617=polys16609.length,lineBefore16617=lines16609.length;\n        try{\n          const [linear16617,areal16617]=await Promise.all([queryTiger16617(0),queryTiger16617(1)]);\n          tigerLinearFeatures16617=linear16617.length;tigerArealFeatures16617=areal16617.length;\n          for(const f16617 of areal16617)addGeometry16609(f16617&&f16617.geometry);\n          for(const f16617 of linear16617)addGeometry16609(f16617&&f16617.geometry);\n          tigerPolygonParts16617=Math.max(0,polys16609.length-polyBefore16617);\n          tigerLines16617=Math.max(0,lines16609.length-lineBefore16617);\n          tigerVerified16617=true;\n        }catch(e16617){tigerVerified16617=false;tigerError16617=String(e16617&&e16617.message||e16617||'TIGERweb Hydro unavailable');}\n        tigerMs16617=Math.round(performance.now()-tigerStart16617);\n      }else tigerVerified16617=true;\n    }\n'''
          s=s[:pos]+tiger+s[pos:]

          old_verify='    const verified16609=sourceQueries16609>0&&sourceSuccess16609>0&&deterministicRiverVerified16616;'
          if s.count(old_verify)!=1:
              raise SystemExit(f'guard failed: verification line count {s.count(old_verify)}')
          new_verify='    const verified16609=sourceQueries16609>0&&sourceSuccess16609>0&&deterministicRiverVerified16616&&(!useTiger16617||tigerVerified16617);'
          s=s.replace(old_verify,new_verify,1)

          old_audit="    window.EARTHLINE_REGIONAL_MAPPED_WATER_AUDIT_16609={build:'EARTHLINE 16609',runToken:runToken16609,sourceQueries:sourceQueries16609,sourceSuccess:sourceSuccess16609,rawWaterFeatures:rawFeatures16609,waterPolygonParts:polys16609.length,waterwayLines:lines16609.length,mapWaterwayLines:Math.max(0,lines16609.length-deterministicRiverLines16616.length),deterministicRiverLines:deterministicRiverLines16616.length,deterministicRiverVerified:deterministicRiverVerified16616,deterministicRiverSource:deterministicRiverProduct16616&&deterministicRiverProduct16616.riverCenterlineGeometry&&deterministicRiverProduct16616.riverCenterlineGeometry.source||null,before:before16609,after:out16609.features.length,rejected:rejected16609,verified:verified16609,safe:true,at:new Date().toISOString()};"
          if s.count(old_audit)!=1:
              raise SystemExit(f'guard failed: audit line count {s.count(old_audit)}')
          new_audit="    window.EARTHLINE_REGIONAL_MAPPED_WATER_AUDIT_16609={build:'EARTHLINE 16609',runToken:runToken16609,sourceQueries:sourceQueries16609,sourceSuccess:sourceSuccess16609,rawWaterFeatures:rawFeatures16609,waterPolygonParts:polys16609.length,waterwayLines:lines16609.length,mapWaterwayLines:Math.max(0,lines16609.length-deterministicRiverLines16616.length-tigerLines16617),deterministicRiverLines:deterministicRiverLines16616.length,deterministicRiverVerified:deterministicRiverVerified16616,deterministicRiverSource:deterministicRiverProduct16616&&deterministicRiverProduct16616.riverCenterlineGeometry&&deterministicRiverProduct16616.riverCenterlineGeometry.source||null,tigerHydroRequested:!!useTiger16617,tigerHydroVerified:tigerVerified16617,tigerArealFeatures:tigerArealFeatures16617,tigerLinearFeatures:tigerLinearFeatures16617,tigerPolygonParts:tigerPolygonParts16617,tigerLines:tigerLines16617,tigerHydroMs:tigerMs16617,tigerHydroError:tigerError16617,tigerHydroSource:useTiger16617?'U.S. Census Bureau TIGERweb/Hydro':null,before:before16609,after:out16609.features.length,rejected:rejected16609,verified:verified16609,safe:verified16609,at:new Date().toISOString()};"
          s=s.replace(old_audit,new_audit,1)

          old_call="""    if(!focusMode){\n      const mappedWaterGate16609=earthlineMappedWaterSwaleGate16609(m,swales,runToken);\n      const usStateWaterRun16609=!!(profile16549&&loc&&String(loc.countryCode||'').toLowerCase()==='us'&&loc.jurisdictionProfileId16556);\n      if(usStateWaterRun16609&&mappedWaterGate16609.verified!==true)throw new Error('U.S. state mapped-water verification unavailable; unverified swales were not published');\n      swales=mappedWaterGate16609.swales;\n    }"""
          new_call="""    if(!focusMode){\n      const usStateWaterRun16609=!!(profile16549&&loc&&String(loc.countryCode||'').toLowerCase()==='us'&&loc.jurisdictionProfileId16556);\n      const mappedWaterGate16609=await earthlineMappedWaterSwaleGate16609(m,swales,runToken,usStateWaterRun16609);\n      if(usStateWaterRun16609&&mappedWaterGate16609.verified!==true)throw new Error('U.S. state mapped-water verification unavailable; unverified swales were not published');\n      swales=mappedWaterGate16609.swales;\n    }"""
          if s.count(old_call)!=1:
              raise SystemExit(f'guard failed: mapped-water call block count {s.count(old_call)}')
          s=s.replace(old_call,new_call,1)

          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git diff --numstat -- index.html
          grep -n "EARTHLINE 16617\|tigerHydroVerified\|await earthlineMappedWaterSwaleGate16609" index.html | head -20
      - name: Commit 16617 repair
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: screen US Regional swales against official hydrography'
          git push origin HEAD:pages-live
