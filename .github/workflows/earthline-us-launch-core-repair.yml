name: Earthline US Launch Core Repair

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-us-launch-core-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Apply guarded 16630 single-owner flow validity repair
        run: python3 lab/repair-16630-deduplicate-flow-validity-audit.py
      - name: Verify repair
        run: |
          git diff --check
          git diff --numstat -- index.html
          grep -n "EARTHLINE 16630\|SINGLE VALIDITY OWNER / NO DUPLICATE FLOW WALK\|validationOwner:\"earthlineRegionalSmoothFlow16584\"" index.html | head -20
          if grep -Fq 'if(unsafe16584>0)throw new Error("regional land-validity flow audit failed:' index.html; then
            echo 'duplicate post-generation flow verdict remains' >&2
            exit 1
          fi
      - name: Commit 16630 repair
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: keep one Regional flow-validity owner'
          git push origin HEAD:pages-live

# launch trigger 16630 mantra36
