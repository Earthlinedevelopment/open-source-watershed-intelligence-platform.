name: Earthline US Launch Core Repair

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-us-launch-core-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Apply guarded 16637 accepted segment sampler repair
        run: python3 lab/repair-16637-restore-accepted-segment-sampler.py
      - name: Verify repair
        run: |
          git diff --check
          git diff --numstat -- index.html
          grep -n "EARTHLINE 16637\|RESTORE ACCEPTED 16584 SEGMENT SAMPLER\|function earthlineRegionalSegmentValid16584" index.html | head -20
          test "$(grep -c 'function earthlineRegionalSegmentValid16584' index.html)" -eq 1
          if grep -Fq 'EXACT PREFIX-PRUNED SAMPLE WALK' index.html; then
            echo '16633 recursive sampler remains' >&2
            exit 1
          fi
      - name: Commit 16637 repair
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'perf: restore accepted 16584 segment sampler 16637'
          git push origin HEAD:pages-live

# launch trigger 16637 ny-hard-fail
