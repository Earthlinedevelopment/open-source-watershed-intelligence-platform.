name: Earthline US Launch Core Repair

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-us-launch-core-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Apply guarded 16626 TIGER batch optimization
        run: python3 lab/repair-16626-tiger-batched-geometry.py
      - name: Verify patch
        run: |
          git diff --check
          git diff --numstat -- index.html
          grep -n "EARTHLINE 16626\|queryTigerGeometry16626\|chunkSize16626=24" index.html | head -20
      - name: Commit 16626 repair
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: batch official TIGER hydro geometry for US Regional'
          git push origin HEAD:pages-live
