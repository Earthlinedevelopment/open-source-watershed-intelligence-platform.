name: Earthline US Launch Core Repair

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-us-launch-core-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Apply guarded 16625 shared Regional water mask repair
        run: python3 lab/repair-16625-shared-water-mask.py
      - name: Verify patch
        run: |
          git diff --check
          git diff --numstat -- index.html
          grep -n "EARTHLINE 16625\|sharedFinalMask16625\|regionalRecharge16492=regionalRechargeModel16492" index.html | head -20
      - name: Commit 16625 repair
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: unify mapped-water mask for regional swales and recharge'
          git push origin HEAD:pages-live
