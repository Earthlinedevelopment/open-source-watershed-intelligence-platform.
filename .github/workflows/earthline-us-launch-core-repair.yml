name: Earthline US Launch Core Repair

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-us-launch-core-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Repair 16618 JavaScript parse regression only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='EARTHLINE 16619 — 16618 PARSE REPAIR'
          if marker in s:
              raise SystemExit('guard failed: 16619 marker already present')

          old="const k16618=String(f16618&&f16618.id??f16618&&f16618.properties&&f16618.properties.OBJECTID??JSON.stringify(f16618&&f16618.geometry));"
          new="const k16618=String((f16618&&f16618.id)??(f16618&&f16618.properties&&f16618.properties.OBJECTID)??JSON.stringify(f16618&&f16618.geometry));"
          count=s.count(old)
          if count!=2:
              raise SystemExit(f'guard failed: expected exactly 2 invalid dedupe expressions, found {count}')
          s=s.replace(old,new)

          anchor='        /* EARTHLINE 16618 — BATCHED US HYDROGRAPHY QUERY.'
          if s.count(anchor)!=1:
              raise SystemExit(f'guard failed: 16618 anchor count {s.count(anchor)}')
          s=s.replace(anchor,"        /* EARTHLINE 16619 — 16618 PARSE REPAIR: parenthesize nullish-coalescing operands; no science or behavior change. */\n"+anchor,1)

          if old in s:
              raise SystemExit('guard failed: invalid expression remains')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git diff --numstat -- index.html
          grep -n "EARTHLINE 16619\|const k16618" index.html | head -10
      - name: Commit 16619 repair
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: repair 16618 JavaScript parse regression'
          git push origin HEAD:pages-live
