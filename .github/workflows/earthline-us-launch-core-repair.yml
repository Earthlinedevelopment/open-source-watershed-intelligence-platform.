name: Earthline US Launch Core Repair

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-us-launch-core-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Apply guarded 16628 final mapped-water flow mask
        run: python3 lab/repair-16628-final-water-flow-mask.py
      - name: Verify patch
        run: |
          git diff --check
          git diff --numstat -- index.html
          grep -n "EARTHLINE 16628\|FINAL MAPPED-WATER MASK OWNS REGIONAL FLOWS\|EARTHLINE_FINAL_MAPPED_WATER_FLOW_AUDIT_16628" index.html | head -20
      - name: Commit 16628 repair
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: enforce final mapped-water mask on Regional flows'
          git push origin HEAD:pages-live

# launch trigger 16628
