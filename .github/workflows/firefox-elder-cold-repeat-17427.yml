name: Firefox Elder Cold Repeat 17427
on:
  push:
    branches: [repair/regional-clean-presentation-17424]
    paths:
      - '.github/workflows/firefox-elder-cold-repeat-17427.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/regional-clean-presentation-17424
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: candidate/browser-elder-clean-regional-17425
          path: candidate
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          cd harness
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps firefox
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 --directory candidate >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: |
          cd harness
          failed=0
          for i in 1 2 3; do
            echo "=== FIREFOX ELDER COLD REPEAT $i ==="
            xvfb-run -a env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='firefox' HEADLESS='false' node tests/elder-user-flow-17418.mjs || failed=1
          done
          exit $failed
