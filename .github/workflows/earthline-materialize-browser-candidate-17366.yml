name: Earthline Materialize Browser Candidate 17366
on:
  push:
    branches: [repair/browser-performance-live-17268]
    paths:
      - '.github/workflows/earthline-materialize-browser-candidate-17366.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/browser-performance-live-17268
          fetch-depth: 0
      - run: |
          python3 tests/apply-browser-yield-fastpath-17295.py
          python3 tests/apply-wasm-pip-kernel-17319.py
          python3 tests/apply-certified-interior-supertile-17301.py
          python3 tests/apply-skip-regional-preferred-screen-17305.py
          python3 tests/apply-run-scoped-segment-clip-cache-17315.py
          python3 tests/apply-consolidated-provisional-jurisdiction-17325.py
          python3 tests/apply-land-validity-scanline-17352.py
          python3 tests/apply-vermont-cors-first-17360.py
          python3 tests/apply-regional-screen-reuse-17365.py
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "index.html"
          sha256sum index.html
      - run: |
          git config user.name "Earthline Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B candidate/browser-repair-17365
          git add index.html
          git commit -m "candidate: materialize cross-browser Regional repair 17365"
          git push --force origin HEAD:refs/heads/candidate/browser-repair-17365
