name: Earthline M95 Candidate Integrity
on:
  push:
    branches:
      - recovery/mantra95-science-elder-blue
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check M95 recovery candidate integrity
        run: node tests/m95-recovery-static.cjs
