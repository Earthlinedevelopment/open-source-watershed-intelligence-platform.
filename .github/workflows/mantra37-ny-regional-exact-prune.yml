name: Mantra 37 NY Regional repair

on:
  push:
    branches:
      - pages-live

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0

      - name: Apply and publish only on the repair trigger
        shell: bash
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%s)"
          if [ "$message" != "ops: apply mantra37 stale regional context repair" ]; then
            echo "Not the 16639 stale-context trigger; no change."
            exit 0
          fi
          python lab/mantra37-repair-16639-stale-regional-context.py
          git diff --check
          grep -n "EARTHLINE 16639 — STALE REGIONAL CONTEXT CANNOT RECLAIM PROPERTY" index.html
          test "$(grep -c 'publishDisplayedRun16151(enriched16198);' index.html)" -eq 1
          if git diff --quiet -- index.html; then
            echo "No index change required."
            exit 0
          fi
          git config user.name earthline-ci
          git config user.email actions@users.noreply.github.com
          git add index.html
          git commit -m "fix: prevent stale Regional context from overwriting Property"
          git push origin HEAD:pages-live

# 16639 exact cross-tier stale-context repair trigger
