name: Mantra 37 NY Regional repair

on:
  push:
    branches:
      - pages-live

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0

      - name: Apply and publish only on the repair trigger
        shell: bash
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%s)"
          if [ "$message" != "ops: apply mantra37 property-tail retirement" ]; then
            echo "Not the 16640 Property-tail trigger; no change."
            exit 0
          fi
          python lab/mantra37-repair-16640-retire-property-tail-on-regional.py
          git diff --check
          grep -n "EARTHLINE 16640 — REGIONAL HANDOFF RETIRES PROPERTY PRESENTATION TAIL" index.html
          test "$(grep -c 'regional-owner-handoff-16640' index.html)" -eq 1
          if git diff --quiet -- index.html; then
            echo "No index change required."
            exit 0
          fi
          git config user.name earthline-ci
          git config user.email actions@users.noreply.github.com
          git add index.html
          git commit -m "perf: retire Property presentation tail at Regional handoff"
          git push origin HEAD:pages-live

# 16640 exact cross-tier performance repair trigger
