name: Mantra 37 NY Regional repair

on:
  push:
    branches:
      - pages-live

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0

      - name: Apply and publish only on the repair trigger
        shell: bash
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%s)"
          if [ "$message" != "ops: apply mantra37 regional handoff repair" ]; then
            echo "Not the 16638 Regional handoff trigger; no change."
            exit 0
          fi
          python lab/repair-16638-regional-presentation-handoff.py
          git diff --check
          grep -n "EARTHLINE 16638 — REGIONAL PRESENTATION HANDOFF BEFORE CAMERA" index.html
          test "$(grep -c "regionalState16638.active=true;regionalState16638.mode='regional';" index.html)" -eq 1
          if git diff --quiet -- index.html; then
            echo "No index change required."
            exit 0
          fi
          git config user.name earthline-ci
          git config user.email actions@users.noreply.github.com
          git add index.html
          git commit -m "perf: hand Regional ownership over before camera motion"
          git push origin HEAD:pages-live

# 16638 exact transition repair trigger
