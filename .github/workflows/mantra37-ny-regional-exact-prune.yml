name: Mantra 37 NY Regional repair

on:
  push:
    branches:
      - pages-live

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0

      - name: Apply and publish only on the repair trigger
        shell: bash
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%s)"
          if [ "$message" != "ops: apply mantra37 ny repair" ]; then
            echo "Not the Mantra 37 repair trigger; no change."
            exit 0
          fi
          python lab/mantra37-repair-16633.py
          python lab/mantra37-repair-16634.py
          node lab/mantra37-verify.js
          git diff --check
          if git diff --quiet -- index.html; then
            echo "No index change required."
            exit 0
          fi
          git config user.name earthline-ci
          git config user.email actions@users.noreply.github.com
          git add index.html
          git commit -m "perf: apply exact NY Regional repair 16633-16634"
          git push origin HEAD:pages-live

# exact repair trigger retained for Mantra 37
