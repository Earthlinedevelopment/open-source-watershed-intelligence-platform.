name: Earthline 16845 Country Ownership Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-16845-country-owner-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: archipelago
            targets: 'Singapore|Brunei|Indonesia|Philippines'
          - batch: continental
            targets: 'India|Australia|Cabo Verde'
          - batch: islands
            targets: 'Comoros|Mauritius|Seychelles'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Probe live country ownership
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          TARGETS: ${{ matrix.targets }}
          OUTDIR: out-16845-country-${{ matrix.batch }}
        run: node lab/earthline-16845-country-owner-probe.mjs
      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthline-16845-country-${{ matrix.batch }}
          path: out-16845-country-${{ matrix.batch }}/
          retention-days: 3
