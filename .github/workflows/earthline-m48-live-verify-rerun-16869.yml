name: Earthline M48 final UI owner audit 16871
on:
  push:
    branches:
      - mantra48-final-launch-16871
    paths:
      - .github/workflows/earthline-m48-live-verify-rerun-16869.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect live DOM and map owners
        run: |
          mkdir -p lab artifacts
          cat > /tmp/audit.py <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          out={}
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,args=['--disable-dev-shm-usage'])
            page=b.new_page(viewport={'width':1440,'height':1000})
            page.goto('https://earthlinedevelopment.org/?ui_owner_audit=16871',wait_until='domcontentloaded',timeout=60000)
            page.wait_for_timeout(3500)
            out['button']=page.evaluate("""()=>{const el=document.querySelector('#earthlineDeclareProperty16169');if(!el)return null;const cs=getComputedStyle(el);return {html:el.innerHTML,text:el.textContent,display:cs.display,font:cs.font,fontSize:cs.fontSize,lineHeight:cs.lineHeight,letterSpacing:cs.letterSpacing,height:cs.height,width:cs.width,padding:cs.padding,children:[...el.children].map(x=>({tag:x.tagName,cls:String(x.className||''),text:x.textContent,html:x.outerHTML,fontSize:getComputedStyle(x).fontSize,lineHeight:getComputedStyle(x).lineHeight}))}}""")
            out['languages']=page.evaluate("""()=>{const s=document.querySelector('#earthlineLanguageSelect16488');return {exists:!!s,html:s?.outerHTML||'',value:s?.value||'',options:s?[...s.options].map(o=>({value:o.value,text:o.textContent})):[],globals:Object.keys(window).filter(k=>/lang|language/i.test(k)&&/earthline/i.test(k)).slice(0,100)}}""")
            out['map']=page.evaluate("""()=>{const m=window.earthlineMap||window.map||null;const layers={};const ids=m?.getStyle?.()?.layers?.map(l=>l.id).filter(id=>/swale|water/i.test(id))||[];for(const id of ids){if(!m.getLayer(id))continue;const rec={type:m.getLayer(id).type,visibility:m.getLayoutProperty(id,'visibility')||'visible'};for(const prop of ['line-color','line-width','line-opacity','line-pattern','fill-color','fill-opacity'])try{rec[prop]=m.getPaintProperty(id,prop)}catch(e){}layers[id]=rec}return {zoom:m?.getZoom?.()??null,ids,layers}}""")
            page.screenshot(path='artifacts/live-ui-owner-16871.png',full_page=True)
            b.close()
          open('lab/mantra48-ui-owner-audit-16871.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
          python /tmp/audit.py
      - name: Commit evidence
        run: |
          git config user.name "earthline-audit-bot"
          git config user.email "info@earthlinedevelopment.org"
          git add lab/mantra48-ui-owner-audit-16871.json
          git commit -m "diag: record final UI owners 16871"
          git push origin HEAD:mantra48-final-launch-16871
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: earthline-ui-owner-audit-16871
          path: artifacts/
