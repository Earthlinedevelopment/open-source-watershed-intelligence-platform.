name: Earthline M48 live owner introspection 16871
on:
  push:
    branches:
      - mantra48-final-launch-16871
    paths:
      - .github/workflows/earthline-m48-live-verify-rerun-16869.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect live owners
        run: |
          mkdir -p lab
          cat > /tmp/owners.py <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          out={}
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,args=['--disable-dev-shm-usage'])
            page=b.new_page(viewport={'width':1440,'height':1000})
            page.goto('https://earthlinedevelopment.org/?owner_introspection=16871',wait_until='domcontentloaded',timeout=60000)
            page.wait_for_timeout(3500)
            out['globals']=page.evaluate("""()=>Object.keys(window).filter(k=>/16869|PropertyTarget|TargetLabel|Language16488|Map$|map/i.test(k)&&/earthline/i.test(k)).sort().slice(0,300)""")
            out['functions']=page.evaluate("""()=>{const names=['earthlineRenderPropertyTargetLabel16869','earthlineSyncPropertyTarget16201','earthlineSyncPropertyTargetLabel16201','earthlineApplyRendererOwnership15805','earthlineApplyLanguage16488'];const o={};for(const n of names){try{o[n]=typeof window[n]==='function'?String(window[n]):typeof window[n]}catch(e){o[n]='ERR '+e}}return o}""")
            out['button']=page.evaluate("""()=>{const el=document.querySelector('#earthlineDeclareProperty16169');const rules=[];for(const ss of [...document.styleSheets]){let rr;try{rr=ss.cssRules}catch(e){continue}for(const r of [...(rr||[])]){const txt=r.cssText||'';if(txt.includes('earthlineDeclareProperty16169')||txt.includes('16869'))rules.push(txt)}}return {html:el?.innerHTML||'',text:el?.textContent||'',rules}}""")
            out['maps']=page.evaluate("""()=>{const vals=[];for(const k of Object.keys(window)){let v;try{v=window[k]}catch(e){continue}if(v&&typeof v.getStyle==='function'&&typeof v.getLayer==='function'){let ids=[];try{ids=v.getStyle()?.layers?.filter(l=>/swale|water/i.test(l.id)).map(l=>l.id)||[]}catch(e){}vals.push({name:k,zoom:v.getZoom?.(),ids})}}return vals}""")
            b.close()
          open('lab/mantra48-live-owner-introspection-16871.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
          python /tmp/owners.py
      - name: Commit evidence
        run: |
          git config user.name "earthline-audit-bot"
          git config user.email "info@earthlinedevelopment.org"
          git add lab/mantra48-live-owner-introspection-16871.json
          git commit -m "diag: record live owner introspection 16871"
          git push origin HEAD:mantra48-final-launch-16871
