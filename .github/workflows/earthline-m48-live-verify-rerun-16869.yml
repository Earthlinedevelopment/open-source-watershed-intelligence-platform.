name: Earthline M48 live browser verification rerun 16869
on:
  push:
    branches:
      - pages-live
    paths:
      - .github/workflows/earthline-m48-live-verify-rerun-16869.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver library only
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install playwright@1.55.0 --no-save
      - name: Extract and run the unchanged production test
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/?verify=16869-rerun
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/earthline-m48-live-verify-16869.yml').read_text(encoding='utf-8')
          a=text.index("          cat > /tmp/verify16869.js <<'JS'\n")+len("          cat > /tmp/verify16869.js <<'JS'\n")
          b=text.index("\n          JS\n",a)
          body=text[a:b]
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())+'\n'
          Path('/tmp/verify16869.js').write_text(body,encoding='utf-8')
          PY
          node /tmp/verify16869.js
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthline-16869-live-verification-rerun
          path: artifacts/
          if-no-files-found: ignore
