name: Earthline M48 live report diagnostic 16870
on:
  push:
    branches:
      - mantra48-report-isolation-16870
    paths:
      - .github/workflows/earthline-m48-live-verify-rerun-16869.yml
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium
      - name: Capture live report reachability
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/?report_diag=16870
        run: |
          mkdir -p lab artifacts
          cat > /tmp/report-diag.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const out={startedAt:new Date().toISOString(),url:process.env.EARTHLINE_URL,errors:[]};
            let browser=null,page=null;
            try{
              browser=await chromium.launch({headless:true,args:['--disable-dev-shm-usage']});
              page=await browser.newPage({viewport:{width:1440,height:1000}});
              page.on('pageerror',e=>out.errors.push('pageerror: '+e.message));
              page.on('console',m=>{if(m.type()==='error')out.errors.push('console: '+m.text())});
              await page.goto(process.env.EARTHLINE_URL,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForFunction(()=>typeof window.earthlineSetPropertyTarget16201==='function'&&!!document.querySelector('#earthlineVermontReport16149'),null,{timeout:30000});
              const snap=async label=>page.evaluate(label=>{
                const b=document.querySelector('#earthlineVermontReport16149');
                const d151=window.EARTHLINE_DISPLAYED_RUN_16151||null,d147=window.EARTHLINE_DISPLAYED_RUN_16147||null;
                let audit=null;try{audit=typeof window.earthlineReportReachabilityAudit16151==='function'?window.earthlineReportReachabilityAudit16151():null}catch(e){audit={error:String(e)}}
                return {label,tier:document.documentElement.dataset.earthlineTier||'',runState:document.documentElement.dataset.earthlineRunState||'',dataActive:document.documentElement.dataset.earthlineActiveRun||'',active151:window.EARTHLINE_ACTIVE_RUN_TOKEN_16151||null,active149:window.EARTHLINE_ACTIVE_RUN_TOKEN_16149||null,active147:window.EARTHLINE_ACTIVE_RUN_TOKEN_16147||null,displayed151:d151&&d151.runToken||null,displayed147:d147&&d147.runToken||null,buttonExists:!!b,buttonDisabled:b?!!b.disabled:null,buttonReady:b?b.dataset.ready||'':null,ariaDisabled:b?b.getAttribute('aria-disabled'):null,onclickType:b?typeof b.onclick:null,buttonVisible:b?getComputedStyle(b).display!=='none':null,pointerEvents:b?getComputedStyle(b).pointerEvents:null,buttonText:b?b.textContent.replace(/\s+/g,' ').trim():null,openerType:typeof window.earthlineOpenVermontReport16151,audit};
              },label);
              out.before=await snap('before');
              await page.evaluate(()=>window.earthlineSetPropertyTarget16201({lng:-73.1107,lat:44.4906,source:'16870-live-report-diagnostic'},{openPanel:false}));
              const done=page.evaluate(()=>new Promise(resolve=>{
                let finished=false; const finish=d=>{if(!finished){finished=true;resolve(d)}};
                document.addEventListener('earthline:analysis-complete',e=>{const d=e.detail||{};if(String(d.tier||d.mode||'').toLowerCase()==='property')finish({kind:'complete',detail:d})});
                document.addEventListener('earthline:analysis-failed',e=>finish({kind:'failed',detail:e.detail||{}}));
                setTimeout(()=>finish({kind:'timeout'}),60000);
              }));
              await page.locator('#earthlineDeclareProperty16169').click({timeout:15000});
              out.terminal=await done;
              await page.waitForTimeout(1600);
              out.after=await snap('after');
              try{
                if(out.after.buttonExists&&!out.after.buttonDisabled){await page.locator('#earthlineVermontReport16149').click({timeout:10000});await page.waitForTimeout(500)}
                else if(out.after.buttonExists){await page.evaluate(()=>document.querySelector('#earthlineVermontReport16149')?.click());await page.waitForTimeout(300)}
              }catch(e){out.clickError=String(e?.stack||e)}
              out.afterClick=await page.evaluate(()=>{const p=document.querySelector('#earthlineVermontReportPanel16149');return {panelExists:!!p,panelOpen:!!p&&p.classList.contains('open'),className:p?.className||''}});
              try{await page.screenshot({path:'artifacts/report-live-diagnostic.png'})}catch(e){out.screenshotError=String(e)}
            }catch(e){out.fatal=String(e?.stack||e)}
            finally{
              out.finishedAt=new Date().toISOString();
              fs.writeFileSync('lab/mantra48-report-live-diagnostic-16870.json',JSON.stringify(out,null,2));
              fs.writeFileSync('artifacts/report-live-diagnostic.json',JSON.stringify(out,null,2));
              console.log(JSON.stringify(out,null,2));
              if(browser)await browser.close().catch(()=>{});
            }
          })();
          JS
          node /tmp/report-diag.js
      - name: Commit diagnostic evidence to isolation branch
        run: |
          git config user.name "earthline-diagnostic-bot"
          git config user.email "info@earthlinedevelopment.org"
          git add lab/mantra48-report-live-diagnostic-16870.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag: record live Bioswale Report reachability 16870"
          git push origin HEAD:mantra48-report-isolation-16870
      - name: Upload report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthline-report-live-diagnostic-16870
          path: artifacts/
          if-no-files-found: ignore
