name: Earthline M76 Science Owner Audit
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-suggestion-css-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Exact current science owner excerpts
        shell: bash
        run: |
          echo '=== ELDERS EXACT ==='
          grep -n -F 'thinned map subset' index.html || true
          grep -n -F 'elder-display-only-m76' index.html || true
          grep -n -E 'EARTHLINE_ELDER|Elder Trees|elder.*coverage|startProperty\(|primePropertyEvidence' index.html | head -140 || true
          echo '=== SWALES EXACT ==='
          grep -n -E 'authoritativeSafeSwales15815|earthlineCrossSlopeLocalGuardM76|earthlineLocalContourReachM76|earthlineLocalSeedReachM76|zero-runoff secondary|swale prescription' index.html | head -180 || true
          echo '=== WATER EXACT ==='
          grep -n -E 'authoritative.*water|water paths|waterPaths|directional-water-paths|flow routing|earthline.*Water' index.html | head -180 || true
          echo '=== AQUIFER EXACT ==='
          grep -n -E 'earthlinePropertyAquiferQueryBBox16391|propertyAquiferOwner16393|fetchUSGSAquifers|earthlineInheritRegionalAquiferContext16334|usgsAquiferCompletedKey16393' index.html | head -180 || true
