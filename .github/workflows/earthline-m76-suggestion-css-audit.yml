name: Earthline M76 Suggestion CSS Audit
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-suggestion-css-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          sed -n '4510,4585p' index.html
          echo '=== known property ==='
          sed -n '26360,26445p' index.html
