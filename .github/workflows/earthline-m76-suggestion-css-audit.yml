name: Earthline M76 Elder Owner Audit
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-suggestion-css-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Elder exact owner
        shell: bash
        run: |
          grep -n -E 'elder-display-only-m76|thinned map subset|EARTHLINE_ELDER|Elder Trees|primePropertyEvidence|startProperty' index.html | head -220 || true
