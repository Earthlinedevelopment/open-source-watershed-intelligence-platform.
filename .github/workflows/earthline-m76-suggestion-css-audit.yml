name: Earthline M76 Elder Owner Audit
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-suggestion-css-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Elder implementation
        shell: bash
        run: |
          grep -n -E '17097|current Earthline coverage|thinned|Elder Tree|elder tree|elderTrees|elder.*point' index.html | head -260 || true
