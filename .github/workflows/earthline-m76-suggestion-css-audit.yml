name: Earthline M76 Science Exact Blocks
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-suggestion-css-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Exact blocks
        shell: bash
        run: |
          echo '=== SWALE START ==='; sed -n '13010,13125p' index.html
          echo '=== SWALE TRACE ==='; sed -n '13330,13595p' index.html
          echo '=== SWALE FINAL ==='; sed -n '13670,13905p' index.html
          echo '=== AQUIFER PROPERTY ==='; sed -n '17370,17575p' index.html
          echo '=== WATER PUBLICATION ==='; sed -n '29380,29445p' index.html
          echo '=== ELDER TERMINAL ==='; sed -n '29810,29875p' index.html
