name: Earthline M76 Swale Science Audit
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-suggestion-css-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Swale science exact
        shell: bash
        run: |
          grep -n -E 'function .*swale|function prescribe|prescribeSwales|swale prescription|spacing|candidate.*swale|ranked.*swale|earthlineCrossSlopeLocalGuardM76|earthlineLocalContourReachM76|earthlineLocalSeedReachM76|deadline15771|maxMs' index.html | head -320 || true
