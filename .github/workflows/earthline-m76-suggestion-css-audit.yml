name: Earthline M76 Science Owner Audit
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-suggestion-css-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Trace science owners
        shell: bash
        run: |
          echo '=== SWALES ==='
          grep -n -E 'authoritativeSafeSwales15815|swale prescription|safeSwales|earthlineCrossSlopeLocalGuardM76|earthlineLocal.*ReachM76' index.html | head -220 || true
          echo '=== WATER ==='
          grep -n -E 'water paths|waterPaths|directional-water-paths|authoritative.*water|flow accumulation|flow routing' index.html | head -220 || true
          echo '=== ELDERS ==='
          grep -n -E 'ELDER|Elder|elder|primePropertyEvidence|startProperty|thinned map subset' index.html | head -260 || true
          echo '=== AQUIFERS ==='
          grep -n -E 'aquifer|Aquifer|USGS.*aquifer|IGRACA|groundwater evidence' index.html | head -280 || true
          echo '=== PUBLICATION ==='
          grep -n -E 'PROPERTY_PUBLICATION|propertyPublication|publicationAudit|authoritative.*publish|DISPLAYED_RUN' index.html | head -240 || true
