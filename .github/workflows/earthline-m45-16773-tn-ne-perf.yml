name: Earthline 16773 TN NE Performance Isolation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-m45-16773-tn-ne-perf.yml']
permissions:
  contents: read
jobs:
  trace:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        state: [tennessee, nebraska]
        iteration: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Build exact 16773 candidate
        shell: bash
        run: |
          mkdir -p /tmp/m45
          curl -fsSL "https://earthlinedevelopment.org/?perfiso=$RANDOM" > /tmp/m45/index.html
          cp lab/apply-16773-proportional-dispersion.py /tmp/m45/apply.py
          cd /tmp/m45
          python3 apply.py
          grep -q "EARTHLINE 16773" index.html
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Trace
        shell: bash
        env:
          STATE: ${{ matrix.state }}
          ITERATION: ${{ matrix.iteration }}
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const state=process.env.STATE,iteration=Number(process.env.ITERATION),body=fs.readFileSync('/tmp/m45/index.html','utf8');
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1908,height:882}});
          await page.route('https://earthlinedevelopment.org/**',async route=>{
            const req=route.request(),u=new URL(req.url());
            if(req.resourceType()==='document'&&(u.pathname==='/'||u.pathname==='/index.html')){const resp=await route.fetch();await route.fulfill({response:resp,body,headers:{...resp.headers(),'cache-control':'no-store'}});return;}
            await route.continue();
          });
          let error=null;
          try{
            await page.goto('https://earthlinedevelopment.org/?iso='+state+'-'+iteration+'-'+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#searchInput',{timeout:30000});
            await page.evaluate(q=>{const i=document.getElementById('searchInput'),b=document.getElementById('runBtn');i.value=q+' state';i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));b.click();},state);
            await page.waitForFunction(()=>{const p=window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167,d=window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020;return Number(p?.generated||0)>0&&Number(p?.generated||0)===Number(d?.swaleLines||0);},null,{timeout:70000,polling:100});
            await page.waitForTimeout(250);
          }catch(e){error=String(e?.message||e);}
          const out=await page.evaluate(()=>{
            const perf=window.EARTHLINE_REGIONAL_PERFORMANCE_16191||{},ref=window.EARTHLINE_COVERAGE_GAP_REFINEMENT_16731||{},s=window.EARTHLINE_SPATIAL_COVERAGE_SELECTION_16736||{},p=window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167||{},d=window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020||{};
            return {build:s.build||null,coreMs:Number(perf.totalMs||NaN),phase:perf.phaseTotalsMs||null,refinementMs:Number(ref.elapsedMs||0),refinementSelected:Array.isArray(ref.selected)?ref.selected.length:null,refinementAdded:Number(ref.added||0),reserved:Number(s.reserved||0),capacity:Number(s.capacity||0),generated:Number(p.generated||0),visible:Number(d.swaleLines||0)};
          }).catch(()=>({}));
          out.state=state;out.iteration=iteration;out.error=error;
          console.log('EARTHLINE_TRACE '+JSON.stringify(out));
          await browser.close();
          JS
