name: Earthline Property First Click 17265
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - 'earthline-launch-16872.js'
      - 'tests/property-first-click-17265.mjs'
      - '.github/workflows/earthline-property-first-click-17265.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          if [ '${{ matrix.browser }}' = 'chrome' ]; then npx playwright install --with-deps chrome; else npx playwright install --with-deps firefox; fi
      - shell: bash
        run: |
          if [ '${{ matrix.browser }}' = 'firefox' ]; then
            xvfb-run -a env BROWSER='firefox' HEADLESS='false' node tests/property-first-click-17265.mjs
          else
            env BROWSER='chrome' HEADLESS='true' node tests/property-first-click-17265.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: property-first-click-${{ matrix.browser }}-17265
          path: artifacts/property-first-click-17265/
          if-no-files-found: warn
  webkit:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - run: env BROWSER='webkit' HEADLESS='true' node tests/property-first-click-17265.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: property-first-click-webkit-17265
          path: artifacts/property-first-click-17265/
          if-no-files-found: warn
