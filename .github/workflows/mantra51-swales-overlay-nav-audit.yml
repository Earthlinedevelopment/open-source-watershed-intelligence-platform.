name: Mantra 51 Swales Overlay Nav Audit
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-swales-overlay-nav-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(errors='ignore')
          terms=['Login','MERCH','Merch','Donate','DONATE','earthlineSwalesPage16125','swales-explained','earthline-process']
          for term in terms:
            print('\n###',term)
            for m in list(re.finditer(re.escape(term),s,re.I))[:40]:
              i=m.start()
              print('POS',i,s[max(0,i-500):min(len(s),i+1300)].replace('\n',' ')[:1800])
          PY
