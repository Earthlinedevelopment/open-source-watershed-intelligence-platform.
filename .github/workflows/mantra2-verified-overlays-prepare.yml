name: Prepare verified zero-swale Property overlay correction
on:
  push:
    branches: [repair/mantra2-verified-zero-swale-overlays]
    paths: [.github/workflows/mantra2-verified-overlays-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Change only the verified Property publication gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "bb0bf64359e1121841eceba8000eb93d250b9418"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          a='Number(M.propertyPublication15816.rawGeographicSegments||0)>0'
          b='M.propertyPublication15816.safetyVerified===true'
          assert s.count(a)==1,'wrong Property publication owner'
          s=s.replace(a,b)
          assert 'Mostly steep ground' not in s
          p.write_text(s)
          PY
          test "$(git hash-object index.html)" = "5fab2586e6c73b340708c14a12b9be43abf308a7"
          git rm .github/workflows/mantra2-verified-overlays-prepare.yml
          git config user.name 'Earthline isolated repairs'
          git config user.email 'info@earthlinedevelopment.org'
          git add index.html
          git commit -m 'fix(property): preserve verified Property overlays with zero qualifying swales'
          git push origin HEAD:repair/mantra2-verified-zero-swale-overlays
