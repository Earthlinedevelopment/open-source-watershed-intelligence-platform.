name: Mantra 51 HBW Editorial Lint
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - '.github/workflows/mantra51-hbw-editorial-lint.yml'
permissions: {contents: read}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - run: python3 -m http.server 8787 >/tmp/el-http.log 2>&1 &
      - run: |
          cat > lint.mjs <<'JS'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true});const p=await b.newPage();
          await p.goto('http://127.0.0.1:8787/index.html?lint='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await p.waitForTimeout(3500);await p.evaluate(()=>{location.hash='#swales-explained'});
          await p.waitForSelector('#earthlineSwalesPage16125.open',{timeout:15000});await p.waitForTimeout(500);
          const rows=await p.evaluate(()=>{
            const d=document.querySelector('#earthlineSwalesPage16125 iframe')?.contentDocument;
            const els=[...(d?.querySelectorAll('#earthlineCanonicalHowBioswales16923 p,#earthlineCanonicalHowBioswales16923 li,#earthlineCanonicalHowBioswales16923 h2,#earthlineCanonicalHowBioswales16923 h3')||[])];
            return els.map((e,i)=>({i,tag:e.tagName,text:(e.innerText||'').replace(/\s+/g,' ').trim()}))
              .filter(x=>/\b(this report|your property|always|never|only|every|guarantee|proves|must|will)\b|Vermont/i.test(x.text));
          });
          console.log(JSON.stringify(rows,null,2));await b.close();
          JS
          node lint.mjs
