name: Mantra 83 Restore Elders Production
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - 'tests/mantra83-restore-elder-assets.mjs'
      - '.github/workflows/earthline-mantra83-restore-elders-production.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mantra83-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra83-shadow-live
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          cp tests/mantra83-restore-elder-assets.mjs /tmp/restore-elders.mjs
          git fetch origin pages-live
          git checkout -B pages-live origin/pages-live
          node /tmp/restore-elders.mjs
          node --check earthline-elder-restored-17097.js
          node --check earthline-elder-worker-17129.js
          test -f data/elder-trees/v2/manifest.json
          git config user.name "earthline-ci"
          git config user.email "actions@users.noreply.github.com"
          git add index.html earthline-elder-restored-17097.js earthline-elder-worker-17129.js data/elder-trees
          git commit -m "restore: Elder Tree Property engine and evidence assets"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
