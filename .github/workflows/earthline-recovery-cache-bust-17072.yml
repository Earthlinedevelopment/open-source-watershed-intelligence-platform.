name: Earthline Recovery Cache Bust 17072
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-recovery-cache-bust-17072.yml'

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pages-live
        uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0

      - name: Replace only production runtime cache keys
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old1='<script src="earthline-launch-16872.js?v=17014"></script>'
          new1='<script src="earthline-launch-16872.js?v=17072-recovery"></script>'
          old2='<script src="earthline-language-hotfix-16890.js"></script>'
          new2='<script src="earthline-language-hotfix-16890.js?v=17072-recovery"></script>'
          assert s.count(old1)==1, f"launch ref count={s.count(old1)}"
          assert s.count(old2)==1, f"language ref count={s.count(old2)}"
          t=s.replace(old1,new1).replace(old2,new2)
          p.write_text(t,encoding="utf-8")
          PY

      - name: Verify and commit only index.html
        shell: bash
        run: |
          test "$(git status --short | wc -l)" -eq 1
          git status --short | grep -q '^ M index.html$'
          grep -q 'earthline-launch-16872.js?v=17072-recovery' index.html
          grep -q 'earthline-language-hotfix-16890.js?v=17072-recovery' index.html
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "repair: force fresh production runtime scripts 17072"
          git push origin HEAD:pages-live
