name: Mantra 46 16816 Refinement Overlap
on:
  push:
    branches: [diagnostic-m46-16795-fine-coverage]
  workflow_dispatch:
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run refinement overlap trace
        run: node tests/mantra46-16816-refinement-overlap.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16816-refinement-overlap
          path: artifacts/mantra46-16816-refinement-overlap/
