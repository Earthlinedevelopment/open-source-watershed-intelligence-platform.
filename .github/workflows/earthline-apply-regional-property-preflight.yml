name: Earthline Apply Regional Property Scale Preflight
'on':
  push:
    branches:
      - candidate-next
    paths:
      - tools/apply-regional-property-preflight.py
      - .github/workflows/earthline-apply-regional-property-preflight.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 1
      - run: python3 tools/apply-regional-property-preflight.py
      - run: git diff --check
      - run: |
          git config user.name "Earthline Launch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "science: verify top Regional opportunities at Property slope scale"
          git push origin HEAD:candidate-next
