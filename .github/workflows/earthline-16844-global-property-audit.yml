name: Earthline 16844 Global Property Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-16844-global-property-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  property:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: sea1
            targets: 'Brunei|Cambodia|Indonesia|Laos|Malaysia|Myanmar'
          - batch: sea2
            targets: 'Philippines|Singapore|Thailand|Timor-Leste|Vietnam'
          - batch: africa1
            targets: 'Algeria|Angola|Benin|Botswana|Burkina Faso|Burundi|Cabo Verde|Cameroon|Central African Republic'
          - batch: africa2
            targets: 'Chad|Comoros|Democratic Republic of the Congo|Republic of the Congo|Côte d’Ivoire|Djibouti|Egypt|Equatorial Guinea|Eritrea'
          - batch: africa3
            targets: 'Eswatini|Ethiopia|Gabon|Gambia|Ghana|Guinea|Guinea-Bissau|Kenya|Lesotho'
          - batch: africa4
            targets: 'Liberia|Libya|Madagascar|Malawi|Mali|Mauritania|Mauritius|Morocco|Mozambique'
          - batch: africa5
            targets: 'Namibia|Niger|Nigeria|Rwanda|São Tomé and Príncipe|Senegal|Seychelles|Sierra Leone|Somalia'
          - batch: africa6
            targets: 'South Africa|South Sudan|Sudan|Tanzania|Togo|Tunisia|Uganda|Zambia|Zimbabwe'
          - batch: india-australia
            targets: 'India|Australia'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run live Property lifecycle audit
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          TARGETS: ${{ matrix.targets }}
          BATCH: ${{ matrix.batch }}
          OUTDIR: out-16844-property-${{ matrix.batch }}
        run: node lab/earthline-16844-global-property-audit.mjs
      - name: Upload Property audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthline-16844-property-${{ matrix.batch }}
          path: out-16844-property-${{ matrix.batch }}/
          retention-days: 3
