name: Mantra 51 Inspect Alaska Camera Lock
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-inspect-alaska-camera-lock.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: mantra51-global-repair-campaign}
      - name: Inspect search camera lock lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for needle in ["earthlineSearchCameraLock=","earthlineSearchCameraLock =","earthlineSearchCameraToken","earthlineApplySearchCameraLock(","earthlineCancelSearchCameraLock","expires:"]:
            print("\n===== "+needle+" =====")
            pos=0; count=0
            while count<35:
              i=s.find(needle,pos)
              if i<0: break
              print(s[max(0,i-2200):min(len(s),i+6200)].replace("\n"," "))
              print("\n---")
              pos=i+len(needle);count+=1
          PY
