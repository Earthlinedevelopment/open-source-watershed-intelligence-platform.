name: Earthline M76 Fix Ambiguous Contour Tracing Live
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-fix-contour-ambiguity-live.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Repair ambiguous marching-contour exits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          marker="function traceLevelContour(sx,sy,L,maxS,dropH){"
          helper="""/* EARTHLINE M76F — deterministic contour continuity through ambiguous DEM cells.
   A valid contour may expose multiple exits in saddle/noisy cells. Never choose
   the first array entry arbitrarily; continue along the smoothest local tangent. */
function earthlinePickContourExitM76(candidates,pts){
  if(!Array.isArray(candidates)||!candidates.length)return null;
  if(candidates.length===1||!Array.isArray(pts)||pts.length<2)return candidates[0];
  const entry=pts[pts.length-1],prior=pts[pts.length-2];
  const ix=entry[0]-prior[0],iy=entry[1]-prior[1],im=Math.hypot(ix,iy);
  if(!(im>1e-9))return candidates[0];
  let best=candidates[0],bestScore=-Infinity;
  for(const e of candidates){
    const ox=Number(e[1])-entry[0],oy=Number(e[2])-entry[1],om=Math.hypot(ox,oy);
    if(!(om>1e-9))continue;
    const score=(ix*ox+iy*oy)/(im*om);
    if(score>bestScore){bestScore=score;best=e;}
  }
  return best;
}

"""
          if 'function earthlinePickContourExitM76(' not in s:
              if s.count(marker)!=1:
                  raise SystemExit(f'trace marker count {s.count(marker)}')
              s=s.replace(marker,helper+marker,1)

          old="const pick=(step===0)?candidates[firstPick%candidates.length]:candidates[0];"
          new="const pick=(step===0)?candidates[firstPick%candidates.length]:earthlinePickContourExitM76(candidates,pts);"
          if s.count(old)!=1:
              raise SystemExit(f'arbitrary contour-exit owner count {s.count(old)}')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate geometry owner
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'function earthlinePickContourExitM76' index.html
          grep -q 'earthlinePickContourExitM76(candidates,pts)' index.html
          ! grep -Fq 'const pick=(step===0)?candidates[firstPick%candidates.length]:candidates[0];' index.html
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let n=0;for(const m of s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)){if(!m[1].trim())continue;new Function(m[1]);n++}
          function pick(candidates,pts){
            if(!candidates.length)return null;if(candidates.length===1||pts.length<2)return candidates[0];
            const entry=pts.at(-1),prior=pts.at(-2),ix=entry[0]-prior[0],iy=entry[1]-prior[1],im=Math.hypot(ix,iy);
            let best=candidates[0],bestScore=-Infinity;
            for(const e of candidates){const ox=e[1]-entry[0],oy=e[2]-entry[1],om=Math.hypot(ox,oy);if(!(om>1e-9))continue;const q=(ix*ox+iy*oy)/(im*om);if(q>bestScore){bestScore=q;best=e}}
            return best;
          }
          const vertical=pick([[1,1,0.5],[2,0.5,1],[3,0,0.5]],[[0.5,-1],[0.5,0]]);
          if(vertical[0]!==2)throw Error('ambiguous contour continuity test failed');
          const horizontal=pick([[0,0.5,0],[1,1,0.5],[2,0.5,1]], [[-1,0.5],[0,0.5]]);
          if(horizontal[0]!==1)throw Error('horizontal continuity test failed');
          console.log('M76F_CONTOUR_CONTINUITY_OK',n);
          NODE
      - name: Publish live
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: trace ambiguous contour cells by continuity"
          git push origin HEAD:pages-live
