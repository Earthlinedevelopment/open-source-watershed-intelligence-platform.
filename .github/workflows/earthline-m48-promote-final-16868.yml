name: Earthline M48 one-shot live repair 16869
permissions:
  contents: write
on:
  push:
    branches:
      - pages-live
    paths:
      - .github/workflows/earthline-m48-promote-final-16868.yml
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Patch and validate exact four repairs
        run: python3 tools/mantra48_repair_16869.py
      - name: Commit product repair and remove one-shot tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/mantra48_repair_16869.py .github/workflows/earthline-m48-promote-final-16868.yml
          git add index.html
          git commit -m 'repair: 16869 exact four live failures'
          git fetch origin pages-live
          git rebase origin/pages-live
          git push origin HEAD:pages-live
