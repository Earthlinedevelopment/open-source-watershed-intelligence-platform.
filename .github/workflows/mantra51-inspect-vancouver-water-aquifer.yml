name: Mantra 51 Inspect Vancouver Water Aquifer Hooks
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths: ['.github/workflows/mantra51-inspect-vancouver-water-aquifer.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: mantra51-global-repair-campaign}
      - name: Inspect exact hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needles=[
            "vancouverIsland",
            "EARTHLINE_VANCOUVER",
            "earthlineResolveVancouver",
            "usgsAquifers",
            "aquifer",
            "groundwater",
            "earthlineClipRegionalProducts16539",
            "setGeo(m,IDS.flows",
            "IDS.aquifer"
          ]
          for needle in needles:
            print("\n===== "+needle+" =====")
            pos=0; count=0
            while count<25:
              i=s.lower().find(needle.lower(),pos)
              if i<0: break
              print(s[max(0,i-2600):min(len(s),i+7000)].replace("\n"," "))
              print("\n---")
              pos=i+len(needle); count+=1
          PY
