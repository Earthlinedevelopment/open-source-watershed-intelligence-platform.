name: Earthline Candidate Restore Four Percent Slope Science
on:
  push:
    branches: [candidate-next]
    paths:
      - 'tools/restore-property-slope-science.py'
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 0
      - name: Restore canonical Property slope science
        run: python3 tools/restore-property-slope-science.py
      - name: Verify isolated science difference
        run: |
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "index.html "
          git diff -- index.html | grep -F "maxS=4"
          git diff -- index.html | grep -F "slopePct(x,y)<=4"
      - name: Commit candidate science correction
        run: |
          git config user.name 'earthline-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'science: restore Property slope ceiling to four percent'
          git push origin HEAD:candidate-next
