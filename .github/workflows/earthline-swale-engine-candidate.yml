# Tests the CANDIDATE clean swale engine in this branch: unit tests, provenance check, then real browsers against the public site's data services.
# Does not publish anything and does not touch pages-live. Results go to the branch "swale-candidate-results".
name: Earthline swale engine candidate test
on:
  push:
    branches: [candidate/swale-engine]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unit:
    name: engine, decoder and wiring tests + provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build candidate index.html in place if the branch still holds the b71c5b2 original (so the 5 MB file never has to be uploaded)
        run: |
          [ -f tests/fixtures/tile.pbf ] && [ -f tests/fixtures/tile-empty-layer.pbf ] || python3 tests/make-mvt-fixture.py
          have=$(sha256sum index.html | cut -d' ' -f1)
          if [ "$have" = "4bad128f0e1342c222cc2d25e05e0527d086280f4ca8cd24b0597ae0f37e4322" ]; then
            python3 tools/apply-swale-engine-candidate.py index.html /tmp/candidate-index.html
            cp /tmp/candidate-index.html index.html
          fi
          got=$(sha256sum index.html | cut -d' ' -f1)
          echo "index.html sha256: $got"
          [ "$got" = "eb0c30666dc87b71f695aeffa3304ac87624d08d7dc0ec9a0d33087abef551d4" ] || { echo "index.html is neither the b71c5b2 original nor the expected candidate"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Engine tests (R1-R13)
        run: node tests/engine-tests.js
      - name: Cross-module candidate scientific contract
        run: node tests/v14-integration-contract.mjs
      - name: Elder worker recovery and approved-popup JS contract
        run: node tests/elder-worker-recovery.mjs
      - name: Fixture tile is rebuilt by the independent encoder, then decoder and audit tests
        run: |
          python3 tests/make-mvt-fixture.py
          git diff --stat -- tests/fixtures || true
          node tests/bridge-tests.js
      - name: Page wiring harness (real engine + bridge, stubbed page)
        run: node tests/adapter-harness.js
      - name: Provenance - index.html here is exactly the live page b71c5b2 plus the five anchored insertions
        run: |
          git show b71c5b2e9f688f8a515c7f3a3af57d572ca27c45:index.html > /tmp/base.html
          sha256sum /tmp/base.html
          python3 tools/apply-swale-engine-candidate.py /tmp/base.html /tmp/rebuilt.html
          cmp /tmp/rebuilt.html index.html && echo "index.html is byte-identical to the reproduced candidate"
          sha256sum index.html earthline-property-swales.js earthline-property-swale-bridge.js
  test:
    name: browser ${{ matrix.profile }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop-chrome, desktop-firefox, desktop-safari, iphone, android]
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate index.html in place if the branch still holds the b71c5b2 original (so the 5 MB file never has to be uploaded)
        run: |
          [ -f tests/fixtures/tile.pbf ] && [ -f tests/fixtures/tile-empty-layer.pbf ] || python3 tests/make-mvt-fixture.py
          have=$(sha256sum index.html | cut -d' ' -f1)
          if [ "$have" = "4bad128f0e1342c222cc2d25e05e0527d086280f4ca8cd24b0597ae0f37e4322" ]; then
            python3 tools/apply-swale-engine-candidate.py index.html /tmp/candidate-index.html
            cp /tmp/candidate-index.html index.html
          fi
          got=$(sha256sum index.html | cut -d' ' -f1)
          echo "index.html sha256: $got"
          [ "$got" = "eb0c30666dc87b71f695aeffa3304ac87624d08d7dc0ec9a0d33087abef551d4" ] || { echo "index.html is neither the b71c5b2 original nor the expected candidate"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browsers and the independent tile decoder
        run: |
          npm install --no-save playwright @mapbox/vector-tile@1.3.1 pbf@3.2.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Test the candidate in the browser
        env:
          EARTHLINE_PROFILE: ${{ matrix.profile }}
          EARTHLINE_PINNED: '1'
          EARTHLINE_PINNED_EXTRA: earthline-property-swales.js,earthline-property-swale-bridge.js,earthline-elder-restored-17097.js,earthline-elder-worker-17129.js
          EARTHLINE_RESULTS_DIR: swale-candidate-results
          EARTHLINE_COVERAGE: ${{ matrix.profile == 'desktop-chrome' && '1' || '0' }}
        run: node tests/earthline-live-site-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swale-candidate-${{ matrix.profile }}
          path: swale-candidate-results/
          retention-days: 14
  publish:
    name: Publish results
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          path: collected
          merge-multiple: true
      - name: Evaluate scientific release gate and preserve failure report
        shell: bash
        run: |
          node tests/scientific-gate.mjs collected || echo $? > collected/GATE-EXIT.txt
          test -f collected/GATE-EXIT.txt || echo 0 > collected/GATE-EXIT.txt
      - name: Push results to the swale-candidate-results branch
        run: |
          cd collected
          git init -q -b swale-candidate-results
          git config user.name "earthline-live-test"
          git config user.email "live-test@users.noreply.github.com"
          date -u > TESTED-AT.txt
          git add -A
          git commit -q -m "Swale candidate test results ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" swale-candidate-results
      - name: Fail candidate workflow if scientific acceptance is not met
        run: |
          cat collected/GATE.md
          test "$(cat collected/GATE-EXIT.txt)" = "0"
