# Earthline release airlock: three sequential full scientific passes on one immutable candidate commit.
# Each round runs all five real browser profiles. Gate failures are archived and stop the sequence.
# NEVER deploys, merges, force-pushes or modifies pages-live.
name: Earthline three consecutive scientific release gates
on:
  push:
    branches: [candidate/swale-engine]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: earthline-three-pass-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit:
    name: deterministic engine and integrity contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild exact SHA-256 candidate and prove origin
        run: |
          python3 tests/make-mvt-fixture.py
          python3 tools/apply-swale-engine-candidate.py index.html /tmp/candidate.html
          cp /tmp/candidate.html index.html
          sha256sum -c SHA256SUMS.txt
          git show b71c5b2e9f688f8a515c7f3a3af57d572ca27c45:index.html > /tmp/frozen.html
          python3 tools/apply-swale-engine-candidate.py /tmp/frozen.html /tmp/recreated.html
          cmp /tmp/recreated.html index.html
      - name: Engine, bridge, integration, Elder recovery and wiring assertions
        run: |
          node tests/engine-tests.js
          node tests/bridge-tests.js
          node tests/adapter-harness.js
          node tests/v14-integration-contract.mjs
          node tests/elder-worker-recovery.mjs
  round1:
    name: round 1/3 — ${{ matrix.profile }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop-chrome, desktop-firefox, desktop-safari, iphone, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify one unchanged candidate page
        run: |
          python3 tools/apply-swale-engine-candidate.py index.html /tmp/candidate.html
          cp /tmp/candidate.html index.html
          sha256sum -c SHA256SUMS.txt
      - name: Install browsers and independent vector decoder
        run: |
          npm install --no-save playwright @mapbox/vector-tile@1.3.1 pbf@3.2.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Install real software WebGL for Firefox
        if: matrix.profile == 'desktop-firefox'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libosmesa6 libgl1-mesa-dri
      - name: Run the same 10 Property sites and Chrome-only coverage
        env:
          EARTHLINE_PROFILE: ${{ matrix.profile }}
          EARTHLINE_PINNED: '1'
          EARTHLINE_PINNED_EXTRA: earthline-property-swales.js,earthline-property-swale-bridge.js,earthline-elder-restored-17097.js,earthline-elder-worker-17129.js
          EARTHLINE_RESULTS_DIR: round-1-results
          EARTHLINE_COVERAGE: ${{ matrix.profile == 'desktop-chrome' && '1' || '0' }}
          EARTHLINE_HEADFUL: ${{ matrix.profile == 'desktop-firefox' && '1' || '0' }}
          EARTHLINE_SKIP_LIFECYCLE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MOZ_WEBRENDER: '1'
        run: |
          if [ "$EARTHLINE_PROFILE" = 'desktop-firefox' ]; then
            xvfb-run -a node tests/earthline-live-site-test.mjs
          else
            node tests/earthline-live-site-test.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-release-1-${{ matrix.profile }}
          path: round-1-results/
          retention-days: 30
  gate1:
    name: scientific gate 1/3 + publish reproducible evidence
    needs: [unit, round1]
    if: ${{ always() && needs.round1.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: collected
          pattern: earthline-release-1-*
          merge-multiple: true
      - name: Evaluate strict 5-browser gate, including candidate SHA and idle globe
        shell: bash
        env:
          EARTHLINE_EXPECTED_INDEX_SHA: c97a1ad5c38bff7f23d7c07b63e75a88dda8a4f2ad7c6caf3c5d75ecd14ef088
          EARTHLINE_GATE_ROUND: '1'
          TEST_MATRIX_STATUS: ${{ needs.round1.result }}
          UNIT_STATUS: ${{ needs.unit.result }}
        run: |
          mkdir -p collected
          result=0
          node tests/scientific-gate.mjs collected || result=$?
          if [ ! -f collected/GATE.md ]; then
            result=1
            printf '# EARTHLINE SCIENTIFIC GATE ENGINE ERROR\n\n**FAIL — DO NOT PROMOTE**\n\nThe gate script did not produce a report.\n' > collected/GATE.md
          fi
          if [ ! -f collected/GATE.json ]; then
            result=1
            printf '{"passed":false,"error":"gate-script-did-not-complete"}\n' > collected/GATE.json
          fi
          if [ "$TEST_MATRIX_STATUS" != 'success' ] || [ "$UNIT_STATUS" != 'success' ]; then
            result=1
            echo "Browser matrix: $TEST_MATRIX_STATUS; unit: $UNIT_STATUS" >> collected/GATE.md
          fi
          echo "$result" > collected/GATE-EXIT.txt
          printf "Run ID: %s\nCommit: %s\nIndex SHA-256: %s\nRound: 1/3\nBrowser matrix: %s\nUnit: %s\n" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$EARTHLINE_EXPECTED_INDEX_SHA" "$TEST_MATRIX_STATUS" "$UNIT_STATUS" > collected/PROVENANCE.txt
          cat collected/GATE.md
      - name: Publish all five JSON reports + GATE.md, even when gate fails (NO force push)
        if: always()
        shell: bash
        run: |
          set -eu
          git clone -q --depth=1 --branch swale-candidate-results "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" published
          git -C published config user.name "earthline-scientific-release"
          git -C published config user.email "scientific-release@users.noreply.github.com"
          target="published/runs/$GITHUB_RUN_ID/round-1"
          mkdir -p "$target"
          cp collected/GATE.md collected/GATE.json collected/GATE-EXIT.txt collected/PROVENANCE.txt "$target/"
          for profile in desktop-chrome desktop-firefox desktop-safari iphone android; do
            mkdir -p "$target/$profile"
            if [ -f "collected/$profile/results.json" ]; then
              cp "collected/$profile/results.json" "$target/$profile/results.json"
            fi
            if [ -f "collected/$profile/startup-globe-before-search.png" ]; then
              cp "collected/$profile/startup-globe-before-search.png" "$target/$profile/startup-globe-before-search.png"
            fi
          done
          cp collected/GATE.md published/GATE.md
          cp collected/GATE.json published/GATE.json
          cp collected/PROVENANCE.txt published/LATEST-RUN.txt
          git -C published add GATE.md GATE.json LATEST-RUN.txt "runs/$GITHUB_RUN_ID"
          git -C published commit -q -m "Scientific gate round 1/3 for run $GITHUB_RUN_ID at $GITHUB_SHA"
          for attempt in 1 2 3; do
            if git -C published push origin HEAD:swale-candidate-results; then exit 0; fi
            git -C published fetch origin swale-candidate-results
            git -C published rebase origin/swale-candidate-results
          done
          exit 1
      - name: FAIL CLOSED unless this round passed
        run: |
          cat collected/PROVENANCE.txt
          test "$(cat collected/GATE-EXIT.txt)" = "0"
