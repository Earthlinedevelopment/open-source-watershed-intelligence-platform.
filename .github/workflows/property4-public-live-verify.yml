name: Verify deployed Property 4pct on actual public origin
on:
  push:
    branches: [repair/property4-gentle-contour-split-20261113]
    paths: [tests/property4-public-live-verify.mjs, .github/workflows/property4-public-live-verify.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node tests/property4-public-live-verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-verified-public-property
          path: artifacts/property4-public
          retention-days: 14
