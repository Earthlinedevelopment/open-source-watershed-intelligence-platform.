name: Earthline Texas Live Final Gate
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/texas-live-final-gate.mjs'
      - '.github/workflows/earthline-texas-live-final-gate.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node tests/texas-live-final-gate.mjs
