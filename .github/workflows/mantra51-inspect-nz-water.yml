name: Mantra 51 Inspect NZ Water Publication
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-inspect-nz-water.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Inspect Regional water publication owners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needles=[
            "water paths","waterPath","flowGeoJSON","regional water","EARTHLINE_REGIONAL",
            "hydrography","flow paths","streamThreshold","directD8","waterLayer",
            "setData(flow","line-color"
          ]
          for needle in needles:
            print("\n===== "+needle+" =====")
            pos=0; count=0
            while count<35:
              i=s.lower().find(needle.lower(),pos)
              if i<0: break
              print(s[max(0,i-1800):min(len(s),i+4200)].replace("\n"," "))
              print("\n---")
              pos=i+len(needle);count+=1
          PY
