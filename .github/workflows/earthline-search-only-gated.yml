name: Earthline live search-only repair with baseline-failing browser gate
on:
  push:
    branches: [pages-live]
    paths:
      - .github/workflows/earthline-search-only-gated.yml
permissions:
  contents: write
concurrency:
  group: earthline-search-only-live
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construct exact minimal patch and verify original and target blobs
        run: |
          python3 - <<'PY'
          import hashlib,pathlib
          path=pathlib.Path('index.html')
          raw=path.read_bytes()
          def sha(d):return hashlib.sha1(b'blob '+str(len(d)).encode()+b'\0'+d).hexdigest()
          assert sha(raw)=='ff740575e83efbce991566369925a3ef77232f3f', 'Unexpected production HTML; stop'
          pathlib.Path('/tmp/earthline-baseline.html').write_bytes(raw)
          s=raw.decode('utf-8')
          edits=[
          ("    function render(showAll){",
           "    function render(showAll){\n      /* Search dropdown fix: after a committed selection, stay closed until the user types again. */\n      if(document.documentElement.dataset.earthlineSuggestionsSuppressed==='1'){menu.classList.remove('open');return;}"),
          ("    input.addEventListener('input',()=>render(false));",
           "    input.addEventListener('input',e=>{if(e.isTrusted)delete document.documentElement.dataset.earthlineSuggestionsSuppressed;},true);input.addEventListener('input',()=>render(false));"),
          ("document.documentElement.dataset.earthlineSuggestionCommit16246='1';",
           "document.documentElement.dataset.earthlineSuggestionCommit16246='1';document.documentElement.dataset.earthlineSuggestionsSuppressed='1';"),
          ("input.value='';const st=state();if(st)st.appliedSearchText='';input.dispatchEvent(new Event('input',{bubbles:true}));input.focus();render(true);",
           "delete document.documentElement.dataset.earthlineSuggestionsSuppressed;input.value='';const st=state();if(st)st.appliedSearchText='';input.dispatchEvent(new Event('input',{bubbles:true}));input.focus();render(true);"),
          ("function openSuggestions16233(){if(!searchEngaged16233)return;",
           "function openSuggestions16233(){if(!searchEngaged16233)return;if(document.documentElement.dataset.earthlineSuggestionsSuppressed==='1'){closeSuggestions16233();return;}")
          ]
          for old,new in edits:
              assert s.count(old)==1, ('Changed source; no deployment',old)
              s=s.replace(old,new,1)
          new=s.encode()
          assert len(new)==3763918, (len(new),'Unexpected fix size')
          assert sha(new)=='b33f4a487e0ad5ea3c23f017c96200d4a0f4496c', 'Wrong candidate: no deploy'
          path.write_bytes(new)
          print('Verified exact search-only package A; no other files changed')
          PY
      - name: Browser test prerequisite
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check baseline fails and corrected version passes in browser
        run: |
          mkdir -p search-test
          cat >search-test/run.mjs <<'JS'
          import {chromium} from 'playwright';
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
          const result={};
          for(const stage of ['baseline','fixed']){
            const html=await readFile(stage==='baseline'?'/tmp/earthline-baseline.html':'index.html');
            const context=await browser.newContext({viewport:{width:1600,height:950},serviceWorkers:'block'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.route('**/*',route=>{
              const req=route.request();
              if(req.isNavigationRequest()&&req.resourceType()==='document')
                return route.fulfill({status:200,contentType:'text/html; charset=utf-8',body:html});
              return route.continue();
            });
            const t={sha256:createHash('sha256').update(html).digest('hex'),errors};
            try{
              await page.goto('https://earthlinedevelopment.org/?search-only-test='+stage,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForSelector('#earthlineSearchSuggestions15970',{timeout:45000});
              await page.locator('#searchInput').fill('iow');
              const menu=page.locator('#earthlineSearchSuggestions15970');
              await page.waitForFunction(()=>document.querySelector('#earthlineSearchSuggestions15970')?.classList.contains('open'),null,{timeout:15000});
              t.options=await menu.locator('button[data-query]').count();
              if(!t.options)throw Error('No search options after typing');
              await menu.locator('button[data-query]').first.click();
              await page.waitForTimeout(2000);
              await page.locator('#searchInput').click();
              await page.waitForTimeout(250);
              t.afterRefocusOpen=await menu.evaluate(el=>el.classList.contains('open'));
              t.suppressed=await page.evaluate(()=>document.documentElement.dataset.earthlineSuggestionsSuppressed==='1');
              await page.locator('#searchInput').press('End');
              await page.keyboard.type('a');
              await page.waitForFunction(()=>document.querySelector('#earthlineSearchSuggestions15970')?.classList.contains('open'),null,{timeout:10000}).catch(()=>{});
              t.afterTypeOpen=await menu.evaluate(el=>el.classList.contains('open'));
              await page.screenshot({path:'search-test/'+stage+'.png',timeout:20000});
            }catch(e){t.failure=String(e)}
            result[stage]=t;
            await context.close();
          }
          await browser.close();
          await writeFile('search-test/results.json',JSON.stringify(result,null,2));
          console.log('SEARCH_GATED_RESULT '+JSON.stringify(result));
          if(result.baseline.failure||result.fixed.failure||
              result.baseline.afterRefocusOpen!==true||
              result.fixed.afterRefocusOpen!==false||
              result.fixed.afterTypeOpen!==true||
              !result.fixed.suppressed)
            throw Error('Search regression gate failed; production preserved');
          JS
          node search-test/run.mjs
      - name: Publish only exact verified search-only HTML
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "b33f4a487e0ad5ea3c23f017c96200d4a0f4496c"
          test "$(git hash-object earthline-elder-restored-17097.js)" = "808890f0c86d501939e8cfdf00148287c7dd3ebc"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(live): search dropdown remains shut after selection'
          git push origin HEAD:pages-live
      - name: Store browser evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-only-browser-evidence
          path: search-test/
          retention-days: 30
          if-no-files-found: warn
