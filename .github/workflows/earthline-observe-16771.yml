name: Earthline 16771 Gate Observer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-observe-16771.yml']
permissions:
  actions: read
  contents: write
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Observe parallel gate
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          target='Earthline 16771 Parallel State Gate and Publish'
          run_id=''
          for i in $(seq 1 30); do
            run_id="$(gh run list --workflow "$target" --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)"
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo '{"error":"target workflow run not found"}' > lab/earthline-16771-gate-status.json
          else
            for i in $(seq 1 72); do
              status="$(gh run view "$run_id" --json status --jq '.status')"
              [ "$status" = "completed" ] && break
              sleep 10
            done
            gh run view "$run_id" --json databaseId,name,status,conclusion,headSha,createdAt,updatedAt,url,jobs > lab/earthline-16771-gate-status.json
          fi
      - name: Persist observer result
        shell: bash
        run: |
          git config user.name "Earthline Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add lab/earthline-16771-gate-status.json
          git commit -m "diag: persist 16771 gate status [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
