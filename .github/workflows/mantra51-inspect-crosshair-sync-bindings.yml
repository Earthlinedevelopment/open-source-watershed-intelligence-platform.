name: Mantra 51 Inspect Crosshair Sync Bindings
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-inspect-crosshair-sync-bindings.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needle="syncPropertyTargetFromMap16201"
          p=0;n=0
          while n<30:
            i=s.find(needle,p)
            if i<0:break
            print("\n=== occurrence",n+1,"===")
            print(s[max(0,i-3500):min(len(s),i+5000)].replace("\n"," "))
            p=i+len(needle);n+=1
          for needle in ["panelMap16188","moveend","dragend"]:
            print("\n###",needle)
            p=0;n=0
            while n<25:
              i=s.find(needle,p)
              if i<0:break
              print(s[max(0,i-1200):min(len(s),i+2400)].replace("\n"," "))
              print("---");p=i+len(needle);n+=1
          PY
