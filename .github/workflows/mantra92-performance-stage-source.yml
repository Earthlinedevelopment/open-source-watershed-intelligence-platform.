name: M92 measured phase owner lookup
on:
  push:
    branches: [audit/mantra92-regional-fallback-isolation]
    paths: [.github/workflows/mantra92-performance-stage-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract specific phase assignments and data acquisition stage
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/candidate/mantra92-arizona-visual-repair:refs/remotes/origin/candidate/mantra92-arizona-visual-repair
          git show refs/remotes/origin/candidate/mantra92-arizona-visual-repair:index.html >/tmp/m92.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/m92.html').read_text()
          for term in ['phase16198','regionalStarted16198','await acquireDEM','await makeSwales','await acquire','createRegionalTerrain','const hy=']:
            starts=[m.start() for m in re.finditer(re.escape(term),s)]
            print('M92_PHASE_TERM',term,len(starts),flush=True)
            for i in starts[-25:]:
              print('M92_PHASE_CONTEXT',term,repr(s[max(0,i-240):i+480]),flush=True)
          PY
