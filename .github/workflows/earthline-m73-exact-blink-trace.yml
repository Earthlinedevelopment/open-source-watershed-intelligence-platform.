name: Earthline M73 Essex Junction Exact Corridor Trace
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-m73-exact-blink-trace.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Trace genuine corridor to first Property
        shell: bash
        run: |
          cat > m73-essex.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { PNG } from 'pngjs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:1000}});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror:'+String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
          await page.goto('https://earthlinedevelopment.org/?m73essex='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
          await page.waitForSelector('#searchInput',{timeout:30000});
          await page.waitForFunction(()=>window.earthlineMap||(typeof earthlineMap!=='undefined'&&earthlineMap),null,{timeout:30000,polling:100});
          const input=page.locator('#searchInput');
          await input.fill('Essex Junction, Vermont');
          await page.waitForTimeout(1000);
          const opts=page.locator('#earthlineSearchSuggestions15970 [role="option"]:visible');
          if(await opts.count()) await opts.first().click({force:true});
          await page.keyboard.press('Escape').catch(()=>{});
          await page.locator('#runBtn').click({force:true});
          await page.waitForFunction(()=>{
            const d=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null;
            return String(d&&(d.tier||d.mode)||'').toLowerCase()==='regional' &&
              document.getElementById('runBtn')?.getAttribute('aria-busy')!=='true';
          },null,{timeout:90000,polling:150});
          await page.waitForFunction(()=>
            document.querySelectorAll('.earthline-swale-label-16149,.earthline-swale-hit-16070').length>0,
            null,{timeout:20000,polling:100});
          const regional=await page.evaluate(()=>{
            const m=window.earthlineMap||earthlineMap;
            const d=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null;
            return {
              center:m?.getCenter?.()?{lng:m.getCenter().lng,lat:m.getCenter().lat}:null,
              zoom:m?.getZoom?.()||null,
              query:d?.query||null,
              labels:document.querySelectorAll('.earthline-swale-label-16149').length,
              hits:document.querySelectorAll('.earthline-swale-hit-16070').length,
              corridorAudit:window.earthlineCorridorInteractionAudit16152?.()||null
            };
          });
          console.log('EARTHLINE_M73_ESSEX_REGIONAL '+JSON.stringify(regional));
          let corridor=page.locator('.earthline-swale-label-16149:visible').first();
          if(!(await corridor.count())) corridor=page.locator('.earthline-swale-hit-16070:visible').first();
          if(!(await corridor.count())) throw new Error('No genuine visible Earthline corridor target');
          const corridorInfo=await corridor.evaluate(el=>({
            cls:el.getAttribute('class')||'',
            index:el.dataset?.swaleIndex||el.getAttribute('data-swale-index')||null,
            text:el.textContent||'',
            html:(el.outerHTML||'').slice(0,500)
          }));
          await corridor.click({force:true});
          await page.waitForFunction(()=>!!document.getElementById('earthlineCorridorDetail16149')?.classList?.contains('open'),null,{timeout:10000,polling:100});
          const zoom=page.getByRole('button',{name:/zoom to (this )?location/i}).first();
          if(!(await zoom.count())) throw new Error('Corridor detail has no Zoom to location');
          await zoom.click({force:true});
          await page.waitForFunction(()=>{
            const b=document.getElementById('earthlineDeclareProperty16169');
            return !!b&&!b.disabled;
          },null,{timeout:20000,polling:100});
          const target=await page.evaluate(()=>({
            propertyTarget:window.EARTHLINE_PROPERTY_TARGET_16201||null,
            chosen:window.EARTHLINE_CHOSEN_LOCATION_16189||null,
            center:(()=>{const m=window.earthlineMap||earthlineMap,c=m?.getCenter?.();return c?{lng:c.lng,lat:c.lat}:null})()
          }));
          console.log('EARTHLINE_M73_ESSEX_TARGET '+JSON.stringify({corridorInfo,target}));

          await page.evaluate(()=>{
            window.__M73E={samples:[],events:[],started:performance.now()};
            const snap=(label)=>{
              const m=typeof M!=='undefined'?M:null;
              const d=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null;
              const pub=m&&m.propertyPublication15816||null;
              const svg=document.getElementById('earthlinePropertyWaterOverlay15824');
              const cs=svg?getComputedStyle(svg):null;
              const row={t:+(performance.now()-window.__M73E.started).toFixed(1),label,
                searchGen:Number(m&&m.searchGen||0),pubGen:pub?Number(pub.searchGen):null,
                committed:!!(pub&&pub.committed===true),safety:!!(pub&&pub.safetyVerified===true),
                displayedTier:String(d&&(d.tier||d.mode)||'').toLowerCase(),
                analysisTier:String(document.documentElement.dataset.earthlineAnalysisTier||''),
                display:svg?String(cs?.display||''):'',visibility:svg?String(cs?.visibility||''):'',
                opacity:svg?String(cs?.opacity||''):'',children:svg?svg.childElementCount:0,
                connected:!!(svg&&svg.isConnected),renderer:m&&m.directWaterRenderer15824?JSON.parse(JSON.stringify(m.directWaterRenderer15824)):null};
              window.__M73E.samples.push(row);if(window.__M73E.samples.length>900)window.__M73E.samples.shift();return row;
            };
            window.__M73E.snap=snap;
            const ev=(type,extra={})=>{window.__M73E.events.push({type,...extra,snap:snap(type),stack:String(new Error().stack||'')});if(window.__M73E.events.length>400)window.__M73E.events.shift();};
            const rp=Element.prototype.replaceChildren;
            Element.prototype.replaceChildren=function(...args){const hit=this&&this.id==='earthlinePropertyWaterOverlay15824';if(hit)ev('replace-before',{args:args.length});const out=rp.apply(this,args);if(hit)ev('replace-after',{args:args.length});return out;};
            const mo=new MutationObserver(ms=>{for(const mu of ms){const svg=document.getElementById('earthlinePropertyWaterOverlay15824');if(mu.target===svg)window.__M73E.events.push({type:'mutation:'+mu.type,attr:mu.attributeName||null,snap:snap('mutation')});}});
            mo.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['style','class']});
          });

          await page.locator('#earthlineDeclareProperty16169').click({force:true});
          let firstVisibleAt=null,firstOffAt=null;
          for(let i=0;i<700;i++){
            const row=await page.evaluate(()=>window.__M73E.snap('poll'));
            const visible=row.connected&&row.display!=='none'&&row.visibility!=='hidden'&&row.opacity!=='0'&&row.children>0;
            if(firstVisibleAt===null&&visible)firstVisibleAt=row.t;
            if(firstVisibleAt!==null&&firstOffAt===null&&!visible&&row.t>firstVisibleAt+120){firstOffAt=row.t;break;}
            if(firstVisibleAt!==null&&row.t>firstVisibleAt+60000)break;
            await page.waitForTimeout(100);
          }
          const result=await page.evaluate(({firstVisibleAt,firstOffAt,errors})=>({
            firstVisibleAt,firstOffAt,final:window.__M73E.snap('final'),
            events:(window.__M73E.events||[]).slice(-250),
            samples:(window.__M73E.samples||[]).slice(-300),
            propertyAudit:window.EARTHLINE_PROPERTY_RUN_AUDIT_16173||null,
            publicationAudit:window.EARTHLINE_PROPERTY_PUBLICATION_AUDIT_16220||null,
            settleAudit:window.EARTHLINE_PROPERTY_PRESENTATION_SETTLE_AUDIT_16521||null,
            errors
          }),{firstVisibleAt,firstOffAt,errors});
          console.log('EARTHLINE_M73_ESSEX_EXACT '+JSON.stringify(result));
          await browser.close();
          if(firstVisibleAt===null)process.exitCode=2;
          else if(firstOffAt!==null)process.exitCode=3;
          EOF
          node ./m73-essex.mjs
