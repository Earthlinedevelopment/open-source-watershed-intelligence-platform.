name: Earthline M73 Visual Water Stack Trace
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-m73-exact-blink-trace.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Trace effective visual stack for first Property water
        shell: bash
        run: |
          cat > m73-visual.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { PNG } from 'pngjs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:1000}});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror:'+String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
          await page.goto('https://earthlinedevelopment.org/?m73visual='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
          await page.waitForSelector('#searchInput',{timeout:30000});
          await page.waitForFunction(()=>window.earthlineMap||(typeof earthlineMap!=='undefined'&&earthlineMap),null,{timeout:30000,polling:100});
          const input=page.locator('#searchInput');
          await input.fill('Essex, Vermont');
          await page.waitForTimeout(900);
          const opts=page.locator('#earthlineSearchSuggestions15970 [role="option"]:visible');
          if(await opts.count()) await opts.first().click({force:true});
          await page.keyboard.press('Escape').catch(()=>{});
          await page.locator('#runBtn').click({force:true});
          await page.waitForFunction(()=>{
            const d=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null;
            return String(d&&(d.tier||d.mode)||'').toLowerCase()==='regional' &&
              document.getElementById('runBtn')?.getAttribute('aria-busy')!=='true';
          },null,{timeout:90000,polling:150});
          let clicked=false;
          for(const sel of [
            '#earthlineRegionalVectorOverlay16020 .earthline-swale-hit-16070:visible',
            '#earthlineRegionalVectorOverlay16020 [data-corridor]:visible',
            '#earthlineRegionalVectorOverlay16020 [data-index]:visible',
            '#earthlineRegionalVectorOverlay16020 path:visible',
            '#earthlineRegionalVectorOverlay16020 polyline:visible'
          ]){
            const loc=page.locator(sel);
            for(let i=0;i<await loc.count();i++){
              const box=await loc.nth(i).boundingBox().catch(()=>null);
              if(!box||box.width<1||box.height<1)continue;
              await loc.nth(i).click({force:true}).catch(()=>{});
              await page.waitForTimeout(200);
              if(await page.getByRole('button',{name:/zoom to (this )?location/i}).count()){
                clicked=true; console.log('EARTHLINE_M73_VISUAL_CORRIDOR '+sel+' index='+i); break;
              }
            }
            if(clicked)break;
          }
          if(!clicked)throw new Error('No clickable Regional corridor found');
          await page.getByRole('button',{name:/zoom to (this )?location/i}).first().click({force:true});
          await page.waitForFunction(()=>{
            const b=document.getElementById('earthlineDeclareProperty16169');
            return !!b&&!b.disabled;
          },null,{timeout:20000,polling:100});
          await page.locator('#earthlineDeclareProperty16169').click({force:true});
          await page.waitForFunction(()=>{
            const svg=document.getElementById('earthlinePropertyWaterOverlay15824');
            const r=(typeof M!=='undefined'&&M.directWaterRenderer15824)||null;
            return !!(svg&&svg.isConnected&&svg.childElementCount>0&&getComputedStyle(svg).display!=='none'&&r&&r.visible===true&&Number(r.visiblePaths)>0);
          },null,{timeout:60000,polling:100});
          const layout=()=>page.evaluate(()=>{
            const svg=document.getElementById('earthlinePropertyWaterOverlay15824');
            const rec=(el)=>{
              const cs=getComputedStyle(el),r=el.getBoundingClientRect();
              return {tag:el.tagName,id:el.id||'',cls:el.getAttribute?.('class')||'',display:cs.display,visibility:cs.visibility,opacity:cs.opacity,zIndex:cs.zIndex,position:cs.position,overflow:cs.overflow,transform:cs.transform,pointerEvents:cs.pointerEvents,background:cs.backgroundColor,rect:{x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1)}};
            };
            const ancestors=[]; for(let el=svg;el&&ancestors.length<10;el=el.parentElement)ancestors.push(rec(el));
            const siblings=svg&&svg.parentElement?[...svg.parentElement.children].map((el,i)=>({i,...rec(el)})):[];
            const paths=svg?[...svg.querySelectorAll('path')].slice(0,80).map((p,i)=>{
              try{
                const len=p.getTotalLength(); if(!(len>0))return null;
                const pt=p.getPointAtLength(len*0.5),ctm=p.getScreenCTM(); if(!ctm)return null;
                const q=new DOMPoint(pt.x,pt.y).matrixTransform(ctm),cs=getComputedStyle(p);
                return {i,x:+q.x.toFixed(1),y:+q.y.toFixed(1),stroke:cs.stroke,strokeWidth:cs.strokeWidth,opacity:cs.opacity};
              }catch(_){return null}
            }).filter(Boolean):[];
            const m=typeof M!=='undefined'?M:null;
            return {ancestors,siblings,paths,renderer:m&&m.directWaterRenderer15824||null,searchGen:m&&m.searchGen||null,pub:m&&m.propertyPublication15816||null};
          });
          const initial=await layout();
          const parseRgb=(s)=>{const m=String(s||'').match(/rgba?\((\d+(?:\.\d+)?)[, ]+(\d+(?:\.\d+)?)[, ]+(\d+(?:\.\d+)?)/);return m?[+m[1],+m[2],+m[3]]:null;};
          const samples=initial.paths.map(p=>({...p,rgb:parseRgb(p.stroke)})).filter(p=>p.rgb&&p.x>=0&&p.y>=0&&p.x<1600&&p.y<1000).slice(0,40);
          const visual=[];
          for(let k=0;k<24;k++){
            const png=PNG.sync.read(await page.screenshot({type:'png'}));
            let hits=0,valid=0; const details=[];
            for(const p of samples){
              const x=Math.round(p.x),y=Math.round(p.y); let best=999;
              for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
                const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=png.width||yy>=png.height)continue;
                const idx=(yy*png.width+xx)*4,d=Math.hypot(png.data[idx]-p.rgb[0],png.data[idx+1]-p.rgb[1],png.data[idx+2]-p.rgb[2]);if(d<best)best=d;
              }
              valid++;if(best<85)hits++;if(details.length<8)details.push({x,y,stroke:p.stroke,best:+best.toFixed(1)});
            }
            const state=await page.evaluate(()=>{
              const svg=document.getElementById('earthlinePropertyWaterOverlay15824'),cs=svg?getComputedStyle(svg):null,r=svg?svg.getBoundingClientRect():null,m=typeof M!=='undefined'?M:null;
              return {display:svg&&cs?cs.display:null,visibility:svg&&cs?cs.visibility:null,opacity:svg&&cs?cs.opacity:null,children:svg?svg.childElementCount:0,rect:r?{w:+r.width.toFixed(1),h:+r.height.toFixed(1)}:null,renderer:m&&m.directWaterRenderer15824||null};
            });
            visual.push({k,hits,valid,ratio:valid?+(hits/valid).toFixed(3):null,state,details});
            await page.waitForTimeout(700);
          }
          const final=await layout();
          console.log('EARTHLINE_M73_VISUAL '+JSON.stringify({initial:{ancestors:initial.ancestors,siblings:initial.siblings,renderer:initial.renderer,searchGen:initial.searchGen,pub:initial.pub},sampleCount:samples.length,visual,final:{ancestors:final.ancestors,siblings:final.siblings,renderer:final.renderer,searchGen:final.searchGen,pub:final.pub},errors}));
          await browser.close();
          EOF
          node ./m73-visual.mjs
