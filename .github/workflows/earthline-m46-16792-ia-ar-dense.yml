name: Mantra 46 16792 Iowa Arkansas Dense A-B

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/mantra46-16792-ia-ar-dense-ab.mjs'
      - '.github/workflows/earthline-m46-16792-ia-ar-dense.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dense-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Iowa Arkansas dense A-B
        run: node tests/mantra46-16792-ia-ar-dense-ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16792-ia-ar-dense
          path: artifacts/mantra46-16792-ia-ar-dense/
          if-no-files-found: error
