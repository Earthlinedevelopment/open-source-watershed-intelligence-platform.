name: Mantra 46 16809 Targeted Regression
on:
  push:
    branches: [diagnostic-m46-16795-fine-coverage]
    paths:
      - '.github/workflows/mantra46-16809-targeted-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build 12-state 16809 variant regression
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('tests/mantra46-16809-opportunity-gap-swap-ab.mjs')
          s=src.read_text()
          old="const STATES=['Arkansas','Maryland','Texas','Florida','Colorado'];"
          new="const STATES=['Iowa','Arkansas','Oklahoma','Nebraska','Vermont','Texas','Florida','Louisiana','California','New York','Maryland','Colorado'];"
          assert s.count(old)==1
          s=s.replace(old,new,1)
          s=s.replace("const OUT='artifacts/mantra46-16809-opportunity-gap-swap-ab';","const OUT='artifacts/mantra46-16809-targeted-regression';",1)
          oldloop="for(const q of STATES){await runOne(q,false);await runOne(q,true)}"
          newloop="for(const q of STATES){await runOne(q,true)}"
          assert s.count(oldloop)==1
          s=s.replace(oldloop,newloop,1)
          Path('tests/mantra46-16809-targeted-generated.mjs').write_text(s)
          PY
      - name: Run 16809 targeted regression
        run: node tests/mantra46-16809-targeted-generated.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16809-targeted-regression
          path: artifacts/mantra46-16809-targeted-regression/
          if-no-files-found: error
