name: Earthline 16605 Exact Rollback

on:
  push:
    branches: [pages-live]
    paths:
      - 'tools/revert-16605-country-extent.mjs'
      - '.github/workflows/earthline-16605-country-extent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Revert exact 16605 product edits
        run: node tools/revert-16605-country-extent.mjs
      - name: Verify 16603 preserved and 16605 removed
        run: |
          set -euo pipefail
          grep -F "if(w<1.8){const d=(1.8-w)/2;b[0]-=d;b[2]+=d;}" index.html >/dev/null
          grep -F "if(h<1.8){const d=(1.8-h)/2;b[1]-=d;b[3]+=d;}" index.html >/dev/null
          grep -F "if(w>18){const c=(b[0]+b[2])/2;b[0]=c-9;b[2]=c+9;}if(h>14){const c=(b[1]+b[3])/2;b[1]=c-7;b[3]=c+7;}" index.html >/dev/null
          grep -F 'lineSafe16584(retrySmooth16584)' index.html >/dev/null
          grep -F 'regional land-validity flow audit failed: ' index.html >/dev/null
          if grep -F 'EARTHLINE 16605' index.html >/dev/null; then exit 1; fi
          CHANGED=$(git diff --name-only)
          test "$CHANGED" = "index.html"
      - name: Commit rollback
        run: |
          git config user.name 'Earthlinedevelopment'
          git config user.email 'info@earthlinedevelopment.org'
          git add index.html
          git commit -m 'Revert 16605 country extent regression'
          git push origin pages-live
