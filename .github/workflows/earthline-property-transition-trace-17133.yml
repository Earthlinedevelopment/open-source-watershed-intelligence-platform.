name: Earthline Property Transition Trace 17133
on:
  push:
    branches: [research/elder-density-calibration-17100]
    paths:
      - '.github/workflows/earthline-property-transition-trace-17133.yml'
      - 'lab/earthline-17133-property-transition.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - name: Trace Property declaration owners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8',errors='replace')
          needles=['earthlineDeclareProperty16169','earthlineDeclarePropertyAtCrosshair16173','declareProperty','PROPERTY_DECLARATION_16169','PROPERTY_TARGET_16201']
          for n in needles:
              print('\n===== '+n+' =====')
              pos=0;c=0
              while True:
                  i=t.find(n,pos)
                  if i<0: break
                  c+=1
                  print('\n---',c,'at',i,'---')
                  print(t[max(0,i-4500):min(len(t),i+9000)])
                  pos=i+len(n)
                  if c>=8: break
              print('COUNT',c)
          PY
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ['Thailand','Uruguay','Comoros','Cabo Verde','New Zealand']
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/elder-density-calibration-17100}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - env:
          TARGET: ${{ matrix.target }}
        run: node lab/earthline-17133-property-transition.mjs
