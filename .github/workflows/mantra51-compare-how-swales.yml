name: Mantra 51 Compare How Swales Versions
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-compare-how-swales.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - run: python3 -m http.server 8787 >/tmp/earthline-http.log 2>&1 &
      - name: Extract both How Swales versions
        run: |
          cat > compare-swales.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:1000}});
          await page.goto('http://127.0.0.1:8787/index.html?audit='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(1500);
          const reportText=await page.evaluate(()=>{
            const arr=window.HOW_BIOSWALES_REPORT_16388||null;
            if(Array.isArray(arr)) return arr.map((x,i)=>'[[REPORT PART '+(i+1)+']]\n'+x.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()).join('\n');
            const scripts=[...document.scripts].map(s=>s.textContent||'').join('\n');
            const i=scripts.indexOf('const HOW_BIOSWALES_REPORT_16388=');
            return i>=0?scripts.slice(i,i+50000):'REPORT CONSTANT NOT EXPOSED';
          });
          await page.evaluate(()=>{ location.hash='#swales-explained'; window.dispatchEvent(new HashChangeEvent('hashchange')); });
          await page.waitForTimeout(1200);
          const frame=page.locator('#earthlineSwalesPage16125 iframe');
          const swalesText=await frame.contentFrame().locator('body').innerText();
          console.log('===== REPORT VERSION =====');
          console.log(reportText);
          console.log('===== SWALES EXPLAINED VERSION =====');
          console.log(swalesText);
          await browser.close();
          JS
          node compare-swales.mjs
