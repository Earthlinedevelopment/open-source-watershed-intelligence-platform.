name: Earthline Texas Coarse 7 Repeat
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/texas-coarse7-repeat.mjs'
      - '.github/workflows/earthline-texas-coarse7.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node tests/texas-coarse7-repeat.mjs
