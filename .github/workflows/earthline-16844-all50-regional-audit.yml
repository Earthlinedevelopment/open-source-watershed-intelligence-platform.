name: Earthline 16844 All-50 Regional Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthline-16844-all50-regional-audit.yml'
      - 'lab/earthline-16844-all50-regional-audit.mjs'
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: b1
            states: 'Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia'
          - batch: b2
            states: 'Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland'
          - batch: b3
            states: 'Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey'
          - batch: b4
            states: 'New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina'
          - batch: b5
            states: 'South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Audit live 16844 batch
        env:
          EARTHLINE_URL: 'https://earthlinedevelopment.org/'
          STATES: ${{ matrix.states }}
          BATCH: ${{ matrix.batch }}
          OUTDIR: out-16844-${{ matrix.batch }}
        run: node lab/earthline-16844-all50-regional-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-16844-all50-${{ matrix.batch }}
          path: out-16844-${{ matrix.batch }}/
          retention-days: 2
