name: M97 zero Property prescriber audit - multiple real controls
on:
  push:
    branches: [diagnostics/m95-real-arizona-ui-20261103]
    paths: [.github/workflows/m97-property-zero-audit.yml]
permissions:
  contents: read
jobs:
  actual-property-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Compare real Property prescriber decisions in four Arizona positions
        run: node tests/m97-property-zero-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m97-property-prescriber-zeros
          path: artifacts/m97-prescriber
          retention-days: 4
