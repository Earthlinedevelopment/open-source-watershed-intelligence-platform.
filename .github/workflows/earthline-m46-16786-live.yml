name: Mantra 46 16786 Production Gate

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/mantra46-16786-ia-ar-live.mjs'
      - '.github/workflows/earthline-m46-16786-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ia-ar-16786:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for 16786 public deployment
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 20 https://earthlinedevelopment.org/ | grep -q 'EARTHLINE 16786 — SPATIALLY COMPLETE REGIONAL CONTOUR ANCHORS'; then
              exit 0
            fi
            sleep 3
          done
          echo "16786 marker not live"
          exit 1
      - name: Run 16786 Iowa Arkansas production gate
        run: node tests/mantra46-16786-ia-ar-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16786-production-gate
          path: artifacts/mantra46-16786-live/
          if-no-files-found: warn
