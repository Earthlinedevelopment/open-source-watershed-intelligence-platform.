name: Mantra 51 Apply Shared Regional Flow Owner
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths: ['lab/mantra51-shared-regional-flow-owner.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: mantra51-global-repair-campaign}
      - run: python3 lab/mantra51-shared-regional-flow-owner.py
      - run: |
          grep -n "EARTHLINE_REGIONAL_FLOW_PROFILE_16918" index.html
          ! grep -q "vancouverFlowDensity16917" index.html
      - run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: use shared relief-adaptive Regional drainage density"
          git push origin HEAD:mantra51-global-repair-campaign
