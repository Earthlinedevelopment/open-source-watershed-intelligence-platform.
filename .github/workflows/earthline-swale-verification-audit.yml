name: Earthline Property Swale Verification Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-swale-verification-trigger']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for n,size in [
            ('function syncSafePropertyFallback16221',6500),
            ('renderVerified',4500),
            ('EARTHLINE_PROPERTY_RUN_AUDIT_16173',5500),
            ('EARTHLINE_PROPERTY_PRESENTATION_SETTLE_AUDIT_16521',3500)
          ]:
            print('\n===',n,'===')
            start=0;hits=0
            while True:
              i=s.find(n,start)
              if i<0:break
              print(s[max(0,i-1200):min(len(s),i+size)])
              start=i+len(n);hits+=1
              if hits>=8:break
          PY
