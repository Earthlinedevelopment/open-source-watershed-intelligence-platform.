name: Earthline Property Swale Verification Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-swale-verification-trigger']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for n in [
            'EARTHLINE_PROPERTY_SAFE_VISIBILITY_AUDIT_16221',
            'renderVerified',
            'EARTHLINE_PROPERTY_PUBLICATION_AUDIT_16220',
            'earthlinePropertySwale',
            'safeVisibility',
            'publicationCount'
          ]:
            print('\n===',n,'===')
            start=0;hits=0
            while True:
              i=s.find(n,start)
              if i<0:break
              print(s[max(0,i-5000):min(len(s),i+10000)])
              start=i+len(n);hits+=1
              if hits>=12:break
          PY
