name: Mantra 46 16799 Segment-Footprint Sampling

on:
  push:
    branches:
      - diagnostic-m46-16799-segment-footprint
    paths:
      - 'tests/mantra46-16799-segment-footprint.mjs'
      - '.github/workflows/mantra46-16799-segment-footprint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Evaluate segment-footprint gap sampling
        run: node tests/mantra46-16799-segment-footprint.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16799-segment-footprint
          path: artifacts/mantra46-16799-segment-footprint/
          if-no-files-found: error
