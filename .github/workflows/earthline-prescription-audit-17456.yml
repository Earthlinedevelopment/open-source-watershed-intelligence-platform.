name: Earthline Prescription Audit 17456
on:
  push:
    branches: [repair/mantra67-launch-final-17454]
    paths:
      - 'tests/prescription-audit-17456.mjs'
      - '.github/workflows/earthline-prescription-audit-17456.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - id: test
        continue-on-error: true
        run: env EARTHLINE_URL='http://127.0.0.1:8787/' node tests/prescription-audit-17456.mjs
      - name: Persist result
        if: always()
        run: |
          mkdir -p test-results
          cp artifacts/prescription-audit-17456.json test-results/prescription-audit-17456.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results/prescription-audit-17456.json
          git commit -m "test: persist prescription audit 17456" || true
          git pull --rebase origin repair/mantra67-launch-final-17454 || true
          git push origin HEAD:repair/mantra67-launch-final-17454 || true
      - name: Enforce
        if: steps.test.outcome != 'success'
        run: exit 1
