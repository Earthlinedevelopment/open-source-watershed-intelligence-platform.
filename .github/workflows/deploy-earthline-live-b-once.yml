name: Deploy verified Earthline live B repair package
on:
  push:
    branches: [pages-live]
    paths:
      - .github/workflows/deploy-earthline-live-b-once.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: earthline-live-b-deployment
  cancel-in-progress: false
jobs:
  deploy_verified_b:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
          persist-credentials: true
      - name: Verify baseline and construct exact reviewed B files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 1ee54f3fcaaeebae9de3a9292151052222529e08
          python3 - <<'PY'
            import pathlib, subprocess, hashlib, sys
            def git(*args):
                return subprocess.check_output(['git',*args])
            def blob_at(rev,path):
                return git('show',rev+':'+path)
            base='5bab57f03bdd491671a13b70d56bde9357f43bac'
            candidate='1ee54f3fcaaeebae9de3a9292151052222529e08'
            assert git('rev-parse','HEAD').decode().strip()==base, 'Production head drifted; refusing to deploy'
            assert git('hash-object','index.html').decode().strip()=='ff740575e83efbce991566369925a3ef77232f3f', 'Production HTML changed'
            assert git('hash-object','earthline-elder-restored-17097.js').decode().strip()=='808890f0c86d501939e8cfdf00148287c7dd3ebc', 'Production Elder changed'
            raw=blob_at(candidate,'index.html')
            assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\\0'+raw).hexdigest()=='f9c7104ce81acb3110a17cab345bf149fe9d8cd3', 'Candidate blob mismatch'
            s=raw.decode('utf-8')
            changes=[
            ("    function render(showAll){",
             "    function render(showAll){\\n      /* Search dropdown fix: after a committed selection, stay closed until the user types again. */\\n      if(document.documentElement.dataset.earthlineSuggestionsSuppressed==='1'){menu.classList.remove('open');return;}"),
            ("    input.addEventListener('input',()=>render(false));",
             "    input.addEventListener('input',e=>{if(e.isTrusted)delete document.documentElement.dataset.earthlineSuggestionsSuppressed;},true);input.addEventListener('input',()=>render(false));"),
            ("document.documentElement.dataset.earthlineSuggestionCommit16246='1';",
             "document.documentElement.dataset.earthlineSuggestionCommit16246='1';document.documentElement.dataset.earthlineSuggestionsSuppressed='1';"),
            ("input.value='';const st=state();if(st)st.appliedSearchText='';input.dispatchEvent(new Event('input',{bubbles:true}));input.focus();render(true);",
             "delete document.documentElement.dataset.earthlineSuggestionsSuppressed;input.value='';const st=state();if(st)st.appliedSearchText='';input.dispatchEvent(new Event('input',{bubbles:true}));input.focus();render(true);"),
            ("function openSuggestions16233(){if(!searchEngaged16233)return;",
             "function openSuggestions16233(){if(!searchEngaged16233)return;if(document.documentElement.dataset.earthlineSuggestionsSuppressed==='1'){closeSuggestions16233();return;}")
            ]
            for old,new in changes:
                count=s.count(old)
                assert count==1,(old,count)
                s=s.replace(old,new,1)
            out=s.encode('utf-8')
            def hashblob(data):
                return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\\0'+data).hexdigest()
            assert len(out)==3769509,(len(out),'unexpected size')
            assert hashblob(out)=='4f26efbaaa718460f178440439a6f980645f819e',hashblob(out)
            elder=blob_at(candidate,'earthline-elder-restored-17097.js')
            assert hashblob(elder)=='4c88c6a547e3345a951e08a4d34c101b1d52faef',hashblob(elder)
            pathlib.Path('index.html').write_bytes(out)
            pathlib.Path('earthline-elder-restored-17097.js').write_bytes(elder)
            print('Verified B index and Elder exact blob identities; ready to commit')
          PY
      - name: Atomically publish exact verified files, never force push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html earthline-elder-restored-17097.js
          git commit -m 'fix(live): verified B search and display repairs'
          git push origin HEAD:pages-live
