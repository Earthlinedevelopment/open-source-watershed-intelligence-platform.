name: Earthline V2 Hydrogeology Payload Probe

on:
  push:
    branches: [version-2]
    paths:
      - '.github/workflows/earthline-v2-hydrogeology-payload-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-2
      - name: Measure authoritative Census-state transport packs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path

          root=Path("v2/data/usgs-hydrogeology-2025")
          index=json.loads((root/"index.json").read_text(encoding="utf-8"))

          def geom_bbox(geom):
              w=s=float("inf"); e=n=float("-inf")
              def walk(x):
                  nonlocal w,s,e,n
                  if isinstance(x,list) and len(x)>=2 and isinstance(x[0],(int,float)) and isinstance(x[1],(int,float)):
                      lon,lat=float(x[0]),float(x[1]); w=min(w,lon);s=min(s,lat);e=max(e,lon);n=max(n,lat);return
                  if isinstance(x,list):
                      for y in x: walk(y)
              walk(geom.get("coordinates",[])); return [w,s,e,n]

          def hit(a,b): return not (a[2]<b[0] or a[0]>b[2] or a[3]<b[1] or a[1]>b[3])

          parts=[]
          for meta in index["features"]:
              f=json.loads((root/meta["file"]).read_text(encoding="utf-8"))
              g=f["geometry"]; polys=g["coordinates"] if g["type"]=="MultiPolygon" else [g["coordinates"]]
              for i,poly in enumerate(polys,1):
                  one={"type":"Feature","properties":f["properties"],"geometry":{"type":"Polygon","coordinates":poly}}
                  raw=json.dumps(one,separators=(",",":"),ensure_ascii=False).encode()
                  parts.append({"source_id":meta["id"],"type":meta["type"],"part":i,"bbox":geom_bbox(one["geometry"]),"bytes":len(raw)})

          endpoint="https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/0/query"
          params={
              "where":"1=1","outFields":"GEOID,STUSAB,NAME","returnGeometry":"true",
              "outSR":"4326","f":"geojson"
          }
          url=endpoint+"?"+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={"User-Agent":"Earthline-V2-state-pack-probe/1.0"})
          with urllib.request.urlopen(req,timeout=60) as r:
              states=json.loads(r.read())
          rows=[]
          total=0
          for sf in states.get("features",[]):
              p=sf.get("properties") or {}
              abbr=str(p.get("STUSAB") or "").upper()
              if not abbr: continue
              sb=geom_bbox(sf.get("geometry") or {})
              chosen=[x for x in parts if hit(x["bbox"],sb)]
              size=sum(x["bytes"] for x in chosen)
              total+=size
              rows.append({
                  "state":abbr,"name":p.get("NAME"),"parts":len(chosen),"bytes":size,
                  "PA":sum(1 for x in chosen if x["type"]=="PA"),
                  "SHR":sum(1 for x in chosen if x["type"]=="SHR"),
                  "bbox":sb
              })
          rows.sort(key=lambda x:x["state"])
          if not rows:
              raise RuntimeError("Census TIGERweb returned zero state features; state-pack sizing aborted")
          conus=[x for x in rows if x["state"] not in {"AK","HI","PR","GU","VI","MP","AS"} and x["bytes"]>0]
          if not conus:
              raise RuntimeError("No CONUS state packs intersect the hydrogeology assets")
          print("polygon_parts:",len(parts))
          print("census_features:",len(rows))
          print("conus_packs:",len(conus))
          print("conus_pack_total_bytes:",sum(x["bytes"] for x in conus))
          print("conus_pack_max_json:",json.dumps(max(conus,key=lambda x:x["bytes"]),sort_keys=True))
          print("conus_pack_median_bytes:",sorted(x["bytes"] for x in conus)[len(conus)//2])
          for st in ["VT","AR","IA","NY","MA","MD","TX","CA","FL","CO"]:
              row=next((x for x in rows if x["state"]==st),None)
              print("state_pack_json:",json.dumps(row,sort_keys=True))
          PY
