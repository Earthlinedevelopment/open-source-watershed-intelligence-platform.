name: Earthline V2 Hydrogeology Payload Probe

on:
  push:
    branches: [version-2]
    paths:
      - '.github/workflows/earthline-v2-hydrogeology-payload-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Measure authoritative USGS source payload
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --target "$RUNNER_TEMP/earthline-py" pyshp
          export PYTHONPATH="$RUNNER_TEMP/earthline-py"
          python - <<'PY'
          import gzip, io, json, statistics, tempfile, urllib.request, zipfile
          from pathlib import Path
          import shapefile

          ITEM="6863356fd4be025653d31f4d"
          SB=f"https://www.sciencebase.gov/catalog/item/{ITEM}?format=json"

          def fetch(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Earthline-V2-payload-probe/1.1"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read()

          item=json.loads(fetch(SB))
          files=item.get("files") or []
          zf=next(f for f in files if str(f.get("name","")).lower()=="hydrogeologicregions.zip")
          zraw=fetch(zf.get("downloadUri") or zf.get("url"))
          print("source_zip_bytes:",len(zraw))

          with tempfile.TemporaryDirectory() as td:
              with zipfile.ZipFile(io.BytesIO(zraw)) as z:
                  z.extractall(td)
              shp=Path(td)/"HydrogeologicRegions.shp"
              reader=shapefile.Reader(str(shp))
              fields=[f[0] for f in reader.fields if f[0]!="DeletionFlag"]
              features=[]
              vertices=0
              types={}
              per=[]
              index=[]
              for sr in reader.iterShapeRecords():
                  props=dict(zip(fields,list(sr.record)))
                  t=str(props.get("HR_Type","")).strip()
                  types[t]=types.get(t,0)+1
                  gi=sr.shape.__geo_interface__
                  def count_coords(v):
                      if isinstance(v,(list,tuple)):
                          if len(v)>=2 and isinstance(v[0],(int,float)) and isinstance(v[1],(int,float)):
                              return 1
                          return sum(count_coords(x) for x in v)
                      return 0
                  nverts=count_coords(gi.get("coordinates"))
                  vertices += nverts
                  feature={"type":"Feature","properties":props,"geometry":gi}
                  features.append(feature)
                  b=sr.shape.bbox
                  index.append({
                      "HR_Type":props.get("HR_Type"),
                      "HR_ID":props.get("HR_ID"),
                      "HR_Code":props.get("HR_Code"),
                      "HR_Name":props.get("HR_Name"),
                      "HR_Litholo":props.get("HR_Litholo"),
                      "bbox":[round(float(x),7) for x in b]
                  })
                  one=json.dumps(feature,separators=(",",":"),ensure_ascii=False).encode("utf-8")
                  per.append({
                      "type":t,
                      "id":str(props.get("HR_ID","")),
                      "name":str(props.get("HR_Name","")),
                      "vertices":nverts,
                      "bytes":len(one),
                      "gzip":len(gzip.compress(one,compresslevel=9))
                  })

              fc={"type":"FeatureCollection","features":features}
              raw=json.dumps(fc,separators=(",",":"),ensure_ascii=False).encode("utf-8")
              gz=gzip.compress(raw,compresslevel=9)
              idx=json.dumps(index,separators=(",",":"),ensure_ascii=False).encode("utf-8")
              sizes=sorted(x["bytes"] for x in per)
              gz_sizes=sorted(x["gzip"] for x in per)
              print("records:",len(features))
              print("types_json:",json.dumps(types,sort_keys=True))
              print("vertices:",vertices)
              print("geojson_bytes:",len(raw))
              print("geojson_gzip9_bytes:",len(gz))
              print("gzip_ratio:",round(len(gz)/len(raw),4))
              print("schema:",",".join(fields))
              print("feature_index_bytes:",len(idx))
              print("feature_index_gzip9_bytes:",len(gzip.compress(idx,compresslevel=9)))
              print("per_feature_median_bytes:",int(statistics.median(sizes)))
              print("per_feature_p90_bytes:",sizes[int(round(.9*(len(sizes)-1)))])
              print("per_feature_max_bytes:",max(sizes))
              print("per_feature_median_gzip9:",int(statistics.median(gz_sizes)))
              print("per_feature_max_gzip9:",max(gz_sizes))
              print("top_features_json:",json.dumps(sorted(per,key=lambda x:x["bytes"],reverse=True)[:12]))
          PY
