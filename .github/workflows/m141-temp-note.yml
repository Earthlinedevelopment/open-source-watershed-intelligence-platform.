name: M141 two map guidance boxes UI-only repair
on:
  push:
    branches: ['repair/m141-temporary-note-placement']
    paths: ['.github/workflows/m141-temp-note.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Move temporary map note right-middle and restore independent corridor tip
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""body:has(#earthlineTemporaryMapHint126) #earthlineCorridorTip16248.open{
           display:none!important;
          }"""
          assert s.count(old)==1, 'expected existing conflicting corridor-tip CSS once'
          s=s.replace(old,"/* M141: both guidance messages are independent; never hide the corridor tip when navigation note opens. */")
          old="""#earthlineTemporaryMapHint126{
           left:calc((100vw + var(--el-map-left-m136))/2)!important;
           top:22px!important;transform:translateX(-50%)!important;
           max-width:calc(100vw - 28px)!important;
          }"""
          new="""#earthlineTemporaryMapHint126{
           left:auto!important;right:20px!important;
           top:50%!important;bottom:auto!important;transform:translateY(-50%)!important;
           width:max-content!important;max-width:min(420px,calc(100vw - var(--el-map-left-m136) - 40px))!important;
          }"""
          assert s.count(old)==1,'map note style unexpectedly changed'
          s=s.replace(old,new)
          a=s.index('  #earthlineTemporaryMapHint126,#earthlineCorridorTip16248{')
          b=s.index('  html[data-earthline-has-results]',a)
          assert 0<=a<b, 'shared mobile rule missing'
          old=s[a:b]
          assert 'top:78px!important' in old
          new=old.replace('#earthlineTemporaryMapHint126,#earthlineCorridorTip16248{','#earthlineCorridorTip16248{')
          new+="""
          #earthlineTemporaryMapHint126{
            left:auto!important;right:10px!important;top:50%!important;
            transform:translateY(-50%)!important;
            width:max-content!important;max-width:calc(100vw - var(--el-rail-16188,54px) - 20px)!important;
          }
          """
          s=s[:a]+new+s[b:]
          p.write_text(s)
          assert "display:none!important;" not in s[s.index('<style id="earthline-m136-regional-layout-only">'):s.index('<style id="earthline-m136-regional-layout-only">')+650]
          print('M141_PASS_NOTE_RIGHT_MIDDLE_CORRIDOR_TIP_NO_LONGER_HIDDEN')
          PY
      - name: Confirm change is exclusively within M136 UI style block
        run: |
          git diff --check
          git diff --numstat -- index.html
          python3 - <<'PY'
          import subprocess
          diff=subprocess.check_output(['git','diff','--','index.html'],text=True)
          assert diff.count('@@')==2, 'expected one CSS hunk'
          assert '#earthlineTemporaryMapHint126' in diff
          assert 'body:has(#earthlineTemporaryMapHint126)' in diff
          print('M141_UI_SCOPE_PASS')
          PY
      - name: Commit candidate only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(ui): move map note right-middle and restore choose-a-tab tip"
          git push origin HEAD:repair/m141-temporary-note-placement
