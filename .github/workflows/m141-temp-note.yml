name: M141 UI temporary note locator
on:
  push:
    branches: ['repair/m141-temporary-note-placement']
    paths: ['.github/workflows/m141-temp-note.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Locate both temporary box definitions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('index.html').read_text().splitlines()
          import re
          terms=['choose a tab','temporary','temp note','temp-note','tempNote','choose-tab','chooseTab','note box']
          for term in terms:
            ids=[i for i,x in enumerate(a) if term.casefold() in x.casefold()]
            print('MATCH',repr(term),'count',len(ids),'lines',[i+1 for i in ids[:25]])
            for i in ids[:12]:
              for j in range(max(0,i-8),min(len(a),i+12)):
                print(f'SOURCE {j+1} {a[j][:240]}')
          PY
