name: M141 two guidance boxes UI-only repair
on:
  push:
    branches: ['repair/m141-temporary-note-placement']
    paths: ['.github/workflows/m141-temp-note.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fix independent map guidance boxes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('<style id="earthline-m136-regional-layout-only">')
          close=s.index('</style>',start)
          style=s[start:close]
          assert 'body:has(#earthlineTemporaryMapHint126) #earthlineCorridorTip16248.open' in style
          assert '#earthlineTemporaryMapHint126' in style
          # Append CSS to supersede both preexisting desktop and mobile rules.
          addition="""
          /* M141 - restore independent corridor tab instructions and right-middle map hint */
          body:has(#earthlineTemporaryMapHint126) #earthlineCorridorTip16248.open{
            display:block!important;
          }
          #earthlineTemporaryMapHint126{
            left:auto!important;right:20px!important;top:50%!important;bottom:auto!important;
            transform:translateY(-50%)!important;
            width:max-content!important;max-width:min(420px,calc(100vw - var(--el-map-left-m136) - 40px))!important;
          }
          @media(max-width:760px){
            #earthlineTemporaryMapHint126{
              left:auto!important;right:10px!important;top:50%!important;
              transform:translateY(-50%)!important;
              width:max-content!important;max-width:calc(100vw - var(--el-rail-16188,54px) - 20px)!important;
            }
          }
          """
          assert 'M141 - restore independent corridor' not in style
          s=s[:close]+addition+s[close:]
          p.write_text(s)
          print('M141_CSS_SCOPE_PASS')
          PY
      - name: Validate only UI CSS was touched
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          d=subprocess.check_output(['git','diff','--','index.html'],text=True)
          assert 'M141 - restore independent corridor' in d
          assert d.count('@@')==2
          print('M141_UI_ONLY_PASS')
          PY
      - name: Commit candidate without touching deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(ui): restore corridor tip and place map hint at right middle"
          git push origin HEAD:repair/m141-temporary-note-placement
