name: Mantra 51 Inspect Map Pointer Owner
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-inspect-map-pointer-owner.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Inspect pointer-events owners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needles=["pointer-events:none","pointer-events: none","#map{","#map {",".mapboxgl-map","mapPointerEvents","pointerEvents"]
          for needle in needles:
            print("\n===== "+needle+" =====")
            pos=0; count=0
            while count<40:
              i=s.find(needle,pos)
              if i<0: break
              print(s[max(0,i-900):min(len(s),i+1600)].replace("\n"," "))
              print("\n---")
              pos=i+len(needle);count+=1
          PY
