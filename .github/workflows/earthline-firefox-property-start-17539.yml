name: Earthline Firefox Property Start 17539
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/earthline-firefox-property-start-17539.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17529
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/firefox-property-start-17539.mjs > tests/firefox-property-start-17539.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps firefox
      - run: xvfb-run -a node tests/firefox-property-start-17539.mjs