name: Earthline aerial mood 16972
on:
  push:
    branches:
      - pages-live
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Apply dreamy real-aerial grade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          start=s.index("function mapSvg(d,small=false){")
          end=s.index("  return parts.join('');\n}", start)+len("  return parts.join('');\n}")
          fn=s[start:end]

          def one(a,b,label):
              global fn
              n=fn.count(a)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {n}")
              fn=fn.replace(a,b,1)

          one('class="el-report-real-site-render-16971"',
              'class="el-report-real-site-render-16972"',
              "renderer marker")

          old = '<linearGradient id="elAerialWash16971" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4da" stop-opacity=".07"/><stop offset=".55" stop-color="#173d32" stop-opacity=".025"/><stop offset="1" stop-color="#0c2d27" stop-opacity=".13"/></linearGradient>'
          new = '<linearGradient id="elAerialWash16972" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1cf" stop-opacity=".10"/><stop offset=".34" stop-color="#315340" stop-opacity=".035"/><stop offset=".72" stop-color="#173a31" stop-opacity=".09"/><stop offset="1" stop-color="#092820" stop-opacity=".18"/></linearGradient><radialGradient id="elAerialVignette16972" cx="50%" cy="44%" r="72%"><stop offset="0" stop-color="#173b30" stop-opacity="0"/><stop offset=".66" stop-color="#102f27" stop-opacity=".03"/><stop offset="1" stop-color="#071d19" stop-opacity=".16"/></radialGradient><filter id="elAerialTone16972" x="-2%" y="-2%" width="104%" height="104%"><feColorMatrix type="saturate" values=".78" result="sat"/><feComponentTransfer in="sat"><feFuncR type="linear" slope=".90" intercept=".018"/><feFuncG type="linear" slope=".94" intercept=".012"/><feFuncB type="linear" slope=".88" intercept=".014"/></feComponentTransfer></filter>'
          one(old,new,"aerial definitions")

          one('<image href="'+esc(naip)+'" x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" preserveAspectRatio="none"/>',
              '<image href="'+esc(naip)+'" x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" preserveAspectRatio="none" filter="url(#elAerialTone16972)"/>',
              "aerial image")

          one('<rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" fill="url(#elAerialWash16971)"/>',
              '<rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" fill="url(#elAerialWash16972)"/><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" fill="url(#elAerialVignette16972)"/>',
              "aerial mood overlays")

          out=s[:start]+fn+s[end:]
          if out.count("el-report-real-site-render-16972") != 1:
              raise SystemExit("16972 marker validation failed")
          if "el-report-real-site-render-16971" in out:
              raise SystemExit("16971 marker still present")
          p.write_text(out,encoding="utf-8")
          PY
          git config user.name "Earthline Build Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "style: dreamy aerial report grade 16972"
          git push origin HEAD:pages-live
