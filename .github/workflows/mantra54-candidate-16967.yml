name: Earthline Mantra 54 candidate 16967
on:
  push:
    branches: [mantra54-report-map-16967]
    paths:
      - '.github/workflows/mantra54-candidate-16967.yml'
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra54-report-map-16967
      - name: Install candidate renderer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          # Report isolation: the report is the topmost opaque surface.
          style='''<style id="earthlineReportIsolation16967">
          #earthlineVermontReportPanel16149.open{
            position:fixed!important;inset:0!important;z-index:2147483647!important;
            background:#f4f1e8!important;isolation:isolate!important;overflow:auto!important;
          }
          #earthlineVermontReportPanel16149.open .el49-shell{
            position:relative!important;z-index:1!important;
          }
          html.earthline-report-open-16966 #earthlineLaunchFallbackRail16872,
          html.earthline-report-open-16966 #earthlineLaunchLogin16872,
          html.earthline-report-open-16966 #earthlineLaunchDonate16872,
          html.earthline-report-open-16966 #earthlineLaunchMerch16872,
          html.earthline-report-open-16966 #earthlineRail16188,
          html.earthline-report-open-16966 [id^="earthlineRail"],
          html.earthline-report-open-16966 .earthline-launch-rail-btn-16872,
          html.earthline-report-open-16966 .el-rail-control-16188,
          html.earthline-report-open-16966 #searchOrb,
          html.earthline-report-open-16966 [id*="SearchOrb"],
          html.earthline-report-open-16966 .mapboxgl-ctrl{
            display:none!important;visibility:hidden!important;pointer-events:none!important;
          }
          </style>'''
          if 'earthlineReportIsolation16967' not in s:
              s=s.replace('</head>',style+'\n</head>',1)

          new_map=r'''function mapSvg(d,small=false){
            const b=reportBounds(d),W=1080,H=small?460:600;
            const mapX=28,mapY=28,mapW=W-56,mapH=H-56;
            const xSpan=Math.max(.000001,b[2]-b[0]),ySpan=Math.max(.000001,b[3]-b[1]);
            const sx=x=>mapX+(x-b[0])/xSpan*mapW,sy=y=>mapY+mapH-(y-b[1])/ySpan*mapH;
            const pathCoords=coords=>(coords||[]).map((q,i)=>(i?'L':'M')+sx(+q[0]).toFixed(1)+' '+sy(+q[1]).toFixed(1)).join(' ');
            const path=f=>pathCoords(f?.geometry?.coordinates||[]);
            const mid=f=>{const a=f?.geometry?.coordinates||[];const q=a[Math.floor(a.length/2)];return Array.isArray(q)&&q.length>1?q:null};
            const screenLength=f=>{const a=f?.geometry?.coordinates||[];let L=0;for(let i=1;i<a.length;i++)L+=Math.hypot(sx(+a[i][0])-sx(+a[i-1][0]),sy(+a[i][1])-sy(+a[i-1][1]));return L};
            const reportContours=contours().filter(f=>f?.geometry?.type==='LineString').slice(0,220);
            const reportFlows=flows().filter(f=>f?.geometry?.type==='LineString').slice(0,240);
            const rows=graded(),aquiferFeatures=reportAquifers();
            const flowRank=reportFlows.map(f=>({f,L:screenLength(f)})).sort((a,b)=>b.L-a.L);
            const major=flowRank.slice(0,Math.min(small?12:20,flowRank.length));
            const secondary=flowRank.slice(major.length,Math.min(major.length+(small?16:28),flowRank.length));
            const lonSpan=Math.max(.0001,b[2]-b[0]),midLat=(b[1]+b[3])/2,kmWide=lonSpan*111.32*Math.cos(midLat*Math.PI/180);
            const niceKm=kmWide>300?100:kmWide>120?50:kmWide>50?20:kmWide>20?10:kmWide>8?5:kmWide>3?2:1;
            const barPx=Math.max(54,Math.min(160,niceKm/kmWide*mapW));
            const clipId='elClip16967',aqPat='elAq16967',parts=[];
            parts.push('<svg class="el-report-landscape-plan-16967" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Earthline landscape water plan">');
            parts.push('<defs>'+
              '<linearGradient id="elGround16967" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf3"/><stop offset=".55" stop-color="#f0f3e9"/><stop offset="1" stop-color="#e5ece2"/></linearGradient>'+
              '<pattern id="'+aqPat+'" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="12" height="12" fill="#e99142" fill-opacity=".20"/><path d="M0 0 V12" stroke="#bd6320" stroke-width=".65" stroke-opacity=".25"/></pattern>'+
              '<clipPath id="'+clipId+'"><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="4"/></clipPath>'+
              '<marker id="elArrow16967" markerWidth="5" markerHeight="5" refX="4.1" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L5 2.5 L0 5 Z" fill="#1d789f" opacity=".78"/></marker>'+
              '</defs>');
            parts.push('<rect width="'+W+'" height="'+H+'" fill="#f4f1e8"/><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="4" fill="url(#elGround16967)" stroke="#9aa59d" stroke-width=".8"/><g clip-path="url(#'+clipId+')">');

            // Landform: restrained contour-derived relief, not a contour spaghetti layer.
            for(let i=0;i<reportContours.length;i+=10){const dp=path(reportContours[i]);if(!dp)continue;parts.push('<path d="'+dp+'" fill="none" stroke="#65766b" stroke-width="28" opacity=".018" stroke-linecap="round" vector-effect="non-scaling-stroke"/>')}
            for(let i=0;i<reportContours.length;i+=2){const dp=path(reportContours[i]);if(!dp)continue;const index=i%8===0;parts.push('<path d="'+dp+'" fill="none" stroke="'+(index?'#7f8983':'#9aa39d')+'" stroke-width="'+(index?'.52':'.26')+'" opacity="'+(index?'.18':'.075')+'" vector-effect="non-scaling-stroke"/>')}

            // Aquifer: orange spatial field behind hydrology and interventions.
            for(const f of aquiferFeatures){const g=f&&f.geometry;if(!g)continue;const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];for(const poly of polys){const rings=poly.filter(r=>Array.isArray(r)&&r.length>=3);if(!rings.length)continue;const dp=rings.map(r=>pathCoords(r)+' Z').join(' ');parts.push('<path d="'+dp+'" fill="url(#'+aqPat+')" fill-rule="evenodd" stroke="#b9611f" stroke-width="1.05" opacity=".92" vector-effect="non-scaling-stroke"/>')}}

            // Hydrology: only principal paths read. Secondary paths become context.
            for(const x of secondary){const dp=path(x.f);if(dp)parts.push('<path d="'+dp+'" fill="none" stroke="#5c8da3" stroke-width=".62" opacity=".10" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>')}
            let fi=0;for(const x of major){const dp=path(x.f);if(!dp)continue;parts.push('<path d="'+dp+'" fill="none" stroke="#fffdf7" stroke-width="4" opacity=".72" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#1d789f" stroke-width="1.22" opacity=".82" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"'+(fi++%5===0?' marker-end="url(#elArrow16967)"':'')+'/>')}

            // Bioswales: designed landscape ribbons. A dominates; B supports; C nearly disappears.
            const draw=r=>{const dp=path(r.f);if(!dp)return;
              if(r.grade==='C'){parts.push('<path d="'+dp+'" fill="none" stroke="#887c68" stroke-width=".65" opacity=".12" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');return}
              if(r.grade==='B'){parts.push('<path d="'+dp+'" fill="none" stroke="#fffdf8" stroke-width="10" opacity=".82" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#cddbc4" stroke-width="6.4" opacity=".55" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#607553" stroke-width="1.0" opacity=".72" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');return}
              parts.push('<path d="'+dp+'" fill="none" stroke="#fffdf8" stroke-width="17" opacity=".95" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#b6cfaa" stroke-width="11.5" opacity=".78" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#315b3d" stroke-width="1.5" opacity=".98" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" transform="translate(-1.5 -1.5)" fill="none" stroke="#5ba9c0" stroke-width=".70" opacity=".95" stroke-dasharray="2 2.7" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" transform="translate(1.5 1.5)" fill="none" stroke="#5ba9c0" stroke-width=".70" opacity=".95" stroke-dasharray="2 2.7" stroke-linecap="round" vector-effect="non-scaling-stroke"/>')
            };
            for(const r of rows.filter(r=>r.grade==='C'))draw(r);
            for(const r of rows.filter(r=>r.grade==='B'))draw(r);
            for(const r of rows.filter(r=>r.grade==='A'))draw(r);

            let ai=0;for(const r of rows.filter(r=>r.grade==='A').slice(0,10)){const q=mid(r.f);if(!q)continue;const x=sx(+q[0]),y=sy(+q[1]);parts.push('<g><rect x="'+(x-13).toFixed(1)+'" y="'+(y-8).toFixed(1)+'" width="26" height="15" rx="7.5" fill="#fffdf8" stroke="#5d7663" stroke-width=".7"/><text x="'+x.toFixed(1)+'" y="'+(y+3).toFixed(1)+'" text-anchor="middle" fill="#294936" font-family="Noto Sans,Arial,sans-serif" font-size="7.2" font-weight="850">A'+(++ai)+'</text></g>')}

            parts.push('</g>');
            parts.push('<g transform="translate('+(mapX+18)+','+(mapY+mapH-20)+')"><path d="M0 0 H'+barPx+'" stroke="#42544c" stroke-width="1.4"/><path d="M0 -4 V4 M'+barPx+' -4 V4" stroke="#42544c" stroke-width=".9"/><text x="'+(barPx/2)+'" y="13" text-anchor="middle" fill="#56645e" font-family="Noto Sans,Arial,sans-serif" font-size="6.6" font-weight="700">'+niceKm+' km</text></g>');
            parts.push('<g transform="translate('+(mapX+mapW-48)+','+(mapY+18)+')"><circle cx="12" cy="13" r="20" fill="#fffdf8" fill-opacity=".90" stroke="#a9b3ab" stroke-width=".7"/><text x="12" y="-1" text-anchor="middle" fill="#294239" font-family="Noto Sans,Arial,sans-serif" font-size="7.7" font-weight="850">N</text><path d="M12 4 V30" stroke="#294239" stroke-width="1"/><path d="M12 4 L6 16 L12 12 L18 16 Z" fill="#294239"/></g>');

            if(!small){const lx=mapX+mapW-278,ly=mapY+mapH-123;parts.push('<g transform="translate('+lx+','+ly+')"><rect width="260" height="105" rx="5" fill="#fffef9" fill-opacity=".94" stroke="#c1c8c2" stroke-width=".7"/><text x="14" y="20" fill="#203a33" font-family="Noto Sans,Arial,sans-serif" font-size="8.4" font-weight="850" letter-spacing=".8">PLAN KEY</text><rect x="14" y="34" width="22" height="9" rx="1" fill="url(#'+aqPat+')" stroke="#b9611f" stroke-width=".7"/><text x="44" y="41" fill="#465750" font-family="Noto Sans,Arial,sans-serif" font-size="6.5">Aquifer field</text><path d="M14 60 H36" stroke="#1d789f" stroke-width="1.25"/><text x="44" y="63" fill="#465750" font-family="Noto Sans,Arial,sans-serif" font-size="6.5">Primary water path</text><path d="M132 39 H156" stroke="#b6cfaa" stroke-width="9" opacity=".8" stroke-linecap="round"/><path d="M132 39 H156" stroke="#315b3d" stroke-width="1.4"/><text x="164" y="42" fill="#465750" font-family="Noto Sans,Arial,sans-serif" font-size="6.5">A · priority</text><path d="M132 62 H156" stroke="#cddbc4" stroke-width="6" opacity=".6" stroke-linecap="round"/><path d="M132 62 H156" stroke="#607553" stroke-width="1"/><text x="164" y="65" fill="#465750" font-family="Noto Sans,Arial,sans-serif" font-size="6.5">B · strong</text><text x="14" y="90" fill="#7a837e" font-family="Noto Sans,Arial,sans-serif" font-size="5.5">Symbolic corridor width · field verification required</text></g>')}
            parts.push('</svg>');return parts.join('');
          }
          '''
          start=s.find("function mapSvg(d,small=false){")
          end=s.find("function gradeSummary",start)
          if start<0 or end<0 or end<=start:
              raise SystemExit(f"mapSvg boundary not found: start={start} end={end}")
          s=s[:start]+new_map+s[end:]
          p.write_text(s,encoding="utf-8")
          print("16967 candidate installed")
          PY

      - name: Validate candidate and commit
        shell: bash
        run: |
          grep -q "earthlineReportIsolation16967" index.html
          grep -q "el-report-landscape-plan-16967" index.html
          grep -q "stroke-width=\"17\"" index.html
          grep -q "translate(-1.5 -1.5)" index.html
          grep -q "translate(1.5 1.5)" index.html
          grep -q "z-index:2147483647" index.html
          git config user.name "Earthline Mantra 54"
          git config user.email "info@earthlinedevelopment.org"
          git rm .github/workflows/mantra54-candidate-16967.yml
          git add index.html
          git commit -m "candidate: landscape-plan report map 16967"
          git push origin mantra54-report-map-16967
