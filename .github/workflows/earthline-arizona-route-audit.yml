name: Earthline Arizona Route Audit
on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/arizona-route-audit.mjs'
      - '.github/workflows/earthline-arizona-route-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save playwright@1.55.0
      - run: node tests/arizona-route-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arizona-route-audit
          path: /tmp/arizona-route-audit.png
          if-no-files-found: warn
