name: Earthline Alabama Repeat Property Fast Cross Browser 17457
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/earthline-alabama-repeat-property-repair-17453.yml'
      - 'tests/alabama-repeat-property-17449.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  three-browser:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17454
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/alabama-repeat-property-17449.mjs > tests/alabama-repeat-property-17449.mjs
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium firefox webkit
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          mkdir -p /tmp/earthline-results
          rc=0
          for b in chromium firefox webkit; do
            if env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER="$b" HEADLESS='true' node tests/alabama-repeat-property-17449.mjs; then
              cp artifacts/alabama-repeat-property-17449.json "/tmp/earthline-results/alabama-repeat-$b-17457.json"
            else
              cp artifacts/alabama-repeat-property-17449.json "/tmp/earthline-results/alabama-repeat-$b-17457.json" || true
              rc=1
            fi
          done
          echo "$rc" > /tmp/earthline-results/rc.txt
      - name: Persist all three results atomically
        if: always()
        run: |
          git fetch origin repair/property-one-click-17441
          rm -rf /tmp/gate
          git worktree add /tmp/gate origin/repair/property-one-click-17441
          mkdir -p /tmp/gate/test-results
          cp /tmp/earthline-results/alabama-repeat-*-17457.json /tmp/gate/test-results/
          cd /tmp/gate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results/alabama-repeat-*-17457.json
          git commit -m "test: persist Alabama three-browser repeat gate 17457" || true
          git push origin HEAD:repair/property-one-click-17441
      - name: Enforce all three
        run: |
          test "$(cat /tmp/earthline-results/rc.txt)" = "0"
