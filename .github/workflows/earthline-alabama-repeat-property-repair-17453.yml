name: Earthline Alabama Repeat Property Repair Gate 17453
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - 'tests/apply-property-repeat-one-press-17451.py'
      - 'tests/apply-elder-current-target-prefetch-17452.py'
      - '.github/workflows/earthline-alabama-repeat-property-repair-17453.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17445
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Pull repair scripts and diagnostic harness
        run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/apply-property-repeat-one-press-17451.py > tests/apply-property-repeat-one-press-17451.py
          git show origin/repair/property-one-click-17441:tests/apply-elder-current-target-prefetch-17452.py > tests/apply-elder-current-target-prefetch-17452.py
          git show origin/repair/property-one-click-17441:tests/alabama-repeat-property-17449.mjs > tests/alabama-repeat-property-17449.mjs
          python3 tests/apply-property-repeat-one-press-17451.py
          python3 tests/apply-elder-current-target-prefetch-17452.py
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - id: gate
        continue-on-error: true
        run: env EARTHLINE_URL='http://127.0.0.1:8787/' node tests/alabama-repeat-property-17449.mjs
      - name: Persist repair gate result
        if: always()
        run: |
          git fetch origin repair/property-one-click-17441
          rm -rf /tmp/earthline-gate
          git worktree add /tmp/earthline-gate origin/repair/property-one-click-17441
          mkdir -p /tmp/earthline-gate/test-results
          cp artifacts/alabama-repeat-property-17449.json /tmp/earthline-gate/test-results/alabama-repeat-property-repair-17453.json
          cd /tmp/earthline-gate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results/alabama-repeat-property-repair-17453.json
          git commit -m "test: persist Alabama repeat Property repair gate 17453" || true
          git push origin HEAD:repair/property-one-click-17441
      - name: Enforce gate
        if: steps.gate.outcome != 'success'
        run: exit 1
