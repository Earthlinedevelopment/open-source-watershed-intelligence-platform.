name: Earthline Alabama Repeat Property Cross Browser 17455
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/earthline-alabama-repeat-property-repair-17453.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17454
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/alabama-repeat-property-17449.mjs > tests/alabama-repeat-property-17449.mjs
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - id: gate
        continue-on-error: true
        run: |
          if [ '${{ matrix.browser }}' = 'firefox' ]; then
            xvfb-run -a env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='firefox' node tests/alabama-repeat-property-17449.mjs
          else
            env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='chromium' node tests/alabama-repeat-property-17449.mjs
          fi
      - name: Persist result
        if: always()
        run: |
          git fetch origin repair/property-one-click-17441
          rm -rf /tmp/gate
          git worktree add /tmp/gate origin/repair/property-one-click-17441
          mkdir -p /tmp/gate/test-results
          cp artifacts/alabama-repeat-property-17449.json /tmp/gate/test-results/alabama-repeat-${{ matrix.browser }}-17455.json
          cd /tmp/gate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results/alabama-repeat-${{ matrix.browser }}-17455.json
          git commit -m "test: persist Alabama repeat ${{ matrix.browser }} 17455" || true
          git push origin HEAD:repair/property-one-click-17441
      - name: Enforce
        if: steps.gate.outcome != 'success'
        run: exit 1
  webkit:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17454
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/alabama-repeat-property-17449.mjs > tests/alabama-repeat-property-17449.mjs
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - run: |
          python3 -m http.server 8787 --bind 0.0.0.0 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - id: gate
        continue-on-error: true
        run: env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='webkit' HEADLESS='false' node tests/alabama-repeat-property-17449.mjs
      - name: Persist result
        if: always()
        run: |
          git fetch origin repair/property-one-click-17441
          rm -rf /tmp/gate
          git worktree add /tmp/gate origin/repair/property-one-click-17441
          mkdir -p /tmp/gate/test-results
          cp artifacts/alabama-repeat-property-17449.json /tmp/gate/test-results/alabama-repeat-webkit-17455.json
          cd /tmp/gate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results/alabama-repeat-webkit-17455.json
          git commit -m "test: persist Alabama repeat webkit 17455" || true
          git push origin HEAD:repair/property-one-click-17441
      - name: Enforce
        if: steps.gate.outcome != 'success'
        run: exit 1
