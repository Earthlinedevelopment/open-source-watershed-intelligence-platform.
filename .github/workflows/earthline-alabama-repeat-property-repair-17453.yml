name: Earthline Live Repeat Property True Cross Browser 17460
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/earthline-alabama-repeat-property-repair-17453.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  three-browser-live:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17454
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/alabama-repeat-property-17449.mjs > tests/alabama-repeat-property-17449.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install chromium firefox webkit
      - run: |
          mkdir -p /tmp/earthline-live-repeat
          rc=0
          for b in chromium firefox webkit; do
            if env EARTHLINE_URL='https://earthlinedevelopment.org/' BROWSER="$b" HEADLESS='true' node tests/alabama-repeat-property-17449.mjs; then
              cp artifacts/alabama-repeat-property-17449.json "/tmp/earthline-live-repeat/$b.json"
            else
              cp artifacts/alabama-repeat-property-17449.json "/tmp/earthline-live-repeat/$b.json" || true
              rc=1
            fi
          done
          echo "$rc" > /tmp/earthline-live-repeat/rc.txt
      - name: Persist live repeat results
        if: always()
        run: |
          git fetch origin repair/property-one-click-17441
          rm -rf /tmp/gate
          git worktree add /tmp/gate origin/repair/property-one-click-17441
          mkdir -p /tmp/gate/test-results
          cp /tmp/earthline-live-repeat/chromium.json /tmp/gate/test-results/live-repeat-chromium-17460.json || true
          cp /tmp/earthline-live-repeat/firefox.json /tmp/gate/test-results/live-repeat-firefox-17460.json || true
          cp /tmp/earthline-live-repeat/webkit.json /tmp/gate/test-results/live-repeat-webkit-17460.json || true
          cd /tmp/gate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results/live-repeat-*-17460.json
          git commit -m "test: persist live repeat cross-browser 17460" || true
          git push origin HEAD:repair/property-one-click-17441
      - name: Enforce all three
        run: test "$(cat /tmp/earthline-live-repeat/rc.txt)" = "0"
