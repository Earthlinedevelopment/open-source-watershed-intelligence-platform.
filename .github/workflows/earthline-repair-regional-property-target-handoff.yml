name: Earthline Repair Regional Property Target Handoff
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-repair-regional-property-target-handoff.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Bind published Regional center to Property target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker="EARTHLINE M78.51 — published Regional center explicitly owns the default Property target"
          if marker in s:
              raise SystemExit(0)

          anchor="""    try{
      if(typeof window.earthlineReconcilePanel16188==='function')
        window.earthlineReconcilePanel16188();"""

          insert="""    /* EARTHLINE M78.51 — published Regional center explicitly owns the default Property target.
       Country runs already set country-center explicitly. State/region/city Regional runs must
       do the same at core publication; otherwise the startup crosshair default can survive even
       after the map resolves elsewhere. Corridor and user-drag targets remain separate owners. */
    try{
      if(!countryRequest16845){
        const m7851=map&&typeof map.getCenter==='function'?map:null;
        const c7851=m7851&&m7851.getCenter?m7851.getCenter():null;
        const setTargetM7851=typeof window.earthlineSetPropertyTarget16201==='function'
          ?window.earthlineSetPropertyTarget16201
          :(typeof setPropertyTarget16201==='function'?setPropertyTarget16201:null);
        if(c7851&&setTargetM7851&&Number.isFinite(Number(c7851.lng))&&Number.isFinite(Number(c7851.lat))){
          setTargetM7851({lng:Number(c7851.lng),lat:Number(c7851.lat),source:'regional-center'},{openPanel:false});
        }
      }
    }catch(_){}
"""

          if s.count(anchor)!=1:
              raise SystemExit(f"M78.51 anchor count={s.count(anchor)}")
          s=s.replace(anchor,insert+anchor,1)

          if marker not in s:
              raise SystemExit("M78.51 marker missing after patch")
          p.write_text(s,encoding="utf-8")
          print("Applied Regional-to-Property target handoff")
          PY
          git diff --check
          grep -q "published Regional center explicitly owns the default Property target" index.html
      - name: Commit target handoff repair
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "Earthline Target Repair"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: bind Regional center to Property target"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
