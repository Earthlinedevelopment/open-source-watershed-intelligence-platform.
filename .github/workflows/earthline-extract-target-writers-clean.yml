name: Earthline Clean Property Target Writer Audit
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-extract-target-writers-clean.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - name: Print exact Property target writers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          lines=s.splitlines()
          print("===== DIRECT WRITERS =====")
          hits=[]
          for i,line in enumerate(lines):
              if "EARTHLINE_PROPERTY_TARGET_16201=" in line or "earthlineSetPropertyTarget16201(" in line:
                  hits.append(i)
                  print(f"\n--- line {i+1} ---")
                  for j in range(max(0,i-3),min(len(lines),i+4)):
                      print(f"{j+1}: {lines[j]}")
          print(f"\nDIRECT_WRITER_HITS={len(hits)}")
          print("\n===== SETTER DEFINITIONS =====")
          patterns=[
              r"window\.earthlineSetPropertyTarget16201\s*=\s*[^;]+",
              r"function\s+earthlineSetPropertyTarget16201\s*\([^)]*\)",
              r"(?:const|let|var)\s+earthlineSetPropertyTarget16201\s*=\s*[^;]+"
          ]
          found=set()
          for pat in patterns:
              for m in re.finditer(pat,s):
                  if m.start() in found: continue
                  found.add(m.start())
                  print(s[max(0,m.start()-1800):min(len(s),m.start()+6500)])
                  print("\n---")
          print("\n===== TARGET RECONCILIATION / MAP EVENTS =====")
          for i,line in enumerate(lines):
              lo=line.lower()
              if ("moveend" in lo or "dragend" in lo or "crosshair" in lo) and ("target" in lo or "16201" in lo or "reconcil" in lo):
                  print(f"\n--- line {i+1} ---")
                  for j in range(max(0,i-4),min(len(lines),i+5)):
                      print(f"{j+1}: {lines[j]}")
          PY
