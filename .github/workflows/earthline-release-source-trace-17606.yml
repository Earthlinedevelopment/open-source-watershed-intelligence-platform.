name: Earthline Release Source Trace 17606
on:
  push:
    branches: [diag/release-17606-source]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Trace locked release owners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for fn in ["index.html","earthline-launch-16872.js"]:
            s=Path(fn).read_text(encoding="utf-8")
            print("\n===== "+fn+" =====")
            for needle in [
              "earthline-property-safe-life-16221",
              "earthline-property-safe-water-16221",
              "earthlineRechargeDataContent16488",
              "RECHARGE SUITABILITY",
              "Recharge Suitability",
              "function buildReport",
              "function openReport",
              "EARTHLINE PROCESS",
              "How Bioswales Work",
              "earthlineLanguage16488",
              "Slow it. <span class=\"sink\">Sink it.</span> Spread it."
            ]:
              print("\n--- "+needle+" ---")
              pos=0;count=0
              while True:
                i=s.find(needle,pos)
                if i<0 or count>=8: break
                line=s.count("\n",0,i)+1
                a=max(0,i-1200);b=min(len(s),i+4000)
                print(f"LINE {line}\n"+s[a:b].replace("\n"," ")+"\n")
                pos=i+len(needle);count+=1
          PY
