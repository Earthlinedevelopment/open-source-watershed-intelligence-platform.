name: M170 live production five-repair smoke
on:
  push:
    branches: ['audit/m170-live-production-smoke']
    paths: ['.github/workflows/m170-live-smoke.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check published site, Property, Elder, report and popup styles
        run: |
          mkdir -p artifacts/m170-live
          cat > m170-live.mjs <<'JS'
          import {chromium} from 'playwright';
          import {writeFileSync} from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:950}});
          let errors=[];page.on('pageerror',e=>errors.push(String(e)));
          let o={url:'https://earthlinedevelopment.org/',point:[-93.68,42.13],errors};
          try{
            await page.goto(o.url+'?m170-live-check',{waitUntil:'domcontentloaded',timeout:60000});
            o.elderSource=await page.evaluate(()=>Array.from(document.scripts).map(x=>x.src).filter(x=>x.includes('elder-restored')));
            o.popupCSS=await page.evaluate(()=>{const style=document.getElementById('earthline-m136-regional-layout-only')?.textContent||'';return {sequential:style.includes('display:none!important'),rightMiddle:style.includes('M161 right-middle')}})
            await page.locator('#searchInput').fill('Iowa');
            const s=page.locator('#earthlineSearchSuggestions15970 button[data-query]').first();
            if(await s.count())await s.click({timeout:15000}).catch(()=>{});
            await page.evaluate(()=>{const i=document.getElementById('searchInput');i.value='Iowa';i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));document.getElementById('runBtn')?.click()});
            await page.waitForFunction(()=>!!window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167||!!window.EARTHLINE_LAST_LIVE_REGIONAL_ERROR_15970,null,{timeout:85000,polling:250});
            o.regional=await page.evaluate(()=>({count:window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167?.generated||0,error:window.EARTHLINE_LAST_LIVE_REGIONAL_ERROR_15970?.error||null}));
            if(o.regional.error)throw Error(o.regional.error);
            await page.evaluate(p=>{const m=typeof earthlineMap!=='undefined'?earthlineMap:window.earthlineMap;m.stop();m.jumpTo({center:p,zoom:17.7})},o.point);
            await page.waitForTimeout(1000);
            const started=Date.now();
            await page.locator('#earthlineDeclareProperty16169').evaluate(el=>el.click());
            await page.waitForFunction(()=>window.EARTHLINE_PROPERTY_RUN_AUDIT_16173?.settled===true,null,{timeout:90000,polling:200});
            o.propertyLoadSec=Math.round((Date.now()-started)/100)/10;
            await page.waitForTimeout(1200);
            o.property=await page.evaluate(()=>({safe:window.EARTHLINE_PROPERTY_PUBLICATION_AUDIT_16220?.safeCount||0,verified:typeof M!=='undefined'?M.safetyAudit15806?.verified:null,unsafe:typeof M!=='undefined'?M.safetyAudit15806?.clearance?.unsafeSegments:null,elder:window.EARTHLINE_ELDER_TREE_LAST_17097||null,crowns:document.querySelectorAll('.earthline-swale-tree-crown-16174 circle').length}));
            await page.screenshot({path:'artifacts/m170-live/property.png'});
            await page.locator('#earthlineVermontReport16149').evaluate(el=>el.click());
            await page.waitForFunction(()=>document.querySelector('#earthlineVermontReportPanel16149.open .el49-cover-map svg')!==null,null,{timeout:25000,polling:200});
            o.report=await page.evaluate(()=>{const panel=document.getElementById('earthlineVermontReportPanel16149'),map=panel?.querySelector('.el49-cover-map svg');return {open:panel?.classList.contains('open'),svg:!!map,text:map?.textContent?.slice(0,440),hasActualIowa:map?.textContent?.includes('Iowa'),hasAquiferCondition:map?.textContent?.includes('Aquifer context not loaded')||!!map?.querySelector('path[fill="#e7a23c"]')}});
            await page.screenshot({path:'artifacts/m170-live/report.png'});
            o.pass=o.property.safe>0&&o.report.open&&o.report.hasActualIowa&&o.popupCSS.sequential&&o.popupCSS.rightMiddle&&o.property.unsafe===0;
          }catch(e){o.error=String(e);}
          console.log('M170_LIVE '+JSON.stringify(o));
          writeFileSync('artifacts/m170-live/result.json',JSON.stringify(o,null,2));
          await browser.close();
          if(!o.pass)process.exitCode=1;
          JS
          node m170-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m170-live-production-repair-screen-captures
          path: artifacts/m170-live/
          retention-days: 14
