name: Earthline property control audit 16968
on:
  push:
    branches: [report-map-candidate-16967]
    paths:
      - '.github/workflows/property-control-audit-16968.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: report-map-candidate-16967
      - name: Find authoritative Property control
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          s=re.sub(r'<!--.*?-->','',s,flags=re.S)
          terms=["setPropertyTarget16201","PROPERTY ANALYSIS","20 ACRES","runPropertyDirect","EARTHLINE_PROPERTY_TARGET_16201","data-action=\"property","propertyTargetMarkup16871"]
          for term in terms:
              print("\n== "+term+" ==")
              for m in list(re.finditer(re.escape(term),s,re.I))[:20]:
                  print(s[max(0,m.start()-1200):min(len(s),m.end()+2400)].replace("\n"," ")+"\n---")
          PY
