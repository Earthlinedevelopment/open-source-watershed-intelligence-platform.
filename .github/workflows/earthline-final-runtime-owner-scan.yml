name: Earthline Final Runtime Owner Scan
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-final-owner-scan-trigger']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files=[Path('index.html'),Path('earthline-launch-16872.js')]
          patterns=['MutationObserver','setInterval(','styledata','style.load','idle','Vermont','New Zealand','Alaska','Vancouver','Thailand','Laos','Vietnam','India','Australia']
          for p in files:
            s=p.read_text(encoding='utf-8').splitlines()
            print('\nFILE',p)
            for pat in patterns:
              hits=[(i,l) for i,l in enumerate(s,1) if pat.lower() in l.lower()]
              print(f'PATTERN {pat} COUNT {len(hits)}')
              for i,l in hits[:25]:
                print(f'{i}: {l[:1000]}')
          PY
