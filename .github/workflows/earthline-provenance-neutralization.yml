name: Earthline Provenance Neutralization
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-provenance-fix-trigger']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reps={
            "const aqSource=gw.mappedMaterial?'Vermont ANR mapped aquifer-material geometry':(gw.nearbyWells?'VT ANR Well Driller Reports · point observations, not mapped extent; score uses Earthline aquifer fallback':'Earthline aquifer fallback; no fine-scale mapped aquifer material active');":
            "const aqSource=gw.mappedMaterial?'Mapped aquifer-material geometry active for this run':(gw.nearbyWells?'Groundwater well records · point observations, not mapped extent; score uses Earthline aquifer fallback':'Earthline aquifer fallback; no fine-scale mapped aquifer material active');",
            "if(t==='property'&&gw.nearbyWells)rows.push({label:'VT ANR Well Driller Reports',scale:'point',vintage:'updated nightly'});":
            "if(t==='property'&&gw.nearbyWells)rows.push({label:'Groundwater well records',scale:'point observations',vintage:'current run'});",
            "if(t==='property'&&gw.mappedMaterial)rows.push({label:'Vermont ANR mapped aquifer materials',scale:'mapped polygon context',vintage:'current service'});":
            "if(t==='property'&&gw.mappedMaterial)rows.push({label:'Mapped aquifer-material geometry',scale:'mapped polygon context',vintage:'current run'});",
            'detail=acquisitionResult==="clear"?"Authoritative Vermont E911 / VCGI sources were queried successfully and returned no mapped driveway/building exclusions in this 20-acre frame.":"Authoritative Vermont E911 / VCGI road, driveway and building evidence was applied to the Property exclusion mask.";':
            'detail=acquisitionResult==="clear"?"An authoritative local exclusion source was queried successfully and returned no mapped driveway/building exclusions in this 20-acre frame.":"Authoritative local road, driveway and building evidence was applied to the Property exclusion mask.";'
          }
          changed=0
          for old,new in reps.items():
            n=s.count(old)
            if n!=1:
              raise SystemExit(f'expected exactly 1 match, found {n}: {old[:90]}')
            s=s.replace(old,new,1); changed+=1
          p.write_text(s,encoding='utf-8')
          print('EARTHLINE_PROVENANCE_NEUTRALIZED',changed)
          bad=['VT ANR Well Driller Reports','Vermont ANR mapped aquifer materials','Authoritative Vermont E911 / VCGI']
          for b in bad:
            if b in s:
              raise SystemExit('hardcoded provenance remains: '+b)
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue; new Function(m[1]);
          }
          console.log('EARTHLINE_PROVENANCE_SCRIPT_PARSE_OK');
          NODE
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Earthline Stability Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "stability: make evidence labels provenance-neutral"
          git push origin HEAD:recovery/mantra74-stability
