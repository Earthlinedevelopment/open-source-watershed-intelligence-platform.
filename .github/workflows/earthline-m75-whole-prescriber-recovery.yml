name: Earthline M75 Whole Prescriber Recovery
on:
  push:
    branches: [main]
    paths:
      - lab/restore-16785-prescriber-owner.py
      - .github/workflows/earthline-m75-whole-prescriber-recovery.yml
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Fetch whole-owner restore tool
        run: |
          git fetch origin main recovery/mantra75-owner-rollback
          git show origin/main:lab/restore-16785-prescriber-owner.py > /tmp/restore-owner.py
      - name: Restore complete 16785 prescriber owner
        run: |
          python3 /tmp/restore-owner.py
          git diff --check
      - name: Parse-check current page
        run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          console.log('OWNER_RESTORE_PARSE_OK',parsed);
          NODE
      - name: Commit isolated recovery branch
        run: |
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "recovery: restore full proven 16785 prescriber owner"
          git push --force-with-lease origin HEAD:recovery/mantra75-owner-rollback
