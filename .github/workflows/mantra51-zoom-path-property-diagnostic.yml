name: Mantra 51 Zoom Path Property Diagnostic
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths: ['lab/mantra51-zoom-path-property-diagnostic.mjs']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: mantra51-global-repair-campaign}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node lab/mantra51-zoom-path-property-diagnostic.mjs
