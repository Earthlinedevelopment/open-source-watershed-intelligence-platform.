name: Materialize Earthline Hotfix 17532
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/materialize-earthline-hotfix-17532.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/earthline-launch-17532, fetch-depth: 0}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/apply-single-property-elder-owner-17532.py > /tmp/apply.py
          python3 /tmp/apply.py
          node --check earthline-elder-worker-17129.js
          node --check earthline-launch-16872.js
      - run: |
          git config user.name "Earthline CI"
          git config user.email "info@earthlinedevelopment.org"
          git add earthline-elder-worker-17129.js earthline-launch-16872.js
          git commit -m "candidate: single Property Elder owner 17532"
          git push origin HEAD:candidate/earthline-launch-17532
