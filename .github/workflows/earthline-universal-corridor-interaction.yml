name: Earthline Universal Corridor Interaction
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['tools/mantra74-universal-corridor-interaction.py']
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          fetch-depth: 0
      - run: python3 tools/mantra74-universal-corridor-interaction.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "earthline-alaska-map-interaction-16921" index.html
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1])}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          console.log('EARTHLINE_17691_UNIVERSAL_CORRIDOR_INTERACTION_OK');
          NODE
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Earthline Stability Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git rm -f tools/mantra74-universal-corridor-interaction.py .github/workflows/earthline-universal-corridor-interaction.yml
          git add index.html
          git commit -m "stability: use shared corridor interaction in Alaska"
          git push origin HEAD:recovery/mantra74-stability
