name: Mantra 83 Deploy Elder First Run
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/earthline-mantra83-deploy-elder-first-run.yml'
      - 'tests/mantra83-fix-elder-property-first-run.mjs'
permissions:
  contents: write
concurrency:
  group: mantra83-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra83-shadow-live
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cp tests/mantra83-fix-elder-property-first-run.mjs /tmp/fix-elder-first-run.mjs
      - run: git fetch origin pages-live
      - run: git checkout -B pages-live origin/pages-live
      - run: node /tmp/fix-elder-first-run.mjs
      - run: node --check earthline-elder-restored-17097.js
      - run: |
          git config user.name "earthline-ci"
          git config user.email "actions@users.noreply.github.com"
          git add earthline-elder-restored-17097.js
          git diff --cached --quiet || git commit -m "repair: compute Elder evidence on first Property run"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
