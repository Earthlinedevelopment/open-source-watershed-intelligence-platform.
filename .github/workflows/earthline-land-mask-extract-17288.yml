name: Earthline Land Mask Extract 17288
on:
  push:
    branches: [diag/browser-scale-profile-17287]
    paths:
      - '.github/workflows/earthline-land-mask-extract-17288.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/browser-scale-profile-17287
      - name: Extract land validity mask
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['function earthlineLandValidityMask16584','function earthlineLandValidityContext16584','earthlineLoadedStyleWaterIndex16584']:
              i=s.find(needle)
              print('\n===== '+needle+' @ '+str(i)+' =====')
              if i>=0: print(s[max(0,i-5000):i+30000])
          PY
