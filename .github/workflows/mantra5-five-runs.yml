name: Mantra 5 Iowa five-run OSM acceptance
on:
  push:
    branches: [repair/mantra5-osm-20261113]
    paths:
      - index.html
      - tests/mantra5-osm-five-runs.mjs
      - .github/workflows/mantra5-five-runs.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Five independent Iowa Property tests from candidate HTML
        run: node tests/mantra5-osm-five-runs.mjs
      - name: Attach logs and screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mantra5-iowa-five-runs
          path: artifacts/mantra5-five-runs/
          retention-days: 30
          if-no-files-found: warn
      - name: Record five-run acceptance and fast-forward GitHub Pages only on PASS
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "ee4367e056f431b5ff2d169fa18e7039866efd5d" HEAD
          test -s artifacts/mantra5-five-runs/results.json
          mkdir -p docs
          cp artifacts/mantra5-five-runs/results.json docs/MANTRA5-FIVE-RUN-RESULT.json
          git config user.name "Earthline Acceptance Gate"
          git config user.email "info@earthlinedevelopment.org"
          git add docs/MANTRA5-FIVE-RUN-RESULT.json
          git commit -m "test(mantra5): record five matching Iowa Property results"
          live_head="$(git ls-remote origin refs/heads/pages-live | cut -f1)"
          test "$live_head" = "c7d98bc7da30b93ceaf170d3828eb4dbc8fbaf5a"
          git push origin HEAD:refs/heads/repair/mantra5-osm-20261113
          git push origin HEAD:refs/heads/pages-live
          echo "MANTRA5_LIVE_PROMOTION_SUCCESS $(git rev-parse HEAD)"
