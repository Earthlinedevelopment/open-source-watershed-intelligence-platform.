name: Mantra 5 Iowa five-run OSM acceptance
on:
  push:
    branches: [repair/mantra5-osm-20261113]
    paths:
      - index.html
      - tests/mantra5-osm-five-runs.mjs
      - .github/workflows/mantra5-five-runs.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Five independent Iowa Property tests from candidate HTML
        run: node tests/mantra5-osm-five-runs.mjs
      - name: Attach logs and screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mantra5-iowa-five-runs
          path: artifacts/mantra5-five-runs/
          retention-days: 30
          if-no-files-found: warn
      - name: Record five-run verdict without production promotion
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "ee4367e056f431b5ff2d169fa18e7039866efd5d" HEAD
          test -s artifacts/mantra5-five-runs/results.json
          node -e "const r=require('./artifacts/mantra5-five-runs/results.json'); if(r.length!==5||!r.every(x=>x.conclusion==='COMPLETE'))process.exit(1);console.log('MANTRA6_CANDIDATE_ACCEPTANCE_ONLY; NO DEPLOY',r.map(x=>x.measured.publishedSwales))"
