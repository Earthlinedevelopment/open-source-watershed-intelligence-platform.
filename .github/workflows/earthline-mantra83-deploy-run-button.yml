name: Mantra 83 Deploy Run Button Correction
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/earthline-mantra83-deploy-run-button.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mantra83-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra83-shadow-live
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          cp tests/mantra83-fix-run-button-suggestion-overlap.mjs /tmp/fix-run.mjs
          git fetch origin pages-live
          git checkout -B pages-live origin/pages-live
          node /tmp/fix-run.mjs
          git config user.name "earthline-ci"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "ui: keep search suggestions clear of Run Analysis"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
