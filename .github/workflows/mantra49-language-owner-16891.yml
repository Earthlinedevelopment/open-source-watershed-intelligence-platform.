name: Earthline language owner 16891
on:
  push:
    branches: [mantra49-language-owner-repair-16891]
    paths:
      - earthline-language-hotfix-16890.js
      - .github/workflows/mantra49-language-owner-16891.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra49-language-owner-repair-16891
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install playwright@1.55.0 --no-save
      - name: Verify exact language ownership and late run repaint
        run: |
          cat > language-16891-test.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          const hotfix=fs.readFileSync('earthline-language-hotfix-16890.js','utf8');
          const E={en:['Search','Property Modelling','Bioswale Impact Report','Status','Results'],th:['ค้นหา','การจำลองพื้นที่','รายงานผลกระทบร่องชีวภาพ','สถานะ','ผลลัพธ์'],es:['Buscar','Modelado de propiedad','Informe de impacto de bioswales','Estado','Resultados'],vi:['Tìm kiếm','Mô hình hóa khu đất','Báo cáo tác động rãnh sinh học','Trạng thái','Kết quả']};
          async function snap(p){return p.evaluate(()=>({tabs:[document.querySelector('#earthlineSearchSection16188 .el-panel-label-16188')?.textContent?.trim(),document.querySelector('#earthlinePropertySection16188 .el-panel-label-16188')?.textContent?.trim(),document.querySelector('#earthlineReportSection16188 .el-panel-label-16188')?.textContent?.trim(),document.querySelector('#earthlineStatusSection16188 .el-panel-label-16188')?.textContent?.trim(),document.querySelector('#earthlineResultsSection16188 .el-panel-label-16188')?.textContent?.trim()],run:document.querySelector('#runBtn')?.textContent?.replace(/\s+/g,' ').trim(),lang:document.documentElement.lang,value:document.querySelector('#earthlineLanguage16488')?.value}));}
          function ck(code,s){if(JSON.stringify(s.tabs)!==JSON.stringify(E[code]))throw Error(code+' tabs '+JSON.stringify(s));if(s.lang!==code||s.value!==code)throw Error(code+' authority '+JSON.stringify(s));}
          (async()=>{const b=await chromium.launch({headless:true,executablePath:'/usr/bin/chromium',args:['--no-sandbox']});const c=await b.newContext({viewport:{width:1600,height:900}});const p=await c.newPage();await p.route('https://earthlinedevelopment.org/earthline-language-hotfix-16890.js*',r=>r.fulfill({status:200,contentType:'application/javascript',body:hotfix}));await p.goto('https://earthlinedevelopment.org/?lang16891='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});await p.waitForSelector('#earthlineLanguage16488',{timeout:30000});await p.waitForTimeout(1800);for(const code of ['en','th','en','es','en','vi','en']){await p.selectOption('#earthlineLanguage16488',code);await p.waitForTimeout(400);const s=await snap(p);console.log(code,s);ck(code,s);}await p.selectOption('#earthlineLanguage16488','th');await p.evaluate(()=>{document.getElementById('runBtn').textContent='RUN REGION'});await p.waitForTimeout(100);let s=await snap(p);if(s.run!=='เรียกใช้ภูมิภาค')throw Error('late RUN REGION not translated '+JSON.stringify(s));await p.reload({waitUntil:'domcontentloaded',timeout:60000});await p.waitForSelector('#earthlineLanguage16488');await p.waitForTimeout(1800);s=await snap(p);console.log('reload-th',s);ck('th',s);if(!['เรียกใช้ภูมิภาค','เรียกใช้การวิเคราะห์','เรียกใช้พื้นที่','เรียกใช้การวิเคราะห์ก่อน'].includes(s.run))throw Error('reload Thai run state untranslated '+JSON.stringify(s));await b.close();console.log('LANGUAGE 16891 CANDIDATE PASS')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node language-16891-test.js
