name: M191 Iowa authoritative road-stream fallback probe
on:
  push:
    branches: ['repair/m191-ernst-creek-osm-recovery']
    paths: ['.github/workflows/m191-iowa-stream-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import requests,json,time
          ua={'User-Agent':'Earthline-Hydrology-Research/0.1 (contact info@earthlinedevelopment.org; nonprofit watershed screening)'}
          bbox=[-93.3925,41.9555,-93.387,41.9595]
          services={
           'Iowa DNR Streams':'https://services2.arcgis.com/r6iFVcMJeA4kB4GC/arcgis/rest/services/Iowa_Streams_WFL1/FeatureServer/0',
           'Iowa Roads 2017':'https://services2.arcgis.com/r6iFVcMJeA4kB4GC/arcgis/rest/services/Iowa_Roads_2017_gdb/FeatureServer/0',
           'Ames Rivers Streams':'https://services.arcgis.com/GM5KudYVoaALNBe2/ArcGIS/rest/services/RIVERS___STREAMS/FeatureServer/0'
          }
          params={'where':'1=1','geometry':','.join(map(str,bbox)),'geometryType':'esriGeometryEnvelope','inSR':4326,'spatialRel':'esriSpatialRelIntersects','outSR':4326,'returnGeometry':'true','outFields':'*','f':'geojson','resultRecordCount':100}
          for name,url in services.items():
            t=time.monotonic()
            try:
              r=requests.get(url+'/query',params=params,headers=ua,timeout=18)
              info={'service':name,'status':r.status_code,'bytes':len(r.content),'sec':round(time.monotonic()-t,2),'head':r.text[:110]}
              try:
                j=r.json()
                info['features']=len(j.get('features',[]));info['error']=j.get('error')
                info['geometry']= [z.get('geometry',{}).get('type') for z in j.get('features',[])][:10]
                info['names']=[z.get('properties',{}).get('Name') or z.get('properties',{}).get('NAME') for z in j.get('features',[])][:10]
              except:pass
              print('M191_IA '+json.dumps(info),flush=True)
            except Exception as e:print('M191_IA '+json.dumps({'service':name,'exception':str(e)}),flush=True)
          PY
