name: Earthline M75 Clean Property Engine Repair
on:
  push:
    branches: [recovery/mantra74-stability]
    paths:
      - .github/workflows/earthline-m75-clean-property-engine-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-engine-clean
          fetch-depth: 0
      - name: Apply Property prescription repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(errors='strict')
          pairs=[
            (
              "const minSegmentM=earthlineMinimumSwaleLengthM15768();",
              """const minSegmentM=isRegionalTile15769
      ? earthlineMinimumSwaleLengthM15768()
      : Math.max(24,earthlineMinimumSwaleLengthM15768());"""
            ),
            (
              """      (Number(b.seedFlowCrossing15833||0)-Number(a.seedFlowCrossing15833||0)) ||
      ((b.score||0)-(a.score||0)) ||""",
              """      (Number(b.seedFlowCrossing15833||0)-Number(a.seedFlowCrossing15833||0)) ||
      (earthlineSegmentLengthM(b.pts||[])-earthlineSegmentLengthM(a.pts||[])) ||
      ((b.score||0)-(a.score||0)) ||"""
            ),
            (
              "        if(sw.bandKey===ex.bandKey)continue;\n",
              ""
            )
          ]
          for i,(old,new) in enumerate(pairs,1):
              n=s.count(old)
              if n!=1: raise SystemExit(f'PATCH_{i}_COUNT={n}')
              s=s.replace(old,new,1)
          p.write_text(s)
          print('EARTHLINE_M75_PROPERTY_ENGINE_REPAIR_OK')
          PY
      - name: Parse-check
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          console.log('EARTHLINE_M75_PROPERTY_ENGINE_PARSE_OK',parsed);
          NODE
      - name: Commit clean engine repair
        shell: bash
        run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: favor continuous buildable Property swales"
          git push origin HEAD:recovery/mantra75-engine-clean
