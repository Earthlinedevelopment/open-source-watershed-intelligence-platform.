name: Earthline Percentile Hotpath Diagnostic 17246
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - '.github/workflows/earthline-property-coverage-diag-17223.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Extract percentile owner and call sites
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for term in ['function percentile','const percentile','percentile=']:
              p=s.find(term)
              print('\n### '+term+' @ '+str(p))
              if p>=0: print(s[max(0,p-5000):p+12000])
          print('\nCOUNT percentile(',s.count('percentile('))
          PY
