name: Earthline Contour Swale Hotpath Diagnostic 17243
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - '.github/workflows/earthline-property-coverage-diag-17223.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Extract makeContours and makeSwales
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for term in ['async function makeContours','function makeContours','async function makeSwales','function makeSwales']:
              print('\n### '+term)
              start=0
              for n in range(3):
                  p=s.find(term,start)
                  if p<0: break
                  print('\n===== @ '+str(p)+' =====\n')
                  print(s[max(0,p-4000):p+42000])
                  start=p+len(term)
          PY
