name: Earthline Property Coverage Diagnostic 17223
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - '.github/workflows/earthline-property-coverage-diag-17223.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - name: Inspect Property final ordering and repeat-state reset
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          patterns=[
            r'ordered',r'final-cap',r'candidateTermination15803',r'seedsVisited15803',
            r'flowFirstAudit15836',r'claimMask',r'coverageDiag15803',r'M\.swales=\[\]',
            r'M\.analysisBoundaryLngLat=',r'propertyRunState',r'duplicate-rerun'
          ]
          for pat in patterns:
              print('\n===== '+pat+' =====')
              hits=[m.start() for m in re.finditer(pat,s)]
              print('count',len(hits),'positions',hits[:30])
              for p in hits[:12]:
                  print('\n---',p,'---\n'+s[max(0,p-2600):p+7200])
          PY
