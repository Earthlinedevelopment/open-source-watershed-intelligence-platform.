name: Earthline Regional Refinement Owner Diagnostic 17241
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - '.github/workflows/earthline-property-coverage-diag-17223.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Extract expensive Regional refinement owners
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=[
            'EARTHLINE 16841',
            'supertile',
            'productsBeforeFlowMs',
            'EARTHLINE 16782',
            'coverageGap',
            'scaleRefined',
            'earthlineRefine',
            'refinementTiming',
            'targetCandidates'
          ]
          seen=set()
          for term in terms:
              start=0
              while True:
                  p=s.find(term,start)
                  if p<0: break
                  key=(term,p)
                  if key not in seen:
                      seen.add(key)
                      print('\n===== '+term+' @ '+str(p)+' =====\n')
                      print(s[max(0,p-12000):p+26000])
                  start=p+len(term)
                  if len([x for x in seen if x[0]==term])>=5: break
          PY
