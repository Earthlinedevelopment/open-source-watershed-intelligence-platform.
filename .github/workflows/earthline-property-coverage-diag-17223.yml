name: Earthline Property Coverage Diagnostic 17223
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - '.github/workflows/earthline-property-coverage-diag-17223.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - name: Extract exact Property extent code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=[
            'requestedCellM=',
            'requestedCellM =',
            'M.requestedCellM',
            'M.inP=',
            'M.inP =',
            'analysisBoundaryLngLat=[',
            'analysisBoundaryLngLat = [',
            'Math.sqrt(areaM2*1.15)',
            'wM=Math.sqrt',
            'hM=areaM2/wM',
            'GW*.82',
            'GH*.82',
            'inP[i]',
            'inP[idx',
            'pointIn',
            'analysisBoundary'
          ]
          for needle in needles:
              print('\n===== '+needle+' =====')
              pos=[]; start=0
              while True:
                  p=s.find(needle,start)
                  if p<0: break
                  pos.append(p);start=p+len(needle)
              print('count',len(pos),'positions',pos[:20])
              for p in pos[:12]:
                  print('\n---',p,'---\n'+s[max(0,p-1300):p+3200])
          PY
