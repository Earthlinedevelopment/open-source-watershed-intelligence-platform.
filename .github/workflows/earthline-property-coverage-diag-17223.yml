name: Earthline Property Coverage Diagnostic 17223
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - '.github/workflows/earthline-property-coverage-diag-17223.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - name: Inspect Property prescription selection and coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=[
            'M.swCount','swCount','TARGET_M','seedCandidatesForLevel',
            'prescribeSwales','prescribe','candidate','ranked',
            'selected.length','out.length','corridors.length','spacingStats',
            'targetSwaleSpacingM','64'
          ]
          for term in terms:
              print('\n===== '+term+' =====')
              start=0;shown=0
              while shown<12:
                  p=s.find(term,start)
                  if p<0: break
                  block=s[max(0,p-2600):p+9000]
                  if any(k in block for k in ['swale','Swale','corridor','Corridor','seedCandidatesForLevel','spacingStats']):
                      print('\n--- hit',shown,'at',p,'---\n',block[:11600])
                      shown+=1
                  start=p+len(term)
          PY
