name: Earthline Jurisdiction Geometry Diagnostic 17242
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - '.github/workflows/earthline-property-coverage-diag-17223.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Extract jurisdiction geometry hot path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for term in ['function earthlinePointInJurisdiction16539','function earthlinePrepareJurisdiction16539','const scale16722=4','function earthlineClipLine16539','earthlineRing','pointInRing']:
              print('\n### '+term)
              start=0
              for n in range(4):
                  p=s.find(term,start)
                  if p<0: break
                  print('\n===== @ '+str(p)+' =====\n')
                  print(s[max(0,p-9000):p+18000])
                  start=p+len(term)
          PY
