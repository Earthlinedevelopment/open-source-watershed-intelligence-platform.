name: Earthline Property One-Click Diagnostic 17265
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - '.github/workflows/earthline-property-coverage-diag-17223.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Extract exact 20-acre button and Property owners
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          terms=[
            'earthlineDeclareProperty16169',
            'earthlineDeclarePropertyAtCrosshair16173',
            'EARTHLINE_PROPERTY_DECLARATION_16169',
            'EARTHLINE_PROPERTY_TARGET_16201',
            'propertyRunState',
            '20-acre',
            '20 acre',
            'Property search',
            'Property Search',
            'declare property'
          ]
          for term in terms:
              print('\n===== '+term+' =====')
              pos=0;n=0
              while True:
                  i=s.find(term,pos)
                  if i<0: break
                  n+=1
                  print('\n--- HIT',n,'@',i,'---')
                  print(s[max(0,i-7000):i+18000])
                  pos=i+len(term)
                  if n>=12: break
              print('COUNT',n)
          PY
