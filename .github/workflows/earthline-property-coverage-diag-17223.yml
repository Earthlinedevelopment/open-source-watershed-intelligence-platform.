name: Earthline Mexico Repeat Owner Diagnostic 17239
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - '.github/workflows/earthline-property-coverage-diag-17223.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Extract exact Property target and button owners
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          pats=[
            r'function\s+earthlineSetPropertyTarget16201\s*\(',
            r'earthlineSetPropertyTarget16201\s*=',
            r'function\s+earthlineDeclarePropertyAtCrosshair16173\s*\(',
            r'earthlineDeclarePropertyAtCrosshair16173\s*=',
            r'earthlineDeclareProperty16169',
            r'\.onclick\s*=',
            r'EARTHLINE_PROPERTY_TARGET_16201\s*=',
            r'EARTHLINE_COUNTRY_TARGET_LOCK_16845',
            r'function\s+terminalPropertyRun\s*\(',
            r'function\s+action\s*\('
          ]
          for pat in pats:
              print('\n### PATTERN',pat)
              ms=list(re.finditer(pat,s))
              print('COUNT',len(ms))
              for j,m in enumerate(ms[-12:]):
                  p=m.start()
                  print('\n---',j,'@',p,'---')
                  print(s[max(0,p-3500):p+9000])
          PY
