name: Earthline Property Coverage Diagnostic 17223
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - '.github/workflows/earthline-property-coverage-diag-17223.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - name: Extract flow-first and contour candidate loops
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for term in ['flowFirstAudit15836.primaryCandidates++','secondaryFillStarted=','for(let li=0;li<levels.length','acceptedAtLevel','seedCandidatesForLevel(']:
              p=s.find(term)
              print('\n===== '+term+' @ '+str(p)+' =====\n')
              print(s[max(0,p-6500):p+12000] if p>=0 else 'NOT FOUND')
          PY
