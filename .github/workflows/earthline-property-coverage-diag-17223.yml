name: Earthline Property Coverage Diagnostic 17223
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - '.github/workflows/earthline-property-coverage-diag-17223.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - name: Extract exact candidate ordering and cap path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for p in [1417974,1421389,1424847,1425375]:
              print('\n===== POS',p,'=====\n')
              print(s[max(0,p-5000):p+9000])
          PY
