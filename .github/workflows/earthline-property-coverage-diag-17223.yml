name: Earthline Property Coverage Diagnostic 17223
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - '.github/workflows/earthline-property-coverage-diag-17223.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - name: Inspect Property grid, boundary, and prescription extent
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=[
            'M.inP','inP=new','inP = new','GW=','GH=','const GW','let GW',
            'analysisBoundaryLngLat=','analysisBoundaryLngLat =',
            'propertyBoundary','propertyGrid','gridW','gridH','cellM',
            'seedCandidatesForLevel','prescribe','authoritativeSafeSwales15815=',
            'safeSwales15815=','buildProperty','20*4046','4046.856','80937'
          ]
          for term in terms:
              print('\n===== '+term+' =====')
              start=0; shown=0
              while shown<8:
                  p=s.find(term,start)
                  if p<0: break
                  block=s[max(0,p-2200):p+7200]
                  print('\n--- hit',shown,'at',p,'---\n',block[:9400])
                  start=p+len(term); shown+=1
          PY
