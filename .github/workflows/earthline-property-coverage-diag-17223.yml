name: Earthline Property Repeat Diagnostic 17238
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - '.github/workflows/earthline-property-coverage-diag-17223.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Extract Property repeat and target ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=[
            'earthlineDeclarePropertyAtCrosshair16173',
            'earthlineSetPropertyTarget16201',
            'EARTHLINE_PROPERTY_TARGET_16201',
            'earthlineDeclareProperty16169',
            'EARTHLINE_REGIONAL_PROPERTY_HANDOFF_AUDIT_16347',
            'EARTHLINE_PROPERTY_DISPLAY_RECLAIM_16727',
            'EARTHLINE_LOCATION_INTEGRITY_15801',
            'propertyRunState',
            'earthline-property-ready-16188',
            'crosshair',
            'appliedSearchText',
            'searchGenAtSettle'
          ]
          for term in terms:
              p=s.find(term)
              print('\n===== '+term+' @ '+str(p)+' =====\n')
              print(s[max(0,p-9000):p+18000] if p>=0 else 'NOT FOUND')
          PY
