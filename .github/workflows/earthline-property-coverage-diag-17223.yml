name: Earthline Repeat Property Trees Diagnostic 17266
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - '.github/workflows/earthline-property-coverage-diag-17223.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Extract Property repeat and Elder tree lifecycle owners
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=Path('earthline-launch-16872.js').read_text(encoding='utf-8') if Path('earthline-launch-16872.js').exists() else ''
          terms=[
            'EARTHLINE_ELDER_TREES_V1_17097',
            'startProperty',
            'earthline-property',
            'ELDER',
            'elder',
            'tree',
            'searchGen',
            'retirePriorPropertyPresentation16521',
            'publishPropertyDisplay16220',
            'EARTHLINE_PROPERTY_ELDER_EARLY_START_17166'
          ]
          for name,text in [('index.html',s),('earthline-launch-16872.js',js)]:
              print('\n######## '+name+' ########')
              for term in terms:
                  print('\n===== '+term+' =====')
                  pos=0;n=0
                  while True:
                      i=text.find(term,pos)
                      if i<0: break
                      n+=1
                      print('\n--- HIT',n,'@',i,'---')
                      print(text[max(0,i-5000):i+14000])
                      pos=i+len(term)
                      if n>=10: break
                  print('COUNT',n)
          PY
