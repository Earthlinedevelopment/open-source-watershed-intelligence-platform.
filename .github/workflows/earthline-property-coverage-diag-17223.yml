name: Earthline Property Coverage Diagnostic 17223
on:
  push:
    branches: [repair/v1-property-coverage-17223]
    paths:
      - '.github/workflows/earthline-property-coverage-diag-17223.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-property-coverage-17223
      - name: Extract Property final-selection code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for term in ['M.swCount','maxFinal','finalSwales','final.length','accepted.length','spacingTarget','targetSwaleSpacingM']:
              print('\n===== '+term+' =====')
              start=0;i=0
              while True:
                  p=s.find(term,start)
                  if p<0: break
                  print('\n---',i,'at',p,'---\n'+s[max(0,p-2000):p+5000])
                  start=p+len(term);i+=1
                  if i>=20: break
          PY
