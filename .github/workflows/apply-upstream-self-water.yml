name: Apply upstream own swale-water grid exclusion fix
on:
  push:
    branches: [repair/exclude-own-swale-water-layers-20261114]
    paths: [.github/workflows/apply-upstream-self-water.yml]
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "3bce2a315f66d6a55612a9fa01f4a56898a67163"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          needle='const layers=(style.layers||[]).filter(l=>{\n        const id=((l.id||"")+" "+(l["source-layer"]||"")).toLowerCase();'
          assert s.count(needle)==1,s.count(needle)
          replacement='const layers=(style.layers||[]).filter(l=>{\n        /* Self-water display is not authoritative mapped water or a Property no-build source. */\n        if(l.id==="earthline-living-swales-water-15792"||l.id==="earthline-property-safe-water-16221")return false;\n        const id=((l.id||"")+" "+(l["source-layer"]||"")).toLowerCase();'
          s=s.replace(needle,replacement,1)
          assert s.count("Self-water display is not authoritative") == 1
          p.write_text(s)
          print('UPSTREAM PATCH VERIFIED: only two known own-bioswale display water layers excluded; genuine water and roads retained')
          PY
          git diff --check
          git diff --numstat -- index.html
          git rm .github/workflows/apply-upstream-self-water.yml
          git config user.name "Earthline isolated repair"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix(exclusions): exclude self-drawn swale water from upstream grid no-build sampling"
          git push origin HEAD:repair/exclude-own-swale-water-layers-20261114
