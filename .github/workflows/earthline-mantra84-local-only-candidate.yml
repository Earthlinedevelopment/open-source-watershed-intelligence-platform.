name: Mantra 84 Local Only Candidate
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - 'tests/mantra84-local-only-candidate.mjs'
      - '.github/workflows/earthline-mantra84-local-only-candidate.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        client: [chromium, webkit]
        q: [Vermont, Arizona]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLIENT: ${{ matrix.client }}
      Q: ${{ matrix.q }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps ${{ matrix.client }}
      - run: node tests/mantra84-local-only-candidate.mjs
