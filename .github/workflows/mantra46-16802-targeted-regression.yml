name: Mantra 46 16802 Targeted Regression

on:
  push:
    branches:
      - diagnostic-m46-16795-fine-coverage
    paths:
      - 'tests/mantra46-16802-targeted-regression.mjs'
      - '.github/workflows/mantra46-16802-targeted-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run 16802 targeted regression
        run: node tests/mantra46-16802-targeted-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16802-targeted-regression
          path: artifacts/mantra46-16802-targeted-regression/
          if-no-files-found: error
