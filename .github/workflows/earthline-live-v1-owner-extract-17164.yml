name: Earthline V1 Property Camera Inspect 17184
on:
  push:
    branches:
      - research/elder-browser-engine-17129
    paths:
      - .github/workflows/earthline-live-v1-owner-extract-17164.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-stability-17166
          fetch-depth: 1
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8',errors='ignore')
          for term in ['function frameDeclaredProperty','frameDeclaredProperty=', 'fitBounds(', 'easeTo(', 'flyTo(']:
              print('\n===== '+term+' =====')
              p=0
              while True:
                  i=s.find(term,p)
                  if i<0: break
                  print('\n---',i,'---')
                  print(s[max(0,i-3000):min(len(s),i+9000)])
                  p=i+len(term)
          PY
