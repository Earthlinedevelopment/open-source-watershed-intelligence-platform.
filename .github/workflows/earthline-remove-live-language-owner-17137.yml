name: Earthline Remove Live Language Owner 17137
on:
  push:
    branches: [research/elder-browser-engine-17129]
    paths:
      - '.github/workflows/earthline-remove-live-language-owner-17137.yml'
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Remove actual Language owner only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          pattern=re.compile(r"function ensureLanguage\(\)\{[\s\S]*?\nfunction earthlineApplyUiLanguage16871",re.M)
          matches=list(pattern.finditer(s))
          if len(matches)!=1:
              raise SystemExit(f"Expected exactly one ensureLanguage owner, found {len(matches)}")
          replacement="""function ensureLanguage(){const wrap=document.getElementById('earthlineLanguageWrap16488');if(wrap)wrap.remove();return null}
          function earthlineApplyUiLanguage16871"""
          s=pattern.sub(replacement,s,count=1)
          if "wrap=document.createElement('label');wrap.id='earthlineLanguageWrap16488'" in s:
              raise SystemExit("Language creation code still present")
          p.write_text(s,encoding="utf-8")
          print("17137 Language owner removal PASS")
          PY
          git diff --check
          test "$(git diff --name-only)" = "index.html"
      - name: Commit only index owner removal
        shell: bash
        run: |
          git config user.name "earthline-release-bot"
          git config user.email "earthline-release-bot@users.noreply.github.com"
          git add index.html
          git commit -m "ui: remove Language control owner from locked live page 17137"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
