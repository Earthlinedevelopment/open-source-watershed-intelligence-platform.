name: Mantra 126 - publish Regional completion hint after browser proof
on:
  push:
    branches: [pages-live]
    paths:
      - tools/mantra126-regional-hint.py
      - .github/workflows/mantra126-regional-hint.yml
permissions:
  contents: write
concurrency:
  group: earthline-m126-regional-hint
  cancel-in-progress: false
jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch exact hint trigger, protect report
        run: |
          set -euo pipefail
          cp index.html /tmp/previous.html
          python3 tools/mantra126-regional-hint.py
          test "$(git diff --name-only)" = "index.html"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('Place hand cursor over bare land to move map.')==1
          assert s.count('earthlineShowMapHint126();')==1
          assert s.count('reportPlaceLine123(baseData.d)')==1
          assert s.count('reportAquiferContext123(baseData.d)')==1
          print('M126_HINT_REPORT_STATIC_PASS')
          PY
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify hint is absent on home and present after Regional
        shell: bash
        run: |
          mkdir -p artifacts/m126-regional-hint
          cat > artifacts/m126-regional-hint/test.mjs <<'JS'
          import {chromium} from 'playwright';
          import {readFile,writeFile} from 'node:fs/promises';
          const html=await readFile('index.html');
          const b=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
          const p=await b.newPage({viewport:{width:1500,height:950},serviceWorkers:'block'});
          const o={checks:{},errors:[]};p.on('pageerror',e=>o.errors.push(String(e)));
          await p.route('**/*',r=>r.request().isNavigationRequest()&&r.request().resourceType()==='document'?r.fulfill({status:200,contentType:'text/html',body:html}):r.continue());
          try{
            await p.goto('https://earthlinedevelopment.org/?m126candidate=1',{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForSelector('#searchInput',{timeout:30000});
            await p.waitForTimeout(1400);
            o.checks.notOnHome=await p.locator('#earthlineTemporaryMapHint126').count()===0;
            await p.locator('#searchInput').fill('Rutland, Vermont');
            await p.waitForFunction(()=>document.querySelector('#earthlineSearchSuggestions15970')?.classList.contains('open'),null,{timeout:18000});
            await p.locator('#earthlineSearchSuggestions15970 button[data-query]').first().click();
            await p.waitForFunction(()=>!!window.EARTHLINE_LAST_LIVE_REGIONAL_RUN_15970,null,{timeout:110000});
            await p.waitForFunction(()=>document.getElementById('earthlineTemporaryMapHint126')?.textContent==='Place hand cursor over bare land to move map.',null,{timeout:12000});
            o.checks.hintAfterRegional=true;
            o.status=await p.evaluate(()=>document.getElementById('earthlineVermontStatus16147')?.textContent?.slice(0,160));
            o.audit=await p.evaluate(()=>window.EARTHLINE_MAP_HINT_AUDIT_126||null);
            await p.screenshot({path:'artifacts/m126-regional-hint/visible-after-regional.png',timeout:20000});
            o.checks.reportStillPresent=await p.evaluate(()=>typeof window.earthlineOpenVermontReport16151==='function');
            o.checks.noErrors=o.errors.length===0;
          }catch(e){o.failure=String(e)}
          await writeFile('artifacts/m126-regional-hint/result.json',JSON.stringify(o,null,2));
          await b.close();
          console.log('M126_REGIONAL_HINT_RESULT '+JSON.stringify(o));
          if(o.failure||Object.values(o.checks).length<4||Object.values(o.checks).some(x=>!x))process.exitCode=1;
          JS
          node artifacts/m126-regional-hint/test.mjs
      - name: Commit only tested map hint correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(live): show temporary hand-cursor hint after first Regional result'
          git push origin HEAD:pages-live
      - name: Preserve tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m126-regional-hint
          path: artifacts/m126-regional-hint/
          retention-days: 30
