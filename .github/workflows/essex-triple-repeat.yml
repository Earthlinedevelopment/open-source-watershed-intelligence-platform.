name: Essex three-repeat Property swale fingerprint gate
on:
  push:
    branches: [repair/restore-approved-copy-elder-20261114]
    paths: [.github/workflows/essex-triple-repeat.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node tests/essex-triple-property-repeat.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essex-triple-swale-geometry-evidence
          path: artifacts/essex-repeat-diagnostic
          retention-days: 14
