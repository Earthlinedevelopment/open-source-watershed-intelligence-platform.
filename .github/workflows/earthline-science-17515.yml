name: Earthline Science Gate 17515
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/earthline-science-17515.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/earthline-launch-17515, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/science-live-origin-17487.mjs > tests/science-live-origin-17487.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/science-live-origin-17487.mjs
