name: Prepare approved exact-blob Property 4pct candidate
on:
  push:
    branches: [release/approved-4pct-e2c423]
    paths:
      - .github/workflows/earthline-4pct-prepare.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exactly approved candidate from pinned live baseline and remove one-shot writer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,zlib,subprocess
          from pathlib import Path
          before='a46d094cbdc37ecdc49f53a784bdd870c800627a'
          after='e2c423928433e264c4c8f2540d4c2e7fd01ed9ac'
          def blob():return subprocess.check_output(['git','hash-object','index.html'],text=True).strip()
          assert blob()==before, 'SOURCE MISMATCH — no promotion'
          patch=zlib.decompress(base64.b64decode(''))
          subprocess.run(['patch','-p0','--batch','--fuzz=0'],input=patch,check=True)
          assert blob()==after, 'CANDIDATE MISMATCH — no promotion'
          print('EXACT_APPROVED_BLOB',after)
          PY
          git diff --check
          git config user.name 'Earthline approved hotfix'
          git config user.email 'info@earthlinedevelopment.org'
          git add index.html
          git rm .github/workflows/earthline-4pct-prepare.yml
          git commit -m 'fix(property): approved length-weighted 4% rule and steep-ground note'
          git push origin HEAD:release/approved-4pct-e2c423
