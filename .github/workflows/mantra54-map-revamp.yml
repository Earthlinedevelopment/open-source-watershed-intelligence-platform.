name: Earthline Mantra 54 map revamp
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/mantra54-map-revamp.yml'
permissions:
  contents: write
jobs:
  revamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Replace authoritative report map renderer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          new=r'''  function mapSvg(d,small=false){
            const b=reportBounds(d),W=1100,H=small?500:650;
            const mapX=32,mapY=92,mapW=W-64,mapH=H-mapY-32;
            const xSpan=Math.max(.000001,b[2]-b[0]),ySpan=Math.max(.000001,b[3]-b[1]);
            const sx=x=>mapX+(x-b[0])/xSpan*mapW,sy=y=>mapY+mapH-(y-b[1])/ySpan*mapH;
            const pathCoords=coords=>(coords||[]).map((p,i)=>(i?'L':'M')+sx(+p[0]).toFixed(1)+' '+sy(+p[1]).toFixed(1)).join(' ');
            const path=f=>pathCoords(f?.geometry?.coordinates||[]);
            const middle=f=>{const a=f?.geometry?.coordinates||[];const q=a[Math.floor(a.length/2)];return Array.isArray(q)&&q.length>1?q:null};
            const screenLength=f=>{const a=f?.geometry?.coordinates||[];let L=0;for(let i=1;i<a.length;i++){const x1=sx(+a[i-1][0]),y1=sy(+a[i-1][1]),x2=sx(+a[i][0]),y2=sy(+a[i][1]);L+=Math.hypot(x2-x1,y2-y1)}return L};
            const reportContours=contours().filter(f=>f?.geometry?.type==='LineString').slice(0,220);
            const reportFlows=flows().filter(f=>f?.geometry?.type==='LineString').slice(0,240);
            const rows=graded(),counts={A:rows.filter(r=>r.grade==='A').length,B:rows.filter(r=>r.grade==='B').length,C:rows.filter(r=>r.grade==='C').length};
            const aquiferFeatures=reportAquifers();
            const reportPlace=String(d?.query||d?.location||d?.placeName||'Analysis Area').trim(),reportTier=String(d?.tier||d?.mode||'regional').toLowerCase(),title=reportPlace||'Analysis Area';
            const flowRank=reportFlows.map(f=>({f,L:screenLength(f)})).sort((a,b)=>b.L-a.L),primaryCount=Math.min(small?26:42,flowRank.length),primary=new Set(flowRank.slice(0,primaryCount).map(x=>x.f));
            const lonSpan=Math.max(.0001,b[2]-b[0]),midLat=(b[1]+b[3])/2,kmWide=lonSpan*111.32*Math.cos(midLat*Math.PI/180);
            const niceKm=kmWide>300?100:kmWide>120?50:kmWide>50?20:kmWide>20?10:kmWide>8?5:kmWide>3?2:1,barPx=Math.max(54,Math.min(170,niceKm/kmWide*mapW));
            const clipId='elReportClip16965',aqPat='elAquifer16965',parts=[];
            parts.push('<svg class="el-report-landscape-board-16965" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc('Earthline '+title+' landscape water plan')+'">');
            parts.push('<defs><linearGradient id="elTerrain16965" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf3"/><stop offset=".48" stop-color="#f0f2e8"/><stop offset="1" stop-color="#e7ece1"/></linearGradient><pattern id="'+aqPat+'" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(31)"><rect width="11" height="11" fill="#e89543" fill-opacity=".22"/><path d="M0 0 V11" stroke="#bd641f" stroke-width=".7" stroke-opacity=".30"/></pattern><clipPath id="'+clipId+'"><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="3"/></clipPath><marker id="elWaterArrow16965" markerWidth="5" markerHeight="5" refX="4.1" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L5 2.5 L0 5 Z" fill="#1f78a0" opacity=".82"/></marker></defs>');
            parts.push('<rect width="'+W+'" height="'+H+'" fill="#f4f1e8"/><rect width="'+W+'" height="76" fill="#203a33"/><rect y="76" width="'+W+'" height="4" fill="#55bde0"/><text x="'+mapX+'" y="31" fill="#fff" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="850">'+esc(title)+'</text><text x="'+mapX+'" y="56" fill="#c7d7d0" font-family="Noto Sans,Arial,sans-serif" font-size="8.5" font-weight="760" letter-spacing="1.45">LANDSCAPE WATER PLAN · SLOW IT · SINK IT · SPREAD IT</text><text x="'+(W-34)+'" y="32" text-anchor="end" fill="#fff" font-family="Noto Sans,Arial,sans-serif" font-size="8.2" font-weight="850" letter-spacing="1.2">EARTHLINE</text><text x="'+(W-34)+'" y="54" text-anchor="end" fill="#c7d7d0" font-family="Noto Sans,Arial,sans-serif" font-size="6.8" font-weight="700" letter-spacing=".8">'+esc(reportTier.toUpperCase())+' SCREENING</text>');
            parts.push('<rect x="'+(mapX-5)+'" y="'+(mapY-5)+'" width="'+(mapW+10)+'" height="'+(mapH+10)+'" rx="5" fill="#fff" fill-opacity=".76" stroke="#c1c7bf" stroke-width=".8"/><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="3" fill="url(#elTerrain16965)" stroke="#9da9a0" stroke-width=".8"/><g clip-path="url(#'+clipId+')">');
            for(let i=0;i<reportContours.length;i+=9){const dp=path(reportContours[i]);if(!dp)continue;parts.push('<path d="'+dp+'" transform="translate(2 2.2)" fill="none" stroke="#5d7065" stroke-width="15" opacity=".025" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" transform="translate(-1.4 -1.6)" fill="none" stroke="#fff" stroke-width="8" opacity=".22" stroke-linecap="round" vector-effect="non-scaling-stroke"/>')}
            for(const f of aquiferFeatures){const g=f&&f.geometry;if(!g)continue;const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];for(const poly of polys){const rings=poly.filter(r=>Array.isArray(r)&&r.length>=3);if(!rings.length)continue;const dp=rings.map(r=>pathCoords(r)+' Z').join(' ');parts.push('<path d="'+dp+'" fill="url(#'+aqPat+')" fill-rule="evenodd" stroke="#bc621f" stroke-width="1.1" opacity=".96" vector-effect="non-scaling-stroke"/>')}}
            for(let i=0;i<reportContours.length;i++){const dp=path(reportContours[i]);if(!dp)continue;const major=i%8===0;parts.push('<path d="'+dp+'" fill="none" stroke="'+(major?'#69766e':'#929b94')+'" stroke-width="'+(major?'.56':'.26')+'" opacity="'+(major?'.27':'.10')+'" vector-effect="non-scaling-stroke"/>')}
            for(const f of reportFlows){if(primary.has(f))continue;const dp=path(f);if(dp)parts.push('<path d="'+dp+'" fill="none" stroke="#6f9bae" stroke-width=".55" opacity=".16" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>')}
            let pfi=0;for(const x of flowRank.slice(0,primaryCount)){const dp=path(x.f);if(!dp)continue;parts.push('<path d="'+dp+'" fill="none" stroke="#f8f7ef" stroke-width="4.2" opacity=".88" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#1f78a0" stroke-width="1.35" opacity=".90" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"'+(pfi++%6===0?' marker-end="url(#elWaterArrow16965)"':'')+'/>')}
            const drawSwale=r=>{const dp=path(r.f);if(!dp)return;if(r.grade==='C'){parts.push('<path d="'+dp+'" fill="none" stroke="#8c8068" stroke-width=".7" opacity=".20" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');return}if(r.grade==='B'){parts.push('<path d="'+dp+'" fill="none" stroke="#fffdf7" stroke-width="8.5" opacity=".72" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#cddbc4" stroke-width="6" opacity=".52" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#607553" stroke-width="1.05" opacity=".76" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');return}parts.push('<path d="'+dp+'" fill="none" stroke="#fffdf7" stroke-width="15" opacity=".94" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#b8cfac" stroke-width="10.5" opacity=".76" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#315c3d" stroke-width="1.5" opacity=".98" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" transform="translate(-1.25 -1.25)" fill="none" stroke="#62abc0" stroke-width=".62" opacity=".92" stroke-dasharray="2 2.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" transform="translate(1.25 1.25)" fill="none" stroke="#62abc0" stroke-width=".62" opacity=".92" stroke-dasharray="2 2.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>')};
            for(const r of rows.filter(r=>r.grade==='C'))drawSwale(r);for(const r of rows.filter(r=>r.grade==='B'))drawSwale(r);for(const r of rows.filter(r=>r.grade==='A'))drawSwale(r);
            let ai=0;for(const r of rows.filter(r=>r.grade==='A').slice(0,12)){const q=middle(r.f);if(!q)continue;const x=sx(+q[0]),y=sy(+q[1]),lab='A'+(++ai);parts.push('<g><rect x="'+(x-12).toFixed(1)+'" y="'+(y-7).toFixed(1)+'" width="24" height="13" rx="6.5" fill="#f7f6ef" stroke="#617a67" stroke-width=".7"/><text x="'+x.toFixed(1)+'" y="'+(y+2).toFixed(1)+'" text-anchor="middle" fill="#2f4f3a" font-family="Noto Sans,Arial,sans-serif" font-size="6.7" font-weight="850">'+lab+'</text></g>')}
            parts.push('</g>');
            parts.push('<g transform="translate('+(mapX+18)+','+(mapY+mapH-22)+')"><path d="M0 0 H'+barPx+'" stroke="#3f5149" stroke-width="1.5"/><path d="M0 -4 V4 M'+barPx+' -4 V4" stroke="#3f5149" stroke-width=".9"/><text x="'+(barPx/2)+'" y="13" text-anchor="middle" fill="#56645e" font-family="Noto Sans,Arial,sans-serif" font-size="6.7" font-weight="700">'+niceKm+' km</text></g>');
            parts.push('<g transform="translate('+(mapX+mapW-48)+','+(mapY+20)+')"><circle cx="12" cy="13" r="20" fill="#fffdf8" fill-opacity=".88" stroke="#aab4ac" stroke-width=".7"/><text x="12" y="-1" text-anchor="middle" fill="#294239" font-family="Noto Sans,Arial,sans-serif" font-size="7.7" font-weight="850">N</text><path d="M12 4 V31" stroke="#294239" stroke-width="1"/><path d="M12 4 L6 16 L12 12 L18 16 Z" fill="#294239"/></g>');
            if(!small){const lx=mapX+mapW-268,ly=mapY+mapH-174;parts.push('<g transform="translate('+lx+','+ly+')"><rect width="250" height="156" rx="5" fill="#fffef9" fill-opacity=".94" stroke="#bcc5bd" stroke-width=".7"/><text x="16" y="23" fill="#203a33" font-family="Noto Sans,Arial,sans-serif" font-size="8.7" font-weight="850" letter-spacing=".9">PLAN KEY</text><path d="M16 33 H234" stroke="#55bde0" stroke-width="1.4"/><rect x="16" y="48" width="24" height="10" rx="1" fill="url(#'+aqPat+')" stroke="#bc621f" stroke-width=".7"/><text x="50" y="56" fill="#45564f" font-family="Noto Sans,Arial,sans-serif" font-size="6.8" font-weight="720">Aquifer field</text><path d="M16 76 H40" stroke="#1f78a0" stroke-width="1.35"/><text x="50" y="79" fill="#45564f" font-family="Noto Sans,Arial,sans-serif" font-size="6.8" font-weight="720">Primary water path</text><path d="M135 52 H160" stroke="#b8cfac" stroke-width="9" opacity=".78" stroke-linecap="round"/><path d="M135 52 H160" stroke="#315c3d" stroke-width="1.4"/><text x="170" y="55" fill="#45564f" font-family="Noto Sans,Arial,sans-serif" font-size="6.8" font-weight="720">A · priority</text><path d="M135 77 H160" stroke="#cddbc4" stroke-width="5.8" opacity=".62" stroke-linecap="round"/><path d="M135 77 H160" stroke="#607553" stroke-width="1"/><text x="170" y="80" fill="#45564f" font-family="Noto Sans,Arial,sans-serif" font-size="6.8" font-weight="720">B · strong</text><path d="M16 104 H40" stroke="#8c8068" stroke-width=".7" opacity=".55"/><text x="50" y="107" fill="#45564f" font-family="Noto Sans,Arial,sans-serif" font-size="6.8" font-weight="720">C · context</text><path d="M135 104 H160" stroke="#76837b" stroke-width=".55"/><text x="170" y="107" fill="#45564f" font-family="Noto Sans,Arial,sans-serif" font-size="6.8" font-weight="720">Contour</text><text x="16" y="136" fill="#7a837e" font-family="Noto Sans,Arial,sans-serif" font-size="5.9">Corridor width is symbolic · field verification required</text></g>')}
            parts.push('</svg>');return parts.join('');
          }
          '''
          pat=r"  function mapSvg\(d,small=false\)\{.*?\n\s*function gradeSummary"
          m=re.search(pat,s,flags=re.S)
          if not m:
              raise SystemExit("mapSvg boundary not found")
          replacement=new+"function gradeSummary"
          s,n=re.subn(pat,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f"expected 1 mapSvg replacement, got {n}")
          s=s.replace("blue lines show modeled surface-water movement","blue hierarchy shows primary and secondary modeled surface-water movement")
          p.write_text(s,encoding="utf-8")
          print("mapSvg 16965 installed")
          PY
      - name: Validate and commit
        shell: bash
        run: |
          grep -q "el-report-landscape-board-16965" index.html
          grep -q "LANDSCAPE WATER PLAN · SLOW IT · SINK IT · SPREAD IT" index.html
          git config user.name "Earthline Mantra 54"
          git config user.email "info@earthlinedevelopment.org"
          git rm .github/workflows/mantra54-map-revamp.yml
          git add index.html
          git commit -m "fix: rebuild report map as landscape water plan 16965"
          git push origin pages-live
