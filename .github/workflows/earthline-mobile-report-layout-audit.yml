name: Earthline Mobile Report Layout Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.github/workflows/earthline-mobile-report-layout-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          echo "=== PANEL CSS ==="
          grep -n -E "#earthlinePanel16188|#earthlinePanelBody16188|earthline-panel-open-16188|earthlineReportSection16188|earthlineReportSlot16188" index.html | head -120
          echo "=== MOBILE CSS CONTEXT ==="
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          hits=[i for i,l in enumerate(lines) if '#earthlinePanel16188' in l or '#earthlinePanelBody16188' in l]
          for i in hits:
              a=max(0,i-25); b=min(len(lines),i+45)
              print(f'--- {a+1}-{b} ---')
              for n in range(a,b): print(f'{n+1}: {lines[n]}')
          PY
