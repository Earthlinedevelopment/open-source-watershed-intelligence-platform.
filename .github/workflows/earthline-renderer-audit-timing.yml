name: Earthline Renderer Audit Timing Trace
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths: ['tests/trace-renderer-audit-timing.py','.github/workflows/earthline-renderer-audit-timing.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tests/trace-renderer-audit-timing.py
