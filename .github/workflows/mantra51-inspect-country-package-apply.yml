name: Mantra 51 Inspect Country Package Apply
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-inspect-country-package-apply.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Inspect country package assignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needles=["EARTHLINE_ACTIVE_COUNTRY_PACKAGE_16845=","countryPackage16845=","appliedAtomically","countryCode"]
          for needle in needles:
            print("\n===== "+needle+" =====")
            pos=0; count=0
            while count<25:
              i=s.find(needle,pos)
              if i<0: break
              print(s[max(0,i-1800):min(len(s),i+4200)].replace("\n"," "))
              print("\n---")
              pos=i+len(needle);count+=1
          PY
