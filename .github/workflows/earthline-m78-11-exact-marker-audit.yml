name: Earthline M78.11 Exact Marker Audit
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-m78-11-exact-marker-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - name: Print exact M78.11 context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          term="EARTHLINE M78.11 — one canonical owner per minor-flow cell"
          i=s.find(term)
          print("index",i)
          print(s[max(0,i-600):min(len(s),i+900)])
          PY
