name: M82 Rollout States Candidate Gate
'on':
  push:
    branches: [mantra82-clean-integration]
    paths:
      - tests/m82-rollout-state.mjs
      - .github/workflows/m82-rollout-state.yml
permissions:
  contents: read
jobs:
  rollout:
    strategy:
      fail-fast: false
      matrix:
        state: [Arizona, New Mexico, Colorado, Texas, California, Vermont, New York]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - env:
          STATES: ${{ matrix.state }}
        run: node tests/m82-rollout-state.mjs
