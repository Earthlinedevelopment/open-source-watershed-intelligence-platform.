name: Earthline 16845 Global Context Extract
on:
  push:
    branches: [global-search-development-16845]
    paths:
      - 'lab/earthline-16845-extract-global-context.mjs'
      - '.github/workflows/earthline-16845-extract-global-context.yml'
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-search-development-16845
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node lab/earthline-16845-extract-global-context.mjs
