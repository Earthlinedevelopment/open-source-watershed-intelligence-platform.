name: Earthline Recovery 17600 Post-Smoothing Safety
on:
  push:
    branches: [recovery/full-science-blue-elders-17600]
    paths: ['.github/workflows/earthline-recovery-17600-smoothing-safety.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/full-science-blue-elders-17600
          fetch-depth: 0
      - name: Apply proven October 20 post-smoothing exclusion safety
        run: |
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git cherry-pick ff5cba0a759e85469c2331a20cf2b9f3b56f1e69 9483cb7d3c9ebedcf093438aef08e2519d863006 b8e65c25d2fbb7d6c8eebb504ac08df41bd8f913
          git diff HEAD~3..HEAD --name-only | grep -qx 'index.html'
          grep -q "function earthlineSafeCleanPath17576" index.html
          grep -q "earthlineSafeCleanPath17576(merged,maxS)" index.html
          git pull --rebase origin recovery/full-science-blue-elders-17600
          git push origin HEAD:recovery/full-science-blue-elders-17600
