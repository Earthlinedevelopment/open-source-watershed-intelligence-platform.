name: Mantra 51 How Swales Layout Repair
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - 'scripts/fix_how_swales_layout_16939.py'
      - '.github/workflows/mantra51-how-swales-layout-repair.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 scripts/fix_how_swales_layout_16939.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          s=Path('index.html').read_text(errors='ignore')
          assert 'earthline-swales-structure-16939' in s
          assert 'earthlineImageViewer16939' in s
          assert 'grid-template-columns:1fr!important' in s
          assert 'What happens when water leaves too quickly' in s
          assert 'From screening to field verification' in s
          assert 'replace(/^§\\\\d+' in s
          class P(HTMLParser):
              def __init__(self): super().__init__();self.ins=False;self.buf=[];self.scripts=[]
              def handle_starttag(self,t,a):
                  if t.lower()=='script': self.ins=True;self.buf=[]
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.ins:self.scripts.append(''.join(self.buf));self.ins=False
              def handle_data(self,d):
                  if self.ins:self.buf.append(d)
          p=P();p.feed(s);out=Path('/tmp/el-js');out.mkdir(exist_ok=True)
          for i,j in enumerate(p.scripts):(out/f'{i:03}.js').write_text(j)
          PY
          for f in /tmp/el-js/*.js; do node --check "$f" >/dev/null; done
          git add index.html
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git commit -m "fix: make How Swales coherent and image-led"
          git push
