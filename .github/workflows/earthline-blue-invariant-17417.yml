name: Earthline Swale Blue Invariant 17417
on:
  push:
    branches: [repair/browser-elder-final-17392]
    paths:
      - 'tests/apply-property-blue-invariant-17417.py'
      - 'tests/property-blue-invariant-17417.mjs'
      - '.github/workflows/earthline-blue-invariant-17417.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/browser-elder-final-17392}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: python3 tests/apply-property-blue-invariant-17417.py
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: |
          if [ '${{ matrix.browser }}' = 'firefox' ]; then
            xvfb-run -a env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='firefox' HEADLESS='false' node tests/property-blue-invariant-17417.mjs
          else
            env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='chromium' HEADLESS='true' node tests/property-blue-invariant-17417.mjs
          fi
  webkit:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/browser-elder-final-17392}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: python3 tests/apply-property-blue-invariant-17417.py
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - run: |
          python3 -m http.server 8787 --bind 0.0.0.0 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='webkit' HEADLESS='false' node tests/property-blue-invariant-17417.mjs
