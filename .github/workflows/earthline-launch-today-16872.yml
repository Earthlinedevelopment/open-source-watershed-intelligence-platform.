name: Earthline launch-today completion 16872
on:
  push:
    branches: [launch-today-16872-WORK]
    paths: [.github/workflows/earthline-launch-today-16872.yml]
permissions:
  contents: write
jobs:
  finish-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach approved launch controls only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); t=p.read_text(encoding='utf-8')
          if 'earthline-launch-16872.js' in t or 'earthline-launch-16872.css' in t:
              raise SystemExit('16872 assets already attached unexpectedly')
          if '</head>' not in t or '</body>' not in t: raise SystemExit('HTML anchors missing')
          t=t.replace('</head>','<link rel="stylesheet" href="earthline-launch-16872.css?v=16872">\n</head>',1)
          t=t.replace('</body>','<script src="earthline-launch-16872.js?v=16872"></script>\n</body>',1)
          p.write_text(t,encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          required=[
            'earthline-launch-16872.css?v=16872','earthline-launch-16872.js?v=16872',
            'earthline-acres-16871','Modelado de propiedad','Informe de impacto de bioswales',
            'const aquiferFeatures=reportAquifers();','"vancouver island":{name:"Vancouver Island"',
            'function finalSourcesPage16864','mailto:info@earthlinedevelopment.org',
            "earthline-ranked-swale-water-15777","Property Modelling"
          ]
          for x in required:
              if x not in t: raise SystemExit('Missing protected launch owner: '+x)
          if not Path('earthline-launch-16872.js').exists() or not Path('earthline-cost-control-16872.json').exists(): raise SystemExit('16872 files missing')
          PY
      - name: Install browser once
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Five consecutive candidate passes
        run: |
          python -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline16872-server.log 2>&1 &
          sleep 2
          cat >/tmp/test16872.py <<'PY'
          import json,sys,time
          from playwright.sync_api import sync_playwright
          URL=sys.argv[1]
          def pass_one(browser,n):
              ctx=browser.new_context(viewport={'width':1440,'height':1000})
              page=ctx.new_page(); errors=[]
              page.on('pageerror',lambda e: errors.append(str(e)))
              page.goto(URL+('?v=' if '?' not in URL else '&v=')+str(n),wait_until='domcontentloaded',timeout=60000)
              page.wait_for_function("()=>document.documentElement.dataset.earthlineLaunch16872==='ready'",timeout=20000)
              page.wait_for_timeout(600)
              base=page.evaluate("""()=>({login:!!document.querySelector('#earthlineLaunchLogin16872'),donate:!!document.querySelector('#earthlineLaunchDonate16872'),merch:!!document.querySelector('#earthlineLaunchMerch16872'),config:window.EARTHLINE_LAUNCH_16872?.limits?.(),quota:window.EARTHLINE_LAUNCH_16872?.quota?.()})""")
              assert base['login'] and base['donate'] and base['merch'],base
              assert base['config']['failClosed'] is True and base['config']['hardDailyPerBrowser']==25,base
              # Existing second green button: only 20 ACRES is enlarged.
              page.wait_for_function("()=>typeof window.earthlineSetPropertyTarget16201==='function'",timeout=15000)
              page.evaluate("()=>window.earthlineSetPropertyTarget16201({lng:-72.9726,lat:43.6106,source:'verify'},{openPanel:false})")
              page.wait_for_timeout(150)
              b=page.evaluate("""()=>{const e=document.querySelector('#earthlineDeclareProperty16169'),s=e?.querySelector('span:last-child'),a=s?.querySelector('.earthline-acres-16871');return {base:s?getComputedStyle(s).fontSize:'',acres:a?getComputedStyle(a).fontSize:'',text:s?.textContent||''}}""")
              assert b['base']=='10.5px' and b['acres']=='15px' and '20 ACRES' in b['text'],b
              # All four languages must actually apply.
              page.wait_for_function("()=>!!document.querySelector('#earthlineLanguage16488')",timeout=10000)
              expected={'es':'Modelado de propiedad','vi':'Mô hình hóa khu đất','th':'การจำลองพื้นที่','en':'Property Modelling'}
              for code,label in expected.items():
                  page.select_option('#earthlineLanguage16488',code);page.dispatch_event('#earthlineLanguage16488','change');page.wait_for_timeout(80)
                  x=page.evaluate("()=>({lang:document.documentElement.lang,label:document.querySelector('#earthlinePropertySection16188 .el-panel-label-16188')?.textContent||''})")
                  assert x['lang']==code and x['label']==label,(code,x)
              # Account creation/login must increase the allowance.
              uname=f'launch16872_{n}'
              page.evaluate("()=>{localStorage.removeItem('earthline-launch-16872-accounts');localStorage.removeItem('earthline-launch-16872-user');localStorage.removeItem('earthline-launch-16872-usage')}")
              page.evaluate("([u])=>window.EARTHLINE_LAUNCH_16872.createAccount(u,'Earthline!16872')",[uname])
              q=page.evaluate("()=>window.EARTHLINE_LAUNCH_16872.quota()")
              assert q['signed'] and q['daily']==25,q
              page.evaluate("()=>window.EARTHLINE_LAUNCH_16872.signOut()")
              q=page.evaluate("()=>window.EARTHLINE_LAUNCH_16872.quota()")
              assert (not q['signed']) and q['daily']==5,q
              # Hard request gate: guest gets five daily billable search requests; sixth is blocked.
              page.evaluate("()=>localStorage.removeItem('earthline-launch-16872-usage')")
              gates=page.evaluate("""()=>Array.from({length:6},()=>window.EARTHLINE_LAUNCH_16872.consumePaidSearch('https://api.mapbox.com/geocoding/v5/mapbox.places/test.json').ok)""")
              assert gates[:5]==[True]*5 and gates[5] is False,gates
              # Report must still open with mapped aquifer context and final Sources page.
              page.wait_for_function("()=>typeof window.earthlineOpenVermontReport16151==='function'",timeout=12000)
              token='LIVE16872-'+str(n)
              page.evaluate("""token=>{const empty={type:'FeatureCollection',features:[]},aq={type:'FeatureCollection',features:[{type:'Feature',properties:{name:'Verification aquifer'},geometry:{type:'Polygon',coordinates:[[[-73,43.60],[-72.96,43.60],[-72.96,43.64],[-73,43.64],[-73,43.60]]]}}]},sw={type:'FeatureCollection',features:[{type:'Feature',properties:{grade:'A',score:80},geometry:{type:'LineString',coordinates:[[-72.99,43.61],[-72.97,43.62]]}}]},snap={runToken:token,query:'Verification',normalizedQuery:'Verification',tier:'property',extentClass:'property',mode:'property',completedAt:new Date().toISOString(),bounds:[-73.02,43.58,-72.94,43.66],boundsHash:'16872',terrain:{source:'Verification terrain',limitation:'Verification only'},aquifers:aq,watersheds:empty,contours:empty,flows:empty,swales:sw,derived:{contours:0,waterPaths:0}};window.EARTHLINE_DISPLAYED_RUN_16147=snap;window.EARTHLINE_DISPLAYED_RUN_16151=snap;window.EARTHLINE_ACTIVE_RUN_TOKEN_16147=token;window.EARTHLINE_ACTIVE_RUN_TOKEN_16151=token;window.EARTHLINE_REGIONAL_VISUAL_DATA_16020={swales:sw,contours:empty,flows:empty,aquifers:aq};document.documentElement.dataset.earthlineActiveRun=token;document.documentElement.dataset.earthlineRunState='published';document.dispatchEvent(new CustomEvent('earthline:analysis-complete',{detail:{runToken:token,tier:'property'}}));}""",token)
              page.wait_for_timeout(180); opened=page.evaluate("()=>window.earthlineOpenVermontReport16151()")
              page.wait_for_timeout(200)
              r=page.evaluate("""()=>{const p=document.querySelector('#earthlineVermontReportPanel16149'),pages=p?[...p.querySelectorAll('.el49-page')]:[],final=p?.querySelector('.el16864-final-sources'),aq=[...p?.querySelectorAll('svg path title')||[]].filter(x=>/aquifer/i.test(x.textContent||''));return {open:!!p?.classList.contains('open'),last:!!final&&pages.at(-1)===final,aq:aq.length}}""")
              assert opened is True and r['open'] and r['last'] and r['aq']>0,r
              assert len(errors)==0,errors
              ctx.close();return {'button':b,'gates':gates,'report':r}
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True,args=['--disable-dev-shm-usage'])
              rows=[]
              for n in range(1,6): rows.append(pass_one(b,n))
              # Merchandise and donation landing pages must load.
              for path,needle in [('merchandise.html','Earthline Merchandise'),('donate.html','Support Earthline')]:
                  pg=b.new_page();pg.goto(URL.rsplit('/',1)[0]+'/'+path,wait_until='domcontentloaded',timeout=30000);assert needle in pg.locator('body').inner_text();pg.close()
              b.close()
          print(json.dumps({'passes':5,'rows':rows},indent=2))
          PY
          python /tmp/test16872.py http://127.0.0.1:8787/
      - name: Commit clean tested candidate and remove one-time workflow
        run: |
          git config user.name earthline-release-bot
          git config user.email info@earthlinedevelopment.org
          git add index.html earthline-launch-16872.js earthline-launch-16872.css earthline-cost-control-16872.json merchandise.html donate.html
          git rm .github/workflows/earthline-launch-today-16872.yml
          git commit -m 'release: Earthline launch controls and five-pass candidate 16872'
          git push origin HEAD:launch-today-16872-WORK
      - name: Promote tested candidate to pages-live
        run: |
          PARENT=28679aaf3c725bb4df595687d1fc34d652d793f0
          CURRENT=$(git ls-remote origin refs/heads/pages-live | cut -f1)
          test "$CURRENT" = "$PARENT" || { echo "pages-live moved: $CURRENT"; exit 1; }
          git push origin HEAD:pages-live
      - name: Wait for production deployment
        run: |
          python - <<'PY'
          import time,urllib.request
          url='https://earthlinedevelopment.org/?launch_verify=16872'
          for i in range(60):
              try:
                  t=urllib.request.urlopen(url,timeout=10).read().decode('utf-8','ignore')
                  if 'earthline-launch-16872.js?v=16872' in t:
                      print('production marker live');break
              except Exception as e: print('wait',i,str(e)[:100])
              time.sleep(5)
          else: raise SystemExit('production marker not live')
          PY
      - name: Five consecutive live passes
        run: |
          python /tmp/test16872.py https://earthlinedevelopment.org/
      - name: Live launch checks for Vancouver, cost owners and protected science
        run: |
          python - <<'PY'
          import urllib.request,re,json
          t=urllib.request.urlopen('https://earthlinedevelopment.org/?final_static=16872',timeout=20).read().decode('utf-8','ignore')
          needed=['earthline-launch-16872.js?v=16872','earthline-acres-16871','"vancouver island":{name:"Vancouver Island"','const aquiferFeatures=reportAquifers();','earthline-ranked-swale-water-15777','function finalSourcesPage16864']
          missing=[x for x in needed if x not in t]
          if missing: raise SystemExit('missing live owners '+repr(missing))
          print(json.dumps({'liveOwners':'pass','vancouverOverride':'present','aquiferReportMap':'present','regionalBlueOwner':'present','sourcesFinalOwner':'present'}))
          PY
