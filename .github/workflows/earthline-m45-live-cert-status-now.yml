name: Earthline Mantra45 Live Cert Status Now
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-m45-live-cert-status-now.yml']
permissions:
  actions: read
  contents: write
jobs:
  status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture current live-cert run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p lab
          target='Earthline Mantra45 Live Certification 16771'
          run_id="$(gh run list --workflow "$target" --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [ -z "$run_id" ]; then
            echo '{"error":"live cert run not found"}' > lab/mantra45-live-16771-status-now.json
          else
            gh run view "$run_id" --json databaseId,name,status,conclusion,headSha,createdAt,updatedAt,url,jobs > lab/mantra45-live-16771-status-now.json
          fi
      - name: Persist
        shell: bash
        run: |
          git config user.name "Earthline Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add lab/mantra45-live-16771-status-now.json
          git commit -m "diag: persist current live 16771 cert status [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
