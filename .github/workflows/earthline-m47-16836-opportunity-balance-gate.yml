name: Mantra 47 16836 Opportunity Balance Gate

on:
  push:
    branches: [diagnostic-m47-16822-ar-pipeline]
    paths:
      - '.github/workflows/earthline-m47-16836-opportunity-balance-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run strict 16836 opportunity-balance difficult-state gate
        run: node tests/mantra47-16836-opportunity-balance-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra47-16836-opportunity-balance-gate
          path: artifacts/mantra47-16836-opportunity-balance-gate/
          if-no-files-found: error
