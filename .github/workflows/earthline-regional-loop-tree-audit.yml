name: Earthline Regional Loop and Tree Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: [.github/workflows/earthline-regional-loop-tree-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(errors='ignore')
          terms=['await analyzeTile(','analyzeTile(state.tiles','state.tiles.length','async function earthlineBuildCanopyField15791','earthlineBuildCanopyField15791','satCanvas','satelliteCanvas','tree','forest','canopy','shadeMask','earthline-living-swales']
          for term in terms:
            hits=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
            print('\n###',term,'COUNT',len(hits))
            for pos in hits[-8:]:
              print('\n---',pos,'---')
              print(s[max(0,pos-6000):min(len(s),pos+14000)])
          PY