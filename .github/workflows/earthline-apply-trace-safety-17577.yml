name: Earthline Apply Trace Safety 17577
on:
  push:
    branches: [test/exclusion-three-17576]
    paths:
      - '.github/workflows/earthline-apply-trace-safety-17577.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17576
          fetch-depth: 0
      - name: Keep traced contour safe after cleaning
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='const cleaned=earthlineCleanPath(merged);\n  const preserved=earthlineLimitPath15683(cleaned,720);'
          new='const cleaned=earthlineSafeCleanPath17576(merged,maxS);\n  const preserved=earthlineLimitPath15683(cleaned,720);'
          if s.count(old)!=1: raise SystemExit(f'unexpected trace-clean anchor count {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- index.html | head -120
          git config user.name "Earthline CI"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: preserve exclusion safety after contour trace cleaning 17577"
          git push origin HEAD:candidate/earthline-launch-17576
