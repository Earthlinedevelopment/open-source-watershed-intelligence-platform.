name: Earthline Release Mobile Visibility Audit 17601
on:
  push:
    branches: [candidate-release-17601]
    paths:
      - '.github/workflows/earthline-release-mobile-visibility-17601.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-release-17601
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Audit mobile Property control lifecycle at public origin
        shell: bash
        run: |
          cat > tests/_mobile-audit-17601.mjs <<'JS'
          import { chromium } from 'playwright';
          import { readFileSync,existsSync } from 'node:fs';
          import { resolve,extname } from 'node:path';
          const root=process.cwd(),origin='https://earthlinedevelopment.org';
          const mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.json':'application/json; charset=utf-8','.geojson':'application/geo+json; charset=utf-8','.py':'text/plain; charset=utf-8'};
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2,serviceWorkers:'block'});
          await context.route(origin+'/**',async route=>{
            const u=new URL(route.request().url());let p=decodeURIComponent(u.pathname).replace(/^\/+/, '')||'index.html';
            const f=resolve(root,p);
            if(f.startsWith(root)&&existsSync(f))return route.fulfill({status:200,path:f,contentType:mime[extname(f)]||'application/octet-stream',headers:{'cache-control':'no-store'}});
            return route.continue();
          });
          const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          const snap=async label=>console.log('MOBILE17601 '+JSON.stringify(await page.evaluate(label=>{
            const b=document.getElementById('earthlineDeclareProperty16169');
            const panel=document.getElementById('earthlinePanel16188');
            const section=document.getElementById('earthlinePropertySection16188');
            const slot=document.getElementById('earthlinePropertySlot16188');
            const rect=b?.getBoundingClientRect?.();
            const cs=b?getComputedStyle(b):null,pcs=panel?getComputedStyle(panel):null,scs=section?getComputedStyle(section):null;
            let hit=null;if(rect&&rect.width>0&&rect.height>0){const el=document.elementFromPoint(Math.max(0,Math.min(innerWidth-1,rect.left+rect.width/2)),Math.max(0,Math.min(innerHeight-1,rect.top+Math.min(rect.height/2,20))));hit=el?{id:el.id,tag:el.tagName,cls:el.className}:null}
            return {label,htmlClass:document.documentElement.className,runState:document.documentElement.dataset.earthlinePropertyRunState||null,target:window.EARTHLINE_PROPERTY_TARGET_16201||null,
              button:b?{disabled:b.disabled,display:cs.display,visibility:cs.visibility,opacity:cs.opacity,pointerEvents:cs.pointerEvents,position:cs.position,rect:{x:rect.x,y:rect.y,w:rect.width,h:rect.height},offsetParent:b.offsetParent?.id||b.offsetParent?.className||null,parent:b.parentElement?.id||null,aria:b.getAttribute('aria-disabled'),dataset:{...b.dataset}}:null,
              panel:panel?{display:pcs.display,visibility:pcs.visibility,rect:panel.getBoundingClientRect().toJSON?.()||null}:null,
              section:section?{display:scs.display,visibility:scs.visibility,rect:section.getBoundingClientRect().toJSON?.()||null}:null,
              slot:slot?{childCount:slot.children.length,html:slot.innerHTML.slice(0,300)}:null,hit,scrollY,innerWidth,innerHeight};
          },label)));
          await page.goto(origin+'/?mobileAudit17601='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
          await page.waitForSelector('#searchInput',{state:'attached',timeout:30000});
          await snap('initial');
          await page.locator('#searchInput').fill('Arizona');await page.waitForTimeout(650);
          const opt=page.locator('#earthlineSearchSuggestions15970 [role="option"]:visible').first();if(await opt.count())await opt.click();
          const run=page.locator('#runBtn');if(await run.isVisible()&&!await run.evaluate(b=>b.dataset.busy==='1'||b.disabled))await run.click();
          await page.waitForFunction(()=>!!window.EARTHLINE_REGIONAL_PERFORMANCE_16191,null,{timeout:120000,polling:150});
          await snap('regional-ready');
          const ctl={lng:-111.93067,lat:34.21568};
          await page.evaluate(ctl=>{
            window.earthlineMap?.jumpTo?.({center:[ctl.lng,ctl.lat],zoom:17,bearing:0,pitch:0});
            const t={lng:ctl.lng,lat:ctl.lat,source:'crosshair',code:'',score:0,at:new Date().toISOString()};
            if(typeof window.earthlineSetPropertyTarget16201==='function')window.earthlineSetPropertyTarget16201(t,{openPanel:true});else window.EARTHLINE_PROPERTY_TARGET_16201=t;
            try{window.earthlineReconcilePanel16188?.()}catch(_){}
          },ctl);
          await snap('target-set');
          for(const ms of [100,300,700,1200,2000,4000]){
            await page.waitForTimeout(ms-(globalThis.lastMs||0));globalThis.lastMs=ms;await snap('after-'+ms);
          }
          console.log('MOBILE17601_ERRORS '+JSON.stringify(errors));
          await page.screenshot({path:'/tmp/mobile-17601.png',fullPage:true});
          await browser.close();
          JS
          node tests/_mobile-audit-17601.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-visibility-17601
          path: /tmp/mobile-17601.png
          if-no-files-found: warn
