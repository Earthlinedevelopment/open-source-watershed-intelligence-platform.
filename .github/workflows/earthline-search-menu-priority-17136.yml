name: Earthline Search Menu Priority 17136
on:
  push:
    branches: [repair/search-handoff-stability-17136]
    paths:
      - '.github/workflows/earthline-search-menu-priority-17136.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/search-handoff-stability-17136
          fetch-depth: 0
      - run: |
          python3 .github/scripts/earthline-search-menu-priority-17136.py
          git diff --check
      - run: |
          rm -f .github/workflows/earthline-search-menu-priority-17136.yml
          rm -f .github/scripts/earthline-search-menu-priority-17136.py
          printf '\n// rerun-17136-menu-priority\n' >> tests/candidate-live-origin-search-handoff-17136.mjs
          git config user.name "earthline-release-bot"
          git config user.email "earthline-release-bot@users.noreply.github.com"
          git add index.html tests/candidate-live-origin-search-handoff-17136.mjs .github/workflows/earthline-search-menu-priority-17136.yml .github/scripts/earthline-search-menu-priority-17136.py
          git commit -m "candidate: keep search suggestions below Run Analysis 17136"
          git pull --rebase origin repair/search-handoff-stability-17136
          git push origin HEAD:repair/search-handoff-stability-17136
