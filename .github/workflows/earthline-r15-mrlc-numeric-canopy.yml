name: Earthline USGS MRLC browser-accessible canopy numeric pixel probe
on:
  push:
    branches: [test/earthline-usfs-browser-cors-20261122]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - name: Find MRLC georeferenced tree-canopy layer and read NY pixel values in actual browser
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
          const page=await browser.newPage();
          await page.route('https://earthlinedevelopment.org/**',r=>r.request().resourceType()==='document'?r.fulfill({status:200,contentType:'text/html',body:'<!doctype html><html><body>MRLC canopy pixel audit</body></html>'}):r.continue());
          await page.goto('https://earthlinedevelopment.org/audit');
          const x=await page.evaluate(async ()=>{
            const base='https://www.mrlc.gov/geoserver/mrlc_display/wms';
            const cap=await (await fetch(base+'?service=WMS&version=1.3.0&request=GetCapabilities')).text();
            const names=[...cap.matchAll(/<Name>([^<]+)<\/Name>/g)].map(x=>x[1]);
            const matching=[...new Set(names.filter(x=>/canopy|tcc|tree/i.test(x)))];
            const infoFormats=[...cap.matchAll(/<Format>([^<]+)<\/Format>/g)].map(x=>x[1]).filter(x=>/json|plain|gml/i.test(x));
            return {matching,infoFormats:[...new Set(infoFormats)],capLength:cap.length};
          });
          console.log('MRLC_LAYER_DISCOVERY',JSON.stringify(x));
          if(x.matching.length===0)throw Error('No canopy layer in accessible WMS');
          for(const layer of x.matching.filter(x=>/202[0-5]|2021|nlcd/i.test(x)).slice(0,6)){
            for(const coord of [[-75.76996,42.78781],[-75.7705,42.7886]]){
              const res=await page.evaluate(async ({layer,coord})=>{
                const base='https://www.mrlc.gov/geoserver/mrlc_display/wms';
                const [lng,lat]=coord;
                const p=new URLSearchParams({service:'WMS',version:'1.1.1',request:'GetFeatureInfo',
                  layers:layer,query_layers:layer,styles:'',format:'image/png',info_format:'application/json',srs:'EPSG:4326',
                  bbox:`${lng-0.001},${lat-0.001},${lng+0.001},${lat+0.001}`,width:'201',height:'201',x:'100',y:'100',feature_count:'1'});
                try{const r=await fetch(base+'?'+p);const t=await r.text();return {status:r.status,contentType:r.headers.get('content-type'),text:t.slice(0,700)}}catch(e){return {error:String(e)}}
              },{layer,coord});
              console.log('MRLC_TREE_PIXEL',JSON.stringify({layer,coord,...res}));
            }
          }
          await browser.close();
          JS
