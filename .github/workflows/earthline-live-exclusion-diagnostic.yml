name: Earthline Live Exclusion Diagnostic
on:
  push:
    branches:
      - recovery/mantra75-regional-engine
    paths:
      - tests/iowa-production-exclusion.mjs
      - .github/workflows/earthline-live-exclusion-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-regional-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.55.0
      - run: node tests/iowa-production-exclusion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iowa-production-exclusion
          path: iowa-production-exclusion.json
