name: Earthline Property Connected Spacing Metric
on:
  push:
    branches: [candidate-next]
    paths:
      - '.github/workflows/earthline-property-connected-spacing.yml'
      - 'tools/apply_connected_property_spacing.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-next
          fetch-depth: 0
      - name: Apply connected eligible terrain spacing metric
        run: |
          test "$(git hash-object index.html)" = "e672798e36dbeffd37591ade9263ef785a002ea1"
          python3 tools/apply_connected_property_spacing.py
          test "$(git diff --name-only)" = "index.html"
      - name: Commit connected spacing metric
        run: |
          git config user.name "Earthline Engine"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "science: measure Property spacing within connected eligible terrain"
          git push origin HEAD:candidate-next
