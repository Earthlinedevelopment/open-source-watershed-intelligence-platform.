name: Earthline Iowa Regional Geometry Candidate
on:
  push:
    branches:
      - recovery/mantra74-stability
    paths:
      - tools/prepare-iowa-regional-candidate-audit.py
      - .github/workflows/earthline-iowa-render-capture.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-regional-geometry
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          path: harness
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare candidate audit
        run: python3 harness/tools/prepare-iowa-regional-candidate-audit.py
      - name: Run candidate Iowa Regional audit
        shell: bash
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 --directory candidate >/tmp/iowa-regional-geometry-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8787/ >/dev/null && break
            sleep 1
          done
          node iowa-regional-candidate-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iowa-regional-geometry-candidate
          path: |
            iowa-regional-audit.png
            iowa-regional-audit.json
