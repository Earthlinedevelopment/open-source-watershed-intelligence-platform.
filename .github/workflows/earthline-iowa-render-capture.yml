name: Earthline Regional Publication Repair
on:
  push:
    branches:
      - recovery/mantra74-stability
    paths:
      - tools/repair-regional-publication-17701.py
      - .github/workflows/earthline-iowa-render-capture.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-publication-fix
          fetch-depth: 0
      - name: Checkout repair script
        uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          path: harness
      - name: Apply repair
        run: python3 harness/tools/repair-regional-publication-17701.py
      - name: Parse check
        run: node --check earthline-launch-16872.js
      - name: Commit repair
        run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: publish full governed Regional corridor selection"
          git push origin HEAD:recovery/mantra75-publication-fix
