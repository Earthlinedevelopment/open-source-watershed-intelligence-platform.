name: Earthline Property Planting Persistence Repair
on:
  push:
    branches:
      - recovery/mantra74-stability
    paths:
      - tools/repair-property-planting-persistence-17703.py
      - .github/workflows/earthline-iowa-render-capture.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-property-persistence
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          path: harness
      - name: Apply Property planting persistence repair
        run: python3 harness/tools/repair-property-planting-persistence-17703.py
      - name: Parse-check page
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          console.log('EARTHLINE_PROPERTY_PLANTING_PERSISTENCE_17703_PARSE_OK',parsed);
          NODE
      - name: Commit repair
        run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: keep Property planting under authoritative swale ownership"
          git push origin HEAD:recovery/mantra75-property-persistence
