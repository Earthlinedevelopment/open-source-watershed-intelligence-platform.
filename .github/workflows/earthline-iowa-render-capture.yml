name: Earthline Iowa Regional Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths:
      - tests/iowa-regional-audit.mjs
      - .github/workflows/earthline-iowa-render-capture.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Audit live Iowa Regional selection
        shell: bash
        run: node tests/iowa-regional-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iowa-regional-audit
          path: |
            iowa-regional-audit.png
            iowa-regional-audit.json
