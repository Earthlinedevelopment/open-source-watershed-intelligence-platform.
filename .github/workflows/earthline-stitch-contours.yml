name: Earthline Stitch Contours Trace
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/trace-stitch-contours.py'
      - '.github/workflows/earthline-stitch-contours.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tests/trace-stitch-contours.py
