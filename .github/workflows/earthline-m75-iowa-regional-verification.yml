name: Earthline M75 Iowa Regional Verification
on:
  push:
    branches:
      - recovery/mantra74-stability
    paths:
      - .github/workflows/earthline-m75-iowa-regional-verification.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-engine-core
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          path: harness
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install runtime
        run: |
          cd harness
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Iowa Regional to Property path
        shell: bash
        env:
          CASES: '[{"name":"Iowa","query":"Iowa","loc":{"name":"Iowa","lat":41.878,"lng":-93.0977,"countryCode":"us","placeType":"state"}}]'
          OUT: /tmp/iowa-regional-functional.json
          EARTHLINE_URL: http://127.0.0.1:8787/
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/iowa-regional-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node harness/tests/mantra74-functional-certification.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m75-iowa-regional-functional
          path: /tmp/iowa-regional-functional.json