name: Earthline V1 Safe First Frame 17172
on:
  push:
    branches:
      - research/elder-browser-engine-17129
    paths:
      - .github/workflows/earthline-v1-safe-first-frame-17172.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1-stability-17166
          fetch-depth: 0
      - name: Keep authoritative safe swales visible until natural texture is actually rendered
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8',errors='strict')
          old="""if(show){for(const id of OLD)visible(id,false);/* 16296: preserve the established Property recharge/groundwater context; the natural swale renderer no longer owns or suppresses those context layers. *//* 16294 natural presentation restore: the authoritative solid safe-line owner remains loaded and layout-visible for verification/fallback, but becomes visually transparent after the embedded natural texture is proven ready. This restores the protected brown/blue texture and tree/plant canopy without substituting or changing geometry. */for(const id of ['earthline-property-safe-casing-16221','earthline-property-safe-earth-16221','earthline-property-safe-life-16221','earthline-property-safe-water-16221']){try{if(mp.getLayer?.(id))mp.setPaintProperty(id,'line-opacity',0)}catch(_){}}try{"""
          new="""if(show){for(const id of OLD)visible(id,false);/* 17172: fail visibly. Keep the authoritative safe Property swales opaque until the natural-texture replacement is actually rendered, not merely source-ready. */let naturalRendered17172=0;try{const canvas17172=mp.getCanvas?.();const box17172=canvas17172&&[[0,0],[canvas17172.clientWidth||canvas17172.width,canvas17172.clientHeight||canvas17172.height]];const ids17172=[LAYERS.casing,LAYERS.neutral,LAYERS.up,LAYERS.flip].filter(id=>mp.getLayer?.(id));if(box17172&&ids17172.length)naturalRendered17172=(mp.queryRenderedFeatures?.(box17172,{layers:ids17172})||[]).length}catch(_){}const safeOpacity17172=naturalRendered17172>0?0:.98;for(const id of ['earthline-property-safe-casing-16221','earthline-property-safe-earth-16221','earthline-property-safe-life-16221','earthline-property-safe-water-16221']){try{if(mp.getLayer?.(id))mp.setPaintProperty(id,'line-opacity',safeOpacity17172)}catch(_){}}try{"""
          if old not in s:
              raise SystemExit('Natural texture safe-opacity owner anchor not found')
          s=s.replace(old,new,1)
          if s.count('naturalRendered17172')<2:
              raise SystemExit('17172 patch marker missing')
          p.write_text(s,encoding='utf-8')
          print('first-frame safe swale visibility patch PASS')
          PY
          git diff --check
      - name: Commit isolated candidate
        shell: bash
        run: |
          git config user.name "earthline-release-bot"
          git config user.email "earthline-release-bot@users.noreply.github.com"
          git add index.html
          git commit -m "repair: keep first-run blue swales visible until natural texture renders 17172"
          git pull --rebase origin repair/v1-stability-17166
          git push origin HEAD:repair/v1-stability-17166
