name: Mantra 51 Repair Country Extent Ceiling
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-repair-country-extent-ceiling.yml'
      - 'lab/mantra51-patch-country-extents.py'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra51-global-repair-campaign
          fetch-depth: 0
      - name: Apply country-only extent ceiling repair
        run: |
          python3 lab/mantra51-patch-country-extents.py
          git diff --check
      - name: Commit candidate only
        run: |
          git config user.name 'Earthline CI'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: preserve full authoritative country extents' || exit 0
          git push origin HEAD:mantra51-global-repair-campaign
