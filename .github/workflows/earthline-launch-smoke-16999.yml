name: Earthline Final 50-State Smoke 16999
on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/launch-smoke-16999.mjs'
      - '.github/workflows/earthline-launch-smoke-16999.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for current production
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 15 https://earthlinedevelopment.org/ >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run rollout states first, then all remaining states
        run: node tests/launch-smoke-16999.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-final-50-state-smoke-16999
          path: artifacts/launch-smoke-16999/
          if-no-files-found: warn
