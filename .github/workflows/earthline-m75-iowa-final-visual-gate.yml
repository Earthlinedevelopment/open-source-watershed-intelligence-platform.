name: Earthline M75 Iowa Final Visual Gate
on:
  push:
    branches:
      - recovery/mantra74-stability
    paths:
      - tests/iowa-m75-final.mjs
      - .github/workflows/earthline-m75-iowa-final-visual-gate.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: 54bd28ac6ba09716bae8fde56d1e0807648775fb
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd harness
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Iowa Regional + Property visual gate
        shell: bash
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 --directory candidate >/tmp/m75-final-http.log 2>&1 &
          P=$!; trap 'kill $P || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          EARTHLINE_URL='http://127.0.0.1:8787/' node harness/tests/iowa-m75-final.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iowa-m75-final-visual-gate
          path: |
            iowa-m75-final.json
            iowa-regional-initial.png
            iowa-property-settle.png
            iowa-property-plus5s.png
