name: Earthline U.S. Launch 16846 Certification

on:
  push:
    branches: [us-launch-candidate-16844]
    paths:
      - '.github/workflows/earthline-us-launch-16846-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: us-launch-candidate-16844
          fetch-depth: 0
      - name: Verify exact 16846 candidate identity and safety gates
        run: |
          grep -q 'EARTHLINE 16846 — PROPERTY EXCLUSION SOURCE FAILOVER' index.html
          grep -q 'https://overpass-api.de/api/interpreter' index.html
          grep -q 'https://lz4.overpass-api.de/api/interpreter' index.html
          grep -q 'all-attempted-open-data-exclusion-sources-failed' index.html
          grep -q 'vector-exclusion-coverage-unverified' index.html
          if grep -q 'overpass.private.coffee' index.html; then echo 'Rejected endpoint present'; exit 1; fi

  regional:
    needs: integrity
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - batch: b1
            states: 'Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia'
          - batch: b2
            states: 'Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland'
          - batch: b3
            states: 'Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey'
          - batch: b4
            states: 'New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina'
          - batch: b5
            states: 'South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: us-launch-candidate-16844
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Build production-origin candidate Regional harness
        shell: bash
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:lab/earthline-16844-all50-regional-audit.mjs > lab/earthline-16846-regional-audit.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lab/earthline-16846-regional-audit.mjs'); s=p.read_text()
          s=s.replace("const rows=[];","const rows=[];\nconst CANDIDATE_HTML=fs.readFileSync('index.html','utf8');",1)
          a="  const page=await browser.newPage({viewport:{width:1800,height:900}});"
          b=a+"\n  await page.route('https://earthlinedevelopment.org/**',async route=>{const r=route.request();if(r.isNavigationRequest()&&r.resourceType()==='document')await route.fulfill({status:200,contentType:'text/html; charset=utf-8',body:CANDIDATE_HTML});else await route.continue();});"
          if s.count(a)!=1: raise SystemExit('Regional page anchor changed')
          s=s.replace(a,b,1)
          s=s.replace('EARTHLINE 16844 — FINAL FINE-SUPPORT REGIONAL CAPACITY','EARTHLINE 16846 — PROPERTY EXCLUSION SOURCE FAILOVER')
          p.write_text(s)
          PY
      - name: Run 50-state Regional gate against candidate at production origin
        env:
          EARTHLINE_URL: 'https://earthlinedevelopment.org/'
          STATES: ${{ matrix.states }}
          BATCH: 16846-${{ matrix.batch }}
          OUTDIR: out-16846-${{ matrix.batch }}
        run: node lab/earthline-16846-regional-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 16846-regional-${{ matrix.batch }}
          path: out-16846-${{ matrix.batch }}/
          retention-days: 3

  property:
    needs: integrity
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - batch: b1
            states: 'Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia'
          - batch: b2
            states: 'Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland'
          - batch: b3
            states: 'Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey'
          - batch: b4
            states: 'New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina'
          - batch: b5
            states: 'South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: us-launch-candidate-16844
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Build production-origin candidate Property harness
        shell: bash
        run: |
          cp lab/validate-16728-property-50states.mjs lab/property-16846-audit.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lab/property-16846-audit.mjs'); s=p.read_text()
          s=s.replace("const rows=[];","const rows=[];\nconst CANDIDATE_HTML=fs.readFileSync('index.html','utf8');",1)
          a="  const page=await browser.newPage({viewport:{width:1600,height:900}});"
          b=a+"\n  await page.route('https://earthlinedevelopment.org/**',async route=>{const r=route.request();if(r.isNavigationRequest()&&r.resourceType()==='document')await route.fulfill({status:200,contentType:'text/html; charset=utf-8',body:CANDIDATE_HTML});else await route.continue();});"
          if s.count(a)!=1: raise SystemExit('Property page anchor changed')
          s=s.replace(a,b,1)
          p.write_text(s)
          PY
      - name: Run 50-state Property lifecycle gate against candidate at production origin
        env:
          EARTHLINE_URL: 'https://earthlinedevelopment.org/'
          STATES: ${{ matrix.states }}
          OUT: property-16846-${{ matrix.batch }}.json
        run: node lab/property-16846-audit.mjs
      - name: Enforce 15-second Property ceiling
        env:
          OUT: property-16846-${{ matrix.batch }}.json
        run: |
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.env.OUT,'utf8'));
          const slow=x.rows.filter(r=>!Number.isFinite(Number(r.propertyMs))||Number(r.propertyMs)>15000).map(r=>({state:r.state,propertyMs:r.propertyMs}));
          if(slow.length){console.error(JSON.stringify(slow));process.exit(1)}
          console.log(JSON.stringify(x.rows.map(r=>({state:r.state,propertyMs:r.propertyMs,pass:r.pass}))));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 16846-property-${{ matrix.batch }}
          path: property-16846-${{ matrix.batch }}.json
          retention-days: 3

  alaska:
    needs: integrity
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        rep: [1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: us-launch-candidate-16844
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Build production-origin candidate Alaska harness
        shell: bash
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:lab/earthline-16844-all50-regional-audit.mjs > lab/earthline-16846-regional-audit.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lab/earthline-16846-regional-audit.mjs'); s=p.read_text()
          s=s.replace("const rows=[];","const rows=[];\nconst CANDIDATE_HTML=fs.readFileSync('index.html','utf8');",1)
          a="  const page=await browser.newPage({viewport:{width:1800,height:900}});"
          b=a+"\n  await page.route('https://earthlinedevelopment.org/**',async route=>{const r=route.request();if(r.isNavigationRequest()&&r.resourceType()==='document')await route.fulfill({status:200,contentType:'text/html; charset=utf-8',body:CANDIDATE_HTML});else await route.continue();});"
          if s.count(a)!=1: raise SystemExit('Alaska page anchor changed')
          s=s.replace(a,b,1)
          s=s.replace('EARTHLINE 16844 — FINAL FINE-SUPPORT REGIONAL CAPACITY','EARTHLINE 16846 — PROPERTY EXCLUSION SOURCE FAILOVER')
          p.write_text(s)
          PY
      - name: Repeat Alaska hard gate against candidate at production origin
        env:
          EARTHLINE_URL: 'https://earthlinedevelopment.org/'
          STATES: 'Alaska'
          BATCH: alaska-16846-r${{ matrix.rep }}
          OUTDIR: out-alaska-16846-r${{ matrix.rep }}
        run: node lab/earthline-16846-regional-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 16846-alaska-r${{ matrix.rep }}
          path: out-alaska-16846-r${{ matrix.rep }}/
          retention-days: 3

  gate:
    needs: [integrity, regional, property, alaska]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce full U.S. launch technical gate
        run: |
          echo "integrity=${{ needs.integrity.result }} regional=${{ needs.regional.result }} property=${{ needs.property.result }} alaska=${{ needs.alaska.result }}"
          test "${{ needs.integrity.result }}" = success
          test "${{ needs.regional.result }}" = success
          test "${{ needs.property.result }}" = success
          test "${{ needs.alaska.result }}" = success
