name: Earthline Language Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-language-audit-trigger']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ['index.html','earthline-launch-16872.js']:
            p=Path(name)
            s=p.read_text(encoding='utf-8').splitlines()
            print('\nFILE',name)
            for i,line in enumerate(s,1):
              if any(k in line for k in ['earthlineLanguage16488','function ensureLanguage','<option','scheduleTranslation','analysis-complete']):
                print(f'{i}: {line}')
          PY
