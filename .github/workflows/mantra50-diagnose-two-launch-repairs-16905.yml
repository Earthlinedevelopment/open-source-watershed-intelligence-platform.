name: Mantra 50 diagnose two launch repairs 16905
on:
  push:
    branches: [mantra50-two-launch-repairs-16905]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Alaska terrain-window formula
        run: python tests/extract-mantra50-bounds.py
      - uses: actions/upload-artifact@v4
        with:
          name: mantra50-bounds-extract
          path: mantra50-bounds-extract.txt
