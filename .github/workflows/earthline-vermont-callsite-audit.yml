name: Earthline Vermont Callsite Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.github/workflows/earthline-vermont-callsite-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          for needle in             "earthlineEnsureVermontBoundary16178"             "earthlineValidateVermontBoundary16178"             "earthlineClipVermontProducts16178"             "earthlineClipVermontLine16178"             "earthlineIsVermontRequest16178"             "earthlinePointInVermont16178"             "ensureBoundary()"             "validateBoundary("             "clipProducts("             "isVermontRequest("; do
              echo "=== $needle ==="
              grep -n -F "$needle" index.html || true
          done
