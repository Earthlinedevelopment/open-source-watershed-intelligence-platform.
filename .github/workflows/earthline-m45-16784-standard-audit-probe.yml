name: Earthline 16784 Standard Audit Probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-m45-16784-standard-audit-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Apply standardized audit
        run: |
          git fetch origin main
          git show origin/main:lab/apply-16784-standard-root-cause-audit.py > /tmp/apply.py
          python3 /tmp/apply.py
          grep -q "EARTHLINE_STANDARD_ROOT_CAUSE_AUDIT_16784" index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Probe audit classifications
        shell: bash
        run: |
          mkdir -p /tmp/audit16784
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'fs';
          const html=fs.readFileSync('index.html','utf8');
          const states=['iowa','arkansas','vermont','texas','california'];
          const browser=await chromium.launch({headless:true});
          const rows=[];
          for(const state of states){
            const page=await browser.newPage({viewport:{width:1800,height:832}});
            await page.route('https://earthlinedevelopment.org/**',async route=>{
              const req=route.request(),u=new URL(req.url());
              if(req.resourceType()==='document'&&(u.pathname==='/'||u.pathname==='/index.html')){
                await route.fulfill({status:200,contentType:'text/html',body:html,headers:{'cache-control':'no-store'}});
              }else await route.continue();
            });
            let error=null;
            try{
              await page.goto('https://earthlinedevelopment.org/?audit16784='+state+'-'+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForSelector('#searchInput',{timeout:30000});
              await page.evaluate(q=>{
                const i=document.getElementById('searchInput'),b=document.getElementById('runBtn');
                i.value=q+' state';
                i.dispatchEvent(new Event('input',{bubbles:true}));
                i.dispatchEvent(new Event('change',{bubbles:true}));
                b.click();
              },state);
              await page.waitForFunction(()=>{
                const a=window.EARTHLINE_STANDARD_ROOT_CAUSE_AUDIT_16784;
                const p=window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167;
                const d=window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16040||window.EARTHLINE_REGIONAL_DISPLAY_AUDIT_16020;
                return a&&a.stage==='core-published'&&Number(p?.generated||0)>0&&Number(p?.generated||0)===Number(d?.swaleLines||0);
              },null,{timeout:70000,polling:100});
              await page.waitForTimeout(300);
            }catch(e){error=String(e&&e.message||e);}
            const audit=await page.evaluate(()=>window.EARTHLINE_STANDARD_ROOT_CAUSE_AUDIT_16784||null).catch(()=>null);
            const pub=await page.evaluate(()=>window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167||null).catch(()=>null);
            rows.push({state,error,audit,pub});
            await page.close();
          }
          await browser.close();
          const compact=rows.map(r=>({
            state:r.state,error:r.error,first:r.audit?.firstFailedStage,pass:r.audit?.pass,
            lineage:r.audit?.cellLineage,
            top:r.audit?.rankedCauses?.slice(0,4).map(x=>({id:x.id,p:x.probabilityPct,status:x.status,reasons:x.reasons})),
            generated:r.pub?.generated,visible:r.pub?.overlaySwaleLines
          }));
          fs.writeFileSync('/tmp/audit16784/result.json',JSON.stringify({at:new Date().toISOString(),rows,compact},null,2));
          console.log(JSON.stringify(compact));
          if(rows.some(r=>r.error||!r.audit))process.exit(2);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: earthline-16784-standard-audit-probe
          path: /tmp/audit16784/result.json
