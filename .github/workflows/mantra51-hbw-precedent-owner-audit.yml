name: Mantra 51 HBW Precedent Owner Audit
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-hbw-precedent-owner-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='ignore')
          for term in ['Water-harvesting systems that have worked','What proven landscape systems teach Earthline','earthlineHowBioswalesApproved16388','earthlineSuccessfulSystems16149','el-precedent-16148']:
              print('\n###',term)
              st=0
              for _ in range(6):
                  i=s.find(term,st)
                  if i<0: break
                  print('POS',i)
                  print(s[max(0,i-1200):i+2400].replace('\n',' '))
                  st=i+len(term)
          PY
