name: Earthline Live Exact Property 17135
on:
  push:
    branches: [research/elder-browser-engine-17129]
    paths:
      - 'tests/live-exact-property-17135.mjs'
      - '.github/workflows/earthline-live-exact-property-17135.yml'
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/elder-browser-engine-17129
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/live-exact-property-17135.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-live-exact-property-17135
          path: artifacts/live-exact-property-17135/
          if-no-files-found: error
          retention-days: 7
