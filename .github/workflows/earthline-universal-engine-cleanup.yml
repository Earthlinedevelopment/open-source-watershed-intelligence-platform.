name: Earthline Universal Engine Cleanup
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['tools/mantra74-universal-engine.py']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          fetch-depth: 0
      - run: python3 tools/mantra74-universal-engine.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue; new Function(m[1]);
          }
          if(!s.includes("const vermontRequest=false;"))throw Error('shared Vermont routing absent');
          if(s.includes("installPanel16188();ensureBoundary()"))throw Error('Vermont startup fetch remains');
          if(s.includes("try{void ensureBoundary().catch(()=>{});"))throw Error('Vermont preload remains');
          console.log('EARTHLINE_17690_VALIDATE_OK');
          NODE
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Earthline Stability Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git rm -f tools/mantra74-universal-engine.py .github/workflows/earthline-universal-engine-cleanup.yml
          git add index.html
          git commit -m "stability: route Vermont through shared universal engine"
          git push origin HEAD:recovery/mantra74-stability
