name: Earthline Universal Copy Cleanup
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['tools/mantra74-universal-engine.py']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          fetch-depth: 0
      - run: python3 tools/mantra74-universal-engine.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue; new Function(m[1]);
          }
          for(const bad of ['BACK TO VERMONT','run Vermont screening first.','Use Back to Vermont','return to Vermont to test another location.']){
            if(s.includes(bad))throw Error('global Vermont wording remains: '+bad);
          }
          if(s.includes("sourceRule:authoritative16516?'Vermont E911/VCGI first; exclusions fail closed; Overpass disabled'"))throw Error('hardcoded Vermont provenance remains');
          console.log('EARTHLINE_UNIVERSAL_COPY_VALIDATE_OK');
          NODE
          git diff --check
      - name: Commit and retire installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Earthline Stability Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git rm -f tools/mantra74-universal-engine.py .github/workflows/earthline-universal-engine-cleanup.yml
          git add index.html
          git commit -m "stability: make navigation and provenance location-neutral"
          git push origin HEAD:recovery/mantra74-stability
