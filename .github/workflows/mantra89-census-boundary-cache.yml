name: Mantra 89 Same-Origin Census State Boundary Cache
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/mantra89-census-boundary-cache.yml'
      - 'tools/mantra89-census-boundary-cache.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  census-state-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install shapefile reader
        run: python -m pip install --disable-pip-version-check pyshp==2.3.1
      - name: Download Census boundary archive and validate all 50 states
        run: python tools/mantra89-census-boundary-cache.py
      - name: Commit unchanged-format static state boundaries to production origin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jurisdiction/us-states-2025-500k/
          if git diff --cached --quiet; then echo "Census cache unchanged"; exit 0; fi
          git commit -m "data(mantra89): cache validated 2025 Census state boundaries on Earthline origin"
          git push origin HEAD:pages-live
