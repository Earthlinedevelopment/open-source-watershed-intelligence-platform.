name: Earthline M75 Iowa Regional Engine Verify
on:
  push:
    branches:
      - recovery/mantra74-stability
    paths:
      - .github/workflows/earthline-m75-iowa-regional-engine-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-regional-engine
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: 238041b6
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd harness
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Iowa Regional exact candidate
        shell: bash
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 --directory candidate >/tmp/earthline-iowa-regional.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node harness/tests/iowa-regional-candidate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iowa-regional-engine-verify
          path: |
            iowa-regional-candidate.json
            iowa-regional-candidate.png
