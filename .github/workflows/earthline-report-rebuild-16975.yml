name: Earthline report rebuild 16975
on:
  push:
    branches: [pages-live]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Rebuild report map from live Property visual language
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          start=s.index("function mapSvg(d,small=false){")
          end=s.index("  return parts.join('');\n}",start)+len("  return parts.join('');\n}")
          fn=r'''function mapSvg(d,small=false){
            const b=reportBounds(d),W=1100,H=small?470:620;
            const mapX=24,mapY=24,mapW=W-48,mapH=H-48;
            const xSpan=Math.max(.000001,b[2]-b[0]),ySpan=Math.max(.000001,b[3]-b[1]);
            const sx=x=>mapX+(x-b[0])/xSpan*mapW,sy=y=>mapY+mapH-(y-b[1])/ySpan*mapH;
            const pathCoords=coords=>(coords||[]).map((q,i)=>(i?'L':'M')+sx(+q[0]).toFixed(1)+' '+sy(+q[1]).toFixed(1)).join(' ');
            const path=f=>pathCoords(f?.geometry?.coordinates||[]);
            const mid=f=>{const a=f?.geometry?.coordinates||[];const q=a[Math.floor(a.length/2)];return Array.isArray(q)&&q.length>1?q:null};
            const slen=f=>{const a=f?.geometry?.coordinates||[];let L=0;for(let i=1;i<a.length;i++)L+=Math.hypot(sx(+a[i][0])-sx(+a[i-1][0]),sy(+a[i][1])-sy(+a[i-1][1]));return L};
            const reportContours=contours().filter(f=>f?.geometry?.type==='LineString').slice(0,220);
            const reportFlows=flows().filter(f=>f?.geometry?.type==='LineString').slice(0,240);
            const rows=graded(),aquiferFeatures=reportAquifers();
            const flowRank=reportFlows.map(f=>({f,L:slen(f)})).sort((a,b)=>b.L-a.L);
            const principal=flowRank.slice(0,Math.min(small?4:5,flowRank.length));
            const cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;
            const conus=cx>=-125&&cx<=-66.5&&cy>=24&&cy<=50;
            const bbox=b.map(n=>Number(n).toFixed(7)).join(',');
            const imgSize=small?'900,540':'1400,840';
            const naip=conus?'https://apps.geo.fpac.usda.gov/geo-imagery/rest/services/naip/conus_naip/ImageServer/exportImage?bbox='+encodeURIComponent(bbox)+'&bboxSR=4326&imageSR=4326&size='+imgSize+'&format=jpgpng&f=image':'';
            const lonSpan=Math.max(.0001,b[2]-b[0]),midLat=(b[1]+b[3])/2,kmWide=lonSpan*111.32*Math.cos(midLat*Math.PI/180);
            const niceKm=kmWide>300?100:kmWide>120?50:kmWide>50?20:kmWide>20?10:kmWide>8?5:kmWide>3?2:kmWide>1?1:.5;
            const barPx=Math.max(54,Math.min(170,niceKm/kmWide*mapW));
            const clipId='elClip16975',parts=[];
            parts.push('<svg class="el-report-real-site-render-16975" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Earthline real-site hydrology and bioswale plan">');
            parts.push('<defs>'+
              '<linearGradient id="elGround16975" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dce4da"/><stop offset=".58" stop-color="#c8d4c9"/><stop offset="1" stop-color="#bccabb"/></linearGradient>'+
              '<linearGradient id="elAerialWash16975" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6df" stop-opacity=".05"/><stop offset=".48" stop-color="#f0ead9" stop-opacity=".012"/><stop offset="1" stop-color="#17382f" stop-opacity=".045"/></linearGradient>'+
              '<radialGradient id="elVignette16975" cx="50%" cy="46%" r="73%"><stop offset="0" stop-color="#16372f" stop-opacity="0"/><stop offset=".72" stop-color="#102e27" stop-opacity=".012"/><stop offset="1" stop-color="#071e19" stop-opacity=".055"/></radialGradient>'+
              '<filter id="elAerialTone16975" x="-2%" y="-2%" width="104%" height="104%"><feColorMatrix type="saturate" values=".92" result="sat"/><feComponentTransfer in="sat"><feFuncR type="linear" slope="1.04" intercept=".025"/><feFuncG type="linear" slope="1.05" intercept=".024"/><feFuncB type="linear" slope="1.01" intercept=".022"/></feComponentTransfer></filter>'+
              '<clipPath id="'+clipId+'"><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="8"/></clipPath>'+
              '<marker id="elArrow16975" markerWidth="5.2" markerHeight="5.2" refX="4.45" refY="2.6" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L5.2 2.6 L0 5.2 Z" fill="#55c7e6" opacity=".94"/></marker>'+
              '</defs>');
            parts.push('<rect width="'+W+'" height="'+H+'" fill="#f3f0e9"/><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="8" fill="url(#elGround16975)" stroke="#29483d" stroke-width="1.1"/>');
            parts.push('<g clip-path="url(#'+clipId+')">');
            if(conus){
              parts.push('<image href="'+esc(naip)+'" x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" preserveAspectRatio="none" filter="url(#elAerialTone16975)"/>');
              parts.push('<rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" fill="url(#elAerialWash16975)"/><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" fill="url(#elVignette16975)"/>');
            }else{
              for(let i=0;i<reportContours.length;i+=11){const dp=path(reportContours[i]);if(dp)parts.push('<path d="'+dp+'" fill="none" stroke="#66796c" stroke-width="28" opacity=".028" stroke-linecap="round" vector-effect="non-scaling-stroke"/>')}
            }
            for(let i=0;i<reportContours.length;i+=12){const dp=path(reportContours[i]);if(!dp)continue;parts.push('<path d="'+dp+'" fill="none" stroke="#17372f" stroke-width=".58" opacity="'+(conus?'.07':'.08')+'" vector-effect="non-scaling-stroke"/>')}
            for(const f of aquiferFeatures){
              const g=f&&f.geometry;if(!g)continue;
              const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];
              for(const poly of polys){
                const rings=poly.filter(r=>Array.isArray(r)&&r.length>=3);if(!rings.length)continue;
                const dp=rings.map(r=>pathCoords(r)+' Z').join(' ');
                parts.push('<path d="'+dp+'" fill="#d7843a" fill-opacity=".12" fill-rule="evenodd" stroke="#be6424" stroke-width=".72" stroke-opacity=".58" vector-effect="non-scaling-stroke"/>');
              }
            }
            let fi=0;
            for(const x of principal){
              const dp=path(x.f);if(!dp)continue;
              parts.push('<path d="'+dp+'" fill="none" stroke="#082b3d" stroke-width="2.65" opacity=".48" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" fill="none" stroke="#1698c9" stroke-width="1.35" opacity=".94" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"'+(fi<3?' marker-end="url(#elArrow16975)"':'')+'/>');
              parts.push('<path d="'+dp+'" fill="none" stroke="#94e3f3" stroke-width=".38" opacity=".74" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');
              fi++;
            }
            const draw=r=>{
              const dp=path(r.f);if(!dp)return;
              if(r.grade==='C'){parts.push('<path d="'+dp+'" fill="none" stroke="#5d725f" stroke-width=".42" opacity=".055" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');return}
              if(r.grade==='B'){
                parts.push('<path d="'+dp+'" fill="none" stroke="#264939" stroke-width="1.8" opacity=".14" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
                parts.push('<path d="'+dp+'" fill="none" stroke="#698060" stroke-width="1.05" opacity=".26" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
                parts.push('<path d="'+dp+'" fill="none" stroke="#2d747b" stroke-width=".46" opacity=".26" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');return
              }
              parts.push('<path d="'+dp+'" fill="none" stroke="#071b13" stroke-width="8.1" opacity=".17" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" fill="none" stroke="#153d27" stroke-width="6.4" opacity=".64" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" fill="none" stroke="#715038" stroke-width="4.85" opacity=".78" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" fill="none" stroke="#58784b" stroke-width="3.45" opacity=".90" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" fill="none" stroke="#8a914d" stroke-width="2.65" opacity=".76" stroke-dasharray=".01 5.3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" fill="none" stroke="#007fd0" stroke-width="1.42" opacity=".98" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" fill="none" stroke="#6ed1ef" stroke-width=".40" opacity=".86" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');
            };
            for(const r of rows.filter(r=>r.grade==='C'))draw(r);
            for(const r of rows.filter(r=>r.grade==='B'))draw(r);
            for(const r of rows.filter(r=>r.grade==='A'))draw(r);
            let ai=0;
            for(const r of rows.filter(r=>r.grade==='A').slice(0,3)){
              const q=mid(r.f);if(!q)continue;const x=sx(+q[0]),y=sy(+q[1]);
              parts.push('<g><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="8.2" fill="#173f2f" fill-opacity=".92" stroke="#e7c16d" stroke-width=".72"/><text x="'+x.toFixed(1)+'" y="'+(y+2.2).toFixed(1)+'" text-anchor="middle" fill="#fffdf4" font-family="Noto Sans,Arial,sans-serif" font-size="6.2" font-weight="850">A'+(++ai)+'</text></g>');
            }
            parts.push('</g>');
            parts.push('<g transform="translate('+(mapX+18)+','+(mapY+mapH-20)+')"><path d="M0 0 H'+barPx+'" stroke="#f8f3e6" stroke-width="3.1" opacity=".65"/><path d="M0 0 H'+barPx+'" stroke="#233c34" stroke-width="1.05"/><path d="M0 -3 V3 M'+barPx+' -3 V3" stroke="#233c34" stroke-width=".8"/><text x="'+(barPx/2)+'" y="12" text-anchor="middle" fill="#233c34" font-family="Noto Sans,Arial,sans-serif" font-size="6.2" font-weight="800">'+niceKm+' km</text></g>');
            parts.push('<g transform="translate('+(mapX+mapW-49)+','+(mapY+20)+')"><circle cx="12" cy="13" r="18.5" fill="#173a30" fill-opacity=".89" stroke="#fff7e7" stroke-width=".8"/><text x="12" y="-.5" text-anchor="middle" fill="#fffdf4" font-family="Noto Sans,Arial,sans-serif" font-size="7.2" font-weight="850">N</text><path d="M12 4 V29" stroke="#fffdf4" stroke-width="1"/><path d="M12 4 L6.7 15.5 L12 11.7 L17.3 15.5 Z" fill="#fffdf4"/></g>');
            if(!small){
              const lx=mapX+18,ly=mapY+18;
              parts.push('<g transform="translate('+lx+','+ly+')"><rect width="218" height="94" rx="6" fill="#fbfaf4" fill-opacity=".76" stroke="#a9b3aa" stroke-width=".6"/><text x="14" y="19" fill="#203a33" font-family="Noto Sans,Arial,sans-serif" font-size="7.8" font-weight="850" letter-spacing=".72">REAL-SITE RECHARGE PLAN</text><path d="M14 27 H204" stroke="#55bde0" stroke-width="1.15"/><rect x="14" y="38" width="20" height="8" rx="1" fill="#d7843a" fill-opacity=".18" stroke="#be6424" stroke-width=".55"/><text x="42" y="45" fill="#42564d" font-family="Noto Sans,Arial,sans-serif" font-size="5.9">Mapped aquifer context</text><path d="M14 61 H35" stroke="#1698c9" stroke-width="1.35"/><text x="42" y="64" fill="#42564d" font-family="Noto Sans,Arial,sans-serif" font-size="5.9">Principal water path</text><path d="M119 42 H143" stroke="#153d27" stroke-width="6.4" opacity=".64" stroke-linecap="round"/><path d="M119 42 H143" stroke="#715038" stroke-width="4.8" opacity=".78" stroke-linecap="round"/><path d="M119 42 H143" stroke="#58784b" stroke-width="3.4" opacity=".9" stroke-linecap="round"/><path d="M119 42 H143" stroke="#007fd0" stroke-width="1.4" stroke-linecap="round"/><text x="151" y="45" fill="#42564d" font-family="Noto Sans,Arial,sans-serif" font-size="5.9">A · priority bioswale</text><path d="M119 62 H143" stroke="#698060" stroke-width="1.1" opacity=".35" stroke-linecap="round"/><text x="151" y="65" fill="#42564d" font-family="Noto Sans,Arial,sans-serif" font-size="5.9">B · supporting</text><text x="14" y="82" fill="#68776f" font-family="Noto Sans,Arial,sans-serif" font-size="4.9">'+(conus?'Aerial: USDA NAIP · Earthline frozen run geometry':'Terrain-only fallback outside NAIP coverage')+'</text><text x="14" y="90" fill="#68776f" font-family="Noto Sans,Arial,sans-serif" font-size="4.9">Screening plan · field verification required</text></g>');
            }
            parts.push('</svg>');
            return parts.join('');
          }'''
          out=s[:start]+fn+s[end:]
          assert out.count("el-report-real-site-render-16975")==1
          assert "el-report-real-site-render-16974" not in out
          p.write_text(out,encoding="utf-8")
          PY
          git config user.name "Earthline Build Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "style: rebuild report map from live property visual language 16975"
          git push origin HEAD:pages-live
