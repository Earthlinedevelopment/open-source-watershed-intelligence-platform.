name: Mantra 92 exact geometry hot-function source audit
on:
  push:
    branches: [audit/mantra92-regional-fallback-isolation]
    paths:
      - .github/workflows/mantra92-regional-generator-ab.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Extract isolated candidate geometry implementations
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin candidate/mantra92-metric-recovery
          git show FETCH_HEAD:index.html > /tmp/earthline-index-m92.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/earthline-index-m92.html').read_text()
          for term,n in [
            ('function earthlinePointInRing16584(',2700),
            ('function earthlinePointInJurisdiction16539(',4100),
            ('function earthlinePointInRingIndexed16722(',3500),
            ('function earthlinePointOnSegment16539(',1700),
            ('function earthlineBBoxContains16539(',1200),
            ('function earthlinePointInRing16539(',1700),
            ('function earthlinePointInPolygon16539(',1300)
          ]:
            at=s.find(term)
            print('M92_HOT_SOURCE',term,at)
            if at>=0:print(s[at:at+n])
          PY
