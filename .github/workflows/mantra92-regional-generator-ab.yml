name: Mantra 92 science generator recovery A/B
on:
  push:
    branches: [audit/mantra92-regional-fallback-isolation]
    paths:
      - tests/mantra92-regional-generator-ab.mjs
      - .github/workflows/mantra92-regional-generator-ab.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Compare source generator behaviors with fixed science thresholds
        run: node tests/mantra92-regional-generator-ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra92-regional-generator-ab
          path: artifacts/mantra92/generator-ab
          retention-days: 14
