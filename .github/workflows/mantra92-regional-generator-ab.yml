name: Mantra 92 geospatial source-preserving performance A/B
on:
  push:
    branches: [audit/mantra92-regional-fallback-isolation]
    paths:
      - .github/workflows/mantra92-regional-generator-ab.yml
      - tests/mantra92-regional-generator-ab.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regional:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin unmodified scientific candidate for geometric comparison
        run: |
          mkdir -p artifacts/mantra92/yield-ab
          git fetch --no-tags --depth=1 origin candidate/mantra92-metric-recovery
          git show FETCH_HEAD:index.html > artifacts/mantra92/yield-ab/index.html
          node --check tests/mantra92-regional-generator-ab.mjs
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Compare existing and memoized exact geospatial predicates
        run: node tests/mantra92-regional-generator-ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra92-geometry-performance-ab
          path: artifacts/mantra92/yield-ab/results
          retention-days: 14
