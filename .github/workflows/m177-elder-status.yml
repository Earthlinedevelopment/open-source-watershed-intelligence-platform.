name: M177 Elder search pending status
on:
  push:
    branches: ['repair/m177-elder-pending-status']
    paths: ['.github/workflows/m177-elder-status.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check pending label and scientific parity
        run: |
          node --check earthline-elder-restored-17097.js
          node tests/mantra94-elder-owner.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('earthline-elder-restored-17097.js').read_text()
          assert s.count("Elder Trees: Finding trees…")>=2
          assert "const pending=elderTierM94()==='property'" in s
          assert "gaugeLine(state.lastSummary); /* Pending search" in s
          assert "const dynamic=await dynamicPropertyEvidence(true)" in s
          print('M177_ELDER_PENDING_DISPLAY_PASS')
          PY
