name: Earthline M75 Apply Regional Publication Fix
on:
  push:
    branches:
      - recovery/mantra75-engine-clean2
    paths:
      - .github/workflows/earthline-m75-apply-regional-publication-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-engine-clean2
          fetch-depth: 0
      - run: python3 tools/fix-regional-publication-17701.py
      - run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          if(s.includes("selected.length>=32"))throw Error("32-corridor cap still present");
          console.log("EARTHLINE_M75_REGIONAL_PUBLICATION_PARSE_OK",parsed);
          NODE
      - run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: publish full verified Regional corridor set"
          git push origin HEAD:recovery/mantra75-engine-clean2
