name: Earthline real user-sequence QA 16968
on:
  push:
    branches: [report-map-candidate-16967]
    paths:
      - '.github/workflows/e2e-user-sequence-16968.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: report-map-candidate-16967
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Run Alabama Regional to Property sequence
        shell: bash
        run: |
          cat > e2e-user16968.cjs <<'JS'
          const fs=require('fs');
          const { chromium }=require('playwright');
          (async()=>{
            const html=fs.readFileSync('index.html','utf8');
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1800,height:1100},deviceScaleFactor:1});
            page.on('console',m=>{if(['error','warning'].includes(m.type()))console.log('BROWSER',m.type(),m.text())});
            page.on('pageerror',e=>console.log('PAGEERROR',e.message));
            await page.route('https://earthlinedevelopment.org/**',async route=>{
              const req=route.request(),u=new URL(req.url());
              if(req.resourceType()==='document'&&u.hostname==='earthlinedevelopment.org')await route.fulfill({status:200,body:html,contentType:'text/html; charset=utf-8'});
              else await route.continue();
            });
            await page.goto('https://earthlinedevelopment.org/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('.mapboxgl-canvas',{timeout:60000});
            await page.waitForTimeout(3500);

            await page.fill('#searchInput','Alabama');
            await page.waitForSelector('#earthlineSearchSuggestions15970 button[data-query="Alabama state"]',{state:'visible',timeout:15000});
            await page.click('#earthlineSearchSuggestions15970 button[data-query="Alabama state"]');
            await page.waitForTimeout(700);
            await page.click('#runBtn',{force:true});
            await page.waitForFunction(()=>{
              const d=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null;
              return !!(d&&String(d.tier||d.mode||'').toLowerCase()==='regional');
            },{timeout:150000});
            const reg=await page.evaluate(()=>{
              const d=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||{};
              return {tier:d.tier||d.mode,query:d.query||d.location||'',runToken:d.runToken||'',center:[earthlineMap.getCenter().lng,earthlineMap.getCenter().lat],zoom:earthlineMap.getZoom()};
            });
            console.log('REGIONAL',JSON.stringify(reg));

            const target=await page.evaluate(()=>{
              try{
                earthlineMap.jumpTo({center:[-86.68074,32.60936],zoom:17,bearing:0,pitch:0});
                if(typeof earthlineSetTarget==='function')earthlineSetTarget(-86.68074,32.60936,false);
                const i=document.getElementById('searchInput');if(i)i.value='';
                return {ok:true};
              }catch(e){return {ok:false,error:String(e&&e.message||e)}}
            });
            if(!target.ok)throw new Error(target.error);
            await page.waitForTimeout(1200);
            await page.click('#runBtn');
            await page.waitForFunction(()=>{
              const d=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null;
              return !!(d&&String(d.tier||d.mode||'').toLowerCase()==='property');
            },{timeout:150000});
            const prop=await page.evaluate(()=>{
              const d=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||{};
              return {
                tier:d.tier||d.mode,query:d.query||d.location||'',runToken:d.runToken||'',
                swales:Array.isArray(d.swales)?d.swales.length:null,
                flows:Array.isArray(d.flows)?d.flows.length:null,
                contours:Array.isArray(d.contours)?d.contours.length:null
              };
            });
            console.log('PROPERTY',JSON.stringify(prop));

            await page.waitForSelector('#earthlineVermontReport16149',{state:'visible',timeout:30000});
            await page.click('#earthlineVermontReport16149');
            const map=page.locator('.el-report-landscape-plan-16968');
            await map.waitFor({state:'visible',timeout:20000});
            await map.scrollIntoViewIfNeeded();
            await page.waitForTimeout(900);
            await map.screenshot({path:'REPORT-E2E-ALABAMA-MAP-16968.png'});
            const audit=await page.evaluate(()=>{
              const svg=document.querySelector('.el-report-landscape-plan-16968');
              const d=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||{};
              const ids=['earthlineLaunchLogin16872','earthlineLaunchDonate16872','earthlineLaunchMerch16872'];
              return {
                controls:Object.fromEntries(ids.map(id=>[id,getComputedStyle(document.getElementById(id)).display])),
                header:document.querySelector('#earthlineVermontReportPanel16149 .el49-toolbar small')?.textContent||'',
                mapPaths:svg?svg.querySelectorAll('path').length:0,
                mapTexts:svg?svg.querySelectorAll('text').length:0,
                tier:d.tier||d.mode||'',
                query:d.query||d.location||''
              };
            });
            fs.writeFileSync('REPORT-E2E-ALABAMA-16968.txt',JSON.stringify(audit,null,2));
            if(audit.controls.earthlineLaunchLogin16872!=='none'||audit.controls.earthlineLaunchDonate16872!=='none'||audit.controls.earthlineLaunchMerch16872!=='none')throw new Error('report controls visible');
            if(audit.mapPaths<25)throw new Error('map geometry unexpectedly sparse: '+audit.mapPaths);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node e2e-user16968.cjs
      - name: Commit real-sequence proof
        shell: bash
        run: |
          git config user.name "Earthline Mantra 54"
          git config user.email "info@earthlinedevelopment.org"
          git rm .github/workflows/e2e-user-sequence-16968.yml
          git add REPORT-E2E-ALABAMA-MAP-16968.png REPORT-E2E-ALABAMA-16968.txt
          git commit -m "qa: Alabama Regional Property report candidate 16968"
          git push origin report-map-candidate-16967
