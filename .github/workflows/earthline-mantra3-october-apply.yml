name: Mantra 3 pinned October Elder repair candidate
on:
  push:
    branches:
      - repair/mantra3-october-elder-ui-20261113
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[mantra3-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact pinned October Elder port and Mantra 2 presentation fixes
        run: python3 tools/mantra3-october-apply.py
      - name: Fail-closed static checks
        shell: bash
        run: |
          git diff --check
          node --check earthline-elder-restored-17097.js
          node --input-type=module --check < earthline-elder-worker-17129.js
          test "$(git diff --name-only)" = "index.html"
          git diff --stat
      - name: Commit ONLY to isolated repair branch
        shell: bash
        run: |
          git config user.name "Earthline Candidate Gate"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix(mantra3): restore Elder loader and apply two pinned UI fixes [mantra3-applied]"
          git push origin HEAD:repair/mantra3-october-elder-ui-20261113
