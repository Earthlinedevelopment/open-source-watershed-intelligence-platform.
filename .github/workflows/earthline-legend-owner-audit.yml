name: Earthline legend owner audit
on:
  push:
    branches:
      - pages-live
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Locate legend visibility owners
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for n in ["earthlineSwaleLegend16050","earthlineAquiferLegend16070","earthlineDiagramLegend16080","PROPERTY CLEAN MAP PRESENTATION","analysis tier is Property"]:
              print("\n###",n)
              start=0
              for _ in range(20):
                  i=s.find(n,start)
                  if i<0: break
                  print("---",i,"---")
                  print(s[max(0,i-2200):min(len(s),i+3400)])
                  start=i+len(n)
          PY
