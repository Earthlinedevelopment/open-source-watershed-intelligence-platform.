name: Mantra 38 Water Rule Trace

on:
  push:
    branches: [mantra38-water-rule-trace]
    paths:
      - 'tests/mantra38-production-basin-line-visual.mjs'
      - '.github/workflows/mantra38-water-rule-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify deployed New York basin line geometry
        run: node tests/mantra38-production-basin-line-visual.mjs
      - name: Upload production visual proof
        uses: actions/upload-artifact@v4
        with:
          name: mantra38-ny-production-after-basin-fix
          path: mantra38-ny-production-after-basin-fix.png
          if-no-files-found: error
