name: Earthline real report render proof 16969
on:
  push:
    branches: [mantra54-real-report-render-16969]
    paths:
      - '.github/workflows/mantra54-real-render-proof-16969.yml'
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra54-real-report-render-16969

      - name: Install real-site report renderer candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          # Make the report an opaque, topmost surface. This is candidate-only.
          style='''<style id="earthlineRealReportIsolation16969">
          #earthlineVermontReportPanel16149.open{
            position:fixed!important;inset:0!important;z-index:2147483647!important;
            background:#f4f1e8!important;isolation:isolate!important;overflow:auto!important;
          }
          #earthlineVermontReportPanel16149.open .el49-shell{position:relative!important;z-index:1!important}
          html.earthline-report-open-16966 #earthlineLaunchFallbackRail16872,
          html.earthline-report-open-16966 #earthlineLaunchLogin16872,
          html.earthline-report-open-16966 #earthlineLaunchDonate16872,
          html.earthline-report-open-16966 #earthlineLaunchMerch16872,
          html.earthline-report-open-16966 #earthlineRail16188,
          html.earthline-report-open-16966 [id^="earthlineRail"],
          html.earthline-report-open-16966 .earthline-launch-rail-btn-16872,
          html.earthline-report-open-16966 .el-rail-control-16188,
          html.earthline-report-open-16966 #searchOrb,
          html.earthline-report-open-16966 [id*="SearchOrb"],
          html.earthline-report-open-16966 .mapboxgl-ctrl{
            display:none!important;visibility:hidden!important;pointer-events:none!important;
          }
          </style>'''
          if 'earthlineRealReportIsolation16969' not in s:
              s=s.replace('</head>',style+'\n</head>',1)

          new_map=r'''function mapSvg(d,small=false){
            const b=reportBounds(d),W=1100,H=small?470:620;
            const mapX=24,mapY=24,mapW=W-48,mapH=H-48;
            const xSpan=Math.max(.000001,b[2]-b[0]),ySpan=Math.max(.000001,b[3]-b[1]);
            const sx=x=>mapX+(x-b[0])/xSpan*mapW,sy=y=>mapY+mapH-(y-b[1])/ySpan*mapH;
            const pathCoords=coords=>(coords||[]).map((q,i)=>(i?'L':'M')+sx(+q[0]).toFixed(1)+' '+sy(+q[1]).toFixed(1)).join(' ');
            const path=f=>pathCoords(f?.geometry?.coordinates||[]);
            const mid=f=>{const a=f?.geometry?.coordinates||[];const q=a[Math.floor(a.length/2)];return Array.isArray(q)&&q.length>1?q:null};
            const slen=f=>{const a=f?.geometry?.coordinates||[];let L=0;for(let i=1;i<a.length;i++)L+=Math.hypot(sx(+a[i][0])-sx(+a[i-1][0]),sy(+a[i][1])-sy(+a[i-1][1]));return L};

            const reportContours=contours().filter(f=>f?.geometry?.type==='LineString').slice(0,220);
            const reportFlows=flows().filter(f=>f?.geometry?.type==='LineString').slice(0,240);
            const rows=graded(),aquiferFeatures=reportAquifers();
            const flowRank=reportFlows.map(f=>({f,L:slen(f)})).sort((a,b)=>b.L-a.L);
            const principal=flowRank.slice(0,Math.min(small?5:8,flowRank.length));

            const cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;
            const conus=cx>=-125&&cx<=-66.5&&cy>=24&&cy<=50;
            const bbox=b.map(n=>Number(n).toFixed(7)).join(',');
            const imgSize=small?'1200,720':'1800,1050';
            const naip=conus?'https://apps.geo.fpac.usda.gov/geo-imagery/rest/services/naip/conus_naip/ImageServer/exportImage?bbox='+encodeURIComponent(bbox)+'&bboxSR=4326&imageSR=4326&size='+imgSize+'&format=jpgpng&f=image':'';
            const hill=conus?'https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer/exportImage?bbox='+encodeURIComponent(bbox)+'&bboxSR=4326&imageSR=4326&size='+imgSize+'&format=png32&renderingRule='+encodeURIComponent(JSON.stringify({rasterFunction:'Hillshade Multidirectional'}))+'&f=image':'';

            const lonSpan=Math.max(.0001,b[2]-b[0]),midLat=(b[1]+b[3])/2,kmWide=lonSpan*111.32*Math.cos(midLat*Math.PI/180);
            const niceKm=kmWide>300?100:kmWide>120?50:kmWide>50?20:kmWide>20?10:kmWide>8?5:kmWide>3?2:kmWide>1?1:.5;
            const barPx=Math.max(54,Math.min(170,niceKm/kmWide*mapW));
            const clipId='elClip16969',aqPat='elAq16969',parts=[];

            parts.push('<svg class="el-report-real-site-render-16969" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Earthline real-site landscape water plan">');
            parts.push('<defs>'+
              '<linearGradient id="elGround16969" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7eadf"/><stop offset="1" stop-color="#cfd9ca"/></linearGradient>'+
              '<pattern id="'+aqPat+'" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(31)"><rect width="13" height="13" fill="#e9903c" fill-opacity=".22"/><path d="M0 0 V13" stroke="#bd601d" stroke-width=".8" stroke-opacity=".30"/></pattern>'+
              '<clipPath id="'+clipId+'"><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="5"/></clipPath>'+
              '<marker id="elArrow16969" markerWidth="5.5" markerHeight="5.5" refX="4.7" refY="2.75" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L5.5 2.75 L0 5.5 Z" fill="#0d6e9c" opacity=".9"/></marker>'+
              '</defs>');

            parts.push('<rect width="'+W+'" height="'+H+'" fill="#f2eee5"/><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="5" fill="url(#elGround16969)" stroke="#7c8d82" stroke-width="1"/>');
            parts.push('<g clip-path="url(#'+clipId+')">');
            if(conus){
              parts.push('<image href="'+esc(naip)+'" x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" preserveAspectRatio="none"/>');
              parts.push('<image href="'+esc(hill)+'" x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" preserveAspectRatio="none" opacity=".24" style="mix-blend-mode:multiply"/>');
              parts.push('<rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" fill="#f7f0df" opacity=".08"/>');
            } else {
              for(let i=0;i<reportContours.length;i+=10){const dp=path(reportContours[i]);if(dp)parts.push('<path d="'+dp+'" fill="none" stroke="#66796c" stroke-width="34" opacity=".035" stroke-linecap="round" vector-effect="non-scaling-stroke"/>')}
            }

            /* Quiet terrain cues only; the real image is the land. */
            for(let i=0;i<reportContours.length;i+=8){const dp=path(reportContours[i]);if(dp)parts.push('<path d="'+dp+'" fill="none" stroke="#ffffff" stroke-width=".7" opacity="'+(conus?'.18':'.11')+'" vector-effect="non-scaling-stroke"/>')}

            /* Aquifer stays a spatial orange field. */
            for(const f of aquiferFeatures){
              const g=f&&f.geometry;if(!g)continue;
              const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];
              for(const poly of polys){
                const rings=poly.filter(r=>Array.isArray(r)&&r.length>=3);if(!rings.length)continue;
                const dp=rings.map(r=>pathCoords(r)+' Z').join(' ');
                parts.push('<path d="'+dp+'" fill="url(#'+aqPat+')" fill-rule="evenodd" stroke="#b55b1b" stroke-width="1.15" opacity=".86" vector-effect="non-scaling-stroke"/>');
              }
            }

            /* Only principal water paths read strongly. */
            let fi=0;
            for(const x of principal){
              const dp=path(x.f);if(!dp)continue;
              parts.push('<path d="'+dp+'" fill="none" stroke="#fff" stroke-width="5.2" opacity=".78" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" fill="none" stroke="#0d6e9c" stroke-width="1.7" opacity=".93" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"'+(fi++%2===0?' marker-end="url(#elArrow16969)"':'')+'/>');
            }

            /* Earthline swales retain their actual frozen geometry; style only changes. */
            const draw=r=>{const dp=path(r.f);if(!dp)return;
              if(r.grade==='C'){parts.push('<path d="'+dp+'" fill="none" stroke="#7d745f" stroke-width=".8" opacity=".28" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');return}
              if(r.grade==='B'){
                parts.push('<path d="'+dp+'" fill="none" stroke="#fff" stroke-width="7.5" opacity=".74" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
                parts.push('<path d="'+dp+'" fill="none" stroke="#b7caa8" stroke-width="5" opacity=".74" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
                parts.push('<path d="'+dp+'" fill="none" stroke="#496d4b" stroke-width="1.05" opacity=".88" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');return}
              parts.push('<path d="'+dp+'" fill="none" stroke="#fff" stroke-width="15" opacity=".92" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" fill="none" stroke="#8dbd82" stroke-width="10.5" opacity=".82" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" fill="none" stroke="#224d31" stroke-width="1.55" opacity=".98" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" transform="translate(-1.8 -1.8)" fill="none" stroke="#3ba3c3" stroke-width=".9" opacity=".98" stroke-dasharray="2.4 3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" transform="translate(1.8 1.8)" fill="none" stroke="#3ba3c3" stroke-width=".9" opacity=".98" stroke-dasharray="2.4 3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');
            };
            for(const r of rows.filter(r=>r.grade==='C'))draw(r);
            for(const r of rows.filter(r=>r.grade==='B'))draw(r);
            for(const r of rows.filter(r=>r.grade==='A'))draw(r);

            let ai=0;
            for(const r of rows.filter(r=>r.grade==='A').slice(0,12)){
              const q=mid(r.f);if(!q)continue;const x=sx(+q[0]),y=sy(+q[1]);
              parts.push('<g><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="10" fill="#fffdf7" fill-opacity=".95" stroke="#45654d" stroke-width=".8"/><text x="'+x.toFixed(1)+'" y="'+(y+2.3).toFixed(1)+'" text-anchor="middle" fill="#24432f" font-family="Noto Sans,Arial,sans-serif" font-size="6.8" font-weight="850">A'+(++ai)+'</text></g>');
            }
            parts.push('</g>');

            /* Minimal planning-board furniture. */
            parts.push('<g transform="translate('+(mapX+18)+','+(mapY+mapH-20)+')"><path d="M0 0 H'+barPx+'" stroke="#263d34" stroke-width="1.5"/><path d="M0 -4 V4 M'+barPx+' -4 V4" stroke="#263d34" stroke-width=".9"/><text x="'+(barPx/2)+'" y="13" text-anchor="middle" fill="#31473d" font-family="Noto Sans,Arial,sans-serif" font-size="6.5" font-weight="800">'+niceKm+' km</text></g>');
            parts.push('<g transform="translate('+(mapX+mapW-49)+','+(mapY+20)+')"><circle cx="12" cy="13" r="20" fill="#fffdf7" fill-opacity=".91" stroke="#8d9b91" stroke-width=".8"/><text x="12" y="-1" text-anchor="middle" fill="#203a31" font-family="Noto Sans,Arial,sans-serif" font-size="7.5" font-weight="850">N</text><path d="M12 4 V30" stroke="#203a31" stroke-width="1"/><path d="M12 4 L6 16 L12 12 L18 16 Z" fill="#203a31"/></g>');

            if(!small){
              const lx=mapX+18,ly=mapY+18;
              parts.push('<g transform="translate('+lx+','+ly+')"><rect width="250" height="112" rx="5" fill="#fffef9" fill-opacity=".92" stroke="#aeb8b0" stroke-width=".7"/><text x="15" y="21" fill="#203a33" font-family="Noto Sans,Arial,sans-serif" font-size="8.2" font-weight="850" letter-spacing=".8">REAL-SITE WATER PLAN</text><path d="M15 30 H235" stroke="#55bde0" stroke-width="1.4"/><rect x="15" y="43" width="23" height="10" rx="1" fill="url(#'+aqPat+')" stroke="#b55b1b" stroke-width=".7"/><text x="47" y="51" fill="#42564d" font-family="Noto Sans,Arial,sans-serif" font-size="6.3">Mapped aquifer context</text><path d="M15 69 H39" stroke="#0d6e9c" stroke-width="1.7"/><text x="47" y="72" fill="#42564d" font-family="Noto Sans,Arial,sans-serif" font-size="6.3">Principal water path</text><path d="M132 48 H160" stroke="#8dbd82" stroke-width="10" opacity=".88" stroke-linecap="round"/><path d="M132 48 H160" stroke="#224d31" stroke-width="1.5"/><text x="169" y="51" fill="#42564d" font-family="Noto Sans,Arial,sans-serif" font-size="6.3">A · priority bioswale</text><path d="M132 70 H160" stroke="#b7caa8" stroke-width="5" opacity=".8" stroke-linecap="round"/><path d="M132 70 H160" stroke="#496d4b" stroke-width="1"/><text x="169" y="73" fill="#42564d" font-family="Noto Sans,Arial,sans-serif" font-size="6.3">B · strong opportunity</text><text x="15" y="94" fill="#68776f" font-family="Noto Sans,Arial,sans-serif" font-size="5.3">'+(conus?'Aerial: USDA NAIP · Terrain: USGS 3DEP':'Terrain-only fallback outside NAIP coverage')+'</text><text x="15" y="104" fill="#68776f" font-family="Noto Sans,Arial,sans-serif" font-size="5.3">Earthline overlays use frozen published run geometry</text></g>');
            }
            parts.push('</svg>');
            return parts.join('');
          }
          '''
          start=s.find("function mapSvg(d,small=false){")
          end=s.find("function gradeSummary",start)
          if start<0 or end<0 or end<=start:
              raise SystemExit(f"mapSvg boundary not found: start={start} end={end}")
          s=s[:start]+new_map+s[end:]
          p.write_text(s,encoding="utf-8")
          print("16969 installed")
          PY

      - name: Build real Alabama proof and time public imagery services
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, math, urllib.parse

          # 20-acre-scale proof centered on the Alabama run shown in the report.
          b=[-86.6824,32.6072,-86.6765,32.6116]
          bbox=','.join(f'{x:.7f}' for x in b)
          naip='https://apps.geo.fpac.usda.gov/geo-imagery/rest/services/naip/conus_naip/ImageServer/exportImage?'+urllib.parse.urlencode({
            'bbox':bbox,'bboxSR':'4326','imageSR':'4326','size':'1800,1050','format':'jpgpng','f':'image'})
          hill='https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer/exportImage?'+urllib.parse.urlencode({
            'bbox':bbox,'bboxSR':'4326','imageSR':'4326','size':'1800,1050','format':'png32',
            'renderingRule':json.dumps({'rasterFunction':'Hillshade Multidirectional'}),'f':'image'})
          Path('naip.url').write_text(naip)
          Path('hill.url').write_text(hill)

          s=Path("index.html").read_text(encoding="utf-8")
          start=s.find("function mapSvg(d,small=false){")
          end=s.find("function gradeSummary",start)
          fn=s[start:end]

          # Representative overlay geometry only for visual proof.
          # The candidate function itself reads real report geometry in production.
          contours=[]
          for j in range(28):
            pts=[]
            for i in range(61):
              x=b[0]+(b[2]-b[0])*i/60
              frac=(j+3)/34
              y=b[1]+(b[3]-b[1])*(frac+.025*math.sin(i/6+j*.3))
              pts.append([x,y])
            contours.append({'type':'Feature','geometry':{'type':'LineString','coordinates':pts},'properties':{}})

          flows=[]
          cx=(b[0]+b[2])/2
          for off in [-.0019,-.0009,0,.0011,.0020]:
            flows.append({'type':'Feature','geometry':{'type':'LineString','coordinates':[
              [cx+off,b[3]-.0002],[cx+off*.65,b[1]+.0032],[cx+off*.32,b[1]+.0018],[cx,b[1]+.0002]
            ]},'properties':{}})

          sw=[]
          ys=[.78,.60,.43,.27]
          for i,f in enumerate(ys):
            y=b[1]+(b[3]-b[1])*f
            grade='A' if i<3 else 'B'
            sw.append({'grade':grade,'km':.2,'f':{'type':'Feature','geometry':{'type':'LineString','coordinates':[
              [b[0]+.0006,y],[b[0]+.0020,y+.00018],[b[0]+.0036,y-.00008],[b[2]-.0006,y+.00013]
            ]},'properties':{'grade':grade}}})

          aq=[{'type':'Feature','geometry':{'type':'Polygon','coordinates':[[
            [b[0]+.0034,b[3]-.0003],[b[2]-.0002,b[3]-.0003],[b[2]-.0002,b[1]+.0020],
            [b[0]+.0042,b[1]+.0014],[b[0]+.0034,b[3]-.0003]
          ]]},'properties':{}}]

          html='''<!doctype html><meta charset="utf-8"><style>
          html,body{margin:0;background:#d8dad5;font-family:Arial,sans-serif}
          .sheet{width:1360px;margin:24px auto;background:#fff;padding:24px 24px 32px;box-shadow:0 8px 30px #0002}
          h1{font-size:20px;color:#18343c;margin:0 0 5px}.sub{font-size:12px;color:#617078;margin-bottom:16px}
          #map svg{display:block;width:100%;height:auto}
          </style><div class="sheet"><h1>Bioswale Impact Report — Real-Site Rendering Proof</h1>
          <div class="sub">ALABAMA · USA · 32.60936, -86.68074 · real public imagery + Earthline-style overlay</div>
          <div id="map"></div></div><script>
          const C=__C__,F=__F__,R=__R__,AQ=__AQ__,B=__B__;
          function reportBounds(){return B} function contours(){return C} function flows(){return F}
          function graded(){return R} function reportAquifers(){return AQ}
          function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
          '''+fn+'''
          document.getElementById("map").innerHTML=mapSvg({query:"ALABAMA · USA · 32.60936, -86.68074",tier:"property",bounds:B},false);
          </script>'''
          html=html.replace('__C__',json.dumps(contours)).replace('__F__',json.dumps(flows)).replace('__R__',json.dumps(sw)).replace('__AQ__',json.dumps(aq)).replace('__B__',json.dumps(b))
          Path("real-report-proof-16969.html").write_text(html,encoding="utf-8")
          PY

          NAIP="$(cat naip.url)"
          HILL="$(cat hill.url)"
          echo "NAIP fetch:"
          curl -L --fail --silent --show-error -o /tmp/naip.png -w 'seconds=%{time_total} bytes=%{size_download} http=%{http_code}\n' "$NAIP"
          echo "3DEP fetch:"
          curl -L --fail --silent --show-error -o /tmp/hill.png -w 'seconds=%{time_total} bytes=%{size_download} http=%{http_code}\n' "$HILL"
          file /tmp/naip.png /tmp/hill.png
          test -s /tmp/naip.png
          test -s /tmp/hill.png

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=8000 --window-size=1450,920 --screenshot=real-report-proof-16969.png "file://$PWD/real-report-proof-16969.html"
          test -s real-report-proof-16969.png

      - name: Validate and commit proof
        shell: bash
        run: |
          grep -q "el-report-real-site-render-16969" index.html
          grep -q "USDA NAIP" index.html
          grep -q "USGS 3DEP" index.html
          grep -q "z-index:2147483647" index.html
          git config user.name "Earthline Mantra 54"
          git config user.email "info@earthlinedevelopment.org"
          git rm .github/workflows/mantra54-real-render-proof-16969.yml
          git add index.html real-report-proof-16969.html real-report-proof-16969.png
          git commit -m "candidate: real-site report rendering proof 16969"
          git push origin mantra54-real-report-render-16969
