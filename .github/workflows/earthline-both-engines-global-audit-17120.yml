  elder-global:
    name: Elder Global ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: established
            aois: 'alaska@-135.36,57.045,-135.34,57.060|vermont@-73.205,44.475,-73.185,44.490|colorado@-105.61,39.625,-105.59,39.640|england@-0.603,51.430,-0.583,51.445|thailand@101.420,14.340,101.440,14.355|laos@103.290,19.990,103.310,20.005|vietnam@105.610,20.305,105.630,20.320'
          - batch: americas
            aois: 'vancouver-island@-124.40,49.60,-124.38,49.615|costa-rica@-84.12,10.20,-84.10,10.215|brazil-amazon@-60.55,-3.10,-60.53,-3.085|chile-temperate@-73.85,-42.55,-73.83,-42.535|mexico-chiapas@-92.15,16.90,-92.13,16.915'
          - batch: europe-asia
            aois: 'sweden@13.50,60.00,13.52,60.015|japan@138.70,36.40,138.72,36.415|borneo@116.30,0.50,116.32,0.515|india-western-ghats@76.70,10.30,76.72,10.315|nepal@84.00,28.30,84.02,28.315'
          - batch: africa-oceania
            aois: 'south-africa-tsitsikamma@23.90,-33.95,23.92,-33.935|kenya-aberdare@36.70,-0.30,36.72,-0.285|tasmania@146.50,-42.00,146.52,-41.985|new-zealand@172.80,-41.20,172.82,-41.185|papua-new-guinea@147.20,-6.10,147.22,-6.085'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/elder-density-calibration-17100
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy rasterio pyproj requests
      - name: Run Elder high-recall global AOIs
        env:
          AOIS: ${{ matrix.aois }}
          BATCH: ${{ matrix.batch }}
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess
          rows=[]
          for item in os.environ['AOIS'].split('|'):
              name,bbox=item.split('@',1)
              out=pathlib.Path('artifacts/17120-elder')/os.environ['BATCH']/name
              cmd=['python','tools/elder_trees/chmv2_aoi_candidates.py',
                   '--bbox='+bbox,'--max-per-tile=1200','--screen-size=1024',
                   '--refine-radius-m=15','--preserve-all-eligible','--out',str(out)]
              p=subprocess.run(cmd,text=True,capture_output=True)
              metas=list(out.glob('*.json'))
              meta=None
              for mp in metas:
                  if mp.suffix=='.json' and not mp.name.endswith('.geojson'):
                      try:
                          d=json.loads(mp.read_text())
                          if 'candidate_count' in d:
                              meta=d;break
                      except Exception: pass
              row={'name':name,'bbox':bbox,'returncode':p.returncode,
                   'candidate_count':None if meta is None else meta.get('candidate_count'),
                   'ok_tiles':None if meta is None else sum(1 for t in meta.get('tile_results',[]) if t.get('status')=='OK'),
                   'stderr':p.stderr[-800:]}
              rows.append(row);print(json.dumps(row))
          failed=[r for r in rows if r['returncode']!=0 or not (r['ok_tiles'] and r['ok_tiles']>0) or not (r['candidate_count'] and r['candidate_count']>0)]
          summary={'batch':os.environ['BATCH'],'rows':rows,'failed':failed,'pass':not failed}
          root=pathlib.Path('artifacts/17120-elder')/os.environ['BATCH'];root.mkdir(parents=True,exist_ok=True)
          (root/'summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          if failed: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 17120-elder-${{ matrix.batch }}
          path: artifacts/17120-elder/${{ matrix.batch }}/
          retention-days: 7
