name: Earthline Interaction Probe 17495
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/earthline-interaction-probe-17495.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/earthline-launch-17495, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/interaction-probe-17495.mjs > tests/interaction-probe-17495.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/interaction-probe-17495.mjs
