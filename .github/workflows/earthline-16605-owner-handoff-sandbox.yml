name: Earthline 16605 Owner Handoff Sandbox

on:
  push:
    branches: [pages-live]
    paths:
      - 'lab/16605-owner-handoff-sandbox.mjs'
      - '.github/workflows/earthline-16605-owner-handoff-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify rolled-back public product identity
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if curl -fsSL --max-time 25 "https://earthlinedevelopment.org/?sandboxgate=${GITHUB_RUN_ID}-${i}" -o /tmp/earthline.html; then
              has16603=0; has16605=0
              grep -F 'lineSafe16584(retrySmooth16584)' /tmp/earthline.html >/dev/null && has16603=1 || true
              grep -F 'EARTHLINE 16605' /tmp/earthline.html >/dev/null && has16605=1 || true
              if [ "$has16603" -eq 1 ] && [ "$has16605" -eq 0 ]; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Compare extent-only vs owner-handoff candidate
        run: node lab/16605-owner-handoff-sandbox.mjs
      - name: Upload sandbox evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthline-16605-owner-handoff-sandbox
          path: |
            /tmp/earthline-16605-owner-handoff-sandbox.json
            /tmp/sandbox-*.png
          if-no-files-found: warn
          retention-days: 7
