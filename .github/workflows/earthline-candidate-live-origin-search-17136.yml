name: Earthline Candidate Live-Origin Search 17136
on:
  push:
    branches: [repair/search-handoff-stability-17136]
    paths:
      - 'tests/candidate-live-origin-search-handoff-17136.mjs'
      - '.github/workflows/earthline-candidate-live-origin-search-17136.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/search-handoff-stability-17136
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/candidate-live-origin-search-handoff-17136.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-candidate-live-origin-search-17136
          path: artifacts/candidate-live-origin-search-handoff-17136/
          if-no-files-found: error
          retention-days: 7
