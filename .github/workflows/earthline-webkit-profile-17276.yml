name: Earthline WebKit Refinement Profile 17276
on:
  push:
    branches: [repair/browser-performance-live-17268]
    paths:
      - 'tests/browser-regional-profile-17276.mjs'
      - '.github/workflows/earthline-webkit-profile-17276.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/browser-performance-live-17268}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          python3 tests/apply-defer-local-jurisdiction-17275.py
          python3 tests/apply-browser-yield-17268.py
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: env EARTHLINE_URL='http://127.0.0.1:8787/' STATES='Texas|Vermont' node tests/browser-regional-profile-17276.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-refinement-profile-17276
          path: artifacts/browser-profile-17276/
          if-no-files-found: warn
