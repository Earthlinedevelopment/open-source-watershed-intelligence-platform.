name: Mantra 83 Renderer Boundary
on:
  push:
    branches: [mantra83-forensic]
    paths:
      - 'science/mantra83-renderer-adapter.mjs'
      - 'tests/mantra83-renderer-adapter.mjs'
      - 'tests/mantra83-full-purity.mjs'
      - '.github/workflows/earthline-mantra83-renderer-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/mantra83-engine-bundle.mjs
      - run: node tests/mantra83-publication.mjs
      - run: node tests/mantra83-renderer-adapter.mjs
      - run: node tests/mantra83-full-purity.mjs
