name: Earthline Vermont High-Recall Evidence Pool 17111

on:
  push:
    branches:
      - research/elder-density-calibration-17100
    paths:
      - '.github/workflows/earthline-vermont-high-recall-17111.yml'
      - 'tools/elder_trees/chmv2_aoi_candidates.py'
      - 'tools/elder_trees/vermont_ql1_pilot.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/elder-density-calibration-17100
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy rasterio pyproj requests
      - name: Generate Vermont controls
        run: python tools/elder_trees/vermont_ql1_pilot.py artifacts/vermont-controls
      - name: Run quota and high-recall modes around each control
        run: |
          python - <<'PY'
          import json,subprocess,pathlib
          refs=json.load(open('artifacts/vermont-controls/vermont-public-big-tree-controls.geojson'))['features']
          for mode in ('quota','all'):
              root=pathlib.Path('artifacts')/mode; root.mkdir(parents=True,exist_ok=True)
              for i,f in enumerate(refs):
                  lon,lat=f['geometry']['coordinates']
                  bbox=f"{lon-.006},{lat-.0045},{lon+.006},{lat+.0045}"
                  cmd=['python','tools/elder_trees/chmv2_aoi_candidates.py','--bbox='+bbox,'--max-per-tile=6000','--screen-size=1024','--refine-radius-m=15','--out',str(root/f'control-{i:02d}')]
                  if mode=='all': cmd.append('--preserve-all-eligible')
                  subprocess.run(cmd,check=True)
          PY
      - name: Compare control recall
        run: |
          python - <<'PY'
          import glob,json,math,pathlib
          def hav(a,b):
              lon1,lat1=a;lon2,lat2=b;R=6371008.8
              p1,p2=math.radians(lat1),math.radians(lat2)
              dp=math.radians(lat2-lat1);dl=math.radians(lon2-lon1)
              q=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*R*math.asin(min(1,math.sqrt(q)))
          refs=json.load(open('artifacts/vermont-controls/vermont-public-big-tree-controls.geojson'))['features']
          out={}
          for mode in ('quota','all'):
              ds=[]; counts=[]
              for i,r in enumerate(refs):
                  pools=glob.glob(f'artifacts/{mode}/control-{i:02d}/elder-tree-candidate-pool-*.geojson')
                  if not pools: continue
                  feats=json.load(open(pools[0]))['features']; counts.append(len(feats))
                  rp=r['geometry']['coordinates']
                  if feats: ds.append(min(hav(rp,f['geometry']['coordinates']) for f in feats))
              s=sorted(ds)
              med=(s[len(s)//2] if len(s)%2 else (s[len(s)//2-1]+s[len(s)//2])/2) if s else None
              out[mode]={
                'controls_with_candidates':len(ds),
                'within_5m':sum(x<=5 for x in ds),
                'within_10m':sum(x<=10 for x in ds),
                'within_20m':sum(x<=20 for x in ds),
                'within_30m':sum(x<=30 for x in ds),
                'median_nearest_m':round(med,2) if med is not None else None,
                'median_candidate_pool_count':sorted(counts)[len(counts)//2] if counts else None
              }
          print(json.dumps(out,indent=2))
          pathlib.Path('artifacts/vermont-high-recall-summary.json').write_text(json.dumps(out,indent=2))
          if out.get('all',{}).get('within_20m',0) < out.get('quota',{}).get('within_20m',0):
              raise SystemExit('High-recall mode regressed Vermont control recall')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-vermont-high-recall-17111
          path: artifacts/
          retention-days: 14
