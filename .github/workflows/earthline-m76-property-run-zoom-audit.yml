name: Earthline M76 Property Run Zoom Audit
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-property-run-zoom-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          sed -n '17290,17440p' index.html
          echo '=== FRAME DIRECTIVE OWNER ==='
          grep -n -F 'earthlineRunFrameDirective15827' index.html || true
