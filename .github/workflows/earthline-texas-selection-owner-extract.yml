name: Earthline Texas Selection Owner Extract

on:
  push:
    branches: [diag-aquifer-east-texas]
    paths:
      - 'tests/texas-selection-owner-extract.mjs'
      - '.github/workflows/earthline-texas-selection-owner-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/texas-selection-owner-extract.mjs
