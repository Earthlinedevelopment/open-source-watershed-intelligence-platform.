name: Earthline Property Transition Restore 17133
# marker-bounded retry
# unique-marker regex retry
# stale-line cleanup retry
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-property-transition-restore-17133.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Apply exact lifecycle restore
        run: |
          python3 .github/scripts/earthline-property-transition-restore-17133.py
          git diff --check
      - name: Commit restore
        run: |
          rm -f .github/workflows/earthline-property-transition-restore-17133.yml
          rm -f .github/scripts/earthline-property-transition-restore-17133.py
          git config user.name "earthline-release-bot"
          git config user.email "earthline-release-bot@users.noreply.github.com"
          git add index.html earthline-launch-16872.js .github/workflows/earthline-property-transition-restore-17133.yml .github/scripts/earthline-property-transition-restore-17133.py
          git commit -m "fix: restore accepted Regional to Property lifecycle 17133"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
