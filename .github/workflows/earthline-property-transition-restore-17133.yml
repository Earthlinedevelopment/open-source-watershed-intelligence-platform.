name: Earthline Property Transition Restore 17133

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-property-transition-restore-17133.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0

      - name: Restore accepted Regional to Property lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          # 17124 removed the renderer's Property visibility publication.
          # Restore the accepted fallback writer; do not change geometry or paint values.
          old_visibility="    /* EARTHLINE 17124 — BUILD-CHECK-15805 is the single Property swale visibility owner. */if(t==='regional'){setPaint('earthline-ranked-swale-water-15777','line-color','#008cff');setPaint('earthline-ranked-swale-water-15777','line-opacity',1)}"
          new_visibility="    for(const id of Object.values(PROPERTY))visible(id,property);if(t==='regional'){setPaint('earthline-ranked-swale-water-15777','line-color','#008cff');setPaint('earthline-ranked-swale-water-15777','line-opacity',1)}"

          if s.count(old_visibility) != 1:
              raise SystemExit(f"Expected one 17124 visibility owner replacement; found {s.count(old_visibility)}")
          s=s.replace(old_visibility,new_visibility,1)

          # 17125 suppressed authoritative republish of committed Property GeoJSON.
          # Restore the accepted behavior so Regional->Zoom->Property cannot inherit a blank/stale source.
          old_source='''    /* EARTHLINE 17125 — Property source stability.
                 The persistent blue ditch and the living-swale renderer share SWALE_SOURCE.
                 Do not reload an unchanged committed GeoJSON source on every bounded rehydrate:
                 Mapbox can briefly blank/redraw that source, which presents as blue flicker.
                 Re-publish only for a new source, changed authoritative geometry, or an
                 actually emptied committed source. Non-committed forced refresh behavior is
                 preserved for pre-publication recovery. */
              let sourceData15792=src&&src._data;
              try{
                if((!sourceData15792||typeof sourceData15792==="string")&&src&&typeof src.serialize==="function"){
                  const serialized15792=src.serialize();
                  sourceData15792=serialized15792&&serialized15792.data;
                }
              }catch(_){}
              const sourceFeatureCount15792=safeData(sourceData15792).features.length;
              const sourceNeedsRestore15792=!!(
                committedProperty&&fc.features.length>0&&sourceFeatureCount15792===0
              );
              if(
                src&&src.setData&&
                (sourceChanged||signature!==lastSwaleSignature||sourceNeedsRestore15792||(!committedProperty&&force))
              ){
                lastSwaleSignature=signature;
                lastSwaleData=fc;
                src.setData(fc);
              }'''
          new_source='''    // A committed result is small and must be republished on every authoritative
              // refresh. Signature caching is not allowed to conceal an externally emptied
              // Mapbox source.
              if(
                src&&src.setData&&
                (force||committedProperty||sourceChanged||signature!==lastSwaleSignature)
              ){
                lastSwaleSignature=signature;
                lastSwaleData=fc;
                src.setData(fc);
              }'''

          if s.count(old_source) != 1:
              raise SystemExit(f"Expected one 17125 source-stability block; found {s.count(old_source)}")
          s=s.replace(old_source,new_source,1)

          # Preserve Jon's accepted visual repairs.
          blue="paint:{'line-color':'#008cff','line-width':['interpolate',['linear'],['zoom'],14,3.4,17,5.4,20,7.2],'line-opacity':.82}}"
          zoom=".el49-detail-shell{width:min(680px,96vw);max-height:calc(100vh - 36px);overflow:auto;"
          if blue not in s: raise SystemExit("Property blue lock missing")
          if zoom not in s: raise SystemExit("Zoom-button repair missing")
          if "earthline-presentation-lock-17139" in s: raise SystemExit("Rejected Regional override present")
          p.write_text(s,encoding="utf-8")

          q=Path("earthline-launch-16872.js")
          j=q.read_text(encoding="utf-8")
          old_zoom_refresh="""    if(t.matches?.('[data-action="zoom"]')||label.includes('zoom to location')||label.includes('zoom to this location'))refresh();"""
          new_zoom_refresh="""    /* EARTHLINE 17133 — Elder is downstream of Property publication.
       Do not run Elder on the Regional Zoom click; refresh is owned by earthline:analysis-complete. */"""
          if j.count(old_zoom_refresh) != 1:
              raise SystemExit(f"Expected one Elder Zoom refresh hook; found {j.count(old_zoom_refresh)}")
          j=j.replace(old_zoom_refresh,new_zoom_refresh,1)
          q.write_text(j,encoding="utf-8")
          PY

          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          j=Path("earthline-launch-16872.js").read_text(encoding="utf-8")
          assert "for(const id of Object.values(PROPERTY))visible(id,property);" in s
          assert "(force||committedProperty||sourceChanged||signature!==lastSwaleSignature)" in s
          assert "EARTHLINE 17124 — BUILD-CHECK-15805 is the single Property swale visibility owner." not in s
          assert "EARTHLINE 17125 — Property source stability." not in s
          assert "paint:{'line-color':'#008cff','line-width':['interpolate',['linear'],['zoom'],14,3.4,17,5.4,20,7.2],'line-opacity':.82}}" in s
          assert ".el49-detail-shell{width:min(680px,96vw);max-height:calc(100vh - 36px);overflow:auto;" in s
          assert "EARTHLINE 17133 — Elder is downstream of Property publication." in j
          assert """label.includes('zoom to this location'))refresh();""" not in j
          print("17133 transition restore contract PASS")
          PY

      - name: Commit lifecycle restore and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/earthline-property-transition-restore-17133.yml
          git config user.name "earthline-release-bot"
          git config user.email "earthline-release-bot@users.noreply.github.com"
          git add index.html earthline-launch-16872.js .github/workflows/earthline-property-transition-restore-17133.yml
          git diff --cached --name-only
          git commit -m "fix: restore accepted Regional to Property lifecycle 17133"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
