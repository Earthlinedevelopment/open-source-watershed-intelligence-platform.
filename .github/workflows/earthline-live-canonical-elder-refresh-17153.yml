name: Earthline Live Canonical Elder Refresh 17153
on:
  push:
    branches: [v2/stable-replacement-17138]
    paths:
      - '.github/workflows/earthline-live-canonical-elder-refresh-17153.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Attach Elder refresh to authoritative Property success exits only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8',errors='strict')

          marker="EARTHLINE_CANONICAL_PROPERTY_ELDER_REFRESH_17153"
          if marker not in s:
              pending=re.compile(
                  r"(setAudit\(\{settled:true,result:true,timedOut:false,corridors:count,renderVerified:false,renderPending:true,renderMode:'pending-authoritative-safe-lines'[\s\S]*?settledAt:settledAt16260\}\);\s*"
                  r"settlePropertyMapVisibility16260\(count,texture,serial\);)(\s*return true;)"
              )
              s,n1=pending.subn(
                  r"\1\n        try{window.EARTHLINE_ELDER_TREES_V1_17097?.refresh?.()}catch(_){} /* EARTHLINE_CANONICAL_PROPERTY_ELDER_REFRESH_17153 */\2",
                  s,count=1
              )

              complete=re.compile(
                  r"(setAudit\(\{stage:'published',stageLabel:'published',settled:true,result:true,timedOut:false,corridors:count,renderVerified,renderMode:texture\.ok\?'natural-texture':\(safeFallback\.ok\?'authoritative-safe-lines':'verified-zero'\)[\s\S]*?settledAt:new Date\(\)\.toISOString\(\)\}\);)(return true;)"
              )
              s,n2=complete.subn(
                  r"\1try{window.EARTHLINE_ELDER_TREES_V1_17097?.refresh?.()}catch(_){} /* EARTHLINE_CANONICAL_PROPERTY_ELDER_REFRESH_17153 */\2",
                  s,count=1
              )
              if n1!=1 or n2!=1:
                  raise SystemExit(f'Expected 1 pending + 1 complete Property success patch, got {n1} + {n2}')
          if s.count(marker)!=2:
              raise SystemExit(f'Expected exactly two canonical Elder refresh calls, found {s.count(marker)}')
          p.write_text(s,encoding='utf-8')

          # Remove the temporary global wrapper; canonical Property owner now owns refresh.
          j=Path('earthline-launch-16872.js')
          t=j.read_text(encoding='utf-8',errors='strict')
          pat=re.compile(r"\n?/\* EARTHLINE_ELDER_REPEAT_PROPERTY_REFRESH_17152[\s\S]*?\n\}\)\(\);\n?",re.M)
          t,n=pat.subn('\n',t,count=1)
          if n not in (0,1):
              raise SystemExit(f'Unexpected 17152 wrapper count {n}')
          if 'EARTHLINE_ELDER_REPEAT_PROPERTY_REFRESH_17152' in t:
              raise SystemExit('17152 wrapper still present')
          if 'EARTHLINE_CROSSHAIR_MOVE_HINT_17093' not in t:
              raise SystemExit('Approved crosshair movement hint missing')
          j.write_text(t.rstrip()+'\n',encoding='utf-8')
          print('canonical Property Elder refresh patch PASS')
          PY
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "earthline-launch-16872.js index.html "
      - name: Commit canonical repair only
        shell: bash
        run: |
          git config user.name "earthline-release-bot"
          git config user.email "earthline-release-bot@users.noreply.github.com"
          git add index.html earthline-launch-16872.js
          git commit -m "fix: refresh Elder from authoritative Property publication 17153"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
