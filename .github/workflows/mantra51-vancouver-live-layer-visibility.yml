name: Mantra 51 Vancouver Live Layer Visibility
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths: ['.github/workflows/mantra51-vancouver-live-layer-visibility.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: mantra51-global-repair-campaign}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Inspect live Vancouver water/aquifer display
        run: |
          cat > lab/mantra51-vancouver-display-inspect.mjs <<'JS'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({viewport:{width:1600,height:900}});
          await p.goto('https://earthlinedevelopment.org/?van-display='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await p.waitForSelector('#searchInput',{timeout:30000});
          await p.evaluate(()=>{const i=document.getElementById('searchInput'),b=document.getElementById('runBtn');i.value='vancouver island';i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));b.click();});
          await p.waitForFunction(()=>window.EARTHLINE_REGIONAL_TERMINAL_16539?.status==='published',{timeout:120000,polling:200});
          await p.waitForTimeout(2500);
          const out=await p.evaluate(()=>{
            const m=(typeof earthlineMap!=='undefined'&&earthlineMap)||null;
            const ids=window.IDS||{};
            const layerInfo=(id)=>{try{return id&&m?.getLayer(id)?{id,visibility:m.getLayoutProperty(id,'visibility')||'visible',type:m.getLayer(id)?.type||null}:null}catch{return null}};
            const sourceInfo=(id)=>{try{const s=id&&m?.getSource(id); const d=s?._data||null; return s?{id,count:d?.features?.length??null}:null}catch{return null}};
            const allLayers=(m?.getStyle?.()?.layers||[]).filter(l=>/aquifer|flow|water/i.test(l.id)).map(l=>({id:l.id,type:l.type,vis:m.getLayoutProperty(l.id,'visibility')||'visible'}));
            const allSources=(m?.getStyle?.()?.sources)?Object.keys(m.getStyle().sources).filter(id=>/aquifer|flow|water/i.test(id)).map(id=>sourceInfo(id)):[];
            return {
              terminal:window.EARTHLINE_REGIONAL_TERMINAL_16539||null,
              waterAudit:window.EARTHLINE_VANCOUVER_WATER_AUDIT_16912||null,
              aquiferAudit:window.EARTHLINE_VANCOUVER_AQUIFER_AUDIT_16912||null,
              ids,
              known:{
                flows:sourceInfo(ids.flows),
                aquifer:sourceInfo(ids.aquifer),
                aquiferFill:layerInfo(ids.aquiferFill),
                aquiferLine:layerInfo(ids.aquiferLine)
              },
              allLayers,allSources,
              svg:{
                regional:document.getElementById('earthlineRegionalVectorOverlay16020')?.outerHTML.slice(0,500)||null,
                waterPaths:document.querySelectorAll('[class*="water"],[id*="water"],[class*="flow"],[id*="flow"]').length
              }
            };
          });
          console.log(JSON.stringify(out,null,2));
          await b.close();
          JS
          node lab/mantra51-vancouver-display-inspect.mjs
