name: Earthline Whole Prescriber Recovery
permissions:
  contents: write
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/earthline-m48-launch-runner-16866.yml'
jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Restore complete 16785 prescriber owner
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:lab/restore-16785-prescriber-owner.py > /tmp/restore-owner.py
          python3 /tmp/restore-owner.py
          git diff --check
      - name: Parse-check restored owner
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          console.log('WHOLE_OWNER_PARSE_OK',parsed);
          NODE
      - name: Publish isolated recovery branch
        shell: bash
        run: |
          git config user.name 'Earthline Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'recovery: restore full proven 16785 prescriber owner'
          git push origin HEAD:recovery/mantra75-owner-rollback --force
