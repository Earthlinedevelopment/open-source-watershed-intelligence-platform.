name: Earthline M48 launch runner 16866
permissions:
  contents: write
on:
  push:
    branches:
      - main
jobs:
  build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra48-launch-clean-16861
          fetch-depth: 0
      - name: Apply remaining approved launch repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('index.html'); t=p.read_text(encoding='utf-8'); before=t; changes=[]

          # Restrict source relocation to the report builder only.
          a=t.find('function buildReport(data)')
          b=t.find('function institutionalReportDocument',a)
          if a<0 or b<0: raise SystemExit('report builder bounds missing')
          seg=t[a:b]
          old07='<h3 style="margin-top:24px">Source and evidence register</h3>${sourceRows(d)}'
          if old07 in seg: seg=seg.replace(old07,'',1); changes.append('sources removed page 07')
          oldB='<h2>What this release is required to preserve</h2>${sourceRows(d)}<h3 style="margin-top:24px">Preserved product artifacts</h3>'
          if oldB in seg: seg=seg.replace(oldB,'<h2>What this release is required to preserve</h2><h3 style="margin-top:24px">Preserved product artifacts</h3>',1); changes.append('sources removed Appendix B')
          seg=seg.replace('${finalSourcesPage16864(data)}','')
          cmark="${footer(data,'C')}</section>"
          pos=seg.rfind(cmark)
          if pos<0: raise SystemExit('Appendix C footer missing')
          pos+=len(cmark)
          seg=seg[:pos]+'\n${finalSourcesPage16864(data)}'+seg[pos:]
          changes.append('sources moved to true final report page')
          t=t[:a]+seg+t[b:]

          oldnote='Modelled — not a measured infiltration rate. The headline is the mean of per-cell Earthline recharge scores. The rows expose the weighted inputs; because the engine clamps each cell before averaging, row means are explanatory rather than a second independent calculation.'
          newnote='Modelled — not a measured infiltration rate. SCORE 0–100 is the mean of per-cell Earthline recharge suitability scores. Base weights are Aquifer 0.30, Soil 0.20, Slope 0.18, Flow 0.17, plus a 0.15 climate-need term centered at 50 before the rainfall multiplier. Rows are explanatory means from the same inputs; they are not a second independent calculation.'
          if oldnote in t: t=t.replace(oldnote,newnote,1); changes.append('DATA wording synchronized')
          elif newnote not in t: raise SystemExit('DATA explanatory note missing')

          old="const casing=grade==='A'?15:grade==='B'?12:9,core=grade==='A'?9.2:grade==='B'?7.2:5.2;"
          new="const regionalZoom=Number(map?.getZoom?.()||6),regionalScale=regionalZoom<7?0.46:(regionalZoom<8?0.62:(regionalZoom<9?0.78:1)),casing=(grade==='A'?15:grade==='B'?12:9)*regionalScale,core=(grade==='A'?9.2:grade==='B'?7.2:5.2)*regionalScale;"
          if old in t: t=t.replace(old,new,1); changes.append('Regional statewide swale strokes scaled')
          elif 'regionalScale=regionalZoom<7?0.46' not in t: raise SystemExit('Regional swale width owner missing')
          oldh="stroke:light,'stroke-width':grade==='A'?'1.8':'1.2'"
          newh="stroke:light,'stroke-width':String((grade==='A'?1.8:1.2)*regionalScale)"
          if oldh in t: t=t.replace(oldh,newh,1); changes.append('Regional highlight scaled')

          marker="window.EARTHLINE_LAUNCH_CANDIDATE_16866={build:'16866',scope:'approved launch repairs only',at:new Date().toISOString()};"
          if 'EARTHLINE_LAUNCH_CANDIDATE_16866' not in t: t=t.replace('</body>','<script>'+marker+'</script></body>',1)

          if t==before: raise SystemExit('No launch changes applied')
          p.write_text(t,encoding='utf-8')
          Path('lab').mkdir(exist_ok=True)
          Path('lab/mantra48-launch-candidate-16866.json').write_text(json.dumps({'build':'16866','changes':changes},indent=2),encoding='utf-8')
          print(json.dumps({'build':'16866','changes':changes},indent=2))
          PY
      - name: Static and JavaScript regression gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,os
          t=Path('index.html').read_text(encoding='utf-8')
          a=t.find('function buildReport(data)'); b=t.find('function institutionalReportDocument',a); seg=t[a:b]
          checks={
            'Property Modelling':'Property Modelling' in t,
            'Contact':'mailto:info@earthlinedevelopment.org' in t,
            'Spanish':'Español' in t and "'es'" in t,
            'Vancouver Island':'"vancouver island":{name:"Vancouver Island"' in t,
            'Report aquifers':'const aquiferSvg=aquiferFeatures.map' in t and '${aquiferSvg}' in t,
            'Sources once at end':seg.count('${finalSourcesPage16864(data)}')==1 and seg.rfind('${finalSourcesPage16864(data)}')>seg.rfind("${footer(data,'C')}</section>"),
            'No sourceRows page07':'Source and evidence register</h3>${sourceRows(d)}' not in seg,
            'No sourceRows appendixB':'What this release is required to preserve</h2>${sourceRows(d)}' not in seg,
            'DATA sync':'SCORE 0–100 is the mean of per-cell Earthline recharge suitability scores.' in t,
            'Regional scale':'regionalScale=regionalZoom<7?0.46' in t,
            'Natural texture':'const TILE_UP=' in t and 'const TILE_FLIP=' in t,
            'Search Orb':'id="searchOrb"' in t,
            'One map':len(re.findall(r'id=["\']map["\']',t))==1,
          }
          print(checks)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('Static launch failures: '+', '.join(bad))
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S|re.I)
          failures=[]
          for i,s in enumerate(scripts):
              if not s.strip(): continue
              fd,path=tempfile.mkstemp(suffix='.js'); os.close(fd); Path(path).write_text(s,encoding='utf-8')
              r=subprocess.run(['node','--check',path],capture_output=True,text=True); os.unlink(path)
              if r.returncode: failures.append((i,r.stderr[-1000:]))
          if failures: print(failures[:3]); raise SystemExit('JS syntax failure')
          print('PASS syntax + locks')
          PY
      - name: Verify blue texture repair against live parent
        shell: bash
        run: |
          python3 -m pip install pillow --quiet
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re,base64,io,colorsys,subprocess
          now=Path('index.html').read_text(encoding='utf-8')
          base=subprocess.check_output(['git','show','2b662f83eb5abe9fddc9fbdc35daf98bb80141ae:index.html'],text=True)
          for name in ('TILE_UP','TILE_FLIP'):
              pat=re.compile(r"const\s+"+name+r"='data:image/(?:webp|png);base64,([^']+)'" )
              ma,mb=pat.search(base),pat.search(now)
              if not ma or not mb: raise SystemExit(name+' tile missing')
              ia=Image.open(io.BytesIO(base64.b64decode(ma.group(1)))).convert('RGBA'); ib=Image.open(io.BytesIO(base64.b64decode(mb.group(1)))).convert('RGBA')
              if ia.size!=ib.size: raise SystemExit(name+' dimensions changed')
              ap=list(ia.getdata()); bp=list(ib.getdata()); changed=[i for i,(x,y) in enumerate(zip(ap,bp)) if x!=y]
              if len(changed)<5000: raise SystemExit(name+' insufficient water-pixel change: '+str(len(changed)))
              sats=[]
              for i in changed:
                  r,g,bl,a=bp[i]; h,s,v=colorsys.rgb_to_hsv(r/255,g/255,bl/255); sats.append(s)
              sat=sum(sats)/len(sats)
              if sat<.80: raise SystemExit(name+' saturation too low')
              print(name,len(changed),round(sat,3))
          PY
      - name: Browser smoke test candidate
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8787 >/tmp/earthline-http.log 2>&1 &
          cat >/tmp/smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:8787/index.html',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(1800);
          const r=await page.evaluate(()=>({map:!!document.getElementById('map'),orb:!!document.getElementById('searchOrb'),heading:document.body.innerText.includes('Property Modelling'),spanish:[...document.querySelectorAll('#earthlineLanguage16488 option')].some(o=>o.value==='es'),contact:!!document.getElementById('earthlineRailContact16512'),launch:!!window.EARTHLINE_LAUNCH_CANDIDATE_16866,report:!!document.getElementById('earthlineVermontReport16149')}));
          console.log(r,errors); if(errors.length)throw new Error(errors.join(' | ')); for(const [k,v] of Object.entries(r))if(!v)throw new Error('smoke '+k);
          await page.locator('#searchInput').fill('Vancouver Island'); await page.locator('#searchOrb').click(); await page.waitForTimeout(2200);
          const vi=await page.evaluate(()=>({name:String(window.M?.loc?.name||''),country:String(window.M?.loc?.countryCode||''),type:String(window.M?.loc?.placeType||''),input:document.getElementById('searchInput')?.value||''}));
          console.log(vi); if(!/Vancouver Island/i.test(vi.name+' '+vi.input)||vi.country.toLowerCase()!=='ca')throw new Error('Vancouver Island resolution failed');
          await browser.close();
          JS
          node /tmp/smoke.mjs
      - name: Commit verified candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html lab/mantra48-launch-candidate-16866.json
          git commit -m 'candidate: 16866 verified launch repairs'
          git push origin HEAD:mantra48-launch-clean-16861
