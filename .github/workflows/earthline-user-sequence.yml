name: Earthline click-path audit v4 (read-only, real public site)
on:
  push:
    branches: [test/user-sequence-audit-v4]
  workflow_dispatch:
    inputs:
      only:
        description: 'Scenario prefixes to run, e.g. S5,S0 (blank = all)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Self-test of the audit (stand-in page, no network). The audit is not trusted until this passes.
        run: node tests/user-sequence-selftest.mjs
      - name: Run the founder's click path on the public site
        id: run
        continue-on-error: true
        env:
          EARTHLINE_ONLY: ${{ github.event.inputs.only }}
        run: |
          set +e
          node tests/earthline-user-sequence-audit.mjs
          code=$?
          mkdir -p user-sequence-audit
          echo "AUDIT_EXIT=$code (0 pass, 1 science or page failure, 3 test-infrastructure failure)" | tee user-sequence-audit/EXIT.txt
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-sequence-audit
          path: user-sequence-audit/
      - name: Enforce
        if: steps.run.outcome == 'failure'
        run: exit 1
