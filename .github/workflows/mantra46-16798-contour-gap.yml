name: Mantra 46 16798 Contour-Gap Candidate Generation

on:
  push:
    branches:
      - diagnostic-m46-16798-contour-gap
    paths:
      - 'tests/mantra46-16798-contour-gap.mjs'
      - '.github/workflows/mantra46-16798-contour-gap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Evaluate targeted contour-gap generation
        run: node tests/mantra46-16798-contour-gap.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16798-contour-gap
          path: artifacts/mantra46-16798-contour-gap/
          if-no-files-found: error
