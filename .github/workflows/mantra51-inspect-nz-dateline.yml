name: Mantra 51 Inspect NZ Dateline Navigation
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-inspect-nz-dateline.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Inspect world copy and longitude handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for needle in ["renderWorldCopies","setRenderWorldCopies","-180","180","wrapLng","LngLat.wrap","setProjection","mercator"]:
            print("\n===== "+needle+" =====")
            pos=0; count=0
            while count<35:
              i=s.find(needle,pos)
              if i<0: break
              print(s[max(0,i-1200):min(len(s),i+2400)].replace("\n"," "))
              print("\n---")
              pos=i+len(needle);count+=1
          PY
