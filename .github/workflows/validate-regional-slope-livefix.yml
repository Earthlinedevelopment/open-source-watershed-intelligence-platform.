name: Validate Regional 0-4 Slope Livefix
'on':
  push:
    branches: [regional-slope-livefix]
    paths:
      - tools/patch-regional-slope-4.py
      - tools/patch-regional-candidate-anchor.py
      - .github/workflows/validate-regional-slope-livefix.yml
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        state: [Vermont, Colorado, Nevada, Arkansas, California]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: Slope — ${{ matrix.state }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: regional-slope-livefix
      - run: |
          python3 tools/patch-regional-slope-4.py
          python3 tools/patch-regional-candidate-anchor.py
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          sleep 1
      - name: Use hotspot anchor in validator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/validate-property-50states-final.mjs')
          s=p.read_text()
          old="const c=f.geometry.coordinates[Math.floor((f.geometry.coordinates.length-1)/2)];\n        return {lng:Number(c[0]),lat:Number(c[1]),source:'property-50-state-certification-16728'"
          new="const c=f.geometry.coordinates[Math.floor((f.geometry.coordinates.length-1)/2)];\n        const p=f.properties||{};\n        const lng=Number.isFinite(Number(p.property_anchor_lng))?Number(p.anchorLng):Number(c[0]);\n        const lat=Number.isFinite(Number(p.property_anchor_lat))?Number(p.anchorLat):Number(c[1]);\n        return {lng,lat,source:'property-50-state-certification-16728'"
          if old not in s: raise SystemExit('validator midpoint target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate patched candidate
        env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          EARTHLINE_CANDIDATE_ORIGIN: '1'
          STATES: ${{ matrix.state }}
          OUT: result.json
        run: node tests/validate-property-50states-final.mjs
