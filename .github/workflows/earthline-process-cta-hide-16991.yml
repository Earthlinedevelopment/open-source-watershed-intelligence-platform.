name: Earthline process CTA hide 16991
on:
  push:
    branches: [pages-live]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: python .github/scripts/earthline_process_cta_hide_16991.py
      - run: |
          git config user.name EarthlineBuildBot
          git config user.email info@earthlinedevelopment.org
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: hide launch CTAs on Earthline Process 16991"
          git push
