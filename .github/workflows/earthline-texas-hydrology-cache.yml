name: Earthline Texas Exact Hydrology Cache Test
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths: ['tests/texas-exact-hydrology-cache.mjs','.github/workflows/earthline-texas-hydrology-cache.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node tests/texas-exact-hydrology-cache.mjs
