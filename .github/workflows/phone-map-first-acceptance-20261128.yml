name: Earthline phone map-first acceptance
on:
  push:
    branches: [repair/phone-map-first-20261128, pages-live]
    paths:
      - earthline-launch-16872.js
      - tests/earthline-phone-smoke-final-20261128.mjs
      - .github/workflows/phone-map-first-acceptance-20261128.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome for phone input and map visibility
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Prepare approved presentation asset cache keys on isolated branch
        if: github.ref_name == 'repair/phone-map-first-20261128'
        run: python3 tools/repair-phone-asset-keys-20261128.py
      - name: Test map-first phone open, close, Property return, and hint dismissal
        run: node tests/earthline-phone-smoke-final-20261128.mjs
      - name: Commit tested asset cache keys to isolated branch only
        if: github.ref_name == 'repair/phone-map-first-20261128'
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name 'Earthline Recovery Test'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'fix(ui): refresh mobile and Elder script cache keys'
            git push origin HEAD:repair/phone-map-first-20261128
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-phone-map-first
          path: artifacts/phone-final
          retention-days: 7
