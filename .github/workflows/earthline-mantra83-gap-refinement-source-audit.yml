name: Mantra 83 Gap Refinement Source Audit
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/earthline-mantra83-gap-refinement-source-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          for(const term of ['EARTHLINE 16738','const defs16731','coverage-gap-1','EARTHLINE 16741','const defs16741','late-gap']){
            let from=0,n=0;while(true){const at=s.indexOf(term,from);if(at<0)break;console.log('M83GAP '+JSON.stringify({term,at,text:s.slice(Math.max(0,at-5000),Math.min(s.length,at+14000))}));from=at+term.length;if(++n>=6)break;}
          }
          NODE
