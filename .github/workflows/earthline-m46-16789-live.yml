name: Mantra 46 16789 Live Selection Gate

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/mantra46-16789-live.mjs'
      - '.github/workflows/earthline-m46-16789-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for 16789 deployment
        run: |
          for i in $(seq 1 60); do
            html="$(curl -fsS --max-time 20 https://earthlinedevelopment.org/ || true)"
            if printf '%s' "$html" | grep -q 'EARTHLINE 16789 — SAME-PARENT COUNT-NEUTRAL FINAL SPREAD'; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Run live selection gate
        run: node tests/mantra46-16789-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16789-live
          path: artifacts/mantra46-16789-live/
          if-no-files-found: warn
