name: Earthline NZ root diagnostic 16896
on:
  push:
    branches: [mantra49-final-wrap-16896]
    paths:
      - .github/workflows/mantra49-nz-root-diagnostic-16896.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install playwright@1.55.0 --no-save
      - name: Trace New Zealand search framing target and Property gates
        run: |
          cat > /tmp/nz16896.js <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs'),http=require('http');
          const srv=http.createServer((req,res)=>{let p=req.url.split('?')[0];if(p==='/')p='/index.html';try{const b=fs.readFileSync('.'+p);res.writeHead(200,{'Content-Type':p.endsWith('.js')?'application/javascript':p.endsWith('.css')?'text/css':'text/html'});res.end(b)}catch(e){res.writeHead(404);res.end('no')}}).listen(8787,'127.0.0.1');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const b=await chromium.launch({headless:true,executablePath:'/usr/bin/chromium',args:['--no-sandbox']});const p=await b.newPage({viewport:{width:1800,height:950}});p.on('console',m=>{if(/Earthline|NZ16896/i.test(m.text()))console.log('CONSOLE',m.text())});await p.goto('http://127.0.0.1:8787/?nz16896='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});await p.waitForSelector('#searchInput',{timeout:30000});await sleep(1800);
          console.log('FUNCTIONS',await p.evaluate(()=>({resolveSearch:typeof resolveSearch,applyLocation:typeof applyLocation,terminalPropertyRun:typeof terminalPropertyRun,waterGate:typeof earthlineCrosshairMappedOpenWater16529,propertyOwner:typeof window.earthlineDeclarePropertyAtCrosshair16173,map:!!window.earthlineMap})));
          await p.fill('#searchInput','New Zealand');await p.press('#searchInput','Enter');
          for(const ms of [300,1000,3000,7000,15000]){await sleep(ms-(global.last||0));global.last=ms;const s=await p.evaluate(()=>{const m=window.earthlineMap||null,c=m?.getCenter?.();const loc=(typeof M!=='undefined'&&M.loc)||null,t=window.EARTHLINE_PROPERTY_TARGET_16201||null;let water=null;try{if(typeof earthlineCrosshairMappedOpenWater16529==='function'&&t)water=earthlineCrosshairMappedOpenWater16529({lng:Number(t.lng),lat:Number(t.lat)})}catch(e){water='ERR:'+e.message}return{loc:loc&&{name:loc.name,fullName:loc.fullName,placeType:loc.placeType,lng:loc.lng,lat:loc.lat,bbox:loc.bbox,zoomHint:loc.zoomHint,userSelectedSite:loc.userSelectedSite},center:c&&{lng:c.lng,lat:c.lat},zoom:m?.getZoom?.(),target:t&&{lng:t.lng,lat:t.lat,code:t.code,query:t.query,source:t.source},water,runState:document.documentElement.dataset.earthlineRunState,analysisTier:document.documentElement.dataset.earthlineAnalysisTier,status:document.getElementById('earthlineVermontStatus16147')?.textContent||document.getElementById('statusText')?.textContent||'',displayed:window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null}});console.log('SNAP',ms,JSON.stringify(s));}
          const direct=await p.evaluate(async()=>{const fn=window.earthlineDeclarePropertyAtCrosshair16173;if(typeof fn!=='function')return {available:false};const t=window.EARTHLINE_PROPERTY_TARGET_16201||null;const before={t,runState:document.documentElement.dataset.earthlineRunState};let result,err;try{result=await Promise.race([Promise.resolve(fn()),new Promise(r=>setTimeout(()=>r('__TIMEOUT__'),12000))])}catch(e){err=String(e&&e.message||e)}return{available:true,before,result,err,afterTarget:window.EARTHLINE_PROPERTY_TARGET_16201||null,waterAudit:window.EARTHLINE_PROPERTY_WATER_BODY_GATE_16529||null,propertyAudit:window.EARTHLINE_PROPERTY_AUDIT_16173||window.EARTHLINE_PROPERTY_RUN_AUDIT_16173||null,runState:document.documentElement.dataset.earthlineRunState}});console.log('DIRECT_PROPERTY',JSON.stringify(direct));await b.close();srv.close();})().catch(e=>{console.error(e);srv.close();process.exit(1)});
          JS
          node /tmp/nz16896.js
      - name: Trace exact source gates
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['async function terminalPropertyRun','function terminalPropertyRun','earthlineCrosshairMappedOpenWater16529','EARTHLINE_PROPERTY_TARGET_16201','targetZoom=propertyTarget','cameraForBounds']:
            print('\n###',needle)
            i=s.find(needle)
            print('INDEX',i)
            if i>=0: print(s[max(0,i-1400):i+3200])
          PY
