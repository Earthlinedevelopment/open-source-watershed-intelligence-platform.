name: Earthline Final Launch Candidate 17503
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/earthline-final-launch-17503.yml'
  workflow_dispatch:
permissions: {contents: read}

jobs:
  regional-linux:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17503
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          git fetch origin repair/regional-clean-presentation-17434
          git show origin/repair/regional-clean-presentation-17434:tests/browser-regional-clean-17435.mjs > tests/browser-regional-clean-17435.mjs
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: |
          if [ '${{ matrix.browser }}' = 'firefox' ]; then
            xvfb-run -a env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='firefox' HEADLESS='false' WAIT_MS='90000' STATES='Vermont|Texas|New York|Arkansas|Iowa|Colorado|California' node tests/browser-regional-clean-17435.mjs
          else
            env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='chromium' HEADLESS='true' WAIT_MS='90000' STATES='Vermont|Texas|New York|Arkansas|Iowa|Colorado|California' node tests/browser-regional-clean-17435.mjs
          fi

  regional-webkit:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17503
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          git fetch origin repair/regional-clean-presentation-17434
          git show origin/repair/regional-clean-presentation-17434:tests/browser-regional-clean-17435.mjs > tests/browser-regional-clean-17435.mjs
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - run: |
          python3 -m http.server 8787 --bind 0.0.0.0 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: env EARTHLINE_URL='http://127.0.0.1:8787/' BROWSER='webkit' HEADLESS='false' WAIT_MS='90000' STATES='Vermont|Texas|New York|Arkansas|Iowa|Colorado|California' node tests/browser-regional-clean-17435.mjs

  report-linux:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
