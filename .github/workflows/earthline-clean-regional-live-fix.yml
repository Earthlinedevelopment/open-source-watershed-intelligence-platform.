name: Earthline Clean Regional Live Fix
on:
  push:
    branches:
      - recovery/mantra75-live-engine-clean
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/apply-regional-live-fix.py
      - run: |
          git config user.name "Earthline"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: restore Regional balance and visibility"
          git push origin HEAD:recovery/mantra75-live-engine-clean
