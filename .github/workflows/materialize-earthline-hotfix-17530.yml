name: Materialize Earthline Hotfix 17530
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/materialize-earthline-hotfix-17530.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/earthline-launch-17530, fetch-depth: 0}
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/apply-firefox-kernel-single-read-17530.py > /tmp/apply.py
          python3 /tmp/apply.py
      - run: |
          git config user.name "Earthline CI"
          git config user.email "info@earthlinedevelopment.org"
          git add earthline-elder-worker-17129.js
          git commit -m "candidate: Firefox Elder single-read warm 17530"
          git push origin HEAD:candidate/earthline-launch-17530
