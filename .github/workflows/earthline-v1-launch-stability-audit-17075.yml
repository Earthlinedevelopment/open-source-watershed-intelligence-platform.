name: Earthline V1 Launch Stability Audit 17075

on:
  push:
    branches:
      - stability/v1-launch-audit-17075
    paths:
      - 'tests/v1-launch-stability-audit-17075.mjs'
      - '.github/workflows/earthline-v1-launch-stability-audit-17075.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability/v1-launch-audit-17075
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Static JavaScript parse
        run: |
          node --check earthline-launch-16872.js
          node --check earthline-language-hotfix-16890.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated Earthline server
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/earthline-http.log
          exit 1
      - name: Run cross-platform startup and navigation stability audit
        env:
          EARTHLINE_URL: http://127.0.0.1:8787/
        run: node tests/v1-launch-stability-audit-17075.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-v1-launch-stability-17075
          path: artifacts/v1-launch-stability-17075/
          if-no-files-found: warn
          retention-days: 7
