name: Earthline report readability 16988
on:
  push:
    branches:
      - pages-live
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Increase supporting map text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          a=s.index("function mapSvg(d,small=false){")
          b=s.index("  return parts.join('');\n}",a)+len("  return parts.join('');\n}")
          fn=s[a:b]
          if "el-report-hydro-aquifer-16987" not in fn:
              raise SystemExit("16987 report renderer missing")
          fn=fn.replace("el-report-hydro-aquifer-16987","el-report-hydro-aquifer-16988",1)

          changes=[
            ('font-size="8.1"','font-size="10.6"'),
            ('font-size="7.3" font-weight="700"','font-size="8.9" font-weight="750"'),
            ('font-size="9.1" font-weight="800"','font-size="10.5" font-weight="850"'),
            ('font-size="7.2"','font-size="9.4"'),
            ('font-size="8.0"','font-size="10.4"'),
            ('font-size="7.6"','font-size="9.8"'),
            ('font-size="7.5" font-weight="800"','font-size="9.6" font-weight="850"'),
            ('font-size="7.1"','font-size="9.2"'),
            ('font-size="6.8"','font-size="8.8"')
          ]
          for old,new in changes:
              if old not in fn:
                  raise SystemExit("missing typography token: "+old)
              fn=fn.replace(old,new)

          # Darken supporting copy slightly for print/screen legibility.
          fn=fn.replace('fill="#6e7975"','fill="#55625d"')
          fn=fn.replace('fill="#6f7b76"','fill="#596661"')
          fn=fn.replace('fill="#4d5f57"','fill="#394d45"')
          fn=fn.replace('fill="#5c6963"','fill="#46564f"')
          fn=fn.replace('fill="#66736d"','fill="#52615b"')
          fn=fn.replace('fill="#78837e"','fill="#5f6b66"')

          out=s[:a]+fn+s[b:]

          # Enlarge only the Figure 1 caption under the map.
          css_old='.el49-figure figcaption{'
          if css_old in out:
              i=out.index(css_old)
              j=out.index('}',i)
              block=out[i:j+1]
              import re
              if 'font-size:' in block:
                  block2=re.sub(r'font-size:\s*[^;}]+' ,'font-size:15px',block,count=1)
              else:
                  block2=block[:-1]+'font-size:15px;line-height:1.45;color:#40545c;}'
              out=out[:i]+block2+out[j+1:]
          else:
              raise SystemExit("figure caption css token missing")

          if "el-report-hydro-aquifer-16988" not in out:
              raise SystemExit("16988 marker missing")
          p.write_text(out,encoding="utf-8")
          PY
          git config user.name "Earthline Build Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "style: enlarge supporting report map text 16988"
          git push origin HEAD:pages-live
