name: Mantra 51 Build Canonical How Swales
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-build-canonical-how-swales.yml'
      - 'scripts/consolidate_how_swales_16923.py'
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate How Bioswales Work into one canonical source
        run: |
          python3 scripts/consolidate_how_swales_16923.py
          git diff --check
          git add index.html
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git commit -m "fix: consolidate How Bioswales Work into one canonical narrative"
          git push
