name: Mantra 51 Promote NZ Crosshair Fix Only
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-promote-nz-crosshair-only.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Patch production NZ crosshair owner only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          original=s
          if "earthline-language-hotfix-16890.js" not in s:
              raise SystemExit("language hotfix reference missing before patch")
          old_simple="""      const mapEl=document.getElementById('map');
      if(mapEl&&(ev.target===mapEl||mapEl.contains(ev.target))){
        window.EARTHLINE_COUNTRY_TARGET_LOCK_16845=false;
      }"""
          old_surface="""                const mapEl=document.getElementById('map');
                const mapSurface=ev.target&&ev.target.closest?ev.target.closest('.mapboxgl-map, #map, [data-earthline-map]'):null;
                if(mapSurface||mapEl&&(ev.target===mapEl||mapEl.contains(ev.target))){"""
          new_surface="""                const mapEl=document.getElementById('map');
                const realMapEl=document.getElementById('mapboxBase');
                const mapSurface=ev.target&&ev.target.closest?ev.target.closest('.mapboxgl-map, #mapboxBase, #map, [data-earthline-map]'):null;
                if(mapSurface||(mapEl&&(ev.target===mapEl||mapEl.contains(ev.target)))||(realMapEl&&(ev.target===realMapEl||realMapEl.contains(ev.target)))){"""
          new_simple="""      const mapEl=document.getElementById('map');
      const realMapEl=document.getElementById('mapboxBase');
      const mapSurface=ev.target&&ev.target.closest?ev.target.closest('.mapboxgl-map, #mapboxBase, #map, [data-earthline-map]'):null;
      if(mapSurface||(mapEl&&(ev.target===mapEl||mapEl.contains(ev.target)))||(realMapEl&&(ev.target===realMapEl||realMapEl.contains(ev.target)))){
        window.EARTHLINE_COUNTRY_TARGET_LOCK_16845=false;
      }"""
          if "const realMapEl=document.getElementById('mapboxBase');" not in s:
              if old_surface in s:
                  s=s.replace(old_surface,new_surface,1)
              elif old_simple in s:
                  s=s.replace(old_simple,new_simple,1)
              else:
                  raise SystemExit("existing NZ unlock block not recognized")
          if "const realMapEl=document.getElementById('mapboxBase');" not in s:
              raise SystemExit("NZ real canvas handoff missing after patch")
          if "earthline-language-hotfix-16890.js" not in s:
              raise SystemExit("language hotfix reference lost")
          if s==original:
              raise SystemExit("production already has real-canvas NZ handoff")
          p.write_text(s,encoding="utf-8")
          PY
          test "$(git diff --name-only)" = "index.html"
          grep -n "realMapEl=document.getElementById('mapboxBase')" index.html
          grep -n "earthline-language-hotfix-16890.js" index.html
      - name: Commit production patch
        run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: bind New Zealand crosshair to real Mapbox canvas"
          git push origin HEAD:pages-live
