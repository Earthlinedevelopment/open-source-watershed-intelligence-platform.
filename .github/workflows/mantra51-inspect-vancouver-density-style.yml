name: Mantra 51 Inspect Vancouver Flow Density Aquifer Style
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths: ['.github/workflows/mantra51-inspect-vancouver-density-style.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needles=[
            "function makeFlows",
            "streamThreshold",
            "feature_type:'flow'",
            'feature_type:"flow"',
            "IDS.aquiferFill",
            "fill-opacity",
            "AQUIFER_VT",
            "earthline-aquifer",
            "VANCOUVER_AQUIFER_AUDIT_16912",
            "earthlineClipRegionalProducts16539"
          ]
          for needle in needles:
            print("\n====",needle,"====")
            pos=0
            for _ in range(18):
              i=s.lower().find(needle.lower(),pos)
              if i<0: break
              print(s[max(0,i-3500):min(len(s),i+9000)].replace("\n"," "))
              print("\n---")
              pos=i+len(needle)
          PY
