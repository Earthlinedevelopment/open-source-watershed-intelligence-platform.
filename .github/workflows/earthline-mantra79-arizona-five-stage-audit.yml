name: Earthline Mantra 79 Arizona Slope-Scale Audit

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-mantra79-arizona-five-stage-audit.yml'
      - '.github/mantra79-candidate-c-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.55.0
      - name: Measure Property slope at swale-relevant baselines
        run: |
          cat > m79-slope-scale.mjs <<'JS'
          import { chromium } from 'playwright';
          const controls=[
            {name:'AZ1',lng:-111.93067,lat:34.21568},
            {name:'AZ2',lng:-111.93354,lat:34.21600}
          ];
          for(const control of controls){
            const browser=await chromium.launch({headless:true,channel:'chrome'});
            const page=await browser.newPage({viewport:{width:1798,height:831}});
            await page.goto('https://earthlinedevelopment.org/?m79_slope_scale='+control.name+'&t='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#searchInput',{timeout:30000});
            await page.waitForFunction(()=>document.documentElement.innerHTML.includes('EARTHLINE PROPERTY FRAME AUTHORITY 1.0'),null,{timeout:90000,polling:250});
            if(!await page.evaluate(()=>document.documentElement.classList.contains('earthline-panel-open-16188'))){
              await page.evaluate(()=>document.getElementById('earthlineRailSearch16188')?.click());await page.waitForTimeout(250);
            }
            await page.locator('#searchInput').fill('Arizona');await page.waitForTimeout(900);
            const opt=page.locator('#earthlineSearchSuggestions15970 [role="option"]').filter({hasText:/Arizona/i}).first();
            if(await opt.count())await opt.click({timeout:10000}).catch(()=>{});
            await page.evaluate(()=>document.getElementById('runBtn')?.click());
            await page.waitForFunction(()=>!!window.EARTHLINE_REGIONAL_PERFORMANCE_16191,null,{timeout:60000,polling:150});
            const before=await page.evaluate(()=>Number(window.EARTHLINE_PROPERTY_RUN_AUDIT_16173?.serial||0));
            await page.evaluate(({lng,lat})=>{
              const m=window.earthlineMap||(typeof earthlineMap!=='undefined'?earthlineMap:null);
              m.jumpTo({center:[lng,lat],zoom:16.59});try{m.fire?.('dragend')}catch(_){}
            },control);
            await page.waitForTimeout(500);
            await page.locator('#earthlineDeclareProperty16169').click({timeout:10000});
            await page.waitForFunction(prev=>{const a=window.EARTHLINE_PROPERTY_RUN_AUDIT_16173;return !!a&&Number(a.serial||0)>prev&&a.settled===true},before,{timeout:90000,polling:120});
            await page.waitForTimeout(700);
            const out=await page.evaluate(()=>{
              const radii=[1,2,3,4,6,8];
              const pct=(a,n)=>n?100*a/n:0;
              const med=a=>{const s=a.slice().sort((x,y)=>x-y);if(!s.length)return null;return s[Math.floor(s.length/2)]};
              function slopeR(x,y,r){
                if(x-r<0||x+r>=GW||y-r<0||y+r>=GH)return NaN;
                const cell=Math.max(.001,Number(M.cellM||1));
                const gx=(Number(M.h[idx(x+r,y)])-Number(M.h[idx(x-r,y)]))/(2*r*cell);
                const gy=(Number(M.h[idx(x,y+r)])-Number(M.h[idx(x,y-r)]))/(2*r*cell);
                return Math.hypot(gx,gy)*100;
              }
              function baseEligible(i,x,y){
                if(!M.inP?.[i]||M.pond?.[i])return false;
                if(M.noBuildMask?.[i])return false;
                try{if(earthlineMajorChannelUnsafeAt16288(x,y))return false}catch(_){}
                return true;
              }
              function components(mask){
                const seen=new Uint8Array(N);let count=0,largest=0,total=0;
                const qx=new Int16Array(N),qy=new Int16Array(N);
                for(let y=1;y<GH-1;y++)for(let x=1;x<GW-1;x++){
                  const i=idx(x,y);if(!mask[i]||seen[i])continue;
                  count++;let head=0,tail=0,size=0;qx[tail]=x;qy[tail]=y;tail++;seen[i]=1;
                  while(head<tail){
                    const cx=qx[head],cy=qy[head];head++;size++;
                    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
                      const nx=cx+dx,ny=cy+dy,ni=idx(nx,ny);
                      if(nx<=0||ny<=0||nx>=GW-1||ny>=GH-1||seen[ni]||!mask[ni])continue;
                      seen[ni]=1;qx[tail]=nx;qy[tail]=ny;tail++;
                    }
                  }
                  total+=size;largest=Math.max(largest,size);
                }
                return {count,largest,total};
              }
              const stats={};
              for(const r of radii){
                const vals=[],mask=new Uint8Array(N);let base=0,under4=0;
                for(let y=Math.max(2,r);y<GH-Math.max(2,r);y++)for(let x=Math.max(2,r);x<GW-Math.max(2,r);x++){
                  const i=idx(x,y);if(!baseEligible(i,x,y))continue;base++;
                  const s=slopeR(x,y,r);if(!Number.isFinite(s))continue;vals.push(s);
                  if(s<=4){under4++;mask[i]=1;}
                }
                const c=components(mask);
                stats[r]={
                  baselineM:Number((2*r*Math.max(.001,Number(M.cellM||1))).toFixed(2)),
                  baseCells:base,
                  medianSlopePct:med(vals),
                  under4Cells:under4,
                  under4Pct:pct(under4,base),
                  components:c.count,
                  largestComponentCells:c.largest,
                  largestComponentAreaM2:Number((c.largest*Math.pow(Number(M.cellM||1),2)).toFixed(1))
                };
              }
              const centerX=Math.round(GW/2),centerY=Math.round(GH/2);
              const center={};
              for(const r of radii)center[r]=slopeR(centerX,centerY,r);
              return {
                cellM:M.cellM,
                currentSlopeSafePct:M.swaleDiagnostics?.slopeSafePct,
                currentMaxSlopePct:M.swaleDiagnostics?.levelGenerator?.maxSlopePct,
                currentSafeCount:M.swaleDiagnostics?.levelGenerator?.safeCount,
                currentSkippedSlope:M.swaleDiagnostics?.levelGenerator?.skippedSlope,
                currentSwales:M.authoritativeSafeSwales15815?.features?.length||0,
                frame:window.EARTHLINE_PROPERTY_FRAME_PUBLICATION_AUDIT_M7852||null,
                center,
                stats,
                run:window.EARTHLINE_PROPERTY_RUN_AUDIT_16173||null
              };
            });
            console.log('EARTHLINE_M79_SLOPE_SCALE '+JSON.stringify({control,out}));
            await browser.close();
          }
          JS
          node m79-slope-scale.mjs
