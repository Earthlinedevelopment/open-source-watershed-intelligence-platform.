name: Earthline Legacy Presentation Cleanup
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['tools/mantra74-legacy-presentation-cleanup.py']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          fetch-depth: 0
      - run: python3 tools/mantra74-legacy-presentation-cleanup.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          for(const m of s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)){
            if(m[1].trim())new Function(m[1]);
          }
          const bad=[
            "setInterval(()=>{updateScale();ensureReportButton()},1500)",
            "reportReadinessObserver16151",
            "setInterval(()=>{removeMapButtons();ensureTopRun();ensureReportButton()},900)",
            "installPanel16188();ensureBoundary().catch",
            "for(const ev of ['zoom','move','styledata','idle'])m.on(ev,()=>{})"
          ];
          for(const x of bad)if(s.includes(x))throw Error('legacy owner remains '+x);
          console.log('EARTHLINE_LEGACY_PRESENTATION_VALIDATE_OK');
          NODE
          git diff --check
      - name: Commit and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Earthline Stability Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git rm -f tools/mantra74-legacy-presentation-cleanup.py .github/workflows/earthline-legacy-presentation-cleanup.yml
          git add index.html
          git commit -m "stability: retire legacy presentation polling owners"
          git push origin HEAD:recovery/mantra74-stability
