name: Earthline Panel Ownership Repair
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-panel-owner-trigger']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="if(options.openPanel!==false)setPanel16188(true);"
          new="if(options.openPanel===true)setPanel16188(true);"
          if s.count(old)!=1:
              raise SystemExit(f'panel side-effect owner expected 1, found {s.count(old)}')
          s=s.replace(old,new,1)
          old2="setTimeout(()=>setPropertyTarget16201({lng:Number(ll[0]),lat:Number(ll[1]),source:'corridor',code,score:Number(p.score||0)},{scroll:true}),0)"
          new2="setTimeout(()=>setPropertyTarget16201({lng:Number(ll[0]),lat:Number(ll[1]),source:'corridor',code,score:Number(p.score||0)},{scroll:true,openPanel:false}),0)"
          if s.count(old2)!=1:
              raise SystemExit(f'corridor target call expected 1, found {s.count(old2)}')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          print('EARTHLINE_PANEL_TARGET_SIDE_EFFECT_RETIRED')
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue; new Function(m[1]);
          }
          if(s.includes("if(options.openPanel!==false)setPanel16188(true);"))throw Error('default panel-open side effect remains');
          if(!s.includes("if(options.openPanel===true)setPanel16188(true);"))throw Error('explicit panel-open rule missing');
          console.log('EARTHLINE_PANEL_OWNER_PARSE_OK');
          NODE
          git diff --check
      - name: Commit and remove audit scaffold
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Earthline Stability Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git rm -f .github/workflows/earthline-panel-owner-trace.yml .earthline-panel-owner-trigger
          git add index.html earthline-launch-16872.js
          git commit -m "stability: make Property target panel opening explicit"
          git push origin HEAD:recovery/mantra74-stability
