name: Earthline Panel Owner Trace
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-panel-owner-trigger']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('index.html'),Path('earthline-launch-16872.js')]:
            print('FILE',p)
            for i,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              if 'setPanel16188(' in line or "earthline-panel-open-16188" in line and ('classList.add' in line or 'classList.toggle' in line):
                print(f'{i}: {line}')
          PY
