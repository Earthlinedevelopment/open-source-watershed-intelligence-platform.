name: Earthline Panel Owner Trace
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-panel-owner-trigger']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(s,1):
            if 'setPropertyTarget16201(' in line:
              print(f'{i}: {line}')
          PY
