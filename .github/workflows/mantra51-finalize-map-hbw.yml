name: Mantra 51 Finalize Map and How Swales
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - 'scripts/finalize_report_map_hbw_16942.py'
      - '.github/workflows/mantra51-finalize-map-hbw.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 scripts/finalize_report_map_hbw_16942.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='ignore')
          assert 'return shapes+label;' not in s
          assert 'fill="rgba(92,170,202,.18)"' in s
          assert 'stroke="#5b9fc2" stroke-width="2.15"' in s
          assert 'Planted bioswale' in s
          assert "'How to read this':'The idea in one minute'" in s
          assert 'If you have two minutes' not in s[s.find('const map16940='):s.find('const replacements16941=',s.find('const map16940='))+6000]
          assert 'The Corrections Registry and the complete source list are kept at the end' in s
          PY
          git config user.name Earthlinedevelopment
          git config user.email info@earthlinedevelopment.org
          git add index.html
          git commit -m 'fix: finalize report map and How Swales hierarchy'
          git push
