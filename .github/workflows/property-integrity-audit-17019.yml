name: Earthline Property Integrity Audit 17019
on:
  push:
    branches: [candidate-property-integrity-17019]
    paths:
      - '.github/workflows/property-integrity-audit-17019.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract authoritative Property owners
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=[
            'selected regional corridor is not backed by a successfully committed current Regional result',
            'PROPERTY ANALYSIS BLOCKED',
            'EARTHLINE_REGIONAL_PROPERTY_HANDOFF_AUDIT_16347',
            'Exclusion evidence did not complete',
            'Property publication must remain blocked',
            'NO MAPPED EXCLUSIONS RETURNED',
            'function makeSwales',
            'focusMode?80',
            'chosen.length>=',
            '0.72',
            'Property detail published'
          ]
          for n in needles:
            print('\n===== '+n+' =====')
            start=0;hits=0
            while True:
              i=s.find(n,start)
              if i<0 or hits>=8: break
              print('\n--- @',i,'---')
              print(s[max(0,i-5500):min(len(s),i+12000)])
              start=i+len(n);hits+=1
            print('HITS',hits)
          PY
