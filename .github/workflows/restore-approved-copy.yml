name: Stage approved Recharge Potential wording only
on:
  push:
    branches: [repair/restore-approved-copy-elder-20261114]
    paths: [.github/workflows/restore-approved-copy.yml]
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Replace exact user-visible gauge and DATA labels
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "a46d094cbdc37ecdc49f53a784bdd870c800627a"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          assert s.count('Recharge Suitability')==6,s.count('Recharge Suitability')
          s=s.replace('Recharge Suitability','Recharge Potential')
          assert s.count('Recharge Suitability')==0
          p.write_text(s)
          PY
          git diff --numstat -- index.html
          git rm .github/workflows/restore-approved-copy.yml
          git config user.name 'Earthline approved copy restoration'
          git config user.email 'info@earthlinedevelopment.org'
          git add index.html
          git commit -m 'fix(copy): use Recharge Potential throughout gauge and DATA accessibility labels'
          git push origin HEAD:repair/restore-approved-copy-elder-20261114
