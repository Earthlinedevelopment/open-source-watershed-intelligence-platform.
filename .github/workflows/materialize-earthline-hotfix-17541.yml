name: Materialize Earthline Hotfix 17541
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/materialize-earthline-hotfix-17541.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17541
          fetch-depth: 0
      - run: |
          git fetch origin candidate/earthline-launch-17535
          git show origin/candidate/earthline-launch-17535:earthline-elder-worker-17129.js > earthline-elder-worker-17129.js
      - run: |
          git config user.name "Earthline CI"
          git config user.email "info@earthlinedevelopment.org"
          git add earthline-elder-worker-17129.js
          git commit -m "candidate: combine nonblocking Property with warmed Elder 17541"
          git push origin HEAD:candidate/earthline-launch-17541