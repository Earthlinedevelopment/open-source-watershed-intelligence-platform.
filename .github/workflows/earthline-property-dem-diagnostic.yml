name: Earthline Regional Cleaner Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-dem-diag-trigger']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          hits=[i for i,l in enumerate(lines) if 'setInterval(clean,350)' in l]
          print('HITS', [i+1 for i in hits])
          for i in hits:
            a=max(0,i-150); b=min(len(lines),i+35)
            for n in range(a,b):
              print(f'{n+1}: {lines[n]}')
          PY
