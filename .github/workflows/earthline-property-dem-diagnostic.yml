name: Earthline Legacy Control Creator Audit
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.earthline-dem-diag-trigger']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          for id in earthline15857strip earthline15861strip earthlineMapRun15970 earthlineMapRun16020 runBtnSide; do
            echo "=== $id ==="
            grep -n -F "$id" index.html || true
          done
