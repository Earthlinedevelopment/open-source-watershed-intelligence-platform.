name: Earthline Stability Gate
on:
  push:
    branches:
      - recovery/mantra74-stability
permissions:
  contents: read
jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate stable ownership surface
        shell: bash
        run: |
          set -euo pipefail
          node --check earthline-launch-16872.js
          grep -q "function ensureLanguage(){" index.html
          ! grep -q "function applyLanguage(" index.html
          ! grep -q "function earthlineApplyUiLanguage16871(" index.html
          ! grep -q "earthline-language-hotfix-16890.js" index.html
          grep -q "languageControl.value=launchLangOverride" earthline-launch-16872.js
          grep -q "const schedule=()=>requestAnimationFrame(()=>ensure())" earthline-launch-16872.js
          ! grep -q "const obs=new MutationObserver(()=>{const p=reportPanel()" earthline-launch-16872.js
          ! grep -q "vermontRequest" index.html
          ! grep -q "earthlineClipVermontProducts16178({contours" index.html
          grep -q "EARTHLINE 17690 — universal jurisdiction path" index.html
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          console.log('EARTHLINE_STABILITY_INLINE_SCRIPTS_OK',parsed);
          NODE
          echo EARTHLINE_STABILITY_OWNERSHIP_GATE_OK
      - name: Install rendered test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Run rendered stability path
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8787 >/tmp/earthline-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8787/ >/dev/null && break
            sleep 1
          done
          node tests/stability-smoke.mjs
