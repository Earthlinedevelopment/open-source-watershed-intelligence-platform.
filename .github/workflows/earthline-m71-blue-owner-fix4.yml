name: Earthline Mantra 71 Blue Owner Fix 4
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-m71-blue-owner-fix4.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Patch canonical committed Property water gate
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old='  function propertyActive15824(){\\n    const publication=M&&M.propertyPublication15816||null;\\n    const currentGen=Number(M&&M.searchGen);\\n    const publicationGen=Number(publication&&publication.searchGen);\\n    const currentPublication=!!(\\n      publication&&\\n      publication.committed===true&&\\n      publication.safetyVerified===true&&\\n      (\\n        !Number.isFinite(currentGen)||\\n        !Number.isFinite(publicationGen)||\\n        currentGen===publicationGen\\n      )\\n    );\\n    /* EARTHLINE 17565 — committed safety-verified Property publication owns blue water; transient displayed-tier UI state may not erase it. */\\n    return !!(\\n      M&&M.analysisReady&&\\n      currentPublication&&\\n      state.mode===\"property\"\\n    );\\n  }'; new='  function propertyActive15824(){\\n    const publication=M&&M.propertyPublication15816||null;\\n    const displayed=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null;\\n    const displayedTier=String(displayed&&(displayed.tier||displayed.mode)||\"\").toLowerCase();\\n    /* EARTHLINE 17566 — canonical committed Property display owns direct blue water; legacy mode/search-generation bookkeeping may not erase it. */\\n    return !!(\\n      M&&M.analysisReady&&\\n      publication&&\\n      publication.committed===true&&\\n      publication.safetyVerified===true&&\\n      displayed&&\\n      displayedTier===\"property\"\\n    );\\n  }'; assert s.count(old)==1,s.count(old); p.write_text(s.replace(old,new),encoding='utf-8')"
          node -e "const fs=require('fs'),s=fs.readFileSync('index.html','utf8'); if((s.match(/EARTHLINE 17566/g)||[]).length!==1)throw Error('17566 marker'); if((s.match(/function propertyActive15824\(\)/g)||[]).length!==1)throw Error('owner count'); for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){if(!m[1].trim())continue;try{new Function(m[1])}catch(e){throw Error('script '+i+' '+e.message)}}"
      - name: Publish and remove temporary workflows
        shell: bash
        run: |
          git config user.name "Earthline Production Recovery"
          git config user.email "info@earthlinedevelopment.org"
          git rm .github/workflows/earthline-m71-blue-owner-fix2.yml || true
          git rm .github/workflows/earthline-m71-blue-owner-fix3.yml || true
          git rm .github/workflows/earthline-m71-blue-owner-fix4.yml
          git add index.html
          git commit -m "fix: canonical committed Property display owns first-run blue water"
          git push origin HEAD:pages-live
