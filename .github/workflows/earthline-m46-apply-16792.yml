name: Earthline M77 Single Property Display Owner

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-m46-apply-16792.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate outer Property publication
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="""      const md=state(),evidence16516=(typeof window.earthlineGetExclusionEvidence16516==='function'?window.earthlineGetExclusionEvidence16516():null),authoritative16516=!!(evidence16516&&evidence16516.sourceTier==='authoritative-local'),propertySnapshot=Object.freeze({build:BUILD,runToken,query:q,tier:'property',mode:'property',publishedAt:new Date().toISOString(),derived:{swaleOpportunityLines:Array.isArray(md&&md.swales)?md.swales.length:0},exclusionEvidence:evidence16516,sourceRule:(evidence16516&&evidence16516.label?evidence16516.label:(authoritative16516?'Authoritative local exclusion evidence; exclusions fail closed':'Exclusion evidence not recorded'))});
                publishDisplayedRun16151(propertySnapshot);recordRun('property_run_published',runToken,{query:q,swaleCount:propertySnapshot.derived.swaleOpportunityLines,exclusionEvidence:evidence16516});setRunStatus(authoritative16516?('Vermont property analysis published for '+q+' — verify bare-earth terrain, exclusions and field conditions before construction.'):('Property terrain analysis published for '+q+' — '+(evidence16516&&evidence16516.label?evidence16516.label:'verify local exclusions')+'.'),'published');if(typeof window.earthlineRenderExclusionEvidence16516==='function')window.earthlineRenderExclusionEvidence16516();notify('Property analysis complete.');return true;"""
          new="""      /* EARTHLINE M77 — SINGLE PROPERTY DISPLAY OWNER.
                 terminalPropertyRun -> publishPropertyDisplay16220 is the sole canonical
                 Property publication owner. The outer Search/Run owner must never replace
                 that verified snapshot with a second run token or thinner evidence record. */
                const md=state(),evidence16516=(typeof window.earthlineGetExclusionEvidence16516==='function'?window.earthlineGetExclusionEvidence16516():null),authoritative16516=!!(evidence16516&&evidence16516.sourceTier==='authoritative-local');
                const propertySnapshot=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null;
                const propertyPublicationM77=md&&md.propertyPublication15816||null;
                const propertyDisplayValidM77=!!(
                  propertySnapshot&&String(propertySnapshot.tier||propertySnapshot.mode||'').toLowerCase()==='property'&&
                  propertyPublicationM77&&propertyPublicationM77.committed===true&&
                  Number(propertyPublicationM77.searchGen)===Number(md&&md.searchGen)
                );
                if(!propertyDisplayValidM77)throw new Error('authoritative Property publication identity missing after governed Property terminal');
                recordRun('property_run_published',runToken,{query:q,canonicalRunToken:String(propertySnapshot.runToken||''),swaleCount:Number(propertySnapshot.derived&&propertySnapshot.derived.propertySafeCorridors||propertySnapshot.derived&&propertySnapshot.derived.swaleOpportunityLines||0),exclusionEvidence:evidence16516,singleDisplayOwner:true});
                setRunStatus(authoritative16516?('Vermont property analysis published for '+q+' — verify bare-earth terrain, exclusions and field conditions before construction.'):('Property terrain analysis published for '+q+' — '+(evidence16516&&evidence16516.label?evidence16516.label:'verify local exclusions')+'.'),'published');if(typeof window.earthlineRenderExclusionEvidence16516==='function')window.earthlineRenderExclusionEvidence16516();notify('Property analysis complete.');return true;"""
          if old not in s:
              raise SystemExit("M77 duplicate Property publication anchor missing")
          if s.count(old) != 1:
              raise SystemExit("M77 duplicate Property publication anchor not unique")
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Verify exact scope
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
          grep -q "EARTHLINE M77 — SINGLE PROPERTY DISPLAY OWNER" index.html
          test "$(grep -c "publishDisplayedRun16151(propertySnapshot)" index.html || true)" = "0"
      - name: Commit production
        shell: bash
        run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: enforce single authoritative Property display owner"
          git push origin HEAD:pages-live
