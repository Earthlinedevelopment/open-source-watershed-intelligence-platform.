name: Earthline M78 Property Elder Ownership Repair

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-m46-apply-16792.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-m78-property-owner-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply M78 stale Elder swale-owner repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          marker="EARTHLINE M78 — ELDER DISPLAY-ONLY RUN BINDING"
          if marker not in s:
              start_needle='      try{const lockedSwalesM76=JSON.parse(JSON.stringify(m.authoritativeSafeSwales15815||{type:"FeatureCollection",features:[]}));void Promise.resolve(window.EARTHLINE_ELDER_TREES_V1_17097?.primePropertyEvidence?.())'
              end_marker='      /* M76 elder post-science display-only */'
              start=s.find(start_needle)
              if start < 0:
                  raise SystemExit("M78 stale Elder/swale finalizer anchor missing")
              end=s.find(end_marker,start)
              if end < 0:
                  raise SystemExit("M78 stale Elder finalizer end marker missing")
              end += len(end_marker)
              replacement='''      /* EARTHLINE M78 — ELDER DISPLAY-ONLY RUN BINDING.
                 Elder may compute and publish Elder points for this Property generation,
                 but it may never restore, replace, or republish Property swale science.
                 A late Elder completion from an older run is discarded by searchGen. */
              try{
                const elderPropertyGenM78=propertyPublicationGen16334;
                void Promise.resolve(window.EARTHLINE_ELDER_TREES_V1_17097?.primePropertyEvidence?.())
                  .then(()=>{
                    if(Number(m.searchGen||0)!==elderPropertyGenM78)return null;
                    return window.EARTHLINE_ELDER_TREES_V1_17097?.startProperty?.();
                  })
                  .catch(()=>{});
              }catch(_){}
              /* M78 Elder remains display-only; authoritativeSafeSwales15815 is untouched. */'''
              s=s[:start]+replacement+s[end:]

          old_src='<script src="earthline-launch-16872.js?v=17601"></script>'
          new_src='<script src="earthline-launch-16872.js?v=17602"></script>'
          if old_src in s:
              if s.count(old_src) != 1:
                  raise SystemExit("M78 launch cache-version anchor is not unique")
              s=s.replace(old_src,new_src,1)
          elif new_src not in s:
              raise SystemExit("M78 launch cache-version anchor missing")

          if marker not in s:
              raise SystemExit("M78 index marker missing after repair")
          if "lockedSwalesM76" in s:
              raise SystemExit("stale Elder swale restore remains")
          if "elder-display-only-m76" in s:
              raise SystemExit("stale Elder swale republish remains")
          if new_src not in s:
              raise SystemExit("M78 launch cache version missing")
          p.write_text(s,encoding="utf-8")
          PY

      - name: Verify M78 shared-owner scope
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
          grep -q "EARTHLINE M78 — ELDER DISPLAY-ONLY RUN BINDING" index.html
          grep -q "earthline-launch-16872.js?v=17602" index.html
          ! grep -q "lockedSwalesM76" index.html
          ! grep -q "elder-display-only-m76" index.html
          grep -q "EARTHLINE M78 — PROPERTY ELDER SINGLE LIFECYCLE OWNER" earthline-launch-16872.js

      - name: Commit production repair
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: prevent stale Elder completion from republishing swales"
          git push origin HEAD:pages-live
