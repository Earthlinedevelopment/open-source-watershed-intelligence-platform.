name: Earthline Apply 16792 Location Ownership

on:
  push:
    branches: [pages-live]
    paths:
      - 'tools/mantra46-apply-16792-location-ownership.py'
      - '.github/workflows/earthline-m46-apply-16792.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-16792:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 16792 location ownership repair
        run: python tools/mantra46-apply-16792-location-ownership.py
      - name: Verify exact product scope
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
          grep -q "EARTHLINE 16792 — ATOMIC STATE DISPLAY OWNERSHIP" index.html
          grep -q "s.centerLng=Number(loc16556.lng)" index.html
          grep -q "regional final display camera reconciliation failed" index.html
      - name: Commit product candidate
        run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "repair: deploy 16792 atomic state display ownership"
          git push origin HEAD:pages-live
