name: Earthline Texas Live Closeout
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths: ['tests/texas-live-closeout-after-principal.mjs','.github/workflows/earthline-texas-live-closeout.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node tests/texas-live-closeout-after-principal.mjs
