name: Earthline Alaska report repair 16987
on:
  push:
    branches:
      - pages-live
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Apply report repair
        run: |
          python .github/scripts/earthline_alaska_16987.py
          git config user.name "Earthline Build Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: dateline-safe Alaska report map 16987"
          git push origin HEAD:pages-live
