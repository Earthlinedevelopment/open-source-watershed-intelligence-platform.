name: Mantra 46 New Hampshire Repeat Gate

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/mantra46-16789-new-hampshire-repeat.mjs'
      - '.github/workflows/earthline-m46-nh-repeat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nh-repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run New Hampshire repeat gate
        run: node tests/mantra46-16789-new-hampshire-repeat.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16789-nh-repeat
          path: artifacts/mantra46-16789-nh-repeat/
          if-no-files-found: warn
