name: Mantra 51 Inspect NZ West Clamp
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-inspect-nz-west-clamp.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Inspect bounds and clamps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needles=["setMaxBounds","maxBounds","fitBounds","cameraForBounds","lngRange","antimeridian","wrap","countryPackage","New Zealand","bbox","west","east"]
          for needle in needles:
            print("\n===== "+needle+" =====")
            pos=0; count=0
            while count<50:
              i=s.find(needle,pos)
              if i<0: break
              print(s[max(0,i-1200):min(len(s),i+2200)].replace("\n"," "))
              print("\n---")
              pos=i+len(needle); count+=1
          PY
