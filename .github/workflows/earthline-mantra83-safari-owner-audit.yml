name: Mantra 83 Safari Owner Audit
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/earthline-mantra83-safari-owner-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin pages-live
      - run: |
          git show origin/pages-live:index.html > /tmp/live-index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/live-index.html').read_text()
          for term in ['function screenJurisdictionCandidate16539','const screenJurisdictionCandidate16539','function pointInGeometry','function pointInPolygon','lineWithinJurisdiction16539','earthlineClipLineToJurisdiction16539']:
              start=0;n=0
              while True:
                  at=s.find(term,start)
                  if at<0: break
                  print('M83_SAFARI_OWNER',term,s[max(0,at-1800):min(len(s),at+6500)].replace('\n',' '))
                  start=at+len(term);n+=1
                  if n>=8: break
          PY
