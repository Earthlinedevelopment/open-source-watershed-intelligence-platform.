name: Earthline Final Launch Smoke 17001
on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/final-launch-smoke-17001.mjs'
      - '.github/workflows/earthline-final-launch-smoke-17001.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/final-launch-smoke-17001.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-final-launch-smoke-17001
          path: artifacts/final-launch-smoke-17001/
          if-no-files-found: warn
