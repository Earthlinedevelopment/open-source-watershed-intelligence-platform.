name: Mantra 51 Swales DOM Shape
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - '.github/workflows/mantra51-swales-dom-shape.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - run: python3 -m http.server 8787 >/tmp/el-http.log 2>&1 &
      - run: |
          cat > shape.mjs <<'JS'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({viewport:{width:1600,height:1200}});
          await p.goto('http://127.0.0.1:8787/index.html?shape='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await p.waitForTimeout(4000);
          await p.evaluate(()=>{location.hash='#swales-explained'});
          await p.waitForTimeout(1200);
          const out=await p.evaluate(()=>{
            const d=document.querySelector('#earthlineSwalesPage16125 iframe')?.contentDocument;
            const main=d?.querySelector('main');
            const children=[...(main?.children||[])].map((x,i)=>({
              i,tag:x.tagName,id:x.id||'',cls:x.className||'',
              heading:(x.querySelector('h1,h2,h3')?.textContent||'').trim().replace(/\s+/g,' '),
              quotes:x.querySelectorAll('.earthline-quote,blockquote').length,
              images:x.querySelectorAll('img').length,
              text:(x.textContent||'').trim().replace(/\s+/g,' ').slice(0,160)
            }));
            const quotes=[...(d?.querySelectorAll('.earthline-quote,blockquote')||[])].map((q,i)=>({
              i,tag:q.tagName,cls:q.className||'',parent:q.parentElement?.className||'',section:q.closest('section')?.className||'',text:(q.textContent||'').trim().replace(/\s+/g,' ').slice(0,180)
            }));
            return {children,quotes};
          });
          console.log(JSON.stringify(out,null,2));
          await b.close();
          JS
          node shape.mjs
