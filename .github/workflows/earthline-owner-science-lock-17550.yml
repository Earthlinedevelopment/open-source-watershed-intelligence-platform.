name: Earthline Owner Science Lock 17550
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/earthline-owner-science-lock-17550.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17550
          fetch-depth: 0
      - run: |
          git fetch origin candidate/earthline-launch-17540 repair/property-one-click-17441
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base_idx=subprocess.check_output(['git','show','origin/candidate/earthline-launch-17540:index.html'],text=True)
          cur_idx=Path('index.html').read_text(encoding='utf-8')
          base_launch=subprocess.check_output(['git','show','origin/candidate/earthline-launch-17540:earthline-launch-16872.js'],text=True)
          cur_launch=Path('earthline-launch-16872.js').read_text(encoding='utf-8')
          old='earthline-elder-worker-17129.js'
          new='earthline-elder-worker-js-17527.js'
          assert cur_idx.count(new)==1 and cur_idx.count(old)==0
          assert cur_launch.count(new)==1 and cur_launch.count(old)==0
          assert cur_idx.replace(new,old)==base_idx, 'index changed beyond Elder worker backend'
          assert cur_launch.replace(new,old)==base_launch, 'launch changed beyond Elder worker backend'
          assert cur_idx.count('property.onpointerup')==1
          assert cur_idx.count('property.onclick')==1
          assert cur_idx.count('b.onclick=declareProperty')==0
          assert cur_idx.count("EARTHLINE_ELDER_TREES_V1_17097?.startProperty?.()")==1
          for needle in ["addEventListener('styledata'",'addEventListener("styledata"', "addEventListener('idle'",'addEventListener("idle"', "addEventListener('move'",'addEventListener("move"', "addEventListener('zoom'",'addEventListener("zoom"']:
              assert cur_idx.count(needle)==0 and cur_launch.count(needle)==0, f'new forbidden owner pattern {needle}'
          print('EARTHLINE_OWNER_SCIENCE_LOCK_17550 PASS')
          PY
