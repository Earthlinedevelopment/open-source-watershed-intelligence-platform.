name: Earthline Elder Trees USGS Public EPT Catalog

on:
  push:
    branches:
      - v2/elder-tree-layer-research
    paths:
      - 'tools/elder_trees/usgs_public_ept_catalog.py'
      - '.github/workflows/earthline-elder-tree-usgs-ept-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/elder-tree-layer-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Build free public USGS EPT catalog
        run: python tools/elder_trees/usgs_public_ept_catalog.py artifacts/elder-trees-us-ept
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-elder-trees-usgs-public-ept-catalog
          path: artifacts/elder-trees-us-ept/
          if-no-files-found: warn
          retention-days: 14
      - name: Persist EPT catalog
        if: success()
        run: |
          mkdir -p data/elder-trees/generated/us-national
          cp artifacts/elder-trees-us-ept/usgs-public-ept-summary.json data/elder-trees/generated/us-national/
          cp artifacts/elder-trees-us-ept/usgs-public-ept-projects.json data/elder-trees/generated/us-national/
          git config user.name "Earthline Research Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add data/elder-trees/generated/us-national/
          git diff --cached --quiet || git commit -m "data: persist zero-cost USGS EPT catalog"
          git push origin HEAD:v2/elder-tree-layer-research
