name: Earthline Swale Coverage Mechanism Trace
on:
  push:
    branches: [diag-aquifer-east-texas]
    paths: ['tests/trace-swale-coverage-mechanism.py','.github/workflows/earthline-swale-coverage-trace.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tests/trace-swale-coverage-mechanism.py
