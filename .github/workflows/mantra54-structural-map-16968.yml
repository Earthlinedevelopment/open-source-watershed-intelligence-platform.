name: Build structural report map 16968
on:
  push:
    branches: [mantra54-report-map-16968]
    paths:
      - '.github/workflows/mantra54-structural-map-16968.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra54-report-map-16968

      - name: Install structural map renderer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          new_map=r'''function mapSvg(d,small=false){
            const b=reportBounds(d),W=1100,H=small?460:620;
            const mapX=26,mapY=26,mapW=W-52,mapH=H-52;
            const xSpan=Math.max(.000001,b[2]-b[0]),ySpan=Math.max(.000001,b[3]-b[1]);
            const sx=x=>mapX+(x-b[0])/xSpan*mapW,sy=y=>mapY+mapH-(y-b[1])/ySpan*mapH;
            const pathCoords=coords=>(coords||[]).map((q,i)=>(i?'L':'M')+sx(+q[0]).toFixed(1)+' '+sy(+q[1]).toFixed(1)).join(' ');
            const path=f=>pathCoords(f?.geometry?.coordinates||[]);
            const mid=f=>{const a=f?.geometry?.coordinates||[];const q=a[Math.floor(a.length/2)];return Array.isArray(q)&&q.length>1?q:null};
            const slen=f=>{const a=f?.geometry?.coordinates||[];let L=0;for(let i=1;i<a.length;i++)L+=Math.hypot(sx(+a[i][0])-sx(+a[i-1][0]),sy(+a[i][1])-sy(+a[i-1][1]));return L};

            const reportContours=contours().filter(f=>f?.geometry?.type==='LineString').slice(0,220);
            const reportFlows=flows().filter(f=>f?.geometry?.type==='LineString').slice(0,240);
            const rows=graded(),aquiferFeatures=reportAquifers();

            const flowRank=reportFlows.map(f=>({f,L:slen(f)})).sort((a,b)=>b.L-a.L);
            const principal=flowRank.slice(0,Math.min(small?4:6,flowRank.length));
            const A=rows.filter(r=>r.grade==='A');
            const B=rows.filter(r=>r.grade==='B').slice(0,Math.min(12,rows.filter(r=>r.grade==='B').length));

            const reportPlace=String(d?.query||d?.location||d?.placeName||'Analysis Area').trim();
            const lonSpan=Math.max(.0001,b[2]-b[0]),midLat=(b[1]+b[3])/2,kmWide=lonSpan*111.32*Math.cos(midLat*Math.PI/180);
            const niceKm=kmWide>300?100:kmWide>120?50:kmWide>50?20:kmWide>20?10:kmWide>8?5:kmWide>3?2:1;
            const barPx=Math.max(54,Math.min(160,niceKm/kmWide*mapW));

            const clipId='elClip16968',aqPat='elAq16968',parts=[];
            parts.push('<svg class="el-report-landscape-plan-16968" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc('Earthline '+reportPlace+' landscape water plan')+'">');
            parts.push('<defs>'+
              '<linearGradient id="elGround16968" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8f7ef"/><stop offset=".52" stop-color="#eff2e8"/><stop offset="1" stop-color="#e6ece2"/></linearGradient>'+
              '<pattern id="'+aqPat+'" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="14" height="14" fill="#e99142" fill-opacity=".28"/><path d="M0 0 V14" stroke="#bd6320" stroke-width=".8" stroke-opacity=".28"/></pattern>'+
              '<clipPath id="'+clipId+'"><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="4"/></clipPath>'+
              '<marker id="elArrow16968" markerWidth="5.5" markerHeight="5.5" refX="4.6" refY="2.75" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L5.5 2.75 L0 5.5 Z" fill="#0f6f98" opacity=".86"/></marker>'+
              '</defs>');

            parts.push('<rect width="'+W+'" height="'+H+'" fill="#f4f1e8"/>'+
              '<rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="4" fill="url(#elGround16968)" stroke="#98a49b" stroke-width=".9"/>'+
              '<g clip-path="url(#'+clipId+')">');

            /* Landform: broad tonal terraces, not contour spaghetti. */
            const terraceIdx=[10,28,46,64,82,100,118,136,154,172,190,208].filter(i=>i<reportContours.length);
            for(let ti=0;ti<terraceIdx.length;ti++){
              const dp=path(reportContours[terraceIdx[ti]]); if(!dp)continue;
              const width=ti%2?30:44;
              const op=ti%2?.030:.045;
              parts.push('<path d="'+dp+'" fill="none" stroke="'+(ti%2?'#6f8a76':'#91a594')+'" stroke-width="'+width+'" opacity="'+op+'" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" fill="none" stroke="#758279" stroke-width=".52" opacity=".17" vector-effect="non-scaling-stroke"/>');
            }

            /* Aquifer fields are large, quiet orange areas. */
            for(const f of aquiferFeatures){
              const g=f&&f.geometry;if(!g)continue;
              const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];
              for(const poly of polys){
                const rings=poly.filter(r=>Array.isArray(r)&&r.length>=3);if(!rings.length)continue;
                const dp=rings.map(r=>pathCoords(r)+' Z').join(' ');
                parts.push('<path d="'+dp+'" fill="url(#'+aqPat+')" fill-rule="evenodd" stroke="#b95d1d" stroke-width="1.15" opacity=".93" vector-effect="non-scaling-stroke"/>');
              }
            }

            /* Hydrology: only 4–6 principal paths. No secondary blue web. */
            let fi=0;
            for(const x of principal){
              const dp=path(x.f);if(!dp)continue;
              parts.push('<path d="'+dp+'" fill="none" stroke="#fffdf7" stroke-width="5.6" opacity=".94" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" fill="none" stroke="#0f6f98" stroke-width="1.65" opacity=".92" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"'+(fi++%2===0?' marker-end="url(#elArrow16968)"':'')+'/>');
            }

            /* B corridors are soft supporting landforms. C corridors are intentionally omitted from map display. */
            for(const r of B){
              const dp=path(r.f);if(!dp)continue;
              parts.push('<path d="'+dp+'" fill="none" stroke="#fffef8" stroke-width="12" opacity=".86" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" fill="none" stroke="#d6e0ce" stroke-width="7.8" opacity=".72" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" fill="none" stroke="#708060" stroke-width=".95" opacity=".58" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');
            }

            /* A corridors are the dominant landscape intervention. */
            for(const r of A){
              const dp=path(r.f);if(!dp)continue;
              parts.push('<path d="'+dp+'" fill="none" stroke="#fffef8" stroke-width="28" opacity=".98" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" fill="none" stroke="#a9c59e" stroke-width="20" opacity=".90" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" fill="none" stroke="#2c5337" stroke-width="1.8" opacity=".98" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" transform="translate(-2.6 -2.6)" fill="none" stroke="#3f9fba" stroke-width=".9" opacity=".98" stroke-dasharray="2.4 3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');
              parts.push('<path d="'+dp+'" transform="translate(2.6 2.6)" fill="none" stroke="#3f9fba" stroke-width=".9" opacity=".98" stroke-dasharray="2.4 3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');
            }

            let ai=0;
            for(const r of A.slice(0,10)){
              const q=mid(r.f);if(!q)continue;
              const x=sx(+q[0]),y=sy(+q[1]);
              parts.push('<g><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="10.5" fill="#fffdf8" stroke="#526f59" stroke-width=".85"/><text x="'+x.toFixed(1)+'" y="'+(y+2.3).toFixed(1)+'" text-anchor="middle" fill="#284733" font-family="Noto Sans,Arial,sans-serif" font-size="6.8" font-weight="850">A'+(++ai)+'</text></g>');
            }
            parts.push('</g>');

            /* Minimal map furniture. */
            parts.push('<g transform="translate('+(mapX+18)+','+(mapY+mapH-20)+')"><path d="M0 0 H'+barPx+'" stroke="#43544c" stroke-width="1.4"/><path d="M0 -4 V4 M'+barPx+' -4 V4" stroke="#43544c" stroke-width=".9"/><text x="'+(barPx/2)+'" y="13" text-anchor="middle" fill="#56645e" font-family="Noto Sans,Arial,sans-serif" font-size="6.5" font-weight="700">'+niceKm+' km</text></g>');
            parts.push('<g transform="translate('+(mapX+mapW-48)+','+(mapY+20)+')"><circle cx="12" cy="13" r="19" fill="#fffdf8" fill-opacity=".90" stroke="#a8b2aa" stroke-width=".7"/><text x="12" y="-1" text-anchor="middle" fill="#294239" font-family="Noto Sans,Arial,sans-serif" font-size="7.4" font-weight="850">N</text><path d="M12 4 V30" stroke="#294239" stroke-width="1"/><path d="M12 4 L6 16 L12 12 L18 16 Z" fill="#294239"/></g>');

            if(!small){
              const lx=mapX+18,ly=mapY+18;
              parts.push('<g transform="translate('+lx+','+ly+')">'+
                '<rect width="252" height="104" rx="5" fill="#fffef9" fill-opacity=".95" stroke="#c0c7c1" stroke-width=".65"/>'+
                '<text x="15" y="21" fill="#203a33" font-family="Noto Sans,Arial,sans-serif" font-size="8.3" font-weight="850" letter-spacing=".9">LANDSCAPE WATER PLAN</text>'+
                '<path d="M15 30 H237" stroke="#55bde0" stroke-width="1.4"/>'+
                '<rect x="15" y="44" width="24" height="10" rx="1" fill="url(#'+aqPat+')" stroke="#b95d1d" stroke-width=".7"/>'+
                '<text x="47" y="52" fill="#465750" font-family="Noto Sans,Arial,sans-serif" font-size="6.3">Aquifer field</text>'+
                '<path d="M15 70 H39" stroke="#0f6f98" stroke-width="1.65"/>'+
                '<text x="47" y="73" fill="#465750" font-family="Noto Sans,Arial,sans-serif" font-size="6.3">Principal water path</text>'+
                '<path d="M133 49 H161" stroke="#a9c59e" stroke-width="14" opacity=".92" stroke-linecap="round"/>'+
                '<path d="M133 49 H161" stroke="#2c5337" stroke-width="1.6"/>'+
                '<text x="170" y="52" fill="#465750" font-family="Noto Sans,Arial,sans-serif" font-size="6.3">A · priority bioswale</text>'+
                '<path d="M133 72 H161" stroke="#d6e0ce" stroke-width="7.5" opacity=".76" stroke-linecap="round"/>'+
                '<path d="M133 72 H161" stroke="#708060" stroke-width=".9"/>'+
                '<text x="170" y="75" fill="#465750" font-family="Noto Sans,Arial,sans-serif" font-size="6.3">B · strong opportunity</text>'+
                '<text x="15" y="94" fill="#7a837e" font-family="Noto Sans,Arial,sans-serif" font-size="5.4">C opportunities remain in the report data; omitted here for clarity</text>'+
                '</g>');
            }
            parts.push('</svg>');
            return parts.join('');
          }
          '''
          start=s.find("function mapSvg(d,small=false){")
          end=s.find("function gradeSummary",start)
          if start<0 or end<0 or end<=start:
              raise SystemExit(f"mapSvg boundary not found: start={start} end={end}")
          s=s[:start]+new_map+s[end:]
          p.write_text(s,encoding="utf-8")
          print("structural map 16968 installed")
          PY

      - name: Build deterministic preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, math
          s=Path("index.html").read_text(encoding="utf-8")
          start=s.find("function mapSvg(d,small=false){")
          end=s.find("function gradeSummary",start)
          fn=s[start:end]

          contours=[]
          for j in range(34):
              pts=[]
              for i in range(61):
                  x=i*100/60
                  y=8+j*1.65 + 2.5*math.sin(i/7+j*.35) + .022*(x-50)*(1 if j%2 else -1)
                  pts.append([x,max(2,min(68,y))])
              contours.append({"type":"Feature","geometry":{"type":"LineString","coordinates":pts},"properties":{"ele":80+j*5}})

          flows=[]
          main=[
            [(48,68),(49,58),(48,48),(47,38),(46,28),(45,18),(45,3)],
            [(18,67),(25,58),(31,49),(37,40),(42,31),(45,22),(45,3)],
            [(86,66),(77,57),(69,49),(61,41),(55,32),(49,23),(45,3)],
            [(5,57),(19,52),(30,47),(39,40),(45,33),(45,3)],
            [(96,52),(82,47),(70,42),(58,35),(50,27),(45,3)],
            [(8,30),(22,29),(34,27),(42,22),(45,3)]
          ]
          for arr in main:
              flows.append({"type":"Feature","geometry":{"type":"LineString","coordinates":[list(p) for p in arr]},"properties":{}})
          for k in range(18):
              y0=64-(k//2)*5
              x0=5+(k*17)%88
              flows.append({"type":"Feature","geometry":{"type":"LineString","coordinates":[[x0,y0],[x0+7,y0-6],[x0+14,y0-12]]},"properties":{}})

          rows=[]
          specs=[
            ('A',[(8,56),(22,58),(37,56),(52,57)]),
            ('A',[(12,42),(27,44),(43,42),(60,43)]),
            ('A',[(47,31),(63,33),(79,31),(95,33)]),
            ('A',[(9,20),(25,22),(41,20),(57,22)]),
            ('B',[(57,54),(70,56),(83,54),(96,55)]),
            ('B',[(36,14),(51,16),(67,14),(83,16)]),
            ('C',[(4,63),(20,64),(36,62),(50,63)]),
            ('C',[(62,10),(75,12),(89,10),(98,11)])
          ]
          for idx,(grade,pts) in enumerate(specs,1):
              rows.append({"grade":grade,"km":1.3,"f":{"type":"Feature","geometry":{"type":"LineString","coordinates":[list(p) for p in pts]},"properties":{"grade":grade,"id":idx}}})

          aq=[{"type":"Feature","geometry":{"type":"Polygon","coordinates":[[[61,63],[97,63],[97,40],[84,36],[72,39],[61,48],[61,63]]]},"properties":{}}]

          html='''<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#d7d8d2;font-family:Arial,sans-serif}.wrap{width:1320px;margin:28px auto;background:white;padding:24px 24px 34px;box-shadow:0 8px 30px #0002}.title{font:700 20px Arial;color:#18343c;margin:0 0 8px}.sub{font:12px Arial;color:#617078;margin-bottom:16px}.map svg{display:block;width:100%;height:auto}</style><div class="wrap"><div class="title">Bioswale Impact Report — Analysis Area & Technical Map</div><div class="sub">ALABAMA · USA · 32.60936, -86.68074</div><div class="map" id="map"></div></div><script>
          const C=__C__,F=__F__,R=__R__,AQ=__AQ__;
          function reportBounds(){return [0,0,100,70]}
          function contours(){return C}
          function flows(){return F}
          function graded(){return R}
          function reportAquifers(){return AQ}
          function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
          '''+fn+'''
          document.getElementById("map").innerHTML=mapSvg({query:"ALABAMA · USA · 32.60936, -86.68074",tier:"property",bounds:[0,0,100,70]},false);
          </script>'''
          html=html.replace('__C__',json.dumps(contours)).replace('__F__',json.dumps(flows)).replace('__R__',json.dumps(rows)).replace('__AQ__',json.dumps(aq))
          Path("report-map-preview-16968.html").write_text(html,encoding="utf-8")
          PY
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1400,900 --screenshot=report-map-preview-16968.png "file://$PWD/report-map-preview-16968.html"

      - name: Validate and commit candidate
        shell: bash
        run: |
          grep -q "el-report-landscape-plan-16968" index.html
          grep -q "slice(0,Math.min(small?4:6,flowRank.length))" index.html
          grep -q "C opportunities remain in the report data; omitted here for clarity" index.html
          test -s report-map-preview-16968.png
          git config user.name "Earthline Mantra 54"
          git config user.email "info@earthlinedevelopment.org"
          git rm .github/workflows/mantra54-structural-map-16968.yml
          git add index.html report-map-preview-16968.html report-map-preview-16968.png
          git commit -m "candidate: structural landscape report map 16968"
          git push origin mantra54-report-map-16968
