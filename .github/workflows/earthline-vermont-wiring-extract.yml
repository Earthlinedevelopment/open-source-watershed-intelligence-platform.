name: Earthline Vermont Wiring Extract
on:
  push:
    branches: [recovery/mantra74-stability]
    paths: ['.github/workflows/earthline-vermont-wiring-extract.yml']
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra74-stability
      - shell: bash
        run: |
          set -euo pipefail
          echo '---PROPERTY PREFLIGHT---'
          sed -n '9590,9675p' index.html
          echo '---REGIONAL REQUEST / BOUNDARY---'
          sed -n '27220,27385p' index.html
          echo '---REGIONAL CLIPPING---'
          sed -n '27880,27980p' index.html
