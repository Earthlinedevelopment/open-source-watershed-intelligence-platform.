name: Mantra 51 Restore NZ Real Canvas Crosshair
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths: ['.github/workflows/mantra51-restore-nz-real-canvas-crosshair.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [pages-live, mantra51-global-repair-campaign]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - name: Patch NZ crosshair unlock to real map surface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="""  document.addEventListener('pointerdown',function(ev){
    try{
      const mapEl=document.getElementById('map');
      if(mapEl&&(ev.target===mapEl||mapEl.contains(ev.target))){
        window.EARTHLINE_COUNTRY_TARGET_LOCK_16845=false;
      }
    }catch(_){}
  },true);"""
          new="""  document.addEventListener('pointerdown',function(ev){
    try{
      const mapEl=document.getElementById('map');
      const realMapEl=document.getElementById('mapboxBase');
      const mapSurface=ev.target&&ev.target.closest?ev.target.closest('.mapboxgl-map, #mapboxBase, #map, [data-earthline-map]'):null;
      if(mapSurface||(mapEl&&(ev.target===mapEl||mapEl.contains(ev.target)))||(realMapEl&&(ev.target===realMapEl||realMapEl.contains(ev.target)))){
        window.EARTHLINE_COUNTRY_TARGET_LOCK_16845=false;
      }
    }catch(_){}
  },true);"""
          if old in s:
              s=s.replace(old,new,1)
          elif "const realMapEl=document.getElementById('mapboxBase');" not in s:
              raise SystemExit("NZ crosshair unlock anchor missing")
          p.write_text(s,encoding="utf-8")
          PY
          grep -n "realMapEl=document.getElementById('mapboxBase')" index.html
      - name: Commit branch patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: bind NZ crosshair unlock to real Mapbox canvas"
          git push origin HEAD:${{ matrix.branch }}

# trigger real-canvas repair
