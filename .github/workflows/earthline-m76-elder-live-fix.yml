name: Earthline M76 Elder Live Fix
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-elder-live-fix.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Patch Elder lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          prime="try{void window.EARTHLINE_ELDER_TREES_V1_17097?.primePropertyEvidence?.()}catch(_){}"
          if s.count(prime)<1:
              raise SystemExit('prime missing')
          s=s.replace(prime,"/* M76 elder prime retired */")
          early="try{void Promise.resolve(window.EARTHLINE_ELDER_TREES_V1_17097?.startProperty?.()).catch(()=>{})}catch(_){}"
          if s.count(early)!=1:
              raise SystemExit('early start mismatch')
          s=s.replace(early,"/* M76 elder early start retired */",1)
          marker='earthlinePropertyTrace16319("scientific terminal","mark",{corridors:count});\n      /* EARTHLINE 17514 — Elder publication already started from the authoritative\n         Property frame before the hydrology runner; no second lifecycle owner here. */'
          insert='earthlinePropertyTrace16319("scientific terminal","mark",{corridors:count});\n      try{const lockedSwalesM76=JSON.parse(JSON.stringify(m.authoritativeSafeSwales15815||{type:"FeatureCollection",features:[]}));void Promise.resolve(window.EARTHLINE_ELDER_TREES_V1_17097?.startProperty?.()).finally(()=>{try{m.authoritativeSafeSwales15815=lockedSwalesM76;if(typeof window.earthlineDeliverPropertyResult15817==="function")window.earthlineDeliverPropertyResult15817("elder-display-only-m76",false);else if(typeof window.earthlineRefreshPropertyRenderer15792==="function")window.earthlineRefreshPropertyRenderer15792(true)}catch(_){}})}catch(_){}\n      /* M76 elder post-science display-only */'
          if s.count(marker)!=1:
              raise SystemExit(f'marker mismatch {s.count(marker)}')
          s=s.replace(marker,insert,1)
          p.write_text(s,encoding='utf-8')
          PY
          node -e "const fs=require('fs'),s=fs.readFileSync('index.html','utf8');if(s.includes('?.primePropertyEvidence?.()'))throw Error('prime remains');if(!s.includes('elder-display-only-m76'))throw Error('guard missing');let n=0;for(const m of s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)){if(!m[1].trim())continue;new Function(m[1]);n++}console.log('ELDER_FIX_OK',n)"
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: isolate Elder from Property swale lifecycle"
          git push origin HEAD:pages-live
