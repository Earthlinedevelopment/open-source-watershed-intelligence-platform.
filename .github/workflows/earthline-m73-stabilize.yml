name: Earthline M73 Stabilize Property Presentation
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-m73-stabilize.yml'
permissions:
  contents: write
jobs:
  stabilize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Consolidate Property presentation ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          original_len=len(s)

          def splice(start,end,repl,label):
              global s
              a=s.find(start)
              assert a>=0, f"{label}: start missing"
              b=s.find(end,a+len(start))
              assert b>=0, f"{label}: end missing"
              s=s[:a]+repl+s[b:]

          def exact(old,new,label):
              global s
              n=s.count(old)
              assert n==1, f"{label}: expected 1, got {n}"
              s=s.replace(old,new,1)

          splice(
          '  let cachedKey="";',
          'function viewAllowsWater15824(){',
          '''  let cachedKey="";
            let cachedFlow={type:"FeatureCollection",features:[]};
            let committedOwnerGeneration15824=null;
            let committedFlowGeneration15824=null;
            let lastRender=null;
            let renderQueued=false;

            function propertyActive15824(){
              const publication=M&&M.propertyPublication15816||null;
              const currentGen=Number(M&&M.searchGen);
              const currentPublication=!!(
                M&&publication&&
                publication.committed===true&&
                publication.safetyVerified===true&&
                Number(publication.searchGen)===currentGen
              );
              /* EARTHLINE 17600 — one committed Property generation owns direct blue water
                 until a newer real search advances M.searchGen. Same-generation cleanup,
                 UI settlement, or legacy publication bookkeeping cannot revoke that owner. */
              if(currentPublication){
                committedOwnerGeneration15824=currentGen;
                return true;
              }
              return !!(
                M&&Number.isFinite(currentGen)&&
                Number.isFinite(committedOwnerGeneration15824)&&
                committedOwnerGeneration15824===currentGen
              );
            }

          ''',
          "water owner block")

          exact(
          '''  function authoritativeFlow15824(force=false){
              const frameKey=''', 
          '''  function authoritativeFlow15824(force=false){
              const currentGen=Number(M&&M.searchGen||0);
              /* EARTHLINE 17600 — committed geographic water geometry is immutable for the
                 generation. Camera/style changes reproject it; they never regenerate it
                 from mutable post-publication model state. */
              if(
                Number.isFinite(committedFlowGeneration15824)&&
                committedFlowGeneration15824===currentGen&&
                validFC15824(cachedFlow)
              )return cachedFlow;

              const frameKey=''', 
          "flow preamble")

          exact(
          '''    cachedKey=key;
              cachedFlow=validFC15824(flow)?flow:emptyFC15824();
              M.authoritativeWaterPaths15824=cachedFlow;''',
          '''    cachedKey=key;
              cachedFlow=validFC15824(flow)?flow:emptyFC15824();
              if(propertyActive15824())committedFlowGeneration15824=currentGen;
              M.authoritativeWaterPaths15824=cachedFlow;''',
          "flow lock commit")

          splice(
          '  function schedule(reason="property-result"){',
          '  window.earthlinePublishPropertyWater15823=publish;',
          '''  function schedule(reason="property-result"){
              /* EARTHLINE 17600 — compatibility shim only. The inherited retry ladder no
                 longer owns Property-water lifecycle. */
              M.propertyFlowDelivery15823={
                build:BUILD,reason:String(reason||"property-result"),
                legacySchedulerRetired17600:true,attemptedAt:Date.now()
              };
              try{
                if(typeof window.earthlineRenderDirectWater15824==="function")
                  return !!window.earthlineRenderDirectWater15824(false);
              }catch(_){}
              return false;
            }

          ''',
          "legacy schedule")

          splice(
          '''  try{
              earthlineMap.on("load",()=>schedule("map-load"));''',
          '  const stamp=document.getElementById("earthlineFooterBuild15784");',
          '''  /* EARTHLINE 17600 — 15824 is the sole automatic Property-water renderer.
               Retire inherited 15823 load/style/idle/move/zoom listeners and polling. */
            renderStatus();

          ''',
          "legacy event fanout")

          exact(
          '''    setInterval(()=>{
                // 16487: retain lightweight status maintenance, not continuous Mapbox/SVG enforcement.
                updateStatus15824();
              },650);

          ''',
          '''    /* EARTHLINE 17600 — no polling owner; status updates only on canonical renders. */

          ''',
          "direct status polling")

          splice(
          '  function settleCurrentPropertyPresentation16521(serial,searchGen,count){',
          '  function clearSafePropertyFallback16221',
          '''  function settleCurrentPropertyPresentation16521(serial,searchGen,count){
              /* EARTHLINE 17600 — one atomic post-publication presentation commit. */
              const md=model()||{};
              const displayed=window.EARTHLINE_DISPLAYED_RUN_16151||window.EARTHLINE_DISPLAYED_RUN_16147||null;
              const tier=String(displayed&&(displayed.tier||displayed.mode)||'').toLowerCase();
              if(serial!==runSerial||Number(md.searchGen||0)!==Number(searchGen)||tier==='regional')return false;
              let safe=null,safeOk=count===0;
              try{safe=syncSafePropertyFallback16221('atomic-postpublish-17600');safeOk=count===0||!!(safe&&safe.ok)}catch(_){ }
              try{if(typeof window.earthlineRenderDirectWater15824==='function')window.earthlineRenderDirectWater15824(true)}catch(_){ }
              try{if(typeof window.earthlineSyncAquiferLayer==='function')window.earthlineSyncAquiferLayer()}catch(_){ }
              try{if(typeof window.earthlineApplyRendererOwnership15805==='function')window.earthlineApplyRendererOwnership15805('property')}catch(_){ }
              try{if(typeof window.earthlineQueueAnalysisBoundary15827==='function')window.earthlineQueueAnalysisBoundary15827()}catch(_){ }
              const r=(model()||{}).directWaterRenderer15824||null;
              const generated=Number(r&&r.generatedPaths),visible=Number(r&&r.visiblePaths||0);
              const waterOk=!!(r&&Number.isFinite(generated)&&(generated===0||(r.visible===true&&visible>0)));
              window.EARTHLINE_PROPERTY_PRESENTATION_SETTLE_AUDIT_16521={
                build:'EARTHLINE 17600',ok:!!(safeOk&&waterOk),searchGen:Number(searchGen),
                corridors:Number(count||0),atomic:true,safe,
                water:{generatedPaths:Number.isFinite(generated)?generated:null,visiblePaths:visible,ok:waterOk},
                at:new Date().toISOString()
              };
              return !!(safeOk&&waterOk);
            }

''',
          "atomic presentation commit")

          splice(
          '''      try{
                  if(typeof window.earthlineSchedulePropertyWater15823!=='function')''',
          '      window.EARTHLINE_PROPERTY_POSTPUBLISH_EVIDENCE_RETRY_16410=',
          '',
          "duplicate postpublish water")

          exact(
          "    const mp=map();if(mp?.on)for(const ev of ['load','style.load','idle','zoomend','moveend'])mp.on(ev,()=>scheduleSafePropertyFallback16221('map-'+ev));",
          "    const mp=map();if(mp?.on)for(const ev of ['load','style.load','zoomend','moveend'])mp.on(ev,()=>scheduleSafePropertyFallback16221('map-'+ev));",
          "safe fallback idle")

          checks={
            "markers":s.count("EARTHLINE 17600"),
            "owner":s.count("function propertyActive15824()"),
            "flow":s.count("function authoritativeFlow15824("),
            "settle":s.count("function settleCurrentPropertyPresentation16521("),
            "legacy_retry":"for(const delay of [0,80,220,520,1100,2200,4200])" in s,
            "settle_retry":"for(const delay of [0,90,260,620,1300,2200])" in s,
            "legacy_poll":"setInterval(renderStatus,700)" in s,
            "direct_poll":"updateStatus15824();\n    },650)" in s,
          }
          assert checks["markers"]>=7, checks
          assert checks["owner"]==1 and checks["flow"]==1 and checks["settle"]==1, checks
          assert not any([checks["legacy_retry"],checks["settle_retry"],checks["legacy_poll"],checks["direct_poll"]]), checks
          assert len(s)>original_len-50000
          p.write_text(s,encoding="utf-8")
          print("EARTHLINE_M73_PATCH",checks,"bytes",original_len,"->",len(s))
          PY
      - name: Validate JavaScript and ownership invariants
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          if((s.match(/EARTHLINE 17600/g)||[]).length<7)throw Error('17600 markers missing');
          if((s.match(/function propertyActive15824\(\)/g)||[]).length!==1)throw Error('water owner count');
          if(s.includes('for(const delay of [0,80,220,520,1100,2200,4200])'))throw Error('legacy water retries remain');
          if(s.includes('for(const delay of [0,90,260,620,1300,2200])'))throw Error('postpublish retry ladder remains');
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1])}catch(e){throw Error('script '+i+' '+e.message)}
          }
          console.log('EARTHLINE_M73_STATIC_PASS');
          NODE
      - name: Commit stabilization
        shell: bash
        run: |
          git config user.name "Earthline Stability"
          git config user.email "info@earthlinedevelopment.org"
          git rm -f .github/workflows/earthline-m73-stabilize.yml .github/workflows/earthline-m73-production-stability-diagnostic.yml || true
          git add index.html
          git commit -m "fix: stabilize committed Property presentation owner"
          git push origin HEAD:pages-live
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for production commit
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -fsSL "https://earthlinedevelopment.org/?m73deploy=$i" | grep -q "EARTHLINE 17600"; then
              echo "EARTHLINE_M73_LIVE_MARKER_PRESENT"
              exit 0
            fi
            sleep 2
          done
          echo "Production marker did not appear" >&2
          exit 1
      - name: Verify first Property blue persistence and clean supersession
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:900}});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('https://earthlinedevelopment.org/?m73verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
          await page.waitForSelector('#searchInput',{timeout:30000});
          await page.waitForFunction(()=>window.earthlineMap||(typeof earthlineMap!=='undefined'&&earthlineMap),null,{timeout:30000,polling:100});
          const q='61 Sleepy Hollow Rd, Essex, Vermont, USA';
          await page.evaluate(q=>{
            const i=document.getElementById('searchInput');i.value=q;
            i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));
          },q);
          await page.waitForTimeout(500);
          await page.evaluate(q=>{
            const options=[...document.querySelectorAll('#earthlineSearchSuggestions15970 [role="option"]')];
            const opt=options.find(el=>String(el.dataset.query||el.textContent||'').toLowerCase().includes('61 sleepy hollow'));
            if(opt)opt.click();
            const b=document.getElementById('runBtn');if(!b)throw new Error('Run Analysis missing');b.click();
          },q);
          await page.waitForFunction(()=>{
            const m=typeof M!=='undefined'?M:null,p=m&&m.propertyPublication15816;
            return !!(p&&p.committed===true&&p.safetyVerified===true&&Number(p.searchGen)===Number(m.searchGen));
          },null,{timeout:70000,polling:100});
          await page.waitForFunction(()=>{
            const m=typeof M!=='undefined'?M:null,r=m&&m.directWaterRenderer15824,svg=document.getElementById('earthlinePropertyWaterOverlay15824');
            return !!(svg&&getComputedStyle(svg).display!=='none'&&svg.childElementCount>0&&r&&r.visible===true&&Number(r.visiblePaths)>0);
          },null,{timeout:15000,polling:100});
          const first=await page.evaluate(()=>({gen:Number(M.searchGen),pubGen:Number(M.propertyPublication15816.searchGen),paths:Number(M.directWaterRenderer15824.visiblePaths),children:document.getElementById('earthlinePropertyWaterOverlay15824')?.childElementCount||0}));
          const samples=[];
          for(let i=0;i<32;i++){
            await page.waitForTimeout(250);
            samples.push(await page.evaluate(()=>{
              const svg=document.getElementById('earthlinePropertyWaterOverlay15824'),r=M.directWaterRenderer15824,p=M.propertyPublication15816;
              return {gen:Number(M.searchGen),pubGen:Number(p&&p.searchGen),display:svg?getComputedStyle(svg).display:null,children:svg?svg.childElementCount:0,visible:!!(r&&r.visible),paths:Number(r&&r.visiblePaths||0)};
            }));
          }
          const stable=samples.every(x=>x.gen===first.gen&&x.pubGen===first.pubGen&&x.display!=='none'&&x.children>0&&x.visible&&x.paths>0);
          if(!stable)throw new Error('Committed Property blue did not remain stable '+JSON.stringify({first,samples,errors}));
          await page.evaluate(()=>{
            const i=document.getElementById('searchInput');i.value='Vermont';
            i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));
            document.getElementById('runBtn')?.click();
          });
          await page.waitForFunction(g=>Number(M.searchGen)>Number(g),first.gen,{timeout:15000,polling:100});
          await page.waitForFunction(()=>{
            const svg=document.getElementById('earthlinePropertyWaterOverlay15824');
            return !svg||getComputedStyle(svg).display==='none'||svg.childElementCount===0;
          },null,{timeout:10000,polling:100});
          console.log('EARTHLINE_M73_LIVE_PASS '+JSON.stringify({first,stable,sampleCount:samples.length,errors}));
          await browser.close();
          NODE
