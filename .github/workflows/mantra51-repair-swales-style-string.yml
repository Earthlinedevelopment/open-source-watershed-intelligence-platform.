name: Mantra 51 Repair Swales Style String
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - 'scripts/fix_swales_style_string_16930.py'
      - '.github/workflows/mantra51-repair-swales-style-string.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/fix_swales_style_string_16930.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.in_script=False; self.buf=[]; self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='script': self.in_script=True; self.buf=[]
              def handle_endtag(self,tag):
                  if tag.lower()=='script' and self.in_script:
                      self.scripts.append(''.join(self.buf)); self.in_script=False
              def handle_data(self,data):
                  if self.in_script:self.buf.append(data)
          p=P();p.feed(Path('index.html').read_text(errors='ignore'))
          out=Path('/tmp/el-scripts');out.mkdir(exist_ok=True)
          for i,sc in enumerate(p.scripts):(out/f'{i:03}.js').write_text(sc)
          print('scripts',len(p.scripts))
          PY
          for f in /tmp/el-scripts/*.js; do node --check "$f" >/dev/null; done
          git add index.html
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git commit -m "fix: restore Swales Explained runtime syntax"
          git push
