name: Earthline V2 read-only public HTTPS delivery verification
on:
  push:
    branches:
      - release/earthline-v2-waterpath-hold-20261121
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify exact public HTML and water-path hold through HTTPS
        shell: bash
        run: |
          set -euo pipefail
          want_index='0a2026ec9b228bfc3300a8d1c626775dee9315ea1e58b55900522484c628131e'
          want_script='97b0ca243d172c13f47a9152503b07d9c931f8dd68fc58e87196fe2a15d4b278'
          pass=0
          for i in 1 2 3 4 5; do
            url="https://earthlinedevelopment.org/?earthline_v2_verify=20261121-$i"
            script="https://earthlinedevelopment.org/earthline-waterpath-hold.js?v=97b0ca24&verify=$i"
            curl -fLsS --max-time 35 -H 'Cache-Control: no-cache' "$url" -o /tmp/earthline-public-index || true
            curl -fLsS --max-time 35 -H 'Cache-Control: no-cache' "$script" -o /tmp/earthline-public-hold || true
            found_index="$(sha256sum /tmp/earthline-public-index 2>/dev/null | cut -d' ' -f1 || true)"
            found_script="$(sha256sum /tmp/earthline-public-hold 2>/dev/null | cut -d' ' -f1 || true)"
            echo "HTTPS attempt $i: index=$found_index hold=$found_script"
            if [ "$found_index" = "$want_index" ] && [ "$found_script" = "$want_script" ]; then
              echo 'EARTHLINE V2 PUBLIC HTTPS DELIVERED: BOTH SHA-256 HASHES VERIFIED'
              pass=1
              break
            fi
            sleep 12
          done
          test "$pass" = 1
