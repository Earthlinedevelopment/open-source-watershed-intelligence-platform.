name: Earthline two task audit 16904
on:
  push:
    branches: [mantra49-two-task-launch-fix-16904]
    paths:
      - .github/workflows/mantra49-two-task-audit-16904.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install playwright@1.55.0 --no-save
      - name: Audit only language-disabled and run-button duplication
        run: |
          cat > audit16904.js <<'JS'
          const {chromium}=require('playwright');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/chromium',args:['--no-sandbox']});
            const p=await b.newPage({viewport:{width:1600,height:900}});
            await p.goto('https://earthlinedevelopment.org/?audit16904='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForSelector('#runBtn',{timeout:30000}); await sleep(2500);
            async function snap(label){
              const x=await p.evaluate(()=>{
                const sel=document.getElementById('earthlineLanguage16488');
                const run=document.getElementById('runBtn');
                const norm=s=>(s||'').replace(/\s+/g,' ').trim();
                return {
                  lang:{exists:!!sel,disabled:!!sel?.disabled,aria:sel?.getAttribute('aria-disabled'),value:sel?.value||'',pointer:sel?.style.pointerEvents||'',title:sel?.title||''},
                  run:{text:norm(run?.textContent),innerHTML:run?.innerHTML||'',childTexts:run?[...run.childNodes].map(n=>norm(n.textContent)).filter(Boolean):[],spans:run?[...run.querySelectorAll('span')].map(s=>norm(s.textContent)).filter(Boolean):[]}
                };
              });
              console.log(label,JSON.stringify(x));return x;
            }
            const a=await snap('START');
            const inp=p.locator('#searchInput'); if(await inp.count()){await inp.fill('Vermont'); await inp.press('Enter'); await sleep(12000);}
            const c=await snap('AFTER_SEARCH');
            const bad=x=>/RUN\s+ANALYSIS\s+RUN\s+ANALYSIS/i.test(x.run.text)||x.run.childTexts.filter(t=>/RUN ANALYSIS/i.test(t)).length>1||x.run.spans.filter(t=>/RUN ANALYSIS/i.test(t)).length>1;
            if(!a.lang.disabled||a.lang.aria!=='true') throw new Error('LANGUAGE CONTROL ACTIVE');
            if(bad(a)||bad(c)) throw new Error('RUN BUTTON DUPLICATED');
            console.log('TWO TASK AUDIT PASS');
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node audit16904.js
