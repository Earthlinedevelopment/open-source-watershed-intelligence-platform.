name: Earthline M48 guarded Bioswale Report production repair 16870
on:
  push:
    branches:
      - pages-live
    paths:
      - .github/workflows/earthline-m48-report-production-repair-16870.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact live parent and unchanged index
        run: |
          test "$(git rev-parse HEAD^)" = "43ff6071dc5031d2dd11066198209e88173a231e"
          git diff --quiet HEAD^ HEAD -- index.html
      - name: Patch only the report helper scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          marker='  function gapRows(d){'
          helper="""  function finalSourcesPage16864(data){const d=data&&data.d||data||{};let body='';try{body=typeof sourceRows==='function'?sourceRows(d):''}catch(_){body=''}return `<section class=\"el49-page el16864-final-sources\"><div class=\"el49-kicker\">Sources · Final Page</div><h2>Sources and evidence register</h2>${body}<div class=\"el49-callout\"><b>Groundwater interpretation:</b> well location is not an aquifer boundary; water level is not storage; an aquifer polygon does not mean groundwater is present at every point; absence of a well does not mean absence of groundwater.</div>${footer(data,'Sources')}</section>`}\n"""
          if t.count(marker)!=1:
              raise SystemExit(f'Expected exactly one report gapRows marker; found {t.count(marker)}')
          a=t.find('function sourceRows')
          b=t.find(marker,a)
          if a<0 or b<0:
              raise SystemExit('Report sourceRows/gapRows scope not found')
          if 'function finalSourcesPage16864' in t[a:b]:
              raise SystemExit('Report-scope helper already present; aborting duplicate production patch')
          before=t
          t=t.replace(marker,helper+marker,1)
          if 'function finalSourcesPage16864' not in t[a:t.find(marker,a)]:
              raise SystemExit('Helper failed to land in report scope')
          if t.replace(helper,'',1)!=before:
              raise SystemExit('Production patch changed more than one approved helper insertion')
          p.write_text(t,encoding='utf-8')
          PY
          test "$(git diff --numstat -- index.html)" = $'1\t0\tindex.html'
      - name: Commit exact production repair
        run: |
          git config user.name "earthline-repair-bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: 16870 restore Bioswale Report final-sources helper scope"
          git push origin HEAD:pages-live
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify deployed production report builder
        run: |
          mkdir -p artifacts
          cat > /tmp/verify_live_report_16870.py <<'PY'
          import json,time,traceback
          from playwright.sync_api import sync_playwright
          out={'attempts':[]}
          try:
            with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--disable-dev-shm-usage'])
              passed=False
              for attempt in range(1,7):
                page=browser.new_page(viewport={'width':1440,'height':1000})
                row={'attempt':attempt}
                try:
                  page.goto('https://earthlinedevelopment.org/?report_verify=16870-'+str(attempt),wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_function("()=>typeof window.earthlineOpenVermontReport16151==='function'&&!!document.querySelector('#earthlineVermontReport16149')",timeout=30000)
                  token='REPORT-LIVE-VERIFY-16870'
                  page.evaluate("""token=>{const empty={type:'FeatureCollection',features:[]};const snap={runToken:token,query:'Earthline report live verification',normalizedQuery:'Earthline report live verification',tier:'property',extentClass:'property',mode:'property',completedAt:new Date().toISOString(),bounds:[-73.12,44.48,-73.10,44.50],boundsHash:'report-live-verify-16870',terrain:{source:'Diagnostic terrain',limitation:'Verification snapshot only'},aquifers:empty,watersheds:empty,contours:empty,flows:empty,swales:empty,derived:{contours:0,waterPaths:0}};window.EARTHLINE_DISPLAYED_RUN_16147=snap;window.EARTHLINE_DISPLAYED_RUN_16151=snap;window.EARTHLINE_ACTIVE_RUN_TOKEN_16147=token;window.EARTHLINE_ACTIVE_RUN_TOKEN_16151=token;window.EARTHLINE_REGIONAL_VISUAL_DATA_16020={swales:empty,contours:empty,flows:empty,aquifers:empty};document.documentElement.dataset.earthlineActiveRun=token;document.documentElement.dataset.earthlineRunState='published';document.dispatchEvent(new CustomEvent('earthline:analysis-complete',{detail:{runToken:token,tier:'property'}}));}""",token)
                  page.wait_for_timeout(300)
                  row['state']=page.evaluate("""()=>{const b=document.querySelector('#earthlineVermontReport16149');return {disabled:!!b?.disabled,ready:b?.dataset?.ready||'',onclickType:b?typeof b.onclick:null}}""")
                  row['opened']=page.evaluate("()=>window.earthlineOpenVermontReport16151()")
                  page.wait_for_timeout(250)
                  row['panel']=page.evaluate("""()=>{const p=document.querySelector('#earthlineVermontReportPanel16149'),pages=p?[...p.querySelectorAll('.el49-page')]:[],final=p?.querySelector('.el16864-final-sources');return {exists:!!p,open:!!p?.classList.contains('open'),pageCount:pages.length,hasFinalSources:!!final,isLast:!!final&&pages.at(-1)===final}}""")
                  if row['opened'] is True and row['panel']['open'] and row['panel']['hasFinalSources'] and row['panel']['isLast']:
                    passed=True
                    page.screenshot(path='artifacts/report-live-16870-pass.png')
                    out['pass']=row
                    page.close()
                    break
                except Exception as e:
                  row['error']=str(e)
                out['attempts'].append(row)
                page.close()
                time.sleep(5)
              browser.close()
              if not passed: raise RuntimeError('production report verification did not pass')
          except Exception as e:
            out['failure']=str(e);out['traceback']=traceback.format_exc()
          with open('artifacts/report-live-verification-16870.json','w',encoding='utf-8') as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if 'failure' in out: raise SystemExit(1)
          PY
          python /tmp/verify_live_report_16870.py
      - name: Upload live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthline-report-live-repair-16870
          path: artifacts/
          if-no-files-found: ignore
