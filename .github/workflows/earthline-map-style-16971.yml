name: Earthline map styling 16971
on:
  push:
    branches:
      - pages-live
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Apply visual-only report map pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          start=s.index("function mapSvg(d,small=false){")
          end=s.index("  return parts.join('');\n}", start)+len("  return parts.join('');\n}")
          fn=s[start:end]

          def one(a,b,label):
              global fn
              n=fn.count(a)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {n}")
              fn=fn.replace(a,b,1)

          one("const clipId='elClip16969',aqPat='elAq16969',parts=[];",
              "const clipId='elClip16971',aqPat='elAq16971',parts=[];","ids")
          one('class="el-report-real-site-render-16970"',
              'class="el-report-real-site-render-16971"',"marker")
          one(
              '<linearGradient id="elGround16969" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7eadf"/><stop offset="1" stop-color="#cfd9ca"/></linearGradient>',
              '<linearGradient id="elGround16971" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbe4d8"/><stop offset=".58" stop-color="#c7d5c6"/><stop offset="1" stop-color="#b9c9bb"/></linearGradient><linearGradient id="elAerialWash16971" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4da" stop-opacity=".07"/><stop offset=".55" stop-color="#173d32" stop-opacity=".025"/><stop offset="1" stop-color="#0c2d27" stop-opacity=".13"/></linearGradient>',
              "ground")
          one(
              'width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(31)"><rect width="13" height="13" fill="#e9903c" fill-opacity=".22"/><path d="M0 0 V13" stroke="#bd601d" stroke-width=".8" stroke-opacity=".30"/>',
              'width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><rect width="12" height="12" fill="#e89139" fill-opacity=".24"/><path d="M0 0 V12" stroke="#a94f18" stroke-width=".72" stroke-opacity=".34"/>',
              "aquifer pattern")
          fn=fn.replace("elGround16969","elGround16971").replace("elArrow16969","elArrow16971")
          one('rx="5"/></clipPath>','rx="6"/></clipPath>',"clip")
          one('fill="#0d6e9c" opacity=".9"/></marker>','fill="#0a6c91" opacity=".96"/></marker>',"arrow")
          one('fill="#f2eee5"','fill="#e9e2d5"',"board")
          one('rx="5" fill="url(#elGround16971)" stroke="#7c8d82" stroke-width="1"',
              'rx="6" fill="url(#elGround16971)" stroke="#29483d" stroke-width="1.35"',"frame")
          one('fill="#f7f0df" opacity=".08"','fill="url(#elAerialWash16971)"',"aerial wash")
          one(
              'for(let i=0;i<reportContours.length;i+=8){const dp=path(reportContours[i]);if(dp)parts.push(\'<path d="\'+dp+\'" fill="none" stroke="#ffffff" stroke-width=".7" opacity="\'+(conus?\'.18\':\'.11\')+\'" vector-effect="non-scaling-stroke"/>\')}',
              'for(let i=0;i<reportContours.length;i+=9){const dp=path(reportContours[i]);if(!dp)continue;parts.push(\'<path d="\'+dp+\'" transform="translate(.45 .45)" fill="none" stroke="#14382e" stroke-width=".8" opacity="\'+(conus?\'.10\':\'.09\')+\'" vector-effect="non-scaling-stroke"/>\');parts.push(\'<path d="\'+dp+\'" transform="translate(-.35 -.35)" fill="none" stroke="#fffdf4" stroke-width=".72" opacity="\'+(conus?\'.24\':\'.15\')+\'" vector-effect="non-scaling-stroke"/>\')}',
              "contours")
          one(
              'parts.push(\'<path d="\'+dp+\'" fill="url(#\'+aqPat+\')" fill-rule="evenodd" stroke="#b55b1b" stroke-width="1.15" opacity=".86" vector-effect="non-scaling-stroke"/>\');',
              'parts.push(\'<path d="\'+dp+\'" fill="url(#\'+aqPat+\')" fill-rule="evenodd" stroke="#ad541b" stroke-width="1.25" opacity=".86" vector-effect="non-scaling-stroke"/><path d="\'+dp+\'" fill="none" fill-rule="evenodd" stroke="#f5c276" stroke-width=".46" opacity=".78" vector-effect="non-scaling-stroke"/>\');',
              "aquifer")
          one('stroke="#fff" stroke-width="5.2" opacity=".78"',
              'stroke="#f8fcfb" stroke-width="6.4" opacity=".72"',"water halo")
          one('stroke="#0d6e9c" stroke-width="1.7" opacity=".93"',
              'stroke="#08698f" stroke-width="2.2" opacity=".96"',"water core")

          for a,b in [
              ('stroke="#7d745f" stroke-width=".8" opacity=".28" stroke-linecap="round"',
               'stroke="#746f55" stroke-width=".85" opacity=".31" stroke-dasharray="2.6 3.4" stroke-linecap="round"'),
              ('stroke="#fff" stroke-width="7.5" opacity=".74"',
               'stroke="#fffdf5" stroke-width="8.4" opacity=".78"'),
              ('stroke="#b7caa8" stroke-width="5" opacity=".74"',
               'stroke="#b4c99e" stroke-width="5.7" opacity=".84"'),
              ('stroke="#496d4b" stroke-width="1.05" opacity=".88"',
               'stroke="#345a3c" stroke-width="1.15" opacity=".92"'),
              ('stroke="#fff" stroke-width="15" opacity=".92"',
               'stroke="#fffaf0" stroke-width="17.5" opacity=".94"'),
              ('stroke="#8dbd82" stroke-width="10.5" opacity=".82"',
               'stroke="#7fb273" stroke-width="11.8" opacity=".90"'),
              ('stroke="#224d31" stroke-width="1.55" opacity=".98"',
               'stroke="#173f2a" stroke-width="1.8" opacity=".99"'),
              ('translate(-1.8 -1.8)" fill="none" stroke="#3ba3c3" stroke-width=".9" opacity=".98" stroke-dasharray="2.4 3"',
               'translate(-2.15 -2.15)" fill="none" stroke="#35b6d2" stroke-width="1.05" opacity=".99" stroke-dasharray="2.2 2.8"'),
              ('translate(1.8 1.8)" fill="none" stroke="#3ba3c3" stroke-width=".9" opacity=".98" stroke-dasharray="2.4 3"',
               'translate(2.15 2.15)" fill="none" stroke="#35b6d2" stroke-width="1.05" opacity=".99" stroke-dasharray="2.2 2.8"')
          ]:
              one(a,b,"swale style")

          one("rows.filter(r=>r.grade==='A').slice(0,12)",
              "rows.filter(r=>r.grade==='A').slice(0,8)","A labels")
          one('r="10" fill="#fffdf7" fill-opacity=".95" stroke="#45654d" stroke-width=".8"',
              'r="9.4" fill="#173f2f" fill-opacity=".94" stroke="#fff8e9" stroke-width=".9"',"A badges")
          one('fill="#24432f" font-family="Noto Sans,Arial,sans-serif" font-size="6.8"',
              'fill="#fffdf4" font-family="Noto Sans,Arial,sans-serif" font-size="6.6"',"A text")
          one('fill="#fffdf7" fill-opacity=".91" stroke="#8d9b91" stroke-width=".8"',
              'fill="#173a30" fill-opacity=".91" stroke="#fff7e7" stroke-width=".9"',"north disc")
          one('fill="#203a31" font-family="Noto Sans,Arial,sans-serif" font-size="7.5"',
              'fill="#fffdf4" font-family="Noto Sans,Arial,sans-serif" font-size="7.5"',"north N")
          one('stroke="#203a31" stroke-width="1"',
              'stroke="#fffdf4" stroke-width="1.05"',"north stem")
          one('fill="#203a31"/></g>','fill="#fffdf4"/></g>',"north arrow")

          out=s[:start]+fn+s[end:]
          if out.count("el-report-real-site-render-16971") != 1:
              raise SystemExit("16971 marker validation failed")
          if "el-report-real-site-render-16970" in out:
              raise SystemExit("16970 marker still present")
          p.write_text(out,encoding="utf-8")
          PY
          git config user.name "Earthline Build Bot"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "style: refine real-site report map 16971"
          git push origin HEAD:pages-live
