name: Mantra 46 16785 IA AR Live Gate

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/mantra46-16785-ia-ar-live.mjs'
      - '.github/workflows/earthline-m46-16785-ia-ar-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ia-ar-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspect live makeSwales source
        run: |
          python - <<'PY'
          import urllib.request
          src=urllib.request.urlopen('https://earthlinedevelopment.org/',timeout=30).read().decode('utf-8','replace')
          lines=src.splitlines()
          hits=[i for i,l in enumerate(lines) if 'function makeSwales' in l]
          if not hits:
              raise SystemExit('makeSwales not found')
          i=hits[0]
          lo=max(0,i-8); hi=min(len(lines),i+260)
          print('EARTHLINE_M46_MAKESWALES_SOURCE_BEGIN')
          for n in range(lo,hi):
              print(f'{n+1}: {lines[n]}')
          print('EARTHLINE_M46_MAKESWALES_SOURCE_END')
          PY
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for 16785 production deployment
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 20 https://earthlinedevelopment.org/ | grep -q 'EARTHLINE 16785'; then
              exit 0
            fi
            sleep 3
          done
          echo "16785 marker not live"
          exit 1
      - name: Run Iowa Arkansas live gate
        run: node tests/mantra46-16785-ia-ar-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16785-ia-ar-live
          path: artifacts/mantra46-16785/
          if-no-files-found: warn
