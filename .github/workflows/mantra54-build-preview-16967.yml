name: Build Earthline report-map candidate 16967
on:
  push:
    branches: [mantra54-report-map-16967]
    paths:
      - '.github/workflows/mantra54-build-preview-16967.yml'
permissions:
  contents: write
jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra54-report-map-16967
      - name: Install candidate renderer and report isolation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          new_map=r'''function mapSvg(d,small=false){
            const b=reportBounds(d),W=1100,H=small?470:620;
            const mapX=24,mapY=24,mapW=W-48,mapH=H-48;
            const xSpan=Math.max(.000001,b[2]-b[0]),ySpan=Math.max(.000001,b[3]-b[1]);
            const sx=x=>mapX+(x-b[0])/xSpan*mapW,sy=y=>mapY+mapH-(y-b[1])/ySpan*mapH;
            const pathCoords=coords=>(coords||[]).map((q,i)=>(i?'L':'M')+sx(+q[0]).toFixed(1)+' '+sy(+q[1]).toFixed(1)).join(' ');
            const path=f=>pathCoords(f?.geometry?.coordinates||[]);
            const mid=f=>{const a=f?.geometry?.coordinates||[];const q=a[Math.floor(a.length/2)];return Array.isArray(q)&&q.length>1?q:null};
            const slen=f=>{const a=f?.geometry?.coordinates||[];let L=0;for(let i=1;i<a.length;i++)L+=Math.hypot(sx(+a[i][0])-sx(+a[i-1][0]),sy(+a[i][1])-sy(+a[i-1][1]));return L};
            const reportContours=contours().filter(f=>f?.geometry?.type==='LineString').slice(0,220);
            const reportFlows=flows().filter(f=>f?.geometry?.type==='LineString').slice(0,240);
            const rows=graded(),aquiferFeatures=reportAquifers();
            const flowRank=reportFlows.map(f=>({f,L:slen(f)})).sort((a,b)=>b.L-a.L);
            const major=flowRank.slice(0,Math.min(small?8:12,flowRank.length));
            const secondary=flowRank.slice(major.length,Math.min(major.length+(small?10:16),flowRank.length));
            const reportPlace=String(d?.query||d?.location||d?.placeName||'Analysis Area').trim();
            const lonSpan=Math.max(.0001,b[2]-b[0]),midLat=(b[1]+b[3])/2,kmWide=lonSpan*111.32*Math.cos(midLat*Math.PI/180);
            const niceKm=kmWide>300?100:kmWide>120?50:kmWide>50?20:kmWide>20?10:kmWide>8?5:kmWide>3?2:1;
            const barPx=Math.max(54,Math.min(160,niceKm/kmWide*mapW));
            const clipId='elClip16967',aqPat='elAq16967',parts=[];
            parts.push('<svg class="el-report-landscape-plan-16967" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc('Earthline '+reportPlace+' landscape water plan')+'">');
            parts.push('<defs><linearGradient id="elGround16967" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf4"/><stop offset=".47" stop-color="#f1f3e9"/><stop offset="1" stop-color="#e4ece2"/></linearGradient><pattern id="'+aqPat+'" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(31)"><rect width="13" height="13" fill="#e99142" fill-opacity=".25"/><path d="M0 0 V13" stroke="#bd6320" stroke-width=".75" stroke-opacity=".27"/></pattern><clipPath id="'+clipId+'"><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="4"/></clipPath><marker id="elArrow16967" markerWidth="5" markerHeight="5" refX="4.1" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L5 2.5 L0 5 Z" fill="#17779f" opacity=".78"/></marker></defs>');
            parts.push('<rect width="'+W+'" height="'+H+'" fill="#f5f2e9"/><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="4" fill="url(#elGround16967)" stroke="#96a39a" stroke-width=".85"/><g clip-path="url(#'+clipId+')">');

            /* Existing contour geometry becomes quiet landform relief, not line clutter. */
            for(let i=0;i<reportContours.length;i+=12){const dp=path(reportContours[i]);if(!dp)continue;parts.push('<path d="'+dp+'" transform="translate(3.2 3.5)" fill="none" stroke="#52685b" stroke-width="34" opacity=".018" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" transform="translate(-2.2 -2.6)" fill="none" stroke="#ffffff" stroke-width="18" opacity=".18" stroke-linecap="round" vector-effect="non-scaling-stroke"/>')}
            for(let i=0;i<reportContours.length;i+=5){const dp=path(reportContours[i]);if(!dp)continue;const index=i%20===0;parts.push('<path d="'+dp+'" fill="none" stroke="'+(index?'#65736a':'#9ba49d')+'" stroke-width="'+(index?'.58':'.24')+'" opacity="'+(index?'.23':'.075')+'" vector-effect="non-scaling-stroke"/>')}

            /* Orange aquifer fields remain visible but subordinate. */
            for(const f of aquiferFeatures){const g=f&&f.geometry;if(!g)continue;const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];for(const poly of polys){const rings=poly.filter(r=>Array.isArray(r)&&r.length>=3);if(!rings.length)continue;const dp=rings.map(r=>pathCoords(r)+' Z').join(' ');parts.push('<path d="'+dp+'" fill="url(#'+aqPat+')" fill-rule="evenodd" stroke="#b9601f" stroke-width="1" opacity=".92" vector-effect="non-scaling-stroke"/>')}}

            /* Only the principal modeled water network reads as blue. */
            for(const x of secondary){const dp=path(x.f);if(dp)parts.push('<path d="'+dp+'" fill="none" stroke="#4f879f" stroke-width=".55" opacity=".10" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>')}
            let fi=0;for(const x of major){const dp=path(x.f);if(!dp)continue;parts.push('<path d="'+dp+'" fill="none" stroke="#fffdf8" stroke-width="4.4" opacity=".84" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#17779f" stroke-width="1.18" opacity=".82" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"'+(fi++%4===0?' marker-end="url(#elArrow16967)"':'')+'/>')}

            /* Bioswales are landscape interventions: broad planted ribbons with twin blue strips. */
            const draw=r=>{const dp=path(r.f);if(!dp)return;
              if(r.grade==='C'){parts.push('<path d="'+dp+'" fill="none" stroke="#95866d" stroke-width=".7" opacity=".12" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');return}
              if(r.grade==='B'){parts.push('<path d="'+dp+'" fill="none" stroke="#fffdf8" stroke-width="10" opacity=".78" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#d3dec9" stroke-width="6.8" opacity=".54" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#66795a" stroke-width="1" opacity=".68" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');return}
              parts.push('<path d="'+dp+'" fill="none" stroke="#fffdf8" stroke-width="19" opacity=".97" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#b5cda9" stroke-width="13.2" opacity=".82" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" fill="none" stroke="#2e5739" stroke-width="1.45" opacity=".96" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" transform="translate(-1.7 -1.7)" fill="none" stroke="#55a8c0" stroke-width=".72" opacity=".96" stroke-dasharray="2.2 2.8" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+dp+'" transform="translate(1.7 1.7)" fill="none" stroke="#55a8c0" stroke-width=".72" opacity=".96" stroke-dasharray="2.2 2.8" stroke-linecap="round" vector-effect="non-scaling-stroke"/>')
            };
            for(const r of rows.filter(r=>r.grade==='C'))draw(r);
            for(const r of rows.filter(r=>r.grade==='B'))draw(r);
            for(const r of rows.filter(r=>r.grade==='A'))draw(r);

            let ai=0;for(const r of rows.filter(r=>r.grade==='A').slice(0,8)){const q=mid(r.f);if(!q)continue;const x=sx(+q[0]),y=sy(+q[1]);parts.push('<g><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="9" fill="#fffdf8" stroke="#5a7460" stroke-width=".75"/><text x="'+x.toFixed(1)+'" y="'+(y+2.2).toFixed(1)+'" text-anchor="middle" fill="#294936" font-family="Noto Sans,Arial,sans-serif" font-size="6.6" font-weight="850">A'+(++ai)+'</text></g>')}

            parts.push('</g>');
            parts.push('<g transform="translate('+(mapX+18)+','+(mapY+mapH-20)+')"><path d="M0 0 H'+barPx+'" stroke="#42544c" stroke-width="1.35"/><path d="M0 -4 V4 M'+barPx+' -4 V4" stroke="#42544c" stroke-width=".85"/><text x="'+(barPx/2)+'" y="13" text-anchor="middle" fill="#56645e" font-family="Noto Sans,Arial,sans-serif" font-size="6.5" font-weight="700">'+niceKm+' km</text></g>');
            parts.push('<g transform="translate('+(mapX+mapW-48)+','+(mapY+20)+')"><circle cx="12" cy="13" r="19" fill="#fffdf8" fill-opacity=".88" stroke="#a8b2aa" stroke-width=".7"/><text x="12" y="-1" text-anchor="middle" fill="#294239" font-family="Noto Sans,Arial,sans-serif" font-size="7.4" font-weight="850">N</text><path d="M12 4 V30" stroke="#294239" stroke-width="1"/><path d="M12 4 L6 16 L12 12 L18 16 Z" fill="#294239"/></g>');

            if(!small){const lx=mapX+18,ly=mapY+18;parts.push('<g transform="translate('+lx+','+ly+')"><rect width="236" height="96" rx="5" fill="#fffef9" fill-opacity=".93" stroke="#c0c7c1" stroke-width=".65"/><text x="15" y="21" fill="#203a33" font-family="Noto Sans,Arial,sans-serif" font-size="8.3" font-weight="850" letter-spacing=".9">LANDSCAPE WATER PLAN</text><path d="M15 29 H221" stroke="#55bde0" stroke-width="1.35"/><rect x="15" y="42" width="22" height="9" rx="1" fill="url(#'+aqPat+')" stroke="#b9601f" stroke-width=".7"/><text x="45" y="49" fill="#465750" font-family="Noto Sans,Arial,sans-serif" font-size="6.2">Aquifer field</text><path d="M15 65 H37" stroke="#17779f" stroke-width="1.18"/><text x="45" y="68" fill="#465750" font-family="Noto Sans,Arial,sans-serif" font-size="6.2">Primary water path</text><path d="M126 47 H150" stroke="#b5cda9" stroke-width="10" opacity=".84" stroke-linecap="round"/><path d="M126 47 H150" stroke="#2e5739" stroke-width="1.35"/><text x="158" y="50" fill="#465750" font-family="Noto Sans,Arial,sans-serif" font-size="6.2">A · priority swale</text><path d="M126 68 H150" stroke="#d3dec9" stroke-width="6.5" opacity=".62" stroke-linecap="round"/><path d="M126 68 H150" stroke="#66795a" stroke-width=".95"/><text x="158" y="71" fill="#465750" font-family="Noto Sans,Arial,sans-serif" font-size="6.2">B · strong</text><text x="15" y="87" fill="#7a837e" font-family="Noto Sans,Arial,sans-serif" font-size="5.4">Symbolic corridor width · field verification required</text></g>')}
            parts.push('</svg>');return parts.join('');
          }
          '''
          start=s.find("function mapSvg(d,small=false){")
          end=s.find("function gradeSummary",start)
          if start<0 or end<0 or end<=start:
              raise SystemExit(f"mapSvg boundary not found: start={start} end={end}")
          s=s[:start]+new_map+s[end:]

          old="panel.querySelectorAll('[data-action=\"close\"]').forEach(b=>b.onclick=()=>{panel.classList.remove('open');document.documentElement.classList.remove('earthline-report-open-16966')});document.documentElement.classList.add('earthline-report-open-16966');panel.classList.add('open');"
          new="panel.querySelectorAll('[data-action=\"close\"]').forEach(b=>b.onclick=()=>{panel.classList.remove('open');document.documentElement.classList.remove('earthline-report-open-16966');for(const id of ['earthlineLaunchLogin16872','earthlineLaunchDonate16872','earthlineLaunchMerch16872']){const el=document.getElementById(id);if(el&&el.dataset.earthlineReportHidden16967==='1'){el.style.removeProperty('display');delete el.dataset.earthlineReportHidden16967}}});document.documentElement.classList.add('earthline-report-open-16966');for(const id of ['earthlineLaunchLogin16872','earthlineLaunchDonate16872','earthlineLaunchMerch16872']){const el=document.getElementById(id);if(el){el.dataset.earthlineReportHidden16967='1';el.style.setProperty('display','none','important')}}panel.classList.add('open');"
          if old not in s:
              raise SystemExit("openReport isolation owner not found")
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          print("candidate 16967 installed")
          PY

      - name: Build deterministic renderer preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json, math
          s=Path("index.html").read_text(encoding="utf-8")
          start=s.find("function mapSvg(d,small=false){")
          end=s.find("function gradeSummary",start)
          fn=s[start:end]

          contours=[]
          for j in range(30):
              pts=[]
              for i in range(61):
                  x=i*100/60
                  y=10+j*1.7 + 2.7*math.sin(i/7+j*.38) + .035*(x-50)*(1 if j%2 else -1)
                  pts.append([x,max(2,min(68,y))])
              contours.append({"type":"Feature","geometry":{"type":"LineString","coordinates":pts},"properties":{"ele":80+j*5}})

          flows=[]
          trunks=[[(52,66),(51,56),(50,47),(49,38),(48,29),(47,20),(46,10),(45,2)],
                  [(22,66),(27,58),(31,50),(35,42),(39,34),(43,25),(47,17),(45,2)],
                  [(84,67),(77,58),(69,51),(62,44),(56,35),(51,26),(47,17),(45,2)]]
          for arr in trunks:
              flows.append({"type":"Feature","geometry":{"type":"LineString","coordinates":[list(p) for p in arr]},"properties":{}})
          for k in range(20):
              side=-1 if k%2==0 else 1
              y0=64-(k//2)*5.5
              x0=8+(k*13)%86
              xe=48+side*(2+(k%4))
              flows.append({"type":"Feature","geometry":{"type":"LineString","coordinates":[[x0,y0],[x0+side*7,y0-7],[xe+side*9,y0-14],[xe,y0-21]]},"properties":{}})

          swales=[]
          specs=[
            ('A',[(8,55),(22,57),(36,55),(50,56)]),
            ('A',[(12,43),(26,45),(41,43),(57,44)]),
            ('A',[(48,33),(63,35),(78,33),(94,35)]),
            ('A',[(10,25),(25,27),(40,25),(55,27)]),
            ('B',[(55,54),(68,56),(82,54),(96,55)]),
            ('B',[(35,18),(50,20),(66,18),(82,20)]),
            ('C',[(5,62),(18,64),(31,62),(44,63)]),
            ('C',[(60,12),(73,14),(88,12),(98,13)])
          ]
          for idx,(grade,pts) in enumerate(specs,1):
              swales.append({"grade":grade,"km":1.4,"f":{"type":"Feature","geometry":{"type":"LineString","coordinates":[list(p) for p in pts]},"properties":{"grade":grade,"id":idx}}})

          aq=[{"type":"Feature","geometry":{"type":"Polygon","coordinates":[[[58,63],[97,63],[97,39],[83,35],[70,39],[58,47],[58,63]]]},"properties":{}}]

          html='''<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#dadad4;font-family:Arial,sans-serif}.wrap{width:1320px;margin:30px auto;background:white;padding:26px 26px 38px;box-shadow:0 8px 30px #0002}.title{font:700 20px Arial;color:#18343c;margin:0 0 14px}.sub{font:12px Arial;color:#617078;margin-bottom:18px}.map svg{display:block;width:100%;height:auto}</style><div class="wrap"><div class="title">Bioswale Impact Report — Analysis Area & Technical Map</div><div class="sub">ALABAMA · USA · 32.60936, -86.68074</div><div class="map" id="map"></div></div><script>
          const C=__CONTOURS__,F=__FLOWS__,R=__ROWS__,AQ=__AQ__;
          function reportBounds(){return [0,0,100,70]}
          function contours(){return C}
          function flows(){return F}
          function graded(){return R}
          function reportAquifers(){return AQ}
          function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
          '''+fn+'''
          document.getElementById("map").innerHTML=mapSvg({query:"ALABAMA · USA · 32.60936, -86.68074",tier:"property",bounds:[0,0,100,70]},false);
          </script>'''
          html=html.replace('__CONTOURS__',json.dumps(contours)).replace('__FLOWS__',json.dumps(flows)).replace('__ROWS__',json.dumps(swales)).replace('__AQ__',json.dumps(aq))
          Path("report-map-preview-16967.html").write_text(html,encoding="utf-8")
          PY
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1400,900 --screenshot=report-map-preview-16967.png "file://$PWD/report-map-preview-16967.html"

      - name: Validate candidate and report-control lock
        shell: bash
        run: |
          grep -q "el-report-landscape-plan-16967" index.html
          grep -q "earthlineReportHidden16967" index.html
          grep -q "earthlineLaunchLogin16872" index.html
          grep -q "earthlineLaunchDonate16872" index.html
          grep -q "earthlineLaunchMerch16872" index.html
          test -s report-map-preview-16967.png
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          assert s.count("function mapSvg(d,small=false){")==1
          assert "slice(0,Math.min(small?8:12,flowRank.length))" in s
          assert 'transform="translate(-1.7 -1.7)"' in s
          assert 'transform="translate(1.7 1.7)"' in s
          Path("REPORT-MAP-16967-CHECK.txt").write_text(
              "PASS: one authoritative mapSvg owner\n"
              "PASS: major water paths capped at 12\n"
              "PASS: A swales use broad planted corridor + twin blue strips\n"
              "PASS: exact launch buttons are explicitly hidden by report owner\n"
              "PASS: deterministic PNG preview rendered\n",
              encoding="utf-8")
          PY

      - name: Commit candidate and preview only to candidate branch
        shell: bash
        run: |
          git config user.name "Earthline Mantra 54"
          git config user.email "info@earthlinedevelopment.org"
          git rm .github/workflows/mantra54-build-preview-16967.yml
          git add index.html report-map-preview-16967.html report-map-preview-16967.png REPORT-MAP-16967-CHECK.txt
          git commit -m "candidate: visually tested report map 16967"
          git push origin mantra54-report-map-16967
