name: Earthline LIVE New York two-run smoke test
on:
  push:
    branches: [test/live-ny-two-runs-v2-20261121]
permissions:
  contents: read
jobs:
  newyork:
    name: Real site double Property — ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop-chrome, desktop-safari]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browsers
        run: |
          npm install --no-save playwright @mapbox/vector-tile@1.3.1 pbf@3.2.1
          npx playwright install --with-deps chromium webkit
      - name: Run REAL production New York Property twice
        env:
          EARTHLINE_PROFILE: ${{ matrix.profile }}
          EARTHLINE_PINNED: '0'
          EARTHLINE_SKIP_REGIONAL: '1'
          EARTHLINE_SKIP_LIFECYCLE: '1'
          EARTHLINE_FAIL_CLOSED: '0'
          EARTHLINE_SITES: 'newyork-your-screenshot-1'
        run: |
          node tests/earthline-live-site-test.mjs
      - name: Check public V2 water-path hold without touching swales
        env:
          EARTHLINE_PROFILE: ${{ matrix.profile }}
        run: |
          node --input-type=module <<'NODE'
          import {chromium,webkit} from 'playwright';
          const engine=process.env.EARTHLINE_PROFILE==='desktop-safari'?webkit:chromium;
          const browser=await engine.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          try{
            await page.goto('https://earthlinedevelopment.org/?waterhold_verification=20261121',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#searchInput',{timeout:30000});
            await page.waitForFunction(()=>!!window.earthlineMap,{timeout:30000});
            await page.evaluate(()=>{const m=window.earthlineMap;m.jumpTo({center:[-75.76996,42.78781],zoom:17});m.fire('dragend');});
            await page.waitForTimeout(5000);
            await page.click('#earthlineDeclareProperty16169',{timeout:30000});
            await page.waitForFunction(()=>document.documentElement.dataset.earthlineAnalysisTier==='property'&&typeof M!=='undefined'&&M.analysisReady,{timeout:85000});
            await page.waitForTimeout(1500);
            const state=await page.evaluate(()=>{
              const m=window.earthlineMap;
              const pattern=/^(earthline|el)-(?:live-)?(?:regional-|property-)?(?:modeled-)?flow/i;
              const flowLayers=(m.getStyle()?.layers||[]).filter(x=>pattern.test(x.id)&&!/image/i.test(x.id)).map(x=>({id:x.id,visibility:m.getLayoutProperty(x.id,'visibility')}));
              const overlayIds=['earthlinePropertyWaterOverlay15824','earthlineInterceptionOverlay15825'];
              const sheets=overlayIds.map(id=>{const e=document.getElementById(id);return {id,exists:!!e,display:e?getComputedStyle(e).display:null}});
              const swaleLayers=(m.getStyle()?.layers||[]).filter(x=>/swale/i.test(x.id)).map(x=>({id:x.id,visibility:m.getLayoutProperty(x.id,'visibility')}));
              return {hold:window.EARTHLINE_WATERPATH_HOLD||null,flowLayers,sheets,swaleLayersCount:swaleLayers.length,
                visibleSwaleLayers:swaleLayers.filter(x=>x.visibility!=='none').length};
            });
            console.log('EARTHLINE_PUBLIC_WATER_HOLD_CHECK '+JSON.stringify({...state,errors}));
            if(!state.hold?.active||state.flowLayers.some(x=>x.visibility!=='none')||
               state.sheets.some(x=>x.exists&&x.display!=='none')||errors.length)
              throw Error('PUBLIC WATER HOLD NOT VERIFIED');
          }finally{await browser.close();}
          NODE
      - name: Report and enforce repeatable scientific result
        if: always()
        env:
          EARTHLINE_PROFILE: ${{ matrix.profile }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path='live-test-results/'+process.env.EARTHLINE_PROFILE+'/results.json';
          if(!fs.existsSync(path))throw new Error('NO_BROWSER_RESULTS: '+path);
          const data=JSON.parse(fs.readFileSync(path));
          const row=data.rows.find(x=>x.site==='newyork-your-screenshot-1');
          const result={
            profile:data.profile,url:data.url,testedAt:data.testedAt,
            candidateMode:data.candidateMode,
            pageErrors:row?.pageErrors||[],
            couldNotRun:row?.couldNotRun||null,
            run1:{count:row?.run1?.shownSwales,ready:row?.run1?.analysisReady,
               tier:row?.run1?.tier,timedOut:row?.run1?.timedOut,
               center:row?.run1?.center,secs:row?.run1?.seconds,
               violations:row?.run1?.independentExclusionCheck?.violations,
               waterHold:row?.run1?.waterHold||null},
            run2:{count:row?.run2?.shownSwales,ready:row?.run2?.analysisReady,
               tier:row?.run2?.tier,timedOut:row?.run2?.timedOut,
               center:row?.run2?.center,secs:row?.run2?.seconds,
               violations:row?.run2?.independentExclusionCheck?.violations},
            sameResult:row?.sameResultBothRuns,
            sameEngineHash:row?.sameEngineHashBothRuns,
            sameStableIds:row?.sameStableIdsBothRuns,
            shownEqualsPublishedBoth:row?.shownEqualsPublishedBothRuns
          };
          console.log('EARTHLINE_NEWYORK_LIVE_TWO_RUN_SUMMARY '+JSON.stringify(result));
          const good=!!row&&row.run1?.tier==='property'&&row.run2?.tier==='property'&&
          row.run1?.analysisReady===true&&row.run2?.analysisReady===true&&
          row.run1?.shownSwales===row.run2?.shownSwales&&
          row.run1?.shownSwales>0&&row.sameResultBothRuns&&row.sameEngineHashBothRuns&&
          row.sameStableIdsBothRuns&&row.shownEqualsPublishedBothRuns&&
          !row.run1?.timedOut&&!row.run2?.timedOut&&!row.couldNotRun;
          if(!good){console.error('FAIL: live same-property two-run gate');process.exit(1);}
          console.log('PASS: New York Property repeats exactly at real public HTTPS.');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ny-live-${{ matrix.profile }}
          path: live-test-results/${{ matrix.profile }}/
          retention-days: 7
