name: Earthline 16785 Candidate A B Probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-m45-16785-candidate-ab.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run IA AR candidate-generation A B probe
        run: node lab/m45_16785_candidate_ab.mjs
      - name: Persist probe
        run: |
          git config user.name "Earthline Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add lab/mantra45-16785-candidate-ab.json
          git commit -m "diag: persist 16785 candidate A B evidence [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
