    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-legacy-hbw-injection-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='ignore')
          for term in ['const firstContentImg16388','const precedentSection=`']:
              i=s.find(term)
              print('\n###',term,i)
