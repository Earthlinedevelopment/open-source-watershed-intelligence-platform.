name: Mantra 51 Germany Zoom vs Close Property
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths: ['lab/mantra51-germany-zoom-vs-close.mjs']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: mantra51-global-repair-campaign}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node lab/mantra51-germany-zoom-vs-close.mjs
