name: Earthline M75 Iowa Property Fast Verify
on:
  push:
    branches:
      - recovery/mantra75-regional-engine
    paths:
      - .earthline-m75-property-fast-trigger
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-regional-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.55.0
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/iowa-property-fast-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node tests/iowa-property-engine.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iowa-property-fast
          path: |
            iowa-property-engine.json
            iowa-property-engine.png
