name: Mantra 51 Corrections Registry Audit
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-corrections-registry-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='ignore')
          for term in ['Corrections Registry','EARTHLINE_CORRECTIONS_REGISTRY_16513','corrections registry','el12-corrections']:
              print('\n##',term)
              st=0
              for _ in range(12):
                  i=s.lower().find(term.lower(),st)
                  if i<0: break
                  print('POS',i)
                  print(s[max(0,i-900):i+2600].replace('\n',' '))
                  st=i+len(term)
          PY
