name: Earthline Active Property Prescriber Trace 17035
on:
  push:
    branches: [test-property-coverage-17031]
    paths:
      - '.github/workflows/active-property-prescriber-trace-17035.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Trace active governed Property swale generator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=[
            'rawEngineCorridors',
            'earthlineGovernedPropertyRun16202',
            'swale prescription',
            'makeSwales(',
            'M.swales=',
            'M.swales =',
            'authoritativePropertySwales15800',
            'property-commit-before-view'
          ]
          for n in needles:
              print('\n===== '+n+' =====')
              st=0; k=0
              while True:
                  i=s.find(n,st)
                  if i<0 or k>=12: break
                  print('\n--- @',i,'---')
                  print(s[max(0,i-3200):min(len(s),i+6500)])
                  st=i+len(n);k+=1
              print('HITS',k)
          PY
