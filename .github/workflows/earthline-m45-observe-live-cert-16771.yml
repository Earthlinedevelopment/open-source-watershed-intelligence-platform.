name: Earthline Mantra45 Observe Live 16771 Certification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/earthline-m45-observe-live-cert-16771.yml']
permissions:
  actions: read
  contents: write
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Observe exact live certification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p lab
          target='Earthline Mantra45 Live Certification 16771'
          run_id=''
          for i in $(seq 1 30); do
            run_id="$(gh run list --workflow "$target" --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)"
            [ -n "$run_id" ] && break
            sleep 3
          done
          if [ -z "$run_id" ]; then
            echo '{"error":"live certification workflow run not found"}' > lab/mantra45-live-16771-cert-status.json
          else
            for i in $(seq 1 100); do
              status="$(gh run view "$run_id" --json status --jq '.status')"
              [ "$status" = "completed" ] && break
              sleep 5
            done
            gh run view "$run_id" --json databaseId,name,status,conclusion,headSha,createdAt,updatedAt,url,jobs > lab/mantra45-live-16771-cert-status.json
            gh run view "$run_id" --log-failed > lab/mantra45-live-16771-cert-failed.log 2>&1 || true
          fi
      - name: Persist observer
        shell: bash
        run: |
          git config user.name "Earthline Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add lab/mantra45-live-16771-cert-status.json
          test -f lab/mantra45-live-16771-cert-failed.log && git add lab/mantra45-live-16771-cert-failed.log || true
          git commit -m "diag: persist live 16771 certification status [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
