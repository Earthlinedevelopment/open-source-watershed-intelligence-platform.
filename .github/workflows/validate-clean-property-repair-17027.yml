name: Earthline Validate Clean Property Repair 17027
on:
  push:
    branches:
      - candidate-property-integrity-17019
    paths:
      - .github/workflows/validate-clean-property-repair-17027.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-property-integrity-clean-17027
          fetch-depth: 0
      - name: Verify clean diff
        run: |
          test "$(git diff --name-only acaf37c805250f97e2da842d5e900b9a71073629..HEAD | wc -l)" -eq 1
          test "$(git diff --name-only acaf37c805250f97e2da842d5e900b9a71073629..HEAD)" = "index.html"
          git diff --check acaf37c805250f97e2da842d5e900b9a71073629..HEAD
      - name: Fetch validator
        run: |
          git fetch origin candidate-property-integrity-17019
          git show origin/candidate-property-integrity-17019:tests/validate-property-integrity-17027.mjs > ./validate-17027.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Serve candidate as production-equivalent HTTPS origin
        run: |
          openssl req -x509 -nodes -newkey rsa:2048 -keyout /tmp/earthline-key.pem -out /tmp/earthline-cert.pem -days 1 -subj '/CN=earthlinedevelopment.org' -addext 'subjectAltName=DNS:earthlinedevelopment.org'
          cat > /tmp/serve_https.py <<'PY'
          import http.server, ssl
          server=http.server.ThreadingHTTPServer(('0.0.0.0',443),http.server.SimpleHTTPRequestHandler)
          ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.load_cert_chain('/tmp/earthline-cert.pem','/tmp/earthline-key.pem')
          server.socket=ctx.wrap_socket(server.socket,server_side=True)
          server.serve_forever()
          PY
          sudo -E python3 /tmp/serve_https.py >/tmp/earthline-server.log 2>&1 &
          sleep 2
      - name: Validate candidate behavior
        run: EARTHLINE_URL='https://earthlinedevelopment.org/' node ./validate-17027.mjs

