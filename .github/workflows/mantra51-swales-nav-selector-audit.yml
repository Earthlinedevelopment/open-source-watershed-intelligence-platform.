name: Mantra 51 Swales Nav Selector Audit
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - '.github/workflows/mantra51-swales-nav-selector-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - run: python3 -m http.server 8787 >/tmp/el-http.log 2>&1 &
      - run: |
          cat > audit.mjs <<'JS'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1600,height:1000}});
          await p.goto('http://127.0.0.1:8787/index.html?nav='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await p.waitForTimeout(3500);await p.evaluate(()=>{location.hash='#swales-explained'});
          await p.waitForSelector('#earthlineSwalesPage16125.open',{timeout:15000});await p.waitForTimeout(500);
          const out=await p.evaluate(()=>{
            const d=document.querySelector('#earthlineSwalesPage16125 iframe')?.contentDocument;
            return [...(d?.querySelectorAll('a,button')||[])].map((e,i)=>({
              i,tag:e.tagName,id:e.id||'',cls:e.className||'',text:(e.innerText||e.textContent||'').replace(/\s+/g,' ').trim(),
              href:e.getAttribute('href')||'',pos:getComputedStyle(e).position,z:getComputedStyle(e).zIndex
            })).filter(x=>/login|donate|merch/i.test(x.text));
          });
          const parent=await p.evaluate(()=>[...document.querySelectorAll('a,button')].map((e,i)=>({i,tag:e.tagName,id:e.id||'',cls:e.className||'',text:(e.innerText||e.textContent||'').replace(/\s+/g,' ').trim(),pos:getComputedStyle(e).position,z:getComputedStyle(e).zIndex,display:getComputedStyle(e).display,vis:getComputedStyle(e).visibility})).filter(x=>/login|donate|merch/i.test(x.text)));
          console.log(JSON.stringify({iframe:out,parent},null,2));await b.close();
          JS
          node audit.mjs
