name: Earthline Mexico Exact Property Diagnostic
on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/mexico-user-parcel-live.mjs'
      - '.github/workflows/earthline-mexico-user-parcel.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  exact-property:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: pages-live}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save playwright@1.55.0
      - run: node tests/mexico-user-parcel-live.mjs
      - name: Upload exact parcel screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mexico-user-parcel-live
          path: /tmp/mexico-user-parcel-live.png
          if-no-files-found: warn
