name: Candidate Property rerun self-exclusion repair
on:
  push:
    branches: [candidate/property-rerun-fix]
    paths:
      - .github/workflows/candidate-property-rerun-fix.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: candidate-property-rerun-fix
  cancel-in-progress: false
jobs:
  patch-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/property-rerun-fix
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact self-exclusion-only repair, fail closed on unexpected source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          raw=p.read_text()
          exclusions='if(l.id==="earthline-living-swales-water-15792"||l.id==="earthline-property-safe-water-16221")return false;'
          anchors=[
            ('return (style&&style.layers||[]).filter(l=>{\n        const tag=((l.id||"")+" "+(l["source-layer"]||"")).toLowerCase();',
             'return (style&&style.layers||[]).filter(l=>{\n        /* Own displayed swales cannot be treated as mapped hydrography. */\n        '+exclusions+'\n        const tag=((l.id||"")+" "+(l["source-layer"]||"")).toLowerCase();'),
            ('const layers=(style.layers||[]).filter(l=>{\n        const id=((l.id||"")+" "+(l["source-layer"]||"")).toLowerCase();',
             'const layers=(style.layers||[]).filter(l=>{\n        /* Own displayed swales cannot be treated as no-build structures. */\n        '+exclusions+'\n        const id=((l.id||"")+" "+(l["source-layer"]||"")).toLowerCase();')
          ]
          if raw.count(exclusions)==2:
            print('ALREADY_PATCHED')
          else:
            for old,new in anchors:
              assert raw.count(old)==1, 'Unexpected source anchor; no publication or repair'
              raw=raw.replace(old,new,1)
            assert raw.count(exclusions)==2
            p.write_text(raw)
            print('SELF_EXCLUSION_PATCH_APPLIED')
          PY
          test "$(git diff --name-only)" = "index.html" || test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m 'fix(property): exclude Earthline own swale water from rerun no-build acquisition'
            git push origin HEAD:candidate/property-rerun-fix
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for connected candidate-only test
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run repeatability in real browser without publishing
        run: node tests/own-swale-water-candidate-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-property-rerun-regression
          path: artifacts/own-swale-water-candidate/
          retention-days: 14
