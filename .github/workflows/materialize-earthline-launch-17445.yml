name: Materialize Earthline Launch Candidate 17483
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/materialize-earthline-launch-17445.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17483
          fetch-depth: 0
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/apply-property-pointer-fast-17466.py > /tmp/r1.py
          git show origin/repair/property-one-click-17441:tests/apply-elder-corridor-compute-prefetch-17468.py > /tmp/r2.py
          git show origin/repair/property-one-click-17441:tests/apply-property-circular-channel-buffer-17483.py > /tmp/r3.py
          python3 /tmp/r1.py
          python3 /tmp/r2.py
          python3 /tmp/r3.py
      - run: |
          git config user.name "Earthline CI"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html earthline-launch-16872.js
          git commit -m "candidate: Property accuracy + one-press latency + Elder prefetch 17483"
          git push origin HEAD:candidate/earthline-launch-17483
