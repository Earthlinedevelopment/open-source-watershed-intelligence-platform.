name: Materialize Earthline Launch Candidate 17445
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/materialize-earthline-launch-17445.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17445
          fetch-depth: 0
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/apply-property-click-owner-17442.py > /tmp/apply-property-click-owner-17442.py
          git show origin/repair/property-one-click-17441:tests/apply-property-one-press-owner-17444.py > /tmp/apply-property-one-press-owner-17444.py
          python3 /tmp/apply-property-click-owner-17442.py
          python3 /tmp/apply-property-one-press-owner-17444.py
      - run: |
          git config user.name "Earthline CI"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html earthline-launch-16872.js
          git commit -m "candidate: clean Regional report one-click Property 17445" || true
          git push origin HEAD:candidate/earthline-launch-17445
