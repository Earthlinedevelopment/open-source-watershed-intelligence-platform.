name: Materialize Earthline Launch Candidate 17454
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/materialize-earthline-launch-17445.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17454
          fetch-depth: 0
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/apply-property-repeat-one-press-17451.py > /tmp/r1.py
          git show origin/repair/property-one-click-17441:tests/apply-elder-current-target-prefetch-17452.py > /tmp/r2.py
          python3 /tmp/r1.py
          python3 /tmp/r2.py
      - run: |
          git config user.name "Earthline CI"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html earthline-launch-16872.js
          git commit -m "candidate: repeat one-press Property + Elder prefetch 17454"
          git push origin HEAD:candidate/earthline-launch-17454
