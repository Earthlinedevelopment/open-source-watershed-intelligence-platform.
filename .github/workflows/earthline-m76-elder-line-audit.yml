name: Earthline M76 Elder Line Audit
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-elder-line-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra76-audit-restart
          fetch-depth: 0
      - name: Extract live elder implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin pages-live
          git show origin/pages-live:index.html > /tmp/live.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/live.html').read_text(encoding='utf-8')
          out=[]
          for m in re.finditer('elder',s,re.I):
              i=m.start()
              a=s.rfind('<script',0,i)
              b=s.find('</script>',i)
              head=s[a:s.find('>',a)+1] if a>=0 else ''
              ctx=s[max(a,i-1200):min(b if b>=0 else len(s),i+2200)]
              out.append('SCRIPT '+head)
              out.append(ctx)
          Path('M76-ELDER-LINES.txt').write_text('\n===== HIT =====\n'.join(out),encoding='utf-8')
          PY
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add M76-ELDER-LINES.txt
          git commit -m "audit: extract live elder implementation" || true
          git push origin HEAD:recovery/mantra76-audit-restart
