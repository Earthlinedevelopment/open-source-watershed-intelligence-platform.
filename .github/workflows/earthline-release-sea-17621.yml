name: Earthline Release Southeast Asia Regional 17621
on:
  push:
    branches: [candidate-release-17601]
    paths:
      - '.github/earthline-sea-17621-trigger.txt'
permissions:
  contents: read
jobs:
  regional:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-release-17601
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/release-sea-17621.mjs
