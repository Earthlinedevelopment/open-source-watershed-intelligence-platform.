name: Mantra 83 Refinement Block Audit
on:
  push:
    branches: [mantra83-shadow-live]
    paths:
      - '.github/workflows/refinement-block-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - run: |
          nl -ba index.html | sed -n '31960,32410p' | grep -E "EARTHLINE|refin|loadDEM|makeSwales|selected|unresolved|coverage|await |for\(const|for \(const|Promise|swales="
