name: Earthline Jurisdiction Point Owner Extract 17292
on:
  push:
    branches: [repair/browser-performance-live-17268]
    paths:
      - 'tests/extract-jurisdiction-point-owner-17292.py'
      - '.github/workflows/earthline-jurisdiction-point-extract-17292.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/browser-performance-live-17268}
      - run: python3 tests/extract-jurisdiction-point-owner-17292.py
      - uses: actions/upload-artifact@v4
        with:
          name: jurisdiction-point-owner-17292
          path: jurisdiction-point-owner-17292.txt
          if-no-files-found: error
