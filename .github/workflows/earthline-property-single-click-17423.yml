name: Earthline Property Single-Click Repair Gate 17423
on:
  push:
    branches: [validation/property-post-browser-17421]
    paths:
      - 'tests/apply-property-single-click-owner-17423.py'
      - '.github/workflows/earthline-property-single-click-17423.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {ref: validation/property-post-browser-17421}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          python3 tests/apply-property-single-click-owner-17423.py
          python3 tests/apply-elder-property-click-order-17425.py
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: env EARTHLINE_URL='http://127.0.0.1:8787/' node tests/property-one-click-17421.mjs
