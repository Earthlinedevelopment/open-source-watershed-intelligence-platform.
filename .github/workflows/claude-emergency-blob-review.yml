name: Emergency Claude exact blob comparison — staging branch only
on:
  push:
    branches: ['recovery/emergency-claude-blob-review']
    paths: ['.github/workflows/claude-emergency-blob-review.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce exact emergency ZIP contents and verify Git blob, never deploy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html')
          s=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(s)).encode()+b'\0'+s).hexdigest()=='0f88f8abb3446db1d3ba5f32cb44f05dec8bb0a2','Live baseline drifted'
          a=s.decode('utf-8')
          import base64
          oldblock=base64.b64decode('').decode()
          newblock=base64.b64decode('').decode()
          assert a.count(oldblock)==1
          a=a.replace(oldblock,newblock)
          oldnotice='earthlineNotice("Road and water check unavailable, try again. Property swales were not published.");'
          newnotice='earthlineNotice("Property analysis stopped safely. No fallback swales were substituted.");'
          assert a.count(oldnotice)==1
          a=a.replace(oldnotice,newnotice)
          b=a.encode('utf-8')
          expected='c1068459e0c2b2a29b006c3758774e7df5a58828'
          actual=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          print('EMERGENCY_BLOB_ACTUAL',actual,'EXPECTED',expected)
          assert actual==expected,'The candidate must be byte-identical to attached emergency ZIP'
          p.write_bytes(b)
          PY
          git diff --check
      - name: Commit to review branch, not pages-live
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "review only: Claude emergency fail-open screening candidate"
          git push origin HEAD:recovery/emergency-claude-blob-review
