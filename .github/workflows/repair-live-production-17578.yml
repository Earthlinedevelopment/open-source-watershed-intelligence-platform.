name: Earthline Live Production Repair 17578

on:
  push:
    branches: [repair/live-production-17578]
    paths:
      - '.github/workflows/repair-live-production-17578.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/live-production-17578
          fetch-depth: 0

      - name: Apply two production presentation repairs
        run: python tools/repair_live_17578.py

      - name: Commit repair branch
        run: |
          git config user.name "Earthline Production Repair"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "fix: remove unapproved status card and persist committed Property water 17578"
          git push origin HEAD:repair/live-production-17578
