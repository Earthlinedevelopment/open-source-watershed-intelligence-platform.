name: Mantra 81 Final Sequential Certification
# Acceptance run: corrected Regional visibility and Property speed gates
on:
  push:
    branches: [mantra81-final-cert]
    paths:
      - .github/workflows/mantra81-final-cert.yml
permissions:
  contents: read
concurrency:
  group: mantra81-final-cert
  cancel-in-progress: true

jobs:
  regional50:
    name: Seven sequential · 50-state Regional
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { ref: mantra81-final-cert }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          for r in 1 2 3 4 5 6 7; do
            echo "MANTRA81 ROUND $r / 7 — 50-state Regional"
            node tests/final-launch-smoke-17001.mjs
          done

  difficult_property:
    name: Seven sequential · difficult-state Property
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { ref: mantra81-final-cert }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - env:
          EARTHLINE_URL: https://earthlinedevelopment.org/
          STATES: Vermont|New York|Massachusetts|Maryland|Colorado|Texas|Florida|Louisiana|California|Oklahoma|Iowa|Arkansas|Nebraska|Nevada|Alabama
        run: |
          for r in 1 2 3 4 5 6 7; do
            echo "MANTRA81 ROUND $r / 7 — difficult-state Property"
            OUT="mantra81-property-$r.json" node tests/validate-property-50states-final.mjs
          done

  arizona_exact:
    name: Seven sequential · Arizona exact Property
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: mantra81-final-cert }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          for r in 1 2 3 4 5 6 7; do
            echo "MANTRA81 ROUND $r / 7 — Arizona exact Property"
            node tests/mantra81-arizona-public.mjs
          done

  mobile_arizona:
    name: Seven sequential · Arizona mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: mantra81-final-cert }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          for r in 1 2 3 4 5 6 7; do
            echo "MANTRA81 ROUND $r / 7 — Arizona mobile"
            node tests/arizona-mobile-performance.mjs
          done

  elder_actual:
    name: Seven sequential · Elder actual Property flow
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: mantra81-final-cert }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          for r in 1 2 3 4 5 6 7; do
            echo "MANTRA81 ROUND $r / 7 — Elder actual Property flow"
            node tests/mantra81-elder-public.mjs
          done
