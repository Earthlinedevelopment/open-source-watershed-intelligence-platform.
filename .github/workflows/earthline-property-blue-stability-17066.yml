name: Earthline Property Blue Stability 17066

on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-property-blue-stability-17066.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0

      - name: Move blue emphasis to stable Property-only owner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          fallback_old="mp.setPaintProperty(id,'line-opacity',id==='earthline-property-safe-water-16221'?.82:0)"
          fallback_new="mp.setPaintProperty(id,'line-opacity',0)"

          ditch_old="paint:{'line-color':'#008cff','line-width':['interpolate',['linear'],['zoom'],14,3.4,17,5.4,20,7.2],'line-opacity':['interpolate',['linear'],['zoom'],14,.50,16,.46,18,.35,20,.28]}}"
          ditch_new="paint:{'line-color':'#008cff','line-width':['interpolate',['linear'],['zoom'],14,3.4,17,5.4,20,7.2],'line-opacity':.82}}"

          zoom=".el49-detail-shell{width:min(680px,96vw);max-height:calc(100vh - 36px);overflow:auto;"

          if s.count(fallback_old) != 1:
              raise SystemExit(f"Expected one blinking fallback-water anchor; found {s.count(fallback_old)}")
          if s.count(ditch_old) != 1:
              raise SystemExit(f"Expected one stable Property ditch anchor; found {s.count(ditch_old)}")
          if zoom not in s:
              raise SystemExit("Verified Zoom repair missing; refusing patch")
          if "earthline-presentation-lock-17139" in s:
              raise SystemExit("Regional override present; refusing patch")

          s=s.replace(fallback_old,fallback_new,1)
          s=s.replace(ditch_old,ditch_new,1)
          p.write_text(s,encoding="utf-8")
          PY

          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          assert "id==='earthline-property-safe-water-16221'?.82:0" not in s
          assert "paint:{'line-color':'#008cff','line-width':['interpolate',['linear'],['zoom'],14,3.4,17,5.4,20,7.2],'line-opacity':.82}}" in s
          assert ".el49-detail-shell{width:min(680px,96vw);max-height:calc(100vh - 36px);overflow:auto;" in s
          assert "earthline-presentation-lock-17139" not in s
          print("Property blue stability contract PASS")
          PY

      - name: Commit exact repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/earthline-property-blue-stability-17066.yml
          git config user.name "earthline-release-bot"
          git config user.email "earthline-release-bot@users.noreply.github.com"
          git add index.html .github/workflows/earthline-property-blue-stability-17066.yml
          git diff --cached --name-only
          git commit -m "ui: stabilize Property blue on persistent ditch layer"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
