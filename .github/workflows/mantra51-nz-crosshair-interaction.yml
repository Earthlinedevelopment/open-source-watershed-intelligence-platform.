name: Mantra 51 NZ Crosshair Interaction Gate
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - 'index.html'
      - 'lab/mantra51-nz-crosshair-interaction.mjs'
      - '.github/workflows/mantra51-nz-crosshair-interaction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nz_crosshair_interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mantra51-global-repair-campaign
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start candidate server
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/m51-nz-interaction.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/m51-nz-interaction.log
          exit 1
      - name: Require real NZ crosshair movement
        env:
          EARTHLINE_PROD: https://earthlinedevelopment.org/
          EARTHLINE_CANDIDATE: http://127.0.0.1:8787/
        run: node lab/mantra51-nz-crosshair-interaction.mjs
