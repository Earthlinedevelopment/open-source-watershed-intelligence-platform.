name: Mantra 52 actual report renderer 16960

on:
  push:
    branches:
      - pages-live
    paths:
      - .github/workflows/mantra52-report-owner-16960.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 1

      - name: Replace actual report renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          a=s.find("function mapSvg(d,small=false)")
          b=s.find("function gradeSummary",a)
          if a < 0 or b < 0:
              raise SystemExit("mapSvg owner not found")

          new_map=r'''function mapSvg(d,small=false){
              const b=reportBounds(d),W=920,H=small?410:540,pad=40,top=58,bottom=48;
              const xSpan=Math.max(.000001,b[2]-b[0]),ySpan=Math.max(.000001,b[3]-b[1]);
              const sx=x=>pad+(x-b[0])/xSpan*(W-pad*2);
              const sy=y=>H-bottom-(y-b[1])/ySpan*(H-top-bottom);
              const inside=p=>p&&p[0]>=b[0]&&p[0]<=b[2]&&p[1]>=b[1]&&p[1]<=b[3];
              const pathCoords=coords=>(coords||[]).map((p,i)=>(i?'L':'M')+sx(+p[0]).toFixed(1)+' '+sy(+p[1]).toFixed(1)).join(' ');
              const path=f=>pathCoords(f?.geometry?.coordinates||[]);
              const contourElevationM=f=>{const p=f&&f.properties||{};for(const k of ['ele','elevation','elevation_m','elev_m','level','levelM','contour','contour_m','z']){const v=Number(p[k]);if(Number.isFinite(v))return v}return null};
              const contourLabelPoint=f=>{const c=f&&f.geometry&&f.geometry.type==='LineString'?f.geometry.coordinates:null;if(!Array.isArray(c)||c.length<2)return null;const q=c[Math.floor((c.length-1)*.56)];return Array.isArray(q)&&Number.isFinite(+q[0])&&Number.isFinite(+q[1])?q:null};
          
              const reportContours=contours().filter(f=>f?.geometry?.type==='LineString').slice(0,210);
              const reportFlows=flows().filter(f=>f?.geometry?.type==='LineString').slice(0,240);
              const rows=graded();
              const aquiferFeatures=reportAquifers();
          
              const reportPlace=String(d?.query||d?.location||d?.placeName||'Analysis Area').trim();
              const reportTier=String(d?.tier||d?.mode||'regional').toLowerCase();
              const title='Earthline · '+reportPlace+' · Hydrology + Recharge Plan';
          
              const lonSpan=Math.max(.0001,b[2]-b[0]),midLat=(b[1]+b[3])/2,kmWide=lonSpan*111.32*Math.cos(midLat*Math.PI/180);
              const niceKm=kmWide>300?100:kmWide>120?50:kmWide>50?20:kmWide>20?10:kmWide>8?5:kmWide>3?2:1;
              const barPx=Math.max(54,Math.min(170,niceKm/kmWide*(W-pad*2)));
          
              const clipId='elReportClip16960',aqPat='elAquifer16960';
              const parts=[];
              parts.push('<svg class="el-report-hero-map-16960" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(title)+'">');
              parts.push('<defs>'+
                '<linearGradient id="elPaper16960" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf6"/><stop offset=".55" stop-color="#f1f3ea"/><stop offset="1" stop-color="#e8eee5"/></linearGradient>'+
                '<pattern id="'+aqPat+'" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><rect width="10" height="10" fill="#e89a4b" fill-opacity=".19"/><path d="M0 0 V10" stroke="#c96d20" stroke-width=".75" stroke-opacity=".26"/></pattern>'+
                '<clipPath id="'+clipId+'"><rect x="'+pad+'" y="'+top+'" width="'+(W-pad*2)+'" height="'+(H-top-bottom)+'" rx="2"/></clipPath>'+
                '<marker id="elWaterArrow16960" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L5 2.5 L0 5 Z" fill="#1a79a8" opacity=".72"/></marker>'+
                '</defs>');
          
              parts.push('<rect width="'+W+'" height="'+H+'" fill="#fbfaf6"/>');
              parts.push('<rect x="18" y="18" width="'+(W-36)+'" height="'+(H-36)+'" fill="url(#elPaper16960)" stroke="#c1c7c0" stroke-width=".8"/>');
              parts.push('<text x="'+pad+'" y="30" fill="#29443d" font-family="Noto Sans,Arial,sans-serif" font-size="14" font-weight="800">'+esc(title)+'</text>');
              parts.push('<text x="'+pad+'" y="44" fill="#7a847e" font-family="Noto Sans,Arial,sans-serif" font-size="7.2" font-weight="700" letter-spacing="1.05">LANDSCAPE HYDROLOGY · RECHARGE OPPORTUNITY · '+esc(reportTier.toUpperCase())+'</text>');
          
              parts.push('<g clip-path="url(#'+clipId+')">');
          
              for(let i=0;i<reportContours.length;i+=6){
                const dpath=path(reportContours[i]);if(!dpath)continue;
                parts.push('<path d="'+dpath+'" transform="translate(2 2)" fill="none" stroke="#657266" stroke-width="7" opacity=".055" stroke-linecap="round"/>');
                parts.push('<path d="'+dpath+'" transform="translate(-1 -1)" fill="none" stroke="#ffffff" stroke-width="4" opacity=".34" stroke-linecap="round"/>');
              }
          
              for(const f of aquiferFeatures){
                const g=f&&f.geometry;if(!g)continue;
                const polys=g.type==='Polygon'?[g.coordinates]:(g.type==='MultiPolygon'?g.coordinates:[]);
                for(const poly of polys){
                  if(!Array.isArray(poly)||!poly.length)continue;
                  const rings=poly.filter(r=>Array.isArray(r)&&r.length>=3);
                  if(!rings.length)continue;
                  const dpath=rings.map(r=>pathCoords(r)+' Z').join(' ');
                  parts.push('<path d="'+dpath+'" fill="url(#'+aqPat+')" fill-rule="evenodd" stroke="#c96d20" stroke-width="1.15" opacity=".98" vector-effect="non-scaling-stroke"/>');
                }
              }
          
              for(let i=0;i<reportContours.length;i++){
                const dpath=path(reportContours[i]);if(!dpath)continue;
                const major=i%6===0;
                parts.push('<path d="'+dpath+'" fill="none" stroke="'+(major?'#7e857f':'#a7aaa5')+'" stroke-width="'+(major?'.56':'.28')+'" opacity="'+(major?'.34':'.17')+'" vector-effect="non-scaling-stroke"/>');
              }
          
              const drawSwale=r=>{
                const dpath=path(r.f);if(!dpath)return;
                const cfg=r.grade==='A'
                  ?{zone:'#bfd2b8',zoneW:7.4,zoneO:.30,line:'#315c3d',lineW:1.95,lineO:.97}
                  :r.grade==='B'
                    ?{zone:'#d5ddc0',zoneW:5.6,zoneO:.20,line:'#70815e',lineW:1.35,lineO:.72}
                    :{zone:'#e7dfcf',zoneW:4.2,zoneO:.12,line:'#9b8e73',lineW:.92,lineO:.40};
                parts.push('<path d="'+dpath+'" fill="none" stroke="'+cfg.zone+'" stroke-width="'+cfg.zoneW+'" opacity="'+cfg.zoneO+'" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
                parts.push('<path d="'+dpath+'" fill="none" stroke="'+cfg.line+'" stroke-width="'+cfg.lineW+'" opacity="'+cfg.lineO+'" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
              };
              for(const r of rows.filter(r=>r.grade==='C'))drawSwale(r);
              for(const r of rows.filter(r=>r.grade==='B'))drawSwale(r);
              for(const r of rows.filter(r=>r.grade==='A'))drawSwale(r);
          
              for(let i=0;i<reportFlows.length;i++){
                const dpath=path(reportFlows[i]);if(!dpath)continue;
                parts.push('<path d="'+dpath+'" fill="none" stroke="#fbfaf6" stroke-width="3.6" opacity=".88" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
                parts.push('<path d="'+dpath+'" fill="none" stroke="#1a79a8" stroke-width="1.55" opacity=".96" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"'+(i%5===0?' marker-end="url(#elWaterArrow16960)"':'')+'/>');
              }
          
              parts.push('</g>');
          
              let labelCount=0;
              for(let i=0;i<reportContours.length&&labelCount<(small?6:10);i+=6){
                const f=reportContours[i],elev=contourElevationM(f),pt=contourLabelPoint(f);
                if(!Number.isFinite(elev)||!pt||!inside(pt))continue;
                const x=sx(+pt[0]),y=sy(+pt[1]);
                parts.push('<g><rect x="'+(x-14).toFixed(1)+'" y="'+(y-7).toFixed(1)+'" width="28" height="11" rx="2" fill="#fbfaf6" fill-opacity=".84"/><text x="'+x.toFixed(1)+'" y="'+(y+1.5).toFixed(1)+'" text-anchor="middle" fill="#68716b" font-family="Noto Sans,Arial,sans-serif" font-size="7" font-weight="650">'+Math.round(elev)+' m</text></g>');
                labelCount++;
              }
          
              const keyX=W-258,keyY=H-104;
              parts.push('<g transform="translate('+keyX+','+keyY+')"><rect width="222" height="62" rx="2.5" fill="#fffefb" fill-opacity=".96" stroke="#bdc2bc" stroke-width=".6"/>'+
                '<rect x="10" y="11" width="19" height="8" rx="1" fill="url(#'+aqPat+')" stroke="#c96d20" stroke-width=".7"/><text x="37" y="18" fill="#56645e" font-family="Noto Sans,Arial,sans-serif" font-size="6.9">Aquifer</text>'+
                '<path d="M10 35 H29" stroke="#1a79a8" stroke-width="1.55"/><text x="37" y="38" fill="#56645e" font-family="Noto Sans,Arial,sans-serif" font-size="6.9">Water path</text>'+
                '<path d="M118 15 H140" stroke="#bfd2b8" stroke-width="7" opacity=".4" stroke-linecap="round"/><path d="M118 15 H140" stroke="#315c3d" stroke-width="1.9" stroke-linecap="round"/><text x="148" y="18" fill="#56645e" font-family="Noto Sans,Arial,sans-serif" font-size="6.9">Priority swale</text>'+
                '<path d="M118 35 H140" stroke="#858a85" stroke-width=".55"/><text x="148" y="38" fill="#56645e" font-family="Noto Sans,Arial,sans-serif" font-size="6.9">Contour</text>'+
                '<text x="10" y="53" fill="#858b86" font-family="Noto Sans,Arial,sans-serif" font-size="5.8">Screening plan · field verification required</text></g>');
          
              parts.push('<g transform="translate('+(W-54)+',30)"><text x="8" y="0" text-anchor="middle" fill="#42554f" font-family="Noto Sans,Arial,sans-serif" font-size="8" font-weight="800">N</text><path d="M8 5 V31" stroke="#42554f" stroke-width="1"/><path d="M8 5 L3 16 L8 13 L13 16 Z" fill="#42554f"/></g>');
          
              const scaleY=H-31;
              parts.push('<g transform="translate('+pad+','+scaleY+')"><path d="M0 0 H'+barPx+'" stroke="#42554f" stroke-width="1.6"/><path d="M0 -4 V4 M'+barPx+' -4 V4" stroke="#42554f" stroke-width="1"/><text x="'+(barPx/2)+'" y="13" text-anchor="middle" fill="#56645e" font-family="Noto Sans,Arial,sans-serif" font-size="7">'+niceKm+' km</text></g>');
          
              parts.push('</svg>');
              return parts.join('');
            }
          '''

          s=s[:a]+new_map+s[b:]

          s=s.replace(
            "Broad green, olive, and earth-toned bands are graded bioswale-opportunity corridors; blue lines show modeled surface-water movement; translucent blue fields show mapped aquifer context; contours and elevation labels describe landform.",
            "Fine green, olive, and earth-toned lines show graded bioswale-opportunity corridors; blue lines show modeled surface-water movement; translucent orange fields show mapped aquifer context; contours and elevation labels describe landform."
          )

          old_toolbar='<div class="el49-toolbar-actions"><button class="el49-tool primary" data-action="print">Print / Save PDF</button><button class="el49-tool" data-action="newtab">Open in New Tab</button><button class="el49-tool" data-action="download">Download HTML</button><button class="el49-tool el49-close" data-action="close" aria-label="Return to map">×</button></div>'
          new_toolbar='<div class="el49-toolbar-actions"><button class="el49-tool el49-close" data-action="close" aria-label="Return to map">×</button></div>'
          if old_toolbar not in s:
              raise SystemExit("toolbar owner not found")
          s=s.replace(old_toolbar,new_toolbar,1)

          old_actions="""panel.querySelector('[data-action="print"]').onclick=()=>{recordReportAction16388('print',data,{});window.print()};panel.querySelector('[data-action="newtab"]').onclick=()=>openInstitutionalReportTab16164(data,html);panel.querySelector('[data-action="download"]').onclick=()=>downloadInstitutionalReport16164(data,html);panel.classList.add('open')"""
          if old_actions not in s:
              raise SystemExit("toolbar handlers not found")
          s=s.replace(old_actions,"panel.classList.add('open')",1)

          s=s.replace('earthline-launch-16872.js?v=16872','earthline-launch-16872.js?v=16960',1)

          p.write_text(s,encoding="utf-8")

          j=Path("earthline-launch-16872.js")
          x=j.read_text(encoding="utf-8")
          rs=x.find("/* EARTHLINE_REPORT_VISUAL_REPAIR_")
          oe=x.rfind("\n})();")
          if rs >= 0 and oe > rs:
              x=x[:rs]+"/* EARTHLINE REPORT RENDER OWNER 16960: index.html mapSvg */\nwindow.EARTHLINE_REPORT_RENDER_OWNER_16960='index-mapSvg';\n"+x[oe:]
          j.write_text(x,encoding="utf-8")
          PY

      - name: Verify actual report owner
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          j=Path("earthline-launch-16872.js").read_text(encoding="utf-8")
          checks={
            "new renderer":'el-report-hero-map-16960' in s,
            "orange aquifer":'elAquifer16960' in s and '#c96d20' in s,
            "toolbar buttons removed":'Print / Save PDF</button><button class="el49-tool" data-action="newtab"' not in s,
            "cache bust":'earthline-launch-16872.js?v=16960' in s,
            "single map owner":'EARTHLINE_REPORT_VISUAL_REPAIR_' not in j,
            "owner marker":"EARTHLINE_REPORT_RENDER_OWNER_16960='index-mapSvg'" in j,
          }
          for k,v in checks.items():print(("PASS" if v else "FAIL"),k)
          if not all(checks.values()):raise SystemExit(1)
          PY

      - name: Commit actual report repair
        run: |
          git config user.name "Earthline Mantra 52"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html earthline-launch-16872.js
          git commit -m "fix: rebuild actual report renderer and remove toolbar"
          git push origin pages-live
