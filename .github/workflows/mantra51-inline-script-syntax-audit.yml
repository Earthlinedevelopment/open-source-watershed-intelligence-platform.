name: Mantra 51 Inline Script Syntax Audit
on:
  push:
    branches: [mantra51-global-repair-campaign]
    paths:
      - '.github/workflows/mantra51-inline-script-syntax-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.in_script=False; self.buf=[]; self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='script':
                      self.in_script=True; self.buf=[]
              def handle_endtag(self,tag):
                  if tag.lower()=='script' and self.in_script:
                      self.scripts.append(''.join(self.buf)); self.in_script=False
              def handle_data(self,data):
                  if self.in_script:self.buf.append(data)
          s=Path('index.html').read_text(errors='ignore')
          p=P();p.feed(s)
          out=Path('/tmp/el-scripts');out.mkdir(exist_ok=True)
          for i,sc in enumerate(p.scripts):
              (out/f'{i:03}.js').write_text(sc)
          print('scripts',len(p.scripts))
          PY
          failed=0
          for f in /tmp/el-scripts/*.js; do
            if ! node --check "$f" >/tmp/check.out 2>/tmp/check.err; then
              echo "FAIL $f"
              cat /tmp/check.err
              failed=1
            fi
          done
          exit $failed
