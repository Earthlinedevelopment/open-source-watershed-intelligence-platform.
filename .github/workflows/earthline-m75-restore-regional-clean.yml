name: Earthline M75 Restore Regional Clean Gate
on:
  push:
    branches:
      - recovery/mantra75-current-clean
    paths:
      - .github/workflows/earthline-m75-restore-regional-clean.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-current-clean
          fetch-depth: 0
      - run: python3 tools/restore-regional-clean-17434.py
      - run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          if(!s.includes("return currentZoom>=publishedZoom+0.85"))throw Error("17434 zoom gate missing");
          console.log("EARTHLINE_17434_PARSE_OK",parsed);
          NODE
      - run: |
          git config user.name "Earthlinedevelopment"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "fix: restore clean Regional geometry handoff"
          git push origin HEAD:recovery/mantra75-current-clean
