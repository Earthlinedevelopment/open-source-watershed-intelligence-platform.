name: Earthline 16781 Deploy Cluster-Aware Fine Refinement
on:
  push:
    branches: [main]
    paths: ['lab/TRIGGER-16781-DEPLOY.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Fetch patch
        run: |
          git fetch origin main
          git show origin/main:lab/apply-16781-cluster-aware-fine-refinement.py > /tmp/apply-16781.py
      - name: Apply
        run: |
          python3 /tmp/apply-16781.py
          grep -q "EARTHLINE 16781" index.html
          git diff --check
      - name: Publish pages-live candidate
        run: |
          git config user.name "Earthline CI"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "repair: target broad empty Regional fine-cell clusters"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
