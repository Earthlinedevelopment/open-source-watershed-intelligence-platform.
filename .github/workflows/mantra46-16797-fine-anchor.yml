name: Mantra 46 16797 Fine Contour Anchor

on:
  push:
    branches:
      - diagnostic-m46-16797-fine-anchor
    paths:
      - 'tests/mantra46-16797-fine-anchor.mjs'
      - '.github/workflows/mantra46-16797-fine-anchor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Evaluate 16797 fine contour anchors
        run: node tests/mantra46-16797-fine-anchor.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantra46-16797-fine-anchor
          path: artifacts/mantra46-16797-fine-anchor/
          if-no-files-found: error
