name: Earthline Restore Accepted 16584 Prescriber
on:
  push:
    branches: [pages-live]
    paths:
      - '.github/workflows/earthline-restore-accepted-prescriber.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
          fetch-depth: 0
      - name: Replace complete live Property prescriber with accepted 16584 prescriber
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          ACCEPTED="74343a24f90fed7d7abbe9267ef11a2836220de7"
          p=Path("index.html")
          live=p.read_text(encoding="utf-8")
          accepted=subprocess.check_output(["git","show",f"{ACCEPTED}:index.html"],text=True)

          def extract_function(src,name):
              starts=[f"async function {name}",f"function {name}"]
              start=-1
              for st in starts:
                  start=src.find(st)
                  if start>=0: break
              if start<0: raise SystemExit("missing "+name)
              brace=src.find("{",start)
              depth=0; quote=None; esc=False; line=False; block=False
              i=brace
              while i<len(src):
                  c=src[i]; n=src[i+1] if i+1<len(src) else ""
                  if line:
                      if c=="\n": line=False
                  elif block:
                      if c=="*" and n=="/": block=False; i+=1
                  elif quote:
                      if esc: esc=False
                      elif c=="\\": esc=True
                      elif c==quote: quote=None
                  else:
                      if c=="/" and n=="/": line=True; i+=1
                      elif c=="/" and n=="*": block=True; i+=1
                      elif c in ("'",'"'): quote=c
                      elif c=="{": depth+=1
                      elif c=="}":
                          depth-=1
                          if depth==0: return start,i+1,src[start:i+1]
                  i+=1
              raise SystemExit("unterminated "+name)

          ls,le,_=extract_function(live,"prescribeSwales15778")
          _,_,accepted_fn=extract_function(accepted,"prescribeSwales15778")

          marker="/* EARTHLINE M78.50 — complete accepted Build 16584 Property swale prescriber restored */\n"
          replacement=marker+accepted_fn
          live=live[:ls]+replacement+live[le:]

          # Required proof: later fragmenting science restrictions are absent from the prescriber.
          ps,pe,pfn=extract_function(live,"prescribeSwales15778")
          forbidden=[
            "earthlineLocalContourReachM76",
            "earthlineLocalSeedReachM76",
            "earthlineCrossSlopeLocalGuardM76",
            "zero-runoff secondary Property swales are not publishable",
            "Property secondary-fill corridors must intercept modeled runoff",
            "EARTHLINE M78.11 — one canonical owner per minor-flow cell"
          ]
          for token in forbidden:
              if token in pfn:
                  raise SystemExit("forbidden later science remains in prescriber: "+token)

          # Accepted function fingerprint must match exactly after stripping restoration marker.
          _,_,check_fn=extract_function(live,"prescribeSwales15778")
          if check_fn != accepted_fn:
              raise SystemExit("restored prescriber does not byte-match accepted 16584")

          p.write_text(live,encoding="utf-8")
          print("Restored complete accepted 16584 prescribeSwales15778")
          PY
          git diff --check
          grep -q "complete accepted Build 16584 Property swale prescriber restored" index.html
      - name: Commit accepted prescriber restoration
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "Earthline Science Repair"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "science: restore complete accepted 16584 Property prescriber"
          git pull --rebase origin pages-live
          git push origin HEAD:pages-live
