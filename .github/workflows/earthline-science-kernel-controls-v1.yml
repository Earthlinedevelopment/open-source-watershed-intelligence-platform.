name: Earthline Science Kernel v1 Terrain Controls

on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/science-kernel-controls-v1.mjs'
      - '.github/workflows/earthline-science-kernel-controls-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terrain-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save playwright@1.55.0
      - name: Verify Poudre and Vermont Science Kernel controls
        run: node tests/science-kernel-controls-v1.mjs
      - name: Upload terrain-control screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: science-kernel-v1-terrain-controls
          path: |
            /tmp/science-kernel-poudre-1.png
            /tmp/science-kernel-poudre-2.png
            /tmp/science-kernel-vermont-1.png
            /tmp/science-kernel-vermont-2.png
          if-no-files-found: warn
