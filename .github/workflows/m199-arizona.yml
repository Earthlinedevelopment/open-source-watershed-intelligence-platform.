name: M199 public Ernst Creek Property safety smoke
on:
  push:
    branches: ['repair/m199-complete-empty-osm-arizona']
    paths: ['.github/workflows/m199-arizona.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Only treat complete OSM 200 valid empty map as screened-clear
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          before="    if(earthlineIsStale(myGen))return false;"
          after="""    if(xml.documentElement?.localName!=='osm')throw new Error('OSM wrong XML root');
              const bounds=xml.getElementsByTagName('bounds');
              if(bounds.length!==1)throw new Error('OSM missing authoritative BBOX');
              const b=bounds[0],num=k=>Number(b.getAttribute(k));
              const eps=0.00001;
              if(!['minlon','minlat','maxlon','maxlat'].every(k=>b.hasAttribute(k)&&Number.isFinite(num(k)))||
                 num('minlon')>west+eps||num('minlat')>south+eps||
                 num('maxlon')<east-eps||num('maxlat')<north-eps)
                throw new Error('OSM response BBOX incomplete');
              if(earthlineIsStale(myGen))return false;"""
          start=s.index('async function earthlineFetchOverpass15862P(')
          end=s.index('function earthlineTilequerySamples15862P(',start)
          chunk=s[start:end]
          assert chunk.count(before)==1
          chunk=chunk.replace(before,after)
          anchor='    result.overpass.rawElementCount=ways.size+xml.getElementsByTagName(\'relation\').length;'
          assert chunk.count(anchor)==1
          chunk=chunk.replace(anchor,anchor+"\n    result.overpass.sourceComplete=true;")
          s=s[:start]+chunk+s[end:]
          old='''    if(openDataResponded){
                /* M175: an empty non-authoritative map-source response cannot certify road,'''
          new='''    if(openDataResponded&&op.provider==='openstreetmap-api-0.6-map'&&op.sourceComplete===true&&
                 Number(op.httpStatus)===200&&!op.error&&openGeometryCount16516===0){
                c.sourceTier="open-data";c.acquisitionResult="screened-clear";
                c.publicationAllowed=true;c.exclusionVerified=false;
                c.evidenceGrade="NO MAPPED ROADS, BUILDINGS OR WATER FOUND · FIELD VERIFICATION REQUIRED";
                c.openGeometryCount16516=0;
                c.openDataSources16539={overpass:{attempted:true,responded:true,failed:false,sourceComplete:true},style:{attempted:styleAttempted,responded:styleResponded,failed:styleFailed}};
                earthlineSetVectorVerification16343(c,"unverified","complete-osm-zero-mapped-exclusions-screening-only");
                return true;
              }
              if(openDataResponded){
                /* M175: an empty non-authoritative map-source response cannot certify road,'''
          assert s.count(old)==1
          s=s.replace(old,new)
          assert "empty-open-data-does-not-establish-road-or-water-clearance" in s
          p.write_text(s)
          print('M199_COMPLETE_EMPTY_SOURCE_ONLY_PATCHED')
          PY
          git diff --check
      - name: Confirm JavaScript syntax unchanged
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re
          s=Path('index.html').read_text()
          assert 'complete-osm-zero-mapped-exclusions-screening-only' in s
          assert 'sourceComplete=true' in s
          assert "c.acquisitionResult=\"failed\";c.publicationAllowed=false" in s
          for i,js in enumerate(re.findall(r'<script\\b[^>]*>(.*?)</script>',s,re.S|re.I)):
            if not js.strip() or js.lstrip().startswith('{'):continue
            f=Path('/tmp/m199-'+str(i)+'.js');f.write_text(js)
            z=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
            if z.returncode:raise RuntimeError(str(i)+': '+z.stderr[:450])
          print('M199_SYNTAX_PASS')
          PY
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify published HTTPS on farmland and mapped creek
        run: |
          mkdir -p artifacts/m199
          cat > m199-test.mjs <<'JS'
          import {chromium} from 'playwright';
          import {existsSync,statSync,readFileSync,writeFileSync} from 'node:fs';
          import path from 'node:path';
          const root=process.cwd(),browser=await chromium.launch({headless:true});
          const sites=[{name:'arizona',lng:-111.93073,lat:34.21572},{name:'ernst-creek',lng:-93.38977,lat:41.95748},{name:'farmland',lng:-93.68,lat:42.13}];
          const results=[];
          for(const site of sites){
            const page=await browser.newPage({viewport:{width:1650,height:920}}),errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.route('https://earthlinedevelopment.org/**',async route=>{
              const u=new URL(route.request().url());
              if(u.pathname==='/'||u.pathname==='/index.html')
                return route.fulfill({status:200,contentType:'text/html;charset=utf-8',body:readFileSync('index.html')});
              return route.continue();
            });
            let result={site,errors};
            try{
              await page.goto('https://earthlinedevelopment.org/?m199='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await page.locator('#searchInput').fill(site.name==='arizona'?'Arizona':'Iowa');
              await page.locator('#runBtn').evaluate(el=>el.click());
              await page.waitForFunction(()=>window.EARTHLINE_CORRIDOR_PUBLICATION_AUDIT_16167?.generated>0||window.EARTHLINE_LAST_LIVE_REGIONAL_ERROR_15970,null,{timeout:60000,polling:250});
              await page.evaluate(site=>{const m=window.earthlineMap||earthlineMap;m.stop();m.jumpTo({center:[site.lng,site.lat],zoom:17.7})},site);
              await page.waitForTimeout(1100);
              await page.locator('#earthlineDeclareProperty16169').evaluate(el=>el.click());
              await page.waitForFunction(()=>window.EARTHLINE_PROPERTY_RUN_AUDIT_16173?.settled===true,null,{timeout:85000,polling:250});
              result=Object.assign(result,await page.evaluate(()=>{
                const c=M?.vectorNoBuildCoverage||{},run=window.EARTHLINE_PROPERTY_RUN_AUDIT_16173||{};
                const safety=M?.safetyAudit15806||{},o=c.infrastructure15862P?.overpass||{};
                return {stage:run.stage,error:run.error,swales:window.EARTHLINE_PROPERTY_PUBLICATION_AUDIT_16220?.safeCount||0,
                  vector:{sourceTier:c.sourceTier,acquisitionResult:c.acquisitionResult,allowed:c.publicationAllowed,processed:c.processedFeatureCount,provider:o.provider,complete:o.sourceComplete,http:o.httpStatus,bytes:o.responseBytes,ways:o.rawElementCount,water:o.waterGeometryCount,roads:o.roadGeometryCount,buildings:o.buildingGeometryCount,exception:o.error,bbox:o.queryBBox},
                  safety:{verified:safety.verified,unsafe:safety.clearance?.unsafeSegments,waterIntersections:safety.clearance?.waterIntersections,roadIntersections:safety.clearance?.roadIntersections},
                  treeCircles:window.EARTHLINE_PROPERTY_TREE_CIRCLES_AUDIT_M189?.treeCircles||0
                };
              }));
              result.block=await page.evaluate(()=>window.EARTHLINE_PROPERTY_PUBLICATION_BLOCK_16176||null);
              await page.screenshot({path:'artifacts/m199/'+site.name+'.png'});
            }catch(e){result.error=String(e)}
            console.log('M199_SITE '+JSON.stringify(result));results.push(result);await page.close();
          }
          writeFileSync('artifacts/m199/results.json',JSON.stringify(results,null,2));
          await browser.close();
          const pass=results.every(r=>!r.error&&!r.errors.length&&r.swales>0&&r.vector?.allowed===true&&r.vector?.acquisitionResult!=='failed'&&r.safety?.verified===true&&r.safety?.unsafe===0&&r.safety?.waterIntersections===0&&(!Number.isFinite(r.safety?.roadIntersections)||r.safety.roadIntersections===0))&&results[1]?.vector?.water>0;
          console.log('M199_BOTH_SITES_SAFE '+pass);
          if(!pass)process.exitCode=1;
          JS
          node m199-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m199-public-site-Iowa-property-screenshots
          path: artifacts/m199/
          retention-days: 14

      - name: Commit source change only after all 3 sites pass
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "fix(property): distinguish complete empty OSM coverage from failed query"
          git push origin HEAD:repair/m199-complete-empty-osm-arizona
