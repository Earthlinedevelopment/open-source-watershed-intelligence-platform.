name: Earthline M76 Natural Renderer Gate Repair
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths: ['.github/workflows/earthline-m76-natural-renderer-gate-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra76-audit-restart
          fetch-depth: 0
      - name: Replace circular visual prerequisite with verified-geometry prerequisite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""const safeAudit17183=window.EARTHLINE_PROPERTY_SAFE_VISIBILITY_AUDIT_16221||null;if(active&&Number(safeAudit17183?.count||0)>0&&safeAudit17183?.visible!==true)return false;/* EARTHLINE_NATURAL_AFTER_SAFE_17183 */"""
          new="""const safeAudit17183=window.EARTHLINE_PROPERTY_SAFE_VISIBILITY_AUDIT_16221||null;if(active&&Number(safeAudit17183?.count||0)>0){const safeFc17183=authoritativeFC(),safeCount17183=Number(safeFc17183?.features?.length||0);if(safeAudit17183?.verified!==true||safeCount17183!==Number(safeAudit17183.count||0))return false;}/* EARTHLINE_M76_NATURAL_FROM_VERIFIED_SAFE_GEOMETRY */"""
          if s.count(old)!=1: raise SystemExit('natural renderer circular gate owner count != 1')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate one-owner safety and syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'EARTHLINE_M76_NATURAL_FROM_VERIFIED_SAFE_GEOMETRY' index.html
          ! grep -q 'safeAudit17183?.visible!==true' index.html
          grep -q "geometrySource:'M.authoritativeSafeSwales15815'" index.html
          grep -q 'propertyPublication15816 + propertyResultLock15815 + safetyAudit15806' index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('EARTHLINE_M76_NATURAL_FROM_VERIFIED_SAFE_GEOMETRY')==1
          assert s.count('async function prescribeSwales15778(')==1
          assert s.count('function earthlineSegmentTortuosityM76(')==1
          PY
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          let parsed=0;
          for(const [i,m] of [...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(!m[1].trim())continue;
            try{new Function(m[1]);parsed++}catch(e){throw Error('inline script '+i+': '+e.message)}
          }
          console.log('M76_NATURAL_GATE_PARSE_OK',parsed);
          NODE
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/earthline-m76-natural-renderer-gate-repair.yml
          git config user.name "Earthline Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/earthline-m76-natural-renderer-gate-repair.yml
          git commit -m "fix: let natural swales render from verified safe geometry"
          git push origin HEAD:recovery/mantra76-audit-restart
