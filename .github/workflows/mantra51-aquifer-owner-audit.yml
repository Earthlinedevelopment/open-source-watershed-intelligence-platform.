name: Mantra 51 Aquifer Owner Audit
on:
  push:
    branches: [mantra51-report-focus]
    paths:
      - '.github/workflows/mantra51-aquifer-owner-audit.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(errors='ignore')
          pats=['addLayer','queryRenderedFeatures','querySourceFeatures','usgsAquifers','AQUIFER EVIDENCE','aquifer-fill','aquifer-outline','aquifer']
          # print high-signal occurrences only around lines with layer/source API plus aquifer
          for m in re.finditer(r'.{0,900}(?:addLayer|addSource|queryRenderedFeatures|querySourceFeatures).{0,900}',s,re.S):
              x=m.group(0)
              if 'aquifer' in x.lower() or 'groundwater' in x.lower():
                  print('---')
                  print(x.replace('\n',' ')[:2400])
          PY
