    branches: [repair/browser-performance-live-17268]
    paths:
      - 'tests/extract-supertile-owner-17355.py'
      - '.github/workflows/earthline-supertile-owner-17355.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/browser-performance-live-17268}
