name: Earthline 16853 browser check

on:
  push:
    branches:
      - candidate-m47-16853-blue-property-ui

jobs:
  browser-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-m47-16853-blue-property-ui
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
      - name: Serve candidate
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/earthline-16853-http.log 2>&1 &
          echo $! > /tmp/earthline-16853-http.pid
      - name: Verify rendered Property UI
        shell: bash
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1600,height:1000}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8787/index.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('#earthlinePropertySection16188 .el-panel-label-16188',{timeout:15000});
            await page.waitForTimeout(1200);
            const result=await page.evaluate(()=>{
              const heading=document.querySelector('#earthlinePropertySection16188 .el-panel-label-16188')?.textContent?.trim()||'';
              const b=document.getElementById('earthlineDeclareProperty16169');
              const s=b?.querySelector('span:last-child');
              const cs=b?getComputedStyle(b):null;
              const before=s?getComputedStyle(s,'::before'):null;
              return {
                heading,
                buttonText:s?.textContent?.trim()||'',
                fontSize:cs?.fontSize||'',
                beforeContent:before?.content||'',
                beforeDisplay:before?.display||'',
                documentLang:document.documentElement.lang||''
              };
            });
            console.log(JSON.stringify({result,errors},null,2));
            if(result.heading!=='Property Modelling') throw new Error('Property heading mismatch: '+result.heading);
            if(result.buttonText!=='20-ACRE SEARCH') throw new Error('Property button mismatch: '+result.buttonText);
            if(parseFloat(result.fontSize)<15) throw new Error('Property button font too small: '+result.fontSize);
            if(!(result.beforeDisplay==='none'||result.beforeContent==='none'||result.beforeContent==='normal')) throw new Error('Property crosshair pseudo still visible: '+JSON.stringify(result));
            await page.screenshot({path:'earthline-16853-ui.png',fullPage:false});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-16853-ui-check
          path: earthline-16853-ui.png
          if-no-files-found: ignore
