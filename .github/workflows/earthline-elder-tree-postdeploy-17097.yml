name: Earthline Elder Tree Postdeploy 17097

on:
  push:
    branches:
      - v1/elder-tree-integration-17097
    paths:
      - 'tests/elder-tree-postdeploy-17097.mjs'
      - '.github/workflows/earthline-elder-tree-postdeploy-17097.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: v1/elder-tree-integration-17097}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/elder-tree-postdeploy-17097.mjs
