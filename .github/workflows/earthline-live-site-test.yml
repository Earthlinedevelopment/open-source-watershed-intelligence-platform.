# Read-only test of the public Earthline site on desktop and phone browsers.
# Does not touch pages-live. Results and screenshots are pushed to the branch "elder-ny-results".
name: Earthline Elder Tree NY root-cause diagnostic
on:
  push:
    branches: [diagnose/elder-ny-missing-20261120]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop-chrome, desktop-safari]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browsers
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox webkit
      - name: Test the live site
        env:
          EARTHLINE_PROFILE: ${{ matrix.profile }}
        run: node tests/earthline-live-site-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elder-ny-${{ matrix.profile }}
          path: elder-ny-results/
          retention-days: 14
  publish:
    name: Publish results
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: collected
          merge-multiple: true
      - name: Push results to the elder-ny-results branch
        run: |
          cd collected
          git init -q -b elder-ny-results
          git config user.name "earthline-live-test"
          git config user.email "elder-ny@users.noreply.github.com"
          date -u > TESTED-AT.txt
          git add -A
          git commit -q -m "Live site test results ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" elder-ny-results
