name: Earthline Mantra 37 NY Profile

on:
  push:
    branches: [pages-live]
    paths:
      - 'lab/mantra37-regional-phase-timing.mjs'
      - '.github/workflows/earthline-mantra37-ny-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact live 16640 repair
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            html="$(curl -fsSL -A 'Earthline-mantra37/16640' "https://earthlinedevelopment.org/?m37_16640=${GITHUB_SHA}-${i}" || true)"
            if grep -Fq 'EARTHLINE 16640 — REGIONAL HANDOFF RETIRES PROPERTY PRESENTATION TAIL' <<<"$html"; then
              echo "LIVE_16640_READY attempt=$i"
              exit 0
            fi
            sleep 5
          done
          echo '16640 was not served by the production root.' >&2
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Measure exact New York Regional phases
        run: node lab/mantra37-regional-phase-timing.mjs

# 16640 live cross-tier proof gate
