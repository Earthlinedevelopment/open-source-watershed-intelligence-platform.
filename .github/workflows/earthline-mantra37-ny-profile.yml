name: Earthline Mantra 37 NY Profile

on:
  push:
    branches: [pages-live]
    paths:
      - 'lab/mantra37-ny-regional-profile.mjs'
      - '.github/workflows/earthline-mantra37-ny-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Profile fresh and transition New York Regional
        run: node lab/mantra37-ny-regional-profile.mjs
      - name: Upload profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mantra37-ny-regional-profile
          path: lab-results/mantra37-ny-regional-profile.json
          retention-days: 1

