name: Earthline Mantra 37 NY Profile

on:
  push:
    branches: [pages-live]
    paths:
      - 'lab/mantra37-regional-phase-timing.mjs'
      - '.github/workflows/earthline-mantra37-ny-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Measure exact New York Regional phases
        run: node lab/mantra37-regional-phase-timing.mjs

# phase-timing trigger after manual NY hard fail
