name: Earthline Mantra 37 NY Profile

on:
  push:
    branches: [pages-live]
    paths:
      - 'lab/mantra37-ny-regional-profile.mjs'
      - 'lab/mantra37-property-retire-diagnostic.mjs'
      - '.github/workflows/earthline-mantra37-ny-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Test Property presentation retirement before New York Regional
        run: node lab/mantra37-property-retire-diagnostic.mjs

# diagnostic: isolate prior Property presentation cost before NY transition
