name: Earthline Mobile Desktop Confidence 17006
on:
  push:
    branches: [pages-live]
    paths:
      - 'tests/mobile-desktop-confidence-17006.mjs'
      - '.github/workflows/earthline-mobile-desktop-confidence-17006.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  confidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/mobile-desktop-confidence-17006.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-mobile-desktop-confidence-17006
          path: artifacts/mobile-desktop-confidence-17006/
          if-no-files-found: warn
