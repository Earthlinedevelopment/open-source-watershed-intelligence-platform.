name: Earthline Iowa Regional Production Verify
on:
  push:
    branches:
      - recovery/mantra75-regional-engine
    paths:
      - tests/iowa-regional-production.mjs
      - .github/workflows/earthline-iowa-regional-production-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mantra75-regional-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.55.0
      - run: node tests/iowa-regional-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iowa-regional-production
          path: |
            iowa-regional-production.json
            iowa-regional-production.png
