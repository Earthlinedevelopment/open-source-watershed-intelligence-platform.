name: Earthline WebKit Property Click Diagnostic 17440
on:
  push:
    branches: [repair/property-one-click-clean-regional-17439]
    paths:
      - 'tests/webkit-property-click-diag-17440.mjs'
      - '.github/workflows/earthline-webkit-property-click-17440.yml'
permissions: {contents: read}
jobs:
  webkit:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: repair/property-one-click-clean-regional-17439}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: python3 tests/apply-property-target-owner-17439.py
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install webkit
      - run: |
          python3 -m http.server 8787 --bind 0.0.0.0 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: env EARTHLINE_URL='http://127.0.0.1:8787/' node tests/webkit-property-click-diag-17440.mjs
