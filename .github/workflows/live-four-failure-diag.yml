name: Earthline Live Four-State Diagnostic
'on':
  push:
    branches: [live-four-failure-diag]
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        state: [Alaska, Georgia, New Hampshire, New Jersey]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - env:
          STATE: ${{ matrix.state }}
        run: node tests/live-four-failure-diag.mjs
