name: Earthline Report Mobile Fit A-B 17083

on:
  push:
    branches:
      - stability/v1-launch-audit-17075
    paths:
      - '.github/workflows/earthline-report-mobile-fit-ab-17082.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ab:
    name: ${{ matrix.browser }}-mobile-fit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, edge]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability/v1-launch-audit-17075
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright browser
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          if [ "${{ matrix.browser }}" = "edge" ]; then
            npx playwright install --with-deps msedge
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run browser-only report mobile-fit A-B
        env:
          EARTHLINE_BROWSER: ${{ matrix.browser }}
          EARTHLINE_REPORT_FIX_AB: '1'
        run: node tests/report-cross-browser-17078.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-report-mobile-fit-ab-17083-${{ matrix.browser }}
          path: artifacts/report-cross-browser-17078/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 7
