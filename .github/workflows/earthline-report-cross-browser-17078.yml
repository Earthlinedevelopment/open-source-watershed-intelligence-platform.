name: Earthline Bioswale Report Cross-Browser Audit 17078

on:
  push:
    branches:
      - stability/v1-launch-audit-17075
    paths:
      - 'tests/report-cross-browser-17078.mjs'
      - '.github/workflows/earthline-report-cross-browser-17078.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, edge]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability/v1-launch-audit-17075
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.55.0
          if [ "${{ matrix.browser }}" = "edge" ]; then
            npx playwright install --with-deps msedge
          else
            npx playwright install --with-deps ${{ matrix.browser }}
          fi
      - name: Run isolated report audit
        env:
          EARTHLINE_BROWSER: ${{ matrix.browser }}
        run: node tests/report-cross-browser-17078.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-report-17078-${{ matrix.browser }}
          path: artifacts/report-cross-browser-17078/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 7
