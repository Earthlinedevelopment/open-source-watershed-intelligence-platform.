name: Earthline Bioswale Report Cross-Browser Audit 17078

on:
  push:
    branches:
      - stability/v1-launch-audit-17075
    paths:
      - 'tests/report-cross-browser-17078.mjs'
      - '.github/workflows/earthline-report-cross-browser-17078.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-browsers:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability/v1-launch-audit-17075
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run isolated report audit
        env:
          EARTHLINE_BROWSER: ${{ matrix.browser }}
        run: node tests/report-cross-browser-17078.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-report-17078-${{ matrix.browser }}
          path: artifacts/report-cross-browser-17078/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 7

  edge-windows:
    name: edge-windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability/v1-launch-audit-17075
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright and Edge
        shell: pwsh
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install msedge
      - name: Run isolated Edge report audit
        shell: pwsh
        env:
          EARTHLINE_BROWSER: edge
        run: node tests/report-cross-browser-17078.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthline-report-17078-edge
          path: artifacts/report-cross-browser-17078/edge/
          if-no-files-found: warn
          retention-days: 7
