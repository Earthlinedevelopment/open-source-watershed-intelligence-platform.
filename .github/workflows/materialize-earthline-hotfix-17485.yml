name: Materialize Earthline Hotfix 17486
on:
  push:
    branches: [repair/property-one-click-17441]
    paths:
      - '.github/workflows/materialize-earthline-hotfix-17485.yml'
      - 'tests/apply-property-deferred-launch-17486.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/earthline-launch-17486
          fetch-depth: 0
      - run: |
          git fetch origin repair/property-one-click-17441
          git show origin/repair/property-one-click-17441:tests/apply-property-deferred-launch-17486.py > /tmp/interaction.py
          python3 /tmp/interaction.py
      - run: |
          git config user.name "Earthline CI"
          git config user.email "info@earthlinedevelopment.org"
          git add index.html
          git commit -m "candidate: deferred one-press Property + earlier Elder 17486" || true
          git push origin HEAD:candidate/earthline-launch-17486
