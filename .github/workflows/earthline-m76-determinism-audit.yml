name: Earthline M76 Determinism Audit
on:
  push:
    branches: [recovery/mantra76-audit-restart]
    paths:
      - '.github/workflows/earthline-m76-determinism-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-live
      - name: Trace wall-clock prescription gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['deadline15771','timeBudgetReached','performance.now()>=deadline15771','maxMs','maxCandidates','maxFinal']:
              print('\n===== '+needle+' =====')
              hits=list(re.finditer(re.escape(needle),s))
              print('COUNT',len(hits))
              for m in hits[:30]:
                  i=m.start()
                  print(s[max(0,i-1400):min(len(s),i+2800)])
          PY
