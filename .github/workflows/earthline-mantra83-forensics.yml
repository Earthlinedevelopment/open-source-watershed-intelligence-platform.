name: Mantra 83 Architecture Forensics

on:
  push:
    branches: [mantra83-forensic]
    paths:
      - 'tests/mantra83-architecture-forensics.mjs'
      - '.github/workflows/earthline-mantra83-forensics.yml'
      - 'tests/mantra83-bridge-source-audit.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect shadow bridge hooks
        run: node tests/mantra83-bridge-source-audit.mjs
      - name: Compare accepted 16584 to current engine
        continue-on-error: true
        run: node tests/mantra83-architecture-forensics.mjs
