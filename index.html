<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earthline 16588 Census HTTPS Diagnostic</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#111;color:#eee}pre{white-space:pre-wrap;background:#1b1b1b;padding:16px;border-radius:8px}button{padding:10px 16px;font-size:16px}</style></head><body><h1>Earthline 16588 Census HTTPS Diagnostic</h1><p>This is not an Earthline build. It reproduces the 16588 Census areal-hydrography request from a real HTTPS origin.</p><button id="run">Run test</button><pre id="out">Ready.</pre><script>
const ENDPOINT='https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_PhysicalFeatures/MapServer/12/query';
const BOUNDS=[-79.7624,40.4774,-71.7517,45.0159];
const GRID=96;
function offset(bounds){const spans=[Math.abs(bounds[2]-bounds[0]),Math.abs(bounds[3]-bounds[1])];const steps=spans.map(v=>v/Math.max(1,GRID-1)).filter(v=>Number.isFinite(v)&&v>0);const step=steps.length?Math.min(...steps):0.01;return Math.max(0.0001,step*0.25)}
function url(){const p=new URLSearchParams({where:'1=1',geometry:BOUNDS.map(v=>Number(v).toFixed(7)).join(','),geometryType:'esriGeometryEnvelope',inSR:'4326',spatialRel:'esriSpatialRelIntersects',outSR:'4326',outFields:'OBJECTID',returnGeometry:'true',returnZ:'false',returnM:'false',maxAllowableOffset:String(Number(offset(BOUNDS).toFixed(7))),geometryPrecision:'4',resultRecordCount:'100000',f:'geojson'});return ENDPOINT+'?'+p.toString()}
async function one(timeoutMs){const ctl=new AbortController();const started=performance.now();const timer=setTimeout(()=>ctl.abort(new Error('timeout '+timeoutMs+'ms')),timeoutMs);try{const r=await fetch(url(),{method:'GET',mode:'cors',cache:'no-store',signal:ctl.signal});const text=await r.text();const elapsed=Math.round(performance.now()-started);let data=null;try{data=JSON.parse(text)}catch{}return {ok:r.ok,status:r.status,elapsedMs:elapsed,bytes:text.length,featureCount:data&&Array.isArray(data.features)?data.features.length:null,serviceError:data&&data.error?data.error:null,error:null}}catch(e){return {ok:false,status:null,elapsedMs:Math.round(performance.now()-started),bytes:0,featureCount:null,serviceError:null,error:String(e&&e.message||e)}}finally{clearTimeout(timer)}}
async function run(){const out=document.getElementById('out');out.textContent='Running exact 16588 2400 ms request...';const exact=await one(2400);let extended=null;if(!exact.ok&&exact.elapsedMs>=2300){out.textContent=JSON.stringify({protocol:location.protocol,origin:location.origin,requestURL:url(),exact2400:exact,note:'Exact request hit cap; running one 12-second diagnostic measurement.'},null,2);extended=await one(12000)}out.textContent=JSON.stringify({protocol:location.protocol,origin:location.origin,requestURL:url(),exact2400:exact,extended12000:extended},null,2)}
document.getElementById('run').onclick=run;run();
</script></body></html>
