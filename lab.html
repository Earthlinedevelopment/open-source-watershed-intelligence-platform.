<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Earthline 16598 Lab</title>
  <style>html,body,#earthline-lab-frame{width:100%;height:100%;margin:0;border:0;overflow:hidden;display:block;}</style>
</head>
<body>
  <iframe id="earthline-lab-frame" title="Earthline 16598 lab"></iframe>
  <script>
    const frame=document.getElementById('earthline-lab-frame');
    frame.addEventListener('load',()=>{
      const s=frame.contentDocument.createElement('script');
      s.src='/builds/16598/earthline-live.js?t='+Date.now();
      s.dataset.earthlineLabBuild='16598';
      frame.contentDocument.body.appendChild(s);
    },{once:true});
    frame.src='/index.html?baseline=16584&t='+Date.now();
  </script>
</body>
</html>
