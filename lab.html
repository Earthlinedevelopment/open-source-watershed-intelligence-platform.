<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Earthline Live Lab</title>
  <style>
    html,body,#earthline-lab-frame{width:100%;height:100%;margin:0;border:0;overflow:hidden;display:block;}
  </style>
</head>
<body>
  <iframe id="earthline-lab-frame" title="Earthline live test"></iframe>
  <script>
  (async function(){
    const stamp=Date.now();
    const pointer=await fetch('/lab/current.json?t='+stamp,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('current.json '+r.status);
      return r.json();
    });
    const build=String(pointer.build);
    const cssText=await fetch('/builds/'+build+'/earthline-live.css?t='+stamp,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('candidate css '+r.status);
      return r.text();
    });
    const frame=document.getElementById('earthline-lab-frame');
    frame.addEventListener('load',async function(){
      const doc=frame.contentDocument;
      const css=doc.createElement('style');
      css.id='earthline-lab-css-'+build;
      css.dataset.earthlineLabBuild=build;
      css.textContent=cssText;
      doc.head.appendChild(css);

      const jsUrl='/builds/'+build+'/earthline-live.js?t='+stamp;
      try{
        const probe=await fetch(jsUrl,{cache:'no-store'});
        if(probe.ok){
          const js=doc.createElement('script');
          js.src=jsUrl;
          js.dataset.earthlineLabBuild=build;
          doc.body.appendChild(js);
        }
      }catch(e){}
      console.info('[Earthline lab] candidate build '+build+' CSS injected directly over /index.html');
    },{once:true});
    frame.src='/index.html?earthlineLab='+stamp;
  })().catch(err=>{
    console.error('[Earthline lab] failed',err);
    document.body.textContent='Earthline lab failed to load. See console.';
  });
  </script>
</body>
</html>
