<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Earthline 16599 Launch Lab</title>
  <style>html,body,#earthline-lab-frame{width:100%;height:100%;margin:0;border:0;overflow:hidden;display:block;}</style>
</head>
<body>
  <iframe id="earthline-lab-frame" title="Earthline 16599 launch lab"></iframe>
  <script>
    const frame=document.getElementById('earthline-lab-frame');
    function inject(src,build){
      return new Promise((resolve,reject)=>{
        const s=frame.contentDocument.createElement('script');
        s.src=src+'?t='+Date.now();
        s.async=false;
        s.dataset.earthlineLabBuild=build;
        s.onload=resolve;
        s.onerror=reject;
        frame.contentDocument.body.appendChild(s);
      });
    }
    frame.addEventListener('load',async()=>{
      await inject('/builds/16598/earthline-live.js','16598-blue');
      await inject('/builds/16599/earthline-launch-safety.js','16599-water-safety');
    },{once:true});
    frame.src='/index.html?baseline=16584&t='+Date.now();
  </script>
</body>
</html>
