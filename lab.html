<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Earthline 16611 Exact Launch Lab</title>
  <style>
    html,body{width:100%;height:100%;margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;}
    #identity{box-sizing:border-box;display:flex;min-height:34px;align-items:center;gap:14px;padding:10px 12px;background:#111;border-bottom:1px solid #444;font-size:12px;}
    #state{font-weight:700;}.ok{color:#8ee89a}.bad{color:#ff8d8d}.checking{color:#ffd36a}
    #detail{padding:24px 12px;font-size:13px;line-height:1.45;}
  </style>
</head>
<body>
  <div id="identity">
    <span id="state" class="checking">VERIFYING</span>
    <span>Candidate 16611</span>
    <span>index blob 32664a8271eb7a345b50f1f69aabd7aafb328dbc</span>
    <span>no injected build scripts</span>
  </div>
  <div id="detail">Checking the deployed index before launch.</div>
  <script>
    const EXPECTED_BLOB='32664a8271eb7a345b50f1f69aabd7aafb328dbc';
    const state=document.getElementById('state');
    const detail=document.getElementById('detail');

    async function gitBlobSha1(text){
      const body=new TextEncoder().encode(text);
      const header=new TextEncoder().encode(`blob ${body.byteLength}\0`);
      const all=new Uint8Array(header.byteLength+body.byteLength);
      all.set(header,0); all.set(body,header.byteLength);
      const digest=await crypto.subtle.digest('SHA-1',all);
      return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }

    (async()=>{
      try{
        const exactToken=Date.now();
        const exactUrl='/index.html?earthlineExact16611='+exactToken;
        const res=await fetch(exactUrl,{cache:'no-store'});
        if(!res.ok) throw new Error(`index fetch ${res.status}`);
        const html=await res.text();
        const actual=await gitBlobSha1(html);
        if(actual!==EXPECTED_BLOB){
          state.textContent='BLOCKED — BUILD MISMATCH';
          state.className='bad';
          detail.textContent=`Expected ${EXPECTED_BLOB}; received ${actual}. The lab will not run a mixed or stale build.`;
          return;
        }
        state.textContent='VERIFIED EXACT';
        state.className='ok';
        detail.textContent='Verified. Opening the exact deployed build in the normal top-level runtime.';
        sessionStorage.setItem('EARTHLINE_EXACT_LAB_16611','verified:'+EXPECTED_BLOB+':'+exactToken);
        window.location.replace(exactUrl+'&earthlineVerifiedLab16611=1');
      }catch(err){
        state.textContent='BLOCKED — VERIFY ERROR';
        state.className='bad';
        detail.textContent=String(err);
      }
    })();
  </script>
</body>
</html>
