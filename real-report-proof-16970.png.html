  const naip=conus?'https://apps.geo.fpac.usda.gov/geo-imagery/rest/services/naip/conus_naip/ImageServer/exportImage?bbox='+encodeURIComponent(bbox)+'&bboxSR=4326&imageSR=4326&size='+imgSize+'&format=jpgpng&f=image':'';

  const lonSpan=Math.max(.0001,b[2]-b[0]),midLat=(b[1]+b[3])/2,kmWide=lonSpan*111.32*Math.cos(midLat*Math.PI/180);
  const niceKm=kmWide>300?100:kmWide>120?50:kmWide>50?20:kmWide>20?10:kmWide>8?5:kmWide>3?2:kmWide>1?1:.5;
  const barPx=Math.max(54,Math.min(170,niceKm/kmWide*mapW));
  const clipId='elClip16969',aqPat='elAq16969',parts=[];

  parts.push('<svg class="el-report-real-site-render-16970" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Earthline real-site landscape water plan">');
  parts.push('<defs>'+
    '<linearGradient id="elGround16969" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7eadf"/><stop offset="1" stop-color="#cfd9ca"/></linearGradient>'+
    '<pattern id="'+aqPat+'" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(31)"><rect width="13" height="13" fill="#e9903c" fill-opacity=".22"/><path d="M0 0 V13" stroke="#bd601d" stroke-width=".8" stroke-opacity=".30"/></pattern>'+
    '<clipPath id="'+clipId+'"><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="5"/></clipPath>'+
    '<marker id="elArrow16969" markerWidth="5.5" markerHeight="5.5" refX="4.7" refY="2.75" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L5.5 2.75 L0 5.5 Z" fill="#0d6e9c" opacity=".9"/></marker>'+
    '</defs>');

  parts.push('<rect width="'+W+'" height="'+H+'" fill="#f2eee5"/><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="5" fill="url(#elGround16969)" stroke="#7c8d82" stroke-width="1"/>');
  parts.push('<g clip-path="url(#'+clipId+')">');
  if(conus){
    parts.push('<image href="'+esc(naip)+'" x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" preserveAspectRatio="none"/>');

  } else {

  /* Aquifer stays a spatial orange field. */

  let fi=0;

    parts.push('<path d="'+dp+'" fill="none" stroke="#0d6e9c" stroke-width="1.7" opacity=".93" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"'+(fi++%2===0?' marker-end="url(#elArrow16969)"':'')+'/>');
  }

  /* Earthline swales retain their actual frozen geometry; style only changes. */
  const draw=r=>{const dp=path(r.f);if(!dp)return;
    if(r.grade==='C'){parts.push('<path d="'+dp+'" fill="none" stroke="#7d745f" stroke-width=".8" opacity=".28" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');return}

      parts.push('<path d="'+dp+'" fill="none" stroke="#496d4b" stroke-width="1.05" opacity=".88" stroke-linecap="round" vector-effect="non-scaling-stroke"/>');return}
    parts.push('<path d="'+dp+'" fill="none" stroke="#fff" stroke-width="15" opacity=".92" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');
    parts.push('<path d="'+dp+'" fill="none" stroke="#8dbd82" stroke-width="10.5" opacity=".82" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>');

  };
  for(const r of rows.filter(r=>r.grade==='C'))draw(r);

    parts.push('<g><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="10" fill="#fffdf7" fill-opacity=".95" stroke="#45654d" stroke-width=".8"/><text x="'+x.toFixed(1)+'" y="'+(y+2.3).toFixed(1)+'" text-anchor="middle" fill="#24432f" font-family="Noto Sans,Arial,sans-serif" font-size="6.8" font-weight="850">A'+(++ai)+'</text></g>');
  }
  parts.push('</g>');

  /* Minimal planning-board furniture. */
  parts.push('<g transform="translate('+(mapX+18)+','+(mapY+mapH-20)+')"><path d="M0 0 H'+barPx+'" stroke="#263d34" stroke-width="1.5"/><path d="M0 -4 V4 M'+barPx+' -4 V4" stroke="#263d34" stroke-width=".9"/><text x="'+(barPx/2)+'" y="13" text-anchor="middle" fill="#31473d" font-family="Noto Sans,Arial,sans-serif" font-size="6.5" font-weight="800">'+niceKm+' km</text></g>');
  parts.push('<g transform="translate('+(mapX+mapW-49)+','+(mapY+20)+')"><circle cx="12" cy="13" r="20" fill="#fffdf7" fill-opacity=".91" stroke="#8d9b91" stroke-width=".8"/><text x="12" y="-1" text-anchor="middle" fill="#203a31" font-family="Noto Sans,Arial,sans-serif" font-size="7.5" font-weight="850">N</text><path d="M12 4 V30" stroke="#203a31" stroke-width="1"/><path d="M12 4 L6 16 L12 12 L18 16 Z" fill="#203a31"/></g>');

  if(!small){
    const lx=mapX+18,ly=mapY+18;
    parts.push('<g transform="translate('+lx+','+ly+')"><rect width="250" height="112" rx="5" fill="#fffef9" fill-opacity=".92" stroke="#aeb8b0" stroke-width=".7"/><text x="15" y="21" fill="#203a33" font-family="Noto Sans,Arial,sans-serif" font-size="8.2" font-weight="850" letter-spacing=".8">REAL-SITE WATER PLAN</text><path d="M15 30 H235" stroke="#55bde0" stroke-width="1.4"/><rect x="15" y="43" width="23" height="10" rx="1" fill="url(#'+aqPat+')" stroke="#b55b1b" stroke-width=".7"/><text x="47" y="51" fill="#42564d" font-family="Noto Sans,Arial,sans-serif" font-size="6.3">Mapped aquifer context</text><path d="M15 69 H39" stroke="#0d6e9c" stroke-width="1.7"/><text x="47" y="72" fill="#42564d" font-family="Noto Sans,Arial,sans-serif" font-size="6.3">Principal water path</text><path d="M132 48 H160" stroke="#8dbd82" stroke-width="10" opacity=".88" stroke-linecap="round"/><path d="M132 48 H160" stroke="#224d31" stroke-width="1.5"/><text x="169" y="51" fill="#42564d" font-family="Noto Sans,Arial,sans-serif" font-size="6.3">A · priority bioswale</text><path d="M132 70 H160" stroke="#b7caa8" stroke-width="5" opacity=".8" stroke-linecap="round"/><path d="M132 70 H160" stroke="#496d4b" stroke-width="1"/><text x="169" y="73" fill="#42564d" font-family="Noto Sans,Arial,sans-serif" font-size="6.3">B · strong opportunity</text><text x="15" y="94" fill="#68776f" font-family="Noto Sans,Arial,sans-serif" font-size="5.3">'+(conus?'Aerial: USDA NAIP · Terrain: Earthline frozen run':'Terrain-only fallback outside NAIP coverage')+'</text><text x="15" y="104" fill="#68776f" font-family="Noto Sans,Arial,sans-serif" font-size="5.3">Earthline overlays use frozen published run geometry</text></g>');
  }
  parts.push('</svg>');
  return parts.join('');
}
