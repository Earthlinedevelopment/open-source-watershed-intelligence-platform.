<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earthline Operations</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f3;color:#172018}.wrap{max-width:1200px;margin:auto;padding:24px}.muted{color:#607064}.panel{background:#fff;border:1px solid #d8e0d7;border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{background:#fbfcfa;border:1px solid #dce5dc;border-radius:10px;padding:12px}.card b{display:block;font-size:1.5rem;margin-top:4px}button,select{font:inherit;padding:9px 11px;border:1px solid #aeb9ae;border-radius:8px;background:#fff}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #e4e8e3;font-size:.92rem}.bad{color:#9a2b20}</style></head><body><main class="wrap"><h1>Earthline Operations</h1><div class="muted">First-party usage, reliability, performance and cost-control telemetry. Raw addresses and exact GPS are not collected.</div><div class="panel"><select id="hours"><option value="24">Last 24 hours</option><option value="168">Last 7 days</option><option value="720">Last 30 days</option></select> <button id="refresh">Refresh</button> <span id="status" class="muted"></span></div><div id="cards" class="grid"></div><div class="panel"><h2>Events</h2><table id="events"></table></div><div class="panel"><h2>Top jurisdictions</h2><table id="jurisdictions"></table></div><div class="panel"><h2>Errors</h2><table id="errors"></table></div><div class="panel"><h2>Core Web Vitals</h2><table id="vitals"></table></div></main><script>(()=>{'use strict';const CFG='earthline-backend-16873.json',SESSION='earthline-supabase-session-16873';let cfg=null;const $=id=>document.getElementById(id);const put=(n,v)=>n.textContent=v==null?'—':String(v);function table(el,heads,rows){el.textContent='';const h=document.createElement('tr');heads.forEach(x=>{const th=document.createElement('th');put(th,x);h.appendChild(th)});el.appendChild(h);rows.forEach(row=>{const tr=document.createElement('tr');row.forEach(v=>{const td=document.createElement('td');put(td,v);tr.appendChild(td)});el.appendChild(tr)})}function token(){try{return JSON.parse(sessionStorage.getItem(SESSION)||'null')?.access_token||''}catch{return''}}async function config(){if(cfg)return cfg;const r=await fetch(CFG+'?v=16874',{cache:'no-store'});if(!r.ok)throw Error('Backend config unavailable');cfg=await r.json();if(!cfg?.metricsFunctionUrl)throw Error('Metrics endpoint is not configured yet');return cfg}function card(label,value){const d=document.createElement('div');d.className='card';const s=document.createElement('span');put(s,label);const b=document.createElement('b');put(b,value);d.append(s,b);return d}async function refresh(){try{$('status').className='muted';$('status').textContent=' Loading…';const c=await config(),t=token();if(!t)throw Error('Sign in to Earthline first, then open this page in the same browser session.');const r=await fetch(c.metricsFunctionUrl+'?hours='+encodeURIComponent($('hours').value),{headers:{Authorization:'Bearer '+t},cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Metrics request failed');const m=d.metrics||{},s=m.summary||{},searchN=d.search?.today?.request_count||0,searchCap=d.search?.config?.global_daily_cap||0,telN=d.telemetry?.today?.event_count||0,telCap=d.telemetry?.config?.global_daily_event_cap||0;$('cards').textContent='';[['Sessions',s.sessions],['Page views',s.page_views],['Searches',s.searches],['Search failures',s.search_failures],['Analysis starts',s.analysis_starts],['Analysis successes',s.analysis_successes],['Analysis failures',s.analysis_failures],['Client errors',s.client_errors],['Report opens',s.report_opens],['DATA opens',s.data_opens],['Donate clicks',s.donate_clicks],['Merch clicks',s.merch_clicks],['Analysis p50 ms',Math.round(s.analysis_p50_ms||0)],['Analysis p95 ms',Math.round(s.analysis_p95_ms||0)],['Search today',searchN+'/'+searchCap],['Telemetry today',telN+'/'+telCap]].forEach(x=>$('cards').appendChild(card(x[0],x[1])));table($('events'),['Event','Count'],Object.entries(m.eventsByName||{}).sort((a,b)=>b[1]-a[1]));table($('jurisdictions'),['Jurisdiction','Events'],(m.topJurisdictions||[]).map(x=>[x.name,x.events]));table($('errors'),['Error','Events'],(m.topErrors||[]).map(x=>[x.error,x.events]));table($('vitals'),['Metric','Samples','Average','p75'],(m.webVitals||[]).map(x=>[x.metric,x.samples,Number(x.average||0).toFixed(1),Number(x.p75||0).toFixed(1)]));$('status').textContent=' Updated '+new Date().toLocaleTimeString()}catch(e){$('status').className='bad';$('status').textContent=' '+(e.message||e)}}$('refresh').addEventListener('click',refresh);$('hours').addEventListener('change',refresh);refresh()})();</script></body></html>
